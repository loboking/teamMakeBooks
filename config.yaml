# 팀·역할별 모델 선택
# 형식: "<provider>:<model_name>"

teams:
  writer:
    model: "ollama:gemma4:e2b"
  reviewer:
    direction:
      model: "ollama:gemma4:e2b"
    character:
      model: "ollama:gemma4:e2b"
    quality:
      model: "ollama:gemma4:e2b"
    repetition:
      model: "ollama:gemma4:e2b"
  publisher:
    model: "ollama:gemma4:e2b"
  meta_writer:
    concept:
      model: "ollama:gemma4:e2b"
    ending:
      model: "ollama:gemma4:e2b"
    plot_skeleton:
      model: "ollama:gemma4:e2b"
  meta_reviewer:
    ending_lock:
      model: "ollama:gemma4:e2b"
    outline_consistency:
      model: "ollama:gemma4:e2b"

pipeline:
  max_retries: 3
  recent_summaries_n: 3

writer:
  beat_temperature: 0.85
  beat_num_predict: 6000

reviewer:
  temperature: 0.2
  num_predict: 600

publisher:
  temperature: 0.4
  num_predict: 600

meta_writer:
  concept_temperature: 0.4
  concept_num_predict: 800
  ending_temperature: 0.6
  ending_num_predict: 1200
  plot_skeleton_temperature: 0.7
  plot_skeleton_num_predict: 16000

meta_reviewer:
  temperature: 0.2
  num_predict: 800
