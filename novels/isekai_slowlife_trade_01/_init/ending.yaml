summary: 현실 먼치킨 남매가 이계에서 무역과 성장을 반복하며 현실과 이계의 경계를 완전히 허무는 이야기.
act3_climax: 양쪽 세계의 법칙을 초월하는 무역과 각성을 통해 현실의 모든 제약을 파괴하는 최종 승화.
acts:
- name: 1막
  range:
  - 1
  - 75
  summary: 허다연과 허다희 남매가 이계에서 슬로우 라이프를 즐기며 이계와 현실의 물건을 양방향으로 거래하고 이계 먼치킨으로 각성하며 관계가
    형성된다.
  climax: 남매의 독특한 무역과 각성이 현실 세계의 경계를 흔들기 시작한다.
- name: 2막
  range:
  - 76
  - 150
  summary: 이계의 거대 길드와 현실의 권력들이 남매의 무역에 주목하며 압박하고 대립하며 이계의 먼치킨으로 각성하는 과정이 확장된다.
  climax: 현실과 이계의 권력들이 남매의 존재를 인정하고 통제하려 최종적인 대립이 시작된다.
- name: 3막
  range:
  - 151
  - 225
  summary: 이계의 법칙을 초월하는 힘을 통해 현실과 이계의 경계를 완전히 무너뜨리고 모든 존재의 운명을 재편하며 최종적인 승화와 새로운 질서가
    확립된다.
  climax: 남매는 이계의 법칙을 초월하여 현실과 이계의 경계를 완전히 무너뜨리는 궁극적인 무역가로 각성한다.
