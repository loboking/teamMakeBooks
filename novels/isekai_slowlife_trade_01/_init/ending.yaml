summary: 현실과 이계의 물건을 교환하며 각성한 차하린이 이계의 질서를 재편하고 현실을 초월하는 존재로 거듭난다.
act3_climax: 차하린이 이계의 근원적 질서를 파괴하고 현실의 경계를 무너뜨리는 최종 각성 순간.
acts:
- name: 1막
  range:
  - 1
  - 75
  summary: 현실과 이계의 연결고리를 탐색하며 이계의 물건을 거래하고 각성하는 과정. 이계의 관계와 현실의 균열이 시작된다.
  climax: 이계의 거래를 통해 현실의 법칙에 균열이 발생하며 차하린의 잠재력이 폭발한다.
- name: 2막
  range:
  - 76
  - 150
  summary: 이계의 거대 세력과의 대립 속에서 차하린은 힘을 확장하고 현실 세계에 영향을 미치기 시작한다. 이계의 질서가 흔들리고 새로운 갈등이
    발생한다.
  climax: 이계의 거대 세력과의 대립 끝에 차하린이 현실 세계의 절대적인 힘을 획득하며 패권을 장악한다.
- name: 3막
  range:
  - 151
  - 225
  summary: 이계의 근원적 진실을 파헤치고 현실과 이계의 경계를 완전히 허물며 최종적인 승화를 이룬다. 차하린은 새로운 존재로서 모든 것을
    재정의한다.
  climax: 차하린이 이계의 근원적 진실을 파악하고 현실과 이계의 경계를 초월하여 새로운 차원의 존재로 각성한다.
