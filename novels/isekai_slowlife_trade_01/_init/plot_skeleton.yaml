- chapter_n: 1
  act: 1
  overall: 현실의 찌꺼기처럼 느껴지는 현실에서, 허다연과 허다희 남매는 이계의 고요함 속에서 기묘한 무역을 시작했다. 이계의 정령들이 현실의
    물건을 인식하는 방식이 뒤틀린 이상, 그들은 현실의 낡은 시계와 이계의 마나를 교환하는 실험을 시작했다. 다연은 현실의 시계를 이계의 마나로
    바꾸는 데 성공했지만, 그 대가로 이계의 먼치킨 존재가 잠시 각성하는 위험을 감지했다. 다희는 그 과정에서 이계의 고대 길드 중 하나와 접촉하며,
    현실과 이계의 경계에 존재하는 숨겨진 무역로의 존재를 알게 된다. 이 작은 교환이 단순한 실험이 아닌, 거대한 이계의 질서를 흔들 준비를 마쳤음을
    암시하며 긴장감을 높인다.
- chapter_n: 2
  act: 1
  overall: 현실의 시계와 이계의 마나를 교환하는 실험은 예상보다 더 큰 파장을 일으켰다. 다연이 성공적으로 현실의 시계를 이계의 마나로 변환했을
    때, 잠시 각성한 이계의 존재는 낯선 충격에 휩싸였다. 그들은 단순히 물건을 교환하는 것을 넘어, 존재의 근원을 뒤섞는 위험한 경계를 넘나들고
    있음을 깨달았다. 다희는 이 상황이 통제 불능의 영역으로 치닫고 있음을 직감하고 긴장했다. 그들이 쌓아 올린 미묘한 무역의 균형이 무너지기
    직전, 이계의 정령들이 현실의 물질에 대해 더 강렬한 반응을 보이기 시작했다. 다음 거래는 이전과는 완전히 다른 결과를 초래할 것이라는 불길한
    예감이 감돌았다.
- chapter_n: 3
  act: 1
  overall: 다희가 통제 불능의 영역으로 치닫고 있음을 직감한 후, 현실의 물건과 이계의 마나 교환 실험을 잠시 중단했다. 다희는 실험의 위험성을
    인지하고, 단순히 물질을 교환하는 것을 넘어 존재의 근원을 뒤섞는 행위가 초래하는 파장을 경계했다. 다연은 이계의 각성된 존재가 겪는 혼란을
    관찰하며, 그들이 겪는 비이성적인 반응에 더 깊은 의문을 품기 시작했다. 그들은 자신들이 단순한 무역가가 아니라, 현실과 이계의 경계에 존재하는
    미지의 힘을 조작하고 있음을 깨달았다. 다음 실험은 더더욱 위험할 것이라는 불안감이 고조되었다.
- chapter_n: 4
