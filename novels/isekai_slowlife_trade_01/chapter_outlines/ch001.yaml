chapter_n: 1
overall: '도시의 소음과 익숙한 삶을 뒤로한 채, 눈을 뜬 곳은 낯설지만 햇살이 가득한 평화로운 시골 마을이었다. 회귀나 위대한 운명 같은
  판타지적 요소 대신, 차하린은 그저 평범한 일상에 몸을 맡기기로 결심한다.


  첫날의 목표는 생존이 아닌 ‘느림’ 그 자체. 근처 작은 시장에서 빵'
beats:
- name: intro
  instruction: '이 부분은 회차 시작. 분량 1,800자 이상.

    - 주인공의 자조적 독백으로 시작: 현재의 상황(이계의 시골)에 대한 무심한 인식과 ''느림''을 선택한 이유를 건조하게 풀어낸다.

    - 핵심 공간 묘사: 낯선 이계의 시골 마을의 아침 풍경. (시각: 햇살, 초록빛, 흙먼지. 후각: 빵 굽는 냄새, 풀냄새. 청각: 새소리,
    낮은 사람들의 대화 소리).

    - 첫 액션: 마을의 작은 빵집 ''달빛 식빵''에서 아침 식사 재료를 구매하는 일상적인 행동을 묘사한다. (빵, 우유, 간단한 식재료).

    - 등장 인물: 빵집 주인 (호칭: ''사장님'' 또는 ''어르신''). 인물 소개 없이, 그저 일상적인 상호작용으로만 등장시킨다.

    - 짧은 대사: 사장님과의 대화는 지극히 평범하고 무미건조해야 한다. (예: "오늘 아침은 이걸로 할게요.")

    - 마지막 줄: 주변의 평화로운 일상 속에서, 하린의 감각이 아주 미세한 ''불일치''나 ''이질감''을 포착하며 다음 비트로 넘어갈 미세한
    위기 신호를 던진다.'
- name: development
  instruction: '이 부분은 회차 중반. 분량 1,800자 이상.

    - 핵심 사건 발생: 빵집에서 구매한 재료를 들고, 마을을 천천히 거닐며 ''느림''의 시간을 확보하려는 과정 자체를 묘사한다. (동작 단위:
    걷기, 관찰하기, 사색하기).

    - 환경적 단서 발견: 평범한 마을의 구석진 곳에서, 현실 세계와는 어울리지 않는 ''이계적'' 물건이나 패턴(예: 기묘한 문양의 돌, 반짝이는
    이질적인 광물)을 발견하고, 이를 무심하게 지나치는 모습을 묘사한다.

    - 감각적 충돌: 하린이 그 물건을 만지거나 관찰할 때, 일상적인 감각(촉각/시각)을 통해 아주 짧고 불쾌한 ''잡음''이나 ''진동''을
    느끼고 순간적으로 멈칫한다. (이것이 이계의 힘이 현실에 간섭하는 신호일 수 있다).

    - 내적 독백: 이질적인 물건에 대한 반응을 ''위협''으로 인식하기보다, ''흥미로운 관찰 대상'' 또는 ''거래 가치''로 분류하며 건조하게
    생각한다. (성장/각성 대신, 경제적 가치에 초점을 맞춘다.)

    - 마지막 줄: 하린이 발견한 이질적인 물건에 대한 정보를 무의식적으로 ''기록''하거나 ''인식''하려 할 때, 주변 환경이 순간적으로 흐릿해지거나,
    아주 작은 ''시스템적 오류'' 같은 시각적 왜곡이 발생하며 다음 비트로 넘어갈 강한 후크를 만든다.'
- name: climax
  instruction: '이 부분은 회차 마지막. 분량 1,800자 이상.

    - 결정적 장면: 하린이 발견한 이질적인 물건(광물/유물)을 가지고, 그 ''거래 가치''를 확인하거나 ''정보''를 얻기 위해 의도적으로
    그 물건을 집중 관찰한다. 이 과정에서 이계의 숨겨진 시스템이나 법칙의 존재를 암시한다.

    - 감정적/지적 정점: ''느림''을 선택했던 평온한 일상이, 사실은 자신을 둘러싼 ''거래 시스템''의 일부였음을 깨닫는 순간의 지적 충격.
    (놀라움보다 ''아, 그렇구나'' 하는 건조한 깨달음.)

    - 시스템 연출: 하린의 내면에서, 이계의 물건의 특성이나 가치에 대한 정보가 마치 ''시스템 창''처럼 무심하게, 하지만 명확하게 떠오르는
    연출을 사용한다. (직관적/건조한 정보 습득.)

    - 행동: 하린은 이 정보를 이용해, 자신이 발견한 물건을 ''활용''하거나 ''거래''할 수 있다는 가능성을 시험적으로 확인한다. (즉,
    이계의 물건이 단순한 유물이 아님을 증명하는 작은 행동.)

    - 마지막 문장: 마을의 평화가 깨지는 직전, 하린의 눈빛이 변한다. 그녀는 주변의 ''질서''를 인식하고, 그것이 자신에게 ''자원''이나
    ''거래 대상''이 될 수 있음을 깨닫는다. 그녀가 이계의 법칙을 통제할 수 있는 ''잠재력''을 깨닫는 순간, 다음 회차의 대규모 거래나
    사건을 예고하는 강렬한 클리프행어로 마무리한다.'
