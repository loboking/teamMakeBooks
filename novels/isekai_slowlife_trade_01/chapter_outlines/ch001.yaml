chapter_n: 1
overall: 현실과 이계의 경계는 늘 미묘하게 흔들리고 있었다. 고등학교 3학년 차하린은 지루한 일상 속에서 이계의 물건들을 교환하는 행위를 통해
  그 균열을 탐색하기 시작했다. 평소처럼 이계의 먼지 쌓인 상점에서 희귀한 물건을 거래하던 중, 그는 현실 세계의 물건과 이계의 물건이 물리적으로
  교환될 수 있다는 기묘한 현상을 발견했다. 처음에는 단순한 우연이라 생각했지만, 그 거래가 현실에 미치는 영향은 예상보다 훨씬 거대했다. 그날
  밤, 차하린은 이계에서 얻은 힘으로 현실 세계의 미세한 법칙을 조작하는 듯한 묘한 감각을 느꼈다. 그는 자신이 단순한 관찰자가 아니라, 현실과
  이계를 잇는 매개체임을 직감했다. 다음 거래를 위해 그는 더욱 깊은 이계로 발을 내디딜 준비를 했다.
beats:
- name: intro
  instruction: "이 부분은 회차 시작. 분량 1,800자 이상.\n- 주인공의 자조/일상 톤 1줄로 시작하며 지루한 일상을 묘사한다.\n\
    - 핵심 공간 묘사: 현실 세계의 고등학교 교실과 이계의 상점의 대비를 시각적, 후각 묘사를 통해 대비시킨다.\n- 첫 사건: 차하린이 이계의\
    \ 물건을 거래하는 행위의 기묘함을 묘사한다. 단순한 거래가 아닌, 현실과 이계 사이의 미세한 균열을 발견하는 과정에 집중한다.\n- 등장\
    \ 인물 + 첫 호명: 차하린 (주인공)과 이계 상점의 존재 (호칭 생략)\n- 시각·후각·청각·촉각 묘사 포인트: 현실의 차가운 공기와 이계의\
    \ 눅진한 먼지 냄새의 대비, 손끝의 미세한 떨림, 거래 시 발생하는 에너지의 미세한 진동 묘사.\n- 대사 1~3개 (톤: 건조하고 건조한\
    \ 관찰자적 톤): \"또 이딴 거래를 하고 있군.\", \"별 의미는 없지.\", \"그냥… 맞바꾸는 것뿐.\" \n- 마지막 줄: 다음\
    \ 비트로 넘기는 미세한 위기 신호. 거래가 현실에 미치는 영향에 대한 직감."
- name: development
  instruction: "이 부분은 회차 중반. 분량 1,800자 이상.\n- 핵심 사건 발생: 현실과 이계의 물건이 물리적으로 교환될 수 있다는\
    \ 현상을 심화하여 묘사한다. 차하린이 이계의 힘으로 현실 세계의 미세한 법칙을 조작하는 듯한 감각을 느끼는 과정을 상세히 묘사한다.\n-\
    \ 신체 감각: 거래 과정에서 발생하는 미세한 통증이나 이상 감각을 구체적으로 묘사한다.\n- 내적 독백: 자신이 단순한 관찰자가 아니라,\
    \ 현실과 이계를 잇는 매개체임을 깨닫는 내적 갈등을 건조하게 표현한다.\n- 새 정보 발견: 이계의 힘이 현실 세계의 법칙에 영향을 미친다는\
    \ 구체적인 증거를 발견하는 과정.\n- 시각·후각·청각·촉각 묘사 포인트: 현실 공간이 왜곡되는 시각적 효과, 이계의 에너지가 피부를 통해\
    \ 전달되는 촉각 묘사, 주변 소리의 왜곡, 미세한 진동에 대한 집중 묘사.\n- 대사 1~3개 (톤: 건조하고 분석적인 톤): \"이건 단순한\
    \ 우연이 아니야.\", \"균열이 생기고 있어.\", \"어떻게든 조작해야 해.\" \n- 마지막 줄: 다음 비트로 넘기는 강한 후크. 다음\
    \ 거래를 위한 준비의 절박함."
- name: climax
  instruction: '이 부분은 회차 마지막. 분량 1,800자 이상.

    - 결정적 장면: 차하린이 이계의 힘을 이용해 현실 세계의 미세한 법칙을 조작하는 순간을 극적으로 연출한다. 이계의 거래가 현실의 법칙에 균열을
    일으키는 과정을 시각적으로 강조한다.

    - 감정 정점: 자신이 단순한 관찰자가 아니라, 현실과 이계의 매개체라는 자각에서 오는 냉소적이고 차분한 충격. 이계의 힘을 통제하려는 의지의
    순간.

    - 최종 각성 묘사: 현실과 이계의 경계가 무너지는 순간, 차하린이 이계의 근원적 질서를 재편하고 현실을 초월하는 존재로 거듭나는 순간을 차분하고
    건조하게 묘사한다.

    - 마지막 문장: 다음 화로 넘기는 강한 후크/클리프행어. 현실의 법칙이 완전히 재정의되는 순간에 대한 여운을 남긴다.'
