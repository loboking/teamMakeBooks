chapter_n: 1
overall: 현실의 찌꺼기처럼 느껴지는 현실에서, 허다연과 허다희 남매는 이계의 고요함 속에서 기묘한 무역을 시작했다. 이계의 정령들이 현실의
  물건을 인식하는 방식이 뒤틀린 이상, 그들은 현실의 낡은 시계와 이계의 마나를 교환하는 실험을 시작했다. 다연은 현실의 시계를 이계의 마나로 바꾸는
  데 성공했지만, 그 대가로 이계의 먼치킨 존재가 잠시 각성하는 위험을 감지했다. 다희는 그 과정에서 이계의 고대 길드 중 하나와 접촉하며, 현실과
  이계의 경계에 존재하는 숨겨진 무역로의 존재를 알게 된다. 이 작은 교환이 단순한 실험이 아닌, 거대한 이계의 질서를 흔들 준비를 마쳤음을 암시하며
  긴장감을 높인다.
beats:
- name: intro
  instruction: '이 부분은 회차 시작. 분량 1,800자 이상.

    - 현실의 찌꺼기처럼 느껴지는 현실에서, 허다연과 허다희 남매의 고요한 일상과 그들의 기묘한 심리 상태를 자조적이고 건조하게 묘사하며 시작한다.

    - 핵심 공간 묘사: 현실의 낡은 방과 이계의 마나의 대비를 시각적, 촉각적으로 대비시킨다. 현실의 시계와 이계의 마나를 교환하려는 실험의
    동기를 건조하게 제시한다.

    - 등장 인물: 허다연, 허다희

    -시각/청각 묘사: 이계의 고요함과 현실의 소음의 대비를 극명하게 표현한다.

    -대사: 감정 없는 담담한 대화 톤을 유지한다. (예: "이건 그냥 실험일 뿐이야.")

    -마지막 줄: 현실의 시계가 이계의 마나로 변하는 과정에서 이계의 먼치킨 존재가 잠시 각성하는 위험을 감지하는 미세한 경고 신호를 남긴다.'
- name: development
  instruction: '이 부분은 회차 중반. 분량 1,800자 이상.

    - 핵심 사건 발생: 허다연이 현실의 시계를 이계의 마나로 바꾸는 실험을 시도하고, 그 과정에서 이계의 먼치킨 존재가 각성하는 현상을 묘사한다.

    -신체 감각: 마나의 흐름이 몸을 관통하는 통증과 찌릿한 감각을 구체적으로 묘사한다.

    -내적 독백: 실험의 위험성을 인지하며, 이계의 법칙이 현실에 침범하는 것에 대한 냉정한 분석을 담는다.

    -새 정보 발견: 허다희가 이계의 고대 길드 중 하나와 접촉하며, 현실과 이계의 경계에 숨겨진 무역로의 존재를 알게 되는 과정을 서술한다.

    -마지막 줄: 작은 교환이 단순한 실험이 아닌, 거대한 이계의 질서를 흔들 준비를 마쳤음을 암시하며 긴장감을 고조시킨다.'
- name: climax
  instruction: '이 부분은 회차 마지막. 분량 1,800자 이상.

    - 결정적 장면: 허다연과 허다희의 무역과 각성이 동시에 발생하는 결정적 순간을 극적으로 연출한다.

    -감정 정점: 실험의 성공과 그 위험을 동시에 인지하는 냉정함과 기묘한 흥분이 교차하는 감정을 최고조로 끌어올린다.

    -최종 장면: 현실과 이계의 경계를 넘나드는 독특한 무역 행위가 현실 세계의 경계를 흔들기 시작하는 장면을 강렬하게 제시한다.

    -마지막 문장: 이 작은 교환이 단순한 실험이 아닌, 거대한 이계의 질서를 흔들 준비를 마쳤음을 강렬한 클리프행어로 마무리하며 다음 화로 넘어간다.'
