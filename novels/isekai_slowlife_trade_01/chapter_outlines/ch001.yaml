chapter_n: 1
overall: |
  고3 차하린이 학교 점심시간에 옛 도서관 안쪽 헌책 서가 사이에서 공기가 일렁이는 벽을 발견한다.
  학교 동급생 한도영이 다가오자 일렁임이 사라지고, 한도영이 떠난 뒤 다시 일렁임이 돌아온다.
  이튿날 정오, 차하린은 다시 도서관에 가서 망설임 끝에 손을 내밀어 처음으로 포탈을 통과한다.
  포탈 너머는 호숫가의 작은 마을. 약초 가게의 마린이 차하린을 호기심으로 맞이하고,
  차하린이 가져온 볼펜 한 자루와 사탕 두 개로 약초 다발과 작은 빛나는 돌(마린이 "문紋"이라 부름)을 받는다.
  마린이 "여기 하루가 그쪽 한 시간이야"라며 시간차를 알려주고, 차하린은 빠르게 계산하고 무심한 표정 그대로 끄덕인다.
  포탈로 돌아오니 학교 점심시간은 아직 끝나지 않았고, 가방 속 약초 다발의 풀냄새가 진짜다.
  마지막 후크: 빛나는 돌을 가방 깊숙이 넣고 도서관을 나선다 — 다음 날 같은 시간으로 마무리.

beats:
  - name: intro
    instruction: |
      이 부분은 1화 전반부 — **첫째 날 점심시간의 일렁임 발견부터, 그 발견이 끝나는 시점까지만**. 분량 1,800자 이상.

      ⚠️ 이 비트의 시간/사건 경계 (엄수):
      - 시작: 평범한 고3의 점심시간 풍경(시계 초침·교실 소음·창밖 빛 한 가지). 자조 톤 약하게.
      - 학교 풍경: 같은 반 떠들썩함, **한도영**이 친구들과 매점 가는 소리(한도영=차하린의 같은 반 동급생, 18세 남), 차하린은 혼자 도서관으로 향함.
      - 도서관 안쪽 묘사: 오래된 책 냄새, 노란 형광등, 사람 없는 정적. 헌책 서가 사이의 좁은 통로 끝 막힌 벽 앞에 도착.
      - 미세한 이상 — 시야 주변 공기가 일렁인다. 처음엔 눈의 착각이라 생각하고 책 한 권을 뽑아 다시 본다. 일렁임이 더 또렷해짐.
      - 손을 가까이 가져가는 순간 — 발소리. **한도영**이 "차하린, 여기서 뭐 해?" 하며 다가옴.
      - 한도영이 가까워지자 일렁임 사라짐. 차하린은 책을 읽는 척 자연스럽게 둘러댐. 한도영은 의아한 표정으로 떠남.
      - 한도영의 발소리가 멀어지자, 다시 일렁임이 돌아온다. 차하린은 잠시 그 움직임을 관찰.
      - **이 비트의 마지막 줄**: 점심 종이 울린다. 차하린은 일렁임에 손을 대지 못한 채 도서관을 나선다.

      ❌ 이 비트에서 다루지 말 것 (climax 비트가 담당):
      - 다음 날 / 둘째 날 / 이튿날 (시간 점프 절대 금지)
      - 포탈 통과
      - 이계 마을·풍경
      - 마린, 도원 영감
      - 거래·문(紋)·시간차 설명·귀환

      ⚠️ 인물 구분 (혼동 절대 금지):
      - **한도영** = 학교 동급생, 18세 남, 현실에서만 등장. 차하린에게 "차하린"이라 부름.
      - **도원 영감** ≠ 한도영. 도원 영감은 이계 노인이며 이 회차에 등장 X.

  - name: climax
    instruction: |
      이 부분은 1화 후반부 — **둘째 날 정오의 첫 통과부터 학교 귀환 + 다음 날 후크까지**. 분량 2,200자 이상.

      ⚠️ 이 비트의 시간/사건 경계 (엄수):
      - 시작: "다음 날 정오." 짧은 시간 점프 한 줄.
      - 차하린이 도서관 안쪽 좁은 통로로 다시 향함. 어제 일렁임이 돌아왔던 그 자리.
      - 망설임 — 손을 댔다 떼는 두 번의 시도. 세 번째에 손바닥이 벽 너머로 사라짐(촉각: 시원한 공기 + 풀냄새).
      - 통과 — 시야가 한 박자 늦게 따라오는 감각, 발이 풀밭에 닿는다.
      - 이계 마을 첫 묘사: 호숫가, 통나무집들, 은빛 눈동자의 사람들. 차하린의 교복·가방이 이상하다는 시선이 모인다(적대 X).
      - 약초 가게 — **마린**이 카운터에 기대어 있다가 고개 든다. 마린의 외형(은빛 눈, 21세 정도, 친절한 인상). "어머, 새 손님이네."
      - 차하린의 짧은 응대: "물건 좀 보러 왔어요." 가방에서 볼펜·사탕 두 개를 꺼냄. 마린의 눈이 휘둥그레지며 "이거 신기해."
      - 첫 거래 — 마린이 약초 다발과 작은 빛나는 돌을 카운터에 올림. "이게 우리 동네 거래 신용 같은 거야. '문(紋)'이라 불러."
      - 마린의 한 마디: "근데 너 어디서 왔어? 옷이 정말 처음 보는 천이야." 차하린: 짧은 침묵 — "조금 멀리서요."
      - 마린이 호숫가 짧은 산책 안내. 차하린이 마을을 분석적으로 흡수(노점, 빨래줄, 호숫가에서 빨래하는 노인 한 장면).
      - 마린이 차 한 잔을 권함. 차하린은 사양.
      - **시간차 핵심 정보**: 마린이 "여기 하루가 그쪽 한 시간이야. 천천히 있다 가."
      - 차하린의 반응: 머릿속으로 빠르게 계산(점심시간 안에 충분히 다녀올 수 있음). 표정 무심한 채 끄덕임.
      - "내일 또 와도 돼요?" 마린: "당연하지, 하린이." 미소.
      - 포탈로 귀환 — 시야가 다시 한 박자 늦게 따라오는 감각. 도서관 안. 시계는 점심시간이 아직 끝나지 않음.
      - 가방을 열어 약초 다발의 진짜 풀냄새 확인. 빛나는 돌을 손바닥 위에 올려보면 진짜 빛난다.
      - 짧은 행동(텔링 X): 돌을 가방 깊숙이 넣는다. 도서관을 나선다.
      - **마지막 문장 — 다음 날 정오, 같은 자리. 차하린이 다시 책장 사이로 발걸음을 옮긴다.** (이 한 줄만)

      ❌ 직전 비트(intro)에서 이미 묘사한 사건 — 절대 다시 쓰지 마라:
      - 첫째 날 점심시간 묘사, 도서관 첫 도착, 한도영 등장, 일렁임 첫 발견.
      - 위 사건들은 이미 본문에 들어가 있다. 회상·요약·우회도 금지.
