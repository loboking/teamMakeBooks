chapter_n: 1
overall: |
  고3 차하린이 학교 점심시간에 옛 도서관 안쪽 헌책 서가 사이로 우연히 들어가다,
  좁은 통로 끝의 막힌 벽에서 공기가 일렁이는 것을 발견한다. 다른 사람 눈에는 그저 벽일 뿐이라는 사실을
  도영의 등장을 통해 깨닫고(다가오자 일렁임이 사라짐), 다시 도영이 떠난 뒤 망설이다 손을 내민 순간 통과한다.
  포탈 너머는 풀밭과 호숫가의 작은 마을. 약초 가게의 마린이 이상한 옷·이상한 가방의 하린을 호기심 가득히 맞이하고,
  하린이 가져온 볼펜 한 자루와 사탕 두 개로 약초 다발과 작은 빛나는 돌(마린이 "문(紋)"이라 부름)을 받는다.
  마린이 "여기 하루가 그쪽 한 시간이야"라고 알려주며 시간차의 의미를 짚는다.
  포탈로 돌아오니 학교 점심시간은 아직 끝나지 않았고, 가방에 든 약초 다발의 풀냄새가 진짜다.
  마지막 줄: 다음 날 정오 — 하린은 도서관 안쪽으로 다시 발걸음을 옮긴다.

beats:
  - name: intro
    instruction: |
      이 부분은 회차 시작. 분량 1,800자 이상.
      - 시작 한 문장: 평범한 고3의 점심시간을 건조하게 보여줘라(시계 초침·교실 소음·창밖 빛 한 가지로). 자조 톤은 약하게.
      - 학교 풍경: 같은 반 떠들썩함, 도영이 친구들과 매점 가는 소리, 하린은 혼자 도서관으로 향함.
      - 도서관 안쪽 묘사: 오래된 책 냄새, 노란 형광등, 사람 없는 정적. 헌책 서가 사이로 들어가다 막힌 벽 앞에 도착.
      - 미세한 이상 — 시야 주변 공기가 흔들린다. 처음엔 눈의 착각이라 생각하고 책 한 권을 뽑아 다시 본다.
      - 일렁임이 더 또렷해짐. 손을 가까이 가져가는 순간 — 발소리. 도영이 "차하린, 여기서 뭐 해?" 하며 다가옴.
      - 도영이 가까워지자 일렁임 사라짐. 하린은 책을 읽는 척 자연스럽게 둘러댐. 도영은 의아한 표정으로 떠남.
      - 마지막 줄: 도영의 발소리가 멀어지자, 다시 일렁임이 돌아온다.
  - name: development
    instruction: |
      이 부분은 회차 중반. 분량 1,800자 이상.
      - 하린의 망설임 — 손을 댔다 떼는 두 번의 시도. 세 번째에 손바닥이 벽 너머로 사라짐(촉각 묘사: 시원한 공기 + 풀냄새).
      - 통과 — 시야가 한 박자 늦게 따라오는 감각, 발이 풀밭에 닿는다.
      - 이계 마을 첫 묘사: 호숫가, 통나무집들, 은빛 눈동자의 사람들. 하린의 교복·가방이 이상하다는 시선이 모인다(하지만 적대 X).
      - 약초 가게의 마린이 다가옴. 마린의 외형(은빛 눈, 21세 정도, 친절). "어머, 새 손님이네."
      - 첫 대화: 마린은 하린의 옷·머리끈·교복 단추에 호기심. 하린은 침착하게 "물건 좀 보러 왔어요" 정도로 둘러댐.
      - 가방에서 볼펜·사탕 두 개를 꺼냄. 마린의 눈이 휘둥그레지며 "이거 신기해"라고 함. 약초 다발과 작은 빛나는 돌을 카운터에 올림.
      - 첫 거래 — 마린은 빛나는 돌을 "문(紋)"이라 설명. "이게 우리 동네 거래 신용 같은 거야."
      - 마린의 한 마디: "근데 너 어디서 왔어? 옷이 정말 처음 보는 천이야."
      - 하린의 짧은 침묵 — "조금 멀리서요."
  - name: climax
    instruction: |
      이 부분은 회차 마지막. 분량 1,800자 이상.
      - 호기심이 커짐 — 하린이 마을 풍경을 잠깐 둘러봄. 노점, 빨래줄, 호숫가에서 빨래하는 노인.
      - 마린이 차 한 잔을 권함. 마실까 망설이다 사양. 시간 감각이 흐트러진다는 느낌.
      - 마린의 한 마디로 핵심 정보 등장: "여기 하루가 그쪽 한 시간이야. 천천히 있다 가." (하린의 표정 변화 — 무심함 속 미세한 긴장)
      - 하린이 시간 차이의 의미를 머릿속으로 빠르게 계산 — 점심시간 안에 충분히 다녀올 수 있다는 결론. 표정은 그대로 무심.
      - "내일 또 와도 돼요?" 하린의 첫 약속. 마린이 "당연하지, 하린이." 하며 미소.
      - 포탈로 귀환. 시야가 다시 한 박자 늦게 따라오는 감각. 도서관 안. 시계는 아직 점심시간.
      - 가방을 열고 약초 다발의 진짜 풀냄새를 확인. 빛나는 돌 하나를 손바닥 위에 올려본다 — 진짜 빛난다.
      - 짧은 독백 한 줄(텔링 X, 행동으로): 돌을 다시 가방 깊숙이 넣는다. 도서관을 나선다.
      - 마지막 문장 — 다음 날 정오, 같은 자리. 하린이 다시 책장 사이로 발걸음을 옮긴다.
