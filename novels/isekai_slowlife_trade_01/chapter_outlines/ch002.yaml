chapter_n: 2
overall: |
  다음 날 정오, 차하린이 도서관 안쪽으로 다시 들어가 두 번째 통과를 한다. 마린의 가게에서 어제와 다른 풍경 — 마린이 약초를 정리하다
  반갑게 맞이한다. 하린은 어제보다 더 챙겨온 물건들(라이터 한 개, 작은 약통, 인스턴트커피 스틱 두 개)을 풀어놓고, 마린은 더 다양한 약초와
  처음 보는 마나석 작은 알갱이 하나를 내준다. 거래 사이사이 마린이 이계의 일상(빨래·호수의 물고기·마을 축제)을 들려주고,
  하린은 가만히 듣는다. 호숫가 산책 중에 노인 한 명(도원 영감)이 지나가다 하린을 보고 멈칫 — "꼬마, 너 어디서 왔니" 하며 짧고 묘한 시선을 던진다.
  마린은 "도원 영감님은 마을 옛 일을 다 아는 분이야"라고만 일러준다.
  하린이 귀환 직전, 가방 속 마나석을 만지는 순간 손끝에 따끔한 정전기 — 어제는 없던 감각.
  학교 도서관으로 돌아와 시계를 확인 — 점심시간 끝까지 7분 남음. 마지막 줄: 손가락 끝의 따끔거림이 여전히 가시지 않는다.

beats:
  - name: intro
    instruction: |
      이 부분은 회차 시작. 분량 1,800자 이상.
      - 시작: 어젯밤의 짧은 회상(텔링 X — 가방 속 빛나는 돌을 베개 옆에 둔 채 잠든 장면 한 컷). 아침은 평범하게.
      - 등굣길 묘사: 평소와 같은 길, 평소와 같은 등굣길 친구들. 다만 하린의 가방에는 어제 챙긴 라이터·약통·커피 스틱이 들어 있다.
      - 1교시·2교시 수업은 한두 줄로 빠르게. 하린의 시선이 시계로 자주 향한다는 묘사 1회.
      - 점심 종소리. 하린은 매점으로 향하는 친구들 무리에서 자연스럽게 빠져 도서관으로.
      - 도서관 안, 어제와 같은 헌책 서가. 일렁임은 어제보다 또렷하다.
      - 마지막 줄: 망설임 없이 손을 댄다.
  - name: development
    instruction: |
      이 부분은 회차 중반. 분량 1,800자 이상.
      - 통과 — 어제처럼 시야가 한 박자 늦지만 이번엔 익숙함. 발이 풀밭에 닿는다.
      - 마린의 가게: 약초를 분류하던 마린이 고개 들며 미소. "어, 진짜 왔네 하린이."
      - 두 번째 거래 — 라이터(불을 한 번 켜 보여줌, 마린의 눈동자가 커진다), 약통(진통제 한 통), 커피 스틱 두 개. 마린의 호기심·실용 양쪽 반응.
      - 마린이 약초 다발 두 개와 처음 보는 작은 알갱이 하나를 꺼냄. "이건 마나석이라고 해. 작은 거지만 너한테 맞을 거야."
      - 호숫가 산책 — 마린이 안내. 하린은 마을 풍경을 분석적으로 흡수(주민 수, 가게 위치, 호수 너머 숲의 어두운 가장자리).
      - 도원 영감 등장: 회색 눈의 노인, 짧은 멈춤. "꼬마, 너 어디서 왔니?" 하린이 답하기 전에 노인은 다시 천천히 걸어감.
      - 마린의 짧은 설명: "도원 영감님은 옛 마을 일을 다 알고 계셔. 신경 쓰지 마, 오늘은 기분이 묘하셨나 봐."
      - 하린의 머릿속에 '저 사람은 뭔가 알고 있다'는 작은 표시.
  - name: climax
    instruction: |
      이 부분은 회차 마지막. 분량 1,800자 이상.
      - 마린과의 짧은 작별. "내일도 와." "네."
      - 호숫가에서 포탈 방향으로 걸어가다, 가방 속 마나석 작은 알갱이를 손가락으로 만지작거림.
      - 손끝에 따끔한 정전기 — 처음 느끼는 감각. 살짝 멈춤. 다시 걷는다(서두름 없이).
      - 포탈 통과. 도서관. 시야 한 박자 늦음. 시계는 점심 종 7분 전.
      - 자리에 돌아가 가방을 내려놓고, 손가락을 폈다 쥐었다 두 번. 따끔거림은 약하게 남아 있다.
      - 도영이 멀리서 매점 봉투를 들고 들어옴. "차하린, 또 도서관이야?" 하린: "응." 짧은 응대.
      - 마지막 문장 — 종이 울린다. 손가락 끝의 미세한 따끔거림이 여전히 가시지 않는다.
