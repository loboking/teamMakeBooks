chapter_n: 2
overall: 현실의 시계와 이계의 마나를 교환하는 실험은 예상보다 더 큰 파장을 일으켰다. 다연이 성공적으로 현실의 시계를 이계의 마나로 변환했을
  때, 잠시 각성한 이계의 존재는 낯선 충격에 휩싸였다. 그들은 단순히 물건을 교환하는 것을 넘어, 존재의 근원을 뒤섞는 위험한 경계를 넘나들고
  있음을 깨달았다. 다희는 이 상황이 통제 불능의 영역으로 치닫고 있음을 직감하고 긴장했다. 그들이 쌓아 올린 미묘한 무역의 균형이 무너지기 직전,
  이계의 정령들이 현실의 물질에 대해 더 강렬한 반응을 보이기 시작했다. 다음 거래는 이전과는 완전히 다른 결과를 초래할 것이라는 불길한 예감이
  감돌았다.
beats:
- name: intro
  instruction: '이 부분은 회차 시작. 분량 1,800자 이상.

    - 현실의 시계와 이계의 마나를 교환하는 실험의 잔여 충격과 미묘한 긴장감을 묘사하며 시작한다. 다연과 다희의 심리 상태(다연의 성공에 대한
    자만과 다희의 불안감)를 대비시킨다.

    - 실험 장소(연구실 또는 비밀 공간)의 시각적, 촉각적 묘사를 통해 현실과 이계의 경계가 무너지고 있음을 암시한다. 특히 마나의 흐름과 물질의
    반응을 섬세하게 묘사한다.

    - 다연이 이계의 존재를 각성했을 때 느낀 낯선 충격과, 다희가 이 상황이 통제 불능으로 치닫고 있음을 직감하는 과정을 서술한다.

    - 대사 톤은 건조하고 건조하게, 감정적인 미사여구는 배제한다. 다연의 성공에 대한 분석적 시각과 다희의 본능적인 공포를 중심으로 묘사한다.

    - 마지막 줄: 다음 비트로 넘기는 미묘한 위기 신호. 이계의 정령들이 현실 물질에 대해 강렬하게 반응하기 시작했다는 불길한 예감을 강조하며
    마무리.'
- name: development
  instruction: '이 부분은 회차 중반. 분량 1,800자 이상.

    - 현실의 물질과 이계의 마나의 교환이 단순한 거래를 넘어 존재의 근원을 뒤섞는 위험한 경계를 넘나들고 있음을 구체적인 물리적, 감각적 충돌을
    통해 묘사한다. 다연이 이계의 존재를 각성한 후 겪는 신체적 변화(마나의 흐름, 신경계의 과부하)를 구체적으로 묘사한다.

    - 다희가 이 통제 불능의 영역으로 치닫는 것을 감지하고 긴장하며, 이계의 정령들이 현실 물질에 대해 보이는 강렬한 반응을 시각, 후각, 촉각으로
    생생하게 묘사한다.

    - 다연의 미묘한 무역의 균형이 무너지기 직전, 이계의 존재들이 현실의 물질에 강렬하게 반응하는 현상을 과학적 관점에서 분석하며, 다음 거래가
    이전과는 완전히 다른 결과를 초래할 것이라는 불길한 예감을 심화시킨다.

    - 마지막 줄: 다음 비트로 넘기는 긴장감. 다음 거래가 가져올 예측 불가능한 결과를 암시하며 마무리.'
- name: climax
  instruction: '이 부분은 회차 마지막. 분량 1,800자 이상.

    - 이계의 정령들이 현실 물질에 대해 보이는 강렬한 반응을 극단적인 감각적 묘사로 폭발시킨다. 현실의 물질과 이계의 마나가 물리적으로 뒤섞이는
    순간, 경계가 완전히 붕괴되는 현상을 극적인 시각과 청각으로 묘사한다.

    - 다연과 다희가 이 혼돈 속에서 무역의 균형이 완전히 무너지는 것을 체감하고, 통제 불능의 상태에 직면한다. 이계의 힘이 현실의 물질을 압도하기
    시작하는 결정적인 순간을 포착한다.

    - 다연과 다희가 서로의 감정적 동요와 생존 본능 사이에서 갈등하는 모습을 대비시킨다. 이계의 힘을 이용하려는 시도가 현실의 법칙을 파괴하는
    결과를 초래하는 순간을 연출한다.

    - 마지막 줄: 다음 화로 넘기는 강한 클리프행어. 현실과 이계의 경계가 완전히 허물어지고, 남매가 이 경계를 무너뜨리는 궁극적인 무역가로
    각성하는 순간을 암시하며 마무리.'
