chapter_n: 2
overall: 차하린은 새로운 마을에서의 일상을 이어가며, 이 세계가 생각보다 훨씬 평화롭다는 것을 체감한다. 아침에는 마을의 작은 텃밭을 가꾸고,
  오후에는 시장에서 필요한 재료들을 구하며 느긋한 생활 리듬을 찾아간다. 특별
beats:
- name: intro
  instruction: '이 부분은 회차 시작. 분량 1,800자 이상.

    - 주인공의 자조적/일상적 톤의 내적 독백으로 하루 시작 (슬로우 라이프에 대한 체념적 만족감)

    - 핵심 공간 묘사: 마을의 작은 텃밭 (시각: 아침 햇살, 흙의 색감 + 후각: 습한 흙 냄새, 청각: 새소리/농기구 소리)

    - 행동 묘사: 텃밭에서 평화롭게 작물을 가꾸는 차하린의 느린 동작을 디테일하게 서술.

    - 등장 인물: 시장 상인 (호칭: ''상인''). 차하린에게 가벼운 안부 인사 건네기.

    - 대사 1~2개: 상인과의 가벼운 대화 (오늘 날씨, 작물 상태 등). 대사는 건조하고 무심한 톤을 유지.

    - 마지막 줄: 텃밭 일을 마치고, 시장으로 향하는 길목에서 이계의 ''경계''가 미세하게 불안정해지거나, 현실 세계의 물건(예: 휴대폰)과
    이계의 물건(예: 특이한 광물)이 시야에 동시에 들어오는 듯한 시각적 오류/미세한 이상 현상 포착.'
- name: development
  instruction: '이 부분은 회차 중반. 분량 1,800자 이상.

    - 핵심 사건 발생: 시장에서 필요한 재료(현실 물품)를 구매하는 과정 중, 평소와 다른 ''거래''의 기회 포착. 특정 이계 물품(광물/재료)의
    가치가 평소와 다르게 느껴짐.

    - 행동 묘사: 상인들과의 거래 과정에서 차하린이 무의식적으로 ''가치''를 측정하는 능력을 사용하고 있음을 묘사. (이계 물건의 잠재 가치
    파악).

    - 등장 인물: 마을 장인 (호칭: ''장인''). 차하린에게 새로운 거래 아이템(현실 물품)을 제안하며 관심을 보임.

    - 대사 1~2개: 장인과 차하린의 대화. 거래의 주체와 가치에 대한 담담하고 건조한 의견 교환. (예: ''이 정도 가치는 이쪽 영역에서는
    찾기 힘들지.'')

    - 시각/촉각 묘사: 거래되는 물건(현실/이계)의 질감이나 색감이 평소보다 더 선명하거나, 미세하게 ''에너지''가 느껴지는 듯한 촉각적 감각
    묘사.

    - 마지막 줄: 장인과의 거래가 마무리된 직후, 차하린이 자신이 가진 이계 물품의 ''잠재적인 시장 가치''를 계산하는 듯한 순간적인 내적
    독백과 함께, 주변 환경의 이계적 기운이 일순간 강하게 요동치는 것(미세한 균열의 증폭)을 감지한다.'
- name: climax
  instruction: '이 부분은 회차 마지막. 분량 1,800자 이상.

    - 결정적 장면: 요동치는 이계의 기운의 근원지(혹은 균열 지점)로 차하린이 무심코 이동. 그곳에서 이계의 질서가 ''거래''의 원리에 기반하고
    있음을 암시하는 고대 기록이나, 시스템적인 장치와 같은 것을 목격.

    - 행동 묘사: 차하린이 그 원리를 이해하는 순간, 자신의 몸이나 주변 사물에 대한 ''이계적 연결고리''가 활성화되는 듯한 감각적 충격.
    (마치 시스템 메시지를 받는 듯한 느낌).

    - 감정 정점: 평화롭던 일상 속에서 발견한 ''시스템적 오류'' 또는 ''숨겨진 원리''에 대한 지적 호기심과, 그것이 자신에게 향하는 위험을
    동시에 직감하며 느끼는 미묘한 긴장감.

    - 대사 1~2개: 스스로에게 던지는 질문이나, 이계의 존재(만약 있다면)에게 던지는 짧고 단호한 질문. (톤: 확신에 찬 탐색자). 예:
    ''이건 단순한 마법이 아니군. 어떤 원리에 의해 움직이는 거지?''

    - 마지막 문장: 이계의 근원적인 힘이 차하린의 존재를 인식하고, 그녀의 잠재된 능력을 자극하는 거대한 에너지 파동(혹은 시스템적인 ''콜''
    같은 것)이 터져 나오며, 차하린의 눈빛이 미세하게 다른 빛을 띠게 되는 강한 클리프행어.'
