chapter_n: 2
overall: |
  다음 날 정오. 차하린이 도서관 안쪽으로 다시 들어가 두 번째 통과를 한다. 마린의 가게에서 어제와 다른 풍경 — 마린이 약초를 정리하다 반갑게 맞이한다.
  차하린은 어제보다 더 챙겨온 물건들(라이터 한 개, 작은 약통, 인스턴트커피 스틱 두 개)을 풀어놓고, 마린은 더 다양한 약초와 처음 보는 마나석 작은 알갱이 하나를 내준다.
  마린이 호숫가 산책을 안내하는 도중, 회색 눈의 노인 도원 영감이 지나가다 차하린을 보고 멈칫하며 "꼬마, 너 어디서 왔니?" 한 마디를 던지고 다시 천천히 걸어간다.
  마린이 "도원 영감님은 마을 옛 일을 다 아는 분이야"라고만 일러준다.
  차하린이 귀환 직전 가방 속 마나석을 만지는 순간 손끝에 따끔한 정전기 — 어제는 없던 감각.
  학교 도서관으로 돌아와 시계를 확인 — 점심 종 7분 전. 마지막 줄: 손가락 끝의 따끔거림이 여전히 가시지 않는다.

beats:
  - name: intro
    instruction: |
      이 부분은 2화 전반부 — **어젯밤 잔영부터 두 번째 포탈 통과 + 마린의 두 번째 거래 완료까지**. 분량 1,800자 이상.

      ⚠️ 이 비트의 시간/사건 경계:
      - 시작: 어젯밤 한 컷(텔링 X) — 베개 옆 빛나는 돌을 손가락으로 한 번 만지고 잠든 장면. 짧게.
      - 아침 등굣길: 평소와 같은 길, 같은 친구들. 가방엔 어제 챙긴 라이터·약통·커피 스틱이 들어 있다.
      - 1~2교시 수업 한두 줄. 차하린의 시선이 시계로 자주 향한다는 묘사 1회.
      - 점심 종소리. 매점으로 향하는 친구들 무리에서 자연스럽게 빠져 도서관으로.
      - 도서관 안, 어제와 같은 헌책 서가 통로. 일렁임은 어제보다 또렷.
      - 망설임 없이 손을 댄다 → 통과. 어제처럼 시야 한 박자 늦지만 익숙함. 발이 풀밭에 닿는다.
      - 마린의 가게: 약초를 분류하던 마린이 고개 들며 미소. "어, 진짜 왔네 하린이."
      - 두 번째 거래 — 라이터(불을 한 번 켜 보여줌, 마린의 눈동자가 커진다), 약통(진통제 한 통), 커피 스틱 두 개. 마린의 호기심·실용 양쪽 반응.
      - 마린이 약초 다발 두 개와 처음 보는 작은 알갱이 하나를 꺼냄. "이건 마나석이라고 해. 작은 거지만 너한테 맞을 거야."
      - 차하린이 마나석을 가방에 넣는다. 이 비트의 마지막 줄.

      ❌ 이 비트에서 다루지 말 것:
      - 호숫가 산책 (climax 담당)
      - 도원 영감 등장 (climax 담당)
      - 손끝 정전기 (climax 담당)
      - 귀환·도서관 복귀

      ⚠️ 인물 구분:
      - **한도영** = 학교 동급생. 이 비트(이계)에서 등장 X.
      - **도원 영감** = 이계 노인. 이 비트에서 등장 X (다음 비트가 첫 등장).

  - name: climax
    instruction: |
      이 부분은 2화 후반부 — **마린이 호숫가 산책 안내부터 도원 영감 첫 등장 + 정전기 + 귀환 + 후크까지**. 분량 2,200자 이상.

      ⚠️ 이 비트의 시간/사건 경계:
      - 마린이 호숫가 짧은 산책을 안내. 차하린은 마을 풍경을 분석적으로 흡수(주민 수, 가게 위치, 호수 너머 숲의 어두운 가장자리).
      - **도원 영감 첫 등장**: 회색 눈의 60대 노인. 천천히 걸어오다 차하린을 보고 멈칫. "꼬마, 너 어디서 왔니?"
      - 차하린이 답하기 전에 노인은 다시 천천히 걸어감.
      - 마린의 짧은 설명: "도원 영감님은 옛 마을 일을 다 알고 계셔. 신경 쓰지 마, 오늘은 기분이 묘하셨나 봐."
      - 차하린의 머릿속에 '저 사람은 뭔가 알고 있다'는 작은 표시.
      - 마린과의 짧은 작별. "내일도 와." "네."
      - 호숫가에서 포탈 방향으로 걸어가다, 가방 속 마나석 작은 알갱이를 손가락으로 만지작거림.
      - **손끝에 따끔한 정전기** — 처음 느끼는 감각. 살짝 멈춤. 다시 걷는다(서두름 없이).
      - 포탈 통과. 도서관. 시야 한 박자 늦음. 시계는 점심 종 7분 전.
      - 자리에 돌아가 가방을 내려놓고, 손가락을 폈다 쥐었다 두 번. 따끔거림은 약하게 남아 있다.
      - **한도영**이 매점 봉투를 들고 멀리서 들어옴. "차하린, 또 도서관이야?" 차하린: "응." 짧은 응대.
      - 마지막 문장 — 종이 울린다. 손가락 끝의 미세한 따끔거림이 여전히 가시지 않는다.

      ❌ 직전 비트(intro)에서 이미 묘사한 사건 — 절대 다시 쓰지 마라:
      - 어젯밤 회상, 등굣길, 교실, 점심 종, 도서관 도착, 일렁임, 포탈 통과, 마린 첫 인사, 라이터·약통·커피 스틱 거래, 마나석 받음.
      - 위 사건들은 이미 본문에 들어가 있다. 회상·요약·우회도 금지.
