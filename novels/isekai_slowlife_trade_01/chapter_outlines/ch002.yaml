chapter_n: 2
overall: 차하린은 현실과 이계의 물건 교환이 단순한 우연이 아님을 직감했다. 그는 이계의 상점에서 희귀한 물건을 거래하는 행위가 현실 세계의
  물리 법칙에 미묘한 영향을 주고 있음을 깨닫고, 이 현상을 더욱 깊이 탐구하기 시작했다. 그는 이계의 거래를 통해 현실의 법칙에 균열이 발생하고
  있음을 확인하며, 자신의 잠재력이 각성하고 있음을 감지했다. 하지만 이 모든 현상은 아직 미스터리로 남아있었고, 차하린은 이 균열의 근원을 파악하기
  위해 더 위험한 거래를 시도할 준비를 했다.
beats:
- name: intro
  instruction: '이 부분은 회차 시작. 분량 1,800자 이상.

    - 차하린의 내적 자조/관찰 톤 1줄로 시작하며, 슬로우 라이프 속에서 이계 물건을 교환하는 행위의 무의미함을 관찰하는 톤을 유지한다.

    - 핵심 공간 묘사: 차하린의 방, 이계와 현실이 교차하는 미묘한 경계가 시각적으로 강조되도록 묘사한다. 특히 방 안의 공기, 빛의 흐름,
    물건들의 질감에 대한 촉각 묘사를 깊게 넣는다.

    - 첫 인물 등장: 이계의 물건을 제공하는 상인(혹은 시스템)의 등장. 차하린에게는 감정 없이 거래를 요구하는 건조한 태도를 보인다.

    - 시각·후각·청각·촉각 묘사 포인트: 이계의 물건에서 나는 미세한 냄새, 빛의 색 변화, 거래 시 발생하는 미세한 진동이나 온도 변화를 섬세하게
    포착한다.

    - 대사 1~3개: 감정 배제된 거래 대사. 차하린의 반응은 최소화한다.

    - 마지막 줄: 이 거래가 단순한 교환이 아님을 직감하는 미묘한 불쾌감과 함께, 다음 거래에 대한 본능적인 탐구 욕구를 남긴다.'
- name: development
  instruction: '이 부분은 회차 중반. 분량 1,800자 이상.

    - 핵심 사건 발생: 차하린이 이계의 물건을 거래하며 현실의 물리 법칙에 미묘한 균열이 발생하는 현상을 직접 관찰하고 기록하기 시작한다. 이계의
    거래가 현실의 법칙에 미치는 영향을 수학적, 물리적 관점에서 분석하려는 시도를 한다.

    - 신체 감각: 거래 과정에서 발생하는 미세한 두통, 시야의 왜곡, 손끝의 미세한 떨림 등 신체적 불편함을 묘사한다.

    - 내적 독백: 이 현상이 단순한 우연이 아니라 어떤 거대한 시스템의 작동 방식의 오류임을 깨닫는 지적인 탐구 과정과, 자신의 잠재력이 각성하고
    있다는 미세한 공포가 혼재한다.

    - 새 정보 발견: 이계의 거래가 현실의 법칙에 미묘한 균열을 일으키는 구체적인 수치와 상관관계를 발견하고, 자신의 잠재력이 각성하는 과정에
    대한 시스템 메시지 혹은 이계의 지식 조각을 얻는다.

    - 마지막 줄: 균열의 근원을 파악하기 위해 더 위험하고 위험한 거래를 시도할 준비를 하며, 현실의 경계를 넘어설 준비를 마친다.'
- name: climax
  instruction: '이 부분은 회차 마지막. 분량 1,800자 이상.

    - 결정적 장면: 차하린이 이계의 거래를 극단적으로 밀어붙여 현실의 법칙에 물리적인 균열을 발생시키는 실험을 감행한다. 이계의 에너지와 현실의
    에너지가 충돌하며 폭발적인 현상이 발생한다.

    - 감정 정점: 통제 불가능한 힘의 폭발 앞에서 느끼는 지적인 경외와 압도적인 각성의 감정의 정점을 묘사한다. 현실과 이계의 경계가 완전히
    붕괴되는 순간의 시각적, 청각적 충격을 극대화한다.

    - 최종 각성: 차하린이 이계의 근원적 질서를 파괴하고 현실의 경계를 무너뜨리는 최종 각성 순간을 겪으며, 자신이 이계의 존재로 거듭나는 순간의
    압도적인 감각을 묘사한다.

    - 마지막 문장: 현실과 이계의 경계가 완전히 소멸하고, 차하린이 새로운 차원의 존재로 각성하며, 그 힘이 현실을 초월하는 존재로 거듭나는
    순간의 강렬한 클리프행어로 마무리된다.'
