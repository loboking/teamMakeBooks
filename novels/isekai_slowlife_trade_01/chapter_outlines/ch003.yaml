chapter_n: 3
overall: 따뜻한 햇살 아래, 하린은 텃밭에서 수확한 채소들로 느긋한 점심 식사를 즐긴다. 평화로운 일상 속에서, 마을 사람들과의 자연스러운
  교류
beats:
- name: intro
  instruction: '이 부분은 회차 시작. 분량 1,800자 이상.

    - 주인공의 현재 만족감과 건조한 시선 묘사로 시작: 평화로운 일상을 ''거래''의 관점에서 바라보는 독백.

    - 핵심 공간 묘사: 햇살이 쏟아지는 텃밭과 식탁. (시각: 채소의 색감, 흙의 질감 / 후각: 풀과 흙의 비릿한 냄새, 상쾌한 공기 / 청각:
    바람에 흔들리는 잎사귀 소리, 새소리).

    - 첫 인물 등장 및 상호작용: 마을 주민 A (호칭: ''마을 아주머니''). 하린은 자연스러운 대화 속에서 이계의 물건(수확물)을 ''교환
    가치''로 인식함.

    - 사건 전개: 아주머니가 하린에게 특별한 물건(예: 오래된 가마니 속의 작은 장식품)을 건네며 감사 인사를 함. 하린은 무심하게 그 물건을
    관찰하며 잠재적인 가치를 측정하는 시선 처리.

    - 대사 1~3개: 마을 아주머니의 따뜻한 감사 인사. 하린은 간결하고 건조한 반응을 보임. (예: ''별거 아니에요.'' / ''네, 건강하세요.'')

    - 마지막 줄: 아주머니가 떠난 후, 하린이 수확물과 받은 물건을 나란히 두고, 그 물건의 미묘하게 느껴지는 이질적인 ''기운''을 감지하며
    다음 비트로 진입하는 미세한 위기 신호.'
- name: development
  instruction: '이 부분은 회차 중반. 분량 1,800자 이상.

    - 핵심 사건 발생: 하린이 수확한 채소 중 하나(예: 특별히 잘 자란 루비색 토마토)를 관찰하며, 그 물건 자체에 숨겨진 이계의 에너지 흐름을
    깊게 파악하는 과정. 이는 단순한 ''물건'' 이상의 가치를 지님을 인지함.

    - 환경 변화 및 감각 자극: 텃밭 주변의 공기가 갑자기 미묘하게 차가워지거나, 주변의 빛이 일순간 흐려지는 등 평화로운 분위기에 균열이 생김.
    (시각/촉각: 미세한 전율, 온도 변화).

    - 주변 인물과의 교류: 마을 주민 B (호칭: ''장인''). 장인은 하린에게 자신이 만든 물건(예: 특이한 문양이 새겨진 도구)을 건네며,
    그 물건에 대한 특별한 ''설명''을 덧붙임. 이 설명은 하린이 모르는 이계의 비밀이나 규칙의 일부를 건드림.

    - 내적 독백 및 사유: 하린은 자신에게 주어진 ''슬로우 라이프''가 단순한 휴식이 아니라, 거대한 흐름 속에서 일종의 ''관찰자 포지션''임을
    깨닫는 건조한 독백을 함. (이계의 물건/현실의 가치 교환에 대한 회의감과 흥미.)

    - 마지막 줄: 장인이 건넨 물건을 만지는 순간, 하린의 눈에 그 물건의 표면에 희미하게, 그러나 분명하게 ''균열''처럼 보이는 패턴이 포착되며,
    이 균열이 단순한 장식품이 아님을 깨닫는 강한 자각.'
- name: climax
  instruction: '이 부분은 회차 마지막. 분량 1,800자 이상.

    - 결정적 사건: 하린이 장인에게 받은 물건(또는 텃밭의 핵심 물건)을 무의식적으로 만지거나 관찰하는 순간, 주변의 평화로운 ''흐름''이
    급격히 멈추고, 이계와 현실의 경계가 일시적으로 불안정해지는 현상 발생.

    - 시스템/개인적 반응: 하린의 감각이 폭발적으로 증폭됨. 평소에는 느껴지지 않던 이계의 ''에너지 파동''이나 ''질서의 흐름''이 시각적으로,
    혹은 감각적으로 느껴지는 연출 (예: 시야 가장자리에 빛의 잔상이나 기하학적 패턴이 스쳐 지나감).

    - 감정 정점: 하린의 표정 변화는 없음. 오직 관찰자로서 상황을 분석하는 듯한 무덤덤함 속에서, 자신이 평범한 ''거래자''가 아닌, 이계의
    ''질서''에 간섭할 수 있는 존재임을 깨닫는 지적인 충격.

    - 물리적 반응: 하린이 본능적으로 손을 뻗어 그 물건(균열이 보이는 물건)을 붙잡는 순간, 주변의 모든 소리와 색채가 잠시 멈추는 듯한 연출.

    - 마지막 줄: 하린의 눈빛이 미묘하게 변하며, 그 물건의 ''균열''을 따라 자신도 모르게 매우 짧고 깊은, 이계의 근원적인 ''언어''나
    ''패턴'' 같은 것을 인식하게 되고, 다음 회차의 큰 위협 또는 발견을 암시하는 강력한 클리프행어.'
