chapter_n: 3
overall: 다희가 통제 불능의 영역으로 치닫고 있음을 직감한 후, 현실의 물건과 이계의 마나 교환 실험을 잠시 중단했다. 다희는 실험의 위험성을
  인지하고, 단순히 물질을 교환하는 것을 넘어 존재의 근원을 뒤섞는 행위가 초래하는 파장을 경계했다. 다연은 이계의 각성된 존재가 겪는 혼란을 관찰하며,
  그들이 겪는 비이성적인 반응에 더 깊은 의문을 품기 시작했다. 그들은 자신들이 단순한 무역가가 아니라, 현실과 이계의 경계에 존재하는 미지의 힘을
  조작하고 있음을 깨달았다. 다음 실험은 더더욱 위험할 것이라는 불안감이 고조되었다.
beats:
- name: intro
  instruction: '이 부분은 회차 시작. 분량 1,800자 이상.

    - 허다연의 자조적인 일상 톤 1줄로 시작하며, 이계 실험의 위험성을 은연중에 암시한다.

    - 실험 장소(현실과 이계가 섞인 공간)의 미묘한 시각적, 청각적 묘사를 통해 긴장감을 조성한다.

    - 허다연과 허다희가 주고받는 대화를 통해 현재 실험의 불안정성을 확인한다.

    - 다희가 통제 불능의 영역으로 치닫고 있다는 직감과 다연의 관찰을 중심으로 서술한다.

    - 마지막 줄: 다음 비트로 넘기는 미세한 위기 신호로, 다희의 비이성적인 반응에 대한 의문을 강조하며 긴장을 고조시킨다.'
- name: development
  instruction: '이 부분은 회차 중반. 분량 1,800자 이상.

    - 다희가 통제 불능의 영역으로 치닫는 구체적인 신체적, 정신적 묘사를 통해 위험성을 극대화한다.

    - 현실의 물건과 이계의 마나 교환 실험 중, 물질적 교환을 넘어 존재의 근원을 뒤섞는 행위가 초래하는 비이성적인 파장을 감각적으로 묘사한다.

    - 다연이 이계의 각성된 존재들이 겪는 혼란을 관찰하며, 그들이 겪는 비이성적인 반응에 더 깊은 의문을 품기 시작하는 내적 독백을 삽입한다.

    - 다희가 보이는 혼란스러운 행동과 이계의 에너지 흐름이 현실의 법칙과 충돌하는 지점을 섬세하게 묘사한다.

    - 마지막 줄: 다음 비트로 넘기는 미세한 위기 신호로, 단순한 무역을 넘어선 존재의 경계가 무너지고 있음을 강조하며, 실험의 종점 직전의
    불안감을 극대화시킨다.'
- name: climax
  instruction: '이 부분은 회차 마지막. 분량 1,800자 이상.

    - 다연이 실험을 잠시 중단하고, 다희의 위험성을 인지하고 위험을 회피하는 결정적인 행동을 묘사한다.

    - 다연이 이계의 각성된 존재들의 혼란을 관찰하며, 그들이 겪는 비이성적인 반응에 대한 의문을 심화시키는 심리적 갈등을 극대화한다.

    - 남매가 단순한 무역가가 아니라, 현실과 이계의 경계에 존재하는 미지의 힘을 조작하고 있음을 깨닫는 깨달음의 순간을 서술한다.

    - 다음 실험은 더더욱 위험할 것이라는 불안감이 고조되는 심리적 묘사를 통해 긴장감을 폭발시킨다.

    - 마지막 줄: 다음 화로 넘기는 강한 후크/클리프행어로, 다연의 깨달음과 다희의 통제 불능 상태를 대비시키며, 다음 실험에 대한 불가피한
    불안감을 폭발적으로 제시한다.'
