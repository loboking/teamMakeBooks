chapter_n: 3
overall: 호숫가 산책 중 마린이 자연스럽게 차하린에게 이계에 대한 이야기와 약초의 효능을 묻는다. 차하린은 현실 세계에서 경험한 것들과 비교하며,
  이계의 생명체들은  '마나'라는 에너지를 사용한다고 설명한다. 마린은 마나석을 통해 다른 존재들이 공간을 이동하는 것을 확인했다고 말하며, 이에
  차하린이 궁금해하면서도 조심스러운 태도를 보인다. 호숫가의 저녁 노을을 바라보며 마린은 차하린에게 '마나'와 관련된 다른 신비로운 이야기를 한다.
  그 중 하나는 이계에서는 '힘'과 '자유'를 위해 싸우는 전사들의 모험이라는 이야기로, 마지막으로 그는 차하린에게 자신이  '마나석'을 어떻게
  사용하는지를 보여주고 그녀에게도 '마나석'을 주었다. 마치 떠오르는 별처럼 따스한 광채를 뿜어내던 마나석은 차하린의 손에 들어갈 때 갑자기 더
  이상 따뜻하지 않아진다.
beats:
- name: intro
  instruction: "호숫가 산책 중 바람을 맞으며 차하린은 오늘도 평화로운 하루였다고 생각했다.\n- 주변의 초록으로 물들인 나무들의 지붕을\
    \ 향해 굽어진 한복판의 호수는 아름다운 연꽃과 작은 조류들이 살아있는 온기 가득한 공간이었다. 그저 평범하게 느껴지는 호숫가에서도 산소가\
    \ 풍부하게 퍼지고 있는 싱그러움을 담은 시원하고 상쾌한 바람이 차하린의 얼굴을 스쳤다.\n- 마치 들판에 자라는 꽃들이 노래하는 목소리처럼\
    \ 은은하면서도 생동감 넘치는 새들의 지저귀는 소리를 들려주었고,  차하린이는 이곳에서만 느낄 수 있는 평화로운 분위기를 만끽했다. \n-"
- name: development
  instruction: "마음속에 깊은 생각이 드나오기 전 차하린의 뒤로 마린이 나타났다.\n\n - 마린은 살짝 웃으며 \"요즘 이쪽 호숫가에서도\
    \ 다른 사람들이 많이 찾는군\"라며, 차하린을 향해 말했다. \n-"
