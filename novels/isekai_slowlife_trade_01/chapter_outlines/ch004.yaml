chapter_n: 4
overall: 다희가 통제 불능의 영역으로 치닫고 있음을 직감한 후, 현실의 물건과 이계의 마나 교환 실험을 잠시 중단했다. 다희는 실험의 위험성을
  인지하고, 단순히 물질을 교환하는 것을 넘어 존재의 근원을 뒤섞는 행위가 초래하는 파장을 경계했다. 다연은 이계의 각성된 존재가 겪는 혼란을 관찰하며,
  그들이 겪는 비이성적인 반응에 더 깊은 의문을 품기 시작했다. 그들은 자, 현실의 경계를 넘나드는 이 행위가 단순한 물질 교환이 아님을 깨달았다.
  다연은 이계의 마나 흐름 속에서 미세하게 뒤틀린 패턴을 포착했고, 그 패턴이 현실의 물리 법칙과 미묘하게 연결되어 있음을 발견했다. 이계의 존재들이
  겪는 혼란은 단순한 각성이 아니라, 현실과 이계의 근본적인 법칙이 충돌하며 발생하는 파동의 결과였다. 다연은 이 현상을 통해 이계의 마나 흐름
  속에 숨겨진 새로운 무역의 가능성을 발견했다.
beats:
- name: intro
  instruction: '이 부분은 회차 시작. 분량 1,800자 이상.

    - 허다연의 내적 자조/일상 톤 1줄로 시작하며, 이계에서의 슬로우 라이프의 평온함을 묘사한다.

    - 실험 중단 직후의 미묘한 긴장감과 정적을 시각적, 청각적으로 포착한다.

    - 허다연이 다희의 통제 불능 상태에 대한 직감과, 물질 교환의 위험성을 인지하는 과정을 서술한다.

    - 허다연이 이계 각성된 존재들의 비이성적인 반응을 관찰하며 의문을 품기 시작하는 심리 묘사를 집중한다.

    - 이계 마나 흐름 속에서 미세하게 뒤틀린 패턴을 포착하고, 그것이 현실의 물리 법칙과 연결될 수 있다는 초기 가설을 설정하는 과정을 서술한다.

    - 마지막 줄: 다음 비트로 넘기는 이계 마나 흐름 속의 미세한 균열과 새로운 무역 가능성의 암시.'
- name: development
  instruction: '이 부분은 회차 중반. 분량 1,800자 이상.

    - 다희가 통제 불능의 영역으로 치닫는 현상에 대한 구체적인 신체적, 마나적 반응을 묘사한다.

    - 허다연이 이계 각성된 존재들이 겪는 혼란과 비이성적인 반응을 관찰하며, 단순한 각성이 아닌 현실과 이계의 법칙이 충돌하며 발생하는 파동의
    결과를 분석하는 과정을 심층적으로 서술한다.

    - 허다연이 포착한 뒤틀린 마나 패턴이 현실의 물리 법칙과 미묘하게 연결되어 있음을 증명하는 구체적인 실험적 증거들을 제시한다.

    - 이계의 마나 흐름 속에 숨겨진 새로운 무역의 가능성에 대한 이론적 추론을 심화하며, 물질 교환이 단순한 교환을 넘어 존재의 근원을 뒤섞는
    행위임을 논리적으로 설명한다.

    - 마지막 줄: 다음 비트로 넘기는 현실과 이계의 경계를 관통하는 마나 파동의 실체와 그 속에서 발견된 새로운 무역의 구조.'
- name: climax
  instruction: '이 부분은 회차 마지막. 분량 1,800자 이상.

    - 허다연이 이계의 마나 흐름 속에서 발견한 뒤틀린 패턴이 현실의 물리 법칙과 연결된다는 결정적인 결론을 내리는 순간의 지적 충격과 깨달음을
    묘사한다.

    - 다연이 이계의 존재들이 겪는 혼란이 단순한 각성이 아니라, 현실과 이계의 근본적인 법칙이 충돌하며 발생하는 파동의 결과임을 깨닫는 순간의
    감정적 폭발을 서술한다.

    - 허다연이 이계의 마나 흐름 속에 숨겨진 새로운 무역의 가능성을 구체적인 패턴으로 시각화하고, 이 패턴이 현실의 물리 법칙과 연결된다는 최종적인
    깨달음을 얻는 과정을 극적으로 묘사한다.

    - 이계의 존재들의 혼란이 현실과 이계의 경계를 흔들기 시작하는 파동의 실체와 그 속에서 발견된 새로운 무역의 구조를 최종적으로 확립하는 장면을
    강렬한 지적 각성으로 마무리한다.

    - 마지막 줄: 다음 화로 넘기는 허다연이 현실과 이계의 경계를 완전히 무너뜨리는 궁극적인 무역가로 각성하는 순간의 압도적인 에너지.'
