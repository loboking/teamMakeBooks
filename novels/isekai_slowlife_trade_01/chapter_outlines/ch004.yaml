chapter_n: 4
overall: '평온한 오후, 하린은 마을의 작은 도서관에서 이계의 역사와 거래 법칙에 대한 기록을 발견한다. 건조한 문헌 속에서 이계의 경제 시스템이 현실과 어떻게 연결되는지 단서를 얻으며, 자신의 발견이 우연이 아님을 깨닫는다.'
beats:
- name: intro
  instruction: '이 부분은 회차 시작. 분량 1,800자 이상.
    - 주인공의 무심한 산책으로 시작: 마을의 오래된 건물을 지나치다 작은 도서관(혹은 기록 보관소)에 발을 들이는 과정.
    - 핵심 공간 묘사: 먼지 쌓인 서가, 햇빛이 비스듬히 들어오는 창문, 오래된 양피지 냄새. (시각: 낡은 책들의 색감 / 후각: 종이와 먼지 / 청각: 바람에 흔들리는 창문 소리).
    - 등장 인물: 도서관 관리인 (호칭: ''관리인''). 무뚝뚝하고 말이 적은 노인. 하린에게 열람 권한을 줌.
    - 대사 2~3개: 관리인과의 건조한 대화. (예: "여기서 뭘 찾으시오?" / "그냥 구경이에요." / "함부로 만지지 마시오.")
    - 마지막 줄: 서가 구석에서 이계의 거래 법칙에 대한 기록이 적힌 낡은 책을 발견하며 다음 비트로 진입.'
- name: development
  instruction: '이 부분은 회차 중반. 분량 1,800자 이상.
    - 핵심 사건: 발견한 기록을 읽으며 이계의 경제 시스템이 현실의 가치 법칙과 연결되어 있음을 파악. ''존재론적 밀도''라는 개념이 등장하며, 하린이 앞서 발견한 광물의 가치가 이 기록과 일치함.
    - 환경 변화: 도서관 안의 공기가 미세하게 무거워지거나, 책의 글자가 순간적으로 빛나는 등 이계적 기운의 간섭.
    - 내적 독백: 기록의 내용을 자신의 경험과 대조하며, ''이계의 거래''가 단순한 물물교환이 아님을 건조하게 분석.
    - 관리인의 개입: 관리인이 하린이 읽는 책을 보고 미묘하게 태도가 변함. (경계? 놀람? 무관심?)
    - 대사 1~2개: 하린이 관리인에게 질문. (예: "이 기록의 출처가 뭡니까?" / 관리인: "오래된 거라 출처는 모르오.")
    - 마지막 줄: 기록의 마지막 장에 적힌 경고문 — ''거래의 균형이 깨지면 현실의 질서도 흔들린다'' — 을 읽는 순간, 도서관 전체에 미세한 진동이 퍼지며 다음 비트로 넘어감.'
- name: climax
  instruction: '이 부분은 회차 마지막. 분량 1,800자 이상.
    - 결정적 장면: 기록의 경고문이 현실화되듯, 도서관 내부에 이계적 현상이 발생. 공간이 미세하게 왜곡되고, 책장의 글자들이 일순간 이계의 문자로 변하는 연출.
    - 감정 정점: 하린은 당황하지 않고 현상을 관찰. 이계의 경제 시스템이 자신에게 반응하고 있음을 건조하게 인지.
    - 시스템 연출: 시야에 새로운 정보창이 떠오름 — [거래 균형 경고: 현실 법칙 간섭도 12%] — 하린은 이 수치의 의미를 직관적으로 이해.
    - 행동: 하린이 기록을 덮고 도서관을 나서며, 자신이 이계의 거래 시스템에 ''진입''했음을 조용히 확인.
    - 마지막 문장: 도서관 밖으로 나온 하린의 눈에, 평범해 보이던 마을 풍경이 미묘하게 다른 ''층위''로 보이기 시작하며, 거래의 세계가 본격적으로 열리고 있음을 암시하는 강렬한 클리프행어.'
