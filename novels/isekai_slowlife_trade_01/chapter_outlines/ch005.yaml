chapter_n: 5
overall: 따뜻한 오후, 하린은 다음 수확을 위해 텃밭 구석을 정리하며 여유를 즐긴다. 평화로운 시간 속에서 마을 장인이 만든 신비한 재
beats:
- name: intro
  instruction: '이 부분은 회차 시작. 분량 1,800자 이상.

    - 주인공의 자조/일상 톤 1줄로 시작 (텃밭 정리 노동의 지루함과 평화로움의 공존).

    - 핵심 공간 묘사: 텃밭 구석의 아지트(시각 2 + 후각/청각 1). 햇볕의 온기, 흙냄새, 바람 소리.

    - 첫 인물 등장: 마을 장인(호칭: ''장인님''). 그가 준비한 신비로운 재료(구체적 설명 필요).

    - 짧은 대사 1~2개: 장인님이 하린에게 무언가 ''가르쳐주려는'' 의도를 담은 대화. (예: ''이건 단순한 재료가 아닐 텐데...'').

    - 핵심 사건: 하린이 그 재료의 가치나 사용법에 대해 의문을 제기하고, 장인님이 이를 회피하며 비밀스럽게 행동함.

    - 마지막 줄: 하린이 그 재료를 만지거나 관찰하는 순간, 예상치 못한 미세한 에너지의 파동(진동, 색 변화)을 감지하고 다음 비트로 넘어가는
    위기 신호.'
- name: development
  instruction: '이 부분은 회차 중반. 분량 1,800자 이상.

    - 핵심 사건 발생: 장인님이 준비한 재료를 활용한 ''실험'' 또는 ''거래의 과정''을 시작함. (예: 재료를 이용한 간단한 마법적 제작
    과정, 또는 이계 에너지의 역류 현상 관찰).

    - 통증/충격 등 신체 감각: 실험 과정 중 하린이 예상치 못한 물리적/마나적 역류에 노출됨. (예: 손끝의 미세한 저릿함, 갑작스러운 피로감).

    - 내적 독백 1~2줄: 하린이 이 현상이나 장인님의 행동의 배후에 숨겨진 목적이나 의미를 추론하며 의문을 제기함.

    - 새 정보 발견: 장인님이 재료에 대한 결정적인 단서나 고대의 기록(문자, 패턴)을 하린에게 보여주거나, 혹은 하린의 시스템 창에 새로운
    ''경고/정보'' 메시지가 팝업됨.

    - 다음 비트 연결: 하린이 이 현상을 해결하거나 파고들기 위해 능동적으로 행동을 취함.'
- name: climax
  instruction: '이 부분은 회차 마지막. 분량 1,800자 이상.

    - 결정적 장면: 재료와 이계 에너지를 결합하여 하린이 스스로 통제할 수 없는 수준으로 에너지를 끌어당기거나, 혹은 이계의 근원적 원리를 직관적으로
    파악하는 순간.

    - 감정 정점: 평화로운 일상(슬로우 라이프) 속에서 갑작스럽게 마주한 이계의 거대한 ''질서''나 ''진실''에 압도당하는 느낌. (두려움,
    경이로움).

    - 핵심 사건: 하린의 몸이나 주변 환경에 이계와 현실이 교차하는 듯한 시각적 왜곡(균열)이 발생하며, 그녀의 잠재력이 폭발적으로 증폭됨.

    - 마지막 문장: 하린이 이 폭발적인 에너지를 자신의 것으로 완전히 흡수하거나, 혹은 그 에너지를 이용해 현실의 경계에 직접적인 균열을 만들어내는
    강렬한 행동으로 마무리. (다음 화로 넘어가는 강한 후크: ''이것은 시작에 불과했다''는 느낌을 주며 끝맺음).'
