chapter_n: 5
overall: 마린의 마나석 선물은 차하린에게 새로운 호기심을 불러일으키고, 현실 세계에서 경험해보던 물건들과 비교하며 궁금증이 커지는다. 이계의
  물건들이 가지는 특성과 마나석이라는 에너지 소스에 대한 정보를 마린에게 질문하며 차하린은 그 진실을 알아내려고 한다.  하지만 마린은 불안한 표정으로
  차하린의 욕구에 대해 조심스러운 태도를 보이며, "마나석은 일반인이 사용하면 위험할 수 있다"며 경계심을 드러낸다. 그의 말에는 가난하고 시련받은
  이계 민중들의 고통과 어두운 역사가 묻어 있다.
beats:
- name: intro
  instruction: '''이게 이계인가? 재밌는 점은 뭐냐...'' 차하린이 생각을 마치 말로 외치듯 입에 담아두고 가만히 바라보았다.  어둡고
    나무들로 깊숙이 파도 치듯이 감겨있는 숲, 지상의 흙과 다른 무언가를 내뿜는 묵직한 향기가 차하린을 압박하는 듯했다. 풀밭에서 들리는 소리만이
    칙칙하고 거슬러 만드는 침묵을 어필했다.'
- name: development
  instruction: '비트 마무리 — 회차 climax + 후크 (분량 1,800자+)


    이 회차 줄거리:

    마린의 마나석 선물은 차하린에게 새로운 호기심을 불러일으키고, 현실 세계에서 경험해보던 물건들과 비교하며 궁금증이 커지는다. 이계의 물건들이
    가지는 특성과 마나석이라는 에너지 소스에 대한 정보를 마린에게 질문하며 차하린은 그 진실을 알아내려고 한다.  하지만 마린은 불안한 표정으로
    차하린의 욕구에 대해 조심스러운 태도를 보이며, "마나석은 일반인이 사용하면 위험할 수 있다"며 경계심을 드러낸다. 그의 말에는 가난하고 시련받은
    이계 민중들의 고통과 어두운 역사가 묻어 있다.


    위 줄거리를 한국 웹소설 톤으로 본문 1,800자+ 작성. 직전 비트와 사건 중복 금지. 시각·청각·촉각 묘사 포함. 대사 1~2개.'
