chapter_n: 6
overall: '마을의 작은 시장에서 하린은 처음으로 의도적인 거래를 시도한다. 장인이 만든 도구와 이계에서 발견한 광물을 교환하며, 거래가 성립되는 순간 현실의 법칙이 미세하게 뒤틀리는 것을 목격한다.'
beats:
- name: intro
  instruction: '이 부분은 회차 시작. 분량 1,800자 이상.
    - 주인공의 아침 루틴으로 시작: 시장으로 향하는 길, 오늘 할 일을 무심하게 정리하는 독백.
    - 핵심 공간 묘사: 마을의 작은 시장. (시각: 빛바랜 천막, 과일과 채소의 색감 / 후각: 흙내, 향신료 냄새 / 청각: 흥정 소리, 발소리).
    - 등장 인물: 마을 장인 (호칭: ''장인님''). 이전 회차에서 단편적으로 등장했던 인물. 하린에게 특이한 도구를 보여줌.
    - 대사 2~3개: 장인과의 대화. (예: "이 도구, 한번 봐보시겠소?" / "어디서 구한 재료죠?" / "내가 직접 만들었지.")
    - 마지막 줄: 장인의 도구에서 이전에 발견한 광물과 동일한 이질적 기운을 감지하며 거래의 가능성을 떠올림.'
- name: development
  instruction: '이 부분은 회차 중반. 분량 1,800자 이상.
    - 핵심 사건: 하린이 이계에서 주운 광물(E-001)을 장인에게 보여주며 거래를 시도. 장인은 광물의 가치를 직관적으로 인지하고 교환에 응함.
    - 거래 과정 묘사: 물건을 주고받는 단순한 행위 속에서, 하린이 이계의 거래 시스템이 작동하는 원리를 관찰. (에너지 흐름의 교환, 가치의 균형).
    - 감각적 변화: 거래가 성사되는 순간, 주변의 공기가 미세하게 진동하고 빛의 각도가 어긋남.
    - 내적 독백: 거래는 단순한 교환이 아니라 ''현실 법칙의 재배치''라는 깨달음. 건조하게 분석.
    - 대사 1~2개: 장인의 반응. (예: "이런 건 처음 보는구만." / 하린: "공평한 거래였을 뿐이에요.")
    - 마지막 줄: 거래 직후, 시장 전체에 미세한 파동이 퍼지며 주변 사람들이 느끼지 못하는 사이에 현실의 질서가 한 밀리미터 흔들림.'
- name: climax
  instruction: '이 부분은 회차 마지막. 분량 1,800자 이상.
    - 결정적 장면: 거래의 여파로 하린의 시야에 시스템 메시지가 떠오름 — [거래 완료: 존재론적 균형 ±0.3% 변동] — 수치가 의미하는 바를 분석.
    - 감정 정점: 체계적인 거래의 가능성을 확인한 하린의 건조한 만족감. 기쁨이 아닌 ''검증 완료''에 가까운 반응.
    - 행동: 장인에게 받은 도구를 사용해 간단한 실험. 도구가 이계의 에너지에 반응하는 것을 확인.
    - 대사 1~2개: 혼잣말. (예: "예상대로군.") 혹은 장인에게 던지는 건조한 감사. (예: "잘 쓸게요.")
    - 마지막 문장: 하린이 거래의 파동이 남긴 흔적을 따라가며, 이 흔적이 더 큰 거래 네트워크로 연결되어 있음을 직감하는 클리프행어.'
