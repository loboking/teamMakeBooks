chapter_n: 6
overall: 차하린은 마린에게 받은 마나석을 여러 번 비추었다. 마나석이 발산하는 은은한 빛깔과 느껴지는 에너지의 진동에 그녀는 매료되었다. 마린은
  차하린의 호기심을 보며, “마나석은 이계에서 자주 사용되는 에너지원으로,  다양한 효능을 가지고 있다.”라고 설명했다. 차하린은 마나석의 잠재력에
  대해 더 알아보고자 하였지만, 마린의 얼굴에는 어린이에게 장난감을 주는 부모님처럼 불안하고 신중한 표정이 드러나며 말을 저두었다.
beats:
- name: intro
  instruction: '-  ‘이게 뭐야...’ 마린에게 받은 작은 돌을 들면서 차하린은 생각했다. <br> -   그녀의 방에는 이계에서 가져온
    물건들이 여러 개로 어골아 자리를 잡고 있었다. 바로 앞, 창문 근처에 그려진 그림처럼 보이는 마나석이 가장 눈에 들어왔다. 은밀한 은빛을
    발산하는 돌은 차하린의 손바닥에 따스한 느낌을 주며 그녀를 안정시키는 듯했다.  하지만 집안에서는 지금껏 들지 않은 고프고 불편한 한쪽이라면
    숨소리 같은 소리가 구불구불하며 들려왔다. <br> - “마나석은 이계에서 자주 사용되는 에너지원으로, 다양한 효능을 가지고 있다.” 마린의
    목소리는 평온했지만, 그녀의 눈동자에는 차하린에게 밝혀내고 싶지 않은 어떤 이야기가 담겨있어 보였다. <br> -  “마나석이 뭘로 쓰이는지는
    알려줘도 괜찮을까?” 차하린은 마린의 눈빛을 보고 의아했다. <br> - 마린은 조심스럽게 작은 돌을 가져오는 그녀의 손에 주웠다. <br>  -
    “마나석이 뭘로 쓰이는지는...”'
- name: development
  instruction: '비트 마무리 — 회차 climax + 후크 (분량 1,800자+)


    이 회차 줄거리:

    차하린은 마린에게 받은 마나석을 여러 번 비추었다. 마나석이 발산하는 은은한 빛깔과 느껴지는 에너지의 진동에 그녀는 매료되었다. 마린은 차하린의
    호기심을 보며, “마나석은 이계에서 자주 사용되는 에너지원으로,  다양한 효능을 가지고 있다.”라고 설명했다. 차하린은 마나석의 잠재력에 대해
    더 알아보고자 하였지만, 마린의 얼굴에는 어린이에게 장난감을 주는 부모님처럼 불안하고 신중한 표정이 드러나며 말을 저두었다.


    위 줄거리를 한국 웹소설 톤으로 본문 1,800자+ 작성. 직전 비트와 사건 중복 금지. 시각·청각·촉각 묘사 포함. 대사 1~2개.'
