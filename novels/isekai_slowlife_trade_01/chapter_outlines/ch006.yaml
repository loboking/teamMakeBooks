chapter_n: 6
overall: 다연은 이계에서 각성하는 존재들이 보이는 비이성적인 반응에 대해 더 깊은 의문을 품었다. 단순한 물질 교환을 넘어 존재의 근원을 뒤섞는
  행위가 초래하는 파장을 경계한 후, 실험을 중단했음에도 불구하고, 다연은 이계의 흐름을 통제하려는 시도가 현실의 법칙과 충돌하며 예상치 못한 부작용을
  목격했다. 그녀는 이계의 흐름이 단순한 마나의 흐름 이상이며, 현실의 법칙과 충돌하는 지점이 존재함을 확신했다. 이계의 혼란은 통제 불가능한 변수였고,
  이는 단순한 실험의 실패가 아니라 현실과 이계의 근본적인 법칙 차이를 드러내는 증거였다. 다연은 이계의 흐름을 이해하려 할수록, 현실의 법칙이
  이계의 법칙을 침범하려는 무의식적인 시도를 감지했다. 그녀는 이계의 경계가 단순한 물리적 장벽이 아니라, 서로 다른 차원의 법칙이 충돌하는 지점임을
  깨달았다. 다음 단계에서는 이 충돌을 어떻게 다룰지, 혹은 이용할지에 대한 새로운 전략이 필요했다.
beats:
- name: intro
  instruction: '이 부분은 회차 시작. 분량 1,800자 이상.

    - 허다연의 실험실 내부, 현실과 이계의 경계가 불안정하게 일렁이는 시각적 묘사(빛의 왜곡, 공간의 떨림)를 중심으로 시작. 현실 먼치킨인
    다연이 이계의 비이성적인 흐름을 관찰하며 느끼는 지적 충격과 경계심을 자조적인 톤으로 서술.

    - 핵심 사건 1: 다연이 이계의 흐름을 통제하려는 시도가 현실의 물리 법칙과 충돌하며 발생하는 예상치 못한 역류 현상을 목격하고, 실험 장비를
    즉각 중단하는 행동.

    - 등장 인물 + 첫 호명("다연" 또는 상황에 따라 내부 독백).

    - 시각·후각·청각·촉각 묘사 포인트: 실험 장비에서 발생하는 미세한 고주파음, 공기 중의 미세한 마나 입자의 진동, 손끝에 느껴지는 차가운
    진동.

    - 대사 1~3개 (내적 독백 위주): "이건 단순한 마나의 흐름이 아니야. 현실의 법칙이 이계의 법칙을 침범하고 있어.", "통제 불가능한
    변수.", "경계가 무너지고 있어."

    - 마지막 줄: 이계의 흐름을 이해하려 할수록, 현실의 법칙이 이계의 법칙을 침범하려는 무의식적인 시도를 감지하고, 이 충돌 지점을 분석해야
    한다는 긴박감이 고조됨.'
- name: development
  instruction: '이 부분은 회차 중반. 분량 1,800자 이상.

    - 핵심 사건 2: 이계의 흐름을 이해하려 할수록, 현실의 법칙이 이계의 법칙을 침범하려는 무의식적인 시도를 감지하고, 다연이 이계의 흐름의
    근원과 현실과 이계의 법칙이 충돌하는 지점을 깊이 있게 분석하는 과정.

    - 신체 감각 묘사: 다연의 이마를 타고 흐르는 미세한 전류 같은 감각, 머릿속에서 현실의 수학적 공식과 이계의 비선형적 공식이 충돌하며 발생하는
    인지 부조화.

    - 내적 독백 1~2줄: "이계의 혼란은 단순한 실패가 아니라, 현실과 이계의 근본적인 법칙 차이를 증명하고 있어.", "경계는 물리적 장벽이
    아니라 차원의 법칙이 충돌하는 지점이야."

    - 새 정보 발견: 이계의 흐름이 단순한 마나의 흐름 이상이며, 현실의 법칙과 충돌하는 지점이 존재한다는 확신을 얻고, 이 충돌을 이용하거나
    혹은 회피할 새로운 전략이 필요하다는 전략적 결론 도출.

    - 마지막 줄: 다연은 이계의 흐름을 이해하려 할수록, 이 충돌 지점을 이용하는 새로운 전략을 모색해야 한다는 전략적 결론에 도달하고, 다음
    단계에서 이 충돌을 다루는 방법을 고민하기 시작한다.'
- name: climax
  instruction: '이 부분은 회차 마지막. 분량 1,800자 이상.

    - 결정적 장면: 현실과 이계의 경계가 물리적 장벽이 아니라 서로 다른 차원의 법칙이 충돌하는 지점임을 최종적으로 깨닫고, 이 충돌을 어떻게
    다룰지 혹은 이용할지에 대한 새로운 전략을 구상하는 순간.

    - 감정 정점: 혼란과 경계심을 넘어, 이 이계의 혼란을 통제 불가능한 변수가 아닌, 현실과 이계의 근본적인 법칙 차이를 증명하는 증거로 받아들이는
    냉철한 인식.

    - 최종 전략 구상: 이 충돌을 이용하거나 회피하는 새로운 전략이 필요하다는 결론에 도달하며, 이계의 흐름을 통제하려는 시도가 현실의 법칙과
    충돌하는 지점을 이용하는 새로운 전략을 구상하기 시작함.

    - 마지막 줄: 현실과 이계의 경계가 충돌하는 지점을 이용하는 새로운 전략을 모색해야 한다는 전략적 결론에 도달하며, 다음 단계에서 이 충돌을
    다루는 방법을 고민하기 시작한다.'
