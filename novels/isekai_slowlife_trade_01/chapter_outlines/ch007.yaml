chapter_n: 7
overall: '평화로운 일상 속, 하린은 마을 외곽의 숲에서 이계의 ''포탈 잔해''를 발견한다. 희미하게 빛나는 균열을 관찰하며, 이계와 현실 사이의 통로가 존재했음을 깨닫고 본격적인 양방향 무역의 가능성을 확인한다.'
beats:
- name: intro
  instruction: '이 부분은 회차 시작. 분량 1,800자 이상.
    - 주인공의 일상적 산책으로 시작: 마을 외곽 숲길을 거닐며 자연을 관찰하는 무심한 시선.
    - 핵심 공간 묘사: 마을 외곽의 숲. (시각: 빛이 듬성듬성 들어오는 나무 사이, 이끼 낀 바위 / 후각: 습한 흙, 솔향 / 청각: 바람 소리, 발밑의 낙엽 밟는 소리).
    - 감각적 단서: 평범한 숲 속에서 공기의 밀도가 다른 구역을 발견. 마치 ''투명한 벽''이 있는 듯한 감각.
    - 대사 1~2개: 혼잣말. (예: "여기 공기가 달라.") 자연에 대한 건조한 관찰.
    - 마지막 줄: 나무 사이로 희미하게 빛나는 균열 — 이계의 포탈 잔해 — 이 시야에 들어오며 다음 비트로 진입.'
- name: development
  instruction: '이 부분은 회차 중반. 분량 1,800자 이상.
    - 핵심 사건: 포탈 잔해를 가까이서 관찰. 균열은 안정적이지 않으나, 일정한 패턴으로 미세하게 떨리고 있음. 하린은 이것이 이계와 현실을 연결하는 통로의 흔적임을 파악.
    - 행동 묘사: 균열 주변의 환경을 분석. 바닥의 돌 배열, 빛의 굴절 패턴, 공기의 온도 차이를 건조하게 기록.
    - 감각적 충돌: 손을 균열 가까이 대자 손끝에서 찌릿한 감각. 머릿속에 이계의 이미지가 스쳐 지나감 — 다른 풍경, 다른 하늘.
    - 내적 독백: 이 통로가 활성화되면 양방향 거래가 가능해짐. 단순한 관찰을 넘어 ''사업 계획''을 세우는 건조한 사고.
    - 대사 1~2개: 자신에게 던지는 질문. (예: "이걸 열 수 있을까?" / "아직은 아니다.")
    - 마지막 줄: 균열에서 미세한 파동이 퍼져 나오며, 하린의 시스템 창에 새로운 정보가 떠오를 기미가 보이며 다음 비트로 넘어감.'
- name: climax
  instruction: '이 부분은 회차 마지막. 분량 1,800자 이상.
    - 결정적 장면: 시스템 메시지가 떠오름 — [포탈 잔해 감지: 안정도 23% / 양방향 교환 가능성: 조건부] — 하린은 수치를 분석하며 거래의 다음 단계를 구상.
    - 감정 정점: 포탈이 완전히 닫히지 않았다는 사실에 대한 건조한 흥미. 두려움이 아닌 ''기회''로서의 인식.
    - 행동: 균열 주변에 표시를 남기고, 귀환 경로를 기억. 이곳이 향후 거래의 핵심 거점이 될 수 있음을 무심하게 확인.
    - 대사 1~2개: 결심을 담은 건조한 한마디. (예: "다음에 올 때는 준비를 해야겠군.")
    - 마지막 문장: 숲을 빠져나온 하린의 눈에, 마을 풍경이 이전과는 다른 ''가치의 층위''로 보이기 시작하며, 양방향 무역의 시대가 다가오고 있음을 암시하는 클리프행어.'
