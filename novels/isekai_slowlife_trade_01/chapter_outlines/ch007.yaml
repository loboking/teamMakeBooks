chapter_n: 7
overall: '"이게 어떻게 작동하는 거죠?" 차하린은 마린에게 받은 마나석을 꽉 쥔 채, 손끝으로 은빛 덩어리를 비추었다. 마나석은 따뜻한 열기를
  발산하며 그녀의 손에 부드럽게 맞붙었지만, 그 힘은 어마어마했다. "그냥... 에너지라는 말이죠?" 차하린은 의문을 표현했고, 마린의 얼굴에는
  고민스러운 표정이 짙어졌다. "마나석은 단순히 에너지가 아니라 이계에서 사용되는 특별한 에너지원입니다." 마린은 어중간하게 말했다. "하지만 일반인에게는
  안전하지 않을 수도 있다는 점을 알려줘야겠습니다." 차하린은 마린의 말에 씁쓸한 미소를 지었다. 불안한 마린과 달리, 그녀는 마나석이 가진 에너지의
  진정성을 느끼고 있었다. "그러면 이계에서 사용하는 다른 물건들도?" 차하린은 의욕적으로 질문했다. "마나석처럼 특별한 힘을 가지고 있는 건 아닐까요?"
  마린은 당황하며, 다시 한번 차하린의 호기심에 대해 고민스러워했다. "그런데... 이계와 현실을 연결하는 방법이 있다면..." 차하린은 생각에
  잠겼다.'
beats:
- name: intro
  instruction: "차하린은 창문을 바라보며 여름 볕이 가득한 고등학교 교실을 노랜만에 본다. 어깨너비 만큼 큰 마나석을 손에 들고 있다.\n\
    \n화사하게 물든 현관 입구를 통해 비친 태양 광선은 은색의 돌을 더욱 반짝이게 했다. 방안에서 맴돌던 고급 시프트 향기와 함께 차하린은 마나석의\
    \ 따뜻한 열기를 느낄 수 있었다. “마나석… 이게 어떻게 작동하는 거죠?”\n차하린은 마린에게 받은 마나석을 꽉 쥔 채, 손끝으로 은빛 덩어리를\
    \ 비추었다.\n 마린이 바라보는 눈빛에서 차하린은 불안함을 읽어냈다."
- name: development
  instruction: '- 주인공의 자조/일상 톤 1줄로 시작

