chapter_n: 7
overall: 다연은 이계의 흐름을 통제하려는 시도가 현실의 법칙과 충돌하며 예상치 못한 부작용을 목격했다. 단순한 마나의 흐름을 넘어선 존재의
  근원을 뒤섞는 행위가 초래하는 파장은 현실의 법칙을 뒤흔들었고, 그녀는 이계의 흐름을 통제하려는 시도가 현실의 법칙과 충돌하며 예상치 못한 부작용을
  목격했다. 그녀는 이계의 흐름이 단순한 마나의 흐름 이상이며, 현실의 법도가 존재한다는 것을 확신했다. 이계의 흐름을 통제하려는 시도는 결국 현실의
  법칙과 충돌하며 예측 불가능한 결과를 낳았다. 다연은 이계의 흐름의 통제가 단순한 마나의 흐름을 넘어선 차원의 문제임을 깨달았다. 그녀는 이계의
  흐름을 완전히 이해하고 통제하기 위해 더욱 위험한 실험을 감행할 준비를 했다.
beats:
- name: intro
  instruction: '이 부분은 회차 시작. 분량 1,800자 이상.

    - 주인공의 자조/일상 톤 1줄로 시작.

    - 핵심 공간 묘사 (시각 2 + 후각/청각 1).

    - 첫 인물 등장 + 호칭("허다연 씨" 등).

    - 짧은 대사 1~2개.

    - 마지막 줄: 다음 비트로 넘기는 미세한 위기 신호.

    - **핵심 사건 1**: 다연이 이계의 흐름을 통제하려는 시도가 현실의 법칙과 충돌하며 예상치 못한 부작용을 목격하고, 단순한 마나의 흐름을
    넘어선 존재의 근원을 뒤섞는 행위가 초래하는 파장을 감지한다.

    - **핵심 사건 2**: 이계의 흐름의 통제가 단순한 마나의 흐름을 넘어선 차원의 문제임을 깨닫고, 현실의 법도가 존재한다는 것을 확신한다.

    - **핵심 사건 3**: 이계의 흐름을 완전히 이해하고 통제하기 위해 더욱 위험한 실험을 감행할 준비를 한다.

    - **묘사 포인트**: 실험 장소의 미세한 떨림, 마나의 흐름이 뒤섞이는 소리, 공기의 밀도가 변하는 촉각.

    - **대사 예시**: "이건 마나의 흐름이 아니야. 뭔가 다른 차원의 문제야.", "통제는 불가능해."

    - **마지막 줄**: 다연은 이계의 흐름의 통제가 단순한 마나의 흐름을 넘어선 차원의 문제임을 깨달았다. 그녀는 이계의 흐름을 완전히 이해하고
    통제하기 위해 더욱 위험한 실험을 감행할 준비를 했다.'
- name: development
  instruction: "이 부분은 회차 중반. 분량 1,800자 이상.\n- 핵심 사건 발생 (동작 단위 묘사).\n- 통증/충격 등 신체 감각\
    \ (신경계의 과부하, 이계 에너지의 역류로 인한 신체적 고통).\n- 내적 독백 1~2줄 (현실과 이계의 경계에 대한 고찰).\n- 새 정보\
    \ 발견 (이계의 흐름에 대한 새로운 공식/원리 발견, 현실 법칙과 이계 법칙의 상충 지점). \n- **묘사 포인트**: 실험 도구의 과열로\
    \ 인한 열기, 피부를 타고 흐르는 이계 에너지의 역류의 감각, 시각적으로 현실이 왜곡되는 현상.\n- **대사 예시**: \"이대로는 안\
    \ 돼. 현실의 법칙이 무너질 거야.\", \"이계의 흐름은 통제 불가능한 미지의 영역이야.\"\n- **마지막 줄**: 다연은 이계의 흐름을\
    \ 완전히 이해하고 통제하기 위해 더욱 위험한 실험을 감행할 준비를 했다."
- name: climax
  instruction: '이 부분은 회차 마지막. 분량 1,800자 이상.

    - 결정적 장면 (시스템 창 등 핵심 연출).

    - 감정 정점 (위험과 희열이 뒤섞인 상태).

    - 마지막 문장: 다음 화로 넘기는 강한 후크/클리프행어.

    - **핵심 사건 1**: 이계의 흐름을 통제하려는 시도가 현실의 법칙과 충돌하며 예측 불가능한 결과를 낳고, 그 결과, 현실의 법칙이 뒤흔들리는
    현상을 직접 목격한다.

    - **핵심 사건 2**: 현실의 법칙이 무너지는 순간, 다연은 이계의 흐름의 통제가 단순한 마나의 흐름을 넘어선 차원의 문제임을 깨닫고,
    이계의 흐름을 완전히 이해하고 통제하기 위해 더욱 위험한 실험을 감행한다.

    - **핵심 사건 3**: 이계의 흐름의 통제가 단순한 마나의 흐름을 넘어선 차원의 문제임을 깨달은 다연은 이계의 흐름을 완전히 이해하고 통제하기
    위해 더욱 위험한 실험을 감행할 준비를 한다.

    - **묘사 포인트**: 현실이 찢어지는 듯한 청각, 시각적 왜곡, 마나의 폭발적인 에너지, 현실과 이계의 경계가 무너지는 순간의 충격.

    - **대사 예시**: "결국, 현실은 무너지고 있었다.", "이것이 새로운 법칙이야."

    - **마지막 줄**: 이계의 흐름을 통제하려는 시도가 현실의 법칙과 충돌하며 예측 불가능한 결과를 낳았다. 다연은 이계의 흐름을 완전히 이해하고
    통제하기 위해 더욱 위험한 실험을 감행할 준비를 했다.'
