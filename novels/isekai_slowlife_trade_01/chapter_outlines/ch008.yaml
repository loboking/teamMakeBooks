chapter_n: 8
overall: 다연은 이계의 흐름이 단순한 마나의 흐름 이상이며, 현실의 법도가 존속하는 근거를 뒤흔들었음을 깨달았다. 그녀는 이계의 흐름을 통제하려는
  시도가 현실의 법칙과 충돌하며 예상치 못한 부작용을 목격했고, 이는 단순한 마나 조작을 넘어선 존재의 근원을 뒤섞는 행위가 현실의 법칙을 뒤흔들었음을
  의미했다. 실험을 중단했음에도 불구하고, 그녀는 이계의 흐름이 현실의 물리 법칙과 동등한 차원의 존재임을 직감했다. 이계의 흐름을 통제하려는 시도가
  현실의 법칙과 충돌하며 발생하는 부작용은, 현실 세계의 제약이 이계의 법칙에 의해 무력화될 수 있다는 충격적인 가능성을 던져주었다. 다연은 이계의
  흐름을 통제하려 했던 시도가 현실의 법칙과 충돌하며, 현실 세계의 경계가 모호해지는 것을 경험했다. 그녀는 이계의 흐름의 근원을 이해하기 위해
  더욱 깊은 탐구를 시작하기로 결심했다.
beats:
- name: intro
  instruction: '이 부분은 회차 시작. 분량 1,800자 이상.

    - 다연의 내적 자조/냉소적인 톤 1줄로 시작하며, 이계의 흐름에 대한 냉소적인 관찰을 제시한다.

    - 핵심 공간 묘사: 이계의 흐름이 물리 법칙과 겹쳐지는 경계 지점의 시각적, 청각적 묘사. 차원의 흐름이 물리적 공간을 왜곡하는 미묘한 촉각
    묘사.

    - 첫 인물 등장 + 호칭("다연 씨" 등)을 통해 주변 환경에 대한 관찰을 시작한다.

    - 짧은 대사 1~2개: 이계의 흐름에 대한 회의적인 반응.

    - 마지막 줄: 이계의 흐름을 통제하려는 시도가 현실의 법칙과 충돌하며 발생하는 부작용에 대한 미세한 불안감 신호를 남긴다.'
- name: development
  instruction: '이 부분은 회차 중반. 분량 1,800자 이상.

    - 핵심 사건 발생: 이계의 흐름을 통제하려던 실험의 실패와 그 과정에서 현실의 물리 법칙과 이계의 법칙이 충돌하는 물리적 부작용 묘사.

    - 신체 감각 묘사: 마나의 흐름이 현실의 신경계에 미치는 충격, 통증, 존재의 근원을 뒤섞는 듯한 내부적인 충격 묘사.

    - 새 정보 발견: 이계의 흐름이 현실의 물리 법칙과 동등한 차원의 존재임을 깨닫는 결정적 순간의 논리적 추론 과정.

    - 다연이 실험을 중단했음에도 불구하고 이계의 흐름의 근원을 이해하기 위해 더욱 깊은 탐구를 시작하기로 결심하는 내적 동기 부여 과정.'
- name: climax
  instruction: '이 부분은 회차 마지막. 분량 1,800자 이상.

    - 결정적 장면: 이계의 흐름의 근원을 이해하기 위한 심층 탐구 과정에서 현실 세계의 경계가 모호해지는 것을 직접적으로 경험하는 시각적, 감각적
    묘사.

    - 감정 정점: 현실의 제약이 이계의 법칙에 의해 무력화될 수 있다는 충격적인 가능성에 대한 지적 충격과 동시에 그 가능성을 받아들이는 체념.

    - 최종 행동: 이계의 흐름의 근원을 이해하기 위한 탐구를 더욱 깊게 시작하겠다는 결심을 행동으로 옮기는 결단.

    - 마지막 문장: 이계의 흐름을 통제하려 했던 시도가 현실의 법칙과 충돌하며, 현실 세계의 경계가 모호해지는 것을 경험한 다연이 다음 단계의
    탐구를 시작하며 현실과 이계의 경계를 완전히 허무는 결정적인 행동을 예고하며 마무리된다.'
