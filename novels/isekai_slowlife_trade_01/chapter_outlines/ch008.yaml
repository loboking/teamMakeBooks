chapter_n: 8
overall: 마린은 마나석의 에너지를 사용하는 방법에 대해 차하린에게 설명했다. “이계에서는 마나석을 외부로 활용하기 위해 다양한 연기술을 사용한다.”라고
  말하며 손목에서 작은 스톤을 꺼냈다. "예를 들어, 이 마나석은 마법으로 변환되는 데 유용하게 사용됩니다."  마린의 손가락 사이로 움직이는 은빛
  덩어리는 차하는 에너지 흐름을 동반했다. “내가 가진 연기술을 이용해 마나석의 에너지를 집중, 분산 또는 변환할 수 있다.” "그렇게 하면 무엇이
  생길까요?" 차하린은 호기심으로 물었다. 마린은 미소를 지으며 답했다. “다양한 종류의 마법을 사용하여 이계의 영역에 맞는 방어력, 공격력, 치료
  등 다양한 효과를 만들 수 있다.”  마린이 연기를 생성하는 모습을 바라보며 차하린은 마나석의 능력을 더욱 자세히 알고 싶어졌다.
beats:
- name: intro
  instruction: '-  ‘만약 이계의 물건을 현실로 가져갈 수 있다면…'' 차하린은 마음속으로 중얼거렸다.

    -  현실과 이계가 연결된 은색 커튼 뒤에는 숲이 평화롭게 펼쳐져 있었다. 짙은 녹색 나뭇잎 사이에서 새들이 소리가 지르며 아름답고 고요한
    분위기를 자랑했다. 살짝 가볍게 불어오는 바람은 꽃향기와 함께 차하린의 이마에 부드럽게 스치며, 따스함을 전달했다.

    -  “차하린아, 여기 오렴.” 마린이 인형처럼 작은 몸으로 나가시는 방향을 가리키며 말했다.

    -'
- name: development
  instruction: "- 차하린은 마린의 손길에 따라 이계의 물건을 만지면서 소름을 느꼈다. 은색 커튼 뒤에는 숨겨진 열쇠가 있다는 것을 알았고,\
    \ 그 열쇠를 찾아야 한다.\n-  “마나석이라는 주변과 연결되는 에너지 원천을 사용하는 것 같아.” 마린이 말하며 차하린의 팔꿈치에 가볍게\
    \ 손길을 올렸다. \n-  ‘내가 이계에서 얻는 것이 무엇인가’ 차하린은 마음속으로 질문했다.\n-"
