chapter_n: 9
overall: '마을의 노점에서 하린은 이계의 광물을 이용해 처음으로 ''가치 창출'' 거래를 시도한다. 장인에게 가공을 의뢰하고, 완성된 물건이 현실의 경제 시스템에 미치는 영향을 관찰하며 거래의 본질을 이해해 간다.'
beats:
- name: intro
  instruction: '이 부분은 회차 시작. 분량 1,800자 이상.
    - 주인공의 아침 정리로 시작: 수집한 이계 물질들을 나열하며 가치를 분류하는 건조한 작업.
    - 핵심 공간 묘사: 하린의 거처. 소박한 방, 창문으로 들어오는 아침 빛, 테이블 위에 놓인 광물들. (시각: 광물의 이질적 빛깔 / 후각: 흙내, 금속 냄새 / 촉각: 돌의 차가움).
    - 등장 인물: 마을 노점상 (호칭: ''상인''). 하린이 모으는 물건에 관심을 보임.
    - 대사 2~3개: 상인과의 대화. (예: "요즘 뭔가 모으시는 것 같은데." / "취미 같은 거예요." / "그래, 취미가 좋으시네.")
    - 마지막 줄: 상인이 하린의 광물 중 하나를 보며 미묘하게 눈을 크게 뜨는 반응을 포착하며 다음 비트로 진입.'
- name: development
  instruction: '이 부분은 회차 중반. 분량 1,800자 이상.
    - 핵심 사건: 장인에게 광물의 가공을 의뢰. 장인은 광물의 특성을 직감적으로 이해하고, 이를 활용한 특별한 도구나 장신구를 제작.
    - 거래 과정: 가공 비용을 어떻게 지불할지 협상. 하린은 현실의 화폐가 아닌, 다른 이계 물질의 일부를 대가로 제안. 장인이 이를 수락.
    - 감각적 묘사: 가공 과정에서 광물이 내는 미세한 빛, 금속을 두드리는 소리, 열에 의한 냄새.
    - 내적 독백: 가공된 물건이 현실의 경제에 들어가면 어떤 파동을 일으킬지 계산하는 건조한 사고.
    - 대사 1~2개: 장인과의 건조한 협상. (예: "이 정도면 되겠소?" / "됐어요.")
    - 마지막 줄: 가공이 완성되는 순간, 물건에서 미세한 빛이 방출되며 주변의 현실 질서가 아주 미세하게 반응함.'
- name: climax
  instruction: '이 부분은 회차 마지막. 분량 1,800자 이상.
    - 결정적 장면: 완성된 물건을 마을 사람에게 건네는 ''첫 거래''. 일상적인 물건 교환처럼 보이지만, 이면에서 이계의 가치 시스템이 작동.
    - 시스템 연출: [가치 창출 거래 완료 / 현실 법칙 간섭도 +0.7% / 거래 네트워크 활성화: 1개 노드] — 하린은 이 수치의 의미를 분석.
    - 감정 정점: 거래가 성공하자, 하린의 내면에 건조한 확신이 자리잡음. 이것은 ''장사''가 아니라 ''법칙의 재설계''.
    - 대사 1~2개: 거래 상대에게 건네는 건조한 한마디. (예: "마음에 드시면 좋겠네요.") 상대의 반응. (예: "이건 어디서 난 거요?")
    - 마지막 문장: 하린이 떠난 자리에 미세한 이계의 잔향이 남아 있고, 마을의 경제 시스템이 보이지 않는 곳에서 조용히 변화하기 시작했음을 암시하는 클리프행어.'
