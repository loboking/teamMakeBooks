chapter_n: 10
overall: '마을 축제 날, 하린은 사람들 사이에서 자연스럽게 거래를 이어간다. 축제의 열기 속에서 이계의 물건들이 조용히 유통되고, 하린은 거래 네트워크가 마을 전체로 확장되고 있음을 감지한다. 그때, 처음으로 ''외부의 시선''을 느낀다.'
beats:
- name: intro
  instruction: '이 부분은 회차 시작. 분량 1,800자 이상.
    - 주인공의 아침 묘사로 시작: 축제 소식을 듣고 무심하게 하루를 준비하는 과정. 축제에 대한 기대감이 아닌, ''관찰 기회''로서의 인식.
    - 핵심 공간 묘사: 축제 준비 중인 마을 광장. (시각: 색색의 천, 음식 노점, 사람들의 움직임 / 후각: 구워지는 음식 냄새, 꽃 향 / 청각: 준비하는 소리, 웃음소리).
    - 등장 인물: 마을 사람들. 축제 분위기 속에서 자연스럽게 하린에게 말을 거는 주민.
    - 대사 2~3개: 주민과의 가벼운 대화. (예: "축제 나오시오?" / "구경이나 해볼게요." / "그래, 오랜만에 즐기시오.")
    - 마지막 줄: 축제 노점 사이에서 자신이 거래한 물건이 다른 사람의 손에 들어간 것을 발견하며 다음 비트로 진입.'
- name: development
  instruction: '이 부분은 회차 중반. 분량 1,800자 이상.
    - 핵심 사건: 축제 속에서 거래 네트워크의 흔적을 추적. 자신이 유통시킨 이계 물품이 마을 사람들 사이에서 자연스럽게 거래되고 있음을 확인.
    - 행동 묘사: 노점들을 무심하게 둘러보며, 이계 물품이 닿은 곳에서 미세하게 현실 질서가 달라진 것을 감각적으로 포착.
    - 등장 인물: 축제 상인 (호칭: ''행상''). 외부에서 온 것으로 보이는 인물. 하린의 물건에 관심을 보임.
    - 대사 1~2개: 행상과의 건조한 대화. (예: "좋은 물건이 많군요." / 행상: "이 근처에서는 볼 수 없는 것들이오.")
    - 감각적 묘사: 축제의 열기 속에서 간헐적으로 느껴지는 이계적 기운의 파동.
    - 마지막 줄: 행상이 떠난 후, 하린이 축제 인파 너머로 시선을 돌리는 순간, 누군가 자신을 관찰하고 있는 듯한 ''시선''을 느끼며 다음 비트로 넘어감.'
- name: climax
  instruction: '이 부분은 회차 마지막. 분량 1,800자 이상.
    - 결정적 장면: 외부의 시선의 정체를 파악하려 하지만, 축제 인파 속에서 놓침. 대신 시스템 메시지가 떠오름 — [경고: 미확인 관찰자 감지 / 거래 네트워크 노출 가능성: 낮음].
    - 감정 정점: 처음으로 ''관찰자''가 아닌 ''관찰 대상''이 된 상황에 대한 건조한 경계심. 두려움이 아닌, 게임의 판이 바뀌었음을 인지하는 차분한 분석.
    - 행동: 축제를 빠져나와 조용한 곳으로 이동. 거래 네트워크의 현 상태를 점검하고, 노출을 최소화할 방법을 모색.
    - 대사 1~2개: 자신에게 던지는 건조한 독백. (예: "누군가 보고 있었다.") 혹은 마을 사람에게 건네는 자연스러운 작별 인사.
    - 마지막 문장: 하린이 고개를 돌린 순간, 축제의 불빛 너머 어둠 속에서 희미하게 빛나는 또 다른 균열이 보이며, 거래의 무대가 마을을 넘어 더 넓은 세계로 확장되고 있음을 예고하는 강렬한 클리프행어.'
