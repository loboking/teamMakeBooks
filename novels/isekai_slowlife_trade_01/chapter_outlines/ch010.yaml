chapter_n: 10
overall: '"이게 어떻게 작동하는 거죠?" 차하린은 마린에게 받은 마나석을 꽉 쥐고, 은빛 덩어리를 손끝으로 비추었다. 마나석은 따뜻한 열기를
  발산하며 그녀의 손에 부드럽게 맞붙었지만, 그 힘은 어마어마했다. 마린이 설명하는 마나석의 에너지 사용 방법을 차하린은 천천히 이해했고, 마린의
  손가락 사이로 움직이는 은빛 덩어리 속에서 감탄하며 말했다. "정말 신기하다... 이걸 활용해서 무엇을 만들 수 있을까요?" 그녀는 마나석에 대한
  호기심이 넘치며 물었다. 마린은 차하린의 눈빛을 보고 미소 지으며, “마나석만으로도 충분히 많은 것을 만들 수 있다.”라고 말했다. "하지만 가장
  중요한 것은 이 마나석을 어떻게 활용하는지에 달려있다." 그는 차하린에게 조금 더 심오한  사실을 알려주기 시작했고, 그녀의 눈은 다시 한 번
  흥분으로 가득 채워졌다.'
beats:
- name: intro
  instruction: "“아직 이게 무슨 소릴까?” 차하린은 마린에게 받은 마나석을 똑바로 들고 물었다. 그녀는 은빛 덩어리가 담긴 작은 상자를\
    \ 손에 쥐고 있었는데, 내부의 따뜻함이 그녀의 손목까지 느껴지기도 했다. 오늘 하루 종일 고정된 자리에서 수업을 들으며 마음만 공허하게 돌던\
    \ 차하린의 집중력은 이 상자 속 은빛 덩어리를 보고 바로 전환되었다. \n\n“마나석이라고 하는데, 이게 당신들이 쓰는 에너지원입니다.”\
    \ 마린은 조용히 말하며 눈을 비추었다.  눈 앞에 드넓게 펼쳐진 공간, 벽에는 여러 가지 그림으로 장식되어 있었지만 그 그림들은 차하린에게\
    \ 아무런 의미도 없었다. 낡고 미끈한 나무 바닥과 서늘한 기운이 그녀를 감싸고 있을 뿐이었다. 오직 마나석의 은빛 반짝임만이 차하린의 시선을\
    \ 사로잡았다. \n\n“마나석은 이계에서 찾아 온 물건인데, 당신에게 큰 힘을 줄 수 있는 가능성이 있습니다.” 마린의 목소리는 부드럽지만,\
    \ 차하린의 심장 속에는 어떤 강한 에너지가 불어오는 것 같았다. “당신은 이것을 활용할 수 있다."
- name: development
  instruction: "“힘? 왜 내게…” 차하린은 마나석에 대한 호기심이 더욱 커져 갔고, 그녀의 손이 자연스럽게 마나석을 향해 나아갔다.\
    \ 마린이 그 안에서 찾는 어떤 에너지를 느끼려는 순간, 그녀의 손가락 끝에 따뜻함과 함께 약한 진동이 느껴졌다. 마치 숨쉬듯 이온화된 바람처럼\
    \ 차하린의 손끝을 살랑거렸고, 그 감각은 그녀의 손목까지 전파되어 작은 통증으로 변했다. ‘뭐가…?’  차하린은 생각하기 어려울 만큼 놀라움과\
    \ 기분 좋은 압박감이 동시에 그녀의 몸속에서 끓어 오르고 있었다. 마지막으로 마나석을 자세히 들여다 보며 눈에 들어오는 것은 은빛 조각들\
    \ 사이로 번쩍이는 작은 점들이었다. “그…것들은?” 그녀가 말하며 질문하자 마린은 차분하게 대답했다. “그곳에는 당신이 지금 이 순간 촉수를\
    \ 느끼고 있는 에너지 흐름을 담고 있습니다.” \n\n마린의 눈빛이 은빛 조각들로 향하는 동안, 차하린은 다시 한 번 마나석을 잡았다. 그녀는\
    \ 아직 어떤 의미가 이해되지 않지만, 이것이 자신에게 무엇을 가져올지 알 수 있다는 확신이 들었다. 곧 ‘무슨 일일까?’라는 생각이 그녀의\
    \ 머리 속에 생겨났고 마린은 차분한 목소리로 말했다. “마나석은 당신의 힘을 키울 수 있지만, 그 과정은 당신의 결정에 달려 있습니다.”"
