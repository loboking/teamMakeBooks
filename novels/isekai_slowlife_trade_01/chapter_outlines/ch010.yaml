chapter_n: 10
overall: 다연은 이계의 흐름이 단순한 마나의 흐름 이상이며, 현실의 법도가 존속하는 근거를 뒤흔들었음을 깨달았다. 그녀는 이계의 흐름을 통제하려는
  시도가 현실의 법칙과 충돌하며 예상치 못한 부작용을 목격했고, 이는 단순한 마나 조작을 넘어선 존재의 근원을 뒤섞는 행위가 현실의 법칙을 뒤흔들었음을
  의미했다. 실험을 중단했음에도 불구하고, 그녀는 이계의 흐름이 현실의 법칙과 충돌하며 예상치 못한 부작용을 목격했고, 이는 단순한 마나 조작을
  넘어선 존재의 근원을 뒤섞는 행위가 현실의 법칙을 뒤흔들었음을 의미했다. 실험을 중단했음에도 불구하고, 그녀는 이계의 흐름이 현실의 법칙과 충돌하며
  예상치 못한 부작용을 목격했고, 이는 단순한 마나 조작을 넘어선 존재의 근원을 뒤섞는 행위가 현실의 법칙을 뒤흔들었음을 의미했다. 다연은 이계의
  흐름이 현실의 법칙과 충돌하며 예상치 못한 부작용을 목격했고, 이는 단순한 마나 조작을 넘어선 존재의 근원을 뒤섞는 행위가 현실의 법칙을 뒤흔들었음을
  의미했다. 이 모든 혼돈 속에서, 그녀는 이계의 흐름이 현실의 근본을 뒤흔들었음을 인정할 수밖에 없었다.
beats:
- name: intro
  instruction: '이 부분은 회차 시작. 분량 1,800자 이상.

    - 주인공 다연의 내적 자조/냉소적인 일상 톤 1줄로 시작하며, 이계의 흐름에 대한 깊은 회의감 표현.

    - 핵심 공간 묘사: 현실의 고립된 공간(방)과 이계의 흐름이 겹쳐지는 시각적 충돌 묘사 (시각 2 + 미세한 소리/촉각 1).

    - 다연이 실험을 중단했음에도 불구하고 이계의 흐름이 현실의 법칙과 충돌하며 발생하는 미세한 부작용을 관찰하는 과정을 건조하게 묘사.

    - 이계의 흐름이 단순한 마나 조작을 넘어선 존재의 근원을 뒤섞는 행위가 현실의 법칙을 뒤흔들었음을 인정하는 과정에 집중.

    - 대사 예시: "또다시 혼돈이군. 이계의 흐름은 현실의 근본을 뒤흔들고 있어."

    - 마지막 줄: 다음 비트로 넘기는 미세한 위기 신호. 이계의 흐름의 통제 시도가 현실의 근본을 뒤흔들었다는 확신.'
- name: development
  instruction: '이 부분은 회차 중반. 분량 1,800자 이상.

    - 핵심 사건 발생: 이계의 흐름을 통제하려는 시도와 현실의 법칙과의 충돌이 구체적인 물리적/존재론적 부작용으로 나타남. 실험 중단에도 불구하고
    발생하는 예상치 못한 현상에 대한 상세한 묘사.

    - 다연이 이계의 흐름의 부작용을 관찰하며 느끼는 혼돈과 냉소적인 감정의 심화.

    - 현실의 법칙이 이계의 흐름과 충돌하면서 발생하는 물리적 왜곡이나 인지적 혼란에 대한 구체적인 묘사.

    - 이계의 흐름이 단순한 마나 조작을 넘어선 존재의 근원을 뒤섞는 행위가 현실의 법칙을 뒤흔들었음을 증명하는 구체적인 증거 제시.

    - 대사 예시: "이건 단순한 마나 조작이 아니야. 존재의 근원을 뒤섞는 행위지."

    - 마지막 줄: 다음 비트로 넘기는 강한 클리프행어. 혼돈 속에서, 이계의 흐름이 현실의 근본을 뒤흔들었다는 인정과 함께, 통제 불가능한 혼돈의
    시작.'
- name: climax
  instruction: '이 부분은 회차 마지막. 분량 1,800자 이상.

    - 결정적 장면: 다연이 이계의 흐름의 혼돈 속에서 현실의 법칙이 와해되는 것을 직접적으로 목격하고, 자신이 통제하려 했던 행위가 현실의 근본을
    뒤흔들었음을 깨닫는 순간의 감정적 폭발.

    - 이계의 흐름의 혼돈 속에서, 그녀가 현실의 법칙을 뒤흔들었음을 인정하는 순간의 지적/존재론적 깨달음.

    - 모든 혼돈 속에서, 그녀가 이계의 흐름이 현실의 근본을 뒤흔들었음을 인정할 수밖에 없음을 선언하는 장면의 강렬한 심리적 고백.

    - 현실과 이계의 경계가 완전히 무너지는 혼돈 속에서, 그녀가 이계의 흐름의 통제에 실패했음을 인정하고, 이 모든 혼돈 속에서 현실의 법칙이
    무너졌음을 선언하는 장면의 강렬한 클라이맥스.

    - 마지막 문장: 다음 화로 넘기는 강한 후크/클리프행어. 현실과 이계의 경계가 완전히 무너지는 혼돈 속에서, 그녀가 이계의 흐름의 통제에
    실패했음을 인정하고, 이 모든 혼돈 속에서 현실의 법칙이 무너졌음을 선언하는 장면의 강렬한 클라이맥스.'
