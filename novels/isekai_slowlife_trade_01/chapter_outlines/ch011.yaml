chapter_n: 11
overall: '{"ch011": "마나석을 이용해 만든 작은 마법 지구를 팔로 전달한 차하린에게는 현실과 이계의 경계가 흐려지는 느낌이 들었다.
  마린이 설명하는 대로, 마나석의 에너지를 사용하면 현실 세계에서도 일부 영향을 미칠 수 있다는 것을 알게 된 것이다.  그런데 이마니는 기본적인
  마법 지구라도 만들기 힘들어 하는지 생각해보며 차하린은 내적 갈등이 생겼다. 그녀의 손가락에는 여전히 은빛 덩어리, 마나석을 들고 있었다."}'
beats:
- name: intro
  instruction: "- 차하린은 마음속으로 ‘내일 이게 다 끝나면, 좀 더 진짜 여름 느낄 수 있겠어’ 라고 속삭였다.\n -  작업실은\
    \ 창문을 통해 들어오는 따스한 햇살로 가득 채워졌다. 아주 약간 바람이 살랑거리며 꽃향기가 들어왔다. 그녀의 귀에는 간편히 틀어놓은 노래\
    \ 들려와 익숙한 편곡이 담겨 있었다.\n-"
- name: development
  instruction: "-  마린이 “무슨 마법 지구야? 그냥 가만히 있어도 좋아 보이는데…” 라고 말했다. \n - 차하린은 손가락에 들고\
    \ 있는 은빛 덩어리, 마나석을 바라보며 내적인 갈등이 시작되었다.  마치 자신이 만든 작은 마법 지구를 보고 있다는 듯한 낯선 존재감이 그녀에게\
    \ 스쳐갔다.\n- “내가 이게 어떻게 만들 수 있는지…” 차하린은 속으로 생각했다. \n -"
