chapter_n: 11
overall: '축제 다음 날, 하린은 어둠 속에서 발견한 균열을 다시 찾아간다. 균열이 안정화되는 조건을 분석하며, 이계에서 물건을 들여올 수 있는 ''수입 통로''로 활용할 방법을 모색한다. 처음으로 이계에서 현실로 물건을 직접 가져오는 데 성공한다.'
beats:
- name: intro
  instruction: '이 부분은 회차 시작. 분량 1,800자 이상.
    - 주인공의 이른 아침 묘사로 시작: 축제의 여파로 몸이 무겁지만, 균열이 머릿속을 떠나지 않는 건조한 독백.
    - 핵심 공간 묘사: 축제가 끝나고 썰렁해진 마을 광장. 남은 천막, 바닥에 흩어진 쓰레기, 아침 안개. (시각: 흐릿한 풍경 / 후각: 남은 음식 냄새와 이슬 내음 / 청각: 고요함).
    - 등장 인물: 마을 청년 (호칭: ''청년''). 축제 뒷정리 중. 하린에게 가벼운 인사.
    - 대사 2~3개: 청년과의 대화. (예: "축제는 즐거우셨소?" / "적당히요." / "내년엔 더 크게 한답니다.")
    - 마지막 줄: 광장을 지나 숲으로 향하며, 어제 발견한 균열의 위치를 떠올리며 다음 비트로 진입.'
- name: development
  instruction: '이 부분은 회차 중반. 분량 1,800자 이상.
    - 핵심 사건: 숲 속 균열을 재발견. 어제보다 안정화된 상태. 하린이 균열에 손을 뻗자, 저쪽 차원의 풍경이 희미하게 보임 — 이계의 시장, 낯선 건축물, 다른 하늘 색깔.
    - 감각적 묘사: 균열 너머에서 불어오는 바람의 온도가 다름. 이계의 공기 냄새 — 금속성, 흙내, 알 수 없는 향기.
    - 행동: 하린이 균열을 통해 작은 물건(이계의 동전이나 광물 조각)을 현실로 끌어당기는 데 성공. 물건이 손에 닿는 순간 미세한 충격파.
    - 내적 독백: 수입 통로가 확보되면 본격적인 양방향 무역이 가능. 건조하게 이익을 계산.
    - 대사 1~2개: 혼잣말. (예: "열어두면 쓸모가 있겠군.")
    - 마지막 줄: 물건을 끌어온 순간 균열이 일시적으로 확대되며, 무언가가 이쪽을 ''봤다''는 느낌을 받아 다음 비트로 넘어감.'
- name: climax
  instruction: '이 부분은 회차 마지막. 분량 1,800자 이상.
    - 결정적 장면: 시스템 메시지 등장 — [수입 통로 활성화 / 안정도 31% / 이계 물질 반입 성공] — 하린은 수치를 분석하며 본격적인 무역의 첫발을 확인.
    - 감정 정점: 처음으로 이계에서 현실로 물건을 가져온 성취감. 기쁨이 아닌 ''예상대로''라는 건조한 확신.
    - 행동: 가져온 물건을 분석. 현실의 어떤 가치와도 비교할 수 없는 이계의 밀도를 확인.
    - 대사 1~2개: 자신에게 건조하게 선언. (예: "이제 시작이다.")
    - 마지막 문장: 균열이 다시 축소되지만 완전히 닫히지는 않으며, 하린이 균열의 리듬을 이해하기 시작했음을 보여주는 클리프행어.'
