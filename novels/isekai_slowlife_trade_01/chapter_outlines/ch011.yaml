chapter_n: 11
overall: 다연은 이계의 흐름이 단순한 마나의 흐름 이상이며, 현실의 법도가 존속하는 근거를 뒤흔들었음을 깨달았다. 그녀는 이계의 흐름을 통제하려는
  시도가 현실의 법칙과 충돌하며 예상치 못한 부작용을 목격했고, 이는 단순한 마나 조작을 넘어선 존재의 근원을 뒤섞는 행위가 현실의 법칙을 뒤흔들었음을
  의미했다. 실험을 중단했음에도 불구하고, 그녀는 이계의 흐름이 현실의 흐름과 얽혀 있음을 직감했다. 이계의 흐름은 현실의 물리적 제약과 마나의
  흐름을 동시에 반영하고 있었다. 다연은 이계의 흐름을 통제하려는 시도가 현실의 법칙과 충돌하며 예상치 못한 부작용을 목격했고, 이는 단순한 마나
  조작을 넘어선 존재의 근원을 뒤섞는 행위가 현실의 법칙을 뒤흔들었음을 의미했다. 실험을 중단했음에도 불구하고, 그녀는 이계의 흐름이 현실의 흐름과
  얽혀 있음을 직감했다. 이계의 흐름은 현실의 물리적 제약과 마나의 흐름을 동시에 반영하고 있었다. 다연은 이계의 흐름을 통제하려는 시도가 현실의
  법칙과 충돌하며 예상치 못한 부작용을 목격했고, 이는 단순한 마나 조작을 넘어선 존재의 근원을 뒤섞는 행위가 현실의 법칙을 뒤흔들었음을 의미했다.
beats:
- name: intro
  instruction: '이 부분은 회차 시작. 분량 1,800자 이상.

    - 허다연의 내적 자조/현실에 대한 냉소적인 독백 1줄로 시작.

    - 실험 장소의 공간 묘사 (시각 2 + 후각/청각 1). 차가운 금속 냄새, 희미한 마나의 잔향, 낡은 실험 장비의 질감 묘사.

    - 허다연이 이계의 흐름이 현실의 물리적 제약과 마나의 흐름을 동시에 반영한다는 직감에 도달하는 과정을 건조하게 서술.

    - 허다연이 이계의 흐름을 통제하려는 시도가 현실의 법칙과 충돌하며 예상치 못한 부작용을 목격하는 미세한 충돌의 징후를 관찰하는 묘사.

    - 실험을 중단했음에도 불구하고, 이계의 흐름이 현실의 흐름과 얽혀 있음을 직감하는 다연의 냉정한 분석을 담는다.

    - 마지막 줄: 다음 비트로 넘기는 미세한 위기 신호, 이계의 흐름이 현실의 흐름과 얽혀 있다는 직감에 대한 확신.

    },'
- name: development
  instruction: '이 부분은 회차 중반. 분량 1,800자 이상.

    - 다연이 이계의 흐름을 통제하려는 시도가 현실의 법칙과 충돌하며 예상치 못한 부작용을 목격하는 구체적인 사건 발생(동작 단위 묘사). 마나
    조작이 단순한 흐름 조작을 넘어 존재의 근원을 뒤섞는 행위가 현실의 법칙을 뒤흔들었음을 목격하는 과정에 집중.

    - 실험 장비에서 발생하는 비정상적인 에너지 파동과 현실 세계의 물리적 제약과 마나의 흐름이 동시에 반영되는 현상을 감각적으로 묘사하며, 통제
    불능 상태에 대한 긴장감을 고조.

    - 다연이 실험을 중단했음에도 불구하고, 이계의 흐름이 현실의 흐름과 얽혀 있음을 직감하는 내적 독백을 통해 현실의 물리적 제약이 마나의 흐름을
    동시에 반영한다는 사실을 분석하는 과정.

    - 이계의 흐름이 현실의 물리적 제약과 마나의 흐름을 동시에 반영한다는 분석에 대한 논리적 충돌과 예상치 못한 부작용에 대한 냉정한 평가를
    담는다.

    - 마지막 줄: 다음 비트로 넘기는 충돌의 심화, 이계의 흐름이 현실의 흐름과 얽혀 있다는 직감에 대한 확신.

    },'
- name: climax
  instruction: '이 부분은 회차 마지막. 분량 1,800자 이상.

    - 다연이 이계의 흐름을 통제하려는 시도가 현실의 법칙과 충돌하며 예상치 못한 부작용을 목격하고, 단순한 마나 조작을 넘어 존재의 근원을 뒤섞는
    행위가 현실의 법칙을 뒤흔들었음을 깨닫는 결정적인 순간의 심리적 충격과 지적 깨달음의 순간을 극단적으로 묘사.

    - 실험 중단에도 불구하고, 이계의 흐름이 현실의 흐름과 얽혀 있음을 직감하는 다연의 냉정한 분석이 폭발하는 순간을 심리적 고조시키며, 이계의
    흐름이 현실의 물리적 제약과 마나의 흐름을 동시에 반영한다는 사실을 직시하는 순간의 지적 충격.

    - 이계의 흐름이 현실의 흐름과 얽혀 있다는 직감에 대한 확신을 최종적으로 확인하며, 다연이 이계의 흐름을 통제하려는 시도가 현실의 법칙과
    충돌하며 예상치 못한 부작용을 목격하고, 이는 단순한 마나 조작을 넘어 존재의 근원을 뒤섞는 행위가 현실의 법칙을 뒤흔들었음을 깨닫는 장면을
    강렬하게 마무리.

    - 마지막 줄: 다음 화로 넘기는 강한 후크/클리프행어, 현실과 이계의 경계를 뒤흔드는 다연의 깨달음과 그로 인해 발생하는 파국적 결과를 암시하며
    다음 비트로 넘어감.'
