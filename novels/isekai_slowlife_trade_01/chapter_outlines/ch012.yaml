chapter_n: 12
overall: 다연은 이계의 흐름이 단순한 마나의 흐름 이상이며, 현실의 법도가 존속하는 근거를 뒤흔들었음을 깨달았다. 그녀는 이계의 흐름을 통제하려는
  시도가 현실의 법칙과 충돌하며 예상치 못한 부작용을 목격했고, 이는 단순한 마나 조작을 넘어선 존재의 근원을 뒤섞는 행위가 현실의 법칙을 뒤흔들었음을
  의미했다. 실험을 중단했음에도 불구하고, 그녀는 이계의 흐름이 현실의 근간을 뒤흔들고 있음을 직감했다. 그녀는 이계의 흐름이 현실의 근간을 뒤흔들고
  있음을 직감했고, 이 흐름을 통제하려는 시도가 현실의 법칙과 충돌하며 예상치 못한 부작용을 목격했다. 이계의 흐름은 단순한 마나 조작을 넘어선
  존재의 근원을 뒤섞는 행위가 현실의 법칙을 뒤흔들었음을 의미했다. 실험을 중단했음에도 불구하고, 그녀는 이계의 흐름이 현실의 근간을 뒤흔들고 있음을
  직감했다. 다연은 이계의 흐름이 현실의 근간을 뒤흔들고 있음을 직감했고, 이 흐름을 통제하려는 시도가 현실의 법칙과 충돌하며 예상치 못한 부작용을
  목격했다. 이제 그녀는 이 흐름을 어떻게 다룰지 결정해야 했다. 그녀의 선택은 현실과 이계의 경계를 완전히 무너뜨릴 수 있는 첫걸음이 될 터였다.
beats:
- name: intro
  instruction: '이 부분은 회차 시작. 분량 1,800자 이상.

    - 허다연의 내면 묘사: 이계의 흐름이 현실의 법도와 충돌하는 것에 대한 근원적인 혼란과 직감.

    - 핵심 공간 묘사: 실험실 또는 고립된 공간의 미세한 진동, 차가운 공기의 촉각 묘사.

    - 첫 사건: 이계의 흐름을 통제하려는 시도가 현실의 법칙과 충돌하며 발생하는 예상치 못한 부작용의 구체적인 관찰.

    - 등장 인물 + 호칭("다연 씨")

    - 시각/촉각 묘사: 흐릿해지는 공간의 경계, 손끝에 느껴지는 비정상적인 에너지의 질감.

    - 대사: 실험 중단에도 불구하고 계속되는 흐름에 대한 다연의 냉소적인 반응.

    - 마지막 줄: 이계의 흐름이 현실의 근간을 뒤흔들고 있다는 직감과, 이 흐름을 다룰 선택의 필요성 제시.'
- name: development
  instruction: '이 부분은 회차 중반. 분량 1,800자 이상.

    - 핵심 사건 발생: 이계의 흐름의 역류와 현실의 법칙에 대한 충돌이 물리적인 형태로 나타나는 구체적인 현상 묘사.

    - 신체 감각: 다연이 느끼는 정신적 압박감, 신체 내부에서 발생하는 마나의 역류와 뒤섞임의 고통.

    - 새 정보 발견: 이계의 흐름이 단순한 마나 조작을 넘어선 존재의 근원을 뒤섞는 행위가 현실의 법칙을 뒤흔들었다는 과학적/존재론적 해석.

    - 등장 인물 + 호칭("다연")

    - 청각/촉각 묘사: 실험 장비가 불안정하게 울리는 소리, 피부를 찌르는 듯한 에너지의 압력.

    - 대사: 통제 불가능한 현상에 대한 다연의 분석과 실험 중단 결정에 대한 망설임.

    - 마지막 줄: 흐름을 통제하려는 시도가 현실의 법칙과 충돌하며 예상치 못한 부작용을 목격했고, 이제 그녀는 이 흐름을 어떻게 다룰지 결정해야
    한다.'
- name: climax
  instruction: '이 부분은 회차 마지막. 분량 1,800자 이상.

    - 결정적 장면: 다연이 이계의 흐름을 통제하는 방법을 모색하는 결정적인 순간, 현실과 이계의 경계를 무너뜨릴 수 있는 선택을 앞둔 심리적
    갈등.

    - 감정 정점: 통제 불가능한 힘에 대한 공포와, 그 힘을 이용해 현실의 제약을 파괴할 수 있다는 광기 어린 기대감의 충돌.

    - 최종 선택: 현실과 이계의 경계를 무너뜨릴 수 있는 첫걸음으로 이계의 흐름을 다루기로 결정하는 순간의 결단.

    - 마지막 문장: 이 흐름을 다루는 것이 현실과 이계의 경계를 완전히 무너뜨릴 수 있는 첫걸음이 될 터였다.'
