chapter_n: 12
overall: '하린은 이계에서 가져온 물건을 마을에서 처음으로 ''진짜 거래''에 활용한다. 장인에게 이계의 재료를 제공하고, 현실의 물건을 받는 교환을 성사시키며 거래 시스템이 작동하는 원리를 체득한다.'
beats:
- name: intro
  instruction: '이 부분은 회차 시작. 분량 1,800자 이상.
    - 주인공의 아침 정리로 시작: 이계에서 가져온 물건을 테이블 위에 올려두고 관찰하는 무심한 시선.
    - 핵심 공간 묘사: 하린의 거처. 아침 햇살이 비치는 소박한 방. 테이블 위의 이계 물건이 빛을 받아 미묘하게 반짝임. (시각: 물건의 이질적 색감 / 촉각: 차가운 금속 감촉 / 후각: 미세한 오존 냄새).
    - 행동: 물건의 특성을 분석하는 건조한 과정. 무게, 밀도, 반응성을 하나씩 기록.
    - 대사 1~2개: 혼잣말. (예: "현실 기준으로는 분류가 안 되는군.")
    - 마지막 줄: 장인의 작업장으로 향하며, 이 물건을 활용할 거래를 구상하는 독백과 함께 다음 비트로 진입.'
- name: development
  instruction: '이 부분은 회차 중반. 분량 1,800자 이상.
    - 핵심 사건: 장인의 작업장에서 이계 재료를 건네며 거래 제안. 장인은 재료의 특성에 놀라지만, 오랜 경험으로 이를 다룰 수 있다고 판단.
    - 거래 협상: 장인이 만들어줄 물건의 종류를 논의. 하린은 실용적인 도구를 요구, 장인은 예술성을 주장. 건조한 타협 과정.
    - 등장 인물: 마을 장인 (호칭: ''장인님''). 이계 재료를 처음 만져보며 미묘한 반응. 손끝이 떨리는 것을 숨기려 함.
    - 대사 3~4개: 활발한 협상 대화. (예: "이 재료는 내가 다루기 어렵소." / "해보시죠." / "대신 조건이 있소." / "말씀하세요.")
    - 감각적 묘사: 장인이 이계 재료를 망치로 두드리자, 일반 금속과는 다른 맑은 소리가 울림. 불꽃이 푸른빛을 띰.
    - 마지막 줄: 가공이 시작되는 순간, 작업장 전체에 미세한 진동이 퍼지며 현실의 법칙이 국지적으로 흔들리는 것을 하린이 감지.'
- name: climax
  instruction: '이 부분은 회차 마지막. 분량 1,800자 이상.
    - 결정적 장면: 장인이 완성한 도구를 하린에게 건넴. 현실의 재료와 이계의 재료가 융합된 물건. 겉보기엔 평범하지만, 내부에 이계의 에너지가 응축되어 있음.
    - 시스템 연출: [이계-현실 융합 거래 완료 / 존재론적 간섭도 2.1% / 교환 가치: 비표준] — 하린은 이 수치가 의미하는 바를 분석.
    - 감정 정점: 거래가 성사된 순간의 건조한 만족. 장인은 자신이 무언가 특별한 일을 했다는 느낌을 받지만 정확히 모름.
    - 대사 1~2개: 장인의 반응. (예: "이런 건물은 처음 만들어보오." / 하린: "잘 쓰겠습니다.")
    - 마지막 문장: 하린이 작업장을 나설 때, 장인이 만든 도구에서 미세한 빛이 새어 나오며, 이 도구가 현실의 질서에 어떤 영향을 미칠지 암시하는 클리프행어.'
