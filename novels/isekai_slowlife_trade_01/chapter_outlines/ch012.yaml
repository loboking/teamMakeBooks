chapter_n: 12
overall: '{

  "ch012": "내가 이걸 만든다고 생각해보면 신기하겠다." 차하린은 마나석을 이용해 만들어진 작은 빛나는 구슬을 주시하며 말했다.  마린이
  가르쳐준 방법으로는 마법 지구를 만들 수 없지만, 마나석의 에너지를 이용하여 작고 일시적인 광택 효과를 내는 것은 가능했다. 그러나 차하린에게
  이것은 더 이상 단순한 경험이 아니었다. 그녀의 손끝에서 생겨나는 희미한 빛은 그녀를 이계와 현실 세계, 그리고 두 세계 사이의 어려운 연결고리로
  끌어들이고 있었다. 마치 자신의 내면 속에 은밀히 숨겨진 무엇을 찾아가는 것 같았다."

  }'
beats:
- name: intro
  instruction: '비트 도입 — 회차 시작부 (분량 1,800자+, 한국 웹소설 톤)


    이 회차 줄거리:

    {

    "ch012": "내가 이걸 만든다고 생각해보면 신기하겠다." 차하린은 마나석을 이용해 만들어진 작은 빛나는 구슬을 주시하며 말했다.  마린이
    가르쳐준 방법으로는 마법 지구를 만들 수 없지만, 마나석의 에너지를 이용하여 작고 일시적인 광택 효과를 내는 것은 가능했다. 그러나 차하린에게
    이것은 더 이상 단순한 경험이 아니었다. 그녀의 손끝에서 생겨나는 희미한 빛은 그녀를 이계와 현실 세계, 그리고 두 세계 사이의 어려운 연결고리로
    끌어들이고 있었다. 마치 자신의 내면 속에 은밀히 숨겨진 무엇을 찾아가는 것 같았다."

    }


    위 줄거리를 한국 웹소설 톤으로 본문 1,800자+ 작성. 직전 비트와 사건 중복 금지. 시각·청각·촉각 묘사 포함. 대사 1~2개.'
- name: development
  instruction: "차하린은 마나석을 이용해 만들어진 작은 구슬을 주시하며 말했다. 그녀의 손끝에서 생겨나는 작고 일시적인 광택 효과는 이계와\
    \ 현실 세계를 연결하는 고리처럼 느껴졌다.  마법 지구를 만들 수 없지만, 마나석을 이용한 작은 빛은 차하린에게 특별히 의미있는 존재였다.\
    \ \n\n'이게 진짜 마법일까?' 차하린은 입으로 속삭이며 마법의 광채가 스며드는 순간, 그녀의 심장속에 어딘가 불편함이 들었다.  마치\
    \ 익숙하지만 다시 만나는 것 같은 복잡한 감정이 그녀를 뒤덮으며 몸이 차갑게 오르막길을 타고 내려갔다.\n\n'괜찮아.' \n차하린은 마음속에서\
    \ 자신을 위로했다. '무슨 일이든 이제부터는 그저... 지나갈 거야.'"
