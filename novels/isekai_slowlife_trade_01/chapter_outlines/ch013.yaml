chapter_n: 13
overall: '{"ch013": "차하린은 마나석의 에너지를 활용해 섬광을 만들 수 있다는 것을 알게 된 뒤, 이를 이용하여 주변 환경에 미세한
  변화를 일으키려고 노력했다. 작은 조명 효과를 창출하는 것은 쉽지만, 더 큰 영향력을 행사하기 위해서는 더욱 정밀한 기술이 필요하다는 것을 느꼈다.
  마린의 말처럼 마나석의 에너지는 현실에 미칠 수 있는 잠재력을 가지고 있었지만, 그 규모는 차하린의 상상을 뛰어넘었다.  그래도 그녀는 포기하지
  않았다. ''현실과 이계를 연결하는 방법은 더 있다.''라고 생각하며 지금까지 얻은 정보들을 토대로 새로운 방법을 찾아나갔다."}'
beats:
- name: intro
  instruction: '차하린은 마나석을 손에 들며 가볍게 속삭였다.“오늘은 이걸 좀 더 작동시켜봐야 할 것 같아.”

    - 주변 환경:  마지막 퇴근 후 아직 깨끗하게 유지된 집 방. 거실의 창문 너머로 노을이 지고 있는 모습이 보인다. 오후 늦은 시간을 알리는
    달빛이 은하수처럼 문짝으로 들어온다.

    -  마린의 목소리

    - 대사:'
