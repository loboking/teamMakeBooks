chapter_n: 13
overall: 다연은 이계의 흐름이 단순한 마나의 흐름 이상이며, 현실의 법도가 존속하는 근거를 뒤흔들었음을 깨달았다. 그녀는 이계의 흐름을 통제하려는
  시도가 현실의 법칙과 충돌하며 예상치 못한 부작용을 목격했고, 이는 단순한 마나 조작을 넘어선 존재의 근원을 뒤섞는 행위가 현실의 법칙을 뒤흔들었음을
  의미했다. 실험을 중단했음에도 불구하고, 그녀는 이계의 흐름이 현실의 법칙과 충돌하며 예상치 못한 부작용을 목격했고, 이는 단순한 마나 조작을
  넘어선 존재의 근원을 뒤섞는 행위가 현실의 법칙을 뒤흔들었음을 의미했다. 다연은 이계의 흐름을 통제하려는 시도가 현실의 법칙과 충돌하며 예상치
  못한 부작용을 목격했고, 이는 단순한 마나 조작을 넘어선 존재의 근원을 뒤섞는 행위가 현실의 법칙을 뒤흔들었음을 의미했다. 그녀는 이계의 흐름이
  현실의 법칙과 충돌하며 예상치 못한 부작용을 목격했고, 이는 단순한 마나 조작을 넘어선 존재의 근원을 뒤섞는 행위가 현실의 법칙을 뒤흔들었음을
  의미했다.
beats:
- name: intro
  instruction: '이 부분은 회차 시작. 분량 1,800자 이상.

    - 허다연의 내적 자조/냉소적인 독백 1줄로 시작하며, 이계의 흐름에 대한 근본적인 의문을 던진다.

    - 공간 묘사: 이계의 흐름이 현실의 법도와 충돌하는 지점의 시각적, 청각적 묘사를 집중적으로 하여 불안정함을 강조한다.

    - 첫 인물 등장: 허다연의 주변 환경과 그녀의 상태를 관찰하는 시점 제시.

    - 감각 묘사: 마나의 흐름이 현실의 물리 법칙과 충돌하며 발생하는 미세한 물리적 왜곡(시각적 왜곡, 미세한 열감)을 촉각과 청각으로 묘사한다.

    - 대사: 허다연의 냉소적인 반응과 이계의 흐름에 대한 비아냥거림을 포함한다.

    - 마지막 줄: 이계의 흐름을 통제하려는 시도가 현실의 법칙과 충돌하며 예상치 못한 부작용을 목격했다는 미세한 위기 신호로 마무리하며 다음
    비트로 넘어간다.'
- name: development
  instruction: '이 부분은 회차 중반. 분량 1,800자 이상.

    - 핵심 사건 발생: 허다연이 이계의 흐름을 통제하려는 실험을 중단했음에도 불구하고, 현실의 법칙과 충돌하며 예상치 못한 부작용을 목격하는
    과정의 구체적인 동작 단위 묘사를 상세히 한다.

    - 신체 감각: 마나 조작 과정에서 발생하는 신체적 통증, 존재의 근원이 뒤섞이는 듯한 기묘한 감각, 현실의 물리 법칙이 붕괴되는 순간의 촉각
    묘사를 강조한다.

    - 정보 발견: 단순한 마나 조작을 넘어선 존재의 근원을 뒤섞는 행위가 현실의 법칙을 뒤흔들었음을 깨닫는 결정적인 순간의 내적 독백을 삽입한다.

    - 주변 환경 변화: 실험 장치 주변의 공간이 미세하게 뒤틀리는 시각적 묘사를 통해 이계의 흐름이 현실의 법칙과 충돌하는 물리적 부작용을 시각화한다.

    - 마지막 줄: 그녀는 실험을 중단했음에도 불구하고 이계의 흐름이 현실의 법칙과 충돌하며 예상치 못한 부작용을 목격했고, 이는 단순한 마나
    조작을 넘어선 존재의 근원을 뒤섞는 행위가 현실의 법칙을 뒤흔들었음을 의미한다.'
- name: climax
  instruction: '이 부분은 회차 마지막. 분량 1,800자 이상.

    - 결정적 장면: 허다연이 이계의 흐름을 통제하려는 시도가 현실의 법칙과 충돌하며 발생한 예상치 못한 부작용을 목격하고, 그 충격과 공포를
    극복하는 과정을 극적으로 묘사한다.

    - 감정 정점: 통제 불가능한 현상에 직면했을 때의 극도의 혼란과 냉소적인 수용이 뒤섞인 감정의 정점을 보여준다.

    - 최종 인식: 단순한 마나 조작을 넘어선 존재의 근원을 뒤섞는 행위가 현실의 법칙을 뒤흔들었음을 깨닫는 지점의 충격적인 인식을 강조한다.

    - 마지막 줄: 허다연은 이계의 흐름이 현실의 법칙과 충돌하며 예상치 못한 부작용을 목격했고, 이는 단순한 마나 조작을 넘어선 존재의 근원을
    뒤섞는 행위가 현실의 법칙을 뒤흔들었음을 의미한다.'
