chapter_n: 13
overall: '하린이 마을에서 거래를 확대하던 중, 이계의 균열을 통해 처음으로 ''외부 존재''의 흔적이 감지된다. 균열 너머에서 누군가 하린의 거래를 관찰하고 있었음을 알게 되며, 무역가로서의 첫 위기가 시작된다.'
beats:
- name: intro
  instruction: '이 부분은 회차 시작. 분량 1,800자 이상.
    - 주인공의 일상 묘사로 시작: 장인에게 받은 도구를 사용해 마을의 작은 수리 작업을 도우며, 거래 네트워크가 자연스럽게 확장되고 있음을 확인.
    - 핵심 공간 묘사: 마을의 오래된 다리. 하린이 장인의 도구로 수리하는 중. (시각: 맑은 물, 이끼 낀 돌 / 청각: 물 흐르는 소리, 망치 소리 / 후각: 시원한 물내).
    - 등장 인물: 마을 주민 (호칭: ''아주머니''). 하린의 솜씨에 감탄하며 대화.
    - 대사 2~3개: 아주머니와의 대화. (예: "솜씨가 좋으시네요." / "도구가 좋아서 그래요." / "어디서 난 도구요?")
    - 마지막 줄: 수리를 마치고 숲 쪽을 보는 순간, 균열 방향에서 미세하게 공기가 흔들리는 것을 감지하며 다음 비트로 진입.'
- name: development
  instruction: '이 부분은 회차 중반. 분량 1,800자 이상.
    - 핵심 사건: 균열 위치로 돌아가 확인. 균열의 안정도가 변동 중 — 누군가 반대편에서 간섭하고 있다는 증거. 균열 너머로 그림자나 움직임이 스쳐 지나감.
    - 행동 묘사: 하린이 균열 주변에 간이 관측 장치(돌과 나뭇가지를 활용한 원시적 표시)를 설치하여 간섭의 패턴을 기록.
    - 감각적 묘사: 균열에서 들려오는 소리 — 바람 소리가 아닌, 누군가의 발소리나 숨소리 같은 미세한 음향.
    - 내적 독백: 관찰자가 관찰당하는 상황에 대한 건조한 분석. 위협인지 기회인지 판단 보류.
    - 대사 1~2개: 자신에게 던지는 질문. (예: "누가 보고 있는 거지?" / "아직은 아무것도 모른다.")
    - 마지막 줄: 균열 반대편에서 미세한 소리 — 분명 인위적인 무언가가 움직이는 소리 — 가 들려오며 다음 비트로 넘어감.'
- name: climax
  instruction: '이 부분은 회차 마지막. 분량 1,800자 이상.
    - 결정적 장면: 시스템 메시지 등장 — [경고: 미확인 관찰자 활동 감지 / 균열 안정도 변동: 31% → 28% / 외부 간섭 확률: 중간] — 하린은 위기 상황을 건조하게 분석.
    - 감정 정점: 처음으로 느끼는 긴장감. 두려움이 아닌, 거래의 판이 예상보다 복잡하다는 인식. 혼자가 아닐 수 있다는 사실.
    - 행동: 균열의 안정화를 위해 이계 물질 하나를 균열에 투입. 일시적으로 간섭이 멈추고 균열이 안정됨.
    - 대사 1~2개: 건조한 결심. (예: "서투르면 위험하다." / "준비가 먼저다.")
    - 마지막 문장: 균열 너머의 관찰자가 물러난 것 같지만, 하린은 자신의 거래 활동이 이계에서 주목받기 시작했음을 직감하며, 더 큰 위협이나 기회가 다가오고 있음을 암시하는 클리프행어.'
