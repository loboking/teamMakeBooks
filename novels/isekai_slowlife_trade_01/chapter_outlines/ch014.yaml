chapter_n: 14
overall: '외부 관찰자의 존재를 인지한 하린은 거래 전략을 수정한다. 마을 사람들에게 들키지 않게 거래를 은밀하게 전환하면서도, 균열을 통한 수입을 유지하는 방법을 강구한다. 그 과정에서 이계의 언어를 일부 해독하는 단서를 얻는다.'
beats:
- name: intro
  instruction: '이 부분은 회차 시작. 분량 1,800자 이상.
    - 주인공의 새벽 묘사로 시작: 잠을 설친 밤, 균열 너머의 관찰자 생각에 건조하게 전략을 세우는 독백.
    - 핵심 공간 묘사: 이른 새벽의 마을. 안개 낀 골목, 아직 깨지 않은 창문들. (시각: 흐릿한 풍경 / 후각: 이슬 내음 / 청각: 드문드문 닭 울음소리).
    - 행동: 거처에서 이계 물품들을 숨기는 작업. 일상 속에 자연스럽게 섞이도록 배치.
    - 대사 1~2개: 혼잣말. (예: "노출을 최소화해야 한다.")
    - 마지막 줄: 숨겨둔 이계 물품 중 하나에서 이전에 보지 못한 문양이 떠오르며 다음 비트로 진입.'
- name: development
  instruction: '이 부분은 회차 중반. 분량 1,800자 이상.
    - 핵심 사건: 이계 물품의 문양을 분석하다, 이계의 언어 체계 일부를 해독. 문양은 숫자와 기호가 조합된 형태이며, 거래의 가치와 조건을 기록한 ''계약서'' 같은 것임을 발견.
    - 등장 인물: 마을의 노인 (호칭: ''어르신''). 하린의 거처 근처를 지나며 이상한 기운을 감지. 건조한 대화로 하린을 시험함.
    - 대사 2~3개: 어르신과의 긴장된 대화. (예: "요즘 뭔가 달라졌소?" / "달라진 건 없는데요." / "그래, 조심하시오.")
    - 행동: 문양 해독에 몰두하면서도, 동시에 노인의 시선을 의식하며 은밀함을 유지하는 이중적인 행동.
    - 감각적 묘사: 문양을 읽는 순간 머릿속에 이계의 정보가 흘러들어오는 감각. 차갑고 날카로운 정보의 흐름.
    - 마지막 줄: 해독한 문양의 마지막 줄 — ''균열의 관리자는 거래의 균형을 지켜야 한다'' — 을 읽으며, 자신에게 주어진 역할의 무게를 인지하고 다음 비트로 넘어감.'
- name: climax
  instruction: '이 부분은 회차 마지막. 분량 1,800자 이상.
    - 결정적 장면: 시스템 메시지 등장 — [이계 언어 해독율: 7% / 계약 조항 감지: ''균형 의무'' / 관리자 권한: 조건부] — 하린은 자신이 단순한 거래자가 아니라 균열의 관리자 후보일 수 있음을 깨달음.
    - 감정 정점: 깨달음에 대한 건조한 반응. 두려움이 아닌, ''규칙을 알면 게임을 할 수 있다''는 차가운 분석.
    - 행동: 은밀한 거래 체계를 정비. 마을에서의 활동을 일상으로 위장하면서, 균열을 통한 거래는 최소화.
    - 대사 1~2개: 자신에게 건조하게 선언. (예: "균형을 지키면 되는 거군.")
    - 마지막 문장: 밤하늘을 올려다보는 하린의 눈에, 별들 사이로 미세한 균열이 보이며, 하늘에도 경계가 존재한다는 사실과 함께 거대한 무역 무대의 윤곽이 드러나는 클리프행어.'
