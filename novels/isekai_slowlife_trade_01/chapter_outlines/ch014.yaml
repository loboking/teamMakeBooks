chapter_n: 14
overall: 다연은 이계의 흐름이 단순한 마나의 흐름 이상이며, 현실의 법도가 존속하는 근거를 뒤흔들었음을 깨달았다. 그녀는 이계의 흐름을 통제하려는
  시도가 현실의 법칙과 충돌하며 예상치 못한 부작용을 목격했고, 이는 단순한 마나 조작을 넘어선 존재의 근원을 뒤섞는 행위가 현실의 법칙을 뒤흔들었음을
  의미했다. 실험을 중단했음에도 불구하고, 그녀는 이계의 흐름이 현실의 법칙과 얽혀 있음을 직감했다. 그녀는 이계의 흐름이 현실의 법도와 충돌할
  때 발생하는 비정상적인 에너지의 파동을 인지했고, 이를 무시할 수 없었다. 이계의 근원적인 흐름이 현실의 법칙과 얽혀 있다는 사실은 그녀가 추구하던
  통제 이상의 영역에 도달했음을 의미했다. 다연은 이계의 흐름이 현실의 법칙과 얽혀 있음을 직감했고, 통제 불가능한 에너지를 마주하며 새로운 각성을
  예고받았다.
beats:
- name: intro
  instruction: '이 부분은 회차 시작. 분량 1,800자 이상.

    - 주인공 다연의 내적 독백 톤 1줄로 시작하며 이계의 흐름에 대한 근원적인 깨달음을 제시.

    - 실험 장소의 미세한 환경 묘사 (시각 2 + 후각/청각 1)와 현재의 정지된 상태를 대비시켜 슬로우 라이프의 역설을 강조.

    - 이계의 흐름이 현실의 법도와 얽혀 있다는 직감을 구체적인 물리적 현상(에너지 파동)으로 포착하는 과정을 묘사.

    - 다연이 통제 불가능한 에너지의 파동을 무시할 수 없음을 인지하고, 실험을 중단했음에도 불구하고 그 흐름이 현실의 법칙과 얽혀 있음을 직감하는
    과정을 심층적으로 서술.

    - 이계의 근원적인 흐름이 현실의 법칙과 얽혀 있다는 사실이 그녀가 추구하던 통제 이상의 영역에 도달했음을 깨닫는 지점을 강조하며, 새로운
    각성을 예고받는 분위기를 조성하며 다음 비트로 넘어간다.'
- name: development
  instruction: '이 부분은 회차 중반. 분량 1,800자 이상.

    - 이계의 흐름이 현실의 법칙과 충돌할 때 발생하는 비정상적인 에너지의 파동을 다연이 직접 인지하고 이를 분석하는 과정을 구체적인 감각 묘사(촉각/청각)로
    서술.

    - 통제 불가능한 에너지의 흐름이 단순한 마나 조작을 넘어선 존재의 근원을 뒤섞는 행위가 현실의 법칙을 뒤흔들었음을 논리적으로 추론하는 내적
    사고의 흐름을 심화시킨다.

    - 실험을 중단했음에도 불구하고 이계의 흐름이 현실의 법칙과 얽혀 있다는 직감을 뒷받침하는 구체적인 에너지 파동의 패턴과 현실의 법칙이 뒤틀리는
    현상을 시각화하여 묘사한다.

    - 다연이 이계의 흐름이 현실의 법도와 충돌할 때 발생하는 비정상적인 에너지의 파동을 인지하고, 이를 무시할 수 없음을 인식하며, 이계의 근원적인
    흐름이 현실의 법칙과 얽혀 있다는 사실을 증명하는 데이터를 분석하는 과정을 상세히 묘사한다.'
- name: climax
  instruction: '이 부분은 회차 마지막. 분량 1,800자 이상.

    - 다연이 통제 불가능한 에너지의 파동을 마주하며 새로운 각성을 예고받는 순간의 극도의 긴장감과 혼란을 생생하게 묘사한다.

    - 이계의 흐름이 현실의 법칙과 얽혀 있다는 직감이 물리적 현실을 압도하는 에너지의 충돌을 통해 폭발하는 순간을 극적으로 연출한다.

    - 다연이 통제 불가능한 에너지를 마주하는 순간, 단순한 마나 조작을 넘어선 존재의 근원을 뒤섞는 행위가 현실의 법칙을 뒤흔들었음을 깨닫는
    결정적인 순간을 강렬한 감각적 충격으로 표현한다.

    - 다연이 이계의 흐름이 현실의 법칙과 얽혀 있음을 직감하고, 통제 불가능한 에너지를 마주하며 새로운 각성을 예고받는 순간의 압도적인 감정적
    전환을 폭발시킨다.

    - 마지막 문장: 통제 불가능한 에너지의 파동 속에서, 다연은 현실과 이계의 경계가 완전히 무너지는 새로운 각성의 문턱에 선다.'
