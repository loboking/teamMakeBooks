chapter_n: 14
overall: '{"ch014": "차하린은 마나석의 에너지를 활용하여 작은 조명 효과를 만들 수 있지만, 더 큰 영향력을 행사하기 위해서는 더욱
  정밀한 기술이 필요했다고 느꼈다. 마치 뜨거운 물방울을 이 모습으로는 현실에 직접적으로 투영할 수 없다는 것을 깨달은 것 같았다. 그때, 마린의
  말 "마나석은 마법 지구를 만들지 못하지만, 에너지를 활용하여 다른 방식으로 현실을 변화시킬 수 있다"가 생각났다. 차하린은 마나석에 담긴 에너기를
  압축하고 집중시키는 방법을 찾아 괴로워했다. 이게 성공하면… 그녀는 마음속에 그 이미지를 새겨두고, 마지막으로 한번 더 시도해 보려는 자신감이
  생겼다."}'
beats:
- name: intro
  instruction: "- 차하린은 손으로 마나석을 돌리며, '아직 작다'고 속삭였다.\n-  현실 세계의 방에서 이계를 연결하는 창문이 크게\
    \ 넓어졌지만, 여전히 짙푸른빛 에테르로 가득차 있었다. 차하린은 천장에 걸려있는 아래쪽으로 향한 장판 형태의 에너지 구조물을 바라보며  시각\
    \ 자극 없이는 이계의 진짜 모습을 볼 수 없는 빈틈이 있다는 것을 알았다.\n- 마치 어두운 방에서 불빛만 살짝 내려왔듯이, 이 창문은 단순히\
    \ 시야 확장뿐만 아니라 이계의 에너지를 받아들이고 변환하는 역할을 한다는 것을 알게 되었다.  \n- '마린 언니 말했지… 마나석은 작은\
    \ 조명 효과도 만들 수 있지만, 현실에 직접 영향을 미치려면 더욱 정밀한 기술이 필요하다.' \n- 차하린은 마린의 말을 떠올리며 창문으로부터\
    \ 내뿜어지는 이계 에테르를 향해 손을 뻗었다."
- name: development
  instruction: '- 차하린은 마나석에 담긴 에너지를 압축하고 집중시키려고 노력했다. 그녀의 손가락 사이로 가스처럼 흐르는 푸른빛 에테르는
    힘이 강해질수록 점점 더욱 불안정해졌다.

    -'
