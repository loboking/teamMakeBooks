chapter_n: 15
overall: '{"ch015": "마린의 말에 따라 차하린은 마나석을 이용해 작은 조명 효과를 만들 수 있었다. 하지만 그 에너지를 더욱 섬세하게
  조작하여 현실에 직접적으로 영향을 미치려고 노력했다. 마리네에서 온 자료 분석에 따르면, 마나석의 에너지 사용법은 고대 이계 사람들의 기록과 유사한
  점이 있었다. 차하린은 오래된 책을 찾아 밤낮으로 연구하며 마나석을 이용한 마법 공식을 파악하기 시작했다.  단순히 조명 효과를 만들어내는 것
  이상의 가능성에 대한 기대와 불안감이 교차하면서, 차하린은 더욱 집중해 연구했다. "'
beats:
- name: intro
  instruction: ‘밤낮으로 연구하는 건 지쳐도 될까?’ 마나석을 들고 생각하며 차하린은 방에 있는 서랍 속에서 오래된 책들을 찾아내었다.
    작은 창 틈으로 들어오는 불빛이 낡은 책들이 가득한 책상 위를 비추고 있었고, 황금색의 연기가 섞인 진한 커피향이 차하린 주변을 감싸고 있었다.
    마리네에서 온 자료 분석에 따르면 이계의 물건들을 이용하는 방법은 고대 이계 사람들의 기록과 유사한 점이 많았다. “마나석으로 램프를 만든다는
    건…”, 차하린은 입을 열고 말했다.
- name: development
  instruction: “만약 그걸 더 세밀하게 조작하면 현실에 직접적인 영향을 줄 수 있을까?
