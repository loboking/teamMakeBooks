chapter_n: 15
overall: '하린은 처음으로 이계의 존재와 직접적인 접촉을 시도한다. 균열 너머에서 목소리가 들려오고, 하린은 이계의 거래 상대와 첫 대화를 나눈다. 양방향 무역의 가능성이 현실로 다가오는 한편, 거래의 대가에 대한 근본적인 질문이 제기된다.'
beats:
- name: intro
  instruction: '이 부분은 회차 시작. 분량 1,800자 이상.
    - 주인공의 밤 묘사로 시작: 잠들 수 없는 밤, 균열을 향해 걸어가는 하린의 건조한 독백. 관찰자에게 먼저 다가가기로 결심.
    - 핵심 공간 묘사: 밤의 숲. 달빛이 나뭇가지 사이로 내려오는 풍경. (시각: 은빛 숲, 균열의 미세한 빛 / 후각: 차가운 밤공기 / 청각: 풀벌레 소리, 균열의 미세한 진동음).
    - 행동: 균열 앞에 앉아 대기. 이계 물질을 하나 손에 쥐고, 접촉의 매개체로 준비.
    - 대사 1~2개: 균열을 향해 건네는 말. (예: "거기 누군가 있습니까.")
    - 마지막 줄: 균열 너머에서 처음으로 또렷한 반응 — 미세한 빛의 변화와 함께 — 이 돌아오며 다음 비트로 진입.'
- name: development
  instruction: '이 부분은 회차 중반. 분량 1,800자 이상.
    - 핵심 사건: 균열 너머에서 목소리가 들려옴. 이계의 언어지만, 시스템을 통해 부분적으로 번역되어 하린에게 전달. 상대는 이계의 상인 — 하린과 같은 ''관찰자'' 포지션.
    - 첫 대화: 단편적이고 조심스러운 정보 교환. 서로의 존재를 확인하고, 거래의 가능성을 탐색.
    - 감각적 묘사: 목소리를 들을 때의 감각 — 귀가 아닌 몸 전체로 울리는 듯한 진동. 이계 언어의 이질적인 리듬.
    - 내적 독백: 이 상대가 적인지 아군인지 판단 불가. 정보를 최소한으로 제공하면서 상대를 분석하는 건조한 사고.
    - 대사 3~4개: 균열 너머의 존재와의 첫 대화. (예: "당신은 누구요?" / [번역]''...관문 너머의 작은 자...'' / "거래를 원하시나요?" / [번역]''...교환의 가능성을...탐색한다...'')
    - 마지막 줄: 상대가 거래의 조건으로 하나의 질문을 던지며 — "대가는 무엇으로 지불할 수 있나?" — 하린이 답을 고민하며 다음 비트로 넘어감.'
- name: climax
  instruction: '이 부분은 회차 마지막. 분량 1,800자 이상.
    - 결정적 장면: 하린이 대가로 ''현실의 정보''를 제안. 이계에서는 얻을 수 없는 현실 세계의 데이터(날씨, 계절, 생명의 순환)를 거래 대상으로 내걸음.
    - 시스템 연출: [이계 통신 확립 / 거래 프로토콜 초안 / 양방향 교환 가능성: 확인] — 첫 이계 거래 파트너와의 연결이 성립.
    - 감정 정점: 혼자가 아니라는 사실에 대한 복잡한 감정. 동시에 거래의 대가가 무엇을 의미하는지에 대한 건조한 경계심.
    - 대사 1~2개: 마지막 교환. (예: "다음에 다시 이야기하죠." / [번역]''...기다리겠다...'')
    - 마지막 문장: 균열이 조용히 닫히고, 하린은 숲을 빠져나오며 처음으로 진짜 거래 상대를 만났다는 사실을 건조하게 되새기고, 양방향 무역의 시대가 시작되었음을 예고하는 강렬한 클리프행어.'
