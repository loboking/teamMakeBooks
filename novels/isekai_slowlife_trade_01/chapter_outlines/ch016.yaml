chapter_n: 16
overall: '{"ch016": "고대 이계 사람들의 기록을 분석하면서 차하린은 마나석의 에너지를 활용하는 방법 중 하나가 ‘시각화’라는 것을
  발견했다. 시각화는 마나석의 에너지를 집중하여 현실 세계에 투영하는 기술이었다. 하지만 이계 사람들의 기록은 너무 낡아 이해하기 어려웠고, 차하린은
  지금까지 학습한 내용을 바탕으로 시각화를 실험하려 했다.  마나석의 에너지를 조절하며 손가락 끝에 작은 불꽃처럼 은색의 점점을 만들어내는 데 성공했다.
  그러나 이것은 아직 단순한 마력 사용에 불과했고, 마법 지구를 만들거나 현실 세계에 직접적인 영향을 미치지는 못했다. 차하린은 답답함과 동시에
  설레기를 느꼈다. 이계의 기록이 가르쳐주는 것은 아직 완벽하지 않았지만, 그녀는 진리에 한 걸음 더 다가갈 수 있다고 자신했다."}'
beats:
- name: intro
  instruction: 차하린은 아침 해가 비치는 창문으로부터 슬쩍 눈을 떴다. 이계의 날씨는 항상 평온했지만, 오늘 아침에는 어느 정도 달라졌다는
    느낌이 들었다. 맑고 투명한 공기 중에 부드러운 향기가 불어오며 나무들이 살랑살랑 흔들리고 있었고, 새들의 노랫소리가 이계의 조용함을 더욱
    아름답게 만들었다.
- name: development
  instruction: '비트 마무리 — 회차 climax + 후크 (분량 1,800자+)


    이 회차 줄거리:

    {"ch016": "고대 이계 사람들의 기록을 분석하면서 차하린은 마나석의 에너지를 활용하는 방법 중 하나가 ‘시각화’라는 것을 발견했다.
    시각화는 마나석의 에너지를 집중하여 현실 세계에 투영하는 기술이었다. 하지만 이계 사람들의 기록은 너무 낡아 이해하기 어려웠고, 차하린은 지금까지
    학습한 내용을 바탕으로 시각화를 실험하려 했다.  마나석의 에너지를 조절하며 손가락 끝에 작은 불꽃처럼 은색의 점점을 만들어내는 데 성공했다.
    그러나 이것은 아직 단순한 마력 사용에 불과했고, 마법 지구를 만들거나 현실 세계에 직접적인 영향을 미치지는 못했다. 차하린은 답답함과 동시에
    설레기를 느꼈다. 이계의 기록이 가르쳐주는 것은 아직 완벽하지 않았지만, 그녀는 진리에 한 걸음 더 다가갈 수 있다고 자신했다."}


    위 줄거리를 한국 웹소설 톤으로 본문 1,800자+ 작성. 직전 비트와 사건 중복 금지. 시각·청각·촉각 묘사 포함. 대사 1~2개.'
