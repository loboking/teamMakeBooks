chapter_n: 17
overall: '{"ch017": "시각화를 시도하면서 차하린은 마나석의 에너지를 손에 집중했다. 마나석에서 뿜어져 나오는 에너지는 아직 불안정하고
  끊기지만, 그의 의지와 노력이 점점 더 정확한 제어로 이어지고 있었다. 하지만 마법책에는 시각화를 완성하기 위해 필요한 최종 단계의 설명이 부재했다.  차하린은
  고대 이계 사람들의 기록을 탐색하며 그 결론에 도달했다. 그는 ''시각화''가  단순히 에너지를 투영하는 것이 아니라, 마음속의 상상력을 현실로
  만들어내는 것임을 알아냈다. 차하린은 마나석의 에너지와 자신의 의지를 결합하여 그 안에 답변이 있다고 생각했지만,  그 과정에서 어려움을 겪었다.
  그는 자신만의 방식으로 시각화를 완성하기 위해 노력해야 하는 상황이였다." }'
beats:
- name: intro
  instruction: "-  '내 인생은 이제 2년 동안 멍청하게 게임하느라 시간을 보낸 것처럼 느껴진다.' 차하린이 마나석을 손에 들고, 고향의\
    \ 방 안에 펼쳐진 거대한 게임 화면을 바라보았다. \n-  © 시각: 황백빛으로 반짝이는 마나석과 그 주변에 흩어져 있는 모래 조각들이 눈에\
    \ 띄고, 거대한 게임 화면은 어둠 속에서 오롯이 화려한 파란색을 내뿜는다. \n-  후각: 진흙의 냄새와 마나석에서 나는 약간의 금속향이\
    \ 함께 섞여 있다.  © 청각: 게임 화면의 배경 음악은 여전히 차분하지만, 오른쪽 하단에 위치한 메시지 창 위로 흐르는 작고 매끄러운 소리가\
    \ 들린다.\n- 등장인물 + 첫 호명 (호칭표 따름): 이준씨\n-  짧은 대사: '이준 씨, 아직도 뭔가 이상한 거 없니?' \n- 마지막\
    \ 줄: 차하린은 잠시 동안 주위를 살펴보며 속삭였다."
- name: development
  instruction: "- 핵심 사건 1~3개 (구체적·동작 단위):  차하린이 손을 크게 움직이며 마나석의 에너지를 불어넣고, 그 에너지가\
    \ 화면 위로 올라오며 반짝이는 파도 모양으로 변한다. \n-  신체 감각: 차하린은 마나석에서 나오는 에너지에 의해 가슴이 뛰는 것을 느끼고,\
    \ 그의 손에는 시원하고 차갑게 스며드는 기분의 전류가 흐르기 시작했다.\n- 내적 독백 1~2줄: '아직은 이렇게 불안정하게...'. 차하린은\
    \ 미련한 마음으로 그 파도 모양을 응시하며 속삭였다. \n- 새 정보 발견 (단서/메모/시스템 메시지): 화면이 반짝이며, 게임 화면 아래쪽에\
    \ 새로운 메시지가 나타났다: '마나석의 에너지를 활용하기 위해서는 시각화 단계를 완성해야 합니다.'. \n  - 마지막 줄: 차하린은 그\
    \ 메시지를 보고 몸을 가만히 두었다."
