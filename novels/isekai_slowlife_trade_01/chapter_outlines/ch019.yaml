chapter_n: 19
overall: '{"ch019": "차하린은 마나석의 에너지를 자신의 몸에 끌어들이는 연습을 계속했다. 처음에는 불안정했던 에너지 흐름이 점점 더
  안정되고 강력해졌다. 그는 마법책에서 설명된 ''채택'' 기술을 통해 마나석의 에너지를 자신의 체내로 통합하는 방법을 익히고 있었다. 그러나 새로운
  문제가 발생했다. 마나석의 에너지가 너무 강해서 그의 신체에 부담을 주기 시작했으며, 가끔은 통증이 느껴졌다. 이를 해결하기 위해 차하린은 고대
  이계 사람들의 기록을 더욱 깊이 파고들었다. 그곳에서 그는 ''마나석과의 조화''를 이루는 방법에 대한 정보를 찾아냈다. 이 기술은 마나석의 에너지를
  자신의 몸으로 완벽하게 통합하고, 오히려 자신을 강화하는 방식이었다."}'
beats:
- name: intro
  instruction: 차하린은 마나석의 에너지를 자신의 몸에 끌어들이는 연습을 계속했다. 작고 어두운 방, 창문에는 고대 문자로 새겨진 그림이
    그려져 있고 가끔 불이 타오르면 벽면에서 그림자가 길게 드리워졌다.  '마나석의 에너지가 너무 강력해서 나를 무너뜨릴까?' ' 아니요, 내가
    마나석을 꺾고 제압해야겠어.' 이준씨는 문 앞에 서서 차하린을 바라보며
- name: development
  instruction: 차하린은 마나석의 에너지를 자신의 몸에 끌어들이는 연습을 계속했다. 처음에는 불안정했던 에너지 흐름이 점점 더 안정되고
    강력해졌다. '채택' 기술을 통해 마나석의 에너지를 자신의 체내로 통합하는 방법을 배우고 있었다.  그러나 그 과정에서 차하린은 감각기관에
    심한 압박감을 느꼈다.  눈앞이 번쩍이고 손가락 끝까지 저리치는 통증이 그의 신체를 뒤흔들었다. '마나석과의 조화'를 이루는 방법, 고대 이계
    사람들의 기록에서 찾아낼 수 있다고 믿으며 차하린은 더욱 열정적으로 검색을 시작했다.
