chapter_n: 20
overall: 다연은 이계의 흐름이 현실의 흐름과 엮여 있다는 직감을 더욱 확고히 했다. 그녀는 이계의 흐름을 통제하려는 시도가 현실의 법칙과 충돌하며
  예상치 못한 부작용을 목격했고, 이는 단순한 마나 조작을 넘어선 존재의 근원을 뒤섞는 행위가 현실의 법칙을 뒤흔들었음을 의미했다. 실험을 중단했음에도
  불구하고, 그녀는 이계의 흐름이 현실의 흐름과 엮여 있음을 직감했다. 이 인식은 그녀에게 새로운 실험의 방향을 제시했다. 그녀는 이계의 흐름을
  완전히 끊어내려 하기보다, 현실의 법칙과 이계의 흐름이 상호작용하는 지점을 탐색하기로 결정했다. 다연은 현실의 물리적 제약과 이계의 마나 흐름이
  교차하는 지점에 집중하며, 이 두 흐름이 만들어내는 새로운 형태의 현상을 관찰하기 시작했다. 이는 단순한 마나 조작을 넘어선, 현실과 이계의 경계를
  탐색하는 새로운 무역의 시작점이었다.
beats:
- name: intro
  instruction: '이 부분은 회차 시작. 분량 1,800자 이상.

    - 허다연의 내적 자조/냉소적인 일상 톤 1줄로 시작.

    - 실험 중단 후에도 이계의 흐름이 현실의 흐름과 엮여 있다는 직감의 심화 묘사.

    - 실험 중단 과정에서 발생한 물리적/마나적 부작용에 대한 냉정한 분석.

    - 현실의 물리적 제약과 이계의 마나 흐름이 교차하는 지점에 대한 집중 묘사.

    - 다연이 현실의 법칙과 이계의 흐름이 상호작용하는 지점을 탐색하기로 결정하는 심리적 과정.

    - 이계의 흐름을 완전히 끊어내려 하기보다, 현실의 법칙과 이계의 흐름이 상호작용하는 지점을 탐색하기로 결정하는 결정의 순간을 섬세하게 묘사.

    - 현실의 물리적 제약과 이계의 마나 흐름이 교차하는 지점에 집중하며, 이 두 흐름이 만들어내는 새로운 형태의 현상을 관찰하기 시작하는 시각적
    묘사.

    - 마지막 줄: 현실과 이계의 경계가 미세하게 흔들리는 감각.

    - 핵심 사건 1~3개: 실험 장비의 정지 후에도 이계의 흐름이 현실의 흐름과 엮여 있음을 확인. 마나 조작을 넘어선 존재의 근원을 뒤섞는
    행위가 현실의 법칙을 뒤흔들었음을 직감. 현실과 이계의 경계가 미세하게 흔들리는 감각.'
- name: development
  instruction: '이 부분은 회차 중반. 분량 1,800자 이상.

    - 다연이 현실의 물리적 제약과 이계의 마나 흐름이 교차하는 지점에 집중하며, 이 두 흐름이 만들어내는 새로운 형태의 현상을 관찰하는 과정의
    상세한 묘사.

    - 이계의 흐름을 완전히 끊어내려 하기보다, 현실의 법칙과 이계의 흐름이 상호작용하는 지점을 탐색하기로 결정한 행동의 논리적 전개와 그 과정에서
    발생하는 복잡한 마나적 충돌의 상세한 묘사.

    - 현실의 물리적 제약과 이계의 마나 흐름이 교차하는 지점에 집중하며, 이 두 흐름이 만들어내는 새로운 형태의 현상을 관찰하는 과정에서 다연이
    발견하는 미세한 현상들에 대한 과학적이고 건조한 분석.

    - 이계의 흐름을 완전히 끊어내려 하기보다, 현실의 법칙과 이계의 흐름이 상호작용하는 지점을 탐색하는 과정에서 발생하는 마나적 충돌의 물리적,
    감각적 묘사.

    - 다연이 발견하는 미세한 현상들에 대한 과학적이고 건조한 분석을 통해, 단순한 마나 조작을 넘어선, 현실과 이계의 경계를 탐색하는 새로운
    무역의 시작점이 어떤 논리적 근거를 얻는지에 대한 논리적 전개.

    - 현실과 이계의 경계가 미세하게 흔들리는 감각.'
- name: climax
  instruction: '이 부분은 회차 마지막. 분량 1,800자 이상.

    - 다연이 현실과 이계의 경계를 탐색하는 새로운 무역의 시작점을 구체적으로 설정하고, 현실의 물리적 제약과 이계의 마나 흐름이 교차하는 지점에
    집중하는 구체적인 실험 설계와 그 실행 과정의 긴장감 넘치는 묘사.

    - 현실과 이계의 경계가 미세하게 흔들리는 감각이 실제 실험을 통해 물리적으로 증명되는 과정의 긴장감과 그 결과로 발생하는 예상치 못한 현상에
    대한 상세한 묘사.

    - 새로운 무역의 시작점이라는 개념이 실제 실험을 통해 현실의 법칙을 흔들기 시작하는 구체적인 물리적 증명 과정의 상세한 묘사.

    - 이계의 흐름을 완전히 끊어내려 하기보다, 현실의 법칙과 이계의 흐름이 상호작용하는 지점을 탐색하는 과정에서 발생하는 마나적 충돌이 현실의
    법칙을 뒤흔들기 시작하는 순간의 폭발적인 감각적 묘사.

    - 다연이 이계의 흐름을 완전히 끊어내려 하기보다, 현실의 법칙과 이계의 흐름이 상호작용하는 지점을 탐색하는 과정에서 발생하는 마나적 충돌이
    현실의 법칙을 뒤흔들기 시작하는 순간의 폭발적인 감각적 묘사.

    - 다음 화로 넘기는 강한 후크/클리프행어: 현실의 법칙이 완전히 파괴되는 순간, 다연이 새로운 무역의 시작점을 통해 이계의 흐름을 통제하려는
    시도가 현실의 법칙을 뒤흔들기 시작하는 순간의 폭발적인 감각적 묘사.'
