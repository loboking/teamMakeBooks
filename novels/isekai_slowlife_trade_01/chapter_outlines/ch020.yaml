chapter_n: 20
overall: '{"ch020": "마나석의 에너지가 너무 강해서 그의 신체에 부담을 주기 시작했으며, 혼자서는 해결할 방법을 찾지 못했다. 차하린은
  마법책에 적힌 ‘채택’ 기술이 자신에게 맞는지 의심하기 시작했다. 그는 이계의 전문가들에게 도움을 요청하기로 결심했지만, 누구에게 어떻게 말해야
  할지 몰랐다. 그때, 고등학생으로서의 시간이 여전히 남았다는 사실을 기억했다. 이계와 현실 세계를 연결하는 것은 마법석과 자신의 에너지 흐름만
  있는 것이 아닐 수도 있다는 생각이 떠올랐다. 그는 현실에서 받은 교육과 경험을 바탕으로 이계의 문제에 접근해보려고했다.  " }'
beats:
- name: intro
  instruction: "‘마나석은 지금쯤에 내 몸과 완벽하게 연결되었을 거야.’ 차하린은 이계의 바람에 살아가며 깊이 있는 생각에 잠겼다. \
    \ \n햇살 투성이의 나무 정원에서는 꽃향기와 새소리가 조화를 이루었고, 은빛 잎사귀는 부드러운 광선을 받으며 반짝였다. 차하린은 마나석의\
    \ 에너지가 자신의 몸에 스며들면서 느끼는 강렬한 따스함과 시원함이 공존하는 현상에 대해 생각했다. 그는 의자에 앉아 눈을 감고, 마법책을\
    \ 읽으려던 순간 이준씨의 목소리가 들렸다. “차하린-야, 아직도 그 책만 보는 거야?” \n  “뭐? 아니요, 그냥 생각이 많았어.”"
- name: development
  instruction: ‘채택’ 기술은 마나석의 에너지를 더욱 효과적으로 활용하는 방법이었지만, 차하린이 지금 느끼는 불쾌한 감각은 이 기술 때문일
    수도 있다. 그는 마법책에 적힌 설명을 꼼꼼히 살피며 자신의 상황을 분석했다.  마나석의 에너지가 너무 강해서 그의 신체에 부담을 주기 시작했으며,
    혼자서는 해결할 방법을 찾지 못했다. 차하린은 이계의 전문가들에게 도움을 요청하기로 결심했지만, 누구에게 어떻게 말해야 할지 몰랐다.  그는
    마법석에 담긴 에너지를 더욱 강화하는 방향으로 연구를 진행하고 있었고, 그 과정에서 자신만의 독특한 에너지 흐름을 만들어냈다. “혹시 이계의
    전문가들이 이 에너지를 이해할 수 있는지…”  차하린은 고등학생으로서 남은 시간이 여전히 있다는 사실을 기억했다. 그를 비추고 바라보는 무대의
    빛에 어색함을 느끼며, 그는 속삭였다.“나는 이계와 현실 세계를 연결하는 것은 마법석과 자신의 에너지 흐름만 있는 것이 아닐 수도 있다.
