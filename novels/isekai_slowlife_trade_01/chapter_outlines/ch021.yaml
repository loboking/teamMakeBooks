chapter_n: 21
overall: '{"ch021": "차하린은 친구들에게 이계의 물건을 대여하면 현실에서 도움이 될 수 있음을 알렸고, 그들의 호기심을 유발했다.
  마법책에 적힌 까다로운 ''마나석 채택'' 기술을 정확히 이해하기 위해, 차하린은 친구들에게 이계로의 여행 경험과 조언을 구했다. 친구들은 그의
  어려움을 알아주고 도움을 주려는 의지가 있었지만, 이계의 위험성에 대해 경고하며 막연한 불안감을 표현했다. 차하린은 그들의 말을 신경 쓰며 마법책의
  내용을 한 번 더 꼼꼼하게 살펴보았다. 친구들과 함께 이 문제를 해결하기 위한 새로운 방법을 찾아야만 한다는 생각이 들었다."}'
beats:
- name: intro
  instruction: "‘어떻게 이 마나석 채택 기술을 설명해줘야 할까?’ 차하린은 복잡한 글귀가 적힌 마법책을 가만히 바라보며 깊은 생각에\
    \ 잠겼다.  고등학교 3학년이면 어제처럼 지루한 일상을 계획하는 시간도 없는데, 이계의 무언가를 얻기 위해 그런 귀찮은 작업까지 해야 한다니\
    \ 씁쓸했다. 책상 위로 나오는 차량 소음과 옆집에서 들리는 아이들의 목소리만 끊임없이  그늘을 어두게 만든다.\n\n '하린아, 이게 무슨\
    \ 내용인데?’ 이준씨가 손으로 책을 가라앉히며 의지하는 모습은 힘내려고 애쓰는 듯 보였다. ‘나도 잘 이해 안 돼… 마법책에 적힌 설명이\
    \ 너무 어렵다.’\n '마나석 채택 기술이란 무슨 일이고?’, 이준씨가 다시 물었다.\n 차하린은 짧게 대답하며 책을 내려놓고, 생각의 끝자락에서\
    \ 발견한 고요함에 빠져들었다. ‘마법책 말대로 마나석을 얻어야 하는데… 어떻게?’"
- name: development
  instruction: '''이준 씨'' ''지혜, 연주! 내 방으로 와봐!’ 차하린은 지쳐도 한결 같던 이루는 자신을 두고 잠시 돌려보았다.
    ‘나에게 희망의 그림자 같은 존재들이 주변에 있다는 사실이야’ ,  “차하린아, 마법책을 보면서 무슨 일이 일어났니?” 지혜가 말했다. “내가
    뭔소리 하는지 알겠냐고?” 차하린은 내부에서 불안한 감정을 느끼며 마법책을 다시 한번 열었다. ''마나석 채택'' 기술의 설명이 더욱 복잡해
    보인다. ‘아무래도 이 부분만 빼면 나라가 정복당하는 것 같으니, 조금은 가치 있겠는지’ 차하린이는 마법책에 적힌 내용을 다시 한번 읽고 내부에서
    불안한 감정을 느끼며 자신에게 질문했다. ‘하지만 이렇게 힘들어도 이걸 해야 할까?’ 그는 책상 위의  작은 돋보기로 마법책의 설명을 자세히
    살펴보았다. 마지막으로, 마법책에 적힌 단서가 눈에 띄었다. ‘마나석 채택’ 기술에는 ''사랑하는 사람''에게 주어질 수 있다는 내용이 적혀
    있었다.'
