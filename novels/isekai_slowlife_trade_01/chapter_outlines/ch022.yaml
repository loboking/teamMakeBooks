chapter_n: 22
overall: '{"ch022": "친구들의 조언은 다양했지만, 이계의 위험성을 강조하는 목소리가 지배적이었다. 특히 민혁은 이계에서 만난 어두운
  존재들에 대해 경고하며 차하린에게 주의를 촉구했다. 그의 말들은 차하린에게 불안한 그림자를 드리우며 마나석 채택을 위한 용기를 더욱 약화시켰다.
  하지만 친구들의 진심은 그를 이끌어주었고, 새로운 결정을 내릴 수 있도록 도왔다. 그는 이계의 전문가들을 찾기로 했지만, 누구에게 어떻게 말해야
  할지 고민이었다.  차하린은 마음속으로 ''전통적인 방법''이라고 생각했던 그의 행동 방식과 현실에서 바라보는 이계에 대한 의존도 사이의 갈등을
  느꼈다."}'
beats:
- name: intro
  instruction: 차하린은 학교 주변의 카페에서 커피를 마시며 이계에 대한 정보 검색을 계속했다. - 현실과 이계의 경계가 어려운 인물이라는
    소문과 연관된 '마나석 채택' 에 대해 더 알아야 했지만 그 내용은 찾기 힘들었다. 고급스러움을 자랑하는 카페에서 불어오는 향긋한 커피 정향,
    그리고 주변으로 흐르는 사람들의 소음이 들리며 차하린의 머릿속은 복잡해졌다.
- name: development
  instruction: 친구들과 함께 방문했던 이계에서 만난 '어두운 존재'에 대한 민혁의 경고가 떠올라. 그는 내면의 불안감을 조절하며 카페
    테이블 위 휴대폰 화면을 더욱 집중했다.
