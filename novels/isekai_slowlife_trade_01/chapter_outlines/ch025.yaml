chapter_n: 25
overall: '{"ch025": "민혁의 조언은 차하린에게 큰 영향을 미쳤지만, 그를 좌절시키기보다는 새로운 도전심을 불어넣었다. ''어두운 존재''에
  대한 경각심이 더욱 커진 그는 이계에서 얻는 잠재력과 위험 사이의 균형점을 찾아야 할 필요성을 깨닫게 되었다. 마나석 채택 시, 자신만의 방식으로
  어두운 존재들과 대면하고 이계의 진실을 파헤쳐보고자 했다. 차하린은 민혁에게 용기를 얻어 현실 세계로 돌아와 마나석 채택 준비를 시작한다.  그곳에서
  그는 예상치 못한 정보에 접하게 되는데, 그것은 ''마나석''과 더불어 이계의 진실을 밝히는 열쇠를 지니고 있다는 것을 보여주었다. 차하린은 어두운
  존재와 마나석 채택 사이에서 새로운 갈등을 맞이한다."}'
beats:
- name: intro
  instruction: '''아무래도 이게 마나석 채택 준비라니''라는 생각을 하자마자 차하린은 현실의 고압된 공기를 느껴 들었다. 시각적으로
    좁고 어두운 방이었지만, 그저 앉아있던 것만으로는 더 이상 안타까웠다. 그는 자서전처럼 간단히 쓰인 ''어둠''으로 가득한 마음을 알 수 있었다.  ''민혁은
    내가 이계로 들어가기 전에 말했지…'
- name: development
  instruction: 차하린이 숨쉬는 것만으로도 그 공기를 느낄 수 있었던 것이었다. 그들의 지각, 감각을 정리하고 있는 상태에서 잡고 싶은
    정보를 찾고 있다. '마나석 채택'라는 단어에 대한 생각이 들지 않으려 해 보았다. 마지막으로 민혁의 말을 새겨넣기 위해 노력했다.  내가
    이계로 들어갈 때, 우리는 정말 웃긴 대화를 나누었다. '마나석 채택은 내게 쉬운 일이겠지만, 네게는 어려울 수도 있다'라고 했던 것처럼…
    차하린의 생각이 중단되었다. 그의 눈을 가득 채운 것은 이계에서 보내왔던 모든 시간의 영상들이었다. 그는 그 모든 것을 집중하는 데에만 신경
    쓰고 있었다. 잊지 않으려고 노력했다. '차하린', 자신은 누구인가?'라고 잡아먹는다고 느꼈다.',
