chapter_n: 26
overall: '{"ch026": "민혁의 조언에 따라 차하린은 이계에서 마나석 채택을 시도했다. 하지만, 예상과 달리 쉽게 얻을 수 없었다.  마나석에
  대한 경쟁이 치열했고, 어두운 존재들이 그를 속시편으로 삼으려는 음모까지 발견되었다. 차하린은 혼란스럽고 위협적인 상황 속에서도 민혁에게 주신
  조언을 기억하며 이계의 진실을 파헤치기 위해 용기를 내었다. 그는 어두운 존재들의 숨겨진 그림자를 뒤쫓으며, 마나석을 얻는 길에 드러난 이계의
  위험한 진실을 알아가려 한다."}'
beats:
- name: intro
  instruction: "-  '이게 뭔가... 어렵겠다.' 차하린은 마나석 채굴 현장을 바라보며 속삭였다. \n - 시원한 바람은 차분하고 은은하게,\
    \ 그러나 산비탈의 기암벽과 고요한 분위기는 역경이 가득했다.\n  - 푸르고 생동감 넘치는 들꽃과 갈색 석회암 사이에 위치한 마나석 채굴\
    \ 현장. \n - '아직 혼잡하지 않군' 이준씨가 입을 열었다. 햇빛이 투성인 날, 바람은 그 면으로 일어나는 눈부신 잎소리를 만들었다.\n\
    - '하지만 이게 진짜 마나석 채굴 장소라니...' \n - 즉시 다음과 같은 흥미로운 사건이 발생합니다."
- name: development
  instruction: "- 차하린은 조심스럽게 땅을 파고 있었다. 두꺼운, 검은색의 돌덩이를 발견하면서 손가락 끝이 잠시 통증을 느꼈다. '마나석...?'\
    \ \n - 차하린은 마음속으로 자신에게 말했다. 그리고 그의 가슴은 불안한 감각에 휩싸였다.\n- '도협적으로 보이는 분위기.'\n - \
    \ '저쪽에서 무언가 이상하다...' 이준씨는 눈동자를 살짝 피부로 삼아 정면으로 나아갔다. \n - 두 사람은 마나석 채굴 현장이 주변의\
    \ 시야를 막고 있는 것을 알았다. 그것은 작은, 어둡게 보이는 천체에 의해 만들어졌고, 차가운 녹색 빛을 분산시켰다.\n- '그림자...\
    \ 그림자가 살짝 움직여.'"
