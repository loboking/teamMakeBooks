chapter_n: 27
overall: '{ "ch027": "마나석 채택이라는 어두운 존재들의 목표를 알게 된 차하린은 자신을 둘러싼 위험성을 더욱 직시하게 되고, 민혁의
  조언에 따라 이계에서 마나석 채취를 시도했다. 그는 어두운 존재들에게 속지 않고 자신의 지각으로 정답을 찾아야 한다는 결심을 강화하는 등 혼란과
  두려움 속에서도 새로운 도전심이 불타오르게 된다. 하지만 그가 마나석 채취에 성공하기까지의 여정은 예상보다 어렵고 위험한 길로 이어지는데, 그의
  앞서 나선 전략을 저해하려는 숨겨진 존재들의 음모를 발견하게 되고..." }'
beats:
- name: intro
  instruction: “아니야, 내가 이걸 만든 게 맞을까? 아니면 저건 내게 주려는 거겠지?” 차하린은 마나석 채취 장소로 향하는 길목에서
    멍하니 바라보고 있었다. 그의 시선을 가리키는 곳은 언덕 위에 솟아 있는 이계의 마술 광산, 검정빛 돌들이 모여있어 보이는 곳이었다.  공중에는
    황금빛 에너지가 은은하게 흐르며 그곳만을 향한 특유의 시원함이 감도리 들썩거렸다.
- name: development
  instruction: 차하린은 이준씨에게 마나석 채취에 대한 조언을 받고 그 지역으로 이동했다. 그는 어두운 존재들의 목표가 '마나석'과 관련되어
    있다는 것을 알게 되자, 그의 머리 속에는 깊은 불안감이  따랐다. 이준씨의 말처럼, 마나석 채취를 통해 자신을 보호할 수도 있고, 더 나아가
    이계에서 살아남기 위한 방법을 찾을 수도 있다는 생각이 들었다.
