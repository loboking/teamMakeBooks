chapter_n: 28
overall: '{ "ch028": "차하린은 마나석 채취를 위한 첫 번째 시도로 숲 가장자리에 위치한 ''희망의 화원''을 찾아갔다. 그곳에서
  그는 마나석 채오와 함께 이계의 생물들과의 교류를 경험하고, 이계의 자연순환 원리를 파악하기 시작했다. 하지만 어느날 밤, 차하린은 희망의 화원
  주변을 지키던 고대 나무에 ''만약 당신이 마나석을 얻기 위해서는...''라는 신비로운 메시지를 받고, 그의 마음속에 새로운 의문이 생길 만했다.
  이로 인해 차하린은 숲 속의 진실과 마나석 채취를 연결하는 힌트를 찾아 끊임없는 전망을 유지하게 되는데..." }'
beats:
- name: intro
  instruction: '- 차하린은 ''희망의 화원''에 가기 전, 마나석 채취 관련 정보를 검색하며 자신감을 높여주었다. -  숲 가장자리에는
    햇살이 드는 잔디밭과 작고 피치가 아지른 어두운 나무들이 함께 자라고 있었다. 시각적인 대조와 함께 흙의 냄새와 나뭇잎 사이로 흐르는 바람
    소리가 불편하지 않은 조화를 만들어냈다. -'
- name: development
  instruction: '- 차하린이 마나석 채취 시기가 지났을 때, 나무에 붙어있는 이름표 ''희망의 화원''을 발견했다.   -  주변에는
    다른 나무들만 보였다. 만약 당신이 마나석을 얻기 위해서는...'
