chapter_n: 29
overall: '{"ch029": "고대 나무의 메시지는 차하린을 비무장한 상태로 두고 마나석 채취를 위한 준비, 즉 ''도전''이라는 시험의 시작임을
  알리는 것 같았다. 그는 혼자 속으로 들어갈 수 없다는 사실에 절망감과 동시에 무언가 새로운 것을 배우고 싶어하는 기분이 들었다. 이게 그의 마법이자
  이계 생존 전략인 ''도전''의 시작일까? 차하린은 마나석 채취를 위한 과정을 시작하기 위해 고대 나무의 메시지를 해독하고, 숲 속으로 더 깊숙이
  들어갔다."}'
beats:
- name: intro
  instruction: "- 차하린은 이계의 낯선 바람을 마시며, '도전'이란 단어가 그의 머릿속을 자꾸 맴돌았다. \n- 그는 고대 나무 아래에\
    \ 선 채석판 위로 뻗어나간 근사한 지상면과 나무의 살랑이는 줄무늬를 바라본다.\n  *지금부터 이계에서 시작되는 내 도전은 어떤 모습일까?*\
    \ 차하린은 가볍게 코웃음을 터뜨렸다.\n- 숲 속에서는 노란색 날개를 가지고 있는 작은 새들이 하늘에 날갯짓하며, 그들의 노랫소리가 살랑이는\
    \ 바람의 속삭임과 뒤섞여 들려왔다. \n - 이준씨가 나무 아래에서 자리를 차리고 주변을 돌아본다.\n- \"어떻게 시작해야 할까?\",\
    \ 이준씨가 낮은 목소리로 물었다.\n  - 마나석 채취의 시험, '도전'... 차하린은 자신의 운명에 대한 미지수를 맞이하는 신비로운 기분에\
    \ 가득했다."
- name: development
  instruction: "- 차하린은 고대 나무 밑에서 나뭇가지를 사용하며 지면을 파낸다.\n- 그의 손에는 시각화된 마나석 채취 장소를 나타내는\
    \ 메시지가 담긴 투명한 구슬이 있었다. 그는 그 안의 빛에 따라 깊숙이 파고들었지만, 고기로 부풀어 오르는 통증을 느끼며 중간중간 멈춰야\
    \ 했다.\n- *아직 내 감각과 이계의 에너지가 조화를 이뤄내지는 않았구나*. 차하린은 고개를 갸웃거렸다. \n- 메시지가 점점 더 강력해졌고,\
    \ 나무의 근원적인 에너지를 느끼는 것처럼 마치 뿌리가 아직 살아있는 것을 알 수 있었다.\n- \"마나석이… 내 손에 들 만한 물건인가?\"\
    \n }, {"
