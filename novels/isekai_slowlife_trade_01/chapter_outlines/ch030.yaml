chapter_n: 30
overall: '{"ch030": "고대 나무의 말은 차하린에게 명확한 도전장이었다. ''도전''을 위한 첫 번째 과제는 마나석 채취를 위한 준비였다.
  그는 숲속에서 마법에 능숙한 이계 생물들과 교류하며 현실 세계에서 익히지 못했던 새로운 지식과 기술을 배우기 시작했다. 어느 날, 고대 나무는
  차하린에게 ''만약 당신이 마나석을 얻기 위해서는...''라는 메시지를 다시 전달하며 그 진정한 의미를 설명했다. 이제 차하린은 마지막 과제로
  삼아 숙련된 생물들의 도움으로 마나석 채취 시험에 임하게 된다. 그의 심장 속에는 어려움과 동시에 새로운 시작을 향한 설렘이 가득했다."}'
beats:
- name: intro
  instruction: "-  '요즘 이계에서 산다는 게 어떤 건지 알려 주세요.' 차하린은 고대 나무의 말에 잠시 응답했다. \n-  내가 가진\
    \ 마법을 이용하면 현실과 이계를 연결할 수 있다는 소리.\n-   햇빛이 숲 바닥까지 스며들고, 어두운 곳에서 숨쉬는 정원의 생명력이 차하린에게\
    \ 따스함을 전달했다.  바람에 떨리는 나뭇잎 사이로 들려오는 새들의 노래는 조용하고 고요한 분위기를 더했다.   \n- '어떤 과제야' 라고\
    \ 차하린은 의문으로 물었다. \n- 이준씨가 앞서 말하기 시작했는데, 그의 목소리는 섬세하며 부드러웠다.  '마나석 채취를 위한 준비.'\
    \ , '도전을 위한 첫 번째 과제...', 이준씨의 말이 계속 흘러나왔지만 차하린은 이미 생각에 잠겨 있었다.\n- 마나석 채취? 무슨 의미일까?"
- name: development
  instruction: "- 차하린은 이준씨를 따라 숲 속으로 들어갔다.  순간 그의 손목의 시계가 불빛을 발하며, 디지털 화면에 '마나석'이라는\
    \ 단어가 나타났다.   \n- 차하린은 마법에 능숙한 이계 생물들과 함께하는 시간 동안 새로운 지식과 기술을 배우기 시작했다.  그는 고대\
    \ 나무의 말씀처럼, 진정한 의미를 알아내려고 노력했다.\n- '그래도, 내가 이렇게 이계에서 살면서 얻은 것들이 현실 세계에서는 도움이 될까?'\
    \ 차하린은 스스로에게 물었다.  마법의 힘을 느끼는 것은 일종의 설렘과 동시에 불안한 예감으로 가득했다.\n- '만약 당신이 마나석을 얻기\
    \ 위해서는...' 고대 나무의 메시지가 그의 머리속에서 계속해서 반복되었다. \n-  차하린은 이준씨와 함께 마나석 채취 시험에 임하게 된다."
