chapter_n: 31
overall: '{"ch031": "고대 나무는 차하린에게 ''만약 당신이 마나석을 얻기 위해서는 숲속의 생명들을 이해해야 한다''는 메시지를 전달했다.
  그는 이계의 생물들과 교류하며 그들의 언어, 행동, 그리고 살아가는 방식을 배우기 시작했다. 하지만  마법에 대한 이해는 여전히 부족했고, 숲속에서의
  경험은 차하린에게 새로운 질문을 던져주었다. 마나석 채취를 위한 준비 과정이 끝났으면 어떻게 된다? 그의 다음 도전은 무엇일까?"}'
beats:
- name: intro
  instruction: "- 주인공의 자조/일상 톤 1줄로 시작  \n- 핵심 공간 묘사 (시각 2 + 후각/청각 1)\n- 첫 인물 등장 +\
    \ 호칭(\"이준 씨\" 등)\n- 짧은 대사 1~2개\n- 마지막 줄: 다음 비트로 넘기는 미세한 위기 신호 \n     -  고대 나무\
    \ 아래, 차하린은 의자에 가만히 앉아 있었다."
- name: development
  instruction: "- 핵심 사건 발생 (동작 단위 묘사)\n- 통증/충격 등 신체 감각\n- 내적 독백 1~2줄\n- 새 정보 발견 (단서/메모/시스템\
    \ 메시지) \n     - 차하린은 어깨를 살짝 으쓱하며 손으로 나무의 주름을 따라갔다.  고대 나무는 그들의 언어를 이해하지 못하는 생물들을\
    \ '무능한 존재'라고 불렀다. 그의 손톱이 닿는 곳은 상쾌한 향기로 가득 차있었지만, 이것은 나무가 내뿜는 순수한 에너지의 일부만을 알 수\
    \ 있는 것이었다."
