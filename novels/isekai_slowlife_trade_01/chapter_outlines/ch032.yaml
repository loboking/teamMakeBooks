chapter_n: 32
overall: '{"ch032": "차하린은 숲속의 생물들과 교류하며 얻은 지식으로 마나석 채취에 필요한 주요 정보를 파악했다.  하지만 믿기지
  않는 진실을 듣게 되면서 그는 혼란스러워졌다. 고대 나무가 말한 ''마법''이라는 것은 단순한 에너지 사용이 아니라 이계의 생명체들이 살아가는
  방식과 연결되어 있다는 것이다.  그래서 차하린은 마나석 채취를 위한 준비 과정을 잊고, 마법에 대한 이해와 이계 생물들의 진실을 파헤치기 시작했다."}'
beats:
- name: intro
  instruction: "- 차하린은 오늘도 이계의 숲속에서 마나석 채취를 하기 위해 준비했다.  <br> - 햇빛이 가득한 소관(소크란) 나무\
    \ 그룹 아래, 진흙 냄새와 나뭇잎들의 향기가 함께 퍼져 온다. <br> - 작은 호수에 울리는 새 소리와 바람의 쨍쨍함이 차하린의 이계 생활을\
    \ 표현하는 데 없지 않다. \n- ‘마나석 채취는 어떻게 해야 하는데…’ \n-  “그대 마음은 이 계절과 함께 살아가고 있습니다.”\n\
    \ - 고대 나무, 낡고 황빛에 질린 지형을 배경으로 한 점의 푸르름."
- name: development
  instruction: "- 차하린이 나무 줄기에 둘러앉았다. 마나석 채취를 위한 준비 과정은 어느 정도 명확했지만, 고대 나무가 말한 '마법'에\
    \ 대한 설명이 그리 이해되지 않았다. \n - 숲속의 모든 생물이 '마법'을 통해 이계를 살아가고 있지만, 마나석 채취와는 전혀 다른 방식으로\
    \ 사용하는 것 같았다. <br>  - 차하린은 고대 나무에게 질문했다. “그렇다면 ‘마법’이라는 것은 어떤 형태로 나타나는 걸까요?” \n\
    \ - 몸에 감각적인 불편함, 마치 속삭이는 소리만 들리는 느낌 <br>  -"
