chapter_n: 36
overall: '{"ch036": "숲속의 생명체들은 마나석을 에너지원으로 사용하는 것이 아니라, 이계의 숨결과 연결된 존재로 여겼다. 그들의 관점은
  차하린에게 새로운 시각을 선사했고, 그는 마법이 단순히 에너지를 조작하는 것 이상의 의미를 지녔다는 것을 깨달았다. 하지만 그의 주변 환경은 변화와
  동시에 불안정해졌다. 생명체들의 언어가 복잡해지고 행동은 예측불능 해졌으며, 그들은 차하린을 모아들이기 시작했다.  차하린은 이계의 숨결과 연결된
  존재라는 점을 이해했지만, 그들이 자신의 주변에 모으려는 의도를 알 수 없었다. 불안감이 그의 마음을 꽉 채웠다. "생명체들의 언어, 행동 패턴…  정리해야
  한다." 차하린은 혼자만의 생각 속에서 이끌어 내리는 진실에 대한 기대와 동시에 두려움이 공존했다.}'
beats:
- name: intro
  instruction: '비트 도입 — 회차 시작부 (분량 1,800자+, 한국 웹소설 톤)


    이 회차 줄거리:

    {"ch036": "숲속의 생명체들은 마나석을 에너지원으로 사용하는 것이 아니라, 이계의 숨결과 연결된 존재로 여겼다. 그들의 관점은 차하린에게
    새로운 시각을 선사했고, 그는 마법이 단순히 에너지를 조작하는 것 이상의 의미를 지녔다는 것을 깨달았다. 하지만 그의 주변 환경은 변화와 동시에
    불안정해졌다. 생명체들의 언어가 복잡해지고 행동은 예측불능 해졌으며, 그들은 차하린을 모아들이기 시작했다.  차하린은 이계의 숨결과 연결된
    존재라는 점을 이해했지만, 그들이 자신의 주변에 모으려는 의도를 알 수 없었다. 불안감이 그의 마음을 꽉 채웠다. "생명체들의 언어, 행동
    패턴…  정리해야 한다." 차하린은 혼자만의 생각 속에서 이끌어 내리는 진실에 대한 기대와 동시에 두려움이 공존했다.}


    위 줄거리를 한국 웹소설 톤으로 본문 1,800자+ 작성. 직전 비트와 사건 중복 금지. 시각·청각·촉각 묘사 포함. 대사 1~2개.'
- name: development
  instruction: '-  차하린은 마나석을 이용하여 이계의 생명체들의 언어를 분석하려고 노력했다. 그는 이전에 접했던 언어와는 다르게, 이미지와
    감각이 섞여 있는 형태로 전달되며 그 속에서 살아있는 세상의 숨결이 느껴졌다. -  차하린은 두 손으로 마나석을 가슴쪽에 들고 눈을 감았다.
    그의 내면에는 생명체들의 언어가 어려운 퍼즐처럼 얽히고 있는 모습이 구현되었다.  -  <br>'
