chapter_n: 37
overall: '{"ch037": "숲속의 생명체들의 언어는 더욱 복잡해졌고, 그 중에서도 특히 ''숨결''이라는 단어가 반복적으로 사용되었다.
  차하린은 이게 마나석과 연결된 것이 아닌, 이계 자체의 에너지 흐름을 의미하는 것 같다고 생각했다. 생명체들은 그의 주변을 둘러보며 끊임없이 ''숨결''을
  호소하고 있었다. 그들의 행동은 더 이상 예측 불가능한 것이 아니라, 마치 무언가를 기다리는 것처럼 어느 정도의 규칙성을 보였다.  차하린은 이계와
  연결된 생명체들이 ''숨결''을 통해 자신에게 의사를 전달하려고 하는 것 같았지만, 그들의 언어는 아직 이해하기 쉽지 않았다."}'
beats:
- name: intro
  instruction: "- 차하린은 오늘도 이계의 언어를 배우려고 노력했다. '숨결'이라는 단어가 반복적으로 사용된다. 하지만 그 의미는 아직\
    \ 불분명해졌다.\n- 숲속의 나무들은 키가 커서 어둡게 드리웠고, 차가운 바람이 들이쉬면 진짜 살아있는 잎사귀들이 소리를 내는 것처럼 속삭였다.\
    \ 신선한 공기와 흙냄새가 짙은 숲 안에서 차하린은 작은 종이책에 글씨를 적었다.\n- '숨결'이라는 단어가 다시 찾였고, 이번에는 어느 생명체들이\
    \ 모여 있는 곳에서 들려왔다.  \n-"
- name: development
  instruction: "-  한 마리의 날개 달린 여우는 차하린에게 눈을 기대며 '숨결'이라는 단어를 반복적으로 말했다. \n- 차하린은 이\
    \ 주변 생명체들의 행동을 주시하는 동안 두근거리는 심장 박동과 떨리는 손가락을 느꼈다.  \n-"
