chapter_n: 38
overall: '{"ch038": "생명체들이 ''숨결''을 호소하며 보이는 행동은, 차하린이 주변 환경에서 새로운 에너지의 흐름을 파악하는 데
  도움을 주었다. 그들은 마치 이계 자체의 에너지 흐름을 따라 이동하고 있는 것처럼 보였다. ''숨결''에 연결된 시각적 정보를 바탕으로, 차하린은
  이계의 에너지 흐름이 생명체들과 어떻게 연결되어 있는지 파악하기 시작했다. 하지만 그 와중에, 생명체들의 행동 중 하나가 특히 그의 주의를 끌었다.
  그들은 ''숨결''을 향해 손을 내밀고 있었지만, 거기에 닿으려는 시도는 하지 않았다. 마치 그 에너지 자체를 불러들이고 싶어하지만, 접근할 수
  없는 존재로 느끼는 것처럼 보였다.  이는 차하린에게 이계의 에너지가 단순히 사용될 수 있는 것이 아니라, 어떤 방식으로 인간이 도달하는 데 한계가
  있음을 암시했다."}'
beats:
- name: intro
  instruction: '''숨결''은 짙고 달콤한 향기와 함께 고요하게 불어오는 것 같았다. 차하린은 이계의 공기를 마시며 주변 나무들 사이로  흐르는
    에너지의 파동을 느끼기 시작했다. 하늘빛 잎사귀가 은은한 노란색으로 변화하며, 시원한 바람이 속삭이는 소리만 들렸다.'
- name: development
  instruction: '비트 마무리 — 회차 climax + 후크 (분량 1,800자+)


    이 회차 줄거리:

    {"ch038": "생명체들이 ''숨결''을 호소하며 보이는 행동은, 차하린이 주변 환경에서 새로운 에너지의 흐름을 파악하는 데 도움을 주었다.
    그들은 마치 이계 자체의 에너지 흐름을 따라 이동하고 있는 것처럼 보였다. ''숨결''에 연결된 시각적 정보를 바탕으로, 차하린은 이계의 에너지
    흐름이 생명체들과 어떻게 연결되어 있는지 파악하기 시작했다. 하지만 그 와중에, 생명체들의 행동 중 하나가 특히 그의 주의를 끌었다. 그들은
    ''숨결''을 향해 손을 내밀고 있었지만, 거기에 닿으려는 시도는 하지 않았다. 마치 그 에너지 자체를 불러들이고 싶어하지만, 접근할 수 없는
    존재로 느끼는 것처럼 보였다.  이는 차하린에게 이계의 에너지가 단순히 사용될 수 있는 것이 아니라, 어떤 방식으로 인간이 도달하는 데 한계가
    있음을 암시했다."}


    위 줄거리를 한국 웹소설 톤으로 본문 1,800자+ 작성. 직전 비트와 사건 중복 금지. 시각·청각·촉각 묘사 포함. 대사 1~2개.'
