chapter_n: 43
overall: '{"ch043": "차하린은 불규칙적인 ''숨결''이 나오는 존재의 위치를 추적하며 숲 속을 깊숙히 들어갔다. 그곳에는 어둠으로
  가득한 광활한 공간과 거대한 나무들이 서로 연결되어 있는 모습이 보였다. ''이것이 바로 이계의 중심''이라는 생각이 차하린을 감겼다. 불규칙적인
  숨결은 계속해서 그녀를 향해 오고 있었다. 차하린은 그 에너지를 파괴하려는 존재가 아닌, 다른 의도로 이것을 사용하는 존재일 것이라고 확신했다.
  마치 어떤 게임의 플레이어처럼, 불규칙적인 숨결을 내뿜는 존재는 자신의 목표를 달성하기 위해 나머지 생명체들의 에너지를 조작하고 있었다."}'
beats:
- name: intro
  instruction: '''숨결''이라는 말은 어제 이준 씨에게서 들었을까? 아니, 그전날인가… 차하린은 불규칙적인 ''숨결''이 나오는 존재의
    위치를 추적하며 숲 속을 깊숙히 들어갔다. 마치 그림자가 따라 다니는 것처럼 거대한 나무들은 어둠속에서 장엄함을 자랑했다. 이곳은 온통 사막과
    같았는데, 고요한 공기에는 죽음을 알리는 후각이 가득했다. ''그렇군…''  차하린의 입술에 조금만 웃는 모습이 드러났다. 그녀는 숲 속에
    진입한 이후로 눈으로 볼 수 없는 에너지를 느끼고 있었다.   \"어디 있어? 당신은… 누구인가요?\"'
- name: development
  instruction: '''숨결''의 방향을 따라 차하린은 계속해서 깊숙이 들어갔다. 그녀의 발걸음은 나무뿌리와 죽은 나뭇잎 사이로 살랑거렸고,
    오랜 시간 동안 가라앉혀진 땅과 같은 거친 질감이 그녀의 손바닥에 남겼다.  한낮에도 어둠이 지배하는 이 공간은 차하린을 압도하기 시작했다.  마치
    마법의 저주가 그녀를 따라오는 것처럼… 그녀는 불규칙적인 ''숨결''을 더욱 두드러지게 느끼기 시작했다.  그 에너지는 차근차근 그녀의 주변을
    감싸고 있었다.   \"나, 나 혼자가 아니었던 거군요?\"'
