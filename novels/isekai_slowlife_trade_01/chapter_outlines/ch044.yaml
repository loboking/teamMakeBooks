chapter_n: 44
overall: '{"ch044": "그 에너지를 조절하려는 존재가 아닌, 어떤 힘을 이용해 이계의 질서를 자괴하는 존재였다. 차하린은 ''숨결''이
  주변에 있는 생명체들에게 깊은 공포심을 불러일으키고 있었다. 나무들이 움직이며, 하늘에서 은빛 물질이 쏟아지는 현상이 발생했다.  이 계의 모든
  것이 파괴될 위기에 처해있었다. 차하린은 이 상황을 바로잡기 위해 고민에 빠졌다. 자신의 경험으로는 이런 존재를 제압할 수 없을 것이다."}'
beats:
- name: intro
  instruction: "차하린의 머리는 이게 무슨 일인가 라고 고민에 빠졌다.  \n    황금빛 광선이 내려치며 아름다움을 상징하는 숲은 지금은\
    \ 어둠으로 뒤덮여 있었다. 나무들이 살아있는 것처럼 몸을 흔들고, 가로로 이어진 마법의 문에 걸쳐 있는 은색 조각들은 불안한 비명 소리를\
    \ 내고 있었다."
- name: development
  instruction: "- 차하린이 앞장서는 숲 속으로 깊숙히 들어간다. - 나무들이 뒤집히는 현상을 목격하며, 숨막힐 정도의 진정한 공포감을\
    \ 느낀다.  \n    차하린은 무엇인가 의심했다. 이계에서 본 적이 없는 에너지와 함께 생명력이 서서히 사라지는 것을 보았다. 그리고 마침내\
    \ 그 근원을 발견하게 된다. - 뿌리째 드러나는 공간으로부터 은빛 물질이 하늘로 올라가며 지상의 모든 것을 황폐화시키고 있다.  \n  \
    \  '숨결'이라고 불리는 존재는 이계를 파괴하는 데 큰 힘을 가지고 있었다. \n    차하린은 자신의 경험으로는 이런 존재를 제압할 수\
    \ 없을 것 같았다."
