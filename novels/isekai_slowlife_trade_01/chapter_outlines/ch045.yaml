chapter_n: 45
overall: '{ "ch045": "차하린은  숲속의 불규칙한 ''숨결''이 나오는 존재를 직접 만나야 한다고 결심했다. 숨결을 가시화하는 마법으로
  그 에너지를 추적했지만, 그녀는 곧 아직 완전히 이해할 수 없는 강력한 파워에 직면하게 된다.  파괴적인 힘만이 아니라 새로운 기회를 가져다 줄
  수도 있다는 느낌이 차하린을 감겼다. ''숨결''은 이계의 모든 것을 바꿀 만큼 큰 잠재력을 가지고 있었지만, 그 파워를 지배하려면 어떤 조건이
  필요한지 알아내야만 한다.  차하린은 의지를 다지며 깊숙한 곳으로 향한다." }'
beats:
- name: intro
  instruction: "'숨결'을 찾고 있다는 건 정신나가는 일인가? 차하린은 자기 스스로에게 그렇게 물어보며 오랫동안 소홀히 간 지도를 펼쳤다.\
    \  숲길은 은빛으로 반짝이는 꽃잎과 거대한 나무들 사이로, 깊이 있는 향기를 자랑했다. 바람의 속삭임은 그녀의 귀에 부드럽게 들려오지만,\
    \ 여전히 불규칙적인 '숨결'을 느끼는 듯한 감각만이 차하린을 계속 이끌었다. \n - 주인공 내면:  어떤 존재가 이곳을 지배하는 걸까?\
    \ \"이준 씨, 이런 기분은 처음인 거야.\" 차하린은 오랜 시간 함께 여행했던 동료 마법사 이준에게 말했다. \n- '숨결'의 에너지 주변으로만\
    \ 작은 꽃잎들이 비틀리는 모습을 보여주세요.\n - \"이런 현상... 내가 알고 있는 모든 것이 흔들린다.\"  \n- 다음 행동: 차하린은\
    \ 이준에게 말하며 오랫동안 간직해온 마법의 지팡이를 들었다."
- name: development
  instruction: "차하린은 지팡이의 빛을 이용하여 '숨결'을 가시화하려고 노력했다. 하지만 그 결과는 예상치 못한 방식으로 나타났다. \
    \ - 주인공 행동: 차하린이 지팡이를 휘둘러 마법의 에너지를 '숨결'에 집중시키려 한다.\n - 등장 인물 + 첫 호명: 이준\n - 감각:\
    \ '숨결'은 파워풀한 힘으로 차하린을 뒤흔들어  손이 저리고, 심지어 얼굴에는 시선만 대비되는 어두운 그림자처럼 보인다. \n- 내적 독백:\
    \ '내 마법이... 이런 힘을 가진 존재에 맞설 수 없다.'\n - 새 정보 발견:  '숨결'의 에너지가 지팡이의 빛을 거칠게 타파하며,\
    \ 차하린은 '숨결'이 그 자체로 강력한 능력이라는 것을 알아차렸다. \n- 마지막 줄: '숨결'의 에너지는 점점 더 강해져 차하린을 압도하는\
    \ 상태가 된다."
