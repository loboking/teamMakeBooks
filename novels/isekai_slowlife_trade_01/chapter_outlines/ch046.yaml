chapter_n: 46
overall: '{"ch046": "숨결''의 에너지를 직접 느끼기 위해 차하린은 숲속 가장 깊숙한 곳으로 향했다. 그녀가 ''숨결''을 가시화하는
  마법을 사용하면 은빛 필름이 움직이며, 그 속에는 고요했지만 강력함으로 가득찬 에너지의 진동을 확인할 수 있었다.  필름은 어떤 힘에 의해 만들어졌는지
  알려주기 전에 끊어져 버렸다. 차하린은 숲속에서 불규칙적인 파장이 흐르며, 이것이 ''숨결''의 원형을 나타내고 있음을 직관했다.  그때부터 그녀는
  이계의 모든 것이 이 에너지에 의해 연결되어 있음을 알게 되어 어스름한 예감에 잠겼다."}'
beats:
- name: intro
  instruction: "- 차하린은 가슴 속 에너지를 느끼며, '숨결'을 직접 만져보고 싶다는 생각에 숲속으로 향했다. \n\n-  짙은 솔방울\
    \ 향이 코끝까지 스며들었으며, 그 아래에서는 마치 거대한 동물의 호흡소리가 들리듯 부드럽지만 강한 파장이 가득했다. <br>햇빛이 은색 나뭇잎\
    \ 사이로 드리우는 광선은 이계 숲의 고요함을 더욱 드러내고 있었다.<br>\n- '숨결' 에너지를 직접 느끼기 위해 차하린은 계속해서 깊숙한\
    \ 곳으로 들어갔다. \n -  어깨를 펴서 앞길을 가리는 나무 가지들을 제치며 걸음을 이어간 그녀는 어느 순간,  갑작스럽게 공기를 통해\
    \ 전달되는 불규칙적인 파장을 느끼기 시작했다.\n-"
- name: development
  instruction: "- 차하린은 그 파장의 진원지를 찾아가다가 가장 깊숙한 곳에 있는 큰 나무를 발견했다. <br>나무 주변에는 은빛 필름이\
    \ 형성되어 있었고,  그것을 만지려는 순간, 그녀의 손바닥은 시린 감각으로 가득 차서 차갑게 얼어붙는 듯했다.\n - '숨결' 에너지를 가시화하는\
    \ 마법을 사용하면 은빛 필름이 움직이며 그 속에는 고요했지만 강력함으로 가득찬 에너지의 진동을 확인할 수 있었다. \n-"
