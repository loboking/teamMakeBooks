chapter_n: 47
overall: '{"ch047": "숲속의 에너지 필름은 계곡 하나로 향했고, 차하린은 그 곳으로 흘러간 은빛 필름이 만들어진 것처럼 보였다.  그렇지만
  이제는 지표면 아래에서도 파장을 감만했다. ''숨결''과 같은 에너지를 일으키거나 만들어내는 존재가 있었고, 차하린은 그 힘의 근원에 대한 무서움이
  시작되었다. 그녀는 지금까지 만든 모든 마법을 사용하면 아무것도 할 수 없을 것 같았다.  그런데 계곡 바닥에서는 은빛 필름이 파괴되지 않고,
  오히려 강력한 힘으로 반작용을 일으키며 발산했다."}'
beats:
- name: intro
  instruction: "- 차하린은 오늘도 계곡의 물을 마시며 자연과 함께 하는 여유를 간직했다. '어느새 이곳에서 시간이 다르게 느껴진다.'\
    \  \n- 푸른빛으로 휩싸인 계곡 바닥, 은반짝이는 물줄기가 가득한 시각적 아름다움은 마치 장난감을 만들고 싶어하는 아이의 상상 속 공간처럼\
    \ 보였다. 그러나 오늘이라면 다른 느낌이 들었다.  그 푸른빛에 어두운 그림자가 드리워져 있었는지도 모르겠다.\n- 이준씨가 계곡 바닥을\
    \ 보고 주위를 살피며 불쾌한 표정으로 말했다. '차하린아, 여기에서 무슨 일이 생겼어? 에너지 필름에 이상이 있다고 느껴졌는데.'\n -\
    \ 차하린은 지금처럼 맑게 비치는 계곡의 물을 마시며 이준씨에게 대답했다. '무슨 일인지는 모르겠지만, 요즘은 이곳에서 기묘한 에너지가 느껴져.\n\
    -  그것만이 아닌, 계곡 한가운데로 흘러오는 은빛 필름도 지금처럼 어울리지 않는 색을 가지고 있다.'"
- name: development
  instruction: "-  차하린은 자신의 손으로 에너지 필름을 만져보았다. 온전히 느껴지는 것은 아니지만, 뜨거운 불꽃이 가득한 필름과 차가운\
    \ 얼음처럼 느끼는 힘의 조합이었다. 그녀는 지금까지 만든 모든 마법을 사용하면 아무것도 할 수 없을 것 같았다.\n- 은빛 필름은 파괴되지\
    \ 않고 오히려 강력한 힘으로 반작용을 일으키며 발산했다. 차하린의 손은 가볍게 번득거렸지만, 그 안에는 큰 공포가 흘러나왔다.\n -  '이...\
    \ 이건 어떤 에너지일까?' 차하린은 스스로에게 속삭이며 눈을 감고 주변의 느낌을 더욱 집중했다. 그녀는 이 기운이 자신과 연결되어 있었다는\
    \ 것을 알았지만, 그 정확한 의미를 파악하지 못했다.\n -  '혹시... 내가 이 에너지를 만든 건 아닐까?' 차하린은 생각에 잠겼다.\
    \  \n-   그리고 그녀의 손길이 은빛 필름을 더욱 향하게 되는 순간,"
