chapter_n: 50
overall: '"혹시 내가 이대로 진행하면 안 될까?" 차하린은 말을 걸고 자신에게 숨쉬는 공기를 맞이했다. 은빛 필름으로 뒤덮인 굴의 입구에서는
  시선을 사로잡는 생명력이 느껴졌다. 그녀는 마법을 사용해 굴 내부를 확인하려고 하지만, 에너지 필름은 계속해서 방해하며 차하린의 행동을 속박했다.
  두려움과 호기심 사이에서 갈등하는 그녀의 눈빛은 점점 더 단호해졌다. ''저 깊이 있는 곳에 무엇이 있을까?'' 차하린은 마음을 고르며 에너지
  필름을 파괴하려는 용기로 주문을 읽기 시작했다.'
beats:
- name: intro
  instruction: '- ''역시 오늘 이게 진짜 재밌겠어.'' 차하린은 굴에 걸친 에너지 필름을 보며 내뱉었다.

    - 주변 바탕이 은빛으로 뒤덮인 굴의 입구를 통해 스며드는 생명력이 흐르고 있다. 공기 중에는 신선하고 약간 상큼한 향기가 가득했으며, 들려오는
    소리로는 희미한 광물들의 발진과 속삭이는 바람만 들렸다.

    - ''무슨 일인지 모르겠는데 이준씨가 말하는 건 정말 신기해.'' 차하린은 자연스럽게 입구에서 들어와 있는 은빛 필름을 두 손으로 긁으며
    생각했다. 그녀는 이준의 이야기를 기억했고, 그 이야기에 대한 호기심이 점점 커져나갔다.

    - ''뭐가 문제인지 알려줘.'' 차하린은 마법력을 조절하며 말을 걸었다.

    -  그러자 은빛 필름이 움직였다.'
- name: development
  instruction: "- 차하린은 손으로 에너지 필름을 파괴하려고 시도했다. 그녀의 주문이 실행되면서 필름은 약간 두드러졌고, 가파른 경사를\
    \ 타지 않으려는 힘에 의해 다시 회복되었다.\n- '앗!' 차하린은 손바닥으로 날아온 마법 에너지를 느끼며 동요했다. 그녀의 손에는 뜨겁고\
    \ 강렬한 에너지가 흐르고 있었다.\n- 내부에서 나오는 생명력이 더욱 두드러졌다. 차하린은 주변을 살펴보았다. 은빛 필름으로 만들어진 벽\
    \ 아래에 은밀하게 들어갈 수 있는 구멍이 하나 있다. \n- '저 깊은 곳에 무엇이 있을까?' 차하린의 눈에는 경각심과 호기심이 함께 번졌다.\n\
    - ‘지금, 바로 그 자리에서…’,  그녀는 마음속으로 말했다."
