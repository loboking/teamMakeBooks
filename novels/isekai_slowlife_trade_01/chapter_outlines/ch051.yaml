chapter_n: 51
overall: "{\n  \"chapter_n\": 51,\n  \"act\": 1,\n  \"content\": \"두려움을 삼키고 차하린은 마법으로\
  \ 에너지 필름을 파괴하려는 시도를 시작했다. 휘몰아치는 마나가 그녀의 손끝에서 반짝이며 필름에 닿자 순간적으로 두꺼운 아기들은 분해되어 날려갔다.\
  \ 굴 내부로 향하는 길이 열렸지만 그곳에는 어두움과 함께 차갑고 무시무시한 기운만이 느껴졌다. 차하린은 마법봉을 높게 들어올리며 주위를 경계하며,\
  \ 조심스럽게 진입했다.\"\n}"
beats:
- name: intro
  instruction: 두려움은 잠시나마 사라졌다. 차하린의 마법봉 끝에 모아진 에너지는 이미 필름을 파괴할 준비가 되어 있었다. <br> 굴
    내부는 고요했다. 어둠 속에는 차갑고 무시무시한 기운이 느껴지며, 거대한 돌 벽으로 인해 환기가 잘 안되는 공간에서  매혹적으로 달콤한 철분
    오염을 감지할 수 있었다. 이 굴은 단순히 천연 광석의 결합으로 만들어진 곳이 아닌, 어리석고 잔인한 신에게 지배받는곳 같았다.  <br>
    "이동해야겠네." <br> 차하린은 마법봉을 높게 들어올리고 주위를 경계하며, 조심스럽게 진입했다.
- name: development
  instruction: 차하린은 굴 속으로 천천히 걸어갔다. 그녀의 발걸음은 돌 바닥에 반짝이는 불빛을 따라 가라앉는 소리를 내었다. 마법봉이
    그녀 앞에서 살랑거렸고, 에너지 필름이 파괴되어 남은 기운들은 움직임을 감추려고 노력하고 있었다. <br> "아무것도 안 보일까?" <br>
    차하린은 작은 호흡소리로 질문했다. 그녀는 마법봉의 끝에서 나오는 불빛으로 주변을 살텠지만, 어둠 속에 숨어있는 존재들은 그들의 기운만이 느껴지기
    시작했고, 그녀의 몸에는 두근거리는 긴장감이 가득했다. <br> "내가 이길 수 있다면…" <br> 차하린은 무언가를 찾아던 마법에 대한 자신감을
    가지고 있었다. 그것은 힘이 강한 존재들이 주는 기운의 감촉으로, 그녀의 손에는 전투 준비라는 것을 알리며, 신경이 과하게 예민해져 있었다.
    <br> "저기…" <br>  차하린은 굴 벽에 새겨진 문양을 발견했다. 그들은 고대 문자로 이루어져 있었고, 지침으로서 작동할 수도 있다는
    생각이 들었다.
