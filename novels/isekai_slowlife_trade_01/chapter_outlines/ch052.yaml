chapter_n: 52
overall: '{"chapter_n": 52, "act": 1, "content": "굴 내부로 들어간 차하린은 몸을 가라앉히는 어둠 속에서 불안하고
  신비로운 감정에 휩싸였다. 공기 중에는 시원한 바람이 불고 그 안에는 낯선 향기를 발산하는 꽃잎들이 흩날렸다. 그녀의 눈앞에서는 은빛 필름으로
  뒤덮인 광택을 지닌 나무 위로 올라가는 길이 보였는데,  길 따라 흐르는 약한 생명력은 차하린에게 호기심과 동시에 두려움을 불러일으켰다. "혹시
  내가 이곳에서 무엇을 찾아야 할까?" 차하린은 속삭이며 길로 나선 순간,  지상으로 떨어져 있는 붉은 꽃잎 사이에서 은빛 구리색 문양이 새겨진
  작은 모자가 발견되었다. 그녀는 그 모자를 들고 향긋한 바람을 따라 진행하며 내면의 갈등과 함께 새로운 신비로운 여정을 시작했다." }'
beats:
- name: intro
  instruction: "- 차하린은  깊숨을 들이쉬며, '어두운 곳에선 항상 빛이 필요해.'라고 속삭였다.\n- 검은색으로 뒤덮인 광택이 나는\
    \ 나무와 같은 벽에서 은은한 파란빛이 불려오는 굴 내부. 공기 중에는 시원하고 상큼한 바람이 섞이며, 낯선 향기를 발산하는 꽃잎들이 미세하게\
    \ 움직이고 있었다.\n- 차하린의 눈앞에 보이는 은빛 필름으로 뒤덮인 나무 위로 올라가는 길은 신비로운 분위기였다.  \n- '이곳에서 무엇을\
    \ 찾아야 할까?' - 그녀는 낮게 속삭이며 이길 따라 향한 순간, 지상에 붉은 꽃잎들이 가득 피어 있고 그 사이에는 은빛 구리색 문양이 새겨진\
    \ 작은 모자가 발견되었다. \n- '그건 무엇일까?'"
- name: development
  instruction: "- 차하린은 귀여운 모자를 들고, 향긋한 바람을 따라 굴로 들어갔다. 길의 벽면에는 은색 광택을 가진 나무가  벽처럼\
    \ 섞여 있으며,  공기는 시원하고 꽃잎의 과도한 향기를 발산했다.\n- 차하린은 걷는 동안 약한 생명력이 닿았던 곳에서 동상이 되어있는듯한\
    \ 느낌을 받고 있다. \n - '혹시 내가 이곳에서 무엇을 찾아야 할까?'\n  - 그녀의 손길로 모자를 살펴보며, 은색 구리 문양은 붉은\
    \ 꽃잎과 어울려 특정한 의미를 가지고 있을지도 모른다고 생각했다. \n - '모자는 이곳에서 무엇을 가르쳐 줄까?'\n- 그녀의 눈앞에 검은빛으로\
    \ 반짝이는 커다란 문이 나타났다.\n  - '불안하고 신비로운 감정에 휩싸인 차하린은 붉은 꽃잎 사이로 새겨진 문양을 보며, 앞으로 어떤\
    \ 모험이 시작될지 알 수 없었다.'\n-"
