chapter_n: 53
overall: '{"chapter_n": 53, "act": 1, "content": "은빛 필름으로 뒤덮인 길을 따라 차하린은 가라앉는 어둠 속에서
  신비로운 존재들을 만나고 있었다. 날개를 가진 생명체들이 은색 눈동자로 그녀를 바라보며 공기를 찢고 통과하는 순간, 그녀의 마음속에는 두려움이
  고요하게 번져갔다. 그러나 차하린은  두려움을 이겨내며 계속 나아가는 용기와 호기심으로 가득했다. 길의 끝에서 은빛 필름으로 둘러싸인 거대한 구조물을
  발견했고, 그 안에서는 강력한 에너지 순환이 느껴졌다. 그녀는 마음 속에서 ''어둠 속의 신비''라고 생각하며 공기를 흡입하며 진행했다. 하지만
  오늘 밤은 차하린의 일상으로부터 무언가를 훔쳐간 것 같았고, 그것은 그녀를 더 큰 위험으로 이끌었다."}'
beats:
- name: intro
  instruction: "-  은빛 필름으로 뒤덮인 길을 따라 차하린은 어둠 속에서 신비로운 존재들을 만나고 있었다.\n- 주변에는 고요한 밤의\
    \ 공기가 감싸였는데, 은색 눈동자를 가진 날개 달린 생명체들이 그녀를 바라보며  공기를 찢고 통과했다. \n- 그들의 존재감이 차가운 바람처럼\
    \ 그녀의 몸을 스치는 느낌.\n-"
- name: development
  instruction: "- 차하린은 불안한 마음을 억누르며 계속 나아간다. 은빛 필름으로 둘러싸인 거대한 구조물이 눈앞에 나타났고, 그 안에서\
    \ 강력한 에너지 순환이 느껴졌다.\n- 그녀는 이곳 곳곳의 에너지를 흡수하며 마음을 차분히 하는 동작을 한다.  \n-"
