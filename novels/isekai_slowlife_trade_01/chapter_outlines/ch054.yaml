chapter_n: 54
overall: '{"chapter_n": 54, "act": 1, "content": "길을 따라가던 차하린은 은빛 필름으로 뒤덮인 나무 근처에서
  이상한 존재를 발견했다. 마치 공기를 타고 날아오르는 것처럼 보이는 그림자들이 나무에 매달리고 있었다. 그녀는 숨죽이며 그 그림자들을 바라보았다.  그림자들은
  차하린의 모습을 살피며 은색으로 빛나는 눈동자를 보여주고, 차가운 바람이 그녀에게 흘러들어왔다. 어두운 공간 속에서 발생하는 불안감은 점점 더
  두렵게 변했다. 차하린은 발걸음을 천천히 되돌리며 그 그림자들이 무엇이며, 자신에게 해를 끼칠 수 있는지 생각하기 시작했고, 이길 방법이 있을지
  궁금해하며 조심스럽게 앞으로 나아갔다."}'
