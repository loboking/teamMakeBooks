chapter_n: 55
overall: '{"chapter_n": 55, "act": 1, "content": "그림자가 차하린에게 다가오면서 은빛 눈동자는 점점 더 강렬해졌다.
  그녀의 심장은 두근거렸고, 어지러운 감각이 사로잡았다.  갑자기 그림자들은 순간적으로 흩어지며 다시 모여들었다. 그들의 형태는 변하지 않았지만,
  차하린이 느끼던 공기를 타고 날아오르는 느낌은 더욱 강해졌다. 그녀는 눈을 감고 숨을 고르며 그림자들이 어떤 존재인지 파악하려 애썼다. 그리고
  그 순간, 차가운 바람이 그녀의 얼굴을 스치고, 은색으로 빛나는 목소리가 들려왔다. "우리는 당신을 기다리고 있었다."  그 목소리에 차하린은
  다시 눈을 뜨고 그림자들의 앞에 서 있던 한 사람에게 집중했다. 그의 모습은 어두워서 알아보기 어려웠지만, 은빛 눈동자는 차가운 바람처럼 그녀를
  시섬시켰다."}'
beats:
- name: intro
  instruction: "- 그림자들은 차하린 앞에서 서로 어울리며 움직이고, 그녀의 마음은 이곳에 대한 알 수 없는 불안감으로 가득했다.\n\
    -  고요한 대방문이 있는 곳에서 빛나는 은색 눈동자가 살아있는 존재처럼 느껴진다. 차하린의 눈은 흐르는 시간을 거스르며, 그림자들이 주변에서\
    \ 움직이는 모습을 집중해서 바라보고 있다.\n-  갑작스러운 정신적 압박감이 그녀를 감싼다.\n-  그녀는 조용히 말했다. \"저희는 당신을\
    \ 기다리고 있었습니다.\" \n-  차하린은 그의 목소리에 불안함과 동시에 무언가 알고 있는 것 같은 신기한 느낌을 받았다."
- name: development
  instruction: "- 그림자들은 차하린 주변에서 흐르듯이 움직이고, 그녀는 그들의 빛나는 은색 눈동자를 따라했다.  그녀의 심장은 두근거리며\
    \ 불안한 기분으로 가득 차 있었다.\n-  차하린의 손을 비밀스럽게 뒤로 옮겨놓고 무슨 일이 일어날지 알 수 없는 느낌에 몸이 떨렸다. \n\
    -  \".하지만, 저희는 당신에게 친절한 목표를 가지고 있습니다.\" \n -  그림자들은 은색 눈동자가 더욱 강렬해졌으며, 차하린은 그들의\
    \ 말을 들으면서 숨을 죽였다.\n-  차하린의 머리 속에는 그림자들이 가져온 희생과 축복에 대한 메모가 떠오르고 있다."
