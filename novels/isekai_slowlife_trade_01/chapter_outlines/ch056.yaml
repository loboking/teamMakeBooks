chapter_n: 56
overall: '{"chapter_n": 56, "act": 1, "content": "이젠 눈으로 볼 수 있지만, 차하린은 여전히 그들의 모습을
  정확히 파악하지 못했다. 그림자들은 은빛 필름처럼 그녀 주변을 감싸 안고 있었다. 차가운 바람에 몸이 얼려가는 것 같은 느낌과 더불어 공기 중에서도
  무겁게 느껴진다.  그들의 존재 자체가 차하린에게 위협적인 분위기를 전달했다. 그녀는 두렵지 않지만, 이곳의 이상함을 감지하며 조심스러움이 깊어졌다.  하지만
  그림자들은 그저 관찰하는 것처럼 보였다. 무언가를 기다리는 듯한 느낌이 들었다."}'
