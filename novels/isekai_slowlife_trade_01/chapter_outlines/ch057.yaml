chapter_n: 57
overall: '{"chapter_n": 57, "act": 1, "content": "그림자들은 차하린 주변을 계속 감싸 안고 있었지만, 이제는
  그녀의 에너지를 먹어들이지 않고 변화하는 모습을 보이기 시작했다. 은빛 필름처럼 휘저이는 그림자들 속에서 선명한 형태가 구현되며 어둡던 공간에
  점점 더 명확한 질감이 생겨났다. 차하린은 두려움과 동시에 호기심을 느끼며, 그들의 표면으로부터 보내지는 파동들을 따라잡으려 했다.  그들은 그녀를
  향해 다가오고 있지만, 공격적인 분위기보다는 수분이 가득한 흙에서 피어나는 꽃잎처럼 은은하게 펼쳐지는 느낌을 주었다. 차하린은 그들의 변화에 놀라며,
  어떤 의도로 자신에게 이런 모습을 보여주는지 알아내려고 노력했다." }'
beats:
- name: intro
  instruction: "- 차하린은 그림자들이 주변을 감싸고 있는 것을 느낄 수 있었다. \"혹시 이게 변하고 있다면 어떤 모습으로...\"\
    \ \n - 그녀가 서있는 공간은 시원한 바람이 불며 짙은 어둠 속에서도 은은하게 반짝이는 꽃잎들로 가득 차 있었다.  고요한 공기에는 싱그러운\
    \ 향기가 물씬 풍겼는데, 이는 지나치게 강렬하지 않고 부드럽게 그녀의 코를 자극하는 느낌이었다.\n - 그림자들은 앞서 언급된 꽃잎처럼 은은하게\
    \ 변하고 있었지만, 차하린은 그 속에서 뭔가 불안한 에너지를 감지했다. \"사진을 잘라낸 것처럼 휘어지는 모양...인간의 손길이 느껴진다.\"\
    \  \n- 이준씨가 그녀에게 말했다. \n - \"차하린, 네 주변은 기존과는 다른 영역으로 변하고 있다고 생각해.\" \n - 차하린은\
    \ 이준씨의 말에 침묵을 하고 그의 눈빛을 따라갔다.  그 속에서 어둠이 가득하지만, 또렷한 경계를 드러내며 공간을 감싸고 있는 모습이 보였다."
- name: development
  instruction: "- 그림자들은 차하린 주변에 더욱 짙은 필름처럼 휘어지며 그녀의 에너지를 먹으려 한다. - 이때, 차하린은 자신의 피부가\
    \ 시스코한 감촉을 느끼고 불편함을 느낀다.\n - \"무엇이 그렇게 변화하는 걸까? 내가 만든 그림자 아니잖아.\" \n- 그녀의 마음속에는\
    \ 끊임없는 질문이 들끓었다.  그녀의 손으로 만들어진 그림자인만큼, 이들의 행동을 제어할 수 있어야 한다. 그런데 이번엔 다른 방식으로 표현되고\
    \ 있었다. \n- 그녀가 주변에 펼쳐진 그림자를 가리키며 \"이들은...내가 만든 것들이 아니라는 걸 알아차릴 수 있다.\" 라고 말했다.\n\
    \ - 차하린은 자연스럽게 자신의 손으로 아기자기한 꽃잎 모양을 만들어 보았다. 하지만, 그 순간 그녀의 눈 앞에 떠오른 것은 은빛 필름처럼\
    \ 변하는 그림자들이었다.  그들은 이전과는 달리 차하린에게 다가오고 있었는데, 공격적인 분위기보다는 수분이 가득한 흙에서 피어나는 꽃잎처럼\
    \ 은은하게 펼쳐지는 느낌을 주었다.\n - \"잠시 기다려. 내가 이들을 다시 조절해 볼게.\"  \n- 차하린은 위로 자신의 마음속에 존재하는\
    \ 그림자와의 연결 고리를 확인하려고 노력했다."
