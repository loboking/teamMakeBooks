chapter_n: 58
overall: '{"chapter_n": 58, "act": 1, "content": "그림자들은 점점 더 명확한 형태를 가진 채로 주변을 감싸는
  모습이었다. 은빛 필름으로 덮인 그림자들이 풀리듯 하려고 하는 것처럼 보였다. 차하린은 그들의 움직임에 호기심을 느껴 동시에 예상치 못한 두려움을
  느끼기 시작했다.  그들은 그녀를 향해, 아니, 그녀의 에너지를 향해 집중하는 모습이었다.  차가운 공기 속에서 차하린은 그들의 숨결처럼 느껴지는
  압박감에 시달렸다."}'
beats:
- name: intro
  instruction: "• 차하린은 이계의 물건을 거래하며 현실과 이계 사이를 오가는 일상에 만족했다.  \n• 그림자들은 지금처럼 뭉쳐있지\
    \ 않았다. 아무도 그녀를 관찰하지 않는, 평범한 고등학교 방에서 열리는 수업 시간이었다. 하지만 이제는 그렇지 않고 쨍쨍하게 비치는 오래된\
    \ 가구와 창문 사이로 그림자가 스며들어 차가운 공기를 만들었다.\n•  단순한 공기의 냄새만큼은 아니었지만, 어두운 곳에서 나는 특정한 향이\
    \ 그녀의 코끝을 자극했다. '그림자'를 지칭하는 말처럼 보였다. \n• \"혹시 내가 이계의 물건 거래로 인해 무언가 틀렸는지?\""
- name: development
  instruction: "• 차하린은 좌우로 머리카락을 쓰다듬으며, 그 그림자들은 점점 더 명확한 형태를 가진 채로 주변을 감싸고 있었다. 은빛\
    \ 필름으로 덮인 그림자가 풀리듯 하려고 하는 것처럼 보였다. \n• 그녀의 앞 발가락을 자극하는 섬세한 통증이 느껴졌다. 차가운 공기 속에서\
    \ 온몸에 달라붙는 압박감은 그들의 숨결처럼 느껴지기도 했다.\n•  '내 에너지를?' 차하린의 마음속에는 불안과 함께 이상한 호기심이 커져갔다.\n\
    \ • 그림자들 사이로 한 줄기 은빛 빛이 피어나며, 그 속에서 작은 문구가 나타났다. [‘도움을 요청하세요’] \n• 차하린은 그녀의 짧고\
    \ 희미한 생명력에 의해 주는 답변을 찾으려고했다."
