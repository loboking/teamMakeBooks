chapter_n: 59
overall: '{"chapter_n": 59, "act": 1, "content": "은빛 필름으로 둘러싸인 그림자가 완전히 분열되며, 그 속에서
  섬광을 내는 형태가 드러나기 시작했다. 차하린은 숨이 막힐 정도로 아름다운 형태를 보며 경각심과 함께 감탄을 금할 수 없었다.  그림자들은 이제
  그녀의 에너지를 먹어들이지 않고, 온통 둘러싸고 있는 것처럼 느껴졌다. 차하린은 그림자가 자신에게 주는 신비로운 혹은 위험한 에너지를 느끼며 두려움을
  섞은 호기심으로 그들을 바라보았다.  그림자의 속에서 목소리가 들리기 시작했다. ''저희를 보세요.''"}'
beats:
- name: intro
  instruction: "- 차하린은 이계의 날씨가 어떨지 알기 위해 한 손으로 공기를 만졌다. 은빛 필름처럼 느껴지는 바람이 살짝 간지럽혔다.\
    \ \n  - 주변에는 아직 햇살을 마주하지 못한 나무들이 시선을 사로잡는 은색의 꽃잎들을 피우고 있었다. 그 향기는 따스하고 약간 달콤하며,\
    \ 차하린에게 이계에서만 느끼는 편안함을 안겨주었다.\n - '이준 씨?'  \n- 그림자 속에서 조용한 목소리가 들려왔다. '저희를 보세요.'"
- name: development
  instruction: "- 차하린은 천천히 뒤돌아보며 은빛 필름으로 둘러싸인 그림자가 완전히 분열되면서, 그 속에서부터 섬광을 내는 형태가 드러나기\
    \ 시작했다.  \n - 그녀는 가슴이 두근거리는 느낌과 함께 무언가를 맞받아들이는 듯한 감각에 사로잡혔다. 그림자들은 이제 그녀의 에너지를\
    \ 먹어들이지 않고, 온통 둘러싸고 있는 것처럼 느껴졌다.\n  - '이게... 뭐야?' 차하린은 입을 살짝 열며 내부를 한번 가볍게 울렸다.\
    \  \n - 그림자 속에서 목소리가 들리기 시작했다.' 저희는 당신을 위해 준비했습니다.”  },{"
