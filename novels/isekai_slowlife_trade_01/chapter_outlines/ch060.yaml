chapter_n: 60
overall: '{"chapter_n": 60, "act": 1, "content": "섬광이 사라진 후 그림자들은 다시 은빛 필름으로 덮인 채로
  조용히 둘러싸고 있었다. 차하린은 그들의 움직임을 관찰하며 계속해서 두려움과 함께 호기심을 느꼈다. 그녀는 이제 그들이 자신에게 해를 끼치지 않으려는
  의도를 엿볼 수 있었다.  그들은 지금까지의 억압적인 분위기를 벗고, 더 친밀하고 온화한 모습으로 변했다. 하지만 차하린은 여전히 이들의 진실을
  알아내야 한다고 생각했다. 그녀는 그림자들이 자신에게 가진 의도를 완전히 파악하기 위해, 그들과의 관계를 더욱 깊이 이해해야 할 필요성을 느꼈다."}'
beats:
- name: intro
  instruction: "-  '괜찮아, 다시는 이런 일은 없을 거야.' 차하린은 섬광으로 뒤덮인 그림자들을 응시하며 속삭였다. \n- 핵심 공간\
    \ 묘사 (시각 2 + 후각/청각 1): 은빛 필름처럼 흐르는 그림자들은 어두운 방 안에서 조용히 그녀를 둘러싸고 있었다. 그들의 모습은 불규칙적인\
    \ 형태로 변화하며, 차가운 바람이 불어오듯한 후각을 자극했다. 방 안에는 오직 소중한 순간의 기억들만 남아있는 것처럼 조용했지만, 차하린에게는\
    \ 섬뜩한 느낌이 들었다.\n- 첫 인물 등장 + 호칭(\"이준 씨\" 등):  그림자들 사이로 한 명의 남자가 나타났다. \"이준 씨? 네가\
    \ 이런 모습을 보이는 건 처음이야.\" \n- 짧은 대사 1~2개: \"우리, 모두 너를 위해 노력하고 있잖아.\"  \n- 마지막 줄:\
    \ 다음 비트로 넘기는 미세한 위기 신호: 이준의 말투에는 그렇게 가르치려는 의도가 아니라, 진실을 알리고 싶어 하는 모습이 느껴졌지만, 차하린은\
    \ 아직 그의 진심을 읽을 수 없었다."
- name: development
  instruction: "- 핵심 사건 발생 (동작 단위 묘사): 이준 씨는 차하린 앞에서 작은 그림자를 만들어 내려가며, 그 안에는 어떤 메시지가\
    \ 담겨 있는 것처럼 보였다.  \n- 통증/충격 등 신체 감각: 차하린은 그의 손짓을 볼 때마다 마치 무언가를 찢듯이 느끼는 낯선 불편함을\
    \ 느꼈다. \n- 내적 독백 1~2줄: '그 그림자, 누구를 상징하는 건지...?' 그녀의 머릿속은 혼란스러운 생각으로 가득했다.  \n\
    - 새 정보 발견 (단서/메모/시스템 메시지): 그 작은 그림자가 확장하며 차하린 앞에 나타난 창문처럼, 짧고 간결한 문구가 표시되었다. \"\
    내 안의 진실을 찾으라.\""
