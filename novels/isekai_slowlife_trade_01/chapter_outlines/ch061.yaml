chapter_n: 61
overall: '{"chapter_n": 61, "act": 1, "content": "그림자가 은빛 필름으로 둘러싸인 채 조용히 그녀를 감싸고
  있다는 사실이 차하린의 마음을 안정시키면서도 동시에 새로운 질문을 불어넣었다. 이제 그들은 자신에게 해를 입히지 않지만, 의도가 무엇일까?  그들의
  움직임은 계속해서 관찰했던 것만큼이나 미묘하지만, 차하린은 그들이 전달하려는 메시지를 파악하기 위해 노력했다.  밤이 지나며 그림자들은 점점 더
  강력한 힘을 발휘하며 그녀를 둘러싼 에너지 필드를 변화시키기 시작했다. 차하린은 이 끊임없는 흐름 속에서 자신도 알 수 없는 새로운 가능성들을
  느끼기 시작했다."}'
beats:
- name: intro
  instruction: "- 차하린은 그림자의 은빛 필름으로 둘러싸인 모습에 평온함을 느꼈다.  \n- 그녀는 자신의 방, 창문 너머로 드리운\
    \ 은색 조명이 투성이는 아늑한 공간에서 쉬고 있었다.  구석 구석에 놓인 다양한 종류의 이계 식물은 은빛 광선을 받아 반짝이며 달콤하면서도\
    \ 독특한 향기를 풍기고 있었다. \n- 차하린이 눈을 감고 들었던 경쾌한 소리는 다시 한번 찾아왔다.  '잘 잤어요?' 이준씨의 목소리가\
    \ 마음속에 은은하게 퍼져 나갔다. \n- '응, 잘 잤어.'\n - 하지만 그들의 움직임은 계속해서 관찰했던 것만큼이나 미묘했다."
- name: development
  instruction: "- 그림자들은 차하린 주변을 정기적으로 회전하면서 은빛 필름으로 가려진 채 그녀를 감싸고 있었다. \n-  그들의 움직임은\
    \ 처음에는 매우 부드럽게 느껴졌지만, 점점 더 강력한 에너지를 발휘하기 시작했다. 차하린의 피부는 이에 따라 따끔거리며 불쾌함을 느끼기 시작했다.\
    \ 내심 '이건 괜찮은 걸까?' 라고 생각했다.  \n- 그림자들은 무언가를 전달하려 노력하는 것처럼 보였다.  차하린은 그들이 의도하는 메시지를\
    \ 파악하기 위해 그녀의 마음을 집중시켰다. \n - '혹시 저에게 어떤 위협이 있나요?' 차하린이 소리 없이 속으로 murmured했다.\
    \ \n- 그림자들은 다시 한번 변화했고, 그들의 흐름은 더욱 강렬해졌다."
