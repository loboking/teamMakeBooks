chapter_n: 62
overall: '{"chapter_n": 62, "act": 1, "content": "그림자가 은빛 필름으로 둘러싸인 채 조용히 그녀를 감싸고
  있다는 사실이 차하린의 마음을 안정시키면서도 동시에 새로운 질문을 불어넣었다. 이제 그들은 자신에게 해를 입히지 않지만, 의도가 무엇일까?  그들의
  움직임은 계속해서 관찰했던 것만큼이나 미묘하지만, 차하린은 그들이 전달하려는 메시지를 파악하기 위해 더 많은 시간을 가져야 한다고 생각했다. 그녀는
  조용히 숨쉬며 그림자의 변화를 살피기 시작했다.  그들의 은빛 필름으로 감싼 모습이 점점 투명해지고 있는 것 같았다. 차하린은 그들이 자신에게
  보내려는 메시지를 이해하기 위해 더욱 집중하며 숨을 멈추듯 시간을 놓치지 않았다."}'
beats:
- name: intro
  instruction: "- 은빛 필름으로 감싼 그림자들이 차하린 주위를 불어다니며 그녀의 모든 행동을 관찰하고 있다. \n- 주변 공간은 어두워\
    \ 짙은 회색으로 물들어있으며, 부드러운 밤바람이 들려오는 소리가 그 위로 흘러온다. 은빛 필름 속 그림자가 그녀를 감싸고 있는 느낌이 강하자\
    \ 차하린은 뒤로 기대며 조심스럽게 호흡을 한다.\n- 이준씨의 목소리, '차하린, 괜찮아? 네 얼굴엔 무슨 일이 있구나?'\n-  '응,\
    \ 그냥... 새롭고 이상한 느낌이다.' \n- 차하린은 이들의 주변을 살피며 그림자들이 보내려는 메시지를 파악하기 위해 더 많은 시간을 가져야\
    \ 한다고 생각했다. 그녀는 조용히 숨쉬며 그림자의 변화를 살피기 시작했다."
- name: development
  instruction: "-  그림자들의 은빛 필름이 점점 투명해지고 있는 것 같다. 차하린은 그들이 보내려는 메시지를 파악하기 위해 더욱 집중하며\
    \ 숨을 멈추듯 시간을 놓치지 않았다.\n - 흐릿한 형상의 그림자가 그녀를 감싸고 있었고, 차가운 공기와 함께 가미된 기묘한 매력이 차하린\
    \ 주변을 둘러싼다.  그림자들이 더욱 진해져들어온 순간, 차하린은 입안에 쓰리면서 불쾌한 감각을 느꼈다.\n- '무슨 말인가...', 그녀는\
    \ 속삭이며 그림자들의 변화를 관찰했다. \n- 은빛 필름이 갑자기 반짝이며, 작고 섬세한 문자가 그 안에서 번쩍이는 것을 보았다.\n- 차하린은\
    \ 눈을 크게 피동하며 문자가 나타나는 순간 화면에 담긴 정보들을  빠르게 읽었다. '나의 선택이 이 세계를 바꿀 것이다.' \n-  차하린은\
    \ 몸의 무거움과 함께 두려움이 그녀를 감쌘았다."
