chapter_n: 63
overall: '{"chapter_n": 63, "act": 1, "content": "그림자가 은빛 필름으로 둘러싸인 채 조용히 그녀를 감싸고
  있다는 사실이 차하린의 마음을 안정시키면서도 동시에 새로운 질문을 불어넣었다. 이제 그들은 자신에게 해를 입히지 않지만, 의도가 무엇일까?  그들의
  움직임은 계속해서 관찰했던 것만큼이나 미묘하지만, 차하린은 그들이 전달하려는 메시지를 이해하기 위해 노력했다. 다음 날 아침, 그녀의 방에 들어간
  순간 그림자들은 다시 한 번 나타났다. 하지만 이번에는 조금 더 가까이서, 은빛 필름으로 둘러싸인 손짓으로 차하린을 향해 다가왔다. 그들의 표정은
  인간처럼 변화하지 않았는데, 마치 그녀의 감정을 읽고 있는 듯했다. 차하린은 불안과 호기심이 뒤섞여 이제는 도망갈 방법도 없어 보였다."}'
beats:
- name: intro
  instruction: '-  그림자는 은빛 필름으로 감싸고 있는 것처럼 보였지만, 차하린은 그들의 행동을 관찰하는 것이 더 중요했다.

    - 그녀의 방에는 어두운 밤공간이 펼쳐져 있었는데, 낮과 달리 창문을 통해 비치는 은빛 불빛만으로 움직이는 그림자를 보절 수 있다.  차하린은
    방 안에서 느껴지는 시원한 바람에 인지할 수 있는 은은하고 묵직한 향기가 그녀의 기분을 상쾌하게 한다.

    - 하지만 그림자들이 나타나면서 그러한 평온이 무너진다.

    - ''여전히 이곳으로 와 보내겠군요.'' 차하린은 속삭이며 눈빛으로 그림자들을 응시했다.

    -  ''그들은 무엇을 알고 있는지, 그리고 우리를 왜 관찰하는 것인가?'''
- name: development
  instruction: "- 그림자가 점점 더 가까이 다가오며 은빛 필름으로 감싸진 손짓을 그녀에게 향했다. 차하린은 그들의 부드러운 움직임에도\
    \ 불구하고 불안한 심장 박동을 느끼게 된다.\n-  차하린의 안장부에는 불편함이 느껴졌고, 그림자들을 보는 것에 대한 두려움과 호기심이 그녀의\
    \ 체온을 변화시켰다. 그들의 눈빛은 인간처럼 보이는 듯하지만, 차하린은 그들이 전달하려는 메시지를 이해하기 위해 노력했다.\n-  '내가\
    \ 가진 모든 것을 당신들에게 드리겠지만... 이걸 주려면 뭘 해야 할까?' 차하린의 마음속으로 생각이 번져 나간다. \n - '그들은 내게\
    \ 무언가를 보여주려는 것 같아...' 그림자가 그녀 앞에 나타나자, 차하린은 발을 당기고 뒤로 물러섰다."
