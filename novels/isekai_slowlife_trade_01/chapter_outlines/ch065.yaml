chapter_n: 65
overall: '{"chapter_n": 65, "act": 1, "content": "그림자가 전달하려는 메시지를 이해하기 위해 차하린은 이계의
  역사책을 찾아보기 시작했다. 하지만 수많은 책들 사이에서 자신에게 필요한 정보를 찾는 것은 어려웠다. 마침내 그림자에 대한 힌트가 있는 한 권의
  책을 발견했지만, 그 속 이야기는 차하린의 머릿속을 뒤흔드는 이상한 퍼즐처럼 느껴졌다.  그림자가 은빛 필름으로 둘러싸인 것과 같은 특징을 가진
  존재들이 이계 역사상 여러 번 등장했지만, 그들의 목적이나 진실은 불명확했다. 차하린의 눈에는 책 속 그림자 이미지가 반짝이는 듯 보였고, 그녀는
  자신이 새로운 이야기를 풀어내야 한다는 것을 알아차렸다. " }'
beats:
- name: intro
  instruction: '- 차하린은 이계의 책장을 한 번 더 살피며 속삭였다. "도대체 무슨 말인 거야?" -  책들은 가늘고 낡아서 오래된
    종이처럼 느껴졌다.  묵직한 향기가 나오는 곳에 그녀의 손이 대해, 지친 하루를 보낸 이계 먼치킨들에게 가장 친숙한 오렌지 계피 커피 냄새와
    책장에서 비롯되는 황갈색 진흙 같은 맛을 느끼게 된다. -  - "도움이 되는 거 없겠어." 차하린은 어깨를 쓰이며 말했다.'
- name: development
  instruction: "- 그녀는 그림자의 형상을 가진 책들을 찾기 시작했다. 낡은 종이가 벗겨져 은빛 필름으로 덮인 부분이 보였다. - 차하린이\
    \ 손길로 그 부분을 만졌다, 순간적으로 전달되는 감각은 마치 한숨이 나는 것처럼 가벼웠고 시원했다.  - \"그림자...\" 차하린은 속삭였다.\
    \ 그림자가 흘러내리는 글씨는 그녀의 머릿속에 불완전한 이미지를 만들어냈다. - 그녀는 책장에서 찢어진 조각을 발견하고 손가락으로 문구를 따라갔다.\
    \  - \"그들은 이계의 질서를 재편한다.\" \n- 차하린은 눈을 크게 열고 다시 한번 찾아보았지만, 그 글씨는 이미 사라져버렸다."
