chapter_n: 67
overall: '{"chapter_n": 67, "act": 1, "content": "책 속 그림자가 가르치는 이계의 역사는 차하린에게 깊은 불안감을
  안겨주었다. 그들은 단순한 수호자가 아니라 이계의 질서 자체였지만, 그들의 목표나 진짜 의도를 알아낼 길이 없었다. 오히려 책 속 이야기는 그림자가
  차하린에게 어떤 위협을 가지고 있는지 암시하는 것처럼 보였다.  차하린은 이계의 역사책을 넘어, 그림자와 직접 대면해야 한다는 것을 느끼게 되었다.
  하지만 그림자가 그녀를 찾아올 만큼 강력한 존재이긴 하였고, 차하린은 그들의 도움 없이는 이계의 진실을 알아내기 어려울 것 같았다."}'
beats:
- name: intro
  instruction: "- 차하린은 책 속 그림자의 고요한 눈빛에 불편함을 느끼며  '그들의 역사는 어떻게까지 우리에게 영향을 미칠까?'라고\
    \ 생각했다. \n - 오래된 책장 안쪽, 눅눅하고 이로운 향기가 스치는 서재에서 차하린은 진흙 같은 빛깔의 종이에 새겨진 그림자들을 살펴보았다.\
    \ 그림자들은 역사책 속에만 존재하는 것처럼 보였지만, 그들의 얼굴에는 언젠가 현실로 나타날 수 있는 만큼 살아있는 어둠이 가득했다. \n\
    \ - '혹시 저의 이야기를 알고 있을까?' 이준 씨는 조용히 대답하며 눈빛은 서재의 그림자들과 교차했다. \n- '사진이나 영상보다 더 진실된\
    \ 기억일지도 모른다.'\n - 차하린은 책 속 그림자들이 자신에게 무엇을 알려주고 싶은지 몰랐지만, 그들의 존재만으로도 이계의 역사는 단순한\
    \ 이야기가 아니었다는 것을 느꼈다."
- name: development
  instruction: "- 차하린은 책속 그림자들을 더 자세히 살펴보려고 하며 서재 문이 흔들리며 창밖으로 어두운 유령들이 드리워졌다. \n\
    \ - 그녀의 손가락이 종이에 새겨진 그림자를 만지자, 차하린은 한동안 느껴지던 불쾌한 상황을 기억했다.  '그들은 내 몸에 있는 동일한 힘을\
    \ 가지고 있었다.'\n - '저들의 역사는 저희의 미래로 연결되어 있다' 이준 씨의 조용한 목소리가 차하린에게 들려왔다. 책 속 그림자들이\
    \ 깨어나면서 이계의 질서가 위협받을 수 있다는 것을 알게 되고 그녀를 향하는 그림자들의 시선이 점점 더 강렬해졌다.  - '저들은 저희에게\
    \ 진실을 알려줄 수 있을 것이다.'\n - 차하린은 숨가쁨에 이르면서 속마음을 드러내지 못하고 책속 그림자의 깊숙한 무덤과 연결된 어둠으로\
    \ 가득 차 있는 서재에서 가장 안전한 장소를 찾기 시작했다."
