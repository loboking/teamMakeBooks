chapter_n: 68
overall: '{"chapter_n": 68, "act": 1, "content": "책에 적힌 그림자가 가르치는 이계의 역사는 차하린에게 깊은
  불안감을 안겨주었다. 그들은 단순한 수호자가 아니라 이계의 질서 자체였지만, 그들의 목표나 진짜 의도를 알아낼 길이 없었다. 오히려 책 속 이야기는
  그림자가 차하린에게 어떤 위협을 가지고 있는지 암시하는 것처럼 보였다.  차하린은 밤낮으로 그림자에 대해 생각하며, 이들의 행동의 배경과 진짜
  목표를 파악하려 시도했다. 그러던 중 그녀는 책 속 그림자 이야기와 현실에서 접했던 정보들을 연결해 볼 수 있었다. 그녀는 어느 정도 확신을 가지고
  있다는 것을 알았지만, 아직까지 답은 분명하게 보이지 않았다."}'
beats:
- name: intro
  instruction: "- 차하린은 책을 가만히 들고 있었다. 그러나 그녀의 눈빛은 책 속 그림자들의 이야기에 집중되지 않았다.\n-  낡은\
    \ 서적이 담긴 헌책방의 안쪽 공간은 역시나 시끄러운 도시 소음으로부터 멀리 떨어진 고요함을 선사했다. 은은한 분위기 속에서 책갈피를 가진\
    \ 손길로 차하린이 문질렀던 오래된 부피는 잡종의 향과 더불어, 거센 바람에 불어오는 북쪽 섬세한 해초 향을 상상하게 했다.  \n- 이준\
    \ 씨가 그녀에게 책을 소개하며 말했던"
- name: development
  instruction: "-  차하린은 그림자의 이야기를 다시 한 번 읽기 시작했다. 그들은 단순한 수호자가 아니라 이계의 질서 자체였다.\n\
    - 차하린이 손으로 책을 두드리며, 그녀는 몸에 저릿한 통증이 느껴지는 것을 알았다. '그들의 목표나 진짜 의도를 알아낼 길이 없었다.'\n\
    - 내부에서 불안감이 커지고 있는 차하린의 머리속에는 이전에 읽었던 그림자 이야기와 현실에서 접했던 정보들이 겹쳐 보였다. 그녀는 아직 확신을\
    \ 가지고 있지는 않았지만, 어느 정도 분명한 가설이 생겼다.\n- '그림자가 내게 위협을 주려한다는 것은...?'\n- 차하린은 책 속 그림자\
    \ 이야기와 현실에서 접했던 정보들을 연결해 볼 수 있었다. 그녀가 가장 의심하는 점은 그들이 이계의 질서를 무너뜨리려고 하는 것이라는 것에\
    \ 대한 추측이었다.\n - '그들은 내 몸을 통해 이계에 들어오려는 시도를 할 것으로 보인다.'  \n},{"
