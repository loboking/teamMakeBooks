chapter_n: 69
overall: '{"chapter_n": 69, "act": 1, "content": "책 속 그림자가 가르치는 이계의 역사를 읽고 나서 차하린은
  의지력을 사용해 이계의 현실을 직접 볼 수 있게 되는데, 그것은 기존에 알던 것과 달리 어둡고 불안정한 모습이었다.  그림자들이 가르치는 과거
  사건들은 끊임없이 반복되는 끔찍한 악몽처럼 느껴졌고, 이계의 진실은 차하린에게 점점 더 큰 공포감을 안겨주기 시작했다.  도움을 주길 바라던 그림자들이
  오히려 그녀를 위협하는 존재로 보인다는 생각에 차하린은 무엇을 해야 할지 몰랐다.  그녀는 이계의 역사 속에서 진실을 찾고자 하지만, 그 과정이
  자신을 깊은 공포와 불안감으로 납치하고 있다는 것을 알았다."}'
beats:
- name: intro
  instruction: "- 차하린은 책 속 그림자들이 가르치는 이계의 역사를 읽고 있었다.  \n- 오래된 나무책상 위에 편안하게 앉아 있는\
    \ 그녀의 시선은 빛이 드리워진 페이지와 그림자들의 윤곽 사이로 왔다갔다했다. 책방에서 물론이고, 이계 주택도 마찬가지로 향긋한 목재 향기가\
    \ 가득했고, 약간 먼지 나는 오래된 책과의 만남이 느껴졌다.  \n- 그림자들이"
- name: development
  instruction: "- 차하린은 자신의 의지력을 이용해 이계의 현실을 직접 볼 수 있게 되는데, 그것은 기존에 알던 것과는 달리 어둡고 불안정한\
    \ 모습이었다. \n- 마치 어수선한 그림자가 그녀를 감싸듯이 시야가 흐려지며 낯선 세계로 들어간다.  \n- 그녀의 손은 차갑고 부드러운\
    \ 공기를 만졌는데, 그 속에는 숨쉬기 힘든 고요함과 함께 불안감을 가득 담은 어두운 에너지가 흘렀다. \n- '이게 진짜 이계일까?' -\
    \ 그녀는 의문하며 내뱉는 대화에 자신도 확신할 수 없었다.  \n- 그림자의 목소리"
