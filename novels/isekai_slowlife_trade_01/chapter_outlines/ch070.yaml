chapter_n: 70
overall: '{"chapter_n": 70, "act": 1, "content": "이계의 현실을 직접 볼 수 있게 된 차하린은 끔찍한 악몽처럼
  느껴지는 과거 사건들을 목격한다. 그림자들이 가르치는 역사와 이치가 맞지 않는 부분들, 그리고 그 속에서 드러나는 어두운 진실에 대한 불안감이
  점점 커진다. 차하린은 의지력을 극도로 높여 과거의 기억들을 더욱 자세히 파악하려 하지만, 반대로 이계의 현실이 안정되지 않고 위협적인 존재들로
  가득 채워진다는 것을 알게 된다. 그들은 차하린에게 거짓된 이야기만을 던지며 그녀를 그림자 속으로 유인하려 한다."}'
beats:
- name: intro
  instruction: '- ‘그림자’들은 나의 과거를 보여주네. 이게 진짜 악몽같다.’ 차하린은 입을 모으며 주변을 살펴본다. 넓고 평평한 사막
    속, 자색 구슬이 둥글게 지면에 닿아 내리꽂힌 모습. 그 위로는 어두운 그림자가 가득 흐르며 불꽃 같은 파동이 반복적으로 발생한다. 묘하게
    달콤한 과일 향과 고인의 흙냄새가 머무른 공기 속에서 시원한 바람이 부풀어온다. ‘혹시 이게 진짜 현실일까?’ - 그림자가 확장되며, 차하린은
    어두운 갈색 코트를 입고 눈에 띄지 않는 검은색 모자를 쓰고 있는 사람을 보인다. 그는 차가운 목소리로 말하며 “이준 씨, 이제 시작이다.”  -
    ‘시작? 무슨 일인 거야?’'
- name: development
  instruction: '- 차하린은 의지력을 최대한 집중하면서 주변의 그림자들을 관찰한다. 그들은 그녀에게 과거 사건의 片段들을 보여주지만,  그
    속에서 맞지 않는 부분들이 많다. - ‘아침에 자고 있는 동안…나는 누구인가?’ 차하린은 머리부터 발끝까지 걸쳐진 그림자들의 무시무시한 존재감에
    의지를 고취하려 한다. 그러나 그녀는 불안한 감각으로 몸을 돌리고, 이제야 느끼기 시작하는 통증이 심해진다 - ‘고통…왜 이런 기분일까?’
    - 차하린은 바로 앞에서 반짝이는 그림자 주변의 공간을 더 자세히 살펴보며 숨겨진 문장들에 눈길을 집중한다.  - “그래도, 진실이 무엇인지
    알아야 한다.” - 그녀는 즉시 작은 메모를 보관한 채 이곳에서 벗어나려고 한다.'
