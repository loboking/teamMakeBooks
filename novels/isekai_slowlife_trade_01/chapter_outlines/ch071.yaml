chapter_n: 71
overall: '{"chapter_n": 71, "act": 1, "content": "차하린은 의지력을 이용해 과거의 기억들을 깊이 파고들다가
  그림자들의 가르침과는 다른 진실에 대한 단서를 발견한다. 그것은 이계의 역사가 끊임없이 반복되는 악몽처럼 느껴지는 것은 아니라는 것이다.  차하린은
  실제로 이계의 질서를 파괴하려는 음모가 있었고, 그림자들은 그 음모의 일부로 현재까지 속이는 것이었다는 사실을 알게 된다. 차하린은 깜짝 놀라며
  의지력으로 얻은 불안하고 복잡한 정보들을 정리하기 위해 고민한다. 이제 그는 단순히 이계의 물건을 거래하는 것을 넘어, 진실에 가까워지는 여정에
  임하게 된다."}'
beats:
- name: intro
  instruction: '- ‘그림자들’의 가르침은 항상 이계를 이해하는 열쇠였지만, 오늘은 그렇게 느껴질 만한 진실이 적었다.  <br> -
    차하린은 낡은 나무 조각에 새겨진 기하학적 문양을 뚫어 지나가며 내부의 방을 향해 한 걸음씩 다가갔다. 창문에서 비치는 은은한 달빛과 이제껏
    알아본 적 없는 진공처럼 차가운 바람이 공간에 머물고 있었다. <br> - ''차하린, 오늘 아직 그렇게 생각하는구나.'' <br> -  ''그림자들이
    숨기고 있는 무언가는... 내 주변의 모든 것이 허공 속으로 사라지면서 느끼는 빈 공간 같은 듯했다. <br> - ''아무것도 들리지 않는다.'',
    차하린이 생각하며 깊은 호흡을 취했지만, 아직도 두 배의 정원에서 나온 향기가 강하게 남아 있었다.  <br> - 그는 의지력을 이용해 과거의
    기억들을 깊이 파고들자 그림자들의 가르침과는 다른 진실에 대한 단서를 발견했다.'
- name: development
  instruction: '- 차하린은 문장의 끝을 확인하며 손으로 주변을 살다. <br> -  ''그림자들이 그러고 싶어 하는 것, 아니 혹시
    그들 자신이 원하는 것이었는가?'' <br> -  내부에서 온 기묘한 감각이 차하린의 머리 뒤쪽을 타격하며 그는 갑작스럽게 두통에 시달렸다.
    눈이 어지러워졌고, 마치 주변의 장소가 휘둘리는 듯했다. <br> -  그림자들이 속이는 것을 알게 된 순간 차하린은 공허함과 상상하기 곤란한
    진실에 대한 두려움으로 가득했다. ''이계의 역사는 반복되는 악몽처럼 느껴지지는 않았다.'' <br> - 그는 이계의 역사가 끊임없이 반복되는
    악몽처럼 느껴지는 것은 아니라는 사실을 알게 되었지만, 진정한 의미를 파악하는 데 어려움을 겪었다.  <br> - 그는 의지력으로 얻은 불안하고
    복잡한 정보들을 정리하기 위해 고민했다.'
