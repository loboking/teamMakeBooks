chapter_n: 72
overall: '{"chapter_n": 72, "act": 1, "content": "그림자들이 이계의 역사를 조작해왔다는 진실을 알게 된 차하린은
  몸이 무겁고 긴장이 되어 있다. 그녀는 그림자가 가르친 것과는 다른 부분들을 찾아내고 있지만, 그 속에서도 어두운 정황들을 풀어낼 수 없는 마음에
  답답함을 느끼기 시작했다.  그때, 차하린은 이계의 거래를 통해 얻은 정보 중 하나를 발견한다. 그림자들은 이계의 고대 신화 속 존재와 연결되어
  있다는 말이었다. 차하린은 그 신화와 관련된 흔적을 찾아내고 싶지만, 그림자들이 가진 진실을 완전히 파악하기 위해서는 더 많은 정보가 필요하다고
  느낀다."}'
beats:
- name: intro
  instruction: 몸은 무겁다. 차하린은 이제 그림자의 진실을 알고, 그 답답함에 자신만을 비추어 보는 것 같은 느낌이 들었다.  바위와
    나무로 지어진 어두운 골짜기 속에서 그녀가 살아왔던 시간은 거짓으로 가득했다. 이계의 바람은 창백한 얼굴을 뺨하기 시작했고, 오랫동안 머물렀던
    듯 낡은 향이 새로움과 혼재되어 차하린 코를 비비었다.  '그래도 이것만큼이나 정확할까.'
- name: development
  instruction: '비트 마무리 — 회차 climax + 후크 (분량 1,800자+)


