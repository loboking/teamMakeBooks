chapter_n: 73
overall: '{"chapter_n": 73, "act": 1, "content": "차하린은 이계 거래를 통해 얻은 정보로 그림자가 조작해온
  역사와는 달리 진실을 알려주는 다른 세력의 존재를 발견한다. 그들은 끊임없이 반복되는 악몽처럼 느껴졌던 이계 역사가 억지를 이용하여 만들어진 것이라는
  사실을 증명하기 위해 노력하고 있다. 차하린은 진실을 알기 위한 열망과 그림자들의 음모를 파헤치고 싶은 의지로 가득차지만, 그 속에서도 그녀는
  조금씩 불안함을 느끼기 시작한다. 이계의 역사가 허구로 떠올랐던 것은 아니라는 사실이 너무나 놀라우며, 그녀는 자신이 진리에 가까워졌다는 것과
  동시에 더 큰 위험에 직면했다는 것을 느킨다."}'
beats:
- name: intro
  instruction: '- 차하린은 이계 거래를 통해 얻은 정보로 그림자가 조작해온 역사와는 달리 진실을 알려주는 다른 세력의 존재를 발견한다.
    그들은 끊임없이 반복되는 악몽처럼 느껴졌던 이계 역사가 억지를 이용하여 만들어진 것이라는 사실을 증명하기 위해 노력하고 있다. 차하린은 진실을
    알기 위한 열망과 그림자들의 음모를 파헤치고 싶은 의지로 가득차지만, 그 속에서도 그녀는 조금씩 불안함을 느끼기 시작한다. 이계의 역사가 허구로
    떠올랐던 것은 아니라는 사실이 너무나 놀라우며, 그녀는 자신이 진리에 가까워졌다는 것과 동시에 더 큰 위험에 직면했다는 것을 느킨다.'
- name: development
  instruction: '- 차하린은 이계의 숲 속에서 그림자 세력을 피해 달리는 낯선 인물들을 만난다. 그들은 자신들의 부활이 불완전하고 진실을
    완전히 알아내기 위해서는 다른 사람의 도움이 필요함을 이야긴한다. -'
