chapter_n: 74
overall: '{"chapter_n": 74, "act": 1, "content": "차하린은 그들의 증언으로 그림자들이 조작한 역사의 진실을
  알아갈 수 있지만, 그들은 단순히 ''이계의 질서''라는 개념만을 강조하며 특정 사건이나 인물에 대해서는 언급하지 않는다. 차하린은 이를 통해
  그림자가 가진 범위와 정보의 부재가 있다는 것을 알고 의심과 불안감이 증폭된다. 그러자 그녀는 새로운 정보를 얻기 위해 이계 거래 네트워크 속에서
  다른 세력을 찾아 시작한다." }'
beats:
- name: intro
  instruction: "- 차하린은 그림자들의 이야기를 들으며 씁쓸한 미소를 지었다. '역사의 진실'이라니, 그렇게나 시련되는 진실을 내놓으려는\
    \ 이 계의 세력들에 대해 그녀는 알고 있었다. \n-  그들은 황금빛 조각으로 장식된 거대한 벤치 주변에 모였다. 날씨가 좋지 않아서 나무\
    \ 정원은 어둡게 보였고, 시각적 선명도를 더하는 햇살이 부족해 차하린의 머리는 흐릿하고 무겁게 느껴졌다.  따스한 차향이 가득했지만, 공기는\
    \ 고요함과 함께 불안한 에너지로 가득했다.\n- '그렇군요' 라며 그림자들의 이야기를 마무리한 이준씨가 자연스러운 웃음을 지었다. \n-\
    \ '하지만... 그들은 단순히 이계의 질서라는 개념만 강조했어.' 차하린은 말을 시작했다.  \n- '그들에게는 특정 사건이나 인물에 대해서는\
    \ 언급할 자격이 없다고 생각하는가?'\n- 냉정한 시선으로 주변을 살피며 이준씨의 눈은 그녀의 말과 공중의 어두운 에너지 사이를 끊임없이\
    \ 드리웠다.  \n- '그들은 무언가 숨기고 있겠지만...'"
- name: development
  instruction: "- 차하린은 이준씨에게 정보를 얻는 것보다 직접 거래 네트워크 속에서 다른 세력을 찾아보기를 결심했다. 그녀는 손에 있는\
    \ 작물이 아니라, 이계의 '비밀'을 파고들려는 동료들을 찾고자 했는데 그들의 존재 자체가 위험한 신호였다. \n-  그녀는 깊은 숨을 들이고\
    \ 공간의 에너지 변화를 감만했다.\n - 차하린은 이계 거래 네트워크의 주요 교점인 '어두운 시장'으로 향하며 그녀의 손가락이 지속적으로\
    \ 입력하는 키들을 통해 화면에 파란색 글자들이 번갈아 나타났다.  \n- 그녀는 온몸이 넽게 물들면서 불안한 느낌을 잡았지만, 그것은 새로운\
    \ 정보를 얻기 위한 의지의 강력함으로 인해 가라앉혔다.\n- '거래 네트워크에서 새로운 세력은 이미 눈에 띄고 있다.'  \n- 차하린의\
    \ 화면에는 푸르스름한 에메랄드빛 홀로그램 글씨가 나타났다. '이준씨는 그들의 존재를 알기만 하는 것으로 충분했다.'"
