chapter_n: 75
overall: '{"chapter_n": 75, "act": 1, "content": "그림자가 가진 정보의 부재와 그림자들의 언행 사이에서 생기는
  불일치로 인해 차하린은 이계의 ''질서''가 무엇이며, 그 자신이 진실을 알아내려고 하는 행위 자체가 그림자들에게 어떤 의미를 가지는지 고민하기
  시작한다.  그들은 ''질서''만 강조하며 특정 사건이나 인물에 대해서는 언급하지 않으므로 차하린은 그림자가 가진 범위와 정보의 부재가 있다는
  것을 알고 의심과 불안감이 증폭된다. 그러자 그들은 차하린에게 홀로 이계의 진실을 파헤쳐보려면 ''질서''를 무너뜨리는 힘이 필요하며, 그러한
  힘을 얻기 위해서는 그림자가 가진 경계선을 넘어야 한다고 속삭인다. }'
beats:
- name: intro
  instruction: "-  '질서'는 그저 그림자가 가진 정보의 한계일 수도 있다고 생각했다. 차하린은 이준씨를 바라보며 말문이 열리지 않아\
    \ 답답해하는 얼굴이 드러났다.\n - 고요한 성곽 내부,  햇빛이 비치는 벽돌 건축물과 서로 다른 질감을 가진 그림자가 불안정하게 움직이고\
    \ 있다. \n- 시선은 그림자의 변화하는 모습에 집중되어 있고, 차하린은 눈으로 보이는 것만큼이나 그들의 어두운 표상이 머리 속에서 끊임없이\
    \ 움직이는 느낌이다.\n - '질서'는 무엇이며, 이계의 진실은? 차하린은 그림자들에게 질문하며 대답을 얻지 못하는 상황에 자만함을 보였으나\
    \ 그 안으로는 불안한 짐이 커가고 있다. \n-"
- name: development
  instruction: "-  그림자가 공간을 가득 채우며 차하린을 포위하고, 그의 눈은 그림자들의 은유적인 표현에서 진실을 찾기 위해 노력한다.\n\
    \ - 그녀는 자신의 손이 살아있는지 확인하며 답을 얻고 싶어 한다. 그러나 그림자들은 대답을 해 주지 않고 계속해서 '질서'라는 단어만 반복한다.\
    \  \n- 내면의 갈등으로 인해 차하린은 그림자들의 말에 신뢰하기 어렵다는 것을 알아차린다.\n -"
