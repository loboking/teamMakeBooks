chapter_n: 76
overall: '{

  "chapter_n": "76",

  "act": "2",

  "content": "차하린은 숨죽이며 마법을 사용했다가, 굴 내부에 있는 생명체의 공격으로 방어막이 돌아갔다. 그녀는 당황하며 물리적인 공격을
  받고 있음을 확인하고 자신도 계속해서 이를 흡수하는 마나석을 더욱 두근거리는 심장 속에 숨겨두었다. ''내가 진짜 강력한 마법을 사용하려면...?''
  굴 내부에서 느껴지는 공격적인 에너지와 차하린의 깊은 호기심이 만나 서로를 향해 더욱 뜨거운 열기를 불어넣고 있었다."

  }'
beats:
- name: intro
  instruction: "- '역시 이게 마법의 맛인가.' 차하린은 숨죽이며 마법을 사용한 잔여감에 미소를 지어주었다. \n-   굴 벽면은 검은색으로\
    \ 바뀌며, 고대 문양들이 발광하며 생동감을 불어넣는다. 묵직한 향기와 함께 습하고 차가운 공기를 삼입하게 되는데, 그녀는 이 감각이 마치\
    \ 자신에게 친숙한 낯선 환경인 듯하다.\n- '차하린씨, 조심하세요.'  이준 씨의 경계에 가득 찬 목소리가 들려온다. 그는 불꽃으로 장비된\
    \ 창을 발사하여 내부로 향하는 방향에 그 주변 공기를 뒤흔들었다. \n- '걱정하지 마세요, 이준 씨. 굴 내부는 더 안전한 곳이라고 생각하니까요.'\
    \ 차하린의 말은 자신감으로 가득 차 있지만, 그녀가 숨겨놓고 있는 두려움은 계속해서 심장을 강하게 박다 멈추지 않는다.\n-  '내가 진짜\
    \ 강력한 마법을 사용하려면...?' \n  ',"
- name: development
  instruction: "- 차하린은 그 굴 벽면에 새겨진 문양들을 따라 손길을 내뻗고, 반짝이는 에너지로 가득찬 점들이 그녀의 손끝으로 흐르기\
    \ 시작한다.  \n-  '아앗...' 차하린은 입이 마치 찢어질 것 같은 통증과 함께 강한 압박감에 시달리며 눈을 감고 숨쉬려는 도움을 받지\
    \ 못했다.\n- 내부에서 갑작스러운 에너지 파괴로 인한 두통과 체내의 불안정함이 그녀를 짓누르며, '마법이 강력하지만... 마나석의 힘도\
    \ 한계가 있다'라고 생각하며 마음을 정리하려 한다.\n-  '차하린씨?' 이준 씨는 그녀에게 다시 말하지만 대답은 없다."
