chapter_n: 77
overall: '{"chapter_n": "77", "act": "2", "content": "굴 내부로부터 방출되는 푸르른 에너지들이 차하린의
  주변을  춤추며, 마법으로 감싸진 벽이 더욱 강력해졌다. 그녀는 숨죽이며 마법의 흐름을 조절하려고 하지만, 그때까지 알 수 없는 새로운 에너지의
  영향으로 인해 마법은 예상과 다르게 변화했다. 굴 내부에서  생명체가 방출하는 힘이 차하린의 마나석에 영향을 주며, 그녀는 감각을 더욱 집중시키고
  있다. "내 마법이... 이렇게 휘파람 소리처럼 변한다면?" 두려움과 함께  흥미로운 가능성을 느끼는 차하린은 마음 속에서 자신만의 새로운 질문을
  던졌다. 그녀가 마법을 사용하면 더 큰 결과를 얻을 수 있을까? 아니면 이 에너지의 영향으로 치명적인 결과를 맞이하게 될까?" }'
beats:
- name: intro
  instruction: '비트 도입 — 회차 시작부 (분량 1,800자+, 한국 웹소설 톤)


    이 회차 줄거리:

    {"chapter_n": "77", "act": "2", "content": "굴 내부로부터 방출되는 푸르른 에너지들이 차하린의 주변을  춤추며,
    마법으로 감싸진 벽이 더욱 강력해졌다. 그녀는 숨죽이며 마법의 흐름을 조절하려고 하지만, 그때까지 알 수 없는 새로운 에너지의 영향으로 인해
    마법은 예상과 다르게 변화했다. 굴 내부에서  생명체가 방출하는 힘이 차하린의 마나석에 영향을 주며, 그녀는 감각을 더욱 집중시키고 있다.
    "내 마법이... 이렇게 휘파람 소리처럼 변한다면?" 두려움과 함께  흥미로운 가능성을 느끼는 차하린은 마음 속에서 자신만의 새로운 질문을
    던졌다. 그녀가 마법을 사용하면 더 큰 결과를 얻을 수 있을까? 아니면 이 에너지의 영향으로 치명적인 결과를 맞이하게 될까?" }


    위 줄거리를 한국 웹소설 톤으로 본문 1,800자+ 작성. 직전 비트와 사건 중복 금지. 시각·청각·촉각 묘사 포함. 대사 1~2개.'
- name: development
  instruction: '-  차하린은  마법을 다시금 사용하려고 시도했지만, 기존의 원형과는 달리 에너지들이 불규칙하게 흩어지는 모습이었다.
    마법으로 장식된 벽은 지속적으로 변화하며, 그 흐름에서 나오는 푸른빛은 그녀 주변을  무르게 돌았다.   - 굴 벽에서 느껴지는 진동과 함께
    차하린의 발바닥에도 이상한 감각이 전달되었다.'
