chapter_n: 78
overall: '{"chapter_n": "78", "act": "2", "content": "푸르른 에너지가 차하린의 주변을 춤추며 마법은 예상과
  다르게 변화하고 있었다. 그녀는 당황하며 그렇게 변화하는 마법의 흐름을 감시하려고 하지만, 새로운 에너지의 영향으로 인해 마법이 더욱 강력해진다.
  마침내 그녀가 숨죽이며 주문을 완성했을 때, 마법은 빛나는 파동처럼 굴 내부를  휩싸기 시작했다. 그때, 차하린은 힘의 변화에 놀라하며 자신이
  이제까지 알던 것과는 다른 세력에 직면하고 있다는 사실을 깨닫게 된다." }'
beats:
- name: intro
  instruction: "- 차하린은 잠시 휴식을 취하며 마법에 대한 자신감을 되찾고자 하였다.  \n- 그녀는 이전보다 더욱 강력한 에너지를\
    \ 느끼며 숲 속의 고요함에서 주문을 연습했다. \n- 푸르른 바람이 그녀의 코를 자극했고, 새소리가 틈틈이 들려왔다. 그는 곧바로 마법의\
    \ 파동으로 나무를 가볍게 향해 날리며 실력이 떨어진 것은 아니라는 확신을 얻었다. \n- “아직은 안정적인 상태에서 연습해야 할 것 같다.”\
    \ 이준씨는 차하린에게 조심스러운 표현으로 말했다. \n- 그러나 지금까지의 경험과는 다른 방식으로 마법이 흐르고 있다는 느낌이 그녀를 불안하게\
    \ 만들었다."
- name: development
  instruction: "- 차하린은 주문을 시작했지만, 에너지가 예상치보다 강력하게 풀려나갔다. \n- 그녀의 손에서 푸른 에너지가 파괴적인\
    \ 속도로 움직여 그녀는 통증을 느끼며 마법을 중단했다.  \n- “이게… 무슨 일인가?” 차하린은 당황하며 내적 의문을 품었다. \n- 그\
    \ 순간, 새로운 정보 메시지가 나타나고 말았다: ‘신성한 에너지와의 연결으로 인해 마법 체계에 변화가 발생했습니다.’\n- 이는 그녀에게\
    \ 힘과 위험이 동시에 가득찬 낯선 세력을 상징하는 것처럼 느껴졌다. \n -"
