chapter_n: 79
overall: '{"chapter_n": "79", "act": "2", "content": "빛나는 파동이 굴 내부를 뒤덮자, 차하린은 눈을 가리고
  있다가 천천히 안개처럼 사라지는 에너지를 확인했다. 그러나 공기 속의 변화는 이제까지 느껴본 적 없는 정밀하고 강력한 마법으로 변모했다. 그녀는
  숨죽이며 마법의 흐름을 조절하려고 하지만, 새로운 에너지의 영향으로 인해 마법은 예상과 다르게 강력해졌다. 그리고 그 파동 속에서 차하린은 알
  수 없는 존재로부터 의도된 메시지를 받아들여야 한다는 것을 깨달았다. “이제 이 세계가 진정으로 변할 시작을 보게 되겠다.”  그녀의 입술 사이로
  나오는 목소리는 자신감과 동시에 경각심으로 가득했다.}'
beats:
- name: intro
  instruction: '- 차하린은 깊게 들숨을 쉬며, 앞으로 펼쳐진 경치를 담았다.“인생의 지점이 바뀌는 순간이라고 생각하면…” -  굴 내부는
    환청이 가득한 불빛과 어두운 그림자 사이로 변화했다. 시각은 자극적인 반면 후각은 진흙 같은 쓰러진 냄새가 구르고 있었다. 청각엔 멀리서 들리는
    마법의 파동 소리가 희박하게 전달되었다. -  “어떻게 이런 상황이…” 차하린 앞을 지나간 이준씨가 주저앉으면서 물었다.“인생은 불규칙적이고
    변화하는 거야.”   -'
- name: development
  instruction: '- 빛나는 파동이 굴 내부를 뒤덮으며, 차하린은 눈을 가리고 있다가 천천히 안개처럼 사라지는 에너지를 확인했다. - 그녀의
    손톱은 땀으로 적셨고, 마법의 파동에 닿는 순간 온몸이 번쩍이는 통증을 느꼈다.“아… 제발…” 차하린의 속삭임과 함께, 굴 내부에서 새로운
    에너지가 형성되고 있었다. - 그녀의 심장은 빠르게 뛰었지만, 그 파동 속에서 차하린은 알 수 없는 존재로부터 의도된 메시지를 받아들여야 한다는
    것을 깨달았다.'
