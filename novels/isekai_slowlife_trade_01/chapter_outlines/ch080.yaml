chapter_n: 80
overall: '{"chapter_n": "80", "act": "2", "content": "공기 속의 변화는 이제까지 느껴본 적 없는 정밀하고
  강력한 마법으로 변모했다. 그녀는 숨죽이며 마법의 흐름을 조절하려고 하지만, 새로운 에너지의 영향으로 인해 마법은 더욱 거칠게 흔들렸다. 차하린은
  당황하며 자신이 이전에 가진 지식만으로는 이해할 수 없는 강력한 마법파동 속에서 위험을 느끼기 시작했다. 그녀는 자신의 의지로 마법을 유도하기
  어려워지고 있었으며, 마치 새로운 에너지가 그녀의 마음을 움직이는 것처럼 느껴졌다. 차하린은 불안감에 휩싸이면서 이계의 진실과 자신이 가진 능력
  사이에서 더욱 큰 갈등을 경험하게 된다."}'
beats:
- name: intro
  instruction: '"여, 다시 한번 생각해봐야겠다."  차하린은 이계의 자연을 감상하며 긴장된 눈으로 공중에 떠있는 에너지를 훑어보았다.
    주변에는 은빛 꽃잎이 살랑살랑 춤추며 미지의 향기가 퍼졌고, 그 속에서 부드러운 들소 발음이 지속적으로 울려 퍼져나갔다. "요즘 이게 정말
    이상하고..." 그녀의 말은 끝나기도 전에 뒤로 돌아온 이준 씨가 먼저 중단시켰다.'
- name: development
  instruction: '''차하린, 네 입이 어떤 게 더 이상 상황을 악화시키는지 알지?'''
