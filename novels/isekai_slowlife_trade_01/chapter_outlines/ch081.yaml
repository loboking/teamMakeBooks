chapter_n: 81
overall: '{"chapter_n": "81", "act": "2", "content": "  갑작스러운 마법파동으로 인해 굴 내부는 뒤섞인
  에너지로 빛나며 차하린은 공기 속의 변화를 확인했다. 그녀는 조절하려고 하지만, 이전에 경험한 적 없는 강력한 마법파동은 그저 거칠게 흔들리며
  불안정한 상태를 유지했다. 마치 새로운 에너지가 그녀의 마법을 파괴하고 재구성하는 것처럼 느껴졌다. 차하린의 얼굴에는 당황과 공포, 그리고 동시에
  매혹적인 열망이 번갈아 나타났다. 이는 단순한 힘의 증가를 넘어서는 새로운 방향으로 진화하고 있는 것 같았다. 그 순간 그녀는 마법의 흐름을 이해하려고
  애쓰기 시작했다."}'
beats:
- name: intro
  instruction: '''좋은 점부터...'' 차하린은 입을 헐떡이며 마음의 아침 식사를 시작했다. 불현성으로 이루어진 광채가 그녀를 감싸고
    있던 구체에서 굴려낸 벽돌이 가득한 공간은 여전히 어두운 곳이었다. 주변에는 고인물로 된 무언가처럼 느껴지는 돌 조각들과 석재가 되는 나무,
    그리고 이전에 본 적 없는 반짝이는 광선으로 채워진 기체들이 끊임없이 변화하고 있었다. ''...하지만 지금의 상황은 분명히 더 이상 안정적이지
    않다.'' 차하린은 입술을 살짝 위로 올려 말했다. “시스템, 현재 상태 보고해.”'
- name: development
  instruction: '굴 벽면에서 반점이 생겨나며 화면에 정보가 투영되었다. ‘[현재 상황: 마법파동 감지, 강도 90% 증가]’ , ''...뭐가?''
    차하린은 말을 시작했지만, 그 순간 그녀의 머리위로부터 무언가를 쫓는 것처럼 느껴지는 움직임이 나타났다. ‘[마법파동 유형: 변화/분열형]''
    이전에는 경험한 적 없는 강력한 마법파동이 주변 공기를 흔들고 있었다. 차하린은 그 파동을 따라내는 마치 꿈에서 들리는 이상하게 섬뜩한 소리를
    들으며, ‘[현재 상태: 대비 시스템 작동 중]’라고 표시되는 화면으로부터 눈을 돌리지 않았다. ''이거... 내가 만든 것인가?'' 차하린은
    그녀의 마음속에 불안한 생각이 끊임없이 찾아와 다시금 불꽃을 타오르게 하고 있었다.'
