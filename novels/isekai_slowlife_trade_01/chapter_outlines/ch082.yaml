chapter_n: 82
overall: '{"chapter_n": "82", "act": "2", "content": "굴 내부의 에너지 폭발은 점점 더욱 불안정해졌고,
  차하린은 그 강력한 파동을 경험하며 어둠 속에서 무언가 새로운 것을 느끼기 시작했다. 그녀는 자신의 마법이 이전과는 달리 거칠게 변화하고, 그녀의
  몸에 이상한 에너지가 흘러 들어오는 것 같았다.  마치 새로운 생명력이 가득차고 있었다. 공포와 당황감은 사라지고 대신 어린 소년처럼 신비로운
  세계를 탐험하는 흥분이 차오르기 시작했다. 그러나 이러한 변화는 단순한 성장을 넘어서는 새로운 위협을 가리키는 것처럼 느껴졌다. 그녀의 마법은
  강력해진 반면, 불안정해지는 에너지와 미지의 힘들이 그녀를 더욱 어두운 곳으로 이끌고 있었다."}'
beats:
- name: intro
  instruction: "- 차하린은 이제 어두운 곳에서도 빛을 볼 수 있다고 생각했다.  \n - 굴 내부는 점점 더 위험한 공간이 되어가는데,\
    \ 그녀의 마법력이 불안정해지는 것처럼 느껴졌다.  시각적으로 거대한 열곡과 깊은 어둠으로 가득 차 있었다.  마치 수천 년 전부터 그대로\
    \ 변하지 않은 시간을 안고 있는 곳 같았다.   그리고는 칙칙한 돌의 향기와 미지의 무언가를 담고있는 공기를 들이마셨다.   \n-"
- name: development
  instruction: "- 차하린은 주변에 숨겨진 에너지를 감춰 내었다. 그것은 그녀에게 압도적인 파워로 느껴졌지만, 동시에 위협적이기도 했다.\
    \  마법력의 변화는 몸 전체를 쓰릿하게 만들었고, 불안한 기운이 차가운 살수처럼 허리까지 올라갔다.   \n - 그녀의 마음속에서는 비정상적인\
    \ 에너지 소용돌이로 이어진 무언가 신비로운 존재와 같은 느낌이 들었다.\n -"
