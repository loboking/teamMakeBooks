chapter_n: 83
overall: '{"chapter_n": "83", "act": "2", "content": "  차하린은 몸 속에 불안정하게 흐르는 에너지를 멈추려고
  하지만, 조절이 어렵다. 굴 벽면에서 기어오르는 모습을 보며, 그녀의 마법이 이전과 달리 강력하고 통제하기 어렵게 변화했다는 것을 알 수 있다.  마치
  거진 모든 것을 파괴하고 재구성하려는 에너지가 몸속에 가득 차 있었다. 굴 벽면에서 발견된 이상한 기호들은 이전의 마법 체계와 연결되어 있는 것처럼
  느껴졌다. 차하린은 어둠 속에서 불빛을 찾아내고, 그 안에서  이전과는 다른 새로운 마법 문양을 발견한다. 그 순간 그녀의 몸속 에너지가 더욱
  강렬해졌고, 차하린은 이게 무슨 의미일지 몰라도 자신의 마법을 다시 한 번 조절하기 위해 노력했다."}'
beats:
- name: intro
  instruction: '''몸 속에 답답한 에너지가 가득 차있어.'' 차하린은 불빛이 비치는 굴 벽면을 바라보며 중얼거렸다. 주변에는 시각적으로
    뚜렷하지 않지만, 기묘한 열기로 가득찬 공기가 느껴졌고, 약간의 진흙냄새까지 함께 달려왔다.'
- name: development
  instruction: 차하린은 한 손으로 벽면을 만지며 마법력이 몸속에서 흐르는 소리와 열기를 감지했다. '마치 강물이 다리가 생겨 고개를 들으려는
    것처럼...' 그녀의 생각에 불안정한 에너지가 더욱 증폭되어 발코니 벽면을 향해 기어오르기 시작했다.
