chapter_n: 84
overall: '{"chapter_n": "84", "act": "2", "content": "벽면을 따라 힘들게 올라가던 차하린은 마법이 자신에게
  반기를 들고 있는 것처럼 느껴졌다. 이전에는 조종하기 어려웠지만, 지금은 완전히 통제 불능 상태였다.  굴 내부의 에너지 파동이 점점 더 강력해져
  그녀를 압도하려는 욕망으로 가득 차 있었다.  그것처럼 새로운 마법이 자신의 몸 속에서 분출했고, 힘을 통제하기 위한 노력은 결코 끝나지 않았다.
  "'
beats:
- name: intro
  instruction: '- 벽면을 따라 힘들게 올라가던 차하린은 마법이 자신에게 반기를 들고 있는 것처럼 느껴졌다.

    - 굴 내부는 어두워 숨겨진 구석에서 나오는 떫고 시든 풍미만이 그녀를 감싸았다. 위로 올라가던 길은 거친 돌로 이루어져 있었다.

    -'
- name: development
  instruction: "- 차하린은 벽면을 따라 더 올라갔지만 마법의 에너지가 그녀를 무겁게 만들고 있다는 느낌이 들었다. \n- 그녀의 손끝에\
    \ 따스한 감기가 지속되며 가슴이 답답하게 느껴진다.\n-  '아직 통제할 수 없어...' 차하린은 속으로 작별 인사를 하고 마법을 조종하려는\
    \ 순간, 굴 내부의 에너지 파동이 그녀를 감싼 채, '마르르륵' 하는 소리를 내며 진정했다.\n- 새로운 마법이 자신의 몸속에서 분출했고,\
    \ 그 열기와 함께 차하린은 무언가를 맞았다.  차하린의 눈은 짙어진 채 불꽃처럼 빛났다."
