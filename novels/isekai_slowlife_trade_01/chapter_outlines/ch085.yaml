chapter_n: 85
overall: '{"chapter_n": "85", "act": "2", "content": "벽면을 따라 힘들게 올라가던 차하린은 마법이 자신에게
  반기를 들고 있는 것처럼 느껴졌다. 이전에는 조종하기 어려웠지만, 지금은 완전히 통제 불능 상태였다.  굴 내부의 에너지 파동이 점점 더 강력해져
  그녀를 압도하려는 욕망으로 가득 차 있었다.  그것처럼 새로운 마법이 자신의 몸을 맹렬하게 창조하고 파괴하는 순간이 이어졌다. 하지만 그 과정에서
  굴 벽면은 점점 더 투명해져, 차하린은 숨막힐듯한 공기와 함께 뒤로 펼쳐진 광활한 사장의 모습을 볼 수 있었다.  지친 얼굴에 무언가를 기다리는
  긴장감이 지어졌고, 그녀는 내면에서 불안감을 해소하려는 방법을 찾고 있었다. 새로운 마법의 에너지는 자신에게 압도적인 감각을 주었지만, 그 속으로
  들어갈 때마다 차하린은 오묘한 편안함과 새로운 가능성을 느꼈다. "}'
beats:
- name: intro
  instruction: '-  벽면을 따라 기어오르는 건 항상 같은 무서움이 들었지만, 오늘은 더 심했다.

    -  굴 벽의 돌조각들은 깎여 지낸 모양으로 거칠고 차갑게 느껴졌다. 진흙향기가 섞인 쓰러진 냄새와 함께 상쾌한 신선함이 아닌 무언가 묵직하고
    차갑게 들려왔다.

    -  곧 앞에 나타난 인물은 익숙한 얼굴을 가지고 있었다. 이준씨는 그녀의 모습을 보고 살짝 경색했지만, 당황하지 않았다.'
- name: development
  instruction: '- 차하린이 지금 벽면을 오르려는 것은 무덤에 숨겨진 마법의 에너지를 찾기 위한 일이었다.

    - 그녀의 손은 매끄러운 돌벽에 박혀 꿈틀거리는 감각이 느껴졌다. 어두운 곳에서 차가운 공기를 맞으며 얼굴에 가해지는 불쾌한 저림과 함께 심장박동이
    빠르게 치낑치며, 그녀의 손은 벽면을 따라 미끄러져 균형을 잃었다.

    -  ‘내 마음을 이겨야 한다.’ 차하린은 자신에게 속삭였다. ''만약 이것이 진정으로 내겐 해로운 마법이라면...''

    - 그녀의 시선은 벽 표면에 새겨진 기묘한 문양으로 향했다. 무언가를 알고 있는 듯한 느낌이 들었다.'
