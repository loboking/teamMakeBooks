chapter_n: 86
overall: '{"chapter_n": "86", "act": "2", "content": "굴 내부의 에너지 파동이 차하린의 몸을  압도하려는
  욕망으로 가득 차 있었다. 마법은 그녀를 통제하려고 하는 것처럼 느껴졌다.  그 힘에 맞서 끊임없이 저항했지만, 점점 더 휘어지는 마치 죽음의
  아픔과 같은 신체적인 고통을 느낄 수밖에 없었다. 이는 단순한 에너지 파동 이상의 무언가였다. 차하린은 자신의 몸에서 새로운 힘이 태어나고 있음을
  알았지만, 그 힘을 제대로 조절하는 방법이 찾지 못해 두려움으로 가득 차 있었다. 이제 그녀는 단순히 이계 거래를 해야 하는 것이 아니라, 자신이
  되어가는 과정에서 생명 자체의 한계를 깨뜨려야 한다는 것을 알았다."}'
beats:
- name: intro
  instruction: '-  ''정신 차려, 이게 아직 시작일 뿐인 거야.'' 차하린은 자신의 내면을 자극하며 굴 벽에 기대어 들었다.

    - 핵심 공간 묘사 (시각 2 + 후각/청각 1): 검은빛 바위벽이 마치 무한의 구멍처럼 보였다.  굴 내부는 차가운 석질로 이루어져 있고,
    상쾌한 신선함을 더하는 달콤한 향기가 느껴졌다. 그러나 곳곳에 묻히듯 느껴지는 거대한 에너지 파동은 차하린의 몸을 진정으로 위협하고 있다는
    것을 알려주었다.

    - 첫 인물 등장 + 호칭("이준 씨" 등):'
- name: development
  instruction: "- 핵심 사건 발생 (동작 단위 묘사): 차하린은 공간을 뒤덮는 에너지 파동에 대한 저항으로 손을 갈고 닦았다. 그녀의\
    \ 피부는 검정빛으로 변하며, 통증이 이어졌다.\n-  통증/충격 등 신체 감각: '으르릉...' 차하린은 어두운 구멍 속에서 마법에 의해\
    \ 만들어진 에너지 파동을 느끼며 고통스러웠던 것처럼 숨이 가쁘게 들었다. \n- 내적 독백 1~2줄:\n' 이건 단순한 거래가 아닌...\
    \ 나의 몸은 어떻게 되고 있지?'\n - 새 정보 발견 (단서/메모/시스템 메시지): 차하린의 시선이 공간에 있는 작은 은빛 점으로 향했다.\
    \ 그것은 에너지 파동과 상호작용하고 있는 것처럼 보였다."
