chapter_n: 87
overall: '{"chapter_n": "87", "act": "2", "content": "무언가를 잡고 있듯이, 마법은 차하린의 몸을 거듭
  압박했다.  두통과 어깨의 통증을 감넘어 일어나던 그녀는 공허함 속에서 자신을 찾지 못하고 있었다.  마치 수면하는 동안 가족에게 떨어진 물건을
  다시 찾으려고 애쓰듯이 몸을 움직여도, 이제는 그 이상의 의미를 가지지 않는 것이었다. 그 순간에 그녀가 보던 세계는 조각처럼 분해되고 각자의
  색채로 빛나며 그녀를 발전시켰다.  마법은 어둠 속에서 잠들어 있던 존재들을 일으키고, 차하린의 의지와 맞서 불균형을 만들었다."}'
beats:
- name: intro
  instruction: "- \"시험부터 잘 끝내면 이게 아무것도 아니야.\" 차하린은 하늘을 향해 한숨을 내쉬며 숲의 은빛 햇살에 비친 자신의\
    \ 모습을 살퐘. \n-  수많은 잎사귀가 바뀌는 소리와 함께, 새들이 지저귀는 소리가 가끔씩 들려왔다. 하지만 이 순간에는 이 세상의 소리는\
    \ 차하린에게 아무것도 의미를 가지지 않는 것처럼 느껴졌다.  \n-  '이준 씨.' - 한낮의 햇살 속에서, 오히려 어둠을 분출하는 인물이\
    \ 나타났다. 그의 눈은 거칠고 매혹적인 색깔을 지녔으며, 이는 차하린에게 알 수 없는 무언가를 간직하고 있었다. \n-  \"어떻게 생각해?”\
    \ - 이준 씨의 목소리는 차가웠지만, 가슴깊이 날카로운 느낌을 주었다.\n- \"아직은 모르겠다.\" 차하린은 자신의 감정을 표현하는 데\
    \ 어려움을 느끼고 있었다. \n-  그 순간, 그녀 앞에서 바스락거리는 숲의 조각으로 이루어진 무언가가 나타났다.\n{"
- name: development
  instruction: "- 차하린은 갑작스러운 변화에 대해 자신을 파괴하려는 존재와 맞서야 할지도 모른다는 생각에 당황했다.  마치 죽어갈 것\
    \ 같은 공포감이 그녀를 감겼다. \n-  \"뭐가 일어나고 있구나?\" 차하린은 자신의 몸의 무거움, 마치 바위와 같은 단단함을 느끼며 내부에서\
    \ 온 소란에 시달렸지만, 정확한 상황이 이해되지 않았다. \n-  차분하고 신중하게 대처해야 한다는 생각은 그녀가 가진 이제껏의 경험과 힘들어하는\
    \ 자신의 감정 사이에 놓여 있었다.\n -   '도움을 요청할 만큼 심각한 상황일까?' 차하린은 자신이 직면한 위기에 대한 의심스러운 생각을\
    \ 내밀며 불안하고 긴장된 상태에서 계속해서 돌아다녔다. \n-  무언가에 연결되어 있는 것처럼 느끼는 경계의 한계를 알지 못했다.\n- \"\
    괜찮겠어?\" - 이준 씨의 목소리는 차갑고, 비정상적인 상황을 더욱 악화시키는 듯한 인상을 주었다."
