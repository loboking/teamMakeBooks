chapter_n: 88
overall: '{"chapter_n": "88", "act": "2", "content": "차하린은 혼란스러워하며 자신이 어디에 있는지, 무엇을
  하는지 파악하려 애썼다. 그녀의 시각은 회전하는 빛으로 가득 차 있고,  마치 거대한 수면 중인 해양 동물의 내장 속에서 잠든 것처럼 느껴졌다.
  불안감이 그녀를 감싸쥐었지만, 그보다 더 큰 것은 몰입스러움이었다.  차하린은 마법이 자신을 통해 이어지는 세상의 기적에 맞서 몸과 마음을 드넓게
  열고 있었다. 하지만 갑작스런 공간 이동으로 인해 그녀는 다시 한번 불안감에 사로잡혔다. 어디로, 그리고 무엇을 위해 이동했는지 답을 찾기 시작했다."}'
beats:
- name: intro
  instruction: '- ‘이게 어디일까?’ 차하린은 자신이 어딘가 옮겨졌다는 사실을 깨닫고 주변을 똑바로 바라보았다. 그녀의 시각은 회전하는
    빛으로 가득 차 있었다. 마치 거대한 수면 중인 해양 동물의 내장 속에서 잠든 것처럼 느껴졌다.  - 부드러운 담요 같은 감촉이 그녀를 감싸고
    있었지만, 그 안에서도 어두움과 무거운 냄새가 그녀를 뒤덮었다. 마치 고대 기록이 보존된 서랍 속의 먼지와 진흙을 맡는 것처럼 신선하지 않은
    냄새였다.  - ‘차하린아, 네가 이런 상태로 잠든 건 안전하지 않다.’ 이준씨의 목소리는 마치 멀리서 들려오는 소리처럼 차분했다. - ''이준씨?
    이게... 어디죠?'' 차하린은 불안함을 감추고 이준씨에게 물었다.'
- name: development
  instruction: '-  차하린 앞에서 벽이 부풀어 오르며, 빛나는 그림자들이 그녀를 향해 스쳐 지났다. 그 그림자는 온몸에 날카로운 파열과
    같은 통증을 일으켰다. - ‘아...’ 차하린은 간절한 대항없이 입술로만 소리를 내고 공간의 변화에 맞춰 몸을 비틀었다. 그녀의 머리 속에서는
    방황하는 어둠과 불안한 빛들이 조합된 복잡한 이미지가 스쳐 지났다.  - ‘지금은 이쪽으로 이동해야 한다.’ 이준씨의 목소리는 더욱 가까워졌고,
    그와 함께 차하린 앞 화면에 ''이동 중''라는 메시지가 나타났다.'
