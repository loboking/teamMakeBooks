chapter_n: 89
overall: '{"chapter_n": "89", "act": "2", "content": "그것은 몸이 아닌 마치 영혼의 속삭임처럼 느껴졌고,
  차하린은 의지를 발휘하여 그 속에서 자신을 돌리려고 시도했다. 그녀는 불안정한 에너지 흐름에 휩싸인 채, 이 세상이 무엇인지 이해하지 못하는 혼란스러움을
  느끼며 마침내 눈을 열었다. 검은빛 벽면에서 반짝이는 고요한 점들이 나타나고 사라지는 모습을 볼 수 있었다. 그녀는 다시 한번 자신이 있는 곳이
  이계라는 것을 알아차렸다. 하지만 이제 몸속의 불안정함은 가만히 있지 않았고, 차하린은 자신의 상태를 이해하기 위해 몸의 일부분에 의지를 집중시키려고했다."}'
beats:
- name: intro
  instruction: "- 차하린은 주변의 어두운 공간을 짚으며 말했다.\n- 검은빛 벽면과 위로는 거대한 천장이 마치 무한한 어둠 속에 갇혔다고\
    \ 느껴졌다. 뒤에는 방향 감각을 상실하며 고요하게 바닥의 점들이 나타나고 사라지는 모습을 볼 수 있었다.\n- 차하린은 숨쉬는 소리만 들려오는\
    \ 가난한 환경에서 어두운 공간의 진동에 맞춰 심장이 두근거렸다. \n- \"정말 이상한데, 이런 곳에 도착할까?\" \n-  마침내 그녀가\
    \ 말을 꺼냈지만, 그 목소리는 자신의 귓속에서만 들려왔고, 차원의 경계는 방해하는 것이 아니라 마치 속삭임처럼 느껴졌다."
- name: development
  instruction: "- 차하린은 이계 세계로 온 순간부터 몸속에 불안정한 에너지가 퍼져나갔다. 그녀의 손길이 벽면을 따라 움직이며,  따뜻함\
    \ 대신 날카로운 감각만 느껴졌다.\n- '자라'와 같이 극도로 차가운 온도를 맞는 것처럼 두통과 함께 신체 곳곳에 고통스러운 통증이 번져\
    \ 나갔다. \n-  \"어떻게 일단 이 에너지를 감당해야 할까?\"\n - 그녀의 머리에는 갑작스런 방해가 아니라, 마치 불쾌한 기억들이\
    \ 떠오르는 것처럼 몸속에서 생생하게 느껴지는 무언가에 대한 두려움이 커졌다.\n- 차하린은 그 힘을 이해하려고 다시 한번 의지를 모으며 에너지의\
    \ 진동을 따라 이동하는 주체를 찾아보려고 하였다."
