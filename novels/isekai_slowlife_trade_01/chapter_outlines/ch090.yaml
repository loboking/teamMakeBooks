chapter_n: 90
overall: '{"chapter_n": "90", "act": "2", "content": "반짝이는 고요한 점들이 나타나, 차하린의 시선을 끌었다.
  그들은 불안정하게 움직이며, 마치 생명을 가진 것처럼 느껴졌다. 그녀는 순간적으로 과거에 온전히 몸을 담그는 방법을 찾으려고 애썼지만, 점들이
  끊임없이  움직이는 속도가 너무 빠르게 변화하며 자신의 의지로 만드는 것이 어렵다는 것을 알았다. 차하린은 순간의 광채가 그녀를 삼키기 전에 마주했던
  벽면을 다시 한 번 바라보며, 혹시 이 세계에서 자신이 하는 일이 무엇인지 깨달아야 한다는 생각이 들었다.  그럴 만한 용기를 내어 자히자만의
  힘으로 점들을 조종하려고 시도했다. 그녀의 마음은 의지와 불안감 사이로 갈등하며, 고속 이동하는 점들에 대한 이해가 필요하다는 것을 알았다."}'
beats:
- name: intro
  instruction: "-  '혹시 이게 진짜 '슬로우 라이프'일까?' 차하린은 생각을 멈추려고 했다.\n- 주변에 자리잡고 있는, 반짝이는\
    \ 고요한 점들이 그녀를 압박하는 것처럼 느껴졌다. 그들은 불안정하게 움직이며 마치 생명체로 느껴진다. \n  점들의 번쩍임은 옅은 파란빛과\
    \ 분홍빛을 내며, 차하린에게는 시각적으로 섬뜩하고 매력적인 모습으로 보였다. 그리고 그들은 그녀의 주변에 퍼져나가면서 고요한 공간 속에서\
    \ 소리 없이 춤추기 시작했다.\n- '저기... 이준 씨!'\n  차하린은 조금 거리를 두고 있는, 은빛 머리카락을 가진 이준에게 말했다.\
    \ 그의 눈은 점들을 바라보며 불안한 표정을 지었다. \n- '너도 그렇게 느껴지니?'\n-  점들이 끊임없이 움직이는 속도가 너무 빠르면서...\
    \ 차하린은 머릿속에서 어떤 패턴을 찾으려고 애썼다."
- name: development
  instruction: "- 차하린의 손은 자연스럽게 공중에 뻗어나간다. 그녀는 점들을 향해 집중력을 높이면서 불안감과 의지를 동시에 느꼈다.\
    \ \n -  손바닥이 날카로운 바람처럼, 시험관 벽으로 만들어진 세련된 도구를 통해 차가운 촉각이 전달되며 진동하는 것을 시작했다. \n\
    - '뭐가... 뭔가 있을까?'\n    차하린은 점들의 모양을 정확히 파악하고 싶었다. 그들은 불안정하게 움직이며, 마치 생명체처럼 느껴졌다.\
    \ 그녀의 손끝이 도구를 통해 점들이 닿는 순간, 차가운 공기가 스피어와 같은 형태로 변화하며 발열을 시작했다. \n- '멈춰야 한다! 아무리\
    \ 작고 불안정한 것일지라도...'\n    차하린은 조심스럽게 점들의 움직임을 관찰하려는 시도를 하지만, 그녀의 머릿속에서 두통이 시작되었다.\
    \ \n- '내 몸이...' 이준의 목소리에 의해 차하린은 자라난 생각으로부터 다시 실제로 돌아왔다. \n-  '차하린, 네 손!'\n-"
