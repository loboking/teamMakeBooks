  instruction: "- '점들이 끊임없이 변화하는 속도가 너무 빠르게' 차하린은 자신의 말에 잠시 멈췄다.\n - 주변의 벽면은 점들의 무질서한\
    \ 이동으로 인해 마치 거품처럼 흐르고 있었다. 은색과 진홍색의 점들이 서로 교차하며 빛을 뿜어내는 광경이 눈부셨다.  점들의 지속적인 소음,\
    \ 가끔 들리는 '쨍' 하고 '흣' 하는 소리가 그녀의 주변 공간을 채워놓았다.\n-"
