chapter_n: 91
overall: '{"chapter_n": "91", "act": "2", "content": "점들이 끊임없이 변화하는 속도가 너무 빠르게 변화하며
  자신의 의지로 만드는 것이 어렵다는 사실을 마음속에 새기고 차하린은 다시 한번 주변을 살펴보았다. 그녀의 시선은 점々으로 이루어진 벽면에서 벗어나,
  앞쪽 공간의 중심부를 향했다. 그리고 그곳에는 홀로 고대의 모습을 지니고 있는 거대한 문이 하나만 있었다. 차하린은  문 주변에 형성된 에너지
  흐름을 파악하며 불안한 마음과 더불어 설렘이 점점 커졌다. 그녀는 문을 향해 천천히 걸으며, 이 세계의 진실을 찾아 나갈 여정이 시작되었다."}'
