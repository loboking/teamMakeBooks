chapter_n: 92
overall: '{"chapter_n": "92", "act": "2", "content": "홀로 고대의 모습을 지니고 있는 존재 앞에 차하린은
  몸이 무겁게 느껴졌다. 그녀는 천천히 호흡하며 자신만을 위한 전술을 세우려고 했다. 그러나 이 공간 내부에서는 자신의 의지가 통하지 않는 것처럼
  느껴졌다. 마치 진실의 고요함 속에서 시간 자체가 멈춰버린 듯, 차하린은 주변의 정적 에너지에 휩싸이면서 불안감을 느꼈다. 그 순간, 그녀는 고대
  존재에게 ''도움''을 요청하는 것을 생각했다. 어떤 진실을 알아내야 하는지, 그리고 이곳에서 무엇을 얻어야 하는지."}'
beats:
- name: intro
  instruction: '''괜찮아, 다시 시작해보면 될 거야.'' 차하린은 속삭이고 공간을 넓혀 보냈다. 마치 진실이 담긴 방 하나가 앞에 놓인
    것처럼 느껴졌던 이곳에는 오래된 벽돌과 지붕만 남았고, 고요한 정적 에너지가 그녀의 피부를 만족스럽게 자극했다.  깊은 곳에서 불꽃 같은 조명이
    미끄러져 내려오는 묘한 현상을 마주했지만, 이는 차하린에게 친숙한 분위기였다. ''도움''이 필요할 때마다 찾던 공간, 고대 존재가 거울처럼
    반사되는 곳…'
- name: development
  instruction: '비트 마무리 — 회차 climax + 후크 (분량 1,800자+)


    이 회차 줄거리:

    {"chapter_n": "92", "act": "2", "content": "홀로 고대의 모습을 지니고 있는 존재 앞에 차하린은 몸이 무겁게
    느껴졌다. 그녀는 천천히 호흡하며 자신만을 위한 전술을 세우려고 했다. 그러나 이 공간 내부에서는 자신의 의지가 통하지 않는 것처럼 느껴졌다.
    마치 진실의 고요함 속에서 시간 자체가 멈춰버린 듯, 차하린은 주변의 정적 에너지에 휩싸이면서 불안감을 느꼈다. 그 순간, 그녀는 고대 존재에게
    ''도움''을 요청하는 것을 생각했다. 어떤 진실을 알아내야 하는지, 그리고 이곳에서 무엇을 얻어야 하는지."}


