chapter_n: 93
overall: '{"chapter_n": "93", "act": "2", "content": "그 공간의 진정한 모습이 드러나는 순간, 차하린은
  숨을 크게 들였다. ''고대''라고 표현하기에는 너무나도 현실적이고 생동감이 가득했지만, 오랜 시간 동안 그 자체로 존재하며 세상을 관찰해온 덩크만
  같았다. 마치 이세계의 진정한 본질을 담고 있는 삶의 모습이었다. 차하린은 자신이 접한 모든 정보와 경험들을 바탕으로 해석하려 하였지만, 그 존재는
  언어로 표현될 수 없다는 것을 느꼈다. 그녀의 마음속에는 무언가를 파악할지도 몰라 과정에서 불안감이 커져갔다. 이 공간은 그녀의 의지를 거스르며
  자신만을 위한 시각으로 세상을 관찰하는 존재로 인식했다는 생각이 들었다."}'
beats:
- name: intro
  instruction: '''뭐든 이세계에서 해결해버리면 현실은 살아갈 수 있겠지.'' 차하린은 마치 저절로 떠오른 생각에 공황적인 미소를 지으며
    내뱉었다.  벽돌과 나무조각으로 가득찬 창고가 잡곡처럼 허술하게 쌓여 있는 곳이였다. 이전에는 서늘했지만, 이제는 고기 냄새와 함께 차갑게
    느껴지며 오통을 불러일으켰다. ''아직 시간은 남았지만...''  차하린의 마음속에서는 어떤 존재를 찾고 있었다. 그녀는 곧바로 그 공간의
    진정한 모습이 드러나는 순간, 숨을 크게 들였다. 이때는 내 눈에 들어오는 모든 것이 꿈처럼 느껴져 시각적 정보만으로도 그녀의 마음은 가득
    차 있었다. ''이준 씨''가 오늘 만난 곳에 대한 설명은 그리 생생하게 기억났다.'
- name: development
  instruction: 무언가를 발견한 것처럼 그녀는 손을 주름진 나무 위로 천천히 가져왔다. 차하린의 손가락 끝에는 금빛 펄이 어렴풋이 반짝였다.
    '...왜 숨겨져 있었을까?' 몸은 무거워지는 느낌을 받았고, 그녀는 가슴 속에 비틀거리는 두근거림으로 인해 호흡이 빨라졌다. 차하린의 손가락
    끝에서 금빛 펄이 점점 커지며,  나뭇잎처럼 펼쳐진 것과 같이 광채를 발산했다. 마치 무슨 진실을 알려주는 것처럼 보였다. 그녀의 시선은 그곳으로
    집중되었고 '내가 이곳에 오게 된 이유'라는 질문이 스며들었다.
