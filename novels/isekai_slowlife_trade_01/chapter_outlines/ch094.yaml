chapter_n: 94
overall: '{"chapter_n": "94", "act": "2", "content": "차하린은 덩크의 진실을 담고 있는 모습에 경외감과
  함께 두려움을 느꼈다. 고대 존재가 지닌 위압적인 분위기는 그녀를 공허한 상태로 만들었다. 하지만 차하린은 곧 다시 자신을 이끌어내고, 덩크의
  진리 속에서 새로운 가능성을 찾으려 했다. ''무엇이든 그 자체로 존재한다면, 무엇이든 변화할 수 있다''는 생각이 그녀를 안겼다. 차하린은  덩크에게
  자신의 의지를 밝히며 대화를 시도하려고 했다. 하지만 덩크의 대답은 예상보다 달라..." }'
beats:
- name: intro
  instruction: '-  차하린은 오늘도 이계에서 슬로우 라이프를 보내며, 그저 시간을 느끼고 있었다.

    - 주변의 나무는 깊고 진한 녹색으로 물들어 있으며 숲길에는 은빛 꽃잎이 흩뿌려져 있다. 햇살은 가볍게 어깨를 따스하게 두드린다. 하지만 차하린은
    그 상황을 무시하며, 눈앞의 작지만 복잡한 모습에 집중했다.

    -  ''이준씨, 이거 진짜로 괜찮을까요?''

    - ''으흠, 아무리 의심스러워 보여도 너는 항상 그렇게 말하잖니. 불안해하지 마. 내가 알아서 해결할 거야.''

    - 차하린이  꺼낸 작은 돌 위에 문양이 새겨져 있고 빛나는 검정색 점이 하나씩 발광하는 모습이었다.'
- name: development
  instruction: '-  덩크의 진실을 담고 있는 모습에 경외감과 함께 두려움을 느꼈다. 고대 존재가 지닌 위압적인 분위기는 그녀를 공허한
    상태로 만들었다. 잡아채지 못하는 불안한 심장 박동은 차하린의 손길을 강조했다.

    -  마치 뜨겁고 날카로운 금속이 피부에 직접 접촉하는 것처럼 시스테믹하고 위협적인 기분이 그녀를 감싸들였다. 숨을 참는 것은 불가능했다.

    -   ''내... 내가 잘못했다면, 다시 바로잡을 수 있다.''

    - 차하린은  덩크에게 자신의 의지를 밝히며 대화를 시도하려고 했지만, 둥근 눈동자들이 반짝이며 말이 안 나오는 채 혼란스러운 표정만 보였다.

    - ''무슨 일이야? 당신...'''
