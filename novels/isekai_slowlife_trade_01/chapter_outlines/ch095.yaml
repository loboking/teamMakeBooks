chapter_n: 95
overall: '{"chapter_n": "95", "act": "2", "content": "차하린은 덩크의 진실을 담고 있는 모습에 경외감과
  함께 두려움을 느꼈다. 고대 존재가 지닌 위압적인 분위기는 그녀를 공허한 상태로 만들었다. 하지만 차하린은 곧 다시 자신을 이끌어내고, 덩크의
  진리 속에서 새로운 가능성을 찾으려 했다. ''무엇이든 그 자체로 존재한다면, 무엇이든 가치를 지닌다.''  차하린은 덩크의 말을 통해 얻은 새로운
  통찰력으로 이계의 물건 거래에 대한 자신의 의식을 바꾸고자 했지만, 그녀는 여전히 덩크의 진실을 완벽히 이해하지 못했다. 차하린은 더 많은 정보를
  얻기 위해 덩크에게 질문을 던졌다. "당신이 말하는 ''가치''는 무엇입니까?" 하지만 덩크의 답변은 기대와 다르게 비정상적인 방식으로 나타났다."}'
beats:
- name: intro
  instruction: '''괜찮아, 한 번 더 봐도 돼.'' 차하린은 덩크의 모습을 가리키며 말했다. 주위는 이계와 현실이 연결된 장소라는 걸
    알고 있는 사람만 찾아온다. 그곳의 공기는 어디에도 없는 독특한 꽃향기를 풍겼고,  거울처럼 반짝이는 섬광이 벽에 내려앉으면서 차가운 금속과
    같은 정전기적인 느낌을 주었다. ''... 왜 이렇게 무겁지?''.'
- name: development
