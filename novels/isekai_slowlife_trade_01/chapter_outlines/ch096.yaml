chapter_n: 96
overall: '{"chapter_n": "96", "act": "2", "content": "덩크의 진실을 담고 있는 모습은 차하린에게 깊은 인상을
  남겼다. 그러나 그녀는 곧 긍정적인 에너지를 발견했다. 고대 존재의 힘은 단순히 파괴적이 아니라 창조적이라는 깨달음이었다.  덩크의 진리 속에서
  새로운 가능성을 찾고자 하는 차하린은 이계의 다른 존재들과 교류하기로 결심한다. 그녀는 무엇보다도 자신의 능력을 키우고 싶었으며, 덩크의 영향으로
  얻게 된 신기한 지식들을 활용하려고했다. 하지만 그 과정에서 차하린은 예상치 못한 어려움에 직면하게 된다." }'
beats:
- name: intro
  instruction: "-  '덩크가 진짜 이상한 존재인 건 분명했다.' 차하린은 이계의 거래로 얻은 신비로운 무언가를 다시 한번 훑어본다.\
    \ \n-  핵심 공간 묘사 (시각 2 + 후각/청각 1)\n    - 석고양이 모양의 상자는 검은빛으로 물들어 있었다. 차하린은 불을 타오려서\
    \ 그 안에서 펼쳐진 그림과 같은 무언가를 보도록 했다. 화분의 흙냄새와 함께 석상자 내부로부터 흘러나온 신비로운 음향이 그녀에게 깊은 감동을\
    \ 주었다.\n- 첫 인물 등장 + 호칭(\"이준 씨\" 등)\n    -"
- name: development
  instruction: "-  핵심 사건 발생 (동작 단위 묘사) \n     - 차하린은 긴 손가락으로 상자를 조금 더 돌려보았다. 그림 속에\
    \ 있는 무언가가 움직인다는 것을 알 수 있었다. 그녀는 숨을 고르며 불꽃이 점점 커지고 있는 모습을 지켜봤다.\n- 통증/충격 등 신체 감각\
    \ \n    -  눈으로 보는 것만은 아니었지만, 차하린의 심장마저 두근거리는 듯했다. 그녀는 자신이 이전에 본 적 없던 신기한 감정을 느끼고\
    \ 있었다.\n- 내적 독백 1~2줄\n    - '무엇일까?' 그녀가 그 자리에서 멈추어 생각했지만, 정답은 찾지 못했다. 오히려 더욱 불안하고\
    \ 흥미로운 감각이 그녀를 휩쓸고 있었다.\n- 새 정보 발견 (단서/메모/시스템 메시지)\n    -  '주의!' 차하린의 눈앞에 깜빡이는\
    \ 작은 문구가 나타났다. '덩크와 관련된 위험한 존재를 만나야 한다.'\n- 마지막 줄: 다음 비트로 넘기는 미세한 위기 신호"
