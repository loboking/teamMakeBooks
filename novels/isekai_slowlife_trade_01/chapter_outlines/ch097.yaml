chapter_n: 97
overall: '{"chapter_n": "97", "act": "2", "content": "덩크의 진리가 담긴 모습을 통해 새로운 가능성을 찾기
  위해 의사를 결정한 차하린은 이계에 널리 알려진 거래 시장으로 향한다. 그곳에서 그녀는 다양한 종류의 물건과 정보들을 접하고, 특히 고대 존재의
  힘과 관련된 이상한 무언가를 찾아본다.  매치는 모든 것을 이끌어낸다고 여겨지는 거대한 신화적 존재의 영향력이 크다는 점을 알게 되면서 차하린은
  그녀의 진실에 대한 갈증이 더욱 커지고, 그 숨결을 찾기 위해 발를 들인다. 하지만 시장에서의 만남들은 예상치 못한 위협으로 이어진다." }'
beats:
- name: intro
  instruction: '''덩크의 진실은 이게 될 수밖에 없겠다.'' 차하린은 시장으로 향하는 길을 중간중간 바라보며 말했다. 공허한 골짜기
    사이로 솟아오른 오래된 돌탑들은 마치 거대 무리의 나무들이 모여 서 있는 것처럼 보였고, 그 냄새는 고향 구름이 지나가면서 발산하는 어린 아이들의
    시각에서 볼 수 없는 깊은 바다를 상상하게 한다. 아마도 이쪽으로 온 사람들은 해당 지역에 거주하거나 여기를 방문하는 길로 가리키는 섬세한
    그림자 그들이 지나간 후에도 그 안이 고요하지 않아 보았고, 주변에서 들리는 부드러운 목소리는 차가운 바람처럼 기분을 나쁘게 한다. 이준씨가'
- name: development
  instruction: '''마치 아르떼로 만들어진 것 같다.''이준 씨는 그들의 상황을 더욱 좋지 않은 곳으로 변화시키기 시작했다.'
