chapter_n: 98
overall: '{"chapter_n": "98", "act": "2", "content": "거래 시장에서 접한 정보들을 바탕으로 차하린은 고대
  존재의 힘과 관련된 특정한 물건을 찾아내고, 그 가치를 절대적으로 확신한다.  하지만 막강한 능력을 지닌 그 물건을 구입하려면 상당한 비용이 필요하며,
  차하린은 이계의 거래 시장을 통해 얻은 모든 자산을 걸고, 조급함과 불안정함을 느끼며 위험한 카드를 내려야 한다는 현실에 직면한다.  어떤 가치를
  추구하는 존재인지 떠올리며 두 번째로 더 큰 도전을 시작한다."}'
beats:
- name: intro
  instruction: '- 주인공의 자조/일상 톤 1줄로 시작

    - 핵심 공간 묘사 (시각 2 + 후각/청각 1)

    - 첫 인물 등장 + 호칭("이준 씨" 등)

    - 짧은 대사 1~2개

    - 마지막 줄: 다음 비트로 넘기는 미세한 위기 신호'
- name: development
  instruction: '- 핵심 사건 발생 (동작 단위 묘사)

    - 통증/충격 등 신체 감각

    - 내적 독백 1~2줄

    - 새 정보 발견 (단서/메모/시스템 메시지)'
