chapter_n: 99
overall: '{"chapter_n": "99", "act": "2", "content": "조급함과 불안정함을 감추기 위해 차하린은 침착한 얼굴로
  거래 시장 주변 사람들과 대화를 나누며 정보를 수집한다. 그녀가 구입하려는 물건의 가치와 그 이면에 숨겨진 진실을 파악하기 위해 노력하는 모습은
  다른 거래자들에게 신기함을 자아낸다. 하지만 차하린은 자신의 목표를 향해 나아간다. 결국, 그녀는 고대 존재의 힘을 담고 있는 오랜 시간 동안
  기억된 물건을 발견하고, 그 가치에 대한 확신이 더욱 강해진다. 그러나  물건을 구입하려면 거래 시장에서 가장 위험한 도박으로 불리는 ''블랙잭''
  게임을 승리해야 한다."}'
beats:
- name: intro
  instruction: '''조금만 더 차분해야겠다.'' 거래 시장의 왁자지껄한 소리에 차하린은 입술을 조그마게 살짝 움직인다. 하늘 높이 올라가는
    골든 아치를 배경으로, 다양한 색상의 무언가들이 어우러진 복잡하고 역동적인 시각 퍼즐 같은 거래 시장은 그녀에게 오히려 평화로운 공간을 제공한다.
    상선에서 풍기는 향긋함과 가격 협상 소리 사이로, 차하린은 은밀하게 정보를 수집하기 시작한다.  ''그 물건이 있다면...'' 신중한 표정으로
    이준씨가 마지막 상품을 보여주자, 차하린의 눈동자가 반짝인다. ''아니, 아직 멀었다.'''
- name: development
  instruction: "차하린은 이준씨의 손에 드는 고급 광석을 자세히 살펴본다. 검은색으로 윤기가 나는 광석에는 불빛이 반짝이며 오래된 에너지를\
    \ 가진 것처럼 느껴진다. '이 덩어리만큼이나 오랫동안 기억되었던 물건, 그 진실' 차하린의 손끝에 닿는 시원한 온도가 그녀를 일깨우듯, 이준씨\
    \ 말을 듣고 눈으로 확인한다. '거래 시장에서 가장 위험한 도박이라고? 블랙잭 게임?' \n차하린은 숨겨진 진실에 더욱 집중하며 자신만의\
    \ 방식으로 상황을 파악하기 시작한다.  '지금까지 이런 과정을 거쳐야 한다니...' 그녀는 마음속으로 깊게 들이쉬며 '블랙잭 게임, 지금부터가\
    \ 내 본심을 드러낼 시기다.' 라고 말하며 목표를 향해 나아간다. \n\n내면의 강인함은 눈에 보이지 않는 어둠 속에서 더욱 빛나기 시작했다."
