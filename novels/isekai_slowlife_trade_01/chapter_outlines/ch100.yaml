chapter_n: 100
overall: '{"chapter_n": "100", "act": "2", "content": "정보 수집을 마친 차하린은 거래 시장의 중심부에
  위치한 오래된 상점 앞에서 숨죽이며 기다렸다.  물건을 판매하는 상인이 나타나며, 그녀는 목표 물건의 가격과 특징을 확인했다. 그러나 상인은 차하린에게
  ''무엇보다도 높게 평가되는 존재''에 의해 선택된 자만이 돈 대신 자신을 제시하면서 거래를 결정하는 모습을 보였다. 차하린은 불안함과 함께 자신의
  목표와 그에 필요한 생명의 개념적인 가치 사이에서 갈등을 느끼며, 어떤 선택을 해야 할지 고민한다."}'
beats:
- name: intro
  instruction: '''거래 시장, 어찌나 더러운 곳인가.'' 차하린은 마음속으로 속삭이며 오래된 상점 앞에서 숨죽였다.  매일이라면 햇볕과
    소금냄새로 가득한 해변 근처의 카페를 찾았을텐데, 이곳은 시멘트와 낡은 나무판으로 만들어진 작은 거리였으며, 하늘도 바람만 불고 있어 공기
    중에 고소한 향이 오지 않았다.  가끔 들리는 사람들의 소리로는 언급되지 않는 음악들이 가득하거나 듣기 좋지 않은 노래를 부르며 일하는 것
    같았다. “뭘 찾으시는군요?” 이준씨의 목소리가 차이린을 깨웠다.  눈 크게 뜨고 상인에게 대답했다. "어떤 물건을 판매하시나요?"'
- name: development
  instruction: 이준씨가 낡은 나무판 위에 올려놓은 작은 조각들을 보여주며 말했다. "저희 이계의 전통 예술품인데, 드물지 않다고 해서
    현실과 교환할만한 가치는 없죠." 차하린은 조각들을 관찰하며 마음속으로 '현실'이라는 단어를 떠올렸다. 그때 몸에 새겨진 상징이 작게 반짝였다.
    “하지만 저에게 필요한 것은...” 차하린의 목소리가 희미해졌다.  내면에서 뜨거운 불꽃처럼 타오르는 자신의 목표를 이루기 위해서는 무엇을
    희생해야 할까? 그리고 그 가치는 정확히 얼마일까? "자신을 제시하라." 이준씨의 말은 차하린에게 돌려받지 못한 답장과 같이 공중에 떠다녔고,
    그녀는 자신의 목표와 생명 사이에서 갈등을 느꼈다. 몸에 새겨진 상징은 더욱 강렬하게 반짝이고 있는 것처럼 보였다. “무슨 말인가요?” 차하린은
    자신에게 질문을 하며 동결된 상태에서 일어섰지만,  이준씨는 어떤 답변도 주지 않았다.
