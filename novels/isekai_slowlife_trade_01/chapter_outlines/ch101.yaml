chapter_n: 101
overall: '{"chapter_n": "101", "act": "2", "content": "상인의 말에 차하린은 순간 숨죽이며 그를 바라본다.
  자신의 가치와 존재 이면에 숨겨진 진실을 파악하려는 그녀의 시선에서 상인이 느끼는 위압적인 분위기는 두 사람 사이의 거래가 단순한 상품 교환 이상의
  의미를 지니고 있다는 것을 보여준다. 차하린은 조심스럽게 자신의 목표와 상인의 의도를 파악하려고 시도한다. ''무엇보다도 높게 평가되는 존재''에게
  선택된 자라는 말에서 그녀는 이계의 질서와 깊이 그려진 거래에 대한 새로운 정보를 얻는다. 하지만 상인은 차하린의 주장을 받아들이지 않고, ‘만약
  자신을 제시하는 것 외에 다른 길을 찾으려 한다면 무엇보다도 높게 평가되는 존재’에게서 다시 선택받지 못할 것이라는 경고를 던진다. 상인의 말은
  차하린에게 새로운 의문과 고민을 심어주며, 그녀는 앞으로 어떤 선택을 해야 할지를 진지하게 고민해야 한다."}'
beats:
- name: intro
  instruction: '''상인은 오늘도 이웃의 면역력을 약화시킨다.''  차하린은 창문에 모이는 두 개의 검은색 점을 보며 그렇게 생각했다.
    새벽에는 항상 시각이 생략되고, 후각만으로는 진정한 색깔을 알 수 없었다. 하지만 이웃 뒷쪽으로 드러나는 나무잎 사이로 가기 시작하는 황금빛이
    그녀의 눈에 들어왔다.  ‘하루가 시작된다는 걸 느끼지 못한다면 우리는 아무것도 얻지 못해’. 차하린은 상인을 바라보며 무엇보다 적극적인 선택을
    해야 한다고 생각했다.'
- name: development
  instruction: 상인이 손바닥으로 천장을 두드리고 ‘이 세상에서 가장 중요한 것은 먼치킨의 위치’라고 말하며 그의 눈은 차하린에게 향했다.
    ‘내가 알려주는 것은 이계에서 가장 높은 가치를 지니고 있는 존재’에 대한 이야기, 그들은 모든 것을 선택하는 권리를 가지고 있다.’ 상인의
    목소리는 낮은 톤으로 차오르며 그녀의 머리 속을 스캔했다. ‘하지만 당신이 그런 존재가 되려는 것보다 더 많은 가치를 지닌 것이 있다.’ 상인은
    말하며 그의 입술 끝에는 미지의 음식물이 남아있었다.  “그것은 무엇일까?” 차하린이 조용히 물어보면, 상인은 어깨를 끌었고 “진정한 가치는
    분명하게 드러나지는 않을 것이다.”라고 말했다.
