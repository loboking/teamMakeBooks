chapter_n: 102
overall: '{"chapter_n": "102", "act": "2", "content": "상인의 말에 차하린은 순간 숨죽이며 그를 바라본다.
  자신의 가치와 존재 이면에 숨겨진 진실을 파악하려는 그녀의 시선에서 상인이 느끼는 위압적인 분위기는 두 사람 사이의 거래가 단순한 상품 교환 이상의
  의미를 지니고 있다는 것을 보여준다. 차하린은 조심스럽게 자신의 목표와 상인의 가치관을 비교하며 답변한다.  하지만 상인은 그녀의 말에 웃으며
  "자신이 평가받는 존재"에게로 향하는 삶의 길에 대해 지적한다. 그의 말은 차하린에게 새로운 고민을 불러일으키며, 단순한 거래를 넘어서는 진정한
  목표와 가치관을 다시 한번 되돌아보게 한다. 그녀는 마음속으로 ''무엇보다도 높게 평가되는 존재''에 대해 더 알아야 할 만큼의 의욕적인 욕망을
  느끼기 시작한다."}'
beats:
- name: intro
  instruction: 상인의 눈은 차하린을 비춰버리는 경치와 마찬가지로, 창고의 어두운 골짜기 속으로 들어간다.  '오늘도 냄새는 나쁘지 않네.'
    상인이 발성하는 말은 차시에 부어지는 돈빛과 진달래향으로 가득 찬 공기를 분리하여 끊어내듯한 느낌이 들었다.
- name: development
