chapter_n: 103
overall: '{"chapter_n": "103", "act": "2", "content": "상인은 차하린의 숨막히는 시선 속에서 조용히 말을
  시작했다. “이계의 모든 것은 현실과 연결되어 있다는 것을 알고 있는가?” 그의 목소리는 평화롭지만, 깊숙한 곳에서 차하린에게 전달되는 메시지는
  불안감으로 가득했다. 상인은 자신의 경험담을 통해 이계와 현실 사이의 섬세하고 위협적인 관계를 설명하며, 그 속에서 숨겨진 진실들을 차근차근 드러냈다.
  그의 말은 차하린에게 새로운 고민과 불안감을 불어넣었고 그녀는 상인이 가리키는 ''그 경계''에 대한 답을 찾기 위한 의지를 다지기 시작했다."}'
beats:
- name: intro
  instruction: "- 차하린은 커피를 한 입 삼켰다.  씁쓸한 향이 입안을 가득 채우고, 이계의 시원함을 잠시나마 잊게 해주는 것처럼 느껴졌다.\
    \ <br> - 상인의 오두막은 여전히 어둡고 그늘진 곳에 있었다. 나무로 된 벽은 얼굴과 같은 색깔을 가지고 있으며, 창문 사이로 비치는\
    \ 불빛이 흐릿한 그림자를 만들어 내고 있었다. <br> - 차하린이 마르고 고통스러운 바람소리를 들으면서 상인의 말이 끊겼다. “그래도 당신은\
    \ 이계에서 최고의 장거리 거래 상인으로 불리고 있습니다.” \n-"
- name: development
  instruction: '- 차하린은 상인의 시선을 피하며 한숨을 들인다. 그녀는 목에 달려 있는 나무 조각상을 만지며 그 안쪽에 들어있는 작은
    창을 보았다. 창에서 나는 은은한 빛이 이계의 물건들의 거래를 가능하게 하는 소규모 센서처럼 느껴졌다. <br> - 그녀는 상인의 말을 들으면서
    어깨에 만져진 날카로운 파도 같은 불편함을 느끼며'
