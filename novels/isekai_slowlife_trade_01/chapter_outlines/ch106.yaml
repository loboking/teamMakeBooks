chapter_n: 106
overall: '{"chapter_n": "106", "act": "2", "content": "상인은 차하린의 질문에 잠시 고민하다가 천천히 말했다.
  “물건 교환이 가능한 ‘대칭성’을 이용하면 된다.”  손끝으로 공기를 가리키며 그는 설명했다. “현실과 이계를 연결하는 ''포털''을 통해 물건을
  이동할 수 있다는 뜻인데, 그 포털은 특정 조건에 따라 열릴 수 있다." 차하린은 상인의 말에 집중하며 그의 눈빛 속으로 마음속의 불안감을 읽어냈다.  그는
  이계에서 얻을 수 있는 가능성과 그 안에 숨겨진 위험함 사이에서 갈등했다. “그렇다면, 어떤 조건이 필요할까요?” 차하린은 목소리가 떨리며 물었다.
  상인의 미소가 점점 더 크게 확장되자 그는 차하린에게 ''대칭성''을 이용한 무한한 가능성을 보여주고자 한다는 것을 느꼈다." }'
beats:
- name: intro
  instruction: '-  차하린은 이계의 여기저기를 살펴보며 내심으로 말했다. ‘정말 마법같다.’ - 그녀가 홀로 있는 상점 안에는 온몸에
    새겨진 화살무늬 문양과 같은, 다른 세계에서 얻어온 소품들이 가득해 있었다.  짙은 향이 은은하게 스며드는 공간의 진동은 차하린에게 이계의
    기묘한 맛을 선사했다. 그는 손에 든 커피를 들고 내쉬는 마시멜로 풍미가 살짝 느껴진다면, 현실에서 온 상인 ‘이준 씨’의 말과 같은 무겁고
    지치는 존재감은 없었다.  “그래도 이계의 물건들은 정말 매력적이고…”  - 차하린은 이준 씨가 제시한 거래 조건에 대해 고민했다. “하지만,
    그런 위험을 감수할 만큼 소중한 가치를 지니고 있나요?”   },{'
- name: development
  instruction: '- 차하린은 이준 씨의 말이 자신에게는 어떤 의미를 가지는지 고민했다. 그는 손을 주머니 안으로 넣고 깊게 생각에 빠져들었다.'
