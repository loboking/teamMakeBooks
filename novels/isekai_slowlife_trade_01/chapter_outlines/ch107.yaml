chapter_n: 107
overall: '{"chapter_n": "107", "act": "2", "content": "상인의 말에 차하린은 조용히 듣고 있었다. ''포털''이라는
  말을 들었지만, 그 존재 자체에 대한 확신이 없었다. 상인은 ‘대칭성’이라는 주제로 이야기 진행하며 포털 활용 방법을 설명해주었다. 차하린의 눈동자는
  깊어지는 무한성에 스쳐간다. 그는 이계의 물건을 현실로 가져오는 단계가 시작되었다는 사실을 인지하고 있지만, 그 과정이 가진 위험성을 완전히 파악하지
  못했다. 상인은 마침내 포털 개방 조건을 설명하며 차하린을 긴장감으로 채운다. "그렇게 하려면… 당신의 의지를 연결시켜야 한다.”  "}'
beats:
- name: intro
  instruction: ‘매일 똑같은 생활이라, 조금 지쳐.’ 차하린은 담배 연기를 방출하며 창밖을 바라본다. 이계의 숲과 별자리가 펼쳐진 경치는
    아름답지만 그의 마음에는 한결나빠만한 무거움이 남아있었다. 진솔한 향기와 새들의 속삭임은 계속해서 들려온다, 하늘을 수놓은 은빛 보석들도 끊임없이
    반짝이며 위로를 주고 있지만 차하린의 마음에는 상처가 깊이 박혀있었다. “혹시 도움이 될 만한 사람이나, 물건이 있다면 말해줘.”  상인 이준씨는
    어깨를 가볍게 흔들며 따뜻한 음성으로 차하린에게 이야기한다.
- name: development
  instruction: ‘ 포털’이라는 단어가 그의 머릿속을 두드리며, 그는 기억력 상실로 힘든 시간을 보내고 있었다. ‘대칭성’이라는 주제를
    설명하며 상인 이준씨는 차하린의 눈동자에 생생한 이미지를 그려넣다.  “그렇게 하려면… 당신의 의지를 연결시켜야 한다.” 상인 이준씨의 말은
    차하린의 피부로 침투하는 감각, 차가운 땀이 그의 얼굴을 적셔온다.  자신의 의지가 어떤 방식으로 연결되는지, 그 결과는 무엇일지는 확실하지
    않지만 그는 이계의 물건을 현실로 가져오고 싶은 마음에 더욱 강한 동기가 생겨나는 것을 느끼었다.
