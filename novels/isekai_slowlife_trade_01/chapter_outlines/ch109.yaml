chapter_n: 109
overall: '{"chapter_n": "109", "act": "2", "content": "상인의 말로 인해 ''포털''이라는 개념에 대한
  흥미가 커진 차하린은 구체적인 방법을 물었다. 상인은 대칭성을 통해 포털을 열고 이계와 현실을 연결할 수 있다는 것을 설명하며, 특히 희귀한 아이템을
  교환하려면 포털이 필수적이라는 점을 강조했다. 차하린의 눈동자는 깊어지며 상인 말로부터 더 많은 정보를 얻으려고 애썼다. 하지만 상인은 ''포털''에
  대한 자세한 설명을 제공하지 않았고, 오히려 더 큰 도전과 위험이 존재한다는 경고를 덧붙였다. 차하린은 상인의 말에 의심과 호기심 사이로 고민하며
  결정해야 할 문제가 되었다.  "그렇다면 포털을 열기 위해 필요한 조건은 무엇인가?" }'
beats:
- name: intro
  instruction: '"하루종일 이게야, 내가 지금 살아있는 건 맞는거야?" 차하린은 고개를 들어 천장에 붙잡힌 방울이 되어 있는 수중 조형물을
    바라보며 슬프고 무척 맛없는 느낌이 들었다.  해수면 아래, 다양한 종류의 산호와 해조가 반짝이는 광경은 실제로는 어두웠다. 이계에서는 그렇듯
    내부에 강력한 조명을 활성화해야 하지만, 자주 꺼내던 비효율적인 에너지 소비에 대한 고민이 들었다. 오늘 점심 식사는 평소처럼 해산물 요리였고,
    깊은 바다에서 채집된 신선한 새우와 게를 넣어 만든 스프였다.  ''신선하고 시원하면서도 정밀하게 조리되어 더욱 고급스러운 분위기를 연출하는''
    이계의 음식이라 하지만, 차하린은 지금 그런 맛을 감상할 마음에 나가지 않았다. 오늘 오후에는 상인이라는 사람과 만나야 하는 일정이 있었다.
    ''그림자 속에서 물건을 바꿀 수 있다는 이야기.'' 이준씨의 말이 생각났다.'
- name: development
  instruction: 차하린은 지금까지도 그림자가 무엇인지 파악하지 못했다.
