chapter_n: 110
overall: '{"chapter_n": "110", "act": "2", "content": "상인의 설명에 따라 차하린은 이계에서 ''포털''을
  열 수 있는 방법을 탐색했다.  단순한 물건 교환이 아닌, 대칭성과 기법을 이용하여 두 세계를 연결하는 방식은 차하린에게 새로운 가능성을 제시했다.
  하지만 그 과정에서 상인은 ''포털''을 열려면 비싼 가격을 지불해야 한다고 말하며, 섬뜩한 미소로 차하린의 눈을 바라보았다.  차하린의 심장이
  떨리는 순간, 그녀는 상인의 진짜 의도를 알아채기 시작했다."}'
beats:
- name: intro
  instruction: '-  차하린은 이계에서 ‘포털’을 열 수 있는 방법을 찾고 있다면 그녀는 무엇이 되어갈까? 생각만 하다가 가슴이 불안해졌다.
    깊게 들여쉬고, 마음의 안정을 찾으려 한다면, 상인이 말한 방식은 대칭성과 기법을 사용하는 것이라는 점이 강조되었다.  현재 지금 그녀는 이계
    시장의 한가운데에 위치해 있는 곳이다. 낡고 매력적인 나무 구조물로 된 건물들이 조각들처럼 모여있는 곳이고, 그곳에는 향기로운 음식과 신비로운
    물건이 가득한 거리도 있다. 공기를 마시면 차갑고 달콤한 향기가 입안에 퍼지며, 이계의 특징적인 시끄러움은 멀리서 들려온다. ''상인 씨'',
    그녀는 그에게 인사를 건넨다.'
- name: development
  instruction: '비트 마무리 — 회차 climax + 후크 (분량 1,800자+)


