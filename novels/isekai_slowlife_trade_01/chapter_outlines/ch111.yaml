overall: '{"chapter_n": "111", "act": "2", "content": "상인의 말에 따르면 포털을 열기 위한 정보가 담긴
  ''수첩''이라는 희귀한 아이템이 필요하다고 했다. 차하린은 이계 물건 거래 경험으로 얻은 지출금을 사용해 수첩을 구매하려는 계획을 세웠다. 하지만,
  상인은 수첩에 대한 정보를 제공할 정도로 의사 소통이 가능한 존재가 아니며, 암호화된 형태의 수첩을 판매한다고 말했다.  차하린은 이계 거래 경험으로
  얻은 지출금으로 ''수첩''을 구매하려는 계획을 세웠다. 하지만 상인은 "이것만으로는 안 될 것 같다." 라며 차하린에게 숨겨진 진실에 대한 의구심을
  표했다. “자신의 가치를 높이는 방법, 그 자체가 포털을 열기 위한 첫걸음일 수 있다.”"}'
beats:
- name: intro
  instruction: '비트 도입 — 회차 시작부 (분량 1,800자+, 한국 웹소설 톤)


    이 회차 줄거리:

    {"chapter_n": "111", "act": "2", "content": "상인의 말에 따르면 포털을 열기 위한 정보가 담긴 ''수첩''이라는
    희귀한 아이템이 필요하다고 했다. 차하린은 이계 물건 거래 경험으로 얻은 지출금을 사용해 수첩을 구매하려는 계획을 세웠다. 하지만, 상인은
    수첩에 대한 정보를 제공할 정도로 의사 소통이 가능한 존재가 아니며, 암호화된 형태의 수첩을 판매한다고 말했다.  차하린은 이계 거래 경험으로
    얻은 지출금으로 ''수첩''을 구매하려는 계획을 세웠다. 하지만 상인은 "이것만으로는 안 될 것 같다." 라며 차하린에게 숨겨진 진실에 대한
    의구심을 표했다. “자신의 가치를 높이는 방법, 그 자체가 포털을 열기 위한 첫걸음일 수 있다.”"}


    위 줄거리를 한국 웹소설 톤으로 본문 1,800자+ 작성. 직전 비트와 사건 중복 금지. 시각·청각·촉각 묘사 포함. 대사 1~2개.'
- name: development
  instruction: "- 핵심 사건: 차하린이 상인에게 수첩에 대한 정보를 얻으려고 시도한다.\n - 등장 인물 + 첫 호명:  상인\n-\
    \ 시각·후각·청각·촉각 묘사 포인트: 상인의 노랜 여행길을 보여주며, 그의 말투에서 느껴지는 지치고 슬픈 감정. 차하린이 주위를 살펴보는\
    \ 것만으로도 밀접한 관계에 있는 이계 거래 시스템을 깨닫는 순간.\n- 대사 1~3개:"
