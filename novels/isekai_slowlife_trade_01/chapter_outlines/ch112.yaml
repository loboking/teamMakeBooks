beats:
- name: intro
  instruction: '''수첩 정보, 내가 직접 얻으면 좋겠다.'' 차하린은 이중으로 접힌 손톱을 보고 한숨이 났다.   뜨거운 오후에도 시원한
    바람이 불어오는 ''달빛 정원''. 은색 줄기를 가진 나무들의 잎사귀 사이로 달려온 바람은 꽃 향기와 함께 차하린의 코끝까지 스며들었다.  ''무더움,
    아직 어느 정도 날씨가 이 계열에 맞지 않아서...'''
- name: development
  instruction: '비트 마무리 — 회차 climax + 후크 (분량 1,800자+)


