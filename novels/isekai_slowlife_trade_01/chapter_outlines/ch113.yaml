chapter_n: 113
overall: '{"chapter_n": "113", "act": "2", "content": "차하린은 포털 정보를 얻기 위해 이계의 대규모 거래
  시스템을 분석하려고 했다. 하지만, 복잡한 알고리즘과 다양한 언어는 그녀에게 어려운 과제였다.  수첩 구매에 실패하고 포털 정보를 찾기 위한 지속적인
  노력은 차하린의 마음에 무거움을 남겼다. 그때, 낯선 상인이 나타나 수첩 대신 다른 방법으로 포털을 열 수 있다는 비밀스러운 정보를 제공한다고
  말했다. "'
beats:
- name: intro
  instruction: '-  ''포털 정보가 있다면 이게 끝난다''고 자신에게 속삭이며 차하린은 디지털 카페의 한단위를 터뜨렸다. 시끄러운 소음과
    커피 향으로 가득찬 공간이 그녀를 감싸잡았고, 그 중심에 놓인 노트북 화면은 흐리고 불분명한 코드로만 채워져 있었다.

    -  ''대규모 거래 시스템 분석'', ''복잡한 알고리즘 해독''... 차하린이 스스로에게 던진 과제는 마치 고립된 신원을 찾아내려는 것과
    같았다. 그녀의 눈은 노트북 화면에 매달렸지만, 속은 비무장 상태였고. 이게 ''해결'' 방법이 될 수 있다는 확신도 없었다.

    -'
- name: development
  instruction: "- '혹시 도와주실 수 있으세요?' - 차하린의 질문에 지나가던 한 남자가 살짝 머리를 고개를 내며, 그의 목소리는 가볍게\
    \ 반짝이는 금빛 소리였다.  이준 씨라고 불렀고 그는 어두운 색깔의 코트를 입고 있었다. \n- '포털 정보는 물론이고, 다른 방법도 있다.'\
    \ 이준 씨의 말은 차하린의 두뇌에 새로운 파동을 일으켰다. 그녀는 신중하게 그의 말을 들으며, 눈이 점점 살짝 불분명해지고 있었다.\n-"
