chapter_n: 114
overall: '{"chapter_n": "114", "act": "2", "content": "낯선 상인의 말에 반응하며 차하린은 이계 거래 시스템의
  심층 정보를 얻기 위해 포털 접근을 시도했다. 하지만, 불완전한 정보와 복잡한 네트워크 구조는 그녀를 막았다.  자신만의 해결책을 찾아내려는 차하린은
  이계 거래 시스템의 기본 원리를 파악하는 데 집중했다. 그 과정에서, 오랜 시간 동안 누락된 중요한 자료들을 발견하게 된다. 수첩의 진실에 가까워지는
  순간, 숨겨진 위험도 드러나기 시작한다."}'
beats:
- name: intro
  instruction: "'내가 이걸 만드는 게 맞을까?', 차하린은 의문으로 물었다. 그녀의 손에는 아직 어둡고, 불완전한 모습을 드러내는 낡은\
    \ 원목 상자였다. 그 안에는 수많은 이계 거래 기록들이 압축되어 있었다.  \n거대한 가구와 벽에 걸린 그림이 없는 오래된 실에서 차하린은\
    \ 책상 위의 조명 아래로 향하는 광선을 따라 시선을 이동시켰다. 서묵과 같은 잡동사니가 모여 있는 곳, 그곳에는 이계 거래 시스템의 심층\
    \ 정보를 얻기 위해 그녀는 포털 접근을 시도했다.  \n'이게 맞지 않을까?'. 차하린은 이준씨에게 받은 단서들을 다시 풀고 있었다. '거리의\
    \ 중간점에서 시작하는 거래...' 그가 말한 것은 명확하지 않았지만, 그녀는 포털 접근 방법에 대한 힌트를 얻을 수 있다고 생각했다."
- name: development
  instruction: '비트 마무리 — 회차 climax + 후크 (분량 1,800자+)


