chapter_n: 116
overall: '{"chapter_n": "116", "act": "2", "content": "이계 거래 시스템의 심층 구조 정보를 찾기 위해
  차하린은 이계 상인들과 접촉하려고 했다. 하지만 그녀는 단순한 거래를 통해 얻을 수 있는 정보만으로는 부족하다고 생각했다. 차하린은 이계 상인들의
  의도와 관계 네트워크를 파악하기 위해 더욱 신중하게 접근해야 한다는 것을 알았다. 끊임없이 변화하는 상황 속에서 그녀의 진지한 면모가 드러나며,
  이계 거래 시스템을 통제하려는  그녀의 의지를 가시화했다."}'
beats:
- name: intro
  instruction: '''상식일수록 이계에서는 어질리 적용 안될까.'' 차하린은 따스한 햇살 아래 이계의 시장길을 걸으며 생각했다.  푸른
    하늘 아래, 노란색 꽃잎이 바람에 살짝 흔들리는 장관 속에서, 수백 년 된 고대 나무가 자라난 모습이 그려진 거대한 상자들이 줄지어 놓여있었다.
    은은한 향기와 함께 이계 상인들의 화활한 소리, 시장 곳곳의 행상 노래는 차하린에게 알려주지 못하는 새로운 세상을 보여주고 있었다.  ''이준
    씨?'' 차하린은 앞서 나오는 주변에 옷자락도 살짝 바뀌지 않는 이준 씨를 보고 말했다. ''무슨 일인데 찾으셨어요?'''
- name: development
  instruction: '''거래 시스템의 심층 정보, 알고 있는 사람이 있다면...'' 이준 씨는 얼굴을 하늘 위로 올려 그리운 눈빛으로 바라보며
    말했다. ''하지만 그는 당신과 같은 존재를 매우 경계하고 있어요.''  차하린은 그에게 어떤 종류의 정보가 필요한지 자세히 설명했고, 이준
    씨는 그의 손가락을 차분하게 내밀어 갑자기 사라진 상황으로 인해 눈이 당황스러워졌다. ''거래 시스템의 심장부에 위치한 무형의 공간, 그곳에서
    정보를 얻을 수 있다고 한다.'' 이준 씨는 말을 끝내면서 차하린에게 메모지를 건네주었다. ''그곳은 위험할 수 있습니다...'''
