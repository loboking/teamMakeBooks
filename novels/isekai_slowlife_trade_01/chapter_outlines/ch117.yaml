overall: '{"chapter_n": "117", "act": "2", "content": "차하린은 이계 상인들의 만남을 통해 정보를 얻기
  시작했다. 그들은 자신들이 거래하는 물건의 가치를 알고 있었지만, 그 이상 깊이 있는 지식은 가지고 있지 않았다. 차하린은 그들을 이용해 이계
  거래 시스템의 심층 구조에 대한 힌트를 얻으려는 계획을 세웠다. 하지만 그녀는 이들의 의도가 단순한 거래만으로 끝나지 않을 것이라는 점을 느꼈다.  그들은
  차하린에게 도움이 될 수 있지만, 동시에 자신들에게 유리하게 활용하려고 할 가능성이 높았다. 차하린은 이계 상인들의 속임수에 휘말릴 수 있는 위험성을
  알면서도 그들을 이용하기 위한 방법을 찾으려 애썼다. 그녀는 거래 시스템의 본질을 파악하고 진실에 가까워지기 위해 더욱 고민할 시간이 필요했다."}'
beats:
- name: intro
  instruction: "“상인들만 모이는 자리가 보다 정보가 풍부할 거야.” 차하린은 이계의 중심, 푸른빛 가스로 수면을 꾸며놓은 커브 형태의\
    \ 건물 아래, 비어있는 공간에서 생각했다.  공기는 고소한 꽃향과 짭짤한 바다 향이 뒤섞여 있었다. 그녀는 주변 상인들의 낮은 목소리와 거품\
    \ 같은 소리가 가득한 시장 내부를 들으며 속으로 이계의 거래 시스템에 대한 정보를 얻기 위해 노력했다. ‘그들은 단순히 물건을 교환할 뿐이지\
    \ 않을 것이다.’ 차하린이 생각하며 그들 앞에서 낮은 목소리로 말했다. “저는 이전부터 이곳에서 무역을 해왔습니다.”  \n - 인물 등장:\
    \ 이준, 상인들을 지칭하는 대상명 없음 \n- 시각: 커브형 건물 아래 공간의 분위기, 꽃향과 바다 향 섞인 공기 \n- 청각: 상인들의\
    \ 목소리, 거품 소리\n- 후각: 꽃향, 바다 향. \n - 대사: “저는 이전부터 이곳에서 무역을 해왔습니다.”"
- name: development
  instruction: 이준은 차하린의 말에 흥미를 보이며 눈동자를 조금 더 살짝 열었다. “그렇군요. 당신은 무엇을 거래하는가?” 라고 물었다.
