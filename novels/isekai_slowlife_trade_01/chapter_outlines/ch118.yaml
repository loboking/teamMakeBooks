chapter_n: 118
overall: '{"chapter_n": "118", "act": "2", "content": "차하린은 이계 상인들에게 자신의 진짜 의도를 알려주기
  전에, 그들이 거래하는 물건의 가치 규준을 파악하기 위해 더 많은 정보를 얻으려고 했다. 그녀는 조심스럽게 질문하며, 상인들의 대답을 분석하면서
  이계의 경제 시스템과 상품 생산 방식을 이해하려고 노력했다. 그러나 일부 상인들은 차하린에게 의심되는 점이 있다고 생각하고, 거래를 하려는 그녀의
  의도에 냉담함을 보였다. 차하린은 이들의 반응을 보고 자신이 진실한 정보를 얻기 위해 더욱 고급스러운 방법을 찾아야 한다는 것을 깨달았다. 그리고
  그 길로서, 그녀는 이계 상인들이 자주 이용하는 특정 지역의 ''거래 중심지''를 방문하기로 결심했다."}'
beats:
- name: intro
  instruction: "- '이게 이계 상인들의 진짜 의도라고 생각하는 거야?'\n-  거래 중심지는 복잡하고 시끌벅적했다. 다양한 종류의 생물들이\
    \ 섞여 있고, 각자의 물품을 가지고 서로 교환하거나 값을 매기며 소통하고 있었다. 특히 이곳에는 맛있는 향이 가득했는데, 마치 다양한 신선한\
    \ 과일과 허브가 함께 조화롭게 피어난 것 같은 달콤하면서도 상쾌한 향이 들었다.  \n- '차하린 씨', 거래 중심지의 가장 오래된 상인으로\
    \ 알려진 이준 씨가 차하린에게 말했다.\n-"
- name: development
  instruction: '- 차하린은 조심스럽게 질문하며, 이준 씨의 눈빛을 주시했다. ''이계에서는 어떤 물건들이 가장 인기 있는지?''

    - 그녀가 먼저 손에 들고 있던 보석 같은 돌을 내밀었다.'
