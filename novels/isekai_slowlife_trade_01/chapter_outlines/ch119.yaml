chapter_n: 119
overall: '{"chapter_n": "119", "act": "2", "content": "몇 시간 동안 계속해서 질문과 정보 탐색을 반복하며
  차하린은 이계 상인들의 입장에서 생각하는 방식을 이해하기 시작했다. 그들은 물건의 가치를 단순히 지금 시점의 현실적인 판단으로만 바라보는 것이
  아니라, 내재된 힘이나 미래에 대한 가능성까지 고려했다. 차하린은 이러한 상인들의 관점에서 거래 정보를 분석하고 있었다. 그러나 그녀가 진짜 원하는
  것은 단순한 물건의 가치 파악이 아니었다.  차하린은 이계의 물질적 가치 뿐 아니라,  비물질적인 요소, 혹은 이계 자체의 질서에 대한 정보를
  얻으려고 노력했다. 이러한 고민 속에서 차하린은 이계 상인들의 이야기 속에서 하나의 특이한 단어를 발견했다. ''가능성''"}'
beats:
- name: intro
  instruction: '- 주인공의 자조/일상 톤 1줄로 시작

    - 핵심 공간 묘사 (시각 2 + 후각/청각 1)

    - 첫 인물 등장 + 호칭("이준 씨" 등)

    - 짧은 대사 1~2개

    - 마지막 줄: 다음 비트로 넘기는 미세한 위기 신호'
- name: development
  instruction: '- 핵심 사건 발생 (동작 단위 묘사)

    - 통증/충격 등 신체 감각

    - 내적 독백 1~2줄

    - 새 정보 발견 (단서/메모/시스템 메시지)'
