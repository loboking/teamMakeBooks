chapter_n: 120
overall: '{"chapter_n": "120", "act": "2", "content": "이계 상인들의 입장에서 물건의 가치를 판단하는 방법을
  이해한 차하린은 그들을 설득하기 위해 자신이 만든 현실의 상품과 이계의 특수 능력을 결합한 새로운 상품을 제시했다. 그녀는 각종 지식과 기술을
  담아낸 책, 그리고 현대적인 의료기술을 이용해 생산된 약품 등의 가치를 상인들에게 보여주며 자신이 가진 무언가를 이계에 더 깊숙이 관심을 가져야
  한다는 것을 알려주었다. 하지만 이러한 제안은 상인들의 눈길을 사로잡고, 흥미를 유발한 것만으로써 충분하지 않았다. 그들은 차하린의 의도와 진실된
  가치를 파악하기 위해 더 많은 정보를 요구하며, 그녀에게 더 큰 도전과 기회가 생겨났다."}'
beats:
- name: intro
  instruction: '''상인들 생각보다 더 바삭한 거예요.'' 차하린은 이계 상인들의 모습을 다시 한번 살펴보며 말했다.  선이 드러나는
    빛나는 벽돌로 만든 넓은 시장, 천둥소리가 가끔 들리는 높은 나무 위의 창가 정면에서 끊임없이 바르기 시작하는 향긋한 꽃잎 낙하를 볼 수 있었다.
    상인들은 그녀의 말에 무관심해 보였지만 눈빛에는 약간의 호기심이 드러나고 있었는데, 이준씨는  ''어떻게 그런 물건을 만들어냈는지 알려주면
    더 나은 가격으로 사줄 수도 있다.''고 덧붙였다. ''물론, 내가 원하는 대로 살 수 있는 주변 환경이 필요해.'
- name: development
  instruction: 차하린은 이준씨의 눈빛을 응시하며 입술 위에 쓴 미소를 조금 더 크게 지웠다.  내가 생각했던 이상한 물건들과 이계 상인들이
    가치를 부여하는 방식 사이에는 큰 차이가 있었다. '아직은 그러지 못한다.' 차하린의 손으로 만들어진 현실의 상품, 특히 몸을 온전히 회복시키는
    의약품이라는 정보만으로는 충분하지 않았다. 그녀의 마음속에서 생각나는 이미지와 상인들의 행동 사이에는 거대적인 차이가 있었다. 하지만 그녀는
    이를 어떻게 해야 할지 알고 있었다. '우리에게 필요한 것은 당신들과 함께하는 것이지.'  차하린은 내면의 괴로움을 가두고 자신만을 위한 세상으로
    만들기를 바라는 상인들에게 더욱 큰 도전과 기회를 제시했다. 그들은 차하린이 만든 상품들의 진정한 가치를 알아챌 수 있었다는 사실에 깜짝 놀랐다.
