chapter_n: 121
overall: '{"chapter_n": "121", "act": "2", "content": "상인들은 차하린의 제안에 흥미를 보였다. 특히 현대
  의료기술을 이용해 생산된 약품은 이계에서 흔치 않고 매우 높은 가치를 지녔다. 그러나 상인들 사이에서는 새로운 상품과의 거래 방식에 대한 논쟁이
  시작되었다. 일부는 차하린에게 기존의 거래 방식을 존중하며, 새로운 상품도 시장상의 평가와 견고한 계약 조건 하에서 거래되어야 한다고 주장했다.
  반면 다른 상인들은 차하린의 상품을 통해 이계의 새로운 가능성과 성장을 기대했으며, 새로운 거래 방식의 도입을 지지했다.  차하린은 두 파트로
  나뉜 상인들의 의견을 듣고 주저하며 선택에 압박받는다."}'
beats:
- name: intro
  instruction: "-  '상인들이 진정으로 무엇을 알고 싶어하는지가 궁금하더라.' 차하린은 이계의 시장에서 판매되는 상품 목록을 들으며\
    \ 한숨을 내쉬었다.  \n- 핵심 공간: 점점 방황하게 되는 상인들의 얼굴들과 복잡한 상품들을 가득 채운 거리. 시각적으로 불규칙하게 배치된\
    \ 서양식 건축물들이 섞여 있는 곳은 이계의 특유의 분위기를 더욱 압박한다. (시각: 천장에 매달린 화려하지만 오래 되어 보이는 전등들의 불빛이\
    \ 어둡고 복잡한 공간을 반영하듯이, 조명이 비치는 부분과 그 외에는 그림자가 크게 드리워진다. 후각: 썩은 과일과 꽃잎의 향기가 섞여 지금껏\
    \ 본 적 없는 특유의 악취를 풍기고 있다.) \n- 첫 인물 등장 + 호칭 (상인들)  \n- 짧은 대사 1~2개  '차하린님, 새로운 상품을\
    \ 보내주시면 시중에 판매해 드릴 수 있겠죠?' '이번에는 어떻게 할지 모르는군요. 차하린 님의 제안에 대한 반응이 분분히 나뉘어있다.' \n\
    - 마지막 줄: 다음 비트로 넘기는 미세한 위기 신호\n  '그러면 우리가 만난 이번 상인들과 계약을 해야 할까?' '차하린, 진심으로 이계에서\
    \ 무엇을 얻고 싶니?'"
- name: development
  instruction: "- 핵심 사건 발생 (동작 단위 묘사): 차하린이 손뒑치며 상인들과의 대화를 재개한다.  \n- 통증/충격 등 신체 감각:\
    \ '두통'이 시작된다. 머리가 가만히 있으면 더욱 두통이 심해지고, 차하린은 몸을 구부리고 손으로 머리를 만진다. \n- 내적 독백 1~2줄:"
