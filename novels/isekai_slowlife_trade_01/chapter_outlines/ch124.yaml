chapter_n: 124
overall: '{"chapter_n": "124", "act": "2", "content": "상인들은 차하린의 제안에 흥미를 보였지만, 새로운
  거래 방식에 대한 논란은 계속되었다.  결국, 차하린이 이계 상인들의 주요 상품인 ''빛 수정''과 현대 의료기술을 합쳐 새롭게 만들어낸 ‘광합성
  약품’의 가치를 증명하기 위한 시험을 제안했다. 광합성 약품은 빛 수정으로 얻은 에너지를 이용해 생산된 특별한 약물로, 이계에서 흔히 볼 수 없는
  효능을 지녔다. 상인들은 차하린의 제안에 주목했지만, 새로운 기술과 상품의 가치를 인정하기 위한 시험 결과에 대한 기대감이 높았다. 또한, 일부
  상인들은 그들의 전통적인 거래 방식을 유지하려는 의지를 강하게 보였으므로, 차하린은 이러한 반발에도 굴하지 않고 새로운 상품의 가치를 증명하기
  위해 최선을 다해야 할 것으로 예상된다."}'
beats:
- name: intro
  instruction: '''광합성 약품''을 만들고, 이계의 상인들을 설득하는 게 그렇게 어려운 일이 될까?'
- name: development
  instruction: "- 핵심 사건: 차하린은 손목시계처럼 작동하는 '기능 시스템'을 이용해 이계의 상인들에게 광합성 약품의 효능을 증명한다.\
    \ (실제로는 약물 생산 과정 자체가 복잡해서, 기능 시스템은 3D 모델링과 같은 형태를 통해 상인들에게 보여준다.)\n- 등장 인물: 이준\
    \ 씨 \n- 시각: 차하린의 손목시계처럼 작동하는 '기능 시스템'이 디지털 화면을 내놓는 모습, 상인들이 주위에 퍼져 있다. 센스 있는 의상을\
    \ 입은 이준 씨가 제일 앞쪽에 서있다.\n- 청각:  차하린의 손목시계에서 작동하는 소리 (진정한 생물학적 효과를 만들어내는 소리, 차분하고\
    \ 자연스럽고 신비로운 느낌)\n- 대사:"
