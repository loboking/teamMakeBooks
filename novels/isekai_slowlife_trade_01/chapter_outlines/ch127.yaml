chapter_n: 127
overall: '{"chapter_n": "127", "act": "2", "content": "차하린은 이계에 적응한 현대 기술을 도입하여 빛
  수정의 에너지를 활용해 식량 생산 시스템을 구축하기 시작했다. ''광합성 약품''이라는 새로운 제품 개발로 이계 상인들의 의존도를 줄이고, 자원생산능력을
  높이는 방향으로 나아갔다. 그 과정에서 차하린은 옛날부터 이계에 전해 내려온 민족의 유물 ''빛 수정 가루''를 발견하게 된다. 이 가루는 에너지
  효율을 극대화하는 데 사용될 수 있다고 알려져 있지만, 그 성능과 활용법은 아직까지 명확하지 않았다. 차하린은 이 ''빛 수정 가루''의 진실을
  파헤치기 위한 새로운 여정을 시작하게 된다." }'
beats:
- name: intro
  instruction: '''하루 종일 이 계가 생각났다.'' 차하린은 자신의 작품인 ''광합성 약품''으로 수확된 야채를 손에 들며 말했다.
    주위는 푸르른 초원과 은빛 꽃밭이 어우러진 아름다운 풍경으로 가득했지만 그녀의 눈에는 오직 그 ''약품''만을 볼 수 있었다. 햇빛 아래 반짝이는
    약품은 마치 진주처럼 섬세하게 엮인 광선들로 이루어져 있었고, 그 향기는 새우와 꽃잎을 동시에 섞은 신선한 꽃향수 같은 느낌이었다.'
- name: development
  instruction: '''아직도 이 계에 얽매이는 건 어떨까?''  그때 옆에서 차하린의 제품 판매를 도와주던 이준 씨가 말했다. “광합성
    약품은 정말 대단한 상품이지만, 우리는 여전히 이계 상인들의 의존도가 높아졌을 뿐이다.” 그 말에 차하린은 고개를 끄덕였다. 그녀는 ''빛
    수정 가루''라는 알 수 없는 물질의 진실을 찾고 있는 동안, 자신의 제품이 이계에 미치는 영향을 생각하는 시간이 부족했다.  그때 그녀가
    들었던 조언들이 떠오르며 차하린은 오랜만에'
