chapter_n: 128
overall: '{"chapter_n": "128", "act": "2", "content": "이계의 고대 문헌을 통해 빛 수정과 연결된 신비로운
  에너지를 파악한 차하린은 새로운 제품 개발 계획에 급격하게 열정을 불어넣었다. 이전에는 식량 생산에만 집중했던 그녀는 이제 ''빛 수정''의 에너지
  자체를 활용하여 이계 상인들의 의존도를 완전히 줄이고, 거래 시스템의 새로운 지평을 열고자 했다. 하지만 그 과정에서 그녀는 오랜 시간 동안 숨겨진
  이계의 진실과 관련된 위험한 흔적들을 발견하게 되는데, 그것은 단순히 물질적인 풍요로움을 넘어서는 더 큰 의미를 지니고 있었다."}'
beats:
- name: intro
  instruction: ‘빛 수정’으로 이계 상인들 마음을 사로잡는다면?  차하린은 고온에 오그르는 실리콘 기반의 가족형 에너지원을 바라보며,
    몸속이 뜨거워지는듯한 느낌이 들었다. 대각선으로 뻗어있는 황금빛 광선들이 마치 무위에서 영혼을 채석하듯 늘어져 있던 곳은 이제 시계 방향으로
    돌고 있다. '만약 이것을 활용하면…' 차하린의 머릿속에 떠오르는 멋진 아이디어는 그녀가 지금껏 본 적 없는 새로운 세계를 창조할 수 있다는
    것을 보여주었다. "이준씨, 오늘은 기분 좋으세요?"  지나온 먼저 웃으며 말했다. 이준이는 차하린의 눈빛을 보고 의아한 표정을 지었다.
- name: development
  instruction: 차하린은 ‘빛 수정’의 에너지를 분석하기 위해 자신의 상자형 스마트 시스템에 연결한다.  시계 형태의 디스플레이는 찬한
    은색으로 반짝이며, 그녀가 입력하는 데이터를 빠르게 처리하고 있다. 차하린이 손목 주위로 회전하는 고온의 에너지 흐름을 보며 오히려 이 시스템은
    매우 활력이 넘친다고 느꼈다. '결론적으로…' 그들의 말 중에서도 가장 중요한 부분인 ‘빛 수정’의 에너지를 제어하는 방식에 대한 정보는 아직까지
    드러나지 않았다. 몸통 주변의 스피커에서 차가운, 날카로운 소리를 들으며 그녀는 눈부신 황금빛 광선을 따라 다가오고 있다는 것을 알았다. '하지만…
    이제부터는 내가 모든 것을 결정한다.
