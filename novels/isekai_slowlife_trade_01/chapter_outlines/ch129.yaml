beats:
- name: intro
  instruction: 차하린은 빛 수정 에너지를 활용한 새로운 제품 개발에 박차를 가했다. 그녀는 이계 상인들의 의존도를 줄이고, 거래 시스템의
    새로운 지평을 열기 위해 '광합성 약품'이라는 제품 생산 방식을 고안했지만, 실험 과정에서 예상치 못한 부작용으로 인해 빛 수정의 에너지가
    불안정해졌다. 차하린은 이계에 전해 내려온 민족들의 상록수를 파괴하는 불필요한 행위를 통해 생산량을 끌어올리고자 시도했지만, 그 과정에서 그녀는
    자신의 행동이 이계의 자연 순환과 관련된 민족들의 신앙을 훼손하고 있다는 사실에 슬픔을 느끼기 시작했다. 차하린은 이계의 지속 가능한 발전을
    위한 새로운 방안을 찾고자 하지만, 현재 상황에서 어떻게 해야 할지 고민에 빠졌다.
- name: development
  instruction: 차하린은 숙면을 취하며 고민을 정리하려고 했다. 그녀는 작은 책상 위에 두었던 이계의 민족들의 역사와 전통에 관한 책을
    다시 한번 열었다.  책 속에는 상록수를 중심으로 회전하는 신앙과 자연과의 조화로운 공존이 강조되어 있었다. 흙냄새가 풍기는 작은 정원에 나앉아
    있는 꽃송이의 모습, 그 내부에서 피어나려는 순간의 아름다움을 상상하며 차하린은 얼굴을 스스로 감싸주었다. “내 행동이 이계의 자연순환과 신앙을
    훼손하고 있다는 사실이 분명한데... 어떻게 해야 할까?” 차하린은 속삭였다. 그녀의 시선은 빛 수정 에너지를 저장하는 주석 장치로 향했다.
    “광합성 약품 개발에 필요한 에너지량을 줄여… 이계의 자연 순환과 조화를 맞출 수 있는 방법을 찾아야 한다.”  다음날 새벽, 차하린은 지중해
    해변에서 잡힌 오징어가 만든 스프를 먹으며 기분 전환을 시도했다. 그녀는 자신의 상황을 온전히 이해하기 위해 이계의 역사와 문화에 대해 더
    깊이 공부해야 한다고 결심했다. 차하린은 책상 위에 두었던 거대한 신시스템 지도를 확장하면서  ‘민족들의 신앙과 자연 순환’ 검색을 시도했다.
