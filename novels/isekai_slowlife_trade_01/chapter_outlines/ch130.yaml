chapter_n: 130
overall: '{"chapter_n": "130", "act": "2", "content": "빛 수정 에너지의 불안정성이 전염될까 봐 온갖 상황을
  예상하며 초조한 시간을 보냈다. 차하린은 이계 상인들에게 새로운 제품 개발에 대한 부담감을 주면 안 된다는 사실에 좌절감을 느꼈지만, 지금 당장의
  위기를 해결하는 것이 가장 중요했다고 스스로에게 말했다. 그녀는 낡은 문헌을 다시 한번 검토하며 새로운 빛 수정 에너지 조작 방법을 찾아 헤매었다.
  힘이 약해진 빛 수정에 대한 공포감이 점점 커져갔다.  그러던 중, 차하린은 고대 문헌 속의 ''희망 원숭이''라는 신비로운 동물에 대한 언급을
  발견했다. 이 동물은 빛 수정 에너지를 조절하는 능력으로 알려졌는데, 그들의 행동과 빛 수정 에너지의 변화 사이에는 강력한 연결성이 있었다고 주장했다."}'
beats:
- name: intro
  instruction: "- '빛 수정 에너지의 불안정성에 대한 두려움은 차하린을 가로질러 자리 잡고 있었다.' \n- 핵심 공간 묘사: 오래된\
    \ 도서관 책장 앞, 황갈색 책으로 가득찬 모습. 북극곰 모양의 독특한 문이 있는 상자 (냄새는 약간 퀴퀴함).  \n- 첫 인물 등장 +\
    \ 호칭( 이준 씨) -> '이준 씨, 어디에 있어요?' \n- 짧은 대사 1~2개: '아직 몇 시간 남았는데...' (이준), ‘새로운 제품\
    \ 개발을 위해서도 이 일정을 잡지 않으면 안 되는 상황.’\n- 마지막 줄: 차하린의 눈은 고대 문헌 속에 적힌 신비로운 동물 이름 '희망\
    \ 원숭이'를 향해 집중했다."
- name: development
  instruction: "- 핵심 사건 발생 (동작 단위 묘사): 차하린이 책장에서 오래된 책을 꺼내고 조심스럽게 표지를 살피며 문헌 속 그림을\
    \ 자세히 관찰한다. \n- 통증/충격 등 신체 감각: 차하린은 머리에 가슴까지는 물든 어두운 감각으로 그녀의 두통이 심해졌다. 잊지 못할\
    \ 고통과 불안감.\n- 내적 독백 1~2줄: '희망 원숭이는 진짜 존재하는 거야? 그리고 이 동물은 빛 수정 에너지를 조절하는 방법을 알고\
    \ 있을까?' \n- 새 정보 발견 (단서/메모/시스템 메시지): 문헌에서 나온 그림은 고대 사람들이 ‘희망 원숭이’를 이용하여 빛 수정 에너지를\
    \ 활용하는 과정을 보여주었다.  \n  },{"
