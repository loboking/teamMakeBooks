chapter_n: 134
overall: '{"chapter_n": "134", "act": "2", "content": "일부 상인들은 새로운 제품의 잠재력을 높이 평가하며
  빠르게 주문을 증폭시키는 반면, 다른 일부 상인들은 이계 거대 세력의 적극적인 관찰을 의심해하며 불안한 감정으로 대응했다. 차하린은 이러한 분열된
  반응을 보며 계산적인 미소를 지었다. 그녀는 자신의 제품이 곧 이계 거대 세력의 관심을 끌 것이라는 것을 예상했지만, 상인들의 반응이 전혀 일치하지
  않고 있는 상황 속에서 더욱 신중한 대처가 필요하다고 판단했다.  차하린은 새로운 제품의 공급량을 조절하며 이계 거대 세력의 진심을 살피기 시작했으며,
  동시에 새로운 협력 관계를 구축하기 위한 계획을 세우고 있었다." }'
beats:
- name: intro
  instruction: "- 주인공의 자조/일상 톤 1줄로 시작 \n- 핵심 공간 묘사 (시각 2 + 후각/청각 1)\n- 첫 인물 등장 + 호칭(\"\
    이준 씨\" 등)\n- 짧은 대사 1~2개\n- 마지막 줄: 다음 비트로 넘기는 미세한 위기 신호"
- name: development
  instruction: '- 핵심 사건 발생 (동작 단위 묘사)

    - 통증/충격 등 신체 감각

    - 내적 독백 1~2줄

    - 새 정보 발견 (단서/메모/시스템 메시지)'
