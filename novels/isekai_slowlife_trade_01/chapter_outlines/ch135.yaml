chapter_n: 135
overall: '{"chapter_n": "135", "act": "2", "content": "차하린은 이계 거대 세력의 관심을 불러일으키는 막상,
  새로운 제품 시범 공급을 통해 상인들의 반응을 살피기 위해 계속해서 정보를 수집했다. 그녀는 주변 상인들의 걱정과 불안한 표정을 무시하고 차분히
  계획을 세우며 일자리 구직의 방법은 곧 이계 거대 세력에 대한 방어책이 될 것이라는 확신을 가지고 있었다.  하지만, 그녀는 예상치 못한 감정적
  변화를 느끼기 시작했다. 자신만의 경험과 지식을 바탕으로 이계와 현실 사이에서 끊임없이 전진해왔던 차하린은 이제 두 세계를 연결하는 중간자로서
  책임감과 무거움을 느끼게 된 것이다.  그리하여 그녀는 새로운 목표를 설정했다. 자신만의 제품을 통해 이계와 현실의 균형을 맞추고, 모든 상인들에게
  평등한 기회를 제공하는 것이었다."}'
beats:
- name: intro
  instruction: '차하린은 고급 커피 향과 달콤한 과자의 향을 머리로부터 아래 doğru 느끼며, 이계에 온 지 몇 달이 되었는지 생각했다.  -
    주변 상인들의 불안한 표정이 보이는 공간 (시각: 어두컴컴한 벽장 사이가 가득 차 있는 방, 시각: 오렌지색 조명으로 뒤덮인 이계 상인들의
    얼굴), 향기 (커피/과자)  - ''오늘은 분위기가 이상하구나''라고, 마라톤을 위해 달리온 듯한 기운이 가득한 면모를 보이는 한 인물에게
    말했다.'
- name: development
  instruction: '- 차하린의 행동: ''정보를 수집해야 한다''라는 생각으로 상인들 사이로 걸어간다 (행동) -  상인들의 불안한 표정이
    갑자기 얼굴을 통과하는듯하고 위압적임을 느끼고, 촉각적으로 차가운 벽을 만지는 것에 대한 감각. 내적 독백: ''이게 무슨 일인가'' (신체감:
    잠시 머리카락 끝이 부드럽게 들끓는 것 같은 기분) - 상인의 말:'
