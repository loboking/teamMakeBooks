chapter_n: 136
overall: '{"chapter_n": "136", "act": "2", "content": "정보 수집은 성공적으로 마무리되었지만, 차하린이
  가진 정보는 단순히 상인들의 불안을 증폭시키는 막연한 예측에 불과했다. 이계 거대 세력의 진짜 의도는 아직 모르고 있었으며, 그녀는 더 깊은 조사가
  필요하다고 판단했다. 차하린은 이를 위해 새로운 계획을 세우기 시작했는데, 그것은 현실 세계에서 일어나고 있는 변화와 직접적인 연관성을 가지고
  있었다. "정보 수집"이라는 단어에 숨겨진 진짜 의미는 무엇이며, 차하린은 자신의 제품을 통해 이계 거대 세력과 어떤 게임을 하는지 알아내려 한다."}'
beats:
- name: intro
  instruction: "- 정보 수집은 성공했지만, 차하린의 표정은 여전히 무거웠다. \n- 그녀는 방 안 한가운데 어두워진 책상 앞에 앉아,\
    \ 진한 향기가 나는 커피를 마시고 있었다. 거실 창문을 통해 비치는 밤의 빛이 책상 위의 문서들을 윤곽선으로 만들어냈다.  매끄러운 표면은\
    \ 차분하면서도 암울한 분위기를 자아내고 있었다.\n- '정보 수집'이라는 단어에 숨겨진 진짜 의미는 무엇일까?\n- \"인터넷 검색 결과로만\
    \ 족할 순 없다. 이준씨, 지금부터 본격적인 조사 시작해볼 테니 너도 함께 도와줄래?\"  \n- 차하린의 목소리는 평상시보다 더욱 저조했다.\n\
    - 그녀의 눈은 사실이 아닌, 숨겨진 진실을 향한 불타는 열망으로 가득 차 있었다."
- name: development
  instruction: "-  차하린은 이준씨에게 전달받은 정보들을 정리하면서 낡은 지도를 꺼내 보았다. 지도 위에 표시된 문구들은 이해하기 어려웠지만,\
    \ 차가운 은빛이 반짝이는 글자들 속에서 약간의 변화를 느낄 수 있었다.\n- 그녀는 손으로 지도를 따라가며 그 안에 숨겨진 의미를 파악하려고\
    \ 애썼다. 오랜 시간 동안 이계 거대 세력의 활동을 살펴보았던 차하린은 이번 정보 속에서 비정상적인 패턴을 발견했다.\n- \"저렇게 복잡한\
    \ 네트워크… 숨겨진 메시지를 찾아내는 게 더 중요해 보인다.\"  \n- 그녀의 손가락이 마치 지도 표면과 연결된 것처럼 살짝 들썩였다.\
    \ - 차하린은 몇 개의 주요 단어들을 눈에 담고, 이들의 의미를 파악하기 위해 다른 자료들을 찾아보기 시작했다.\n- \"잠깐만… 에픽 게임에서\
    \ 등장하는 용의 이름이었던 것 같은데?\" \n-"
