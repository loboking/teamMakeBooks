chapter_n: 137
overall: '{"chapter_n": "137", "act": "2", "content": "차하린은 이계의 거대 세력이 가진 진짜 정보를 얻기
  위해 깊숙한 계층으로 들어가려는 계획을 세웠다. 새로운 상품 개발보다 더 위험하지만, 결과적으로 더 큰 보상을 가져올 수 있다고 생각했다. 그녀는  이계
  상인들에게 알려진 소문들을 종합하여 거대 세력의 정보 접근 경로를 파악하려 노력했는데, 그 속에서 가장 믿을 만한 단서가 하나 발견되었다: ''블랙
  마켓'' 이라는 이름으로 불리는 비밀스러운 거래 네트워크. 차하린은  이 블랙 마켓에 도달하는 방법을 찾고, 거대 세력의 진짜 의도를 알아낼 수
  있는 기회를 얻으려 한다는 막강한 자신감을 드러냈다. 하지만 그녀가 아직 모르는 것은 바로 이 계획이 그녀를 새로운 위험과 어둠 속으로 끌어들일
  것이라는 사실이었다."}'
beats:
- name: intro
  instruction: "-  '블랙 마켓'이라는 단어가 오늘 하루를 채웠다. 이준 씨는 먼저 나왔을 거야. '마치 잡시한 날짜에 몸집 커진 개\
    \ 같은 느낌'이라 말했다가, 차하린은 시선을 그쪽으로 돌리며  내면에서 비웃었다.\n- 낡고 지저분한 이계 상인들의 모으는 장소. 어두운\
    \ 거리를 따라 진입하는 동안 썩은 단풍잎의 향기와 가로등 불빛이 피어나는 그림자 조합에 시각적인 불편함을 느끼었다.\n-  바람에 살짝 흔들리는,\
    \ '카페'라고 적힌 노란색 신호판 위쪽으로 올라오는 소음. 차하린은 이준 씨의 목소리가 들려왔다. \n-"
- name: development
  instruction: "- 낮고 어두운 카페 내부. 주변에는 이계 상인들이 서로 대화하며 자리를 지키고 있지만, 차하린은 눈을 감는 등 자신의\
    \ 존재를 분명히 보이지 않으려 노력했다.\n- '블랙 마켓'에 대한 정보를 얻기 위해 깊숙한 계층으로 들어가야 한다. 이준 씨의 말씀처럼,\
    \ 거대 세력과의 연결고리를 파악하는 것은 매우 위험할 수 있다는 것을 알아보았다. 그녀는 숨을 조심스럽게 들이쉬며  눈을 살짝 열었다.\n\
    - 차하린의 손바닥은 시원한 땀으로 적셔졌다. '블랙 마켓'에 도달하는 것은 불확실한 미래로 향하는 것과 같아 더욱 어색한 기분이 들기 시작했다.\
    \ \n-"
