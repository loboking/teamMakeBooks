chapter_n: 138
overall: '{"chapter_n": "138", "act": "2", "content": "차하린은 이계 상인들의 소문을 종합하여 거대 세력이
  정보를 얻는 경로를 파악했다.  그것은 ''황금 광역''이라는 신비로운 땅으로, 거대 세력만 접근할 수 있는 특별한 공간이었다. 차하린은 황금
  광역에 대한 자세히 알아보기 위해 이계 상인들이 사용하는 ''영혼의 지도''를 찾기 시작했다. 영혼의 지도는 황금 광역까지 가는 길을 보여주는
  특별한 도구였지만, 습득하기 어렵고 위험한 작업이었다.  차하린은 이계 거대 세력의 진짜 의도를 파악하기 위해 그 속으로 들어가려는 계획을 세우기
  시작했다."}'
beats:
- name: intro
  instruction: '''상인들 사이에서 ''황금 광역'' 이라는 소리가 자주 들린다더니, 거대 세력만 접근할 수 있는 곳이라고...'' 차하린은
    낡은 책상 위에 펼쳐진 주요 정보들을 다시 한번 살펴보았다.  부서진 벽돌과 어두운 분위기의 이계 상인들의 자리를 보며 그녀는 마치 고추장
    같은 향기에 뒤덮인 무지개처럼, 멀리에서도 눈에 잘 드는 황금빛 광채를 가진 특별한 공간을 상상했다. 잡음으로 가득한 시끄러운 대회장에 비해
    차분한 조용함 속에서만 들리는 은은한 불꽃 소리가 그녀의 마음속에 자리 잡았다.  ''이준 씨, 이제부터는 황금 광역을 찾아야 한다고 생각하는
    거예요?'' 차하린은 주변 상인들에게 물었다. 이준 씨는 미소를 지으며 ''맞습니다. 그곳만 알면 우리의 행운은 더욱 커질 것입니다.''라고
    대답했다.'
- name: development
  instruction: '''저에게도 한번 보여주시겠어요?'' 차하린은 얼굴에 반짝이는 기대감을 드러냈다. 이준 씨는 ''그곳은 위험한 곳이라는
    것을 알고 계신가? 그런데도 여전히 당신의 마음속에는 무언가를 찾고 있는 것 같습니다.''라고 말했다. 차하린은 그녀의 손에 느껴지는 미묘한
    공포감을 떨쳐내려고 했지만, 불안한 심장박동만이 그녀를 위협하는 것처럼 느껴졌다.  차하린의 손가락으로는 ''영혼의 지도''라는 특별한 도구의
    형태와 느낌이 파악되기 시작했다. 그것은 부드러운 면모로 감싸여 있으며, 차분하고 고요한 에너지로 가득 차 있었다. ''이걸 가지고만 있다면
    황금 광역을 찾아낼 수 있을까?'' 차하린은 마음속으로 반복하며  ''영혼의 지도''를 더욱 깊이 살펴보았다.'
