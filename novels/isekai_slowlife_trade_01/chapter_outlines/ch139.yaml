chapter_n: 139
overall: "{\n  \"chapter_n\": \"139\",\n  \"act\": \"2\",\n  \"content\": \"차하린은 이계\
  \ 상인들의 소문을 바탕으로 '황금 광역'으로 접근하는 방법을 구체화했다. 영혼의 지도가 거대 세력"
beats:
- name: intro
  instruction: 차하린은 이계 상인들의 소문을 바탕으로 '황금 광역'으로 접근하는 방법을 구체화했다. 영혼의 지도가 거대 세력
- name: development
  instruction: 차하린이 영혼의 지도를 통해 황금 광역으로 접근하는 과정에서 현실과 이계의 경계가 물리적으로 흔들리는 현상을 겪는다. 이계의
    물건을 교환하는 행위가 현실에 미치는 파급 효과를 측정하고, 이계의 존재들이 차하린의 움직임을 감지하기 시작하는 구체적인 징후를 묘사한다.
    이계의 거래가 단순한 교환을 넘어 현실의 법칙에 미묘한 균열을 일으키는 과정을 건조하게 묘사한다.
- name: climax
  instruction: 차하린이 이계의 지도를 완성하고 황금 광역으로 진입하는 순간, 거대 세력의 감시망이 차하린에게 직접적으로 반응하며 물리적인
    압력으로 현실을 짓누르는 클라이맥스를 연출한다. 이계의 근원적 질서를 재편하려는 차하린의 의지가 폭발하며 현실의 경계를 무너뜨리는 최종 각성
    순간을 강렬하게 묘사하며 다음 회차로 넘기는 강한 클리프행어로 마무리한다.
