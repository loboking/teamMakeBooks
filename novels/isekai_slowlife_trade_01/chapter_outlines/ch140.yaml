chapter_n: 140
overall: 차하린은 영혼의 지도를 따라 황금 광역으로 접근하는 마지막 단계를 실행했다. 거대한 세력들이 접근할 수 있는 신비로운 경계선에 발을
  디딘
beats:
- name: intro
  instruction: "이 부분은 회차 시작. 분량 1,800자 이상.\n- 차하린의 슬로우 라이프 중인 고요한 상태와 내적 자조 톤 1줄로\
    \ 시작.\n- 영혼의 지도에 따라 황금 광역으로 접근하는 과정의 감각적 묘사 (시각, 촉각, 청각). 이계의 경계선에 가까워질수록 현실의\
    \ 물리 법칙이 미세하게 왜곡되는 느낌을 묘사.\n- 이계의 경계선에서 감지되는 거대한 존재들의 움직임과 그들의 에너지의 압력에 대한 묘사.\n\
    - 잠시 멈춰서 이계의 물건과 현실의 물건을 교환하는 행위의 건조하고 무감각한 과정 묘사.\n- 등장하는 이계의 에너지의 차가움과 현실 세계의\
    \ 따뜻함의 대비를 강조.\n- 짧은 대사 1~2개 (차하린의 무덤덤한 반응). \n- 마지막 줄: 다음 비트로 넘기는 미세한 위기 신호,\
    \ 황금 광역의 존재들이 이제 물리적 형태로 나타나기 직전의 긴장감."
- name: development
  instruction: '이 부분은 회차 중반. 분량 1,800자 이상.

    - 황금 광역의 경계선에 발을 디딘 순간의 충격과 이계의 거대한 세력들이 물리적 형태로 나타나기 시작하는 과정의 상세한 묘사.

    - 차하린의 신체에 이계의 에너지가 폭발적으로 주입되는 신체적 변화와 각성 초기 단계의 통증과 혼란.

    - 이계의 존재들이 차하린을 인식하고 반응하는 시각적, 청각적 묘사.

    - 이계의 물건들이 현실 세계에 미치는 즉각적인 물리적 영향 (양방향 무역의 결과)과 현실 세계의 균열 심화.

    - 차하린이 이계의 힘을 통제하기 위해 필사적으로 노력하는 내적 독백과 냉정한 분석.

    - 마지막 줄: 다음 비트로 넘기는 압도적인 힘의 충돌과 차하린이 이계의 질서를 강제로 꿰뚫는 결정적인 순간의 예고.'
- name: climax
  instruction: '이 부분은 회차 마지막. 분량 1,800자 이상.

    - 차하린이 이계의 근원적 질서를 파괴하고 현실의 경계를 무너뜨리는 최종 각성 순간의 극적인 연출.

    - 이계의 거대 세력과의 힘의 충돌 시퀀스 묘사. 차하린이 이계의 근원적 힘을 흡수하고 현실의 법칙을 초월하는 존재로 거듭나는 과정의 섬세한
    묘사.

    - 현실과 이계의 경계가 완전히 소멸하며 발생하는 시각적, 청각적 충격의 극대화.

    - 차하린이 이계의 질서를 재편하고 현실을 초월하는 존재로 거듭나는 최종 상태의 감정적, 물리적 묘사.

    - 마지막 문장: 다음 화로 넘기는 강한 클리프행어, 차하린이 현실 세계의 절대적인 힘을 획득하고 이계의 패권을 장악하는 순간의 압도적인 여운.'
