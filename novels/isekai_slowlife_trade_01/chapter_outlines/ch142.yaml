chapter_n: 142
overall: 'chapter_n=142, act=2

  차하린은 이계의 물건을 통해 얻은 힘을 현실 세계에 적용하기 시작했다. 그가 거래한 아이템들은 단순한 물건이 아니었고, 현실의 물리 법칙을 왜곡하는
  이계의 에너지를 담'
beats:
- name: intro
  instruction: '이 부분은 차하린이 이계의 힘을 현실에 적용하는 초기 단계의 고독하고 건조한 행위를 묘사한다. 분량 1,800자 이상.

    - 차하린의 현재 상태 묘사: 이계의 에너지를 현실에 적용하는 과정의 무감각함과 슬로우 라이프의 분위기.

    - 핵심 사건 1: 차하린이 이계의 에너지(물건)를 현실의 물리 법칙에 주입하는 과정의 미세한 왜곡과 현실의 균열.

    - 핵심 사건 2: 거래한 아이템들이 현실에 미치는 미묘한 영향(물리 법칙의 변화)을 관찰하는 과정.

    - 등장 인물 + 첫 호명: 아무도 없거나, 혹은 이계의 잔재(혹은 차하린의 내면의 목소리)를 간접적으로 호명.

    - 시각·후각·청각·촉각 묘사 포인트: 주변 환경의 정적인 묘사. 손끝에서 느껴지는 이계 에너지의 차가움, 공기의 미세한 떨림, 텅 빈 공간의
    건조함.

    - 대사 1~3개: 차하린의 무심한 독백이나 짧은 거래에 대한 반응.

    - 마지막 줄: 현실의 법칙이 미세하게 흔들리며, 다음 단계의 폭발을 암시하는 불안정성의 시작.'
- name: development
  instruction: '이 부분은 힘을 확장하고 현실 세계에 본격적으로 영향을 미치기 시작하는 중반부의 과정이다. 분량 1,800자 이상.

    - 핵심 사건 1: 차하린이 이계의 힘을 이용해 현실의 물리적 제약을 돌파하는 구체적인 실험 및 적용. (예: 물질의 밀도, 중력, 시간의
    흐름에 대한 미세한 조작 시도).

    - 핵심 사건 2: 이계의 힘이 현실의 시스템(시스템)과 상호작용하며 차하린의 잠재력이 폭발적으로 증폭되는 과정의 묘사. (시스템 메시지 또는
    내적 감각으로 표현).

    - 등장 인물 + 첫 호명: 차하린 자신과의 대화 혹은 이계의 거대한 흐름(혹은 시스템)의 목소리를 간접적으로 등장시킴.

    - 시각·후각·청각·촉각 묘사 포인트: 힘을 사용했을 때 발생하는 비현실적인 시각 효과(색채 왜곡, 입자의 움직임), 심장 박동의 변화, 신경계의
    과부하에서 오는 건조한 감각.

    - 대사 1~3개: 힘의 사용에 대한 건조한 인식, 이계의 존재에 대한 무심한 질문, 혹은 시스템의 냉정한 안내.

    - 마지막 줄: 현실 세계에 차하린의 영향력이 명확히 각인되며, 이계의 거대한 세력과의 충돌이 임박했음을 암시.'
- name: climax
  instruction: '이 부분은 차하린이 이계의 근원적 질서를 파괴하고 현실의 경계를 무너뜨리는 최종 각성 순간이다. 분량 1,800자 이상.

    - 핵심 사건 1: 차하린이 이계의 모든 힘을 통합하여 현실의 물리 법칙 자체를 근본적으로 재정의하는 결정적인 행동. (이계의 질서 파괴 행위).

    - 핵심 사건 2: 현실과 이계의 경계가 완전히 붕괴되는 순간, 차하린의 존재 자체가 초월적인 존재로 거듭나는 물리적/존재론적 묘사.

    - 등장 인물 + 첫 호명: 차하린의 내면에서 발현되는 궁극적인 의지, 혹은 이계의 근원적 에너지와의 직접적인 접촉.

    - 시각·후각·청각·촉각 묘사 포인트: 모든 감각이 극단으로 증폭되며 발생하는 압도적인 빛과 소리의 충돌, 존재의 경계가 무너지는 순간의 절대적인
    공허함과 충만함.

    - 대사 1~3개: 존재론적 질문에 대한 무응답, 혹은 최종 각성의 순간을 선언하는 건조하고 단호한 선언. (미사여구 금지).

    - 마지막 줄: 현실과 이계의 모든 것이 차하린의 의지에 종속되며, 새로운 차원의 존재로 거듭나는 최종적인 경계의 붕괴.'
