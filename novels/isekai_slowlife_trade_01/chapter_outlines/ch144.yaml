chapter_n: 144
overall: 'chapter_n=144, act=2

  차하린은 이계의 에너지를 현실에 주입하는 실험을 지속했다. 그 결과, 그의 주변 현실은 미묘하게 왜곡되기 시작했다. 일상적인 물리 법칙'
beats:
- name: intro
  instruction: '차하린이 이계의 에너지를 현실에 주입하는 실험을 지속하는 장면을 시작한다. 주변 현실이 미묘하게 왜곡되기 시작하는 과정을
    관찰하고, 그 변화에 대한 차하린의 건조하고 분석적인 반응을 묘사한다.

    - 핵심 사건 1~3개: 이계 에너지 주입 실험의 지속, 주변 현실의 미세 왜곡 감지, 물리 법칙의 모순 발견.

    - 등장 인물 + 첫 호명: 차하린 (1인칭 시점).

    - 시각·후각·청각·촉각 묘사 포인트: 실험 장비에서 발생하는 미세한 열기, 공기의 미세한 떨림, 유리 표면의 왜곡, 손끝에 느껴지는 미세한
    진동.

    - 대사 1~3개: "이 정도면 충분하다.", "측정값이 틀렸다.", "이상하다."

    - 마지막 줄: 현실의 물리 법칙이 무너지기 직전의 긴장감과 함께, 다음 비트로 넘기는 미세한 균열의 감각.'
- name: development
  instruction: '차하린이 에너지 주입 실험의 결과로 인해 주변 현실이 더욱 심하게 왜곡되는 과정을 자세히 묘사하며, 그 왜곡이 단순한
    오류가 아닌 이계의 개입임을 인지하는 과정을 심화시킨다.

    - 핵심 사건 1~3개: 에너지 주입량 증가에 따른 현실 왜곡의 가속화, 현실 물질의 형태 변화, 이계 에너지의 물리적 영향력 확인, 실험
    장비의 비정상적 반응.

    - 등장 인물 + 첫 호명: 차하린 (1인칭 시점).

    - 시각·후각·청각·촉각 묘사 포인트: 공간이 휘어지는 듯한 시각적 착시, 공기가 찢어지는 듯한 소리, 물질의 질감이 변하는 촉각, 피부에
    찌릿한 전류가 흐르는 감각.

    - 대사 1~3개: "이건 계산 범위를 벗어난다.", "균열이 시작되었다.", "현실이 부서진다."

    - 마지막 줄: 실험이 통제 불능 상태에 도달하며, 차하린의 의식이 이계의 흐름과 완전히 얽히는 결정적인 순간.'
- name: climax
  instruction: '차하린이 에너지 주입 실험의 최종 단계에서 현실의 경계가 완전히 무너지는 순간을 강렬하게 연출하며, 이계의 근원적 질서를
    파괴하고 현실을 초월하는 존재로 각성하는 결정적인 순간을 포착한다.

    - 핵심 사건 1~3개: 최종 에너지 폭발, 현실과 이계의 경계 붕괴, 차하린의 완전한 각성, 이계의 질서 재편 시도.

    - 등장 인물 + 첫 호명: 차하린 (1인칭 시점).

    - 시각·후각·청각·촉각 묘사 포인트: 빛의 폭발, 공간의 해체와 재조립, 무한한 에너지의 흐름, 차원 간의 충돌에서 오는 압도적인 감각.

    - 대사 1~3개: "이제 끝이다.", "모든 것이 무너진다.", "나는 존재한다."

    - 마지막 줄: 차하린이 이계의 근원적 진실을 파악하고 현실과 이계의 경계를 초월하여 새로운 차원의 존재로 각성하는 최종 클라이맥스.'
