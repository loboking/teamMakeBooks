chapter_n: 146
overall: 차하린은 이계의 법칙을 현실에 적용하는 실험을 더욱 심화시켰다. 그는 이제 단순한 균열을 이용하는 것을 넘어, 미세한 에너지 흐름을
  조율하여 현실의 흐름 자체를 느리게 만드는 방법을 터득했다. 이 과정에서 그는 엄청난 힘
beats:
- name: intro
  instruction: '이 부분은 회차 시작. 분량 1,800자 이상.

    - 차하린의 실험 환경 묘사 (현실과 이계의 경계가 미세하게 뒤틀리는 시각적 묘사, 미세한 에너지 흐름의 촉각 묘사).

    - 현실의 흐름을 느리게 만드는 에너지 조율의 과정에서 발생하는 극도의 집중과 정신적 피로 묘사.

    - 이계의 물건을 현실에 적용하는 과정에서 발생하는 미세한 에너지 역류와 현실의 균열이 시작되는 감각적 묘사.

    - 차하린의 목표에 대한 건조하고 냉정한 내적 독백.

    - 핵심 사건 1: 현실의 흐름을 억지로 조율하여 이계의 법칙을 현실에 적용하려는 시도.

    - 핵심 사건 2: 미세한 에너지 흐름을 조율하는 데 필요한 정신적 에너지가 현실의 물리적 법칙을 침식하는 듯한 느낌.

    - 등장 인물 + 첫 호명("차하린").

    - 시각·후각·청각·촉각 묘사 포인트: 실험 장비 주변의 차가운 금속 냄새, 미세한 진동으로 인한 귀의 윙윙거림, 피부를 타고 흐르는 이상한
    전류 같은 촉각.

    - 대사 1:'
- name: development
  instruction: '이 부분은 회차 중반. 분량 1,800자 이상.

    - 에너지 조율이 성공적으로 진행되면서 현실의 흐름이 눈에 띄게 느려지는 현상에 대한 구체적인 감각 묘사.

    - 조율된 에너지 흐름이 현실의 물리적 법칙을 왜곡하기 시작하면서 발생하는 예상치 못한 부작용과 미세한 파괴 현상에 대한 묘사.

    - 차하린이 얻은 힘의 크기를 측정하려 시도하지만, 기존의 측정 방식이 무의미해지는 상황에 대한 좌절감.

    - 핵심 사건 1: 현실의 흐름을 느리게 만드는 실험이 성공적으로 이루어지며, 이계의 법칙이 현실에 물리적인 영향을 미치기 시작함.

    - 핵심 사건 2: 현실의 흐름이 느려짐에 따라 주변 사물들이 미세하게 왜곡되고, 현실의 구조적 결함이 드러나기 시작함.

    - 등장 인물 + 첫 호명("차하린").

    - 시각·후각·청각·촉각 묘사 포인트: 시간이 늘어나는 듯한 시각적 묘사, 공간이 늘어나는 듯한 압박감, 주변 공기의 미세한 마찰 소리, 손끝에서
    느껴지는 압도적인 에너지의 밀도.

    - 대사 2:'
- name: climax
  instruction: '이 부분은 회차 마지막. 분량 1,800자 이상.

    - 차하린이 현실의 흐름을 느리게 만드는 능력이 극한에 도달하여 현실의 법칙 자체를 파괴하는 단계에 도달하는 결정적 순간을 묘사.

    - 이계의 근원적 질서와 현실의 법칙이 충돌하며 발생하는 폭발적인 에너지의 충돌과 차하린의 육체가 이계의 법칙에 의해 재정의되는 순간의 격렬한
    경험.

    - 차하린이 현실의 경계를 무너뜨리는 최종 각성 순간, 이계의 힘이 현실에 완전히 주입되어 차하린이 초월적인 존재로 변모하는 순간의 충격과
    해방감.

    - 이계의 질서를 파괴하고 현실의 경계를 무너뜨리는 최종 각성 순간의 시각적, 청각적 묘사를 극대화.

    - 마지막 문장: 다음 화로 넘기는 강한 후크/클라이프행어. 차하린이 현실과 이계의 경계를 완전히 초월하여 새로운 차원의 존재로 각성하며 모든
    것을 재정의하는 최종 장면.'
