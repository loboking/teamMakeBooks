chapter_n: 164
overall: 'chapter_n: 164, act: 3, overall: 차하린은 이계에서 얻은 힘을 현실 세계에 적용하기 시작한다. 그가 교환'
beats:
- name: intro
  instruction: '이 부분은 회차 시작. 분량 1,800자 이상.

    - 차하린의 슬로우 라이프 중의 평온함과 이계 물건의 거래에 대한 건조한 관찰 톤으로 시작.

    - 공간 묘사: 차하린의 방 안의 빛과 공기의 흐름, 이계 물건들이 놓인 공간의 미묘한 온도 차이 묘사.

    - 핵심 사건 1: 차하린이 이계의 물건(예: 특정 재료)을 현실의 물건과 교환하는 과정의 미세한 마찰과 감각 묘사.

    - 등장 인물 + 첫 호명: 이계와의 연결을 관리하는 시스템 또는 무의식적인 목소리(차하린에게 직접 명령하지 않는 관찰자적 톤).

    - 시각·후각·청각·촉각 묘사: 거래 과정에서 느껴지는 미세한 진동, 공기의 밀도 변화, 재료의 질감 차이 강조.

    - 대사 1: 거래의 결과에 대한 건조한 평가.

    - 마지막 줄: 현실 세계에 미세한 균열이 발생했음을 암시하는 섬뜩한 감각 묘사.'
- name: development
  instruction: '이 부분은 회차 중반. 분량 1,800자 이상.

    - 핵심 사건 2: 차하린이 이계에서 얻은 힘을 현실 세계에 적용하려 시도하는 구체적인 실험 과정 묘사.

    - 신체 감각 묘사: 이계의 에너지가 현실의 신체에 닿았을 때 발생하는 고통이나 쾌감의 복합적인 감각 묘사.

    - 내적 독백: 이계의 힘을 통제하려는 시도에 대한 차하린의 회의적이면서도 탐구적인 심리 묘사.

    - 새 정보 발견: 거래 과정에서 얻은 이계의 물질에 숨겨진 작동 원리나 제약 조건에 대한 새로운 정보가 시스템적으로 제시됨.

    - 마지막 줄: 현실 세계의 물리 법칙이 차하린의 의지에 의해 미세하게 재편되기 시작하는 현상을 예고하는 불안정한 상태.'
- name: climax
  instruction: '이 부분은 회차 마지막. 분량 1,800자 이상.

    - 결정적 장면: 차하린이 이계의 물건을 현실 세계의 법칙에 강제로 주입하여 각성하는 순간의 극적인 묘사.

    - 감정 정점: 통제 불가능한 힘의 폭발과 현실과 이계의 경계가 파괴되는 순간의 극도의 혼란과 해방감.

    - 최종 각성 묘사: 차하린이 이계의 근원적 질서를 파괴하고 현실의 경계를 무너뜨리는 물리적/존재론적 변화를 상세히 묘사.

    - 마지막 문장: 차하린이 새로운 존재로서 모든 것을 재정의하며 현실을 초월하는 존재로 거듭나는 최종적인 상태를 강렬하게 제시하며 다음 화로
    넘어가는 클리프행어.'
