chapter_n: 165
overall: 'chapter_n: 165, act: 3, overall: 차하린은 이계에서 얻은 힘을 현실 세계에 적용하는 실험을 지속한다. 단순한
  물건 교환을 넘어, 그는 이계의 법칙을 현실에 주입하며 현실'
beats:
- name: intro
  instruction: '이 부분은 회차 시작. 분량 1,800자 이상.

    - 주인공의 실험과 슬로우 라이프 톤 1줄로 시작하며 이계의 힘을 현실에 적용하는 과정에 집중한다.

    - 핵심 공간 묘사 (시각 2 + 후각/청각 1) : 차하린의 방, 이계의 물질과 현실 물건이 교차하는 공간의 미묘한 불균형 묘사.

    - 첫 인물 등장 + 호칭("길드 마스터" 등) : 이계의 법칙을 현실에 주입하는 과정에서 발생하는 미세한 오류를 감지하는 존재의 개입.

    - 시각·촉각 묘사 포인트 : 이계의 힘이 현실 물체에 닿을 때 발생하는 미세한 진동, 공기의 밀도 변화, 물질 표면의 미세한 떨림 묘사.

    - 대사 1~3개 (차분하고 건조한 톤 예시 포함) : 실험 과정 중 발생하는 미세한 오류에 대한 차하린의 무덤덤한 반응, 외부 존재의 간결한
    지시.

    - 마지막 줄 : 현실의 법칙이 미세하게 뒤틀리기 시작하는 미세한 균열의 예고.'
- name: development
  instruction: '이 부분은 회차 중반. 분량 1,800자 이상.

    - 핵심 사건 발생 (동작 단위 묘사) : 이계의 법칙을 현실에 주입하는 실험이 통제 불능 상태로 폭발하며 차하린의 신체에 직접적인 변화가
    발생.

    - 통증/충격 등 신체 감각 : 각성 과정에서 발생하는 비물리적인 고통, 신경계가 과부하되는 감각, 몸 안에서 흐르는 이계의 에너지가 현실의
    세포를 찢고 재구성하는 듯한 촉각 묘사.

    - 내적 독백 1~2줄 : 이계의 질서가 현실의 물리 법칙을 압도하며 자신이 통제할 수 없는 존재가 되었다는 냉소적인 인식.

    - 새 정보 발견 (단서/메모/시스템 메시지) : 현실과 이계 사이의 에너지 흐름이 폭발적으로 재편되는 순간, 차하린의 정신에 이계의 지식이
    강제로 주입되는 과정의 디테일 묘사.

    - 마지막 줄 : 폭발적인 각성 직전, 현실과 이계의 경계가 완전히 무너지는 찰나의 순간.'
- name: climax
  instruction: '이 부분은 회차 마지막. 분량 1,800자 이상.

    - 결정적 장면 (시스템 창 등 핵심 연출) : 차하린이 이계의 근원적 질서를 파괴하고 현실의 경계를 무너뜨리는 최종 각성 순간의 시각적,
    청각적 묘사.

    - 감정 정점 : 통제 불가능한 힘에 대한 공포와 동시에 그 힘을 받아들이는 냉정한 수용의 감정의 충돌.

    - 마지막 문장 : 차하린이 이계의 근원적 진실을 파악하고 현실과 이계의 경계를 초월하여 새로운 차원의 존재로 각성하는 최종 상태에 대한 선언.'
