chapter_n: 169
overall: 'chapter_n:169, act:3, overall: 차하린은 현실에 이식된 인과율이 주변의 미세한 왜곡을 야기하는 것을 관찰했다.
  그는 단순한 실험을'
beats:
- name: intro
  instruction: '이 부분은 회차 시작. 분량 1,800자 이상.

    - 차하린의 관찰과 자조적 사고 톤 1줄로 시작. 현실에 이식된 인과율이 주변의 미세한 왜곡을 야기하는 것을 관찰하는 장면을 상세히 묘사한다.

    - 주인공이 이계의 물건을 현실에 교환하는 과정의 미묘한 감각(촉각, 시각)을 묘사한다. 이계의 물건이 현실에 닿는 순간의 물리적 충돌을 건조하게
    묘사한다.

    - 주변 환경의 미세한 변화(빛의 왜곡, 공기의 미세한 진동)를 포착하는 묘사를 통해 이계와 현실의 연결고리를 시각화한다.

    - 등장하는 인물은 주변 환경에 무관심한 현실의 인물(예: 옆방의 학생)이며, 차하린은 그들의 반응에 무감각하다.

    - 대사: 차하린의 내면적 독백과 주변 환경에 대한 건조한 관찰을 담은 짧은 독백 1~2개.

    - 마지막 줄: 이계의 거래가 현실의 법칙에 미세한 균열을 일으키기 시작했다는 점을 암시하며 다음 비트로 넘어간다.'
- name: development
  instruction: '이 부분은 회차 중반. 분량 1,800자 이상.

    - 차하린이 이계의 물건을 통해 얻은 힘의 실질적인 변화를 묘사한다. 단순히 물질적인 교환을 넘어, 인과율에 대한 이해가 심화되는 과정을 심도
    있게 다룬다.

    - 차하린의 정신 상태 변화, 이계의 지식과 현실의 논리가 충돌하며 발생하는 인지 부조화와 혼란을 심리적으로 묘사한다.

    - 이계의 존재들이 현실에 미치는 영향을 구체적인 사례(사소하지만 측정 가능한 현상)로 제시한다. 현실 세계의 물리 법칙이 이계의 존재에 의해
    미세하게 재정의되는 과정을 건조하게 서술한다.

    - 주변 인물과의 상호작용에서 차하린이 느끼는 고립감과, 자신이 현실의 법칙을 조작하고 있다는 사실에 대한 냉소적인 해석을 담는다.

    - 마지막 줄: 이계의 개입이 현실의 균열을 넘어, 차하린의 잠재력이 폭발할 준비를 마쳤다는 점을 예고한다.'
- name: climax
  instruction: '이 부분은 회차 마지막. 분량 1,800자 이상.

    - 차하린이 이계의 거래를 통해 각성한 힘이 현실의 법칙을 파괴하는 결정적인 순간을 묘사한다. 내면의 통제와 외부 세계의 폭발적인 반응 사이의
    긴장감을 극대화한다.

    - 차하린이 현실의 인과율을 재편하고 이계의 근원적 질서를 파괴하는 행위를 시작하는 순간의 물리적, 정신적 충격을 극적으로 묘사한다.

    - 현실의 경계가 무너지고 차하린이 초월적인 존재로 거듭나는 순간의 시각적, 청각적 묘사를 극대화한다. 이계의 힘이 현실에 완전히 침투하는
    순간의 굉음과 침묵을 대비시킨다.

    - 마지막 줄: 차하린이 이계의 근원적 진실을 파악하고 현실과 이계의 경계를 초월하여 새로운 차원의 존재로 각성하는 최종 순간을 강렬한 클라이맥스로
    마무리한다.'
