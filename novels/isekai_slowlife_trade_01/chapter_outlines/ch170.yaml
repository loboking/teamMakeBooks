chapter_n: 170
overall: 차하린은 인과율의 미세한 왜곡이 특정 지점에서 정체되는 현상을 발견하고, 이를 통해 현실의 흐름을 더욱 느리게 조절하는 방법을 실험하기
  시작했다. 그는 의도적으로 주변 환경에 미
beats:
- name: intro
  instruction: '이 부분은 회차 시작. 분량 1,800자 이상.

    - 차하린의 실험실 같은 공간(혹은 은둔처)의 차분하고 건조한 분위기 묘사. 주변의 소음과 빛의 미세한 떨림을 포착하는 감각 묘사.

    - 차하린이 인과율의 왜곡을 관찰하는 과정의 세부적인 실험 과정과 그로 인한 미세한 정신적 피로 묘사.

    - 이계의 물건을 현실과 교환하는 과정에서 발생하는 미세한 물리적 부작용(예: 손끝의 저림, 시야의 왜곡)을 상세히 묘사.

    - 주변 환경에 대한 건조한 관찰과 이를 통해 현실의 흐름을 조절하려는 차하린의 냉철한 사고 과정.

    - 등장 인물은 차하린 자신과 그가 설정한 실험 환경만 존재. 대화는 내면 독백 위주로 진행.

    - 마지막 줄: 미세한 왜곡이 특정 지점에서 정체되는 현상을 발견하고, 이를 통해 현실의 흐름을 더욱 느리게 조절하는 방법을 실험하기 시작했다.'
- name: development
  instruction: '이 부분은 회차 중반. 분량 1,800자 이상.

    - 차하린이 인과율 왜곡을 이용해 현실의 흐름을 느리게 조절하는 구체적인 방법을 시도하는 과정과 그에 따른 이계 에너지의 역류를 경험하는 과정
    묘사.

    - 현실 세계의 물체(혹은 이계의 물건)에 영향을 미치기 위해 에너지를 집중시키는 물리적 행위의 섬세한 묘사. 이때 발생하는 이계 에너지의
    거친 촉감과 현실 세계의 물리 법칙이 미세하게 흔들리는 촉각적, 청각적 묘사.

    - 이계의 물건을 교환할 때마다 현실 세계의 균열이 조금씩 확장되는 것을 감지하고, 이 균열을 이용해 현실의 법칙에 대한 통제력을 강화하는
    실험의 심화 과정.

    - 차하린의 정신 상태가 극도로 차분해지며, 이계의 존재와 현실의 경계가 모호해지는 심리적 변화를 건조하게 서술.

    - 마지막 줄: 차하린은 인과율의 미세한 왜곡을 통해 현실의 흐름을 조절하는 데 성공했으나, 그 대가로 현실의 근본적인 균열이 눈에 띄게 확장되기
    시작했다.'
- name: climax
  instruction: '이 부분은 회차 마지막. 분량 1,800자 이상.

    - 차하린이 현실의 흐름을 조절하는 실험을 최고조로 끌어올려, 현실의 법칙을 파괴하려는 최종적인 시도를 감행하는 결정적인 순간 묘사.

    - 이계의 근원적 질서를 파괴하고 현실의 경계를 무너뜨리는 에너지 폭발 직전의 물리적, 정신적 극한의 묘사. 주변 공간이 찢어지고 빛과 소리가
    왜곡되는 현상을 시각적으로 극대화.

    - 차하린이 획득한 힘이 현실 세계에 직접적으로 투사되어 현실의 경계가 무너지기 시작하는 순간의 충격과 해방감을 건조하게 표현.

    - 이계의 질서와 현실의 법칙이 충돌하며 발생하는 거대한 에너지의 파동이 차하린의 존재를 재정의하는 순간을 묘사.

    - 마지막 줄: 차하린은 이계의 근원적 진실을 파악하고 현실과 이계의 경계를 초월하여 새로운 차원의 존재로 각성한다.'
