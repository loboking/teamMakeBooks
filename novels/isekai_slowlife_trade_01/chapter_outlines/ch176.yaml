chapter_n: 176
overall: 'chapter_176, act=3

  차하린은 이계의 거래를 통해 얻은 힘을 이용해 현실 세계의 근원적 질서를 재편하기 시작했다. 이제 그는 단순'
beats:
- name: intro
  instruction: '이 부분은 회차 시작. 분량 1,800자 이상.

    - 주인공 차하린의 현재 상태 묘사: 이계의 거래를 통해 얻은 힘으로 현실 세계의 근원적 질서를 재편하기 시작하는 과정의 지루함과 건조함.

    - 핵심 공간 묘사: 차하린의 방. 이계의 에너지가 현실에 스며들면서 발생하는 미세한 물리적 변화(빛의 왜곡, 공기의 미세한 진동 등)를 시각적,
    촉각적으로 묘사.

    - 첫 인물 등장 + 호칭: 이계의 거래를 돕는 조력자(혹은 관찰자)의 등장. 차하린에게 직접적인 지시나 관찰을 제공하는 인물. (호칭은 ''그'',
    ''당신'' 등 간접적 표현 사용).

    - 시각·후각·청각·촉각 묘사 포인트: 차분하고 건조한 분위기 속에서 이계의 에너지가 발산되는 미세한 소음, 미세한 온도 변화, 손끝에 느껴지는
    끈적한 감각 등을 세밀하게 묘사.

    - 대사 1~3개: 거래 과정의 건조한 대화. 감정 배제된 정보 전달.

    - 마지막 줄: 현실의 법칙에 균열이 발생하고 차하린의 잠재력이 폭발하기 직전의 미세한 불안감.'
- name: development
  instruction: '이 부분은 회차 중반. 분량 1,800자 이상.

    - 핵심 사건 발생: 차하린이 얻은 힘을 현실 세계의 근원적 질서에 직접 적용하려 시도하는 구체적인 시도와 그 과정에서 발생하는 물리적 부작용.

    - 신체 감각 묘사: 힘을 사용할 때 느껴지는 육체적인 고통이나 둔감함, 이계의 힘과 현실의 법칙이 충돌하며 발생하는 내부적인 충돌의 감각을
    상세히 묘사.

    - 내적 독백: 현실의 법칙이 무너지고 이계의 질서가 침범하는 것에 대한 차하린의 냉소적인 관찰과 내적 갈등.

    - 새 정보 발견: 힘의 사용에 대한 새로운 규칙이나 이계의 질서가 차하린에게 부과하는 새로운 제약 조건에 대한 정보. 이는 차하린이 예상치
    못한 방향으로 힘을 사용하게 만든다.

    - 마지막 줄: 현실의 질서가 더욱 격렬하게 흔들리며 다음 단계의 폭발을 예고하는 긴장감.'
- name: climax
  instruction: '이 부분은 회차 마지막. 분량 1,800자 이상.

    - 결정적 장면: 차하린이 이계의 근원적 질서를 파괴하고 현실의 경계를 무너뜨리는 최종 각성 순간. 단순한 힘의 사용을 넘어선 존재론적 변화.

    - 감정 정점: 통제 불능 상태에 빠지면서도 이를 수용하는 차하린의 차분하고 건조한 승화의 감정. 모든 물리적 감각이 극단적으로 증폭되는 순간.

    - 최종 연출: 현실과 이계의 경계가 소멸하며 차하린이 새로운 차원의 존재로 각성하는 순간을 시각적으로 압도적으로 묘사.

    - 마지막 문장: 현실의 모든 것이 재정의되고 차하린이 이계의 근원적 진실을 파악하고 새로운 차원의 존재로 각성하는 순간을 강렬하게 마무리하며
    다음 화로 넘기는 클리프행어.'
