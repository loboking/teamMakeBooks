chapter_n: 178
overall: 'chapter_178, act=3

  차하린은 현실의 질서를 재편하는 과정에서 이계의 근원적인 오류들을 마주했다. 단순한 거래를 넘어'
beats:
- name: intro
  instruction: '이 부분은 차하린이 현실의 질서를 재편하는 과정에서 이계의 근원적인 오류들을 마주하는 시작점. 분량 1,800자 이상.

    - 차하린의 내면 톤: 건조하고 관찰적인 슬로우라이프 분위기.

    - 핵심 공간 묘사: 현실 세계의 고요함과 이계의 오류가 혼재된 공간 묘사 (시각 2 + 청각 1).

    - 핵심 사건 1: 차하린이 이계의 근원적 오류(논리적 모순)를 관찰하며 현실의 질서를 재편하려는 시도.

    - 핵심 사건 2: 이계의 거래가 단순한 물물교환이 아닌, 현실 법칙에 대한 미세한 균열을 일으킨다는 것을 인지.

    - 등장 인물 + 첫 호명: 아무도 없음. 차하린의 내면 독백 위주.

    - 시각·후각·청각·촉각 묘사 포인트: 미세한 공기의 떨림, 낡은 책상 표면의 질감, 희미한 이계의 잔향.

    - 대사 1~3개: 차하린의 건조한 독백.

    - 마지막 줄: 이계의 오류가 현실에 스며들고, 차하린의 잠재력이 폭발하기 직전의 미세한 균열이 감지된다.'
- name: development
  instruction: '이 부분은 차하린이 이계의 근원적 오류들을 실제로 경험하며 힘을 확장하고 현실 세계에 영향을 미치기 시작하는 과정. 분량
    1,800자 이상.

    - 핵심 사건 1: 차하린이 이계의 오류를 직접 조작하여 현실의 법칙에 대한 실험을 수행하며 물리적/논리적 충돌을 경험.

    - 핵심 사건 2: 이계의 에너지가 차하린에게 흡수되어 신체적 변화(각성)가 시작되는 과정의 섬세한 묘사.

    - 등장 인물 + 첫 호명: 이계의 오류 자체를 관찰하는 차하린의 시점.

    - 시각·후각·청각·촉각 묘사 포인트: 각성 과정에서 발생하는 내부의 압력, 피부를 타고 흐르는 이계 에너지의 질감, 주변 공간이 일그러지는
    시각적 효과.

    - 대사 1~3개: 차하린의 감정 없는 반응이나 시스템 메시지.

    - 마지막 줄: 이계의 오류가 차하린의 의식 깊숙이 침투하며, 현실의 경계가 완전히 무너지는 임계점에 도달한다.'
- name: climax
  instruction: '이 부분은 차하린이 이계의 근원적 질서를 파괴하고 현실의 경계를 무너뜨리는 최종 각성 순간. 분량 1,800자 이상.

    - 핵심 사건 1: 차하린이 이계의 근원적 질서에 직접 개입하여 오류를 파괴하는 최종 행동.

    - 핵심 사건 2: 현실과 이계의 경계를 완전히 허물고, 차하린이 새로운 차원의 존재로 거듭나는 파괴적인 각성 순간의 묘사.

    - 등장 인물 + 첫 호명: 차하린. (내적 존재의 격돌). 이계의 근원적 힘.

    - 시각·후각·청각·촉각 묘사 포인트: 빛과 어둠의 충돌, 존재 자체가 해체되고 재구성되는 극도의 시각적 혼란, 무한한 공간의 폭발적인 소리.

    - 대사 1~3개: 차하린의 내면에서 터져 나오는 존재론적 외침.

    - 마지막 줄: 차하린이 이계의 근원을 파괴하고 현실의 경계를 완전히 무너뜨리며, 새로운 차원의 존재로 각성하는 순간, 모든 것이 재정의된다.'
