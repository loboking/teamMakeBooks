- name: intro
  instruction: '비트 도입 — 회차 시작부 (분량 1,200자+, 한국 웹소설 톤)


    이 회차 줄거리:

    chapter_n=190, act=3

    차하린은 현실과 이계의 연결고리가 발현되는 근원을 향해 더욱 깊이 파고들었다. 물리적 균열이나 에너지 흐름을 넘어, 그는 이계의 질서가 현실에
    투영되는 근본적인 법칙 자체에 직접 접근했다. 그곳은 혼돈과 논리가 뒤섞인 차원의 경계였으며,


    위 줄거리를 한국 웹소설 톤으로 본문 1,200자+ 작성. 직전 비트와 사건 중복 금지. 시각·청각·촉각 묘사 포함. 대사 1~2개.'
