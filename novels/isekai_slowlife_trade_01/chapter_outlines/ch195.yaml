chapter_n: 195
overall: 차하린은 조작된 미세한 차이가 현실에 미치는 장기적인 영향을 관찰했다. 며칠간의 고요한 관찰 끝에, 그는 자신이 의도치 않게 만들어낸
  세계의 아주 작은 균열이 점
beats:
- name: intro
  instruction: '이 부분은 회차 시작. 분량 1,800자 이상.

    - 주인공의 자조/일상 톤 1줄로 시작하며, 관찰자의 건조한 시선을 유지한다.

    - 핵심 공간 묘사 (시각 2 + 후각/청각 1): 차하린이 고요함 속에서 미세한 균열을 관찰하는 환경 묘사. 현실과 이계의 경계가 시각적으로
    어떻게 왜곡되는지 묘사.

    - 첫 인물 등장 + 호칭("이준 씨" 등): 이계의 존재가 등장하여 차하린의 관찰에 대해 언급하며 현실의 비논리성을 지적한다.

    - 짧은 대사 1~2개: 이계의 존재의 태도와 차하린의 반응을 건조하게 표현한다.

    - 마지막 줄: 다음 비트로 넘기는 미세한 위기 신호, 자신이 만든 균열의 진행 상황에 대한 불안감.'
- name: development
  instruction: '이 부분은 회차 중반. 분량 1,800자 이상.

    - 핵심 사건 발생 (동작 단위 묘사): 차하린이 의도치 않게 만들어낸 세계의 균열이 물리적으로 확장되는 과정을 상세히 묘사한다. 이계의 물질이
    현실 세계로 침투하며 일으키는 물리적 충격과 이계의 법칙이 현실에 미치는 영향을 상세히 서술한다.

    - 통증/충격 등 신체 감각: 차하린이 이계의 에너지에 노출될 때 발생하는 미세한 신체적 고통이나 감각의 왜곡을 묘사한다.

    - 내적 독백 1~2줄: 현실의 법칙이 무너지고 자신이 통제할 수 없다는 것에 대한 냉소적인 인식.

    - 새 정보 발견 (단서/메모/시스템 메시지): 균열의 진행 속도에 대한 구체적인 수치나, 이계의 에너지 흐름에 대한 새로운 이해를 얻는다.'
- name: climax
  instruction: '이 부분은 회차 마지막. 분량 1,800자 이상.

    - 결정적 장면 (시스템 창 등 핵심 연출): 차하린이 이계의 거래를 통해 얻은 힘이 현실의 법칙에 직접적으로 작용하는 결정적인 순간을 연출한다.
    이계의 질서가 현실을 침범하는 최종적인 폭발 순간을 시각적으로 강렬하게 묘사한다.

    - 감정 정점: 통제 불가능한 힘에 대한 냉소와 함께, 자신이 이 모든 것을 주도하고 있다는 오만함이 교차하는 감정을 극대화한다.

    - 마지막 문장: 다음 화로 넘기는 강한 후크/클리프행어. 현실과 이계의 경계가 완전히 파괴되며 차하린이 새로운 차원의 존재로 각성하는 순간의
    묘사를 압도적인 스케일로 마무리하며, 이계의 근원적 진실을 파악하고 현실과 이계의 경계를 초월하여 새로운 차원의 존재로 각성하는 순간을 강렬하게
    묘사하며 마무리한다.'
