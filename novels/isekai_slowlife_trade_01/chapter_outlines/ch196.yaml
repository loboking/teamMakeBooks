chapter_n: 196
overall: 'chapter_196, act=3

  차하린은 이계의 거래를 통해 얻은 힘이 단순히 현실에 영향을 미치는 것을 넘어, 이계의 근원적 질서를 흔들고 있'
beats:
- name: intro
  instruction: "이 부분은 차하린이 이계의 거래를 통해 얻은 힘이 현실과 이계의 연결고리를 넘어 이계의 근원적 질서를 흔들고 있음을 인지하는\
    \ 장면을 다룬다. 분량 1,800자 이상.\n- 핵심 사건 1~3개: 차하린이 이계의 물질을 현실에 투사하며 이계의 질서에 미세한 균열이\
    \ 발생하는 과정을 관찰하고, 그 균열을 통해 새로운 힘의 형태를 경험한다. 이계의 거래가 단순한 물물교환이 아닌, 현실의 법칙을 침식하는\
    \ 행위임을 깨닫는다.\n- 등장 인물 + 첫 호명: 차하린 (독백 중심), 이계의 잔재 (구체적 인물 언급 없이 현상으로 묘사). \n-\
    \ 시각·후각·청각·촉각 묘사 포인트: 현실 공간의 미세한 왜곡, 이계 물질에서 발산되는 비정상적인 온도와 냄새, 손끝이 닿는 현실의 질감의\
    \ 변화.\n- 대사 1~3개:"
- name: development
  instruction: "이 부분은 차하린이 이계의 힘의 확장을 시도하며 이계의 거대 세력의 감시망에 포착되는 과정과 대립하는 장면을 다룬다.\
    \ 힘의 폭주로 인해 현실 세계에 실질적인 영향을 미치기 시작하고, 이계의 질서가 격렬하게 흔들리는 과정을 묘사한다. 분량 1,800자 이상.\n\
    - 핵심 사건 1~3개: 차하린의 힘이 폭발적으로 확장되어 현실 세계에 물리적인 영향을 미치기 시작함. 이계의 거대 세력이 차하린의 움직임을\
    \ 감지하고 개입하려 함. 차하린이 이계의 힘을 통제하려 필사적으로 노력하지만, 통제가 불가능해지는 순간.\n- 등장 인물 + 첫 호명: 차하린,\
    \ 이계의 그림자 (감시자). \n- 시각·후각·청각·촉각 묘사 포인트: 주변 공간의 빛과 그림자의 왜곡, 공기의 압력 변화, 심장 박동의\
    \ 격렬함, 이계의 에너지 충돌에서 발생하는 섬광과 소음.\n- 대사 1~3개:"
- name: climax
  instruction: "이 부분은 차하린이 이계의 근원적 질서를 파괴하고 현실의 경계를 무너뜨리는 최종 각성 순간을 다룬다. 차하린이 이계의\
    \ 존재 자체를 초월하여 현실을 지배하는 존재로 거듭나는 결정적인 순간을 묘사한다. 이계의 모든 질서가 붕괴하는 폭발적인 순간을 극적으로 연출한다.\
    \ 분량 1,800자 이상.\n- 핵심 사건 1~3개: 차하린이 이계의 근원적 질서를 파괴하는 행위. 현실과 이계의 경계가 완전히 무너지는\
    \ 순간. 차하린이 이계의 존재 자체를 초월하여 새로운 차원의 존재로 각성함. 현실의 법칙이 재정의되는 파국적인 순간.\n- 등장 인물 +\
    \ 첫 호명: 차하린 (최종 각성). \n- 시각·후각·청각·촉각 묘사 포인트: 공간 자체가 해체되고 재조립되는 시각적 경험, 무한한 에너지의\
    \ 폭발, 존재론적 공포와 환희의 혼재, 모든 감각이 한계치를 넘어 터져나가는 경험.\n- 대사 1~3개:"
