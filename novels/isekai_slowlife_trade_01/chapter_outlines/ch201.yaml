chapter_n: 201
overall: 'chapter_n=201, act=3

  차하린은 이계의 질서를 파괴하기 위해 마지막 선택을 한다. 그는 더 이상 이계'
beats:
- name: intro
  instruction: '이 부분은 차하린이 이계의 질서를 파괴하기 위해 마지막 선택을 하는 순간의 고독하고 건조한 심리 묘사로 시작한다. 분량
    1,800자 이상.

    - 핵심 사건 1~3개: 차하린이 이계의 거래를 통해 획득한 힘이 현실 세계에 미치는 파괴적인 영향을 관찰하고, 이를 통제하려는 마지막 시도를
    하는 과정. 이계의 존재들이 차하린에게 던지는 최종적인 시험이나 경고.

    - 등장 인물 + 첫 호명: 차하린 (혼자), 이계의 존재들 (호칭 생략 또는 시스템적 묘사).

    - 시각·후각·청각·촉각 묘사 포인트: 현실 공간의 미세한 왜곡, 차하린의 피부에 흐르는 이계 에너지의 온도감, 주변 공기의 둔탁한 울림.

    - 대사 1~3개: 차하린의 건조하고 냉소적인 독백, 이계 존재들의 무미건조한 경고. (예: "이건 끝이다.", "너는 이제 선택해야 한다.")

    - 마지막 줄: 현실과 이계의 경계가 완전히 붕괴되기 직전, 차하린이 이계의 근원적 질서를 파괴하려는 의지가 폭발하는 찰나의 긴장감으로 마무리.'
- name: development
  instruction: '이 부분은 차하린이 이계의 질서를 파괴하기 위한 행동을 실행하는 과정과 그 과정에서 발생하는 내적, 외적 충돌을 묘사한다.
    분량 1,800자 이상.

    - 핵심 사건 1~3개: 차하린이 이계의 힘을 현실에 강제로 주입하여 현실의 법칙을 파괴하려는 직접적인 행동. 이계의 거대 세력과의 충돌 및
    그로 인한 에너지의 역류 현상. 차하린의 신체가 이계의 힘에 의해 극심한 고통과 변형을 겪는 과정.

    - 등장 인물 + 첫 호명: 차하린 (행동), 이계의 군주 또는 대리인 (대립적 존재).

    - 시각·후각·청각·촉각 묘사 포인트: 폭발적인 에너지의 시각화, 차하린의 신경계가 과부하되어 발생하는 극심한 통증, 주변 환경이 부서지는
    소리, 이계 에너지의 불쾌한 촉감.

    - 대사 1~3개: 차하린의 고통에 대한 무감각한 반응, 이계 존재의 분노에 찬 외침. (예: "고통을 느껴라.", "네 존재를 재정의하겠다.")

    - 마지막 줄: 현실의 물리 법칙이 완전히 무너지고, 차하린의 의지가 이계의 근원과 결합하며 새로운 차원의 존재로 폭발적으로 각성하는 순간의
    섬광.'
- name: climax
  instruction: '이 부분은 차하린이 이계의 근원적 진실을 파악하고 현실과 이계의 경계를 완전히 허물며 최종적인 승화를 이루는 순간을 묘사한다.
    분량 1,800자 이상.

    - 핵심 사건 1~3개: 차하린이 이계의 근원적 질서를 파괴하고 현실의 경계를 무너뜨리는 최종 각성 순간. 이계의 질서 파괴를 통해 현실의
    모든 제약이 소멸되는 순간. 차하린이 현실을 초월하는 존재로 거듭나는 최종적인 변형.

    - 등장 인물 + 첫 호명: 차하린 (최종 각성), 이계의 근원 (궁극적 존재).

    - 시각·후각·청각·촉각 묘사 포인트: 차원 간의 빛의 폭발, 현실 공간이 무한대로 확장되는 시각적 경험, 시간과 공간의 개념이 소멸하는 촉각적
    경험, 절대적인 평온함과 혼돈의 공존.

    - 대사 1~3개: 차하린의 최종적인 선언, 이계의 질서가 해체되는 소리, 모든 존재의 소멸에 대한 무감각한 수용. (예: "나는 이제 모든
    것이다.", "경계는 없다.")

    - 마지막 줄: 차하린이 이계의 근원적 진실을 파악하고 현실과 이계의 경계를 초월하여 새로운 차원의 존재로 각성하며 이야기가 완결되는 최종적인
    절대적 존재의 상태로 마무리.'
