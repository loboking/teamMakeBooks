chapter_n: 220
overall: 차하린은 이계의 힘을 현실에 투영하는 실험을 계속했다. 그는 자신이 구축한 경계의 균열을 통해 미세한 변화를 유도했고, 그 결과는
  예상보다 훨씬 섬세하고 조용했다. 거대한 파괴가 아닌, 주변의 시간 흐름과 물질의
beats:
- name: intro
  instruction: '이 부분은 회차 시작. 분량 1,800자 이상.

    - 주인공의 자조/일상 톤 1줄로 시작 (슬로우라이프의 안락함과 미세한 실험의 긴장감)

    - 핵심 공간 묘사 (시각 2 + 후각/청각 1) — 차하린의 작업 공간과 이계의 연결 장치 주변의 미세한 변화를 건조하게 묘사.

    - 실험의 결과에 대한 냉소적인 분석과, 거대한 파괴가 아닌 ''섬세하고 조용한'' 변화에 대한 주인공의 감각적 묘사.

    - 등장 인물 + 첫 호명("차하린" 또는 주변 환경에 대한 인식).

    - 시각·후각·청각·촉각 묘사 포인트: 미세한 공기의 진동, 금속의 미세한 떨림, 희미한 이계의 냄새.

    - 대사 1~3개 (감정 배제된 건조한 서술).

    - 마지막 줄: 다음 비트로 넘기는 미세한 위기 신호. (실험이 의도치 않은 결과를 낳았음을 암시)'
- name: development
  instruction: '이 부분은 회차 중반. 분량 1,800자 이상.

    - 핵심 사건 발생 (동작 단위 묘사) — 경계의 균열을 통해 시간 흐름과 물질의 변화를 유도하는 과정의 구체적인 과정 묘사.

    - 신체 감각 묘사: 차하린이 느끼는 미세한 압력 변화, 신경계가 받아들이는 이계 에너지의 흐름.

    - 내적 독백 1~2줄 (이 변화가 통제 범위를 벗어났다는 자각).

    - 새 정보 발견 (단서/메모/시스템 메시지) — 유도한 변화의 정도를 수치화하는 미세한 시스템 데이터의 변화.

    - 등장 인물 + 첫 호명("차하린" 또는 관찰 대상).

    - 시각·후각·청각·촉각 묘사 포인트: 균열 주변의 공간이 왜곡되는 시각적 효과, 물질이 미세하게 재배열되는 촉각적 느낌, 이계 에너지의 미세한
    진동 소리.

    - 대사 1~3개 (실험 과정에 대한 건조한 설명).

    - 마지막 줄: 다음 비트로 넘기는 강한 클라이맥스. (통제 불가능한 현상이 폭발 직전에 도달했음을 암시)'
- name: climax
  instruction: '이 부분은 회차 마지막. 분량 1,800자 이상.

    - 결정적 장면 (시스템 창 등 핵심 연출) — 실험의 통제 불가능한 순간, 미세한 변화가 폭발하며 현실의 법칙에 균열이 발생하는 순간의 묘사.

    - 감정 정점: 실험자가 느끼는 냉소와 함께 예측 불가능한 힘에 대한 경악.

    - 최종 각성 순간 묘사: 이계의 질서가 현실의 경계를 무너뜨리는 물리적 현상.

    - 마지막 문장: 차하린이 이계의 근원적 진실을 파악하고 현실과 이계의 경계를 초월하여 새로운 차원의 존재로 각성하는 순간의 강렬한 이미지로
    마무리하며 다음 화로 넘기는 클리프행어.'
