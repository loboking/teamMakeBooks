chapter_n: 1
overall: |
  강이준이 만년 F급 짐꾼으로 D급 던전 임무에 투입됨. 동료들이 외곽에서 보스를 잡는 동안 후방에서
  짐을 끌다 천장 붕괴로 던전 심층부에 추락. 동료들은 그를 죽었다 여기고 떠남. 어둠 속에서 깨어난
  강이준 앞에 푸른 시스템 창이 떠오름 — 진명 시스템 각성. 첫 퀘스트 "이 던전에서 살아 나가라"를
  받고 던전 깊숙이 발걸음. 멀리서 들려오는 발소리, 점점 가까워지는 거대한 무언가의 윤곽이 어둠
  속에서 드러나기 직전에서 끝나는 강렬한 클리프행어.

beats:
  - name: intro
    instruction: |
      이 부분은 1화의 시작. 분량 1,800자 이상.
      - 강이준의 만년 F급 짐꾼 자조 (한국 웹소설식 자조 톤)
      - D급 던전 임무 출발 (길드 사무실 → 던전 입구)
      - 박세린과의 짧은 대화 (그녀의 차가움 + 강이준의 인내) — 세린이 그를 "이준 씨"라고 부름
      - 던전 진입과 어두운 분위기 (시각/후각/청각 묘사)
      - 동료들이 외곽으로 향하고 강이준만 후방에서 짐 끄는 외로운 장면
      - 마지막 줄: 천장 위에서 미세한 균열 소리가 들려오는 위기의 시작

  - name: awakening
    instruction: |
      이 부분은 1화의 중반. 분량 1,800자 이상.
      - 천장 붕괴와 강이준의 추락 (시각/청각/통증 강하게)
      - 의식 잃음 (어둠 묘사)
      - 깨어남 (호흡, 통증, 입안의 피, 부서진 장비)
      - 동료들이 죽었다 여기고 떠난 흔적 (희미한 외침, 멀어지는 발자국)
      - 절망감 묘사
      - 갑자기 푸른 시스템 창이 눈앞에 떠오름
      - 첫 메시지: "당신은 [진명 시스템]을 각성하셨습니다."
      - 강이준의 충격과 혼란, 시스템 창을 손으로 휘저어 보는 묘사

  - name: climax
    instruction: |
      이 부분은 1화의 마지막. 분량 1,800자 이상.
      - 시스템 창 탐색 (스탯창 LV1 / HP / MP / STR / DEX 등 빈 능력치)
      - 인벤토리 (텅 빈 슬롯들)
      - 스킬창 (잠긴 스킬들, 물음표)
      - 첫 퀘스트 알림: [퀘스트: 이 던전에서 살아 나가라 / 보상: 시스템 재화 1,000, 경험치 500 / 조건: 던전의 깊은 곳에서 생존]
      - 강이준이 무거운 몸을 일으키며 결심하는 내적 독백
      - 던전 심층부로 한 걸음씩 이동 (어둠 묘사)
      - 멀리서 긁는 소리, 둔탁한 발소리
      - 점점 가까워지는 무언가
      - 마지막 문장: 어둠 속에서 거대한 무언가의 윤곽이 드러나기 직전 강렬한 클리프행어
