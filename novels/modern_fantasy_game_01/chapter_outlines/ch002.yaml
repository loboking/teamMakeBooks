chapter_n: 2
overall: |
  강이준이 던전 심층부에서 1화 클리프행어의 정체를 마주한다. D급 잡몹 [어둠쥐]. 진명 시스템이 위치·약점을
  표시. 짐꾼 가방 속 체인을 즉흥 무기 삼아 첫 처치. 첫 시스템 보상(경험치·재화). 더 깊은 곳으로 발걸음.
  여러 쌍의 붉은 눈동자가 어둠 속에서 그를 응시하는 클리프행어.

beats:
  - name: encounter
    instruction: |
      이 부분은 2화의 시작. 분량 1,800자 이상.
      - 1화 클리프행어의 윤곽이 점차 드러남. 거대한 쥐 형태의 D급 잡몹 [어둠쥐] — 송아지만 한 덩치.
      - 강이준 공포. 도망갈 곳 없음.
      - 시스템 창 활성화. [위협: D급 어둠쥐 1체 / 거리 8m / 약점: 목 측면].
      - 강이준이 처음으로 시스템의 정보 가치를 깨달음.
      - 마지막 줄: 어둠쥐가 그를 향해 도약.

  - name: first_kill
    instruction: |
      이 부분은 2화의 중반. 분량 1,800자 이상.
      - 짐꾼 가방에서 체인을 빼들어 즉흥 무기. 회피 + 체인 휘두름.
      - 첫 공격 빗나감. 어깨에 발톱 자국. 통증·공포.
      - 시스템 추천 [약점 측면 공략] 표시.
      - 두 번째 시도. 목 측면 명중. 어둠쥐 비명.
      - 세 번째 결정타. 처치.
      - 알림: [경험치 +50, 시스템 재화 +100, 레벨 1 → 1 (다음 레벨까지 50)].
      - 강이준의 떨리는 손. 처음으로 무언가를 죽인 충격.

  - name: deeper_threat
    instruction: |
      이 부분은 2화의 마지막. 분량 1,800자 이상.
      - 어둠쥐 시체 옆 짐꾼 가방 정리. 체인 다시 챙김.
      - 시스템 [현재 위치: 던전 심층부 -150m / 출구 정보 없음].
      - 가족(어머니·동생) 짧은 회상. 살아 돌아가야 한다는 결심.
      - 천천히 발걸음. 어둠 깊숙이.
      - 갑자기 시스템 [경고: 다수 적 감지 / 5체 이상 / 거리 30m].
      - 어둠 속에서 여러 쌍의 붉은 눈동자가 그를 응시.
      - 클리프행어: 그 눈동자들이 일제히 그를 향해 움직이기 시작.
