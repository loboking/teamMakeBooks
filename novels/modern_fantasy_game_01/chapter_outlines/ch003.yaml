chapter_n: 3
overall: |
  어둠쥐 무리(5체)와의 대규모 전투. 진명 시스템이 위협 우선순위·동선을 실시간 표시. 강이준이 처음으로 전술적
  사고를 한다. 마지막 한 마리 처치 후 레벨 2 도달. 첫 스킬 [생존 본능] 획득. 던전 심층부의 또 다른 입구
  발견. 그 너머에서 거대한 마나 파동을 시스템이 감지하는 클리프행어.

beats:
  - name: pack_battle
    instruction: |
      이 부분은 3화의 시작. 분량 1,800자 이상.
      - 5체 어둠쥐 무리의 협공.
      - 시스템 [위협 우선순위: 좌측 2체 → 우측 2체 → 후방 1체] 표시.
      - 좁은 통로로 유인하여 1대1 구도 강제. 강이준의 첫 전술.
      - 첫 마리 처치. 두 번째 처치 중 옆구리 부상.
      - 세 번째 어둠쥐가 도약하는 순간 시스템 경고.
      - 마지막 줄: 가까스로 회피, 벽에 부딪힘.

  - name: skill_unlock
    instruction: |
      이 부분은 3화의 중반. 분량 1,800자 이상.
      - 부상 + 체력 한계. 시스템 HP 30/100 경고.
      - 의지로 일어섬. 남은 두 마리 마지막 결투.
      - 처치 직전 시스템 알림 [레벨 2 도달 / 첫 스킬 해금: 생존 본능].
      - [생존 본능: 죽음 직전 1회, 모든 감각 30초 강화. 쿨타임 24시간].
      - 스킬 자동 발동. 모든 소리·냄새·잔상이 선명해짐.
      - 마지막 어둠쥐의 빈틈 정확히 보임. 즉살.
      - 강이준 무릎 꿇고 거친 숨. 살아남았다.

  - name: deeper_passage
    instruction: |
      이 부분은 3화의 마지막. 분량 1,800자 이상.
      - 시체 옆 휴식. 시스템 재화 누적 +500. 인벤토리에 [어둠쥐 가죽 ×3] 자동 수집.
      - 통로 벽을 더듬으며 출구를 찾던 중, 숨겨진 입구 발견. 봉인된 듯 마나가 새어나옴.
      - 시스템 [경고: 미지의 거대 마나 파동 / 등급 측정 불가 / 거리 100m].
      - "이건 D급 던전이 아니야." 강이준 중얼거림.
      - 입구 손가락 터치. 마나가 손끝을 핥는 듯한 감각.
      - 클리프행어: 입구 너머 깊은 곳에서 무언가가 천천히 깨어나는 듯한 거대한 숨소리.
