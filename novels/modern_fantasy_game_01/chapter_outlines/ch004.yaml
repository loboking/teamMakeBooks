chapter_n: 4
overall: |
  봉인된 입구를 열지 말지 망설이던 강이준. 시스템이 [숨겨진 퀘스트: 봉인 너머의 진실] 알림. 보상이 압도적이지만
  위험 등급 미공개. 결국 들어감. 거대한 공간 + 잠든 보스 (D~C급 사이). 첫 보스 전투 시작. 보스 첫 공격 회피
  성공. 시스템이 [약점 분석 중...] 표시되며 클리프행어.

beats:
  - name: hidden_quest
    instruction: |
      이 부분은 4화의 시작. 분량 1,800자 이상.
      - 봉인된 입구 앞에서 망설임. 가족 생각.
      - 출구 찾아 돌아갈 길 역시 찾기 어려움 — 던전이 그를 가뒀음.
      - 시스템 알림 [숨겨진 퀘스트: 봉인 너머의 진실 / 보상: 미공개(?) / 위험: 측정 불가].
      - 보상 ?표가 강이준의 호기심을 자극. 일반 시스템 보유자라면 절대 받을 수 없는 정보.
      - 결심 — 어차피 살 길은 앞이다.
      - 마지막 줄: 손바닥을 봉인 표면에 댐.

  - name: boss_room
    instruction: |
      이 부분은 4화의 중반. 분량 1,800자 이상.
      - 봉인이 푸른 빛을 띠며 갈라짐.
      - 거대한 공간. 천장이 보이지 않을 만큼 높음.
      - 중앙 거대한 그림자. 강이준의 키보다 다섯 배 큰 무언가가 잠들어 있음.
      - 시스템 [???급 미지의 보스 / 마나량: 강이준의 200배].
      - 강이준 발걸음을 멈춤. 도망갈 수 없음.
      - 보스가 천천히 눈을 뜸. 노란 눈동자 두 개.
      - 마지막 줄: "...누구냐."

  - name: first_strike
    instruction: |
      이 부분은 4화의 마지막. 분량 1,800자 이상.
      - 보스가 인간 언어를 사용. 강이준 충격.
      - 보스 첫 공격 — 거대한 발톱이 공기를 가름.
      - 강이준 스킬 [생존 본능] 자동 발동. 모든 것이 슬로우모션.
      - 가까스로 회피. 발톱이 옆 벽을 산산이 부숨.
      - 시스템 [약점 분석 중... 64% / 잠시 기다리시오].
      - 강이준 뒷걸음. 다음 공격까지 5초.
      - 마지막 줄: 보스가 거대한 입을 열어 푸른 마나를 모으기 시작. 강이준 시스템 [경고: 광역 공격 충전 중 / 회피 불가].
