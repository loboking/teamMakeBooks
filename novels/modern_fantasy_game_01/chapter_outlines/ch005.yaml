chapter_n: 5
overall: |
  보스의 광역 공격 직전, 진명 시스템이 [약점 분석 완료: 좌측 흉부 마나 코어]를 띄움. 강이준이 짐꾼 가방의
  마지막 도구 — 마정석 분쇄기 — 를 던져 마나 폭주를 유도. 보스 자폭으로 처치. 거대한 보상(레벨 2→5,
  희귀 스킬, 시스템 재화). 던전 출구 표시 활성화. 출구를 향해 뛰는 강이준의 그림자에서 끝나는 클리프행어.

beats:
  - name: boss_weakness
    instruction: |
      이 부분은 5화의 시작. 분량 1,800자 이상.
      - 보스의 광역 공격 충전 5초. 강이준 도망갈 곳 없음.
      - 시스템 [약점 분석 완료: 좌측 흉부 — 마나 코어 노출].
      - 강이준 짐꾼 가방을 뒤짐. 마정석 분쇄기 (D급 도구, 잘못 다루면 폭발) 발견.
      - 결심 — 분쇄기를 보스의 마나 코어에 던져 마나 폭주 유도.
      - 마지막 줄: 강이준이 분쇄기를 들고 보스를 향해 달림.

  - name: explosion
    instruction: |
      이 부분은 5화의 중반. 분량 1,800자 이상.
      - 강이준의 전력 질주. 보스의 입에서 광역 마나 폭발 직전.
      - 분쇄기를 보스의 좌측 흉부에 정확히 던짐.
      - 마정석이 마나 코어와 충돌. 코어 자체가 폭발.
      - 보스의 광역 공격이 자기 몸을 파괴. 거대한 굉음.
      - 충격파가 강이준을 벽까지 날림. 의식 잃기 직전.
      - 시스템 알림 [???급 미지의 보스 처치 / 보상 분배 중...].
      - 마지막 줄: 강이준 의식 흐려짐.

  - name: massive_reward
    instruction: |
      이 부분은 5화의 마지막. 분량 1,800자 이상.
      - 강이준 깨어남. 보스 시체는 사라지고 거대한 마나 결정만 남음.
      - 시스템 [레벨 2 → 5 / 시스템 재화 +50,000 / 희귀 스킬 [마나 감지] 획득 / 보상 [???]].
      - 마나 감지 자동 활성. 던전 전체가 그의 머릿속에 지도처럼 펼쳐짐.
      - 출구가 표시됨 — 위쪽 200m.
      - 강이준 일어섬. 짐꾼 가방을 다시 멤. 무거웠던 가방이 이상하게 가벼움.
      - 출구 향해 발걸음.
      - 마지막 줄: 그의 그림자가 어둠 속에서 길게 늘어진다. 위로 한 걸음씩. 햇빛이 점점 가까워진다.
