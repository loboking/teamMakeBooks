chapter_n: 6
overall: |
  강이준이 던전 출구로 나옴. 길드원들은 이미 떠난 줄. 그러나 박세린만 입구 근처에 남아 있다. 그를 보고
  잠긴 목소리로 "이준 씨…". 그녀의 눈가에 슬퍼한 흔적. 강이준은 능력 숨기기로 결심하고, 그저 운 좋게
  살아남았다고 둘러댄다. 박세린의 차가운 의심 어린 눈빛. 거대 길드 백화의 회장(이름만)이 이 던전 사고를
  보고받고 미간을 찌푸리는 인서트로 끝나는 클리프행어.

beats:
  - name: exit_reunion
    instruction: |
      이 부분은 6화의 시작. 분량 1,800자 이상.
      - 던전 입구. 강이준이 천천히 빛 속으로 걸어 나옴.
      - 길드원들의 차량은 떠나고 없음. 그러나 한 사람.
      - 박세린이 단검 두 자루를 양손에 든 채 입구 근처 바위에 앉아 있다.
      - 그를 보고 일어섬. 그녀의 눈빛이 — 처음으로 — 흔들림.
      - "이준 씨…"
      - 그녀의 목소리는 잠겨 있다. 평소와 다르다.
      - 마지막 줄: 강이준은 그녀의 눈가에 마른 눈물 자국을 본다.

  - name: hide_power
    instruction: |
      이 부분은 6화의 중반. 분량 1,800자 이상.
      - 박세린: "다른 헌터들은 다 갔어요. 시신이라도 찾으려고 길드장이 회수팀 부르려던 참이었어."
      - 그녀의 차가운 어조는 그대로지만, 그 안에 놀라움.
      - 강이준 결심. 능력은 숨긴다.
      - 둘러대기 — "운이 좋았어요. 잡몹이 없는 빈 통로가 있어서 거기서 며칠 버티다가."
      - 박세린의 눈동자가 그를 위아래로 훑음. 짐꾼 가방의 흠집, 어깨의 발톱 자국, 몸에 남은 마나 잔향.
      - 그녀: "…며칠 만에. 짐꾼이."
      - 강이준 시선 회피. 짧게 끄덕임.

  - name: chairman_insert
    instruction: |
      이 부분은 6화의 마지막. 분량 1,800자 이상.
      - 박세린의 차로 길드 복귀. 차 안에서 둘은 침묵.
      - 길드 도착. 김태석 길드장이 강이준을 보고 입을 다물지 못함.
      - 강이준은 만년 F급 짐꾼처럼 행세. 보고서 쓰고 퇴근.
      - [장면 전환] 거대 길드 백화 본부.
      - 회장의 책상 위 던전 사고 보고서. "철혈 길드 / 짐꾼 강이준 / 사망 추정 → 생존 귀환."
      - 회장(이름은 '한도혁'으로만 처음 노출)이 미간을 찌푸림. 비서를 부름.
      - 회장: "철혈에 흥미로운 변수가 생겼군. 좀 더 지켜보지."
      - 마지막 줄: 회장의 손가락이 보고서의 '강이준' 이름을 천천히 두드림.
