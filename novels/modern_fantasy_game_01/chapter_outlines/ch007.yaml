chapter_n: 7
overall: |
  강이준이 집으로 귀가. 병든 어머니와 동생 이서가 그를 맞이한다. 가족의 따뜻함과 가난의 무게가 동시에
  드러난다. 밤. 자기 방에서 시스템 창을 다시 열어본다. 레벨 5의 위력을 가늠한다. 다음 날 길드 출근.
  박세린이 그를 가만히 본다. 그녀의 눈빛이 '의심'으로 변해있다. 그녀의 한 마디 — "이준 씨, 잠깐
  얘기 좀." — 의 클리프행어.

beats:
  - name: home
    instruction: |
      이 부분은 7화의 시작. 분량 1,800자 이상.
      - 좁은 반지하 집. 어머니가 침대에 누워 약을 먹고 있다.
      - 강이준이 들어옴. 어머니: "아들… 무사했구나."
      - 동생 이서가 숙제하다 달려옴. "오빠!"
      - 강이준의 표정이 부드러워짐. 가족 앞에서만.
      - 짧은 저녁식사. 어머니의 약 비용 이야기. 이서의 학원 이야기.
      - 강이준 — 시스템 재화 50,000을 어떻게 현실 돈으로 바꿀지 고민 시작.
      - 마지막 줄: 식사 끝. 이서가 어머니 약을 챙기고 강이준은 자기 방으로.

  - name: system_review
    instruction: |
      이 부분은 7화의 중반. 분량 1,800자 이상.
      - 자기 방. 문 잠그고 시스템 창 열기.
      - 스탯창: 레벨 5, HP 250/250, MP 150/150, STR 25, DEX 30, INT 22, WIS 18, FAT 12.
      - 던전 사고 전 레벨 1 대비 5배. 그러나 표면 등급은 여전히 F.
      - 시스템 [표면 등급 위장 활성 — 헌터협회 측정기에 F급으로 표시됩니다].
      - 강이준 충격. 진명 시스템은 표면 등급까지 조작.
      - 인벤토리: 어둠쥐 가죽 ×3, 마나 결정 (보스 보상) ×1.
      - 시스템 [마나 결정을 시스템 재화로 환원하시겠습니까? 환원 시 +200,000 재화].
      - 마지막 줄: 강이준이 마나 결정을 본다. 어머니의 약값이 떠오른다.

  - name: serin_suspicion
    instruction: |
      이 부분은 7화의 마지막. 분량 1,800자 이상.
      - 다음 날. 길드 사무실. 평소대로 짐꾼 일.
      - 박세린이 옆 자리에 앉아 보고서를 작성하다, 잠시 손을 멈춘다.
      - 그녀가 강이준을 가만히 본다. 차가운 눈빛이 아니라 — 분석하는 눈빛.
      - 김태석 길드장이 회의실로 그녀를 부른다. 박세린이 일어섬.
      - 그녀가 강이준의 책상 옆을 지나치며 — 거의 들리지 않게 — 한 마디.
      - "이준 씨, 잠깐 얘기 좀."
      - 강이준 펜이 멈춤.
      - 그녀의 눈빛이 그를 잠시 응시. 그리고 회의실로.
      - 마지막 줄: 강이준의 손이 미세하게 떨림. "…올 게 왔구나."
