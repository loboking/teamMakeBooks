chapter_n: 8
overall: |
  박세린과의 비공식 면담. 그녀는 던전 사고 진상을 추궁하지 않고, 그저 한 마디 — "어떻게 살아왔는지는
  안 물어요. 다만 길드 안에서는 조심하세요." 강이준이 그녀의 의도를 천천히 이해한다. 박세린은 그를 보호하려
  한다. 한편 김태석 길드장이 백화 길드의 회유 제안서를 받았음을 강이준에게 슬쩍 흘림. 길드 위기 시작.

beats:
  - name: meeting
    instruction: |
      이 부분은 8화의 시작. 분량 1,800자 이상.
      - 길드 옥상. 박세린이 그를 부른 곳. 사람 없음.
      - 그녀가 단검을 빼서 손바닥에 가볍게 돌리며 운다.
      - "이준 씨, 솔직히 말해요. 짐꾼이 그 던전에서 며칠을 버틸 수 있을 거 같아요?"
      - 강이준 침묵.
      - 박세린이 짧게 한숨. "어떻게 살아왔는지는 안 물어요. 다만 — 길드 안에서는 조심하세요."
      - 강이준 그녀를 바라봄. 그녀의 의도 — 그를 추궁이 아니라 보호하려는 것.
      - "…고마워요. 세린 씨."
      - 박세린의 차가운 표정이 잠깐 부드러워짐. "동료니까."

  - name: guild_warning
    instruction: |
      이 부분은 8화의 중반. 분량 1,800자 이상.
      - 옥상에서 내려옴. 김태석 길드장 사무실.
      - 길드장이 강이준을 부름. 책상 위 두툼한 봉투.
      - 길드장: "백화에서 보낸 거야. 우리 길드를 흡수하겠다는."
      - 강이준 미간 찌푸림.
      - 길드장: "철혈은 30명이야. 백화는 1,000명. 거절하면 우리는 하루아침에 없어질 수도 있어."
      - 길드장: "…이준아. 너 같은 짐꾼한테 이런 말을 하긴 미안한데, 며칠 안에 결정해야 한다."
      - 강이준이 봉투를 본다. '한도혁'이라는 이름이 발신자란에.
      - 마지막 줄: 강이준의 머릿속에 6화 마지막 인서트가 떠오른다. 그 회장.

  - name: silent_decision
    instruction: |
      이 부분은 8화의 마지막. 분량 1,800자 이상.
      - 강이준 퇴근. 집으로 가는 길.
      - 시스템 창을 살짝 띄움. [레벨 5 / 마나 감지 활성화].
      - 거리에서 그를 미행하는 누군가의 마나 잔향이 감지됨. 두 명. 백화 소속 추정.
      - 강이준의 발걸음은 평소대로. 짐꾼처럼.
      - 그러나 머릿속은 빠르게 굴러간다.
      - 마음의 결정 — 길드를 지킨다. 능력은 그러나 끝까지 숨긴다.
      - 집 도착. 어머니가 잠들어 있음. 이서가 거실에서 책 읽음.
      - 강이준 자기 방. 시스템 창을 열고 본다. 첫 스킬 [생존 본능]과 [마나 감지].
      - 마지막 줄: "이걸로 어디까지 갈 수 있을까."
