chapter_n: 9
overall: |
  새 D급 던전 임무. 박세린·강이준·길드원 4명이 투입. 보스 처치 진행 중, 잡몹 무리가 갑자기 등장. 길드원
  중 한 명(김태석의 동생뻘 신참, 'D급 신민혁')이 함정에 빠져 위급. 박세린은 보스 잡느라 거리가 멂. 강이준이
  결단 — 능력 일부를 노출하더라도 신민혁을 구한다. 그가 시스템 [마나 감지]로 신민혁의 위치 파악, 짐꾼 도구로
  잡몹을 처리하는 모습을 박세린이 멀리서 본다. 그녀의 시선에서 끝나는 클리프행어.

beats:
  - name: dungeon_chaos
    instruction: |
      이 부분은 9화의 시작. 분량 1,800자 이상.
      - 새 D급 던전. 시야는 어둡고 좁음.
      - 박세린(B급)·신민혁(D급, 신참 23세)·강이준(F급 짐꾼)·길드원 둘.
      - 보스 추적. 보스가 미로형 던전을 활용, 길드원들이 분산됨.
      - 갑자기 천장에서 잡몹 무리(거미형)가 떨어짐. 신민혁이 함정에 걸려 거미줄에 묶임.
      - 박세린은 보스 추격 중. 거리 100m+.
      - 마지막 줄: 신민혁의 비명. 거미들이 그를 향해 달려듦.

  - name: rescue
    instruction: |
      이 부분은 9화의 중반. 분량 1,800자 이상.
      - 강이준의 짐꾼 위치는 신민혁과 가장 가까움. 30m.
      - 시스템 [마나 감지]로 거미들의 위치·약점 파악.
      - 짐꾼 가방의 사슬과 마나 분쇄기(소형)를 빼냄.
      - 두 가지 선택: ① 도망치고 신민혁 포기 (짐꾼답게) ② 능력 노출 위험 무릅쓰고 구하기.
      - 강이준 결심. "이런 게 짐꾼의 의무는 아니지만."
      - 거미 7체에 사슬을 휘두르며 진입. 약점 정확히 공격.
      - 짧은 시간 안에 5체 처치. 신민혁 거미줄을 잘라 풀어냄.
      - 마지막 줄: 신민혁이 비틀거리며 강이준을 본다. "어… 어떻게…"

  - name: serin_witnesses
    instruction: |
      이 부분은 9화의 마지막. 분량 1,800자 이상.
      - 남은 거미 2체 강이준에게 도약.
      - 시스템 [생존 본능] 자동 발동 임박.
      - 그러나 강이준이 그것을 거부 — 더 큰 능력 노출 회피.
      - 짐꾼 도구로만 처치. 마지막 한 마리는 사슬로 목 졸라 처치.
      - 신민혁: "선배… 선배 짐꾼 맞아요?"
      - 강이준이 일어섬. "그저 운이 좋았어. 신민혁아, 너 멀쩡해?"
      - 그러나 멀리서 — 보스 룸 입구에서 — 박세린이 모든 것을 보고 있었다. 단검 두 자루를 손에 든 채.
      - 그녀의 표정은 차갑지도, 동정적이지도 않다. 단지 — 확신.
      - 그녀의 시선이 강이준의 사슬·짐꾼 가방·죽은 거미들을 천천히 훑음.
      - 마지막 줄: 박세린의 입가에 미세한 미소. "…이제 더 못 숨겨요. 이준 씨."
