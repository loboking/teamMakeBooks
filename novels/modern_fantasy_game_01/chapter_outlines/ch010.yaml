chapter_n: 10
overall: |
  보스 처치 후 던전 탈출. 박세린이 강이준을 따로 부른다. 그녀는 추궁이 아니라 — 동맹을 제안한다.
  "이준 씨, 같이 가요. 길드 위기에 당신 능력이 필요해요." 강이준이 망설인다. 능력 노출 = 회장 표적화.
  결정 미루기. 그러나 그날 밤, 백화 길드 사람 두 명이 강이준의 집 근처를 배회한다. 시스템 [경고: 미행 다수].
  강이준의 결심이 굳어지는 클리프행어.

beats:
  - name: post_dungeon
    instruction: |
      이 부분은 10화의 시작. 분량 1,800자 이상.
      - 던전 출구. 길드원 5명 모두 무사 귀환.
      - 신민혁이 강이준 옆에 붙어 떨어지지 않음. "선배, 진짜 어떻게…"
      - 강이준은 묵묵히 짐을 들 뿐.
      - 박세린이 차에 짐을 실으며 강이준에게 짧게: "잠깐."
      - 둘이 길드 차량 옆 외곽으로 이동.
      - 박세린 단도직입: "당신, 진명 시스템이죠?"
      - 강이준 침묵.
      - 박세린: "내 가족 중 한 명이 진명 시스템 보유자였어요. 알아요."
      - 마지막 줄: 강이준이 그녀를 처음으로 똑바로 본다.

  - name: alliance
    instruction: |
      이 부분은 10화의 중반. 분량 1,800자 이상.
      - 박세린: "비밀은 지킬 수 있어요. 다만 — 같이 가요."
      - 그녀가 길드 위기 설명. 백화의 흡수 시도. 길드장이 며칠 안에 결정해야 함.
      - "당신 같은 능력이면 백화의 인질로 쓰여서는 안 돼요. 우리 편이 되어줘요."
      - 강이준 갈등. 능력 노출 = 회장의 표적화.
      - "…생각할 시간 좀 줘요."
      - 박세린 짧게 끄덕. "내일까지." 단검을 칼집에 넣고 등을 돌림.
      - 마지막 줄: 강이준이 차에 오른다. 그의 손이 시스템 창을 무의식적으로 띄움. [동맹 1: 박세린 / 신뢰도 67%].

  - name: surveillance
    instruction: |
      이 부분은 10화의 마지막. 분량 1,800자 이상.
      - 그날 밤. 강이준의 집.
      - 어머니의 약값을 위해 마나 결정을 시스템 재화로 환원하려던 차.
      - 시스템 [경고: 외부 미행 감지 / 거리 50m / 인원 2명 / 마나 잔향: B급 추정].
      - 강이준 창문 너머를 본다. 골목 모퉁이에 두 그림자.
      - 백화의 사람들. 회장이 보낸 감시.
      - 강이준 천천히 커튼을 친다. 어머니의 침대 옆 약병. 동생 이서의 공책.
      - 마음의 결정 — 박세린의 동맹 제안을 받아들인다.
      - 시스템 창에 새 메시지 [퀘스트 갱신: 길드 보호 + 동맹 1인 합류 / 보상: 미공개].
      - 강이준 짐꾼 가방을 다시 짐. 새벽이 오기 전 박세린에게 갈 것이다.
      - 마지막 줄: "회장님. 짐꾼은 짐꾼답지 않을 수도 있어요." 강이준이 어둠 속에서 미소짓는다.
