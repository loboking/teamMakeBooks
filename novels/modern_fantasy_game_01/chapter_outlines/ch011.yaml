chapter_n: 11
overall: |
  이준이 박세린에게 동맹 수락을 전한다. 새벽 공원에서의 첫 비밀 회의.
  세린이 이준의 능력 범위를 직접 확인하고, 두 사람은 향후 대책을 논의한다.
  시스템이 세린을 [동맹 1]로 공식 인식.

beats:
  - name: dawn_meeting
    instruction: |
      이 부분은 11화의 시작. 분량 1,800자 이상.
      - 새벽 5시. 이준이 박세린에게 문자를 보낸다. "받아들일게요."
      - 만남 장소: 길드 건물 근처 공원. 아직 사람이 없는 시간.
      - 박세린이 먼저 와 있었다. 단검은 없지만 경계하는 자세.
      - 이준이 도착. 두 사람이 마주 앉는다.
      - 박세린: "결정 빠르네요." 이준: "시간이 없어서요."
      - 박세린이 구체적인 상황 설명. 백화의 흡수 압박 타임라인.
      - "한도혁은 절대 당신 같은 변수를 놓치지 않아요. S급의 직감은 무서워요."
      - 마지막 줄: 이준이 세린에게 처음으로 자신의 능력을 일부 보여준다.

  - name: reveal_ability
    instruction: |
      이 부분은 11화의 중반. 분량 1,800자 이상.
      - 이준이 마나 감지를 설명. 반경 200m 내 마나 반응 감지.
      - 세린이 이해한다. "그래서 어제 백화 감시자를 미리 알았구나."
      - 이준: "레벨 5. 마나 감지. 생존 본능. 이 정도예요."
      - 세린이 놀란다. "보스 처치로 레벨 5? 그건 D급 헌터도 못 하는 건데."
      - 세린이 자신의 가족 이야기를 꺼낸다. 진명 시스템 보유자였던 사람.
      - "그 사람도 당신처럼 죽음 직전에 각성했어요. 하지만..."
      - 세린의 목소리가 잠긴다. 더 이상 말하지 않는다.
      - 마지막 줄: 이준은 세린의 눈에서 처음으로 두려움을 본다.

  - name: alliance_plan
    instruction: |
      이 부분은 11화의 마지막. 분량 1,800자 이상.
      - 두 사람이 구체적인 대책을 논의.
      - 세린: "당신 능력은 절대 공개하면 안 돼요. 길드장님에게도요."
      - 이준: "알아요. F급 짐꾼이면 충분합니다."
      - 세린: "하지만 백화가 철혈을 흡수하면 당신도 백화 소속이 돼요. 그때는 숨기기 어려워져요."
      - 두 사람의 합의: 백화의 흡수를 막는 것이 최우선.
      - 시스템이 [동맹 1: 박세린 / 신뢰도 72% / 공유 정보: 능력 개요] 표시.
      - 세린이 마지막으로 말한다. "내가 당신을 지킬게요. 당신도 나를 지켜줘요."
      - 마지막 줄: 이준이 새벽 공기를 들이마시며 길드 방향을 걷는다. 태양이 수평선 너머에서 올라오기 시작한다.
