chapter_n: 12
overall: |
  백화의 압박이 고조되며 김태석 길드장이 결정을 내려야 하는 상황.
  이준과 세린이 길드 내부에서 비밀리에 대책을 세운다.
  백화가 철혈 길드에 D급 던전 특별 배정을 보내며 함정의 실체가 드러나기 시작.

beats:
  - name: guild_crisis
    instruction: |
      이 부분은 12화의 시작. 분량 1,800자 이상.
      - 길드 사무실. 아침 회의.
      - 김태석이 길드원 전원을 소집. 백화의 흡수 제안에 대해 설명.
      - "백화 측에서 최종 제안을 보내왔다. 3일 안에 답을 달라고."
      - 길드원들 반응: 일부는 흡수 찬성, 일부는 반대.
      - 세린이 침묵. 이준은 구석에서 듣고만 있다.
      - 김태석의 표정이 무거움. 30명의 생계가 걸린 문제.
      - 마지막 줄: 회의가 끝난 후 이준의 시선이 세린과 교차한다.

  - name: secret_strategy
    instruction: |
      이 부분은 12화의 중반. 분량 1,800자 이상.
      - 점심시간. 이준과 세린이 길드 건물 옆 골목에서 대화.
      - 세린: "길드장님이 흔들리고 있어요. 오늘 회의에서 눈치 챘어요."
      - 이준: "백화가 3일 안에 답을 요구한 이유가 있을 거예요."
      - 세린이 정보를 공유. 백화가 최근 중소 길드 3개를 연속 흡수.
      - "패턴이 있어요. 먼저 흡수 제안 → 거절하면 던전 배정 조작 → 길드원 사고 유도."
      - 이준이 마나 감지로 세린의 마나를 읽는다. 불안하지만 단단하다.
      - 두 사람의 결론: 백화의 던전 조작을 입증하면 흡수를 막을 수 있다.
      - 마지막 줄: 시스템이 [퀘스트: 백화의 음모 입증 / 난이도: S / 보상: 미공개] 표시.

  - name: dungeon_trap
    instruction: |
      이 부분은 12화의 마지막. 분량 1,800자 이상.
      - 오후. 헌터협회에서 철혈 길드에 던전 배정 공문이 도착.
      - D급 던전. 배정 인원 8명. 클리어 기한 48시간.
      - 김태석이 공문을 읽으며 안색이 변한다.
      - 세린이 이준에게 눈빛을 보낸다. "시작이구나."
      - 이준이 마나 감지로 공문을 읽는 세린의 마나를 감지. 긴장.
      - 백화의 함정. 이 던전이 무엇인지 아직 모르지만 분명 이상하다.
      - 이준이 짐꾼 가방을 점검한다. 체인, 에너지 바, 남은 물약.
      - 마지막 줄: 이준이 던전 출발 시간을 확인하며 창밖을 본다. 백화 본사가 있는 강남 방향.
