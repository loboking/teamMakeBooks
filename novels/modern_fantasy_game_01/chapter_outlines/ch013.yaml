chapter_n: 13
overall: |
  백화가 배정한 D급 던전에 철혈 파티가 진입한다.
  이준은 짐꾼으로 동행하면서 마나 감지로 던전 내부를 분석.
  정상적인 D급 던전이 아니라는 것을 발견하고 위험을 감지.

beats:
  - name: dungeon_entry
    instruction: |
      이 부분은 13화의 시작. 분량 1,800자 이상.
      - 던전 입구. 철혈 파티 8명 집결.
      - 김태석이 인솔. B급 세린, C급 2명, D급 4명, 짐꾼 이준.
      - 이준은 짐꾼 역할. 장비를 나르며 마나 감지로 주변을 스캔.
      - 던전 내부 진입. D급 특유의 폐허 모티프.
      - 하지만 이준의 마나 감지가 이상한 것을 감지. 잡몹의 마나량이 D급 기준보다 높다.
      - 시스템: [경고: 잡몹 마나량 비정상 / D급 기준 1.5배].
      - 마지막 줄: 이준이 세린 쪽으로 미세하게 시선을 보낸다. 세린이 고개를 끄덕인다.

  - name: abnormal_dungeon
    instruction: |
      이 부분은 13화의 중반. 분량 1,800자 이상.
      - 탐사 진행. 1층의 잡몹이 예상보다 강하다.
      - C급 헌터 한 명이 부상. D급 잡몹의 공격력이 C급 수준.
      - 김태석이 이상하게 여긴다. "이 던전 배정이 잘못됐나?"
      - 이준이 마나 감지로 더 깊은 곳을 스캔. 2층에서 거대한 마나 반응.
      - 시스템: [구조물 감지: 2층 심층 / 마나량: B급 보스 추정].
      - D급 던전에 B급 보스. 이건 정상적인 배정이 아니다.
      - 이준이 세린에게 속삭인다. "2층에 B급이 있어요. 함정이에요."
      - 마지막 줄: 세린의 눈이 좁아지며 단검에 손을 댄다.

  - name: decision_point
    instruction: |
      이 부분은 13화의 마지막. 분량 1,800자 이상.
      - 이준의 정보를 들은 세린이 김태석에게 제안.
      - "길드장님, 퇴각합시다. 이 던전은 정상이 아니에요."
      - 김태석이 망설인다. 퇴각하면 헌터협회에 불이익.
      - "퇴각하면 백화에 약점을 잡혀요." 세린이 설명.
      - 김태석 결단: "전원 퇴각." 파티가 이동을 시작.
      - 하지만 1층 출구가 막혀 있다. 던전이 진입 후 구조가 변했다.
      - 시스템: [경고: 던전 구조 변화 / 출구 봉인 / 원인: 외부 개입 추정].
      - 이준: 백화가 던전 자체를 조작했다.
      - 마지막 줄: 8명이 출구 없는 던전에 갇혔다. 이준이 체인을 쥐고 앞을 본다.
