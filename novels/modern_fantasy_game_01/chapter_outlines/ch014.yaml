chapter_n: 14
overall: |
  갇힌 던전에서 이준과 세린이 협력하여 파티를 이끈다.
  이준의 마나 감지와 전투 감각, 세린의 B급 전투력이 시너지를 내며
  비정상 잡몹 무리를 돌파한다. 이준이 일부러 F급 수준으로만 싸운다.

beats:
  - name: trapped
    instruction: |
      이 부분은 14화의 시작. 분량 1,800자 이상.
      - 출구가 봉인된 던전. 8명의 파티원들 사이에 불안이 퍼진다.
      - 김태석이 상황을 정리. "마나 감지할 수 있는 사람은?"
      - 세린과 이준만이 마나 감지 능력을 갖고 있지만 이준은 숨겨야 한다.
      - 이준: "저는 짐꾼이라 마나를 잘 모릅니다만... 공기가 달라요."
      - 세린이 이준의 말을 받아 B급 마나 감지로 주변을 스캔.
      - "1층 곳곳에 잡몹 마나 반응. 30체 이상. 그리고 2층에서 B급 반응."
      - 파티원들 공포. D급 파티로 B급 보스 던전은 사실상 사형 선고.
      - 마지막 줄: 이준이 마나 감지로 세린이 놓친 세부 정보를 파악한다.

  - name: first_battle
    instruction: |
      이 부분은 14화의 중반. 분량 1,800자 이상.
      - 잡몹 무리가 습격. D급 돌거미 15체.
      - 김태석이 전면에서 방어. A급 탱커의 방어력은 확실하다.
      - 세린이 돌거미의 측면을 기습. B급 어쌔신의 속도는 압도적.
      - C급, D급 헌터들이 후방에서 지원 사격.
      - 이준은 짐꾼 역할을 하면서도 마나 감지로 잡몹의 위치를 파악.
      - "오른쪽에서 3체가 우회하고 있어요!" 이준이 소리친다.
      - 실제로 오른쪽에서 3체가 우회. 이준의 경고 덕에 D급 헌터가 피함.
      - 세린이 이준을 흘끗 본다. "짐꾼치고는 감각이 좋네요."
      - 마지막 줄: 이준이 체인을 쥔 채 마나 감지로 다음 위험을 탐색한다.

  - name: breakthrough
    instruction: |
      이 부분은 14화의 마지막. 분량 1,800자 이상.
      - 1층 잡몹을 정리하며 2층 계단 앞에 도착.
      - 마나 감지가 2층의 구조를 보여준다. B급 보스가 중앙에 배치.
      - 출구 봉인의 원인이 보스와 연결되어 있다는 것을 이준이 감지.
      - "보스를 처치하면 출구가 열려요." 이준이 말한다.
      - 김태석: "D급 파티로 B급 보스? 미친 소리."
      - 세린: "저와 길드장님이 있으면 가능합니다."
      - 이준이 마나 감지로 보스의 약점을 분석. 진명 시스템이 정보를 제공.
      - [약점 분석: B급 돌거미 여왕 / 복부 마나 코어 / 보호막 주기 15초].
      - 이준이 세린에게 귀엣말로 정보를 전달. 세린의 눈이 빛난다.
      - 마지막 줄: 파티가 2층으로 내려간다. 이준의 마나 감지가 길을 안내한다.
