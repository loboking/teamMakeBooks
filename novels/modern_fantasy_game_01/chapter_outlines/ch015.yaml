chapter_n: 15
overall: |
  B급 돌거미 여왕과의 보스전. 김태석과 세린이 전면 전투를 하고
  이준이 마나 감지로 약점 정보를 제공하며 F급 짐꾼의 한계 안에서
  결정적인 순간에 개입한다. 클리어 후 백화의 개입을 확증.

beats:
  - name: boss_fight
    instruction: |
      이 부분은 15화의 시작. 분량 1,800자 이상.
      - 2층. 거대한 거미줄로 뒤덮인 공간. B급 돌거미 여왕이 중앙에서 대기.
      - 김태석이 전면 탱킹. A급 방어력으로 보스의 공격을 버틴다.
      - 세린이 보호막 주기를 카운트하며 약점을 노린다.
      - 이준은 후방에서 파티원들을 지휘. 마나 감지로 보스의 공격 패턴을 예측.
      - "3초 후 돌격! 왼쪽으로 피하세요!" 이준의 지시가 맞아떨어진다.
      - D급 헌터들이 이준의 지시를 따르며 피해를 최소화.
      - 김태석이 보스의 공격에 부상. 하지만 버틴다. "나를 믿어라!"
      - 마지막 줄: 보스의 보호막이 주기적으로 사라지는 순간이 다가온다.

  - name: critical_moment
    instruction: |
      이 부분은 15화의 중반. 분량 1,800자 이상.
      - 보호막 주기 15초. 세린이 타이밍을 재고 있다.
      - 보호막 소멸. 세린이 돌진. 단검이 복부 마나 코어를 향해 날아간다.
      - 하지만 보스가 반격. 세린의 어깨를 찢어버리며 밀어낸다.
      - 세린이 비명 지르며 바닥에 굴러 떨어진다. 단검 하나가 손에서 미끄러짐.
      - 김태석이 분노하며 보스에게 돌진하지만 체력이 부족하다.
      - 보스의 다리가 김태석을 차서 내리친다. A급 탱커가 무릎을 꿇는다.
      - 이준이 순간적으로 판단. 마나 감지가 보호막 재생까지 8초를 알려준다.
      - 이준이 짐꾼 가방에서 마정석 파편을 꺼내 세린의 단검 근처에 던진다.
      - "세린 씨! 단검!" 이준이 소리친다.
      - 마지막 줄: 세린이 이준의 의도를 이해하고 다가가는 동안 보스가 이준을 향해 돌아본다.

  - name: aftermath
    instruction: |
      이 부분은 15화의 마지막. 분량 1,800자 이상.
      - 보스가 이준을 노리고 돌진. F급 짐꾼을 한 방에 끝내려는 거대한 발톱.
      - 이준은 피하지 않는다. 대신 보스의 시선을 자신에게 고정한다.
      - 그 3초 동안 세린이 단검을 주워 마나 코어에 찔러넣는다.
      - 보스 비명. 마나 코어 파괴. 보스가 쓰러지며 던전이 흔들린다.
      - 출구 봉인이 해제. 1층 입구로 빛이 들어온다.
      - 시스템: [보스 처치 / 경험치 +500 / 시스템 재화 +5,000].
      - 이준은 경험치를 받지만 레벨업하지 않는다. F급에 맞는 적당한 보상.
      - 파티원들이 밖으로 나가며 환호하지만 이준과 세린은 교환하는 눈빛.
      - 세린: "마정석 파편... 의도한 거지?" 이준: "우연이에요."
      - 마지막 줄: 던전 밖. 백화의 감시자가 멀리서 이 모습을 지켜보고 있다.
