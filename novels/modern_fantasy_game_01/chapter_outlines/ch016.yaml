chapter_n: 16
overall: |
  던전 사건 이후 백화의 압박이 더 거세진다. 한도혁이 직접 철혈 길드에 사람을 보낸다.
  신민혁이 이준의 던전 행동에서 의심을 품기 시작.
  이준이 백화의 다음 수를 예측하며 대비한다.

beats:
  - name: post_dungeon
    instruction: |
      이 부분은 16화의 시작. 분량 1,800자 이상.
      - 던전 클리어 다음 날. 길드 사무실 분위기가 가라앉아 있다.
      - 부상당한 C급 헌터가 치료 중. D급 헌터 2명이 공포에 질려 퇴사.
      - 김태석이 헌터협회에 던전 조작 이의를 제기했지만 받아들여지지 않는다.
      - "협회에서는 정상 배정이라고만 해요. 증거가 없으면."
      - 세린이 이준에게 귀띔. "백화가 협회에도 손을 쓴 거예요."
      - 이준이 마나 감지로 사무실 밖을 스캔. 백화 감시자가 여전히 근처에 있다.
      - 마지막 줄: 신민혁이 이준의 책상 앞에 선다. "선배, 어제 좀 이상하지 않았어요?"

  - name: suspicion
    instruction: |
      이 부분은 16화의 중반. 분량 1,800자 이상.
      - 신민혁이 이준에게 질문을 던진다.
      - "선배는 짐꾼인데 잡몹 위치를 어떻게 알았어요? 그리고 마정석 파편을 왜 미리 준비해요?"
      - 이준이 침착하게 대답. "5년간 던전을 다녀서 감각이 남아 있었을 뿐이야. 파편은 가방에 원래 있던 거."
      - 신민혁이 납득하지 못한 표정이지만 더 추궁하지는 않는다.
      - 하지만 그의 눈에는 의심이 남아 있다.
      - 이준이 마나 감지로 신민혁의 마나량을 체크. D급 초보. 순수한 감각.
      - 신민혁이 떠난 후 이준이 한숨을 쉰다. 의심을 완전히 풀기 어렵다.
      - 마지막 줄: 시스템이 [신민혁 / 위협도: 낮음 / 경계 필요: 보통] 표시한다.

  - name: baekhwa_enoy
    instruction: |
      이 부분은 16화의 마지막. 분량 1,800자 이상.
      - 오후. 백화 본사에서 사람이 철혈 길드를 방문한다.
      - 백화의 부회장. A급 헌터. 정장 차림.
      - "김태석 길드장님. 회장님의 최후통첩입니다."
      - 흡수 조건: 철혈 소속 전원 백화 편입. 세린은 주력 대대 배치.
      - 거절 시: "백화는 철혈에 더 이상 던전을 배정하지 않습니다."
      - 김태석의 얼굴이 굳는다. 던전 배정이 끊기면 길드는 존재 의미가 없다.
      - 이준이 뒤에서 듣고 있다. 마나 감지로 부회장의 마나를 스캔. A급. 강하지만 세린보다 약하다.
      - 부회장이 돌아가고 사무실에 침묵이 내린다.
      - 마지막 줄: 김태석이 책상 위에 머리를 bury하며 중얼거린다. "3일... 3일만 있으면."
