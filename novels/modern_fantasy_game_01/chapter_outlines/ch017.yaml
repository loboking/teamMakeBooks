chapter_n: 17
overall: |
  이준이 백화에 대한 정보를 수집하기 위해 은밀히 백화 본사 근처를 탐색.
  마나 감지로 백화의 마나 구조와 경비 패턴을 파악.
  세린과 함께 백화의 던전 조작 증거를 찾기 위한 계획을 세운다.

beats:
  - name: intelligence
    instruction: |
      이 부분은 17화의 시작. 분량 1,800자 이상.
      - 밤. 이준이 혼자 강남으로 간다.
      - 마나 감지를 켜고 백화 본사 건물 주변을 걷는다.
      - 50층짜리 유리 건물. 내부에서 다수의 고등급 마나 반응.
      - A급 5명, B급 10명 이상. 중소 길드 전체를 상회하는 전력.
      - 하지만 꼭대기 층에서 마나 반응이 감지되지 않는다. S급의 은폐?
      - 이준이 건물을 한 바퀴 돌며 출입구와 경비 패턴을 파악.
      - 지하 주차장에서 백화 소속 헌터들이 출입하는 것을 관찰.
      - 마지막 줄: 이준이 건물을 마주 보며 중얼거린다. "회장님. 당신의 성을 알고 싶지 않아요."

  - name: evidence_plan
    instruction: |
      이 부분은 17화의 중반. 분량 1,800자 이상.
      - 다음 날. 이준과 세린이 다시 만난다.
      - 이준이 백화 본사의 마나 구조를 보고. 세린이 분석.
      - "S급 마나가 감지되지 않는 건 한도혁이 의도적으로 은폐한 거예요."
      - 세린이 증거 수집 방안을 제안. 헌터협회의 던전 기록을 해킹.
      - "협회의 던전 배정 시스템은 전자기록이 남아요. 백화가 조작했다면 흔적이 있어야 해요."
      - 하지만 협회 시스템에 접근하려면 내부자가 필요하다.
      - 이준: "내부자를 만들 수 있을까요?" 세린: "한 명 생각나요."
      - 마지막 줄: 세린이 헌터협회에 아는 사람이 있다는 것을 암시.

  - name: insider
    instruction: |
      이 부분은 17화의 마지막. 분량 1,800자 이상.
      - 세린이 소개하는 내부자. 헌터협회 3급 직원. C급 헌터.
      - 세린의 동생의 동기. 가족 같은 관계.
      - 이준과 세린이 그를 만나러 간다. 헌터협회 근처 카페.
      - 내부자가 던전 배정 기록을 보여준다. 최근 6개월간 백화 관련 배정 이상.
      - "백화가 흡수하려는 길드에 D급 배정을 B급 수준으로 조작한 기록이 3건 있어요."
      - 이것이 증거다. 하지만 공개하면 내부자가 위험해진다.
      - 이준이 결심한다. "이 증거를 김태석 길드장님에게 보여드리죠."
      - 마지막 줄: 이준이 카페를 나서며 마나 감지로 주변을 확인. 백화의 감시가 여전하다.
