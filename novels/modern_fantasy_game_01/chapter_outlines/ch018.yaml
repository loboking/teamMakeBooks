chapter_n: 18
overall: |
  세린의 과거가 드러난다. 진명 시스템 보유자였던 그녀의 오빠.
  백화에 의해 희생된 과거. 세린이 이준에게 진실의 일부를 공개하며
  두 사람의 유대가 깊어진다.

beats:
  - name: serin_past
    instruction: |
      이 부분은 18화의 시작. 분량 1,800자 이상.
      - 비 오는 밤. 세린이 이준을 길드 뒷편 창고로 부른다.
      - 세린이 처음으로 자신의 과거를 이야기한다.
      - "3년 전, 제 오빠가 진명 시스템을 각성했어요."
      - 오빠의 이름: 박세진. C급 헌터였지만 진명 시스템 각성 후 레벨이 급성장.
      - "한도혁이 그걸 알았어요. 진명 시스템 보유자가 있다는 걸."
      - 백화가 세진을 포섭하려 했으나 세진이 거부.
      - 그 후 세진은 '던전 사고'로 사망. 공식적으로는 미클리어 던전 폭주.
      - 마지막 줄: 세린의 눈에서 눈물이 흐르지 않지만 목소리가 떨린다.

  - name: truth_revealed
    instruction: |
      이 부분은 18화의 중반. 분량 1,800자 이상.
      - 세린이 계속 이야기한다. 오빠의 죽음이 사고가 아니었다는 것.
      - "던전 폭주는 백화가 인위적으로 일으킨 거예요. 저는 증거가 있어요."
      - 세진이 남긴 마지막 메시지. 세린만이 알고 있는 비밀 기록.
      - "오빠는 진명 시스템이 무엇인지 알기 시작했어요. 그래서 죽은 거예요."
      - 이준이 충격을 받는다. 진명 시스템의 존재가 백화에게 알려져 있다는 것.
      - 세린: "당신도 조심해요. 한도혁은 진명 시스템 보유자를 찾고 있어요."
      - 이준: "왜 알려줘요? 위험한데." 세린: "오빠가 그랬어요. 혼자서는 안 돼."
      - 마지막 줄: 이준이 세린의 어깨에 손을 얹는다. 처음으로 하는 물리적 접촉.

  - name: deepened_bond
    instruction: |
      이 부분은 18화의 마지막. 분량 1,800자 이상.
      - 세린이 이준에게 세진의 메시지를 보여준다.
      - "진명 시스템은 통제가 아닌 해방을 위한 거야. 같은 보유자를 찾아."
      - 이준이 이 말의 의미를 곱씹는다. 해방. 통제.
      - 세린: "오빠가 혼자서 하려다 죽었어요. 당신은 혼자가 아니에요."
      - 시스템이 [동맹 1: 박세린 / 신뢰도 89% / 공유 정보: 능력 상세 + 과거].
      - 신뢰도가 크게 올랐다. 세린이 이준에게 더 많은 것을 걸고 있다.
      - 비가 그친다. 두 사람이 창고 밖으로 나온다.
      - 이준이 결심한다. 백화를 막는 것은 길드만이 아닌 세린의 복수이기도 하다.
      - 마지막 줄: 이준이 하늘을 올려다본다. 구름 사이로 달이 보인다. "박세진. 내가 세린을 지킬게."
