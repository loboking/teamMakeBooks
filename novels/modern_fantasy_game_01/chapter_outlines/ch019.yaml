chapter_n: 19
overall: |
  백화의 마지막 수. 김태석이 백화의 조건을 거절하기로 결정.
  백화가 철혈 길드원들을 던전에서 매몰시키려는 더 큰 함정을 준비.
  이준과 세린이 이것을 막기 위해 움직이기 직전.

beats:
  - name: guild_decision
    instruction: |
      이 부분은 19화의 시작. 분량 1,800자 이상.
      - 김태석이 길드원 전원을 다시 소집.
      - 던전 배정 조작 증거를 제시. 세린이 수집한 협회 기록.
      - 길드원들이 분노. "백화가 우리를 죽이려 한 거잖아!"
      - 김태석이 결단한다. "백화의 흡수 제안을 거절한다. 우리는 철혈이다."
      - 길드원들 환호. 하지만 이준과 세린은 기뻐하지 않는다.
      - 거절 = 백화의 공개적 적대. 더 큰 보복이 올 것이다.
      - 세린이 이준에게 눈빛을 보낸다. "시작이에요."
      - 마지막 줄: 김태석이 헌터협회에 공식적으로 거절 문서를 제출한다.

  - name: retaliation
    instruction: |
      이 부분은 19화의 중반. 분량 1,800자 이상.
      - 거절 후 24시간. 백화의 반응이 빠르다.
      - 철혈 길드의 주요 거래처들이 일제히 계약을 취소.
      - 장비 공급업체, 포션 제조사, 정보 브로커. 모두 백화 압력.
      - 길드 운영이 마비되기 시작. 수입이 끊긴다.
      - 김태석이 사무실에서 담배를 피우며 고통스러워한다.
      - "이 정도는 예상했어. 하지만 멤버들까지..."
      - 이준이 마나 감지로 길드 주변을 확인. 감시자가 4명으로 늘었다.
      - 시스템: [경고: 적대 세력 활동 증가 / 위협도 상승].
      - 마지막 줄: 이준이 세린에게 연락. "백화의 다음 수가 올 거예요. 준비해야 합니다."

  - name: counter_plan
    instruction: |
      이 부분은 19화의 마지막. 분량 1,800자 이상.
      - 이준과 세린이 백화의 다음 수를 예측.
      - 세린: "다음은 길드원 직접 타겟이에요. 납치나 조작 사고."
      - 이준: "김태석 길드장님을 노리거나, 약한 길드원을 인질로..."
      - 두 사람이 길드원 보호 계획을 세운다.
      - 이준이 마나 감지를 24시간 가동. 길드 건물 주변 감시.
      - 세린이 길드원들에게 비상 연락망 구축.
      - 시스템이 새로운 퀘스트를 표시. [철혈 길드 보호 / 백화의 공격 3회 방어 / 보상: 진명 시스템 단서].
      - 이준: "진명 시스템 단서?" 백화를 막으면 시스템이 새로운 정보를 준다.
      - 마지막 줄: 이준이 짐꾼 가방을 점검하며 밤하늘을 올려다본다. 폭풍 전야의 고요함.
