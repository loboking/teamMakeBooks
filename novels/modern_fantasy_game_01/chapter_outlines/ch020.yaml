chapter_n: 20
overall: |
  백화가 한도혁의 직접 명령으로 이준에게 접촉. 철혈 길드 D급 헌터 2명이 납치.
  이준이 마나 감지로 납치 현장을 추적하고 구출 작전에 나선다.
  한도혁이 이준의 능력에 대해 확신을 갖기 시작하며 클리프행어.

beats:
  - name: abduction
    instruction: |
      이 부분은 20화의 시작. 분량 1,800자 이상.
      - 새벽 3시. 이준의 마나 감지에 긴급 경고가 뜬다.
      - [경고: 아군 길드원 위협 감지 / 거리 800m / 인원 2명 / 적대 마나 반응 동반].
      - 이준이 즉시 외출. 마나 감지를 따라가며 위치를 파악.
      - 골목에서 백화 소속 C급 헌터 3명이 철혈 D급 헌터 2명을 끌고 가는 현장.
      - 납치다. 이준이 숨으면서 상황을 관찰.
      - D급 헌터들은 기절한 상태. C급 3명은 차에 싣으려 하고 있다.
      - 이준이 F급의 몸으로 어떻게 대처할지 계산.
      - 마지막 줄: 이준이 체인을 쥐고 어둠 속에서 움직이기 시작한다.

  - name: rescue
    instruction: |
      이 부분은 20화의 중반. 분량 1,800자 이상.
      - 이준이 전투를 시작. 하지만 F급으로 C급 3명은 불가능.
      - 대신 기습과 환경을 이용. 마나 감지로 적의 위치를 정확히 파악.
      - 이준이 가로등을 체인으로 쳐서 폭발시키며 시야를 차단.
      - 혼란 속에서 첫 번째 C급을 체인으로 기습. 관자놀이를 정확히 때려 기절.
      - 두 번째 C급이 돌아보지만 이준은 이미 위치를 바꿨다.
      - 마나 감지가 적의 공격 궤적을 예측. 이준이 미세하게 피하며 반격.
      - STR 25의 힘으로 체인을 휘둘러 두 번째 C급의 무장을 탈취.
      - 세 번째 C급이 도망치려 하지만 이준이 마나 감지로 도주 경로를 예측해 선점.
      - 마지막 줄: 3명 모두 기절. 이준이 기절한 길드원들을 확인하며 숨을 고른다.

  - name: chairman_eyes
    instruction: |
      이 부분은 20화의 마지막. 분량 1,800자 이상.
      - 이준이 길드원들을 데리고 귀환. 세린이 이미 출동 대기 중이었다.
      - 세린이 상황을 보며 이준의 전투 흔적을 확인. C급 3명을 혼자?
      - "이건 F급이 할 수 있는 게 아니야." 세린의 눈이 흔들린다.
      - 이준: "숲이 어두워서 우연히... 그리고 이건 체인이에요."
      - 세린은 알고 있다. 우연이 아님을. 하지만 지적하지 않는다.
      - 같은 시각. 백화 본사 50층.
      - 한도혁이 보고를 받는다. "C급 3명이 기절? 누가 했지?"
      - "F급 짐꾼 강이준... 으로 추정됩니다."
      - 한도혁의 눈이 처음으로 흥미로 변한다. "F급이? C급 셋을?"
      - 한도혁이 창밖을 본다. 서울의 야경이 그의 얼굴에 반사된다.
      - 마지막 줄: "강이준... 정말 F급인가? 아니면..." 한도혁의 입꼬리가 올라간다.
