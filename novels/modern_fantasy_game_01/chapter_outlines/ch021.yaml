chapter_n: 21
overall: |
  C급 헌터 3명 기절 사건의 여파. 김태석이 이준을 소명하여 구출 상황을 듣고 충격받는다.
  백화에서 기절한 헌터 3명을 회수하며 조용히 압박을 강화한다.
  한도혁이 이준에 대한 비공개 조사를 지시한다.

beats:
  - name: morning_after
    instruction: |
      이 부분은 21화의 시작. 분량 1,800자 이상.
      - 아침. 이준이 숙소에서 일어남. 밤새 잠을 거의 못 잠음.
      - 몸이 아프다. 어젯밤 전투의 여파. 손목이 붓고 옆구리가 쓰리다.
      - 마나 감지를 가동. 길드 건물 주변 정상. 백화 감시자는 여전히 4명.
      - 시스템 창 확인. [퀘스트: 철혈 길드 보호 / 방어 1/3 완료].
      - 길드에 도착하면 분위기가 다르다. 길드원들이 수군거린다.
      - "이준이가 밤에 C급 셋을 때렸다며?" 소문이 퍼져 있다.
      - 이준이 놀란다. 누가 알렸지? 세린이 아닌 이상.
      - 마지막 줄: 사무실 문이 열리고 김태석이 이준을 부른다. "이준아, 들어와."

  - name: guildmaster_questioning
    instruction: |
      이 부분은 21화의 중반. 분량 1,800자 이상.
      - 김태석의 사무실. 문이 닫힌다. 두 사람만.
      - 김태석이 직접 물었다. 어젯밤 무슨 일이 있었는지.
      - 이준이 간략하게 설명한다. 마나 감지로 길드원 위협을 감지하고, 출동했다.
      - "C급 셋을 어떻게?" 김태석의 눈이 날카롭다. A급의 시선.
      - 이준: "어둠이 짙었고, 체인이 있었고, 운이 좋았습니다."
      - 김태석은 20년 헌터 경력의 직감으로 거짓말임을 안다. 하지만 추궁하지 않는다.
      - 대신: "위험한 짓이야. 혼자서 C급에게 달려든 건 자살 행위야."
      - 이준: "길드원이 위험했으니까요."
      - 김태석이 잠시 침묵. 그의 눈이 복잡한 감정으로 흔들린다.
      - "앞으로 이런 일이 있으면 무조건 나한테 먼저 보고해. 알겠지?"
      - 이준이 고개를 끄덕인다. 하지만 둘 다 이것이 지킬 수 없는 약속이라는 걸 안다.
      - 마지막 줄: 김태석이 창밖을 본다. "백화가 가만히 안 있을 거야."

  - name: baekhwa_response
    instruction: |
      이 부분은 21화의 마지막. 분량 1,800자 이상.
      - 같은 시각. 백화 본사 38층. 정보수집팀 사무실.
      - 팀장이 한도혁의 지시를 받고 이준에 대한 파일을 열었다.
      - 강이준. 26세. F급. 철혈 길드 5년차 짐꾼.
      - 가족: 어머니(투병), 여동생(고등학생). 아버지 5년 전 사망.
      - 과거 기록: 평범한 F급. 던전 사고 횟수 0. 부상 기록 다수.
      - "이런 녀석이 C급 셋을 기절시켰다고?" 팀장이 고개를 젓는다.
      - 하지만 한도혁의 지시는 확고하다. "비공개로 조사하라."
      - 팀장이 던전 기록을 요청한다. 최근 철혈의 던전 배정 기록.
      - 이준이 참가한 던전들의 클리어 시간과 보스 처치 기록을 확인.
      - 수치가 이상하다. F급이 참가한 던전들의 클리어 속도가 비정상적으로 빠르다.
      - 특히 ch009의 거미 7체 처치 기록. 12초.
      - 팀장의 표정이 변한다. 이건 F급의 영역이 아니다.
      - 보고서를 작성하여 한도혁에게 전송.
      - 마지막 줄: 한도혁이 보고서를 읽으며 중얼거린다. "박세진과 같은 패턴이군."
