chapter_n: 22
overall: |
  백화의 두 번째 공격이 시작된다. 이번에는 물리적이 아닌 경제적·심리적 압박.
  백화가 길드원 신민혁에게 접근하여 정보원으로 포섭하려 한다.
  협회가 철혈의 던전 배정 조작 조사 요청을 기각한다.
  이준이 마나 감지로 백화의 접근을 감지하고 세린과 함께 대응한다.

beats:
  - name: association_rejection
    instruction: |
      이 부분은 22화의 시작. 분량 1,800자 이상.
      - 오후. 김태석이 협회에서 돌아온다. 표정이 굳어 있다.
      - 협회가 던전 배정 조작 조사 요청을 기각했다.
      - 이유: "배정 알고리즘은 협회 독립 기관의 권한. 길드 단위 요청으로는 조사 불가."
      - 김태석이 서류를 책상 위에 내려놓으며 분노를 억누른다.
      - 이준이 마나 감지로 김태석의 마나를 읽는다. 분노와 무력감이 뒤엉켜 있다.
      - 세린이 냉정하게 분석: "협회 내부에 백화 사람이 있어. 그게 끝이야."
      - 길드원들이 흩어지고 이준과 세린만 남는다.
      - 마지막 줄: 세린이 이준에게 "밤에 확인할 게 있어요"라고 속삭인다.

  - name: approach
    instruction: |
      이 부분은 22화의 중반. 분량 1,800자 이상.
      - 저녁. 이준이 마나 감지를 가동한 채 길드 건물 주변을 순찰.
      - 마나 감지에 익숙한 마나 반응이 하나 떠오른다. 150미터 거리.
      - 백화 감시자 네 명의 자리는 그대로인데 다섯 번째 마나 반응이 새로 나타났다.
      - 이준이 위치를 추적. 길드 건물 뒷편 골목. 편의점 앞.
      - 마나 감지로 두 사람의 대화 상황을 감지. 한 명은 백화 감시자 중 하나.
      - 다른 한 명의 마나 패턴이 익숙하다. 이준이 그것을 알아본다.
      - 길드원이다. 그것도 최근 입단한 D급. 아니, 더 정확히는 —
      - 마지막 줄: 이준의 표정이 변한다. 신민혁이었다.

  - name: counter
    instruction: |
      이 부분은 22화의 마지막. 분량 1,800자 이상.
      - 이준이 세린에게 연락. 골목에서 상황을 공유.
      - 세린이 냉정하게 판단: "포섭이야. 돈이든 협박이든. 신민혁을 정보원으로 쓰려는 거야."
      - 이준: "신민혁이 배신할 리가 없어요."
      - 세린: "배신이 아니야. 선택의 여지를 주는 거야. 신민혁 가족이 잘사는 게 아니잖아."
      - 세린이 이준에게 신민혁을 직접 대면하라고 권유. 경찰처럼 추궁하지 말고 동료로서.
      - 이준이 신민혁을 찾는다. 길드 건물 옆 작은 공원.
      - 신민혁이 벤치에 앉아 있었다. 어두운 표정.
      - 이준이 옆에 앉는다. 아무 말 없이.
      - 신민혁이 먼저 입을 연다: "이준 씨, 저... 백화에서 연락이 왔어요."
      - 이준이 대답하지 않는다. 기다린다.
      - 신민혁: "가족한테 보내줄 돈이랍시고. 월 500이래요. 지금 제 수입의 세 배예요."
      - 마지막 줄: 이준이 밤하늘을 올려다본다. 시스템 창이 떠올랐다. [퀘스트 갱신: 철혈 길드 보호 / 방어 2/3].
