chapter_n: 23
overall: |
  신민혁이 백화의 제안을 거절하고 이준과 함께 백화 접촉 증거를 세린에게 전달한다.
  한편 서동현의 조사가 심화되어 이준의 3개월 전 던전 실종 기록(3일간 실종 후 귀환)을 발견한다.
  백화의 세 번째 공격의 징조가 보이기 시작한다.

beats:
  - name: decision
    instruction: |
      이 부분은 23화의 시작. 분량 1,800자 이상.
      - 아침. 이준이 길드에 도착하자 신민혁이 먼저 다가왔다.
      - 신민혁의 표정이 달라져 있었다. 밤새 결정을 내린 것이다.
      - "거절했어요." 짧고 단호한 한마디.
      - 이준이 아무 말 없이 신민혁의 어깨를 토닥였다.
      - 신민혁이 백화 접촉 시간과 장소, 상대방 특징을 세린에게 상세히 전달.
      - 세린이 "증거로 쓸 수 있어"라며 녹음기로 대화 내용을 정리.
      - 김태석에게도 보고. 길드장이 "이제 협회에 제출할 수 있는 게 하나 늘었어"라고 평가.
      - 마지막 줄: 신민혁이 이준에게 "이준 씨, 저한테 빚진 거 아무것도 없어요. 제가 한 건 그냥 제 동료를 지킨 거예요"라고 말한다.

  - name: deep_investigation
    instruction: |
      이 부분은 23화의 중반. 분량 1,800자 이상.
      - 같은 시각. 백화 본사 38층. 서동현의 사무실.
      - 서동현이 밤새 조사한 결과를 정리 중. 한도혁에게 보고할 준비.
      - 핵심 발견: 3개월 전 이준이 3일간 던전에서 실종된 기록.
      - 정상적인 실종 사고라면 사망 또는 중상 처리되어야 하는데 이준은 부상만 입고 귀환.
      - 부상 기록: 옆구리 찢김, 등 긁힘, 발목 염좌. 3일간의 기록이 없음.
      - 서동현이 "3일간 이준이 어디에 있었는지 기록이 없어요"라고 보고서에 적는다.
      - 이것이 박세진의 패턴과 더욱 유사해진다. 세진도 각성 후 약 2주간 행방불명이었음.
      - 서동현이 보고서를 전송. 한도혁이 직접 38층으로 내려온다.
      - 마지막 줄: 한도혁이 보고서를 읽으며 "3일간의 공백..."이라고 중얼거린다.

  - name: third_attack_signal
    instruction: |
      이 부분은 23화의 마지막. 분량 1,800자 이상.
      - 오후. 이준이 마나 감지를 가동한 채 길드 주변 순찰.
      - 평소와 다른 마나 패턴을 감지. 길드 건물 300미터 밖에서.
      - 이전까지 감지 범위 밖의 마나 반응. 셋. B급 한 명 포함.
      - 이준의 마나 감지 한계(200m) 밖이지만 진명 시스템이 경고를 발동시킨다.
      - [위협 감지: B급 이상 마나 반응 3개 + 접근 중 / 거리: 약 250m / 방향: 길드 건물 서쪽].
      - 이준이 등골이 서늘해지는 것을 느낀다. C급 셋은 가벼웠지만 B급이 직접 움직이는 건 다른 이야기다.
      - 이준이 세린에게 연락. "이번엔 다릴 것 같아요."
      - 세린이 "한도혁이 직접 움직이는 거야. 신호탄이에요."라고 판단.
      - 마지막 줄: 길드 건물 서쪽에서 검은 SUV가 천천히 접근하고 있었다. 차 안에서 B급의 마나가 희미하게 빛나고 있었다.
