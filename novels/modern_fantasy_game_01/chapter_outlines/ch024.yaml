chapter_n: 24
overall: |
  한도혁이 직접 철혈 길드를 방문한다. S급의 압도 속에서 김태석과 대면.
  이준은 마나 감지로 한도혁의 마나를 처음으로 읽고 그 위압감에 전신한다.
  세 번째 공격은 물리적 충돌이 아니라 한도혁 자신의 '방문'이었다.

beats:
  - name: visit
    instruction: |
      이 부분은 24화의 시작. 분량 1,800자 이상.
      - 검은 SUV에서 세 명이 내린다. 앞선 남자가 B급이었다. 뒤의 두 명은 C급.
      - 김태석이 사무실에서 소식을 취소하고 나온다. 이준이 마나 감지로 보고.
      - 김태석이 로비에서 한도혁을 맞이러 나간다. 길드장의 의무.
      - 이준이 뒤에서 관찰. 마나 감지로 한도혁의 마나를 처음 읽는다.
      - S급의 마나. 압도감이 아니라 마나 자체가 질서 다른 차원의 존재였다.
      - 이준의 마나 감지가 떨리고 시야가 흐려졌다. 이건 F급의 감지 한계가 아니라 S급의 마나가 너무 강해서.
      - 한도혁이 김태석에게 "잠시 얘기 나눌 수 있겠나?"라고 말하며 미소를 지었다.
      - 마지막 줄: 이준이 뒤에서 한도혁의 마나를 읽으며 이것이 백화의 두려움이 아닌 진명 시스템에 대한 관심이라는 걸 직감한다.

  - name: proposal
    instruction: |
      이 부분은 24화의 중반. 분량 1,800자 이상.
      - 김태석의 사무실에서 대화. 한도혁이 앞에 앉고 김태석·세린·이준이 마주 앉는다.
      - 한도혁이 "철혈 길드의 위기는 내가 해결해줄 수 있어요"라고 말한다.
      - 조건: 길드 해체가 아닌 백화 산하 편입. B급 이상 인원은 기존 직급 유지.
      - 김태석의 눈이 변하지 않았지만 이준은 마나 감지로 길드장의 분노가 마나를 미세하게 뒤흽이는 것을 읽었다.
      - 세린이 차가운 목소리로 "거절합니다"라고 말한다.
      - 한도혁의 시선이 세린에게 간다. "박세린의 여동생이구나. 어째서 그렇게 까보는 눈이지?"
      - 세린의 마나가 경보처럼 울렸지만 그녀는 시선을 피하지 않았다.
      - 이준이 한도혁의 마나를 계속 읽고 있다. S급의 마나 안에서 이상한 패턴을 감지. 마나의 깊은 곳에 무언가 숨어 있는 것 같았다.
      - 마지막 줄: 한도혁이 돌아가며 "재미있네, 강이준 씨도 와서 오신 건가?"라고 이준에게 직접 말을 건넨다.

  - name: aftermath
    instruction: |
      이 부분은 24화의 마지막. 분량 1,800자 이상.
      - 한도혁이 돌아가고 길드에 정적이 흘렀다.
      - 김태석이 사무실에 들어가 문을 닫고 1분 동안 아무 말 없이 있었다.
      - 나와서 "저 놈이 강이준이었어?"라고 이준에게 물었다.
      - 이준이 어색했지만 김태석의 눈에는 분노가 아닌 복잡한 감정이 있었다.
      - 김태석: "한도혁이 직접 왔 거야. S급 회장이 중소 길드에 직접 왔 건. 이건 거절이 아니라 전쟁 선언이야."
      - 세린이 보고서를 정리하며 "한도혁이 이준에게 관심을 보인 거예요. 방문의 진짜 목적은 이준이었을 가능성이 높아요"라고 분석.
      - 이준이 타임라인을 정리한다. 3개월 전 실종 기록 → 던전 배정 조작 → C급 납치 → 신민혁 포섭 → 직접 방문. 모든 것이 이준을 향해 달려 있었다.
      - 시스템 창: [퀘스트: 철혈 길드 보호 / 세 번째 공격 진행 중 / 위협도: 높음].
      - 마지막 줄: 이준이 밤하늘을 올려다보며 생각한다. 한도혁이 자신을 알고 있다는 것은 시간문제일까.
