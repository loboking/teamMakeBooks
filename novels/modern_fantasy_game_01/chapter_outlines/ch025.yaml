chapter_n: 25
overall: |
  한도혁의 방문이 세 번째 공격으로 인정되어 퀘스트 3/3 완료.
  진명 시스템이 보상으로 새로운 단서와 능력을 해금한다.
  이준은 한도혁이 자신을 알고 있다는 사실에 위기를 느끼지만 동시에 진명 시스템의 진짜 목적에 한 걸음 다가간다.

beats:
  - name: quest_complete
    instruction: |
      이 부분은 25화의 시작. 분량 1,800자 이상.
      - 다음 날 아침. 이준이 길드에 출근. 한도혁 방문의 여파로 길드원들 불안.
      - 시스템 창이 변했다. [퀘스트: 철혈 길드 보호 / 방어 3/3 완료 / 보상 지급 중...].
      - 이준이 한도혁의 방문이 세 번째 공격이었다는 것을 깨닫는다. 물리적 폭력이 아니라 심리적·외교적 압박이었고 그것이 S급의 방식이었다.
      - 보상이 지급된다. [보상: 진명 시스템 단서 — '동류자의 파동' / 새로운 패시브 스킬 해금].
      - 새 스킬 [진명 감지 — 진명 시스템 보유자의 마나 파동만 감지 / 500m / 던전 내외 작동 / 패시브].
      - 마나 감지와의 차이: 일반 마나가 아니라 '시스템 자체의 파동'을 읽는 것.
      - 이준이 즉시 발동시켜보지만 500m 내에 반응 없음. 아직 다른 보유자가 가까이 없다는 뜻.
      - 마지막 줄: 세린이 이준의 표정 변화를 눈치채고 "무슨 일이야?"라고 묻는다.

  - name: aftermath_analysis
    instruction: |
      이 부분은 25화의 중반. 분량 1,800자 이상.
      - 이준이 세린에게 새 스킬을 일부 공개. "진명 시스템이 뭔가 알려줬어. 다른 보유자를 찾을 수 있는 것 같아."
      - 세린이 오빠 박세진의 유언을 떠올린다. "같은 보유자를 찾아. 혼자서는 안 돼."
      - 세린이 박세진의 메시지 기록을 꺼내 이준에게 보여준다. 박세진이 남긴 데이터: 진명 시스템에 대한 단편적 정보들.
      - 핵심 정보: 박세진이 마지막으로 감지한 것 — "서쪽에서 비슷한 파동이 있었다. 하지만 도달하기 전에..."
      - 박세진의 기록이 끊긴 것은 미클리어 던전 폭주 사고 직전이었다.
      - 세린: "오빠가 찾던 게 이거였어. 다른 보유자."
      - 이준이 박세진의 기록과 새 스킬을 연결하며 생각을 정리한다.
      - 김태석이 회의실에서 길드원들과 대책 회의. 백화의 압박이 한층 심해지고 거래처 3곳 추가 계약 취소.
      - 마지막 줄: 이준이 박세진의 기록을 읽으며 오빠가 도달하지 못한 곳을 자신이 가야 한다는 것을 직감한다.

  - name: approaching_storm
    instruction: |
      이 부분은 25화의 마지막. 분량 1,800자 이상.
      - 저녁. 이준이 집으로 돌아가는 길에 마나 감지가 반응. B급 마나 2개가 200m 밖에서 따라오고 있다.
      - 백화의 감시가 한층 강화되었다. 한도혁 방문 전에는 B급 감시자 2명이었는데 지금도 2명이지만 거리가 더 가까워졌다.
      - 이준이 동네 골목을 이용해 감시를 따돌리려 시도. DEX 30과 마나 감지로 도시의 구조물을 활용한 이동.
      - 감시자를 완전히 떨어뜨리지는 못하지만 집 주소는 숨긴다.
      - 집에 도착. 어머니가 병원에 입원한 상태(이전 맥락). 이서가 혼자 저녁 준비 중.
      - 이서와의 대화. 이서가 오빠의 표정이 안 좋은 것을 눈치챈다. "오빠, 무슨 일 있어?"
      - 이준이 "아니야. 그냥 일이 좀 바빠서"라고 말하지만 이서는 믿지 않는다.
      - 혼자 방에 들어가 진명 시스템 창을 연다. 단서 항목에 새로운 텍스트가 추가되어 있다.
      - [단서: 동류자의 파동 / "동일한 시스템의 보유자는 서로의 존재를 감지할 수 있다. 첫 번째 파동의 방향: 서쪽."]
      - 이준이 창밖 서쪽을 바라본다. 서울의 서쪽, 인천 방향. 그곳에 무언가가 있다.
      - 마지막 줄: 이준이 주먹을 쥔다. "세린의 오빠가 찾던 것. 내가 찾아야겠어."
