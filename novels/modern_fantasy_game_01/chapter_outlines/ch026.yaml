chapter_n: 26
overall: |
  한도혁의 방문 거절 이후 백화의 보복이 본격화된다.
  거래처 압박이 극에 달하고 길드원들 사이에 이탈 움직임이 나타난다.
  김태석이 이준에게 비밀리에 의뢰를 하며 1막의 위기가 고조된다.

beats:
  - name: pressure
    instruction: |
      이 부분은 26화의 시작. 분량 1,800자 이상.
      - 3일이 지났다. 한도혁 방문 후 백화의 압박이 가속화.
      - 거래처 계약 취소 누적 12곳. 철혈의 월 수입이 60% 감소.
      - 길드원 3명이 이직 의사를 밝힘. D급 2명, E급 1명. 백화에서 접촉.
      - 김태석이 전 직원 회의 소집. "누구든 원하면 가도 된다. 하지만 철혈은 문을 닫지 않는다."
      - 이준이 마나 감지로 회의실 안의 분위기를 읽는다. 불안, 분노, 그리고 소수의 결의.
      - 세린이 이준 옆에 앉아 속삭인다. "김태석 길드장님이 무리하는 거야. 이 정도 압박이면 대형 길드도 버티기 어렵거든."
      - 이준이 퀘스트 완료 후 철혈이 여전히 위기에 처해 있다는 것을 깨닫는다. 퀘스트는 끝났지만 전쟁은 시작된 것이다.
      - 마지막 줄: 회의가 끝난 후 김태석이 이준에게 "이준 씨, 잠깐 와줄 수 있나?"라고 부른다.

  - name: secret_request
    instruction: |
      이 부분은 26화의 중반. 분량 1,800자 이상.
      - 김태석의 사무실. 문을 닫고 둘만 남는다.
      - 김태석이 이준을 직시하며 "나는 네가 F급이 아니라는 걸 알아"라고 말한다.
      - 이준이 긴장하지만 김태석은 계속한다. "C급 세 명을 기절시킨 게 우연이 아니라는 건 A급인 내가 모를 리가 없지."
      - 김태석: "물어볼 게 하나 있어. 네가 철혈을 지킬 수 있어? 정말로."
      - 이준이 대답을 고민한다. 레벨 5, STR 25, DEX 30. B급과 싸우는 건 무리지만 감지와 정보 수집으로는 도움이 된다.
      - 이준: "제가 할 수 있는 건 감시와 정보예요. 직접 싸우는 건 무리지만 백화의 움직임을 읽는 건 할 수 있어요."
      - 김태석이 고개를 끄덕이며 의뢰를 건넨다. "백화가 다음에 무엇을 할지 알아내줘. 그리고 가능하다면 길드원들을 안심시켜줘."
      - 김태석이 이준에게 A급 길드장의 신뢰를 표명. "넌 철혈의 사람이야."
      - 마지막 줄: 이준이 사무실에서 나오며 김태석이 자신의 비밀을 알고 있다는 것에 부담과 동시에 든든함을 느낀다.

  - name: donghyun_report
    instruction: |
      이 부분은 26화의 마지막. 분량 1,800자 이상.
      - 시점 전환. 백화 본사 38층. 서동현의 사무실.
      - 서동현이 한도혁에게 보고. "강이준에 대한 조사 결과입니다."
      - 핵심 발견: 이준의 3일간 던전 실종 기록의 상세 분석. 부상만으로 3일 만에 탈출은 이례적.
      - 서동현이 조심스럽게 "박세진 씨와 구조적으로 유사합니다"라고 보고.
      - 한도혁의 반응: 미소. "구조적으로 유사하다. 같은 패턴이 반복되는 거군."
      - 한도혁이 서동현에게 추가 지시. "강이준의 일상을 전부 파악해. 가족, 동선, 연락처, 모든 것."
      - 서동현이 망설이며 "가족까지 파악하는 건..."이라고 말하지만 한도혁은 시선으로 막는다.
      - 서동현이 보고서를 정리하며 나간 후 한도혁이 혼자 창밖을 바라본다.
      - 한도혁의 독백: "세린이 있구나. 박세린. 그리고 그 옆에 강이준. 세진의 복수를 하는 건가." (웃음)
      - 한도혁이 전화를 건다. "강이준 감시 강화해. B급 두 명에서 네 명으로 늘려. 그리고..."
      - 마지막 줄: 한도혁이 전화를 끊으며 "재미있네"라고 중얼거린다.
