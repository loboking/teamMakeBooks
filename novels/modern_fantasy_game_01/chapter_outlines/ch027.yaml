chapter_n: 27
overall: |
  이준이 김태석의 의뢰를 받아 백화의 움직임을 적극적으로 감시한다.
  마나 감지와 진명 감지를 병행하며 감시자를 따돌리고 백화의 다음 공격 징후를 포착한다.
  한편 한도혁의 가족 조사가 진행되고 이서 주변에서 수상한 인물이 발견된다.

beats:
  - name: surveillance
    instruction: |
      이 부분은 27화의 시작. 분량 1,800자 이상.
      - 이준이 백화의 움직임을 감시하기 시작. 김태석의 의뢰에 따라.
      - 마나 감지 200m + 진명 감지 500m를 병행 가동. 두 감지 시스템의 차이를 체감.
      - B급 감시자 4명(한도혁 지시 후 증원)이 이준의 동선을 따라온다.
      - 이준이 감시자들의 패턴을 분석. 교대 시간, 위치, 시선 방향.
      - DEX 30과 마나 감지를 활용해 감시를 역추적. 감시자들이 어디서 출발하는지, 누구에게 보고하는지.
      - 이준이 감시자 한 명의 동선을 따라 백화의 안전한 집(?) 위치를 파악.
      - 세린과 정보 공유. "백화가 감시 거점을 3곳 운영하고 있어. 길드 건물 주변 2곳, 이준의 집 주변 1곳."
      - 마지막 줄: 이준이 감시 거점 정보를 김태석에게 보고하며 "백화가 움직이기 전에 우리가 먼저 움직여야 해요"라고 말한다.

  - name: family_threat
    instruction: |
      이 부분은 27화의 중반. 분량 1,800자 이상.
      - 오후. 이준이 어머니가 입원한 병원에 방문.
      - 병원에서 마나 감지가 반응. 평범한 병원에는 없는 C급 마나.
      - 이준이 C급 마나의 위치를 추적. 병원 로비에 30대 남자가 앉아 있다.
      - 남자는 환자복을 입고 있지 않고 병원 직원도 아니다. 평범한 양복.
      - 이준이 마나 감지로 남자의 행동 패턴을 읽는다. 이준의 어머니가 입원한 병동 쪽을 주시.
      - 이준의 심장이 뛴다. 백화가 어머니를 타겟으로 삼고 있다.
      - 이준이 병원 로비를 지나 어머니의 병실에 들어간다. 어머니는 약 때문에 잠들어 있다.
      - 이준이 병실 창밖으로 C급 남자를 확인. 남자는 여전히 로비에 앉아 있다.
      - 이준이 세린에게 메시지를 보낸다. "병원에 백화 사람이 있어. C급."
      - 마지막 줄: 세린이 즉시 "어머니 병원 옮겨. 지금 당장."이라고 답장한다.

  - name: relocation
    instruction: |
      이 부분은 27화의 마지막. 분량 1,800자 이상.
      - 이준이 세린과 긴급 대응. 어머니를 다른 병원으로 이송.
      - 김태석에게 상황 보고. 길드장이 "즉시 이송해. A급 헌터가 호위할 수 있는 병원을 찾아."라고 지시.
      - 이준이 어머니를 깨우지 않고 이동. 병원 직원에게 응급 이송 절차로 처리.
      - C급 남자가 이준의 움직임을 감지하고 뒤따르려 하지만 이준이 마나 감지로 선제 회피.
      - 백화의 감시 거점에 이준의 이동 정보가 전달되는 시간차를 이용한 탈출.
      - 이준이 어머니를 김태석이 연락한 비밀 병원(협회 산하 요양 시설)으로 이송 완료.
      - 이준이 새 병원에서 어머니의 옆에 앉아 잠든 어머니를 바라본다.
      - 이서에게 연락. "엄마 병원 옮겼어. 걱정하지 마." 이서가 불안해하지만 이준이 안심시킨다.
      - 이준이 진명 시스템 창을 확인. 단서에 새로운 정보가 추가되어 있다.
      - [경고: 보유자의 근접 관계인이 위협을 받고 있습니다. 보호가 우선 과제입니다.]
      - 마지막 줄: 이준이 어머니의 손을 잡으며 생각한다. 가족을 지키는 것이 가장 먼저 해야 할 일이다.
