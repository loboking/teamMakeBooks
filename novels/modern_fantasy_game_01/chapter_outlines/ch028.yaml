chapter_n: 28
overall: |
  이준이 백화의 감시 교대 시간 공백을 이용해 서쪽으로 향하는 첫 탐색을 시도한다.
  서울 서부에서 진명 감지가 미약한 반응을 포착하고 다른 보유자의 존재를 확인한다.
  하지만 백화도 움직이고 있었고 이준의 부재를 감지한 감시자들이 이서를 타겟으로 삼는다.

beats:
  - name: west_search
    instruction: |
      이 부분은 28화의 시작. 분량 1,800자 이상.
      - 어머니 이송 후 이틀이 지났다. 이준이 서쪽 탐색 계획을 세운다.
      - 김태석에게 "하루 정도 자리를 비워도 되나요?"라고 요청. "서쪽에서 뭔가 확인할 게 있어서."
      - 김태석이 이유를 묻지 않고 "하루면 돼. 돌아와서 보고해"라고 허락.
      - 세린이 동행 제안. "혼자 가면 위험해." 이준이 "빠르게 다녀올게"라고 거절.
      - 이준이 감시자 교대 시간(오전 6시)에 집에서 나와 서쪽으로 이동.
      - 지하철로 서울 서부(홍대/신촌 방향) 이동. 진명 감지를 계속 가동.
      - 신촌역 근처에서 진명 감지가 미약한 반응을 포착. 500m 밖에서 희미한 파동.
      - 이준이 파동의 방향을 따라 이동. 반응이 점점 강해짐.
      - 마지막 줄: 이준이 홍대 앞 거리에서 진명 감지가 200m 거리까지 가까워진 것을 확인하며 심장이 뛴다.

  - name: detection
    instruction: |
      이 부분은 28화의 중반. 분량 1,800자 이상.
      - 이준이 홍대 앞 거리를 걸으며 진명 감지로 파동의 근원을 좁혀간다.
      - 150m, 100m, 80m... 파동이 점점 명확해진다.
      - 진명 감지가 반응하는 것은 분명히 진명 시스템 보유자의 마나 파동이었다.
      - 하지만 이준이 80m 지점에서 멈췄을 때 파동이 갑자기 사라졌다.
      - 보유자가 이준의 감지를 느꼈고 의도적으로 마나를 숨긴 것이다.
      - 이준이 당황하며 주변을 둘러보지만 수백 명의 사람들 사이에서 보유자를 특정할 수 없었다.
      - 마나 감지로 주변을 스캔하지만 F~D급의 일반 마나만 보이고 진명 시스템의 파동은 완전히 사라졌다.
      - 이준이 거리 한복판에 서서 생각한다. 상대도 감지 능력이 있다는 뜻이었다.
      - 이준이 진명 시스템 창을 확인. [경고: 다른 보유자와의 접촉이 시도되었으나 상대가 거부했습니다.]
      - 마지막 줄: 이준이 한숨을 쉬며 "찾긴 했는데..."라고 중얼거리고 핸드폰이 울렸다.

  - name: crisis
    instruction: |
      이 부분은 28화의 마지막. 분량 1,800자 이상.
      - 핸드폰을 본다. 세린의 메시지. "이서 연락 안 돼. 백화가 이서 학교로 갔어."
      - 이준의 심장이 멈추는 것 같았다. 이서. 동생.
      - 이준이 서쪽 탐색을 즉시 중단하고 급히 동쪽으로 이동.
      - 지하철을 타고 이서의 학교로 향하는 동안 마나 감지로 상황을 파악하려 하지만 200m 밖이라 반응 없음.
      - 세린에게 전화. "이서 학교에 백화 사람이 있어?" 세린: "감시자 두 명이 학교 정문 앞에서 이서를 기다리고 있어. B급 한 명, C급 한 명."
      - 이준이 지하철에서 내려 전력 질주. DEX 30의 속도로 학교까지 달린다.
      - 학교 정문 앞에 도착. 마나 감지로 B급 한 명, C급 한 명 확인. 두 명 모두 이준의 부재를 기다렸던 것처럼 학교 정문 앞에 대기.
      - 하지만 이서는 이미 학교 안에 있었고 수업 중이었다. 백화가 이서를 밖으로 끌어내려는 것이었다.
      - 이준이 세린과 합류. "이서를 어떻게 하지?" 세린: "수업 끝나기 전에 이서를 빼내야 해."
      - 마지막 줄: 이준이 학교 담장 너머로 마나 감지를 뻗으며 B급 감시자의 마나를 읽고 어떻게 이서를 빼낼지 계산한다.
