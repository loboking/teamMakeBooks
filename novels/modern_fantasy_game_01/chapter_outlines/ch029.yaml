chapter_n: 29
overall: |
  이준과 세린이 이서를 학교에서 구출한다.
  B급과 C급 감시자를 피해 이서를 빼내는 작전을 실행하고,
  이서가 백화의 표적이 되었다는 사실을 알게 된다.

beats:
  - name: extraction_plan
    instruction: |
      이 부분은 29화의 시작. 분량 1,800자 이상.
      - 이준과 세린이 학교 담장 옆에서 작전 수립.
      - B급이 정문 앞, C급이 후문 쪽에 배치. 이중 포위.
      - 이준이 마나 감지로 두 명의 위치와 시선을 계속 읽는다.
      - 수업 종료 30분 전. 이준이 계획을 세린에게 설명.
      - "내가 C급을 유인할게. 세린 씨가 후문으로 들어가서 이서를 데리고 나와."
      - 세린이 반대. "B급한테 혼자 드러나면 죽어." 이준: "싸우는 게 아니라 유인하는 거야."
      - 이준의 계획: B급의 시선을 정문에서 멀리 떨어진 곳으로 끌어내기 위해 마나를 일부 노출.
      - 작전 개시. 이준이 학교 반대편으로 이동하며 마나를 의도적으로 확산.
      - B급 감시자의 마나가 이준 쪽으로 향하는 것을 확인.
      - 마지막 줄: B급이 이준을 쫓아 학교 정문에서 멀어지고 세린이 후문으로 진입한다.

  - name: extraction_exec
    instruction: |
      이 부분은 29화의 중반. 분량 1,800자 이상.
      - 세린이 후문으로 들어가 교무실로 이동. 이서의 담임에게 "가족 사정으로 조기 귀가" 요청.
      - 이서가 교실에서 나와 세린과 마주침. 이서의 얼굴에 놀라움.
      - "박세린 언니? 왜 여기 있어?" 세린: "이서야, 지금 나와. 질문은 나중에."
      - 이서를 데리고 후문으로 이동하는 동안 마나 감지로 C급의 위치 확인.
      - C급이 아직 후문 근처에 있었지만 정문에서 B급이 이준을 쫓아 멀어진 사이 시간이 있음.
      - 세린이 이서를 데리고 후문에서 빠져나옴.
      - 이준이 B급을 교외까지 유인한 후 마나를 숨기고 방향을 바꿔 세린과 합류.
      - 합류 지점에서 이서가 이준을 보며 "오빠?! 왜 다들 여기 있어?"라고 소리침.
      - 이준이 이서를 진정시키며 "이야기할 게 있어. 먼저 안전한 곳으로 가자"라고 말한다.
      - 마지막 줄: 세 사람이 택시를 잡아 이동하는 동안 이서가 불안한 눈으로 오빠를 바라본다.

  - name: aftermath_revelation
    instruction: |
      이 부분은 29화의 마지막. 분량 1,800자 이상.
      - 안전한 장소(김태석이 준비한 길드 내 숙소)에서 이준이 이서에게 상황 설명.
      - 이준이 "엄마 병원 옮겼어. 그리고 백화라는 길드가 우리 가족을 위협하고 있어"라고 말한다.
      - 이서의 반응. 처음에는 이해하지 못하다가 분노와 공포가 섞인 표정.
      - "그래서 학교에 사람이 온 거야? 날 해치려고?"
      - 이준이 "아무도 널 해치게 안 해. 내가 지킬게"라고 말한다.
      - 이서가 울지 않으려는 표정으로 "오빠, 뭔가 숨기고 있지?"라고 말한다.
      - 이준이 침묵. 이서는 누치챌 정도로 똑똑했다.
      - 이준이 결심하며 "나중에 다 말해줄게. 지금은 네가 안전한 게 먼저야"라고 말한다.
      - 세린이 "이서는 여기 있어. 철혈 길드가 보호해줄 거야"라고 안심시킨다.
      - 이서가 고개를 끄덕이며 눈물을 참는다.
      - 이준이 밖으로 나와 밤하늘을 올려다본다.
      - 진명 시스템 창: [퀘스트 업데이트 — 새 퀘스트: 가족의 보호 / 현재 위협도: 최고 / 보상: 진명 시스템 단계별 해금]
      - 마지막 줄: 이준이 주먹을 쥐며 생각한다. 이제 도망칠 수 없다. 싸워야 한다.
