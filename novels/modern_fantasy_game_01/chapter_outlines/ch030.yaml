chapter_n: 30
overall: |
  1막의 마지막 화. 백화가 철혈에 최후의 물리적 공격을 감행하고
  이준이 비밀의 일부를 길드원들 앞에서 드러내며 철혈을 지킨다.
  1막의 모든 떡밥을 정리하며 2막으로의 다리를 놓는다.

beats:
  - name: final_attack
    instruction: |
      이 부분은 30화의 시작. 분량 2,000자 이상.
      - 밤. 이준이 길드에 돌아온 직후, 마나 감지가 다수의 마나 반응을 포착.
      - B급 4명, C급 6명. 총 10명의 백화 인력이 철혈 길드 건물을 포위.
      - 이것은 감시가 아니라 공격이었다. 백화의 최후통첩.
      - 김태석이 길드원들에게 대피 지시. 비전투원 먼저 대피.
      - 이준이 마나 감지로 배치를 읽으며 상황 분석. 정문 3명, 후문 2명, 측면 3명, 옥상 접근 2명.
      - 김태석이 "내가 정문을 맡는다"라고 말하며 A급의 마나를 폭발.
      - 세린이 단검을 들고 이준 옆에 선다. "같이 싸워."
      - 이준이 퀘스트 상태 확인. [가족의 보호 / 위협도: 최고]. 가족은 이미 안전.
      - 마지막 줄: 건물 밖에서 백화의 인력들이 철혈 길드를 에워싸기 시작한다.

  - name: revelation
    instruction: |
      이 부분은 30화의 중반. 분량 2,000자 이상.
      - 백화의 B급 대표가 확성기로 "김태석 길드장님, 마지막 기회입니다. 편입하시면 모든 게 끝납니다"라고 선언.
      - 길드원들이 패닉에 빠지지만 김태석이 A급의 위압으로 진정시킨다.
      - 이준이 결심. 길드원들 앞에서 비밀의 일부를 드러내기로 한다.
      - 이준이 마나 감지를 최대치로 켜고 모든 길드원들이 이준의 마나를 느낀다.
      - F급의 마나가 아니었다. 마나 감지가 보여주는 이준의 마나는 F급의 범주를 넘어서 있었다.
      - 김태석이 이를 눈치채고 "이준아, 네가..."라고 말하지만 이준이 고개를 저으며 계속.
      - 이준이 길드원들에게 말한다. "백화의 사람들이 열 명이에요. 하지만 그들의 위치와 배치, 약점은 전부 제가 읽고 있어요."
      - 마나 감지로 백화 인력의 위치를 하나씩 읽어주며 길드원들에게 정확한 정보 제공.
      - "정문 B급 한 명은 왼쪽 무릎에 3개월 전 부상. 후문 C급 두 명은 사이 간격 5미터. 측면 B급은 마나가 불안정해요."
      - 길드원들의 표정이 변한다. 이 F급 짐꾼이 모든 것을 읽고 있다.
      - 마지막 줄: 이준이 "제가 길을 안내할게요. 싸우는 건 김태석 길드장님과 세린 씨. 저는 눈이 됩니다"라고 선언한다.

  - name: resolution
    instruction: |
      이 부분은 30화의 마지막. 분량 2,000자 이상.
      - 이준의 정보와 김태석·세린의 전투력으로 백화 인력을 격퇴.
      - 이준이 실시간으로 적의 위치와 약점을 읽어주며 B급 한 명이 김태석에게, C급 세 명이 세린에게 제압당함.
      - 나머지 백화 인력이 퇴각하고 이준이 마나 감지로 그들의 철수를 확인.
      - 전투 종료. 길드 건물에 정적.
      - 김태석이 이준을 바라보며 "완전한 F급은 아니었구나"라고 말한다.
      - 세린이 미소를 지으며 이준의 어깨를 두드린다.
      - 이준이 밖으로 나가 밤하늘을 올려다본다. 1막이 끝났다.
      - 진명 시스템: [가족의 보호 / 1단계 완료 / 보상 해금: 마나 은폐 해제 — 선택적 마나 방출 가능].
      - 새로운 능력: 마나를 의도적으로 노출하거나 숨길 수 있게 됨.
      - 이준이 2막을 예감하며 생각한다. 이것은 시작에 불과했다.
      - 마지막 줄: 서울의 밤하늘 아래, 강이준이 다시 걸어간다. 등 뒤에는 철혈이, 앞에는 백화가, 그리고 더 먼 곳에는 아직 만나지 못한 동류자가 있다.
