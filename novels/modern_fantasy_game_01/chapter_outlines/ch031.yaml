chapter_n: 31
overall: |
  2막의 시작. 백화 공격의 여파로 철혈 길드 내부가 들끓고,
  이준의 비밀 노출에 대한 길드원들의 반응이 갈라진다.
  이준이 세린에게 진실의 일부를 공유하기로 결심한다.

beats:
  - name: aftermath_guild
    instruction: |
      이 부분은 31화의 시작. 분량 2,000자 이상.
      - 백화 공격 다음 날 아침. 철혈 길드 건물 안은 어수선하다.
      - 길드원들이 삼삼오오 모여 밤사이 있었던 일을 수군거린다.
      - 핵심 화제: "그 F급 짐꾼이 마나를 뿜어냈다?", "적의 위치를 다 읽었다며?", "도대체 뭔데?"
      - 이준이 1층 로비를 지나가는데 길드원들의 시선이 다르다. 경계와 호기심이 뒤섞인 눈빛.
      - C급 길드원 한 명이 이준에게 다가와 묻는다. "이준 씨, 어젯밤 그거... F급이 아니었어요?"
      - 이준이 대답을 피하며 "전 마나 감지 정도만 할 수 있어요. 그 이상은 아무것도 아니에요"라고 말하지만 설득력이 없다.
      - 다른 길드원이 끼어든다. "그건 F급 능력이 아냐. C급 이상은 되야 마나 감지가 가능한데."
      - 이준이 긴장하지만 표정을 유지한다.
      - 길드원 사이에 두 가지 반응이 나뉜다. 한쪽은 "이준이 우리를 구했잖아. 감사해야지." 다른 한쪽은 "비밀을 숨기고 있었어? 믿을 수 있나?"
      - 신뢰의 균열이 시작된다. 30화의 영웅적 순간이 오히려 의심을 낳는 아이러니.
      - 김태석이 로비에 나타나 길드원들을 진정시킨다. "오늘 긴급 길드 회의를 연다. 모든 길드원 참석."
      - 이준이 회의에 참석해야 하는지 망설인다. 김태석이 이준에게 눈짓으로 참석을 지시.
      - 마지막 줄: 회의실 안에서 김태석이 입을 열려는 순간, 세린이 이준 옆에 조용히 앉으며 속삭인다. "이준 씨. 나랑 이야기해요."

  - name: guild_meeting_and_tension
    instruction: |
      이 부분은 31화의 중반. 분량 2,000자 이상.
      - 길드 회의 시작. 김태석이 밤사이의 전투 결과를 보고한다.
      - "백화 인력 10명 격퇴. 아군 부상자 없음." 길드원들에게 안도감이 퍼지지만 곧 긴장으로 대체.
      - 김태석이 이준의 역할에 대해 말한다. "어젯밤 전투에서 이준이 마나 감지 능력으로 적의 위치와 약점을 파악했다. 그 정보가 없었다면 우리는 큰 피해를 입었을 것이다."
      - 길드원 한 명이 손을 든다. "길드장님. 이준 씨가 F급이 아니라면 등급 조작은 협회법 위반 아닙니까?"
      - 이 질문에 회의실이 술렁인다. F급 위장이 범죄라는 것은 모든 헌터가 아는 사실.
      - 김태석이 단호하게 말한다. "이준의 등급 조작 여부는 내가 확인한다. 지금 중요한 건 그게 아니라 백화의 다음 공격에 대비하는 것이다."
      - 하지만 분위기가 완전히 가라앉지는 않는다.
      - 이준이 회의 중 진명 시스템을 확인한다. [퀘스트: 가족의 보호 / 2단계: 길드 내 신뢰 확보 / 진행도: 45%]. 길드원들의 신뢰가 퀘스트의 일부였다.
      - 회의가 끝나고 길드원들이 흩어지는데 이준의 주변만 비어있다. 아무도 이준에게 말을 걸지 않는다.
      - 이준이 복도를 걷는데 한 D급 길드원이 다가온다. "이준 씨. 어젯밤 고마웠어요. 저 후문에 있었는데... 정보가 없었으면 죽을 뻔했어요."
      - 이준이 "아니에요"라고 말하지만 D급 길드원이 진지하게 말한다. "F급이든 뭐든 상관없어요. 살려줬잖아요."
      - 작은 신뢰의 씨앗. 하지만 대다수의 길드원은 여전히 이준을 경계하고 있다.
      - 이준이 자신의 방에 돌아와 창밖을 바라본다. 백화는 물러났지만 위협은 끝나지 않았다.
      - 진명 시스템이 새 알림을 띄운다. [시스템 안내: 신뢰 관계 구축이 전투 능력보다 장기적 생존률에 영향을 미칩니다. 비밀을 공유할 대상을 선택하세요.]
      - 이준이 고민한다. 누구에게 말할 것인가. 김태석? 세린?
      - 김태석은 A급이고 길드장이다. 하지만 그만큼 기대도 크고 실망도 클 것이다. 이준의 진짜 정체를 아는 것은 김태석에게 무거운 짐이 될 수 있다.
      - 반면 세린은... 세린은 이미 의심하고 있었다. 이준이 숨기고 있다는 것을 알고 있었고 그럼에도 곁에 있었다.
      - 이준이 결심한다. 세린에게 먼저 말하자. 그녀는 이미 준비가 되어 있을 것이다.
      - 마지막 줄: 노크 소리. 이준이 문을 열자 세린이 서 있었다. "이야기하죠."

  - name: decision_to_confide
    instruction: |
      이 부분은 31화의 후반. 분량 2,000자 이상.
      - 세린이 이준의 방에 들어온다. 이준이 의자에 앉고 세린이 창가에 기대어 선다. 두 사람 사이에 침묵.
      - 세린이 먼저 입을 연다. "처음 만났을 때부터 알았어요. 이준 씨가 F급이 아니라는 거."
      - 이준이 놀라서 세린을 바라본다.
      - 세린이 계속한다. "던전에서 죽은 줄 알았을 때... 그 이후에 다시 만났을 때. 이준 씨 눈이 달라져 있었어요. 그때는 확신은 아니었지만, 느꼈어요. 뭔가 변한 게 있다고."
      - 이준이 세린의 말에 답하지 않는다. 대신 묻는다. "왜 그때 말 안 했어요?"
      - 세린이 쓴웃음을 짓는다. "말하면 어땠을까요? 이준 씨가 숨기고 싶어 하는 게 있다면, 내가 먼저 꺼내는 게 답이 아니라고 생각했어요. 기다렸어요. 이준 씨가 스스로 말할 때까지."
      - 이준이 마음이 무거워진다. 세린이 자신을 위해 기다려주었다는 것, 그리고 그 기다림이 이제 끝났다는 것.
      - 이준이 입을 연다. "세린 씨. 저... 말할 게 있어요."
      - 세린이 조용히 이준을 바라본다.
      - 이준이 말을 시작하려 하지만 망설인다. 진명 시스템의 존재를 말할 것인가? 아니다. 아직은 아니다. 그것만큼은 말할 수 없다.
      - 이준이 선택한 답변: 늦깎이 각성. "저... F급으로 각성했을 때 진짜 F급이었어요. 그런데 몇 달 전에... 다시 각성이 일어났어요."
      - 세린의 눈이 미세하게 좁아진다. 의심하는 눈인지 확인하는 눈인지 판단하기 어렵다.
      - 이준이 계속한다. "늦깎이 각성이에요. 두 번째 각성. 처음에는 감지 정도만 가능했는데... 점점 능력이 커지고 있어요. 저도 정확히 뭔지 모르겠어요."
      - 절반은 진실, 절반은 거짓. 이준의 능력이 진명 시스템에서 비롯된 것은 맞지만 '늦깎이 각성'이라는 표현은 이준이 만들어낸 방패였다.
      - 세린이 한동안 침묵하다가 묻는다. "그래서 등급을 속인 거예요?"
      - 이준이 고개를 끄덕인다. "협회에 F급으로 등록되어 있으면 던전에서 짐꾼으로 일할 수 있어요. C급 이상으로 재등급을 받으면... 그때부터 모든 게 달라져요. 백화 같은 길드가 관심을 가지게 되고, 다른 길드에서도 영입하려 하고... 저는 그게 싫었어요."
      - 세린이 이준의 말을 곱씹는다. 늦깎이 각성. 두 번째 각성. F급에서 능력이 커지고 있다. 이 줄거리는 논리적으로 들렸다. 현실에도 극히 드물게 두 번 각성한 사례가 있었다. 불가능한 이야기는 아니었다.
      - 하지만 세린은 완전히 납득하지는 않았다. 무언가 빠져 있다는 느낌. 이준의 눈에 여전히 더 깊은 비밀이 숨어 있다는 직감.
      - 하지만 세린은 그것을 추궁하지 않는다. 지금 이준에게 필요한 것은 심문이 아니라 신뢰였다.
      - 세린이 입을 연다. "알겠어요. 늦깎이 각성. 지금은 그걸로 충분해요."
      - 이준이 안도의 숨을 내쉰다.
      - 세린이 마지막으로 덧붙인다. "하지만 이준 씨. 언젠가는 전부 말해줘야 해요. 전부."
      - 이준이 세린을 바라본다. B급 어쌔신의 눈에는 단호함과 함께 따뜻함이 서려 있었다.
      - 마지막 줄: 세린이 문을 열고 나가기 직전, 돌아보며 말한다. "나는 이준 씨 편이에요. 그건 어젯밤 전에도, 지금도, 앞으로도 변하지 않아요." 문이 닫히고 이준이 혼자 남는다. 진명 시스템이 떠오른다. [퀘스트 업데이트: 가족의 보호 / 2단계 진행도: 65% — 신뢰 관계 구축 중].
