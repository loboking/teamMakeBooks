chapter_n: 32
overall: |
  이준과 세린의 본격적인 대화. 이준이 세린에게 "늦깎이 각성"이라는
  방패를 내보이며 비밀의 일부를 공유하고, 세린이 그 이면을 읽어내며
  이준을 지키기로 결심한다. 백화의 한도혁이 움직이기 시작한다.

beats:
  - name: serin_investigation
    instruction: |
      이 부분은 32화의 시작. 분량 2,000자 이상.
      - 이준과 세린의 대화 다음 날. 세린이 자신의 방에서 이준에 대해 정리하고 있다.
      - 세린이 노트에 이준에 대해 알고 있는 것을 적는다. B급 어쌔신의 분석력.
      - 첫 번째 만남: 던전. F급 짐꾼으로 합류. 사고로 죽은 줄 알았다.
      - 재회: 철혈 길드에서 다시 만남. 이준의 눈빛이 달라져 있었다. 투쟁심이 생겼다.
      - 마나 감지: 200미터 범위. F급으로는 불가능. 최소 C급 이상의 감지 능력.
      - 백화 공격 시: 적의 위치, 부상, 심리 상태까지 읽었다. 단순한 마나 감지를 넘어선다.
      - "늦깎이 각성"이라고 했다. 논리적으로 가능한 이야기. 하지만...
      - 세린이 펜을 멈추며 생각한다. 늦깎이 각성이 실제로 일어난다면, 능력이 '점점 커지고 있다'는 것도 맞다. 하지만 이준의 능력 성장 속도는 비정상적으로 빠르다. 몇 달 사이에 F급 감지 수준에서 B급 이상의 정보 분석 수준으로. 그것은 단순한 각성만으로는 설명되지 않는다.
      - 무언가 다른 시스템이 있다. 세린의 직감이 말한다. 이준은 자신의 능력의 근원을 숨기고 있다. '늦깎이 각성'은 증상에 대한 설명이지 원인에 대한 설명이 아니다.
      - 하지만 세린은 추궁하지 않기로 한다. 이전 밤에 약속했듯이, 지금은 그것으로 충분하다.
      - 세린이 노트를 접고 창밖을 본다. 백화가 물러났지만 한도혁이 가만히 있을 리 없다.
      - 세린이 이준에게 연락한다. "이준 씨, 오늘 밤 길드 뒷편 카페에서 만나요. 늦깎이 각성에 대해 더 알아야 할 게 있어요."
      - 이준이 수락한다.
      - 장면 전환. 한도혁의 집무실. 백화 회장이 보고를 받고 있다.
      - "철혈 공격 실패. B급 4명 전원 패배. C급 6명 중 3명 부상." 부하의 보고에 한도혁이 테이블을 두드린다.
      - "그 F급 짐꾼이 마나를 사용했다고?" 한도혁의 목소리에 감정이 없다. S급의 냉정함.
      - "네. 마나 감지로 저희 인력의 위치와 약점을 실시간으로 파악했습니다."
      - 한도혁이 잠시 생각하다가 입을 연다. "F급이 마나 감지를 사용한다... 두 가지 가능성이 있다. 하나는 등급 조작. 다른 하나는..." 한도혁이 말을 멈춘다.
      - "회장님?"
      - "아무것도 아니다." 한도혁이 의자에서 일어나 창밖을 바라본다. 서울의 스카이라인.
      - "강이준에 대한 조사를 강화해라. 그 아이의 과거, 가족, 학교 기록, 협회 등급 측정 기록. 모든 것을 가져와."
      - 한도혁의 눈에 흥미가 서린다. 단순한 흥미가 아니라, 무언가를 확인하고 싶다는 종류의 흥미.
      - 마지막 줄: 한도혁이 중얼거린다. "F급 짐꾼이... 진명 시스템의 보유자라면 재미있겠군." 그 말은 혼자서만 들었다.

  - name: night_conversation
    instruction: |
      이 부분은 32화의 중반. 분량 2,000자 이상.
      - 밤. 철혈 길드 뒷편 조용한 카페. 이준과 세린이 마주 앉아 있다.
      - 이준이 미리 와서 앉아 있었다. 세린이 5분 뒤 도착. 검은 후드를 쓰고 있었고 카페 안에서도 경계를 늦추지 않는 B급 어쌔신의 습관.
      - 세린이 커피를 시키고 이준을 바라본다. "어제 말한 늦깎이 각성... 더 자세히 알려줘요."
      - 이준이 심호흡을 한다. 어제 세린의 방에서 한 말을 넘어서, 더 구체적인 이야기를 해야 했다.
      - 이준이 늦깎이 각성의 '스토리'를 구체화한다. "던전에서 죽을 뻔한 게 계기였어요. 죽는 순간에 뭔가... 안에서 폭발한 것 같았어요. 깨어나니까 감지 능력이 생겨 있었어요."
      - 세린이 듣고 있다. 표정을 읽기 어렵다.
      - 이준이 계속한다. "처음에는 50미터 정도만 감지됐어요. 그런게 한 달에 한 번씩 늘어나면서... 지금은 200미터까지. 감지뿐 아니라 마나를 읽는 것도 가능해졌어요. 사람의 부상이나 컨디션까지."
      - 세린이 끼어든다. "그건 일반적인 각성이 아니에요. 마나 감지는 보통 감지 범위만 늘어나요. 상대의 컨디션이나 부상까지 읽는 건 해석 능력이라고 불러요. C급에서 B급으로 넘어가는 헌터 중 극소수만 가지는 능력이에요."
      - 이준이 고개를 끄덕인다. "그래서... 저도 어떤 등급인지 모르겠어요."
      - 세린이 커피를 한 모금 마시며 생각에 잠긴다.
      - 세린이 묻는다. "협회에 재등급 신청 안 했어요?"
      - 이준이 고개를 젓는다. "F급이면 던전에서 짐꾼으로 일할 수 있어요. 보수는 적지만... 숨을 수 있어요. 다른 길드나 백화 같은 데서 눈에 띄지 않아요."
      - 세린이 이해한다. 이준이 F급을 유지하는 이유가 단순한 비겁함이 아니라 전략적 선택이라는 것을.
      - 하지만 세린은 하나 더 묻는다. "그럼 어제 밤은 왜 드러냈어요? F급을 유지하면서 숨기면 됐는데."
      - 이준이 잠시 침묵하다가 말한다. "사람들이 죽을 뻔했어요."
      - 그 한 마디에 세린의 표정이 부드러워진다. 이준이 비밀을 지키려다가도 결국 사람을 지키는 쪽을 선택한다는 것. 그것이 이준의 본질이라는 것을 세린은 이미 알고 있었다.
      - 세린이 입을 연다. "이준 씨. 제가 도와줄게요."
      - 이준이 고개를 든다.
      - 세린이 단호하게 말한다. "앞으로 이준 씨의 능력이 더 커지면, 숨기는 게 더 어려워질 거예요. 백화도 이준 씨에게 관심을 가지고 있고, 김태석 길드장님도 의심하고 있어요. 혼자서 모든 걸 짊어지면 언젠가 무너져요."
      - 이준이 반박하려 하지만 세린이 손을 든다. "듣고 있어요."
      - "제가 B급 어쌔신이에요. 정보 수집과 은밀 작전이 제 전문이에요. 이준 씨의 능력을 숨기는 것도, 백화의 움직임을 파악하는 것도 제가 도울 수 있어요."
      - 이준이 세린을 바라본다. 이 사람은 왜 여기까지 해주는 걸까.
      - 세린이 이준의 생각을 읽은 듯 말한다. "이준 씨가 던전에서 저를 구했잖아요. 그때... 죽는 줄 알았을 때, 이준 씨가 몸을 던졌어요. F급 짐꾼이 B급 헌터를 위해. 그때의 빚이 아직 안 갚았어요."
      - 이준이 "빚이 아닌데"라고 말하지만 세린이 고개를 젓는다.
      - 세린이 마지막으로 말한다. "빚이든 아니든, 이준 씨 편이에요. 그러니까 혼자 짊어지지 마."
      - 마지막 줄: 두 사람 사이의 공기가 달라진다. 이제 이준에게는 아는 사람이 아닌 동료가 생겼다. 세린이 손을 내민다. "파트너?" 이준이 그 손을 잡는다.

  - name: new_alliance_and_approaching_threat
    instruction: |
      이 부분은 32화의 마지막. 분량 2,000자 이상.
      - 카페에서 나온 이준과 세린이 길드 숙소로 걸어오며 간단한 암호를 정한다.
      - 이준의 능력에 대해 세린이 알고 있는 것과 모르는 것의 경계를 설정. 세린은 '늦깎이 각성'과 감지 능력은 알지만, 진명 시스템의 존재는 모른다.
      - 세린이 앞으로의 행동 계획을 세운다. "첫째, 백화의 동향 파악. 둘째, 길드 내부에서 이준 씨에 대한 의심을 잠재우기. 셋째, 협회에 이준 씨의 능력이 알려지기 전에 자체적으로 대응할 수 있도록 준비."
      - 이준이 세린의 체계적인 사고에 감탄하면서도 부담을 느낀다. 자신의 비밀이 이제 두 사람의 비밀이 되었다.
      - 길드 숙소에 도착. 이준이 자신의 방으로 돌아가는데 이서가 복도에 서 있다.
      - 이서가 이준에게 다가온다. "오빠. 어제 밤 뭐 있었어? 길드원들 소란스러웠던데."
      - 이준이 "아무것도 아니야"라고 말하려 하지만 이서가 고개를 젓는다.
      - 이서의 눈에 불안이 서려 있다. "오빠가 위험한 거 알아. 엄마도. 나도. 그런데 오빠는 매일 뭔가를 숨기고 있어."
      - 이준이 이서의 머리를 쓰다듬는다. "미안해. 걱정하게 해서."
      - 이서가 묻는다. "오빠... 나한테도 말해줄 수 있어? 언젠가?"
      - 이준이 대답하지 못한다. 이서에게 말할 수 없었다. 적어도 지금은.
      - 이준이 대신 말한다. "언젠가 꼭. 약속할게."
      - 이서가 고개를 끄덕이고 방으로 돌아간다. 이준이 이서의 뒷모습을 바라본다.
      - 진명 시스템이 떠오른다. [퀘스트: 가족의 보호 / 2단계 진행도: 80%]. 거의 완료.
      - 이준이 방에 들어가 진명 시스템을 확인한다. [다음 단계: 가족의 보호 3단계 — 보유자 탐색 시작]. 보유자. 진명 시스템을 가진 다른 사람들.
      - 장면 전환. 한도혁의 집무실.
      - 부하가 보고서를 가져온다. "강이준 조사 결과입니다."
      - 한도혁이 보고서를 넘긴다. 강이준, 22세. 5년 전 F급 각성. 부친 사망. 모친 투병 중. 여동생 1명.
      - "협회 등급 측정 기록을 봤어?" 한도혁이 묻는다.
      - "네. 5년 전 측정 시 마나량이 F급 하위권이었습니다. 그런데..." 부하가 망설인다.
      - "말해봐."
      - "측정 기록에 이상이 있습니다. 5년 전 측정기에 일시적 오류가 발생한 기록이 남아 있습니다. 오류라고 처리되었지만... 지금 보면 이상한 점이 있어요."
      - 한도혁이 미소를 짓는다. S급의 미소. 차갑고 계산적이다.
      - "측정기 오류. 아니면 측정기가 읽을 수 없는 마나." 한도혁이 보고서를 테이블 위에 내려놓는다.
      - "강이준을 더 조사해라. 그리고... 조용히."
      - 마지막 줄: 한도혁이 의자에 앉아 천장을 올려다본다. "진명 시스템의 보유자가 이렇게 가까이 있었다니. 아버지가 말한 게 사실이었나." 백화 회장의 눈에 광기가 서린다.
