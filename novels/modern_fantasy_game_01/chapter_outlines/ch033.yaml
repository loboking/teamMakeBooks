chapter_n: 33
overall: |
  세린이 이준의 비밀을 지키기로 한 후, 두 사람 사이에 새로운 관계가 형성된다.
  정상적인 길드 일상 속에서 세린의 태도가 미묘하게 변하고,
  백화가 물리적 공격에서 경제적 압박으로 전략을 바꾸어 철혈을 조여온다.

beats:
  - name: changed_dynamic
    instruction: |
      이 부분은 33화의 시작. 분량 2,000자 이상.
      - 아침. 백화 공격으로부터 이틀이 지난 철혈 길드. 건물 외벽의 파손은 수리 중이고 길드원들은 평소처럼 움직이지만 공기가 달라졌다.
      - 이준이 아침 일과를 시작. 짐을 정리하고 길드 로비 청소. 여전히 F급 짐꾼의 역할이지만 길드원들의 시선이 달라졌다. 30화 밤의 일을 모두가 기억하고 있었다.
      - 한 D급 길드원이 이준에게 "이준 씨, 저기... 그날 밤 고마웠어요"라고 말하며 고개를 숙인다. 이준이 당황하며 "별거 아닌데요"라고 답하지만 D급은 "별거가 아니었어요. B급 네 명이었는데 우리가 다 죽을 뻔했잖아요"라고 말한다.
      - 세린이 로비에 들어온다. 이준과 눈이 마주치자 세린이 가볍게 미소 짓고 고개를 끄덕인다. 평소와 달랐다. 예전에는 동료로서의 예의였지만 지금은 비밀을 공유한 사람끼리의 묘한 유대감이 묻어 있었다.
      - 이준이 세린에게 다가가 "세린 씨, 잠깐 나와주세요"라고 말하고 두 사람이 길드 건물 뒤편으로 나간다.
      - 뒷골목. 세린이 먼저 입을 연다. "늦깎이 각성이라고 했죠? 나이가 들어서 갑자기 마나가 생겼다고." 이준이 고개를 끄덕인다. 세린이 "거짓말이에요."이라고 말하지만 부드러운 목소리였다.
      - 세린: "늦깎이 각성은 존재해요. 근데 그 정도로 B급의 부상이랑 심리 상태까지 읽어? 그건 감지 스페셜리스트 수준이에요. 나보다 높아요." 이준이 침묵. 세린이 "괜찮아요. 지금 말하고 싶지 않으면 안 해도 돼요. 근데 한 가지 약속해 주세요."
      - 세린이 이준을 똑바로 바라보며 "혼자 다 짊어지지 마세요. 그러다 죽어요." 이준이 세린의 눈에서 진심을 읽는다. 이준이 "알겠습니다"라고 말한다. 짧은 대화였지만 두 사람 사이에 보이지 않는 선이 그어졌다.
      - 로비로 돌아온 두 사람. 김태석이 사무실에서 나오며 이준과 세린을 번갈아 본다. 뭔가 눈치챈 듯하지만 말하지 않는다.
      - 마지막 줄: 이준이 청소를 계속하면서 생각한다. 세린은 눈치챘다. 하지만 드러내지 않았다. 이것이 동료란 걸까.

  - name: economic_pressure
    instruction: |
      이 부분은 33화의 중반. 분량 2,000자 이상.
      - 오후. 김태석이 길드원 전체 회의를 소집. 길드 로비에 모인 길드원들은 열두 명. 공격 이후 두 명이 탈퇴했고 남은 인원이 그것이 전부였다.
      - 김태석이 현황을 설명한다. "상황이 좋지 않다. 물리적 공격은 막았지만 경제적으로 조이고 있다."
      - 백화가 철혈과 거래하던 하청업체 세 곳에게 압력을 넣었다. 철혈과 계약을 끊지 않으면 백화가 그 하청업체를 매장하겠다는 협박. 결과: 세 곳 모두 계약 해지 통보.
      - 길드 운영비의 60%를 차지하던 수입이 사라졌다. 건물 임대료, 길드원 급여, 장비 유지비. 전부 하청 수입으로 충당하던 것들이었다.
      - 한 C급 길드원이 "길드장님, 이러다 우리가..."라고 말을 시작하지만 김태석이 손을 들어 제지.
      - 김태석: "백화가 우리를 편입시키려는 거다. 싸워서 이기지 못하면 경제적으로 질식시킨다. 이건 10년 전 다른 길드들도 겪은 방식이다." 길드원들의 표정이 어두워진다.
      - 이준이 뒤에서 듣고 있다. 마나 감지로 길드원들의 상태를 읽는다. C급 한 명은 마나가 불안정하다. 떠날 생각을 하고 있다. D급 두 명도 비슷한 파동. 길드 붕괴의 조짐이 보이기 시작했다.
      - 세린이 이준 옆에 서서 작게 속삭인다. "이번엔 칼이 아니에요. 돈이에요. 돈은 더 무서워."
      - 회의가 끝난 후 길드원들이 흩어지지만 무거운 침묵이 남는다. 이준이 청소를 하다가 휴지통에서 떨어진 종이를 줍는다. C급 길드원이 쓰다 만 탈퇴 신청서였다. 아직 제출하지 않은 것을 이준은 발견한다.
      - 마지막 줄: 이준이 종이를 찢어버린다. 아직은 멀었다. 하지만 시간은 이준 편이 아니었다.

  - name: first_cooperation
    instruction: |
      이 부분은 33화의 마지막. 분량 2,000자 이상.
      - 저녁. 이준이 길드 숙소에서 이서를 만난다. 이서는 철혈 길드의 분위기를 느끼고 불안해하고 있다.
      - 이서: "오빠, 여기 사람들 되게 조용해졌어. 무서워." 이준이 이서의 머리를 쓰다듬으며 "괜찮아. 길드장님이 계시고 세린 언니도 있어"라고 말한다.
      - 이서가 "오빠도 있잖아"라고 말한다. 이준이 쓴웃음을 짓는다. F급인 자신이 무엇을 할 수 있을지 이서에게 말할 수 없었다.
      - 이준이 숙소를 나와 길드 건물로 돌아간다. 복도에서 세린과 마주친다. 세린이 이준에게 손짓한다. 옥상으로 올라가자.
      - 옥상에서 세린이 이준에게 제안한다. "나한테 맡겨줘. 백화가 경제적으로 조이고 있다면 그 배후를 파악해야 해. 난 어쌔신이니까 정보 수집은 내 전문이야."
      - 이준이 세린의 제안을 듣고 잠시 생각한 후 말한다. "제가 할 수 있는 게 있어요." 세린이 고개를 갸웃한다.
      - 이준이 마나 감지에 대해 설명하지 않고 돌려서 말한다. "제가 사람을 만나면 느껴져요. 그 사람이 적인지 아닌지, 거짓말을 하고 있는지. 그런 거." 세린이 이해한다. "그러면 백화가 접근한 하청업체 담당자들을 만나보면 알 수 있어?"
      - 이준이 고개를 끄덕인다. "계약 해지를 한 사람이 자발적으로 한 건지, 누군가의 압력을 받은 건지. 그걸 알 수 있어요."
      - 세린이 미소를 짓는다. "그럼 내가 미팅 잡을게. 이준 씨가 읽고 내가 움직이는 거야." 첫 번째 협력이 성립된다.
      - 두 사람이 옥상에서 내려온다. 계단에서 세린이 말한다. "이준 씨, 처음 만났을 때는 그냥 귀여운 F급이라고 생각했어요." 이준이 "...감사합니다?"라고 대답하고 세린이 웃는다.
      - 이준이 방으로 돌아와 진명 시스템을 확인. [퀘스트: 가족의 보호 / 2단계 진행 중 / 현재 위협: 경제적 압박].
      - 이준이 창밖을 바라본다. 백화는 칼을 쥐지 않아도 사람을 죽일 수 있다는 것을 이준도 알고 있었다.
      - 마지막 줄: 이준의 마나 감지가 밤거리 너머로 펼쳐진다. 어둠 속 어딘가에서 백화의 다음 수가 움직이고 있었다.
