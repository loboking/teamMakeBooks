chapter_n: 34
overall: |
  철혈 길드의 경제적 위기가 급격히 심화된다.
  계약 해지가 속출하고 길드원들 사이 불만이 폭발하며,
  이준이 마나 감지를 활용해 백화의 공작을 간파하고
  세린과 함께 첫 정보 수집 작전을 실행한다.

beats:
  - name: guild_crisis
    instruction: |
      이 부분은 34화의 시작. 분량 2,000자 이상.
      - 일주일이 지났다. 철혈 길드의 상황은 이준의 예상보다 빠르게 악화되고 있었다.
      - 아침. 길드 로비에 들어서자 이준이 낯선 공허함을 느낀다. 일주일 전에는 있던 사물함 세 개가 비어 있었다. 탈퇴한 길드원들의 흔적이었다.
      - 김태석이 사무실에서 전화를 받고 있다. 이준이 마나 감지로 김태석의 상태를 읽는다. A급의 마나가 평소보다 불안정하다. 긴장과 분노가 섞인 파동.
      - 전화를 끊은 김태석이 이준을 부른다. "이준아, 사무실로 와봐."
      - 김태석이 상황을 설명한다. 이번 주 추가로 세 곳의 거래처가 계약을 해지했다. 백화의 압력이 아니라 "자발적인 판단"이라고 했다. 하지만 김태석은 믿지 않았다.
      - 김태석: "하청업체 대표 중 한 명이 내 아는 사람이야. 15년 동안 거래해왔는데 갑자기 전화도 안 받아. 백화에서 찾아가서 협박한 거야. '철혈과 계약 유지하면 당신 회사를 매장하겠다'고."
      - 이준이 김태석에게 묻는다. "길드장님, 혹시 그 하청업체 대표들을 직접 만날 수 있나요?" 김태석이 이준을 바라본다. "왜?" 이준이 잠시 고민하다가 "제가 한번 만나보면 알 수 있을 것 같아요. 그 사람들이 정말 자발적인 건지, 누군가의 압력인지"라고 말한다.
      - 김태석이 눈을 가늘게 뜨며 이준을 본다. A급의 직감이 이준의 제안背后에 무언가 있음을 감지한 것이다. 하지만 김태석은 추궁하지 않는다. "좋아. 내가 연락해볼게."
      - 오후. 길드원 전체 회의가 다시 소집된다. 남은 길드원은 열 명. 일주일 만에 두 명이 더 떠났다.
      - 한 C급 길드원이 참다못해 소리친다. "길드장님! 이러다 우리 다 죽어요! 백화에 편입합시다! 적어도 살 수는 있잖아요!"
      - 길드원들 사이에 백화 편입 찬반 논쟁이 벌어진다. D급 세 명이 찬성 쪽으로 기울고 있다. C급 한 명은 중립을 지키려 하지만 눈빛이 흔들린다. 세린은 반대 쪽에 서 있지만 말하지 않는다.
      - 김태석이 자리에서 일어난다. "편입하면 백화의 부속품이 된다. 내가 그걸 허락하지 않겠다." 하지만 김태석의 목소리에는 일주일 전과 다른 피로감이 있었다.
      - 이준이 마나 감지로 길드원들의 상태를 읽는다. 찬성파 세 명의 마나가 모두 흔들리고 있다. 공포에서 비롯된 흔들림. 하지만 반대파 두 명은 단단하다. 세린과 한 C급 베테랑.
      - 회의가 끝난 후 길드원들이 흩어지지만 이번에는 침묵이 아니라 불만의 속삭임이 남는다. "편입하는 게 나을지도...", "길드장님이 고집만 부리지...", "이러다 전부 굶어 죽어."
      - 이준이 복도에서 세린과 눈이 마주친다. 세린이 입모양으로 "미팅 잡았어"라고 말한다.
      - 마지막 줄: 이준이 생각한다. 백화는 칼로 사람을 베지 않는다. 먹여 살리는 줄을 끊는다. 그리고 기다린다. 스스로 무너지기를.

  - name: investigation
    instruction: |
      이 부분은 34화의 중반. 분량 2,000자 이상.
      - 다음 날 오후. 세린이 하청업체 대표 중 한 명과 미팅을 잡았다. 강남의 작은 카페. 대표는 50대 남성, 박종인. 철혈과 12년째 거래해온 장비 공급업체 사장이었다.
      - 세린이 이준을 데리고 카페에 도착. 이준은 평범한 옷차림. F급 짐꾼으로 보이기 위한 위장이 아닌, 그냥 눈에 띄지 않기 위한 차림이었다.
      - 박종인이 카페에 들어온다. 세린이 박종인을 알아보고 다가간다. "박 사장님, 철혈 길드 박세린입니다." 박종인의 얼굴에 경계심이 떠오른다. "아... 철혈 길드에서 왔군요. 근데 계약 해지 통보는 이미..." 세린이 손을 저으며 "계약 얘기가 아닙니다. 그냥 인사드리러 왔어요."
      - 세린이 박종인과 자연스럽게 대화를 시작. 박종인이 긴장을 풀기 시작할 무렵, 이준이 마나 감지를 켠다.
      - 이준이 박종인의 마나를 읽는다. 평범한 비헌터의 미약한 마나. 하지만 그 안에 두 가지가 섞여 있었다. 첫째, 두려움. 뼛속까지 스며든 공포. 둘째, 죄책감. 철혈을 배신한 것에 대한 미미한 양심의 가책.
      - 이준이 세린에게 눈짓을 보낸다. 세린이 이해하고 대화를 이어간다. "박 사장님, 혹시 최근에 누가 찾아오셨어요? 철혈 관련해서." 박종인의 표정이 굳어진다.
      - 박종인이 "아무도... 안 왔는데요"라고 말하지만 이준이 마나 감지로 읽는다. 거짓말. 마나 파동이 말과 일치하지 않는다. 말할 때마다 미세하게 마나가 흔들린다.
      - 세린이 부드럽게 밀어붙인다. "사장님, 저희는 적이 아니에요. 오히려 같은 편이에요. 백화가 사장님에게 무슨 말을 했는지 알고 있어요." 박종인의 눈에 당혹감이 스친다.
      - 박종인이 결국 입을 연다. "지난주 수요일... 백화 사람이 왔어요. B급이었어요. 회사에 와서 직원들 앞에서... 철혈과 계약을 끊지 않으면 우리 회사를 아예 없애버리겠다고 했어요. 협회에 불법 거래 의혹을 터뜨리고, 은행 대출을 막고, 거래처에 연락해서 우리를 배제하겠다고..."
      - 박종인의 목소리가 떨린다. "12년이에요. 철혈이 F급이었을 때부터 함께했는데... 죄송해요. 저도 가족이 있어요. 직원들도 있어요. 감당할 수가 없었어요."
      - 이준이 마나 감지로 박종인의 진심을 확인한다. 진심이었다. 죄책감과 두려움 모두 진짜였다. 이 사람은 적이 아니었다. 희생자였다.
      - 이준이 처음으로 입을 연다. "사장님, 미안하다는 말은 하지 마세요. 우리도 알아요. 진짜 적은 사장님이 아니에요."
      - 박종인이 이준을 바라본다. "이 사람은...?" 세린이 "우리 길드원이에요"라고 대답하고 박종인이 고개를 끄덕인다.
      - 마지막 줄: 이준이 생각한다. 백화의 방식이 보인다. 직접 공격은 실패하니까 주변을 갉아먹는다. 그리고 철혈을 고립시킨다. 이것이 한도혁의 두 번째 수.

  - name: uncovering_the_scheme
    instruction: |
      이 부분은 34화의 마지막. 분량 2,000자 이상.
      - 카페에서 나온 후 이준과 세린이 길을 걸으며 정보를 정리한다.
      - 세린: "박 사장 말로는 B급이 직접 찾아왔대. 회사에. 직원들 앞에서." 이준이 고개를 끄덕인다. "그러니까 사장이 거절할 수 없었던 거예요. B급이 비헌터 앞에서 위협하면 그건 사형 선고나 다름없거든요."
      - 세린이 분석한다. "백화는 철혈을 직접 치지 않아요. 주변을 치죠. 거래처, 협력 파트너, 잠재적 동맹. 전부 끊어버리고 철혈을 경제적으로 고립시키는 거예요. 그러면 철혈 길드원들이 스스로 백화에 편입하겠다고 나설 거고, 김태석 길드장님은 혼자 남게 돼요."
      - 이준이 세린의 분석에 한 가지를 더한다. "근데 이상한 게 있어요." 세린이 고개를 갸웃한다.
      - 이준: "백화가 B급을 보내서 하청업체에 압력을 넣고 있어요. 근데 B급 한 명이 한 회사에 가는 건 리스크가 커요. 협회에 신고당할 수도 있고, 다른 길드에 들킬 수도 있어요. 그런데도 백화가 B급을 보냈다는 건..."
      - 세린이 이해한다. "한도혁이 신경 안 쓴다는 뜻이야. 들키든 말든 상관없다는 거지. 그만큼 자신 있다는 뜻이야."
      - 이준이 고개를 끄덕인다. "아니면 더 위험한 거예요. 한도혁이 이번에는 성공할 거라고 확신하고 있다는 뜻이에요. 협회도, 다른 길드도, 아무도 철혈을 도와주지 않을 거라고."
      - 세린이 이준의 말에 침묵한다. 그리고 입을 연다. "그럼 우리가 직접 해야 해요. 백화가 어떻게 경제적 압박을 넣고 있는지 전부 파악하고, 그걸 막을 방법을 찾아야 해."
      - 이준이 진명 시스템을 확인한다. [퀘스트 업데이트: 가족의 보호 / 2단계 — 길드의 보호 / 백화의 경제 공작 간파: 진행 중].
      - 길드로 돌아온 이준. 로비에서 C급 베테랑 길드원 정민호가 이준을 부른다. "이준아." 이준이 다가간다.
      - 정민호가 이준을 조용히 바라보며 말한다. "30화 밤, 네가 마나를 읽을 때 나도 느꼈다. 네가 보통이 아니라는 거." 이준이 긴장한다.
      - 정민호: "걱정 마. 말 안 해. 근데 김태석 길드장님한테는 내가 말할게. 네가 우리 길드에 필요한 사람이라고."
      - 이준이 놀란 표정으로 정민호를 바라본다. 정민호가 어깨를 으쓱하며 "나도 C급 15년째야. 누가 쓸모있는 사람인지는 알아"라고 말하고 돌아선다.
      - 이준이 방에 돌아와 창밖을 바라본다. 백화의 경제 공작, 길드원들의 이탈, 세린과의 협력, 정민호의 신뢰. 모든 것이 동시에 움직이고 있었다.
      - 진명 시스템이 떠오른다. [새로운 스탯 포인트 획득]. 이준이 스탯을 확인한다. WIS 18에서 19로 상승.
      - 마지막 줄: 이준이 생각한다. 백화가 고리를 조이고 있다. 하지만 이준에게는 세린이 있고, 정민호 같은 사람이 있고, 김태석이 있다. 혼자가 아니었다. 처음으로.
