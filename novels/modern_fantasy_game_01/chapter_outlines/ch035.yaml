chapter_n: 35
overall: |
  이준이 백화의 경제적 압박에 대한 반격 계획을 세운다.
  세린의 B급 인맥과 정보망을 활용해 백화의 공작 내부를 파악하고,
  던전에서 새로운 능력을 시험하며 전투력의 폭을 확인한다.

beats:
  - name: counter_plan
    instruction: |
      이 부분은 35화의 시작. 분량 2,000자 이상.
      - 새벽. 이준이 길드 숙소에서 마나 감지를 키고 밖의 상황을 확인.
      - 백화의 물리적 공격은 30화에서 격퇴했지만, 경제적 압박은 계속되고 있다.
      - 김태석이 이준을 찾아온다. 얼굴이 지쳐 있다. "은행에서 대출 연장을 거절당했어. 거래처 세 군데가 계약을 파기했고, 이번 달 길드 운영비가 바닥나."
      - 이준이 마나 감지로 김태석의 상태를 읽는다. A급의 마나가 불안정하다. 수면 부족, 스트레스, 긴장. 김태석이 무너지면 철혈은 끝이다.
      - 이준이 생각을 정리하며 김태석에게 "계약 파기한 거래처, 백화가 압력을 넣은 거예요?"라고 묻는다.
      - 김태석이 고개를 끄덕인다. "직접적인 건 아니야. 하지만 시장에서 백화와 거래하는 회사가 철혈과 계약하면 백화가 보복한다는 소문이 퍼졌어. 소문만으로 충분해."
      - 이준이 세린에게 연락. 세린이 길드로 온다.
      - 이준이 세린에게 "백화의 공작을 파악해야 해요. 돈줄을 끊는 건 백화의 본사에서 지시한 건가, 아니면 지부 단위인가"라고 묻는다.
      - 세린이 B급으로서 가진 정보망에 대해 설명. "과거에 백화 소속이었으니까 연락처는 남아 있어. 하지만 노출되면 위험해."
      - 이준이 세린에게 부탁한다. "정보만. 직접 만나지 않고 연락으로. 위험은 내가 감수할게요."
      - 세린이 잠시 침묵하다가 고개를 끄덕인다. "알겠어. 하지만 네가 F급으로 던전에 들어가서 뭘 하려는 거야?"
      - 이준이 "확인할 게 있어요"라고만 말하고 구체적인 계획은 밝히지 않는다.
      - 김태석이 두 사람의 대화를 듣고 있다가 말한다. "C급 던전 임무가 있어. 주말에. 보수가 꽤 돼. 이준, 너도 가자. F급 한 명 추가해도 입장료는 크게 안 올라가."
      - 이준이 눈을 빛낸다. 던전에서 능력을 시험할 기회.
      - 마지막 줄: 이준이 던전에서 진명 시스템이 부여한 능력을 완전히 시험해보리라 결심하며 창밖을 바라본다.

  - name: dungeon_trial
    instruction: |
      이 부분은 35화의 중반~후반. 분량 2,000자 이상.
      - C급 던전 '암석 동굴'. 이준, 세린, C급 길드원 두 명이 파티를 구성해 입장.
      - 던전 입구에서 세린이 이준에게 속삭인다. "이번엔 솔직하게. 네 능력 어디까지야?"
      - 이준이 "생각보다 훨씬 올라와요. 하지만 아직은 모르겠어요. 이번 던전에서 확인하려고요"라고 대답.
      - 던전 내부 진입. 첫 번째 구역에서 약한 몬스터(C급 하위) 등장.
      - 세린이 전투 준비를 하지만 이준이 먼저 움직인다.
      - 이준이 마나 감지로 몬스터의 공격 패턴을 읽는다. 마나의 흐름이 공격 방향을 예고하고 있었다.
      - 이준이 DEX 30의 민첩성으로 몬스터의 공격을 회피하며 약점을 찌른다.
      - C급 하위 몬스터 세 마리를 이준 혼자서 처리. 세린과 길드원들이 멈춰 선 채로 바라본다.
      - 세린이 중얼거린다. "F급이 아니야..."
      - 이준이 땀을 닦으며 "마나 감지로 움직임을 읽은 거예요. 싸운 게 아니라 피한 거예요"라고 변명.
      - 세린이 그 말을 믿지 않는 표정이지만 말없이 고개를 끄덕인다.
      - 두 번째 구역에서 더 강한 몬스터(B급 하위)가 등장. 이번엔 이준이 전면에 서지 않는다.
      - 대신 마나 감지로 몬스터의 위치와 약점을 실시간으로 세린에게 전달하며 서포트.
      - "세린 씨, 3시 방향. 마나가 오른쪽 앞다리에 집중돼 있어요. 2초 후 공격합니다. 지금 회피!"
      - 세린이 이준의 정보에 맞춰 움직이며 B급 하위 몬스터를 처리.
      - C급 길드원 한 명이 "이준 씨, 완전 정확해요. 레이더 같아요"라고 감탄.
      - 이준이 자신의 능력 폭을 대략 파악한다. 직접 전투보다는 정보 전달로 팀의 효율을 극대화하는 게 지금 단계에서 가장 안전하고 효과적인 방식.
      - 마지막 줄: 던전 클리어 직전, 이준의 마나 감지가 던전 깊은 곳에서 기이한 마나 반응을 포착한다. C급 던전에는 존재해서는 안 될 마나.
