chapter_n: 36
overall: |
  C급 던전 임무 중 이준의 진짜 전투력이 일부 노출될 위기에 처하고
  세린이 즉석에서 커버를 쳐준다.
  두 사람 사이의 신뢰가 깊어지고, 백화의 다음 수가 가시화된다.

beats:
  - name: danger_reveal
    instruction: |
      이 부분은 36화의 시작. 분량 2,000자 이상.
      - 35화 마지막에 감지된 기이한 마나 반응을 추적하는 이준.
      - 세린이 "무슨 마나야?"라고 묻고 이준이 "C급 던전에서는 나올 수 없는 강도예요"라고 대답.
      - C급 길드원 두 명은 보스 방 앞에서 대기하라고 지시. 세린만 이준을 따라 깊은 곳으로 이동.
      - 던전 심층부. 벽에 마나가 맥동하는 것처럼 빛나고 있었다.
      - 이준이 마나 감지로 분석. 이것은 자연 발생한 마나가 아니다. 누군가가 인위적으로 설치한 마나 장치.
      - 세린이 "이건... 함정이야?"라고 말한다.
      - 이준이 "백화가 설치한 건 아닐 거예요. 시기가 안 맞아요. 이건 훨씬 전부터 있었던 것 같아요"라고 분석.
      - 그 순간 마나 장치가 활성화되고 던전의 몬스터들이 폭주하기 시작한다.
      - C급 몬스터 여섯 마리가 동시에 이준과 세린을 향해 돌진.
      - 세린이 전투 자세를 취하지만 수가 너무 많다. B급이라도 여섯 마리를 동시에 상대하는 건 무리.
      - 이준이 순간적으로 판단. 도망칠 수 없다. 마나 장치를 비활성화해야 몬스터들이 진정된다.
      - 이준이 장치 쪽으로 돌진. DEX 30의 속도로 여섯 마리 사이를 뚫고 지나간다.
      - 몬스터 한 마리가 이준의 팔을 할퀴고 피가 튄다. 이준이 군더더기 없이 장치 앞에 도달.
      - 마나 감지로 장치의 구조를 읽고 핵심 노드를 찾아 파괴. 마나 폭주가 멈추고 몬스터들이 쓰러진다.
      - 이준이 팔에 난 상처를 누르며 숨을 돌린다.
      - 그때 뒤에서 C급 길드원 한 명의 목소리가 들린다. "이... 이준 씨가 그 몬스터 사이를 뚫고...?"
      - C급 길드원 두 명이 보스 방에서 뛰어나와 이준의 모습을 목격했다.
      - 이준의 전투력이 F급의 범주를 완전히 벗어나 있다는 것을 그들이 본 것이다.
      - 마지막 줄: 이준이 뒤를 돌아보고 두 길드원의 놀란 얼굴을 마주한다. 비밀이 새어나갈 위기.

  - name: cover_and_trust
    instruction: |
      이 부분은 36화의 중반. 분량 2,000자 이상.
      - 침묵이 흐른다. C급 길드원 두 명이 이준을, 이준을, 다시 상처 입은 몬스터들을 번갈아 본다.
      - 이준이 머리를 굴린다. 어떻게 설명해야 하나.
      - 세린이 먼저 입을 연다. "이준 씨, 운이 좋았네."
      - C급 길드원이 "운? 저 속도로 여섯 마리 사이를 뚫는 게 운이요?"라고 반문.
      - 세린이 웃으며 "이준 씨 원래 DEX가 높아. F급이라도 민첩성 스탯은 C급 수준이거든. 거기다 마나 감지로 몬스터의 움직임을 읽으면 회피율이 확 올라가. 전투력이 높은 게 아니라 안 보이는 길을 찾는 거야."
      - 세린의 설명은 논리적으로 들렸다. F급이라도 특정 스탯이 높을 수 있다는 것은 흔한 일이었다.
      - C급 길드원들이 고개를 끄덕이며 "그랬구나. 마나 감지가 이렇게 쓸모가 있는 줄 몰랐어"라고 말한다.
      - 하지만 한 명의 눈빛에 미묘한 의심이 남아 있었다.
      - 이준과 세린이 눈을 마주친다. 세린이 아주 미세하게 고개를 끄덕인다. 괜찮다는 의미였다.
      - 던전 클리어 후 보상 수령. 이준이 마나 장치에서 파편 하나를 주워 숨긴다.
      - 밖으로 나오는 길. 세린이 이준 옆에서 걸으며 속삭인다. "이번에 커버는 했지만 다음엔 안 돼. 길드원들 사이에서 소문 나면 백화가 알아."
      - 이준이 "알아요. 고마워요"라고 말한다.
      - 세린이 잠시 멈춰 서서 이준을 바라본다. "이준 씨. 네가 정말 뭔지는 모르겠지만, 적어도 철혈을 위험에 빠뜨릴 사람은 아니라는 건 확실해."
      - 이준이 아무 말 없이 고개를 끄덕인다.
      - 마지막 줄: 길드로 돌아오자 김태석이 이준을 부른다. "이준, 백화에서 연락이 왔어. 한도혁 회장이 너를 직접 만나고 싶다고."

  - name: baekhwa_summons
    instruction: |
      이 부분은 36화의 마지막. 분량 2,000자 이상.
      - 김태석의 사무실. 이준, 세린, 김태석이 모여 있다.
      - 김태석이 백화의 연락 내용을 설명. "한도혁이 직접 나왔어. 너를 초대장 형식으로 부르고 있어. 거절하면 다음 단계가 어떻게 될지 모른다고."
      - 이준이 진명 시스템을 확인. [가족의 보호 / 2단계 진행 중 / 백화 회장과의 대면 예고].
      - 시스템이 회장과의 대면을 예고하고 있었다. 회피가 아닌 직면이 예정되어 있었다.
      - 세린이 "함정이에요. 회장이 직접 나오는 건 당근이에요. 백화 회장이 F급을 직접 만날 리가 없으니까. 그가 뭔가 눈치챈 거예요"라고 분석.
      - 김태석이 고개를 저으며 "아니야. 회장이 너를 부른 건 30화에서 네 능력을 보고 난 뒤야. 근데 그건 길드원들밖에 몰라. 소문이 퍼진 거야?"
      - 이준이 "던전에서 길드원 두 명이 봤어요. 세린 씨가 커버는 쳤지만 완벽하진 않을 수 있어요"라고 말한다.
      - 김태석이 심각한 표정으로 "그러면 백화가 네 비밀을 일부 알고 있을 수도 있어"라고 말한다.
      - 이준이 고민에 빠진다. 가지 않으면 백화가 다른 수를 쓸 것이다. 가면 회장이 뭔가를 알고 있을 수 있다.
      - 세린이 "내가 같이 가요"라고 말한다.
      - 이준이 "위험해요"라고 말하지만 세린이 "회장 앞에서 혼자 가면 더 위험해. 두 명이면 최소한 서로 커버가 되잖아"라고 맞선다.
      - 김태석이 "나도 가야겠는데..."라고 말하지만 이준이 "길드장님은 여기 있어야 해요. 백화가 길드에 다시 공격할 수 있어요"라고 말한다.
      - 김태석이 고개를 끄덕이며 "맞아. 내가 빠지면 길드는 무너져"라고 인정한다.
      - 이준이 결심한다. 회장을 만난다. 단, 준비를 하고.
      - 이준이 던전에서 주운 마나 장치 파편을 꺼내 확인. 이 안에 정보가 담겨 있었다. 누군가가 C급 던전에 마나 조작 장치를 심었다는 것. 그것이 백화와 관련이 있는지 확인해야 한다.
      - 이준이 세린에게 "먼저 이 파편을 분석해야 해요. 그리고 회장 앞에 갈 때 카드 하나가 더 필요해요"라고 말한다.
      - 마지막 줄: 이준이 밤하늘 아래 서서 생각한다. 회장과의 대면. 그것이 2막의 다음 국면을 열 것이다. 이준의 주먹에 마나가 응축된다.
