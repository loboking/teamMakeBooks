chapter_n: 37
overall: |
  C급 던전 임무를 마친 이준이 보상을 정리하고 레벨업에 한 걸음 다가서지만,
  백화가 철혈 길드원들을 은밀히 매수하려는 시도가 발각되며 새로운 위기가 고조된다.

beats:
  - name: dungeon_reward
    instruction: |
      이 부분은 37화의 시작. 분량 2,000자 이상.
      - 던전 클리어 후 철혈 길드 임무 텐트. 길드원들이 전리품을 정리하고疲惫한 표정으로 쉬고 있다.
      - 이준이 청소와 정리를 도우며 길드원들 사이를 오간다. 여전히 F급 짐꾼의 역할을 유지하지만, 세린은 이준의 눈빛이 달라졌음을 눈치챈다.
      - 이준이 진명 시스템을 확인. [던전 클리어 보상: 경험치 획득 / 현재 Lv5 → Lv6 진전도 78%]. 레벨업이 임박하다는 것을 느낀다.
      - 시스템 메시지: [새 스킬 획득 조건 충족 — '진명 감지(고급)' 해금 임박. 요구: Lv6 달성 + 마나 감지 300회 이상 사용].
      - 이준이 던전에서 마나 감지를 끊임없이 사용했기 때문에 300회를 이미 초과. 레벨업만이 관문이다.
      - 김태석이 이준을 불러 "이번 임무에서 네가 마나 감지로 위험을 미리 파악해줘서 큰 도움이 됐다"라고 인정한다. 공개적인 자리에서.
      - 다른 길드원들이 "그 F급 짐꾼이?"라며 의아해하지만, 김태석의 A급 권위에 입을 다문다.
      - 이준이 겸손하게 "운이 좋았습니다"라고 말하지만, 속으로 레벨업에 대한 기대감을 느낀다.
      - 세린이 이준에게 귓속말로 "레벨업 임박하지?"라고 묻는다. 이준이 고개를 끄덕인다.
      - 마지막 줄: 이준이 시스템 창을 닫으며 생각한다. 레벨업하면 진명 감지 범위가 더 넓어진다. 백화의 움직임을 더 정확하게 읽을 수 있다.

  - name: bribery_discovery
    instruction: |
      이 부분은 37화의 중반. 분량 2,000자 이상.
      - 던전 정리가 끝나고 길드원들이 텐트에서 휴식. 이준이 마나 감지를 항상 켜둔 습관이 있다.
      - 마나 감지 범위 내에서 익숙한 마나 반응이 하나 포착된다. 철혈 길드원의 마나인데, 그 길드원 주변에 낯선 마나 반응이 하나 있다.
      - 이준이 집중. 낯선 마나 반응의 소유자는 길드원이 아니었다. 던전 외부, 주차장 방향에서 온 사람.
      - 이준이 은밀히 텐트 밖으로 나와 상황을 관찰. 마나 은폐를 유지한 채 다가간다.
      - 철혈 길드의 C급 헌터 박동현이 낯선 정장 차림의 남성과 은밀히 대화하고 있다. 남성의 마나는 B급. 백화의 사람이다.
      - 대화 내용을 엿듣는다. "박동현 씨, 백화에서는 당신의 재능을 높이 평가하고 있습니다. 이직하시면 현재 수입의 3배, 그리고 B급 진급을 위한 던전 우선 배정을 보장합니다."
      - 박동현이 망설이는 표정. "철혈에 대한 의리가..." 남성: "의리? 길드가 무너지면 의리도 같이 무너집니다. 철혈의 재정 상황을 아시잖아요."
      - 이준이 이를 확인하고 김태석에게 보고할지 잠시 고민. 증거가 없다. 대화만 들었을 뿐.
      - 마지막 줄: 이준이 세린을 찾아 상황을 전한다. 세린의 표정이 굳어진다. "백화가 길드원을 색인 거야."

  - name: internal_threat
    instruction: |
      이 부분은 37화의 마지막. 분량 2,000자 이상.
      - 이준과 세린이 상황을 분석. 박동현뿐만 아니라 다른 길드원들에게도 접근했을 가능성이 높다.
      - 세린: "백화는 싸워서 이기려는 게 아니라 안에서 무너뜨리려는 거야. 길드원들을 하나씩 빼가면서."
      - 이준이 마나 감지로 던전 주변을 다시 스캔. 백화의 B급 한 명이 아직 인근에 있다는 것을 확인. 아마 다른 길드원에게도 접근하려는 것.
      - 이준이 결심. 김태석에게 보고하기 전에 먼저 확실한 증거를 모아야 한다.
      - 다음 날, 길드로 복귀하는 버스 안에서 이준이 조용히 길드원들의 반응을 관찰.
      - 박동현의 표정이 불안하다. 그리고 이준은 또 한 명, D급 헌터 최은지의 행동도 달라졌다는 것을 눈치챈다. 최은지가 백화의 매수 제안을 받았을 가능성.
      - 김태석에게 보고. 김태석의 반응은 복잡하다. 분노보다 피로감이 먼저다.
      - "알고 있었다. 최근 몇몇 길드원들이 이상한 연락을 받았다는 얘기를 들었다. 하지만 증거가 없어서..."
      - 이준: "박동현 씨를 목격했습니다. B급과 만나서 이직 제안을 받고 있었습니다."
      - 김태석이 한숨. "박동현이... 그래. 그 녀석은 경제적으로 많이 힘들었지."
      - 진명 시스템: [퀘스트 업데이트 — 길드의 보호 / 난이도: 상 / 목표: 백화의 길드 내부 침투 저지 / 보상: Lv6 달성 시 진명 감지(고급) 즉시 해금].
      - 마지막 줄: 이준이 창밖을 바라본다. 백화는 밖에서 공격하는 게 아니었다. 안에서 썩어들어가고 있었다. 그리고 이준은 그걸 막아야 했다.
