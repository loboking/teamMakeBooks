chapter_n: 38
overall: |
  백화의 매수 시도로 철혈 길드 내에 분열 조짐이 나타나고,
  이준이 길드원들 앞에서 결정적인 행동을 취하며
  F급 짐꾼을 넘어선 존재감으로 길드 내 입지를 굳힌다.

beats:
  - name: guild_division
    instruction: |
      이 부분은 38화의 시작. 분량 2,000자 이상.
      - 철혈 길드 본부. 아침 회의실. 분위기가 가라앉아 있다.
      - 김태석이 길드원 전체 회의를 소집. "최근 백화가 우리 길드원들에게 접근하고 있다는 정보를 확인했다. 모두 경계해달라."
      - 회의실 안의 반응이 엇갈린다. 일부 길드원은 분노하지만, 일부는 시선을 피한다.
      - 박동현이 회의실 구석에 앉아 고개를 숙이고 있다. 이준이 마나 감지로 박동현의 마나를 읽는다. 불안정하다. 갈등하고 있다.
      - C급 헌터 정민호가 손을 든다. "길드장님, 솔직히 말하겠습니다. 저희 월급이 3개월째 밀리고 있습니다. 백화에서 3배를 준다면... 고려해볼 수밖에 없는 게 현실 아닙니까?"
      - 회의실이 술렁인다. 정민호의 말에 공감하는 눈빛이 적지 않다.
      - 김태석이 "나도 알고 있다. 하지만 백화에 가면 너희는 소모품이 된다"라고 말하지만, 설득력이 부족하다. 그의 목소리에 피로가 실려 있다.
      - 이준이 관찰한다. 길드원 23명 중 최소 5~6명이 백화의 제안에 흔들리고 있다. 마나 감지로 그들의 심박과 마나의 흔들림까지 읽을 수 있다.
      - 세린이 이준 옆에서 속삭인다. "이대로면 반으로 쪼개지겠다."
      - 마지막 줄: 이준이 결심한다. 말만으로는 안 된다. 보여줘야 한다.

  - name: decisive_action
    instruction: |
      이 부분은 38화의 중반. 분량 2,000자 이상.
      - 회의가 끝난 후 길드원들이 흩어지고 이준이 복도에서 박동현을 불러 세운다.
      - "박동현 씨. 잠깐 이야기할 수 있겠습니까?"
      - 박동현이 경계하는 눈빛. 이준이 직접적으로 말하지는 않고 돌려서 접근.
      - "동현 씨, 처음 길드에 들어왔을 때가 기억납니다. 김태석 길드장님이 식비까지 대줬던 날."
      - 박동현의 표정이 흔들린다. 그것은 그가 백화의 제안을 받기 전, 철혈이 가족이었던 시절의 기억이었다.
      - 이준이 말을 이어간다. "저도 사정은 압니다. 돈이 필요하고, 앞이 안 보이는 게 무섭죠. 근데 백화에 가면 그분들이 대신 가족이 되어줄 것 같습니까?"
      - 박동현이 침묵. 이준이 계속. "백화의 B급이 동현 씨를 만났을 때 '재능을 높이 평가한다'고 했다고 들었습니다. 그 말의 진짜 뜻은 '쓸모가 있으면 쓰고 없으면 버린다'입니다."
      - 박동현이 이준을 똑바로 본다. "너... F급 짐꾼이 그런 걸 어떻게 알아?" 이준: "짐꾼이어서 사람들의 짐을 보는 눈이 생겼습니다."
      - 박동현이 돌아서며 "생각해볼게"라고 말하고 떠난다. 이준이 마나 감지로 그의 마나를 추적한다. 여전히 흔들리지만, 결정은 내리지 않았다.
      - 이준이 다음 타겟으로 향한다. 정민호에게 접근하는 대신, 다른 방식을 택한다.
      - 마지막 줄: 이준이 김태석에게 찾아가 "한 가지 제안이 있습니다"라고 말한다. 김태석이 피로한 눈으로 이준을 본다.

  - name: proving_ground
    instruction: |
      이 부분은 38화의 마지막. 분량 2,000자 이상.
      - 이준이 김태석에게 제안. "백화가 우리 길드원을 매수하려는 건 우리가 약해 보이기 때문입니다. 보여줘야 합니다. 철혈이 약하지 않다는 걸."
      - 김태석: "어떻게?" 이준: "다음 C급 던전 임무를 제가 기획하겠습니다. 이번엔 짐꾼이 아니라 작전 지휘관으로."
      - 김태석이 웃음을 터뜨릴 뻔하다. "F급이 작전 지휘관?" 이준: "길드장님이 30화에서 제 정보가 실제로 도움이 됐다고 하셨습니다. 그때는 즉흥이었습니다. 이번엔 제대로 해보겠습니다."
      - 세린이 김태석에게 "한 번만 기회를 주십시오"라고 말한다. 김태석이 세린의 눈빛을 보고 고개를 끄덕인다. "...좋아. 한 번이다."
      - 다음 날, C급 던전 임무 팀 집합. 이준이 길드원들 앞에 선다. 길드원들의 불신의 시선.
      - 이준이 말한다. "저는 F급입니다. 싸우지 못합니다. 하지만 보는 건 제가 제일 잘합니다."
      - 이준이 던전 지도를 펼치며 마나 감지로 수집한 정보를 바탕으로 작전을 설명.
      - "이 던전의 3층에 마나 포화 구역이 있습니다. 보통은 우회하지만, 제가 경로를 읽으면 최단 거리로 돌파할 수 있습니다. 시간 반, 위험 반."
      - "4층 보스의 공격 패턴은 3턴 주기입니다. 첫 번째 공격은 오른쪽, 두 번째는 넓은 범위, 세 번째는 약점 노출. 그 틈에 세린 씨가 뒤를 잡으면 됩니다."
      - 길드원들의 표정이 변한다. F급 짐꾼이 던전의 구조와 보스 패턴을 정확하게 설명하고 있다.
      - 정민호가 "어디서 그런 정보를..."이라고 묻자 이준이 "지난 몇 달간 C급 던전에서 짐을 나르면서 모든 걸 봤습니다. 벽의 마나 흐름, 몬스터의 배치, 보스의 패턴. 전부 기억합니다"라고 답한다.
      - 박동현이 그 말을 듣고 표정이 변한다. 이 F급 짐꾼이 매번 던전에서 보이지 않는 노력을 해왔다는 것을 깨닫는다.
      - 김태석이 이준을 보며 작은 미소를 짓는다. 그리고 길드원들에게 "이준의 작전대로 한다"라고 선언.
      - 마지막 줄: 던전 입구 앞에 선 이준. F급 짐꾼에서 작전 지휘관으로. 그의 시스템 창에 [Lv6 진전도 89%]가 떠 있다. 레벨업이 코앞이다.
