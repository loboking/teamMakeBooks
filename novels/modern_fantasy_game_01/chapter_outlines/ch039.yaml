chapter_n: 39
overall: |
  31~40화 구간의 정리 에피소드. 이준-세린-김태석 삼자 관계가 확립되고
  철혈 길드가 일시적 안정기를 맞이하지만, 이서의 불안과 백화의 잠복이
  폭풍 전야의 고요함을 만들어낸다.

beats:
  - name: new_normal
    instruction: |
      이 부분은 39화의 시작. 분량 2,000자 이상.
      - 아침. 철혈 길드 사무실. 한도혁 직접 방문(ch24)과 백화 인력 포위 격퇴(ch30) 이후 일주일이 지남.
      - 길드 분위기가 달라졌다. 이전에는 백화 압박에 쫓기던 길드였지만, 이제는 살아남았다는 자신감이 있다.
      - 김태석이 아침 회의에서 "거래처 세 곳이 다시 연락해왔다"고 발표. 백화의 경제적 봉쇄가 미세하게 풀리는 기미.
      - 하지만 이것이 진정한 회복인지, 백화가 숨을 고르는 것인지는 아무도 모른다.
      - 세린이 이준에게 회의 후 귓속말. "김태석 길드장님이 당신을 더 이상 F급으로 보지 않아요. 조심해야 해. 신뢰가 커질수록 기대도 커지거든."
      - 이준이 길드 복도를 걸으며 길드원들의 시선을 느낀다. 과거에는 무시받던 짐꾼이었지만, 지금은 다른 시선이다. 경외, 호기심, 그리고 약간의 두려움.
      - 신민혁이 이준에게 다가와 "이준 형, 점심 같이 먹자"고 제안. 이준이 승낙.
      - 마지막 줄: 이준이 길드 사무실 창밖을 바라보며 생각한다. 고요하다. 너무 고요하다.

  - name: sister_s_return
    instruction: |
      이 부분은 39화의 중반. 분량 2,000자 이상.
      - 오후. 이준이 이서가 머무는 길드 숙소를 방문. 이서에게 식료품과 학용품을 가져왔다.
      - 이서의 방. 작은 방이지만 세린이 책상과 침대를 정리해둬서 쓸만하다. 이서가 학교 복귀를 고민하고 있다는 것을 안다.
      - 이서가 말한다. "오빠, 나 내일 학교 갈까 봐." 이준이 반대. "아직 위험해."
      - 이서가 눈을 올려본다. "숨기지 마. 학교에 사람이 있었잖아. 근데 날 계속 여기에 가두면 뭐해? 수능 언제 쳐?"
      - 이준이 딜레마에 빠진다. 이서를 보호하고 싶지만, 이서의 삶을 멈추게 할 수는 없다.
      - 이서가 말을 잇는다. "근데 오빠, 진짜 괜찮아? 최근에 오빤 완전 달라졌어. 예전엔 그냥 짐꾼이었는데, 지금은 뭔가... 사람들이 오빠를 다르게 봐."
      - 이준이 "그냥 좀 자신감이 생겼나 봐"라고 얼버무린다. 이서가 "그게 아니야"라고 고개를 젓는다.
      - 진명 시스템이 가동. [가족의 보호 / 진행 중 / 보호 대상: 강이서 / 현재 상태: 불안정].
      - 이준이 결심한다. 내일 이서를 학교에 보내되, 마나 감지를 최대한 활용해 보호하겠다고.
      - 마지막 줄: 이서가 이준의 손을 잡으며 "오빠, 나도 괜찮아. 무섭지만, 그래도 내 일상을 살고 싶어"라고 말한다. 이준이 대답하지 못하고 손만 꽉 쥔다.

  - name: calm_before_storm
    instruction: |
      이 부분은 39화의 마지막. 분량 2,000자 이상.
      - 저녁. 이준이 길드 사무실 옥상에서 혼자 시간을 보낸다.
      - 마나 감지 200m와 진명 감지 500m를 동시 가동. 주변에 이상 반응 없음. 백화의 감시자도 보이지 않는다.
      - 이것이 이준을 더 불안하게 만든다. 감시가 사라진 게 아니라, 방식이 바뀐 거다.
      - 세린이 옥상에 올라온다. 두 사람이 담장에 걸터앉아 밤하늘을 본다.
      - 세린이 말한다. "백화가 한도혁이 직접 나서서 실패했잖아. 물러났을 리가 없어. 오히려 더 조용하고 더 정밀하게 올 거야."
      - 이준이 동의. "나도 그렇게 생각해. 그래서 더 신경 쓰여."
      - 세린이 이준에게 진지하게 묻는다. "이준 씨, 당신 정말 늦깎이 각성이야? 그것만은 아니지?"
      - 이준이 침묵. 세린이 오빠 박세진의 이야기를 꺼낸다. "오빠도 갑자기 강해졌어. C급에서 A급 경계까지. 그리고 2개월 뒤 죽었어. 당신도 같은 길을 걷고 있는 거야?"
      - 이준이 세린의 눈을 본다. 진실을 말하고 싶지만, 아직은 아니다.
      - "나는 괜찮아. 박세진 씨와는 달라. 나는 죽지 않아."
      - 세린이 쓸쓸하게 웃는다. "그 말, 오빠도 했어."
      - 두 사람 사이에 무거운 침묵.
      - 이준이 마나 감지를 다시 확인. 여전히 반응 없음. 하지만 500m 밖에서 — 진명 감지 범위 바로 너머에서 — 아주 미세한 마나 파동이 느껴지는 것 같다. 감지 범위 밖이라 확신은 없다.
      - 마지막 줄: 이준이 옥상 난간을 잡고 어둠 속을 응시한다. 어딘가에서 누군가가 자신을 보고 있다. 그리고 곧, 그 시선은 칼날이 될 것이다.
