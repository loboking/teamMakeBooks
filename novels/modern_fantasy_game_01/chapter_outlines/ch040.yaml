chapter_n: 40
overall: |
  2막 전반부(31~40화)의 마무리. 백화의 서동현이 이준 조사를 본격화하고,
  이준이 진명 감지로 백화의 새로운 감시를 감지한다.
  한도혁 회장이 직접 "철혈 처리"를 지시하며 2막 후반(41~55화)으로의
  클리프행어를 장착한다.

beats:
  - name: investigator
    instruction: |
      이 부분은 40화의 시작. 분량 2,000자 이상.
      - 백화 본사, 서울 강남. 38층 정보수집팀 사무실.
      - 서동현이 책상 위에 빼곡히 쌓인 서류와 모니터 여섯 대 사이에 앉아 있다.
      - 서동현의 최근 2주간 조사 결과. 이준의 던전 기록, 헌터협회 측정 이력, 금융 거래 내역, 가족 관계도, 철혈 길드 내 위치 변화.
      - 서동현이 한도혁에게 보고할 보고서를 마무리 중이다.
      - 핵심 발견을 정리: (1) 이준의 던전 클리어 속도가 3개월 전부터 2배 이상 증가. (2) 3일간 행방불명 기록 존재 — 박세진과 구조적 일치. (3) 최근 전투에서 보여준 능력은 F급 범주를 벗어남. (4) 백화 B급 감시자를 교외 200m까지 유인 후 탈출한 기동력은 C급 하위 수준 최소.
      - 서동현이 안경을 벗으며 혼잣말. "이건 늦깎이 각성이 아니야. 이건... 뭔가 다른 거야."
      - 옆자리 팀원이 묻는다. "팀장님, 한도혁 회장님이 기다리시는데." 서동현이 "알아"라고 답하며 서류를 정리.
      - 서동현이 박세진의 사망 보고서를 다시 본다. 3년 전, 미클리어 던전 폭주. 사인: 던전 붕괴로 인한 질식. 하지만 서동현은 알고 있다. 백화가 폭주를 인위적으로 일으켰다는 것을.
      - 서동현의 내면 갈등. 이 보고서를 한도혁에게 넘기면, 이준은 세진과 같은 길을 걷게 될 것이다. 하지만 넘기지 않으면 자신이 먼저 제거된다.
      - 마지막 줄: 서동현이 보고서를 봉투에 넣고 45층 회장실로 향한다. 엘리베이터가 올라가는 동안 그의 손이 미세하게 떨린다.

  - name: chairman_order
    instruction: |
      이 부분은 40화의 중반. 분량 2,000자 이상.
      - 백화 본사 45층. 한도혁의 집무실. 창밖으로 서울 시내가 한눈에 들어온다.
      - 서동현이 보고서를 한도혁의 책상 위에 놓는. 한도혁이 서류를 넘기며 읽는다. 표정 변화 없다.
      - 한도혁이 읽기를 마치고 서동현을 올려다본다. "3일간의 공백."
      - 서동현: "네. 박세진 씨의 행방불명 기록과 구조적으로 일치합니다. 두 사람 모두 각성 후 약 2주간 접촉 불가 상태였고, 그 이후 급격한 능력 상승을 보였습니다."
      - 한도혁: "결론은?"
      - 서동현이 잠시 망설인다. "강이준은 단순한 늦깎이 각성이 아닐 가능성이 높습니다. 박세진 씨와 동일한... 원인일 수 있습니다."
      - 한도혁이 의자에서 일어난다. 창밖을 바라본다.
      - "세진이 죽은 건 아까워. 진짜 아까운 재료였어. 하지만 통제할 수 없는 건 쓸모가 없지." 한도혁의 목소리는 차갑고 사무적이다.
      - "서동현 팀장. 강이준에 대한 조사를 최우선으로 올려. 모든 수단을 동원해. 가족, 금융, 의료기록, 학교, 과거 5년간의 모든 이동 경로. 하나도 빠짐없이."
      - 서동현: "네, 알겠습니다."
      - 한도혁이 돌아본다. "그리고 철혈 처리 계획을 수립해. 물리적 공격은 실패했으니, 방법을 바꾼다. 김태석은 무시해. 핵심은 강이준이야."
      - 한도혁이 마지막으로 덧붙인다. "세린도 눈여겨봐. 박세진의 여동생이니까. 복수심이 강한 여자는 실수를 저지르기 쉬워."
      - 서동현이 고개를 숙이고 퇴실.
      - 한도혁이 혼자 남아 창밖을 본다. 속삭인다. "진명 시스템... 세진이 마지막에 말했던 그 단어. 설마 두 번째 보유자가 나타난 건가."
      - 마지막 줄: 한도혁의 입가에 미소가 걸린다. 그것은 기쁨이 아니라 사냥꾼의 미소였다.

  - name: detection
    instruction: |
      이 부분은 40화의 마지막. 분량 2,000자 이상.
      - 같은 시각, 밤 10시. 이준이 길드 숙소에서 이서를 잠든 것을 확인하고 밖으로 나온다.
      - 마나 감지 200m 가동. 주변에 D급 수준 마나 반응 2개. 이전까지의 B급 감시와 다르다. 더 낮은 등급, 더 정밀한 배치.
      - 이준이 걸으며 감시자의 위치를 파악. 하나는 길드 건물 맞은편 편의점 앞. 하나는 숙소에서 150m 떨어진 골목.
      - B급이 사라진 대신 D급이 배치된 것은 의미가 있다. 백화가 노골적인 감시에서 은밀한 추적으로 전환한 것이다.
      - 진명 감지 500m 가동. 반응 없음.
      - 이준이 걷기 시작한다. 감시자를 의식하면서도 자연스럽게. 골목을 돌고, 큰길로 나오고, 다시 골목으로 들어간다.
      - 그때, 진명 감지가 미세하게 반응한다. 500m 경계선 바로 안쪽. 아주 희미한 파동. 일반 마나가 아니라 진명 시스템 보유자의 파동.
      - 이준이 멈춘다. 감시자가 아니다. 이것은 다르다. 홍대에서 느꼈던 것과 비슷하지만 다른 파동.
      - 하지만 파동이 10초도 지속되지 않고 사라진다. 누군가가 감지를 느끼고 다시 은폐한 것이다.
      - 이준의 등줄기에 식은땀이 흐른다. 백화가 이것을 알고 있는 것인가? 진명 시스템 보유자를 추적하고 있는 것인가?
      - 핸드폰이 울린다. 세린이다.
      - "이준 씨, 나 지금 길드 건물이야. 김태석 길드장님이 불러서. 무슨 일인지 모르겠는데... 분위기가 이상해."
      - 이준이 "지금 온다"라고 답하고 걷기 시작한다.
      - 걸으면서 마나 감지를 다시 확인. D급 감시자 두 명은 제자리. 하지만 500m 밖에서 — 방금 느꼈던 파동의 방향에서 — 또 다른 마나 반응이 접근하고 있다. B급 이상.
      - 이준의 발걸음이 빨라진다.
      - 마지막 줄: 이준이 어둠 속을 걷는다. 뒤에서는 백화의 눈이, 옆에서는 알 수 없는 파동이, 앞에서는 철혈이 기다린다. 폭풍이 다가오고 있었다.
