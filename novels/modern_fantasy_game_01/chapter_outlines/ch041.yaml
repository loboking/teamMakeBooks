chapter_n: 41
overall: |
  2막 후반부(41~55화)의 시작. 김태석이 긴급 소집한 이유가 백화의
  경제적 압박 재개임이 밝혀진다. 이서의 첫 등교와 이준의 Lv6 레벨업이
  동시에 일어나며, 이준이 능력을 한 단계 끌어올린다.

beats:
  - name: guild_emergency
    instruction: |
      이 부분은 41화의 시작. 분량 2,000자 이상.
      - 밤 11시. 이준이 길드 건물에 도착. 3층 회의실. 불이 켜져 있다.
      - 세린이 복도에서 이준을 기다리고 있다. 표정이 굳어 있다. "길드장님이 2시간 전에 긴급 소집했어. 전원이 아닌 핵심 인원만."
      - 회의실 안. 김태석이 테이블 위에 서류를 펼쳐 놓고 있다. 얼굴이 피로하다. 정민호도 함께. 신민혁은 없다.
      - 김태석이 이준과 세린에게 서류를 넘긴다. 백화 계열사에서 보낸 공문 세 통.
      - 첫 번째: 철혈 길드와 거래하던 중소 기업 세 곳이 백화 계열 물류와의 계약을 우선 조건으로 내걸었다. 철혈과 거래하면 백화 물류와 계약 불가. 실질적 선택 강요.
      - 두 번째: 헌터협회 측에 "철혈 길드의 던전 배정 빈도 재검토"를 공식 요청. 이유는 "급격한 능력 변화가 있는 길드원이 포함되어 있어 안전성 우려" — 이준을 노린 것이다.
      - 세 번째: 강남구 내 철혈 길드 소유 건물에 대한 건축법 위반 고발. 사소한 위반 사항이지만, 법적 분쟁이 시작되면 길드 운영에 차질이 생긴다.
      - 김태석이 서류를 덮는다. "일주일 전에 거래처가 돌아오는 기미였어. 이건 그걸 막기 위한 거다. 백화가 숨을 고르는 게 아니라, 다음 타격을 준비하고 있었던 거야."
      - 정민호가 말한다. "물리적 공격으로 안 되니 경제적 목조르기로 바꾼 겁니다. 그리고 헌터협회 공문은... 이준이를 겨냥한 겁니다. '급격한 능력 변화'라. B급 감시자가 본 것을 근거로 삼은 거죠."
      - 김태석이 이준을 본다. "이준아. 네가 작전 지휘를 맡은 이후로 길드 분위기가 좋아졌어. 하지만 동시에 백화의 표적이 정확해졌어."
      - 이준이 잠시 침묵한 뒤 묻는다. "길드장님. 현재 길드 재정 상태는요?"
      - 김태석이 쓴웃음을 짓는다. "거래처 세 곳이 계약을 정리하면, 월 운영비의 40%가 날아가. 2개월 버티면 협회 보조금 신청이 가능한데, 그 전에 백화가 한 번 더 누르면 끝이야."
      - 이준이 생각에 잠긴다. 직접적인 전투로 백화를 이길 수 없다. 경제전에서도 백화의 자본력을 이길 수 없다. 그렇다면 다른 방법이 필요하다.
      - 이준이 입을 연다. "제가 한 가지 제안드릴게요."
      - 김태석과 정민호의 시선이 이준에게 향한다.
      - 이준: "백화가 우리를 압박하는 건, 우리가 약하기 때문이 아니라 우리가 반응할 것을 알기 때문입니다. 그런데 만약 우리가 예상과 다른 방식으로 반응하면요?"
      - 정민호가 눈을 가늘게 뜬다. "어떤 반응 말입니까?"
      - 이준: "백화가 경제적 압박을 가하면, 우리는 반대로 공격이 아니라 방어에 집중합니다. 그리고 그 사이에 — 우리가 할 수 있는 일을 합니다."
      - 세린이 이준을 본다. 이준의 눈빛에는 무언가가 결정되어 있었다.
      - 마지막 줄: 김태석이 의자에서 몸을 앞으로 기울인다. "구체적으로 말해봐."

  - name: school_and_protection
    instruction: |
      이 부분은 41화의 중반. 분량 2,000자 이상.
      - 다음 날 아침. 이준이 이서를 학교 앞까지 데려다준다.
      - 이서가 교문 앞에서 걸음을 멈춘다. 학교 건물이 평소와 다르게 느껴진다. 2주간 비워두었던 교실, 친구들과의 시간. 모든 것이 멀어진 것 같다.
      - 이준이 말한다. "수업 끝나면 바로 나와. 복도에서 기다리고 있을게."
      - 이서가 고개를 끄덕인다. "오빠, 괜찮아. 그냥 학교일 뿐이야."
      - 이서가 교문을 지나간다. 이준은 그녀의 뒷모습이 교문 너머로 사라질 때까지 서 있었다.
      - 이준이 걸어가며 마나 감지를 가동. 학교 주변에 특이 반응 없음. D급 감시자도 보이지 않는다. 백화가 학교 쪽에는 아직 손을 대지 않은 것인가, 아니면 더 교묘한 방식인 것인가.
      - 진명 감지 500m 가동. 반응 없음. 하지만 어젯밤 느꼈던 미지의 파동이 다시 나타날 수 있다. 이준은 그것이 누군지, 왜 자신을 관찰하는지 알아내야 한다.
      - 이준이 길드 건물로 돌아간다. 도중에 핸드폰이 울린다. 협회 시설에서 어머니의 담당 의사다.
      - 의사: "강이준 씨, 어머니 상태가 안정적입니다. 이번 주 검사 결과도 양호하네요. 다만 한 가지 여쭤볼 게 있습니다."
      - 이준: "네, 말씀하세요."
      - 의사: "어머니가 최근에 가끔 이름을 부르시더라고요. '철민'이라고. 남편분 이름인 거로 알고 있는데... 혹시 어머니께 남편분 사진이나 유품 같은 걸 보여드린 적이 있나요?"
      - 이준이 순간 멈춘다. 아버지 강철민. 5년 전 심장마비로 사망. 이준은 아버지의 유품을 어머니에게 보여준 적이 없다. 어머니가 스스로 기억해낸 것이다.
      - 이준: "아니요, 보여드린 적은 없습니다. 아버지 이야기를 자주 하시나요?"
      - 의사: "가끔이요. 대부분은 혼잣말이에요. '철민이가 왜 늦지'라고 하시기도 하고요. 크게 걱정할 수준은 아닙니다만, 가족 분위기가 좋아지면 회복에도 도움이 될 겁니다."
      - 이준이 통화를 끊는다. 강철민. 5년 전. 심장마비. 당시 이준은 17세, 이서는 12세. 사인은 심장마비로 처리되었지만, 이준은 항상 의문을 품고 있었다. 아버지는 헌터가 아니었다. 평범한 회사원이었다. 하지만 죽기 전 몇 달간 이상한 행동을 보였다. 늦게 귀가, 전화를 끊는 버릇, 가끔 헌터협회 근처를 지나가는 것을 이준이 목격한 적이 있다.
      - 이준이 그 기억을 밀어낸다. 지금은 길드의 위기가 먼저다. 하지만 아버지의 과거는 언젠가 파헤쳐야 할 것이다.
      - 길드 건물에 도착. 1층 로비에서 길드원 몇 명이 속삭이고 있다. 표정이 어둡다.
      - 이준이 귀를 기울인다. "...백화가 물류 계약까지... 이건 끝까지 몰아붙이는 거야." "...내가 백화 가면 월급 두 배는 되는데..."
      - 길드원의 불안이 다시 고개를 들고 있다. 이번 압박은 이전보다 정교하다. 직접 공격이 아니라 생존의 뿌리를 흔드는 방식.
      - 마지막 줄: 이준이 계단을 올라간다. 한 계단 한 계단이 무거웠다. 백화의 진짜 공격은 검이 아니라 숨이었다.

  - name: level_up
    instruction: |
      이 부분은 41화의 마지막. 분량 2,000자 이상.
      - 오후. 이준이 길드 3층 훈련실에서 혼자 있다.
      - 김태석의 긴급 소집 이후 이준이 구상한 계획을 정리 중이다. 백화의 경제적 압박을 피하려면 철혈이 스스로 자본을 확보해야 한다. 그러나 그것은 단기적으로 불가능하다. 이준이 생각한 대안은 — 던전에서의 수익을 극대화하는 것이다. 보다 높은 난이도의 던전, 보다 효율적인 클리어, 보다 많은 마나 자원 획득.
      - 그러기 위해서는 이준의 능력이 한 단계 더 올라가야 한다.
      - 이준이 눈을 감고 내면의 시스템에 집중한다. 진명 시스템 인터페이스가 떠오른다.
      - [Lv5 — 진전도 89%]
      - 이준이 지난 몇 주간의 전투, 회피, 감지, 작전 지휘를 떠올린다. 모든 경험이 진전도를 채우고 있다. 하지만 마지막 11%가 채워지지 않았다. 무엇이 부족한 걸까.
      - 이준이 눈을 뜬다. 훈련실에 마나 구체 하나가 떠 있다. B급 헌터가 훈련용으로 만들어둔 것이다. 이준이 그것을 바라본다.
      - 이준이 마나를 끌어올린다. STR25, DEX30의 신체 능력. 마나 감지 200m. 진명 감지 500m. 이것만으로도 일반적인 C급은 상대할 수 있다. 하지만 백화의 핵심 전력인 B급, A급, 그리고 한도혁의 S급에 대해서는 부족하다.
      - 이준이 마나 구체에 손을 댄다. 마나가 손끝에서 들끓는다. 구체를 해체하고 재구성하려는 시도. 이것은 이준이 스스로 터득한 마나 제어 기술이다.
      - 구체가 흔들린다. 이준의 마나가 구체 내부의 마나와 충돌하고 융합하려 한다. 이 과정에서 이준의 이해력이 깊어진다. 마나의 본질, 구조, 그리고 그 안에 숨겨진 정보.
      - 시스템 메시지가 떠오른다.
      - [진전도 94%... 97%...]
      - 이준이 더 깊이 집중한다. 마나 구체가 완전히 해체되고, 이준의 마나에 흡수된다. 이 과정에서 이준은 무언가를 깨닫는다. 마나는 단순한 에너지가 아니다. 그 안에는 정보가 담겨 있다. 던전의 기록, 보스의 패턴, 마나 장치의 설계도. 마나를 "읽는" 것이 가능하다.
      - [진전도 99%...]
      - 이준의 시야가 변한다. 훈련실의 마나가 선으로 보이기 시작한다. 벽에 스며든 마나의 흐름, 바닥에 쌓인 마나의 잔여물, 그리고 그 아래 깔린 — 아주 미세한 — 다른 파동.
      - [Lv6 달성]
      - 시스템 메시지가 쏟아진다.
      - [STR 25 → 28]
      - [DEX 30 → 33]
      - [INT 22 → 25]
      - [WIS 19 → 22]
      - [FAT 12 → 14]
      - [신규 능력 해금: 진명 감지(고급) — 감지 범위 500m → 800m. 보유자 구별 가능. 마나 잔여 추적 기능 추가.]
      - [신규 능력 해금: 마나 해독 — 마나에 담긴 정보를 읽을 수 있음. 초기 단계: 단순한 정보만 해독 가능.]
      - 이준이 눈을 뜬다. 시야가 달라졌다. 훈련실의 마나 흐름이 선명하게 보인다. 그리고 — 진명 감지(고급)가 자동으로 가동된다.
      - 800m 범위 안에 수많은 마나 반응. 길드원들, 학교 방향의 희미한 반응, 그리고 —
      - 이준의 표정이 굳어진다. 600m 밖, 남서쪽. 미지의 파동. 어젯밤과 같은 파동이지만, 이번에는 더 선명하다. 그리고 고급 진명 감지가 이것을 분류한다.
      - [미지 보유자 감지 — 진명 시스템 보유자 파동 확인]
      - 이준의 등줄기에 전율이 흐른다. 이것은 백화가 아니다. 이것은 — 자신과 같은 존재다.
      - 핸드폰이 울린다. 세린이다.
      - "이준 씨, 학교에서 이서 연락이 안 돼."
      - 마지막 줄: 이준이 훈련실을 뛰어나간다. 새로운 능력, 새로운 위협, 그리고 새로운 존재. 모든 것이 동시에 덮쳐온다.
