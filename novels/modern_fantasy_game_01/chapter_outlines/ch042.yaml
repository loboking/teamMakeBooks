chapter_n: 42
overall: |
  이서의 연락 두절은 단순한 핸드폰 문제로 밝혀지나, 이준에게 백화의
  접근 가능성을 각인시킨다. 한도혁의 철혈 처리 계획이 구체화되고,
  서동현의 내면 갈등이 심화된다. 세린이 오빠 박세진의 진명 시스템
  보유 사실을 우연히 마주한다.

beats:
  - name: school_incident
    instruction: |
      이 부분은 42화의 시작. 분량 2,000자 이상.
      - 이준이 학교로 전력 질주. 마나 감지를 최대한으로 가동. 학교 방향에서 이서의 마나 반응은 잡히지만 — 미세하게 불안정하다.
      - 학교 교문 앞에 도착. 보안실 아저씨가 이준을 막는다. "학부모 면담 시간이 아닙니다." 이준이 "여동생이 연락이 안 돼서요"라고 말하자, 보안실 아저씨가 "아, 강이서 학생? 방과 후 학원 간다고 하던데"라고 답한다.
      - 이준이 안도의 한숨을 쉰다. 핸드폰이 꺼져 있었거나 학원에서 수업 중인 것이다. 하지만 동시에 불안이 가시지 않는다. 이서가 학원에 간다고 이준에게 미리 말하지 않았다.
      - 이준이 진명 감지(고급)로 학교 전체를 스캔. 800m 범위 안에 학교 전체가 들어온다. 학생과 교사들의 마나 반응이 산재해 있다. 대부분 미미한 일반인 반응. 하지만 몇몇 학생에게서 헌터 수준의 마나가 감지된다 — 헌터 가정의 자녀들이겠지.
      - 이서의 반응을 찾는다. 서쪽 건물 3층. 마나 반응 안정. 학원 수업 중일 가능성이 높다.
      - 하지만 이준이 다른 것을 발견한다. 학교 운동장 외곽, 담장 너머. 미세한 마나 반응 하나. D급 수준. 백화의 감시자가 학교 주변에도 배치되어 있다.
      - 이준의 표정이 굳어진다. 백화가 이서까지 손을 대려는 것인가.
      - 이준이 핸드폰을 켠다. 이서에게 문자. "학원 갔어? 연락이 안 돼서 걱정했어." 3분 후 답장. "아 핸드폰 배터리 떨어졌어. 수학학원이야. 6시에 끝나. 오빠가 데리러 오지 마, 친구 엄마가 데려다준대."
      - 이준이 답장. "알겠어. 수업 끝나면 바로 연락해."
      - 이준이 학교 담장 밖으로 걸어간다. D급 감시자의 위치를 확인. 주차장 앞 차 안에 앉아 있는 남자. 이준이 멀리서 관찰. 이 남자는 이서를 직접 감시하는 것이 아니라 학교 전체를 감시하는 배치다. 이서를 노린 것이 아니라, 이서를 통해 이준을 압박하려는 것이다.
      - 이준이 결심한다. 학교 보호를 강화해야 한다. 하지만 직접 학교에 상주할 수는 없다. 다른 방법이 필요하다.
      - 이준이 정민호에게 전화한다. "정민호 형, 한 가지 부탁이 있어요. 학교 근처에 거주하거나 출입이 가능한 길드원이 있나요?"
      - 정민호: "학교 근처라... 아, 김하늘 있죠. D급인데 학교 앞 카페 알바하고 있어. 이서 학생 학교 아니에요?"
      - 이준: "네. 감시 겸 이서 등하교 때 안전 확인 부탁드리고 싶어요."
      - 정민호: "알겠습니다. 김하늘한테 연락할게."
      - 이준이 끊고 다시 진명 감지를 가동. 600m 밖 남서쪽의 미지 파동은 — 사라졌다. 다시 은폐한 것이다.
      - 마지막 줄: 이준이 학교를 뒤로하고 걸어간다. 적은 보이지만 보이지 않는 곳에 더 많다. 그리고 보이지 않는 적 중에는 — 아군일 수도 있는 존재가 있다.

  - name: iron_blood_plan
    instruction: |
      이 부분은 42화의 중반. 분량 2,000자 이상.
      - 백화 본사 38층. 서동현의 사무실.
      - 서동현이 모니터 네 대를 켜고 이준의 최근 이동 경로를 추적 중이다. Lv6 달성 직후의 마나 변화를 감지 시스템이 포착했을 가능성이 있다. 하지만 백화의 감지 장비는 진명 시스템 수준은 아니다.
      - 서동현의 옆에 한도혁의 비서가 보낸 서류 봉투가 놓여 있다. 철혈 처리 계획 초안.
      - 서동현이 봉투를 열지 않고 바라본다. 봉투 안에는 이준에 대한 구체적 처리 방안이 들어 있을 것이다. 서동현이 그것을 읽는 순간, 박세진의 운명이 이준에게도 적용될 것이다.
      - 서동현의 과거 회상. 3년 전, 같은 사무실에서 같은 봉투를 받았다. 그때의 대상은 박세진이었다. 서동현은 세진을 알고 있었다. 세진이 진명 시스템을 각성한 것을 가장 먼저 알아챈 것도 서동현이었다. 하지만 그는 보고했다. 한도혁에게. 그리고 2개월 후 세진은 죽었다.
      - 서동현이 안경을 벗고 눈을 문지른다. "이번에는 다르다"라고 혼잣말한다. 하지만 다를 것인가?
      - 한도혁의 비서가 전화를 건다. "서 팀장님, 회장님이 2시에 회의실에서 미팅. 철혈 처리 계획 관련입니다."
      - 서동현: "알겠습니다."
      - 오후 2시. 백화 본사 42층 회의실. 한도혁이 테이블 상석에 앉아 있다. 옆에 백화의 법무팀장, 홍보팀장, 그리고 정보수집팀의 핵심 인원 네 명.
      - 한도혁이 입을 연다. "철혈 길드 처리. 두 번째 단계를 시작한다."
      - 서동현이 보고서를 넘긴다. 한도혁이 읽지 않는다. 이미 알고 있다.
      - 한도혁: "첫 번째 단계 — 물리적 압박은 실패했다. 이준이라는 변수 때문이다. 두 번째 단계는 경제적 고사. 세 가지 축으로 진행한다."
      - "첫째, 거래처 차단. 철혈과 거래하는 모든 중소 기업에 백화 물류 계약 우선 조건을 걸어라. 선택의 여지를 주지 마라."
      - "둘째, 협회 압박. 이준의 '급격한 능력 변화'를 근거로 던전 배정을 제한하라. C급 이상 배정 불가. 철혈의 주 수입원을 막아라."
      - "셋째, 내부 분열 조장. 매수 대상을 세 명에서 여섯 명으로 늘려라. 조건은 이전보다 관대하게. 월급 두 배, 보너스, 백화 전속 계약. 단, 철혈 이탈 조건부."
      - 법무팀장이 묻는다. "이준 본인은 어떻게 처리합니까?"
      - 한도혁이 잠시 생각한다. "이준은 직접 건드리지 않는다. 김태석도. 핵심은 철혈을 자연스럽게 붕괴시키는 거다. 길드가 무너지면 이준도 결국 고립된다. 그리고 고립된 이준은 —"
      - 한도혁이 말을 끊는다. 서동현을 본다.
      - "서동현. 세 번째 단계를 준비해. 이준의 고립 이후, 직접 접촉."
      - 서동현: "직접 접촉이라면, 어떤 방식입니까?"
      - 한도혁: "회유. 이준이 원하는 것을 주고, 대신 우리가 원하는 것을 받는 거다. 만약 회유가 안 되면 —"
      - 한도혁의 눈이 차갑게 빛난다.
      - "세진과 같은 방식이다."
      - 서동현의 손이 떨린다. 테이블 아래에서 꽉 쥔 주먹이 하얗게 변한다.
      - 마지막 줄: 회의가 끝나고 서동현이 복도를 걷는다. 그의 주머니 안에는 — 3년 전 박세진이 남긴 USB 하나가 들어 있다.

  - name: serin_discovery
    instruction: |
      이 부분은 42화의 마지막. 분량 2,000자 이상.
      - 저녁. 세린이 길드 기숙사 자기 방에 있다. 오빠 박세진의 유품 몇 가지를 꺼내놓고 있다. 사진, 수첩, 그리고 오빠가 항상 목에 걸고 다니던 펜던트.
      - 세린이 펜던트를 손에 쥐고 바라본다. 은색 원형 펜던트. 안쪽에 아주 작은 문자가 새겨져 있다. 세린은 그 문자를 읽을 수 없다. 오빠가 "이건 나중에 알게 될 거야"라고만 말했었다.
      - 세린이 수첩을 펼친다. 오빠의 일기장이 아니다. 던전 기록과 마나 분석 노트다. 대부분은 세린이 이해할 수 있는 내용 — 던전 구조, 마나 분포, 보스 패턴. 하지만 마지막 몇 페이지는 달랐다.
      - 마지막 페이지에 박세진이 적은 글. 글씨가 평소와 다르게 흐트러져 있다.
      - "진명 시스템. 나는 이것이 무엇인지 모른다. 각성한 순간 눈앞에 떠올랐다. 내 등급은 C급이었는데, 시스템은 내가 무엇인지 알고 있었다. 나의 진짜 이름을."
      - "한도혁이 알고 있다. 그가 나를 찾았다. 아니, 내가 그에게 들킨 것이다. 마나 장치 사건 이후. 그가 내 능력의 본질을 눈치챘다."
      - "서동현에게 보고서를 넘기면 끝이다. 그는 한도혁의 사람이다. 하지만 그는... 내가 믿었던 사람이었다."
      - 세린의 손이 떨린다. 진명 시스템. 이 단어를 세린은 처음 듣는 것이 아니다. 한도혁이 — 오빠를 죽인 그 사람이 — 이 단어를 사용했다는 것을 이준에게서 들은 적이 있다.
      - 아니, 정확히는 이준이 직접 말한 것이 아니라, 이준의 반응에서 읽어낸 것이다. 이준이 "진명"이라는 단어를 들었을 때의 미세한 표정 변화.
      - 세린의 머릿속에 퍼즐 조각들이 맞춰지기 시작한다. 오빠의 갑작스러운 성장. 한도혁의 관심. 그리고 2개월 후의 죽음. 이준의 갑작스러운 성장. 한도혁의 관심. 지금 이준이 위험에 처해 있다.
      - 세린이 펜던트를 쥐고 이를 악문다. 오빠가 죽기 전 마지막으로 남긴 말. "세린아. 이건 네게 맡길게. 절대 한도혁에게 보여주지 마."
      - 세린이 핸드폰을 든다. 이준에게 전화를 걸려다 멈춘다. 지금 이것을 이준에게 말하면 — 이준은 자신의 비밀을 들킬까 봐 두려워할 것이다. 그리고 그 두려움은 이준과 세린 사이의 균열이 될 수 있다.
      - 하지만 말하지 않으면, 이준은 오빠와 같은 길을 걷게 될 것이다.
      - 세린이 수첩을 닫는다. 펜던트를 목에 건다.
      - "오빠. 나는 오빠와 다르게 할 거야."
      - 세린이 방을 나선다. 이준의 방 앞에 선다. 문을 두드린다.
      - 이준의 목소리. "누구야?"
      - 세린: "나야. 잠깐 나올 수 있어?"
      - 이준이 문을 연다. 세린이 그를 올려다본다. 그리고 — 말을 시작하지 않는다. 무엇을 말해야 할지 모르겠다.
      - 대신 세린이 묻는다. "이준 씨. 당신은... 진명 시스템이 뭔지 알아?"
      - 이준의 표정이 굳어진다.
      - 마지막 줄: 복도에 두 사람이 서 있다. 세린의 목에 걸린 은색 펜던트가 희미하게 빛난다. 이준은 그것을 본다. 그리고 — 그것이 무엇인지 알아차린다.
