chapter_n: 43
overall: |
  백화의 경제적/정치적 압박이 본격화되며 철혈 길드원들이 이탈 위기에
  직면한다. 이준이 세린에게 진명 시스템의 일부를 공개하며 동맹이
  깊어진다. 백화의 내부 분열 조장이 길드원 사이에 균열을 만든다.

beats:
  - name: economic_pressure
    instruction: |
      이 부분은 43화의 시작. 분량 2,000자 이상.
      - 3일이 지났다. 백화의 압박이 가시화되기 시작했다.
      - 아침. 김태석이 사무실에서 재무 담당자와 통화 중이다. "물류 계약이 완전히 끊겼어? 세 곳 다?" 재무 담당자의 목소리가 날카롭다. "네, 백화 계열 물류가 '철혈 길드와 동시 거래 불가' 조건을 걸었습니다. 우리가 거래하는 중소 기업 셋 모두 백화 물류 없으면 배송이 불가능한 구조라..."
      - 김태석이 전화를 끊고 이마를 짚는다. 물류 차단은 단순한 거래 중단이 아니다. 던전에서 획득한 마나 자원의 운송, 길드 장비의 수리, 길드원 일일 보급품 — 모든 것이 물류에 의존한다.
      - 이어서 두 번째 타격. 헌터협회에서 공문이 도착했다. "철혈 길드원 강이준에 대한 던전 배정 제한 조치. C급 이상 던전 참여 금지. 사유: 등급 외 능력 변화에 대한 안전성 검증 미완료."
      - 이준이 공문을 읽는다. 표정은 변하지 않지만, 안에서 분노가 끓어오른다. 백화가 헌터협회에 압력을 넣은 것이다. 헌터협회가 백화에 완전히 종속된 것은 아니지만, 백화의 자본력과 정치적 영향력은 협회 내부에도 뿌리를 내리고 있다.
      - 김태석이 이준에게 말한다. "미안하다, 이준아. 이건 네 탓이 아니야. 백화가 네 능력을 핑계로 삼은 거지."
      - 이준: "길드장님. 이 공문을 무효화할 방법이 있을까요?"
      - 김태석: "등급 재측정을 신청하면 되긴 해. 하지만 재측정은 협회에서 2주간 심사 후에야 가능하고, 그 사이에 C급 배정이 안 되면 길드 수입이 반토막 나."
      - 이준이 잠시 생각한다. 등급 재측정을 받으면 자신의 진짜 등급이 드러난다. 하지만 그렇다고 F급으로 남아 있으면 길드에 해가 된다. 딜레마다.
      - 오후. 세 번째 타격이 시작된다.
      - 길드원 박동현이 이준에게 다가온다. 표정이 복잡하다. "이준 형. 한 가지 말할 게 있는데..."
      - 박동현이 핸드폰을 보여준다. 백화 인사팀에서 보낸 메시지. "박동현 헌터님, 백화 길드에서 전속 계약을 제안합니다. 현재 수준의 두 배 보수, B급 이상 던전 우선 배정, 완전한 복지 혜택. 관심 있으시면 면담 일정을 잡아주십시오."
      - 박동현: "나는 거절할 거야. 하지만... 길드원들 사이에 이런 메시지가 돌고 있어. 최소 여섯 명이 받았어."
      - 이준이 묻는다. "누가 수락했어?"
      - 박동현이 잠시 침묵한다. "아직은... 아무도. 하지만 길드 재정 상태를 알면 —"
      - 이준이 고개를 끄덕인다. "알겠어. 고마워, 동현아."
      - 박동현이 돌아간 뒤 이준이 창밖을 본다. 백화의 계획은 정교하다. 물류 차단으로 길드 운영을 마비시키고, 협회 압박으로 수입을 반토막 내고, 매수로 내부를 갈라놓는다. 세 가지가 동시에 가해지면 2주 안에 길드는 무너진다.
      - 마지막 줄: 이준이 주먹을 쥔다. 백화가 원하는 것은 길드의 항복이다. 하지만 이준은 항복할 생각이 없다. 문제는 — 항복하지 않으려면 어떤 대가를 치러야 하는가이다.

  - name: trust_deepened
    instruction: |
      이 부분은 43화의 중반. 분량 2,000자 이상.
      - 밤. 이준과 세린이 길드 건물 옥상에 있다. 전날 밤, 세린이 "진명 시스템이 뭔지 알아?"라고 물었던 이후 두 사람 사이에 미묘한 긴장이 흐르고 있다.
      - 세린이 먼저 입을 연다. "어젯밤에는 답을 안 했잖아."
      - 이준이 잠시 침묵한 뒤 말한다. "진명 시스템은... 내가 각성한 이후에 나타난 거야. 시스템이 내 진짜 등급을 보여줘. F급이 아니라."
      - 세린이 숨을 삼킨다. 예상은 했지만 직접 듣는 것은 다르다.
      - 이준: "나는 이걸 숨겨왔어. 들키면 위험하니까. 오빠도 — 박세진 씨도 이것을 가지고 있었어?"
      - 세린이 고개를 끄덕인다. "오빠 수첩을 읽었어. 진명 시스템이라는 단어가 나왔어. 오빠도 갑자기 강해졌잖아. C급에서 A급 경계까지. 그리고 2개월 뒤 죽었어."
      - 이준: "한도혁이 오빠를 죽인 거야?"
      - 세린이 이를 악문다. "직접적인 증거는 없어. 하지만 오빠 수첩에 '한도혁이 알고 있다'고 적혀 있었어. 그리고 서동현이라는 사람이 보고서를 넘겼다고."
      - 이준이 서동현이라는 이름을 기억한다. 한도혁의 오른팔. 40화에서 서동현이 자신에 대한 조사를 한도혁에게 보고했다는 것을 알고 있다.
      - 이준: "세린 씨. 나한테 한 가지만 약속해 줘."
      - 세린: "뭔데?"
      - 이준: "이건 너랑 나만 아는 거야. 김태석 길드장님한테도, 정민호 형한테도. 진명 시스템의 존재는 반드시 숨겨야 해."
      - 세린이 이유를 묻지 않는다. 오빠의 운명이 그 이유를 말해주고 있었으니까.
      - 세린: "알았어. 하지만 한 가지 조건이 있어."
      - 이준: "뭔데?"
      - 세린: "나한테는 모든 걸 말해줘. 숨기지 마. 오빠가 나한테 숨겼고, 그래서 나는 아무것도 못 했어. 두 번은 안 돼."
      - 이준이 세린의 눈을 본다. 분노와 결의와 두려움이 뒤섞인 눈.
      - 이준이 고개를 끄덕인다. "좋아. 약속할게."
      - 세린이 펜던트를 목에서 빼서 이준에게 보여준다. "이거, 오빠가 남긴 거야. 안에 문자가 새겨져 있는데 나는 못 읽어. 혹시 네가 읽을 수 있으면..."
      - 이준이 펜던트를 받아든다. 진명 감지(고급)가 자동으로 반응한다. 펜던트에서 미세한 마나가 흐른다. 그리고 — 이준은 그것을 읽을 수 있다. 마나 해독 능력으로.
      - 펜던트에 새겨진 문자. 고대 언어가 아니다. 시스템 문자다.
      - [보유자 확인 — 박세진 — 진명 시스템 v1.7 — 상태: 비활성]
      - 이준의 눈이 크게 뜨인다. 펜던트는 단순한 유품이 아니다. 박세진의 진명 시스템 기기다. 그리고 상태가 "비활성" — 박세진이 죽으면서 시스템이 비활성화된 것이다.
      - 이준이 이것을 세린에게 어떻게 설명해야 할지 잠시 고민한다. 그리고 결정한다.
      - 마지막 줄: "이건 오빠의 시스템 기기야. 오빠가 죽으면서 꺼진 거야. 하지만 — 나한테는 아직 켜져 있어."

  - name: guild_fracture
    instruction: |
      이 부분은 43화의 마지막. 분량 2,000자 이상.
      - 다음 날 아침. 길드 식당. 아침 식사 시간에 길드원들이 모여 있다.
      - 분위기가 달라져 있다. 3일 전만 해도 이준의 작전 성공 이후 자신감이 넘쳤는데, 지금은 침묵이 흐른다.
      - 길드원 A(30대, C급)가 큰 소리로 말한다. "백화에서 두 배 준대. 두 배야. 이쪽에서 월 400인데, 저쪽에서 800이라고."
      - 길드원 B(20대 후반, D급)가 끼어든다. "하지만 백화는 사람을 소모품으로 써. 철혈은 가족이야."
      - 길드원 A: "가족? 가족이 밥 먹여주냐? 이번 달 보너스 반토막 났어. 물류 막혀서 던전 자원 판매도 안 돼. 한 달 더 이러면 나도 진지하게 고려해야 해."
      - 주변의 길드원들이 고개를 숙인다. 아무도 반박하지 않는다. 왜냐하면 길드원 A가 말하는 것은 사실이니까.
      - 이준이 식당에 들어온다. 길드원들이 일제히 시선을 돌린다. 일부는 경외, 일부는 불안, 일부는 경계.
      - 최은지(D급)가 이준에게 다가온다. "이준 씨... 백화에서 연락이 왔어. 거절하려고 하는데, 혹시 조언을..."
      - 이준이 부드럽게 답한다. "은지 씨, 결정은 본인 몫이에요. 다만 한 가지만 알아두세요. 백화가 지금 철혈 길드원들에게 접근하는 건, 백화가 철혈을 무서워하고 있다는 뜻이에요. 철혈이 약해서가 아니라, 철혈 안에 백화가 컨트롤할 수 없는 무언가가 있어서 그런 거죠."
      - 최은지가 눈을 가늘게 뜬다. "컨트롤할 수 없는 무언가...?"
      - 이준이 웃으며 답한다. "사람이에요. 이 길드에 있는 사람들."
      - 최은지가 돌아간다. 표정이 고민으로 가득하지만, 결정은 보류한 것 같다.
      - 오후. 김태석이 이준을 사무실로 부른다.
      - 김태석: "이준아. 솔직히 말할게. 2주 안에 상황이 안 좋아지면 길드를 정리해야 할 수도 있어."
      - 이준이 놀란다. 김태석이 길드 해산을 고려하고 있다는 것은, 상황이 이준이 생각한 것보다 심각하다는 뜻이다.
      - 이준: "길드장님. 2주만 시간 주십시오. 제가 방법을 찾겠습니다."
      - 김태석: "어떤 방법?"
      - 이준: "백화가 경제전을 걸었다면, 우리도 경제전으로 맞서야 합니다. 하지만 백화와 같은 방식으로는 안 됩니다. 다른 수가 필요합니다."
      - 김태석이 이준의 눈을 본다. 이 젊은이가 무엇을 생각하고 있는지 모르겠지만, 지금까지 이준의 판단은 틀린 적이 없었다.
      - 김태석: "좋아. 2주. 그 이상은 못 줘."
      - 이준이 사무실을 나온다. 복도에서 정민호와 마주친다.
      - 정민호: "듣자 하니 2주면 끝이라고?"
      - 이준: "아직 끝난 건 아니에요."
      - 정민호: "이준아. 실례될지 모르겠지만, 네가 F급이 아니라는 건 다들 알아. 아직은 등급에 안 걸렸지만, 곧 들킬 거야. 그때 넌 어떻게 할 거야?"
      - 이준이 잠시 침묵한다. "그때 가서 생각하죠."
      - 정민호가 쓴웃음을 짓는다. "너는 항상 그렇다. 위기를 모면하면 다음 위기를 생각하지 않지. 그게 장점이자 단점이야."
      - 마지막 줄: 이준이 밖으로 나온다. 하늘이 흐리다. 2주. 백화의 압박. 길드원의 이탈. 그리고 600m 밖에서 여전히 자신을 지켜보는 미지의 존재. 이준은 모든 것을 동시에 계산해야 한다.
