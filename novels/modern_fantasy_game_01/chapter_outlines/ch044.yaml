chapter_n: 44
overall: |
  이준이 Lv6의 새로운 능력을 시험하며 진명 감지(고급)와 마나 해독을
  활용한다. 미지 보유자를 재감지하고 추적을 시도하지만 실패.
  서동현이 한도혁의 처리 계획과 박세진의 USB 사이에서 최종 결정을
  내리기 직전까지 간다.

beats:
  - name: new_abilities
    instruction: |
      이 부분은 44화의 시작. 분량 2,000자 이상.
      - 이른 아침. 길드 뒷편 훈련장. 이준이 혼자 서 있다.
      - Lv6 달성 이후 이틀이 지났다. 새로운 능력에 익숙해지는 시간이 필요하다.
      - 이준이 진명 감지(고급)를 가동한다. 800m. 이전 500m보다 훨씬 넓은 범위. 서울의 아침 마나가 세밀하게 보인다.
      - 시야 안에 수십 개의 마나 반응. 일반인들의 희미한 마나, 헌터들의 뚜렷한 반응, 던전 주변의 마나 농도. 이준은 이것들을 층별로 분류할 수 있다.
      - 그리고 마나 해독. 이준이 주변의 마나 잔여를 읽으려 한다. 바닥에 남은 마나 흔적 — 누군가가 최근 이곳에서 마나를 사용했다. 마나 해독이 정보를 끌어올린다.
      - [마나 잔여 분석: 사용자 추정 등급 C급, 마나 속성 — 방어형, 시간 경과 — 약 6시간 전]
      - 이준이 만족한다. 정민호가 밤에 훈련을 한 것이다. 마나 해독은 아직 초기 단계지만, 이 정도로도 유용하다.
      - 이준이 마나 감지의 한계를 시험한다. 800m 밖은 어떻게 보이는가? 감지 경계선 너머는 희미한 빛처럼 감지된다. 선명하지는 않지만, 대략적인 마나 밀도와 방향은 알 수 있다.
      - 이준이 이번에는 진명 감지에 집중한다. 고급 진명 감지의 핵심 기능 — 보유자 구별. 일반 마나 반응과 진명 시스템 보유자의 파동을 구분할 수 있다.
      - 800m 범위를 스캔. 수십 개의 반응 중 진명 시스템 파동은 — 하나. 남서쪽 600m. 41화에서 감지한 미지의 파동이 다시 나타났다.
      - 이준이 숨을 고른다. 이번에는 놓치지 않겠다.
      - 이준이 은밀히 남서쪽으로 이동한다. 마나 은폐를 최대한 유지. 걸으면서 감지 범위를 조정. 파동의 위치를 실시간으로 추적.
      - 500m... 400m... 350m... 파동이 점점 선명해진다. 진명 시스템 보유자의 마나는 일반 마나와 다른 질감을 가지고 있다. 더 깊고, 더 복잡하고, 더 — 낯설다.
      - 300m 지점에서 이준이 멈춘다. 파동이 멈췄다. 상대가 이준의 접근을 감지한 것이다.
      - 잠시 침묵. 그리고 파동이 서서히 멀어지기 시작한다. 서쪽으로. 500m를 넘어 600m, 700m...
      - 이준이 쫓는다. 전력으로. DEX33의 기동력. 하지만 상대도 빠르다. 이준의 추적을 정확하게 계산하면서 도망친다.
      - 800m 경계선. 파동이 감지 범위를 벗어난다.
      - 이준이 멈춰 선다. 숨이 턱끝까지 찬다. 추적 실패.
      - 하지만 이번에 얻은 것이 있다. 파동의 정확한 방향과 속도. 그리고 — 마나 해독이 마지막 순간에 파동의 잔여를 읽었다.
      - [파동 잔여 분석: 보유자 확인 — 진명 시스템 v1.3 — 이동 방향 서쪽 — 사용 마나 속성: 은폐 특화]
      - v1.3. 이준의 시스템은 v2.0이다. 이 미지의 보유자는 이준보다 이전 버전의 시스템을 가지고 있다. 그리고 은폐 특화 — 추적과 감지를 피하기 위해 설계된 버전인 것 같다.
      - 이준이 품에 손을 넣는다. 이 미지의 존재는 적인가, 아군인가. 왜 자신을 관찰하는 것인가.
      - 마지막 줄: 이준이 서쪽을 바라본다. 홍대 방향. 그곳에서 한 번 거부당한 적이 있다. 같은 사람인가.

  - name: seodonghyeon_crossroad
    instruction: |
      이 부분은 44화의 중반. 분량 2,000자 이상.
      - 같은 시각. 백화 본사 38층. 서동현의 사무실.
      - 서동현이 책상 서랍에서 USB 하나를 꺼낸다. 검은색 USB. 3년 전 박세진이 죽기 직전 서동현에게 몰래 전달한 것이다.
      - 서동현이 USB를 바라본다. 이 안에는 박세진이 한도혁에 의해 살해되었다는 직접적 증거가 들어 있다. 마나 장치 인위적 폭주 설계도, 한도혁의 지시 메모, 그리고 박세진이 진명 시스템으로 기록한 한도혁의 마나 패턴.
      - 서동현이 3년간 이 USB를 숨겨왔다. 한도혁에게 들키면 죽는다. 하지만 사용하면 한도혁을 무너뜨릴 수 있는 무기다.
      - 왜 박세진이 이것을 서동현에게 주었는가. 세진은 서동현이 한도혁의 사람이라는 것을 알면서도 — 아니, 알고 있었기 때문에 — 이것을 맡겼다. 세진은 서동현이 결국 올바른 선택을 할 것이라 믿었다.
      - 서동현이 모니터를 켠다. 한도혁의 철혈 처리 계획이 화면에 떠 있다. 서동현이 작성한 보고서. 이준에 대한 철저한 조사 결과와 처리 방안.
      - 계획의 세 번째 단계. "이준 고립 이후 직접 접촉. 회유 불가 시 — 세진과 동일 방식으로 처리."
      - "세진과 동일 방식." 서동현의 손이 떨린다. 자신이 3년 전에 보고한 내용이 지금 이준에게 적용되려 하고 있다.
      - 서동현이 의자에서 일어나 창밖을 본다. 38층에서 보이는 서울 시내. 저 아래 수백만 명의 사람들이 자신의 결정 하나에 따라 영향을 받지는 않는다. 하지만 한 사람 — 강이준 — 은 서동현의 결정에 따라 살 수도, 죽을 수도 있다.
      - 서동현의 핸드폰이 울린다. 모르는 번호.
      - 서동현이 받는다. "네?"
      - 상대방의 목소리. 여성. "서동현 팀장님? 저 박세린이에요. 박세진의 동생이요."
      - 서동현의 심장이 멈춘다.
      - 세린: "아저씨, 잠깐 시간 될까요? 오빠 이야기 좀 하고 싶어서요."
      - 서동현이 잠시 침묵한다. "어떻게 내 번호를..."
      - 세린: "오빠 수첩에 있었어. '절대 연락하지 마'라고 적혀 있었는데... 아저씨가 오빠한테 무슨 짓을 했는지 알아야 할 것 같아서요."
      - 서동현의 목구멍이 바짝 마른다. "세린 씨. 전화는 여기서 끊어야겠어. 위험해."
      - 세린: "위험한 건 아저씨죠. 한도혁이 아저씨한테 뭘 시키고 있는지 나도 알아요. 강이준에 대한 보고서, 철혈 처리 계획. 전부 알아요."
      - 서동현이 등줄기에 식은땀이 흐른다. 세린이 어디서 이 정보를 입수한 것인가.
      - 서동현: "세린 씨. 다시 한 번 말하지만, 이 통화는 위험해. 내가 할 수 있는 게..."
      - 세린: "아저씨, 오빠한테 마지막으로 한 가지 부탁이 있었어요. '서동현에게 USB를 전해달라'고. 근데 아저씨가 이미 갖고 있잖아요?"
      - 서동현이 침묵한다.
      - 세린: "아저씨. 이번엔 다르게 해요. 제발."
      - 통화가 끊긴다.
      - 서동현이 핸드폰을 내려놓는다. 손이 미세하게 떨린다. 3년 전, 세진이 마지막으로 한 말이 떠오른다.
      - "동현아. USB는 네가 지켜. 때가 되면 알아서 해. 넌 나를 배신했지만... 나는 널 믿어."
      - 서동현이 USB를 든다. 그리고 주머니에 넣는다.
      - 마지막 줄: 서동현이 다시 의자에 앉는다. 모니터 위의 철혈 처리 계획과 주머니 안의 USB. 둘 중 하나를 선택해야 한다. 3년 전처럼 — 아니, 3년 전과는 다르게.

  - name: dungeon_strategy
    instruction: |
      이 부분은 44화의 마지막. 분량 2,000자 이상.
      - 오후. 이준이 길드 회의실에서 혼자 앉아 있다. 앞에 큰 종이를 펼치고 무언가를 그리고 있다.
      - 백화의 압박 구조를 시각화한 그림이다. 물류 차단, 협회 압박, 내부 매수. 세 가지 축이 철혈을 향해 화살표를 보내고 있다.
      - 이준이 생각한다. 세 가지를 동시에 막을 수는 없다. 그렇다면 하나를 뚫어야 한다. 물류 차단은 백화의 자본력이 압도적이라 단기적으로 해결 불가. 협회 압박은 정치적 루트가 필요한데 철혈에게는 그런 인맥이 없다. 내부 매수는 길드원들의 결정이니 강제할 수 없다.
      - 그렇다면 — 백화의 압박과는 별개의 축에서 공격해야 한다. 백화가 예상하지 못하는 방향.
      - 이준이 펜을 든다. "던전."
      - 백화가 철혈의 수입원을 막고 있다면, 철혈은 새로운 수입원을 찾아야 한다. 하지만 일반적인 던전 클리어로는 백화를 이길 수 없다. 백화는 A급, S급 던전을 독점하고 있다.
      - 이준이 진명 시스템을 떠올린다. 마나 해독. 던전 내부의 마나에 정보가 담겨 있다면 — 숨겨진 자원, 알려지지 않은 경로, 기존에 발견되지 않은 마나 장치 — 이런 것들을 찾을 수 있지 않을까.
      - 그리고 이것은 백화가 가로챌 수 없는 수입원이다. 백화의 S급 기술로도 마나 해독은 불가능하다. 이것은 오직 진명 시스템 보유자만이 할 수 있는 것이다.
      - 이준이 계획을 구체화한다. (1) D급 또는 C급 하위 던전에서 마나 해독을 시험. (2) 숨겨진 자원이나 경로가 있으면 그것을 통해 수익 창출. (3) 이 수익으로 길드 재정을 지탱.
      - 하지만 문제가 있다. 이준은 현재 던전 배정 제한을 받고 있다. C급 이상 참여 불가. 그리고 D급 던전에서 마나 해독으로 얻을 수 있는 정보에 한계가 있을 것이다.
      - 이준이 세린에게 전화한다. "세린 씨, 한 가지 부탁이 있어요."
      - 세린: "뭔데?"
      - 이준: "협회에 등급 재측정을 신청할 생각이에요. C급 배정 제한을 풀기 위해서."
      - 세린이 잠시 침묵한다. "등급 재측정이면... 진짜 등급이 드러나잖아. F급이 아니라는 거."
      - 이준: "알아요. 하지만 시간이 없어요. 2주 안에 결과를 내야 해요."
      - 세린: "그럼 어떤 등급으로 나와야 해?"
      - 이준: "C급. C급으로 나오면 배정 제한이 풀리고, 백화의 압박도 일부 무효화할 수 있어요."
      - 세린: "C급으로 위장할 수 있어?"
      - 이준: "진전도를 조절하면 가능해요. Lv6 기준으로 C급 하위 범위의 마나량을 보여주면 돼."
      - 세린이 고개를 끄덕인다. "알겠어. 내일 아침에 협회에 신청서 넣을게. 심사는 2주 걸리지만, 긴급 신청이면 1주일로 단축 가능해."
      - 이준: "고마워."
      - 통화를 끊고 이준이 다시 종이를 본다. 계획의 윤곽이 잡혀가고 있다. 하지만 한 가지 더 고려해야 할 것이 있다.
      - 이준이 진명 감지(고급)를 가동. 남서쪽 600m. 미지의 파동은 — 오늘은 감지되지 않는다. 상대가 더 멀리 이동한 것인지, 아니면 완전히 은폐한 것인지.
      - 마지막 줄: 이준이 종이에 한 줄을 추가한다. "미지 보유자 — 동맹 가능성? 적?" 그 옆에 "서쪽 — 홍대"라고 적는다. 두 가지 미지가 이준 앞에 놓여 있다. 하나는 백화의 압박, 하나는 정체불명의 존재. 둘 다 이준의 앞날을 바꿀 수 있는 변수였다.
