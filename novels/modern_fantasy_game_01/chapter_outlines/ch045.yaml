chapter_n: 45
overall: |
  이준이 아버지 강철민의 과거를 조사하며 진명 시스템과의 연결 단서를
  발견한다. 5년 전 심장마비 사인에 의문이 생기며, 협회에서 박세진의
  보고서가 사라진 사실이 확인된다. 서동현이 결정을 내린다.

beats:
  - name: father_investigation
    instruction: |
      이 부분은 45화의 시작. 분량 2,000자 이상.
      - 아침. 이준이 협회 시설로 향한다. 어머니를 면회하면서 아버지의 과거에 대해 물어볼 생각이다.
      - 택시 안에서 이준이 진명 시스템을 확인한다. 41화에서 어머니의 담당 의사가 "철민"이라는 이름을 부르셨다는 말을 떠올린다. 그리고 시스템에서 어제 밤 새로운 퀘스트가 떠 있었다.
      - [퀘스트 업데이트: 가족의 보호 — 하위 퀘스트 추가: 강철민의 과거 조사 / 난이도: 상 / 보상: 시스템 정보 해금]
      - 시스템이 아버지의 이름을 인식하고 있다. 이것은 단순한 우연이 아니다. 진명 시스템이 이준의 가족 기록에 접근할 수 있다는 뜻이다.
      - 협회 시설. 어머니의 병실. 어머니는 치료 효과가 좋아 최근 의식이 더 많이 깨어 있다.
      - 이준이 어머니 옆에 앉는다. 평소처럼 가벼운 안부를 묻고, 이서 학교 이야기를 한다. 어머니가 미소 짓는다. "이서가 학교 갔어? 드디어. 그 아이 고집이 대단하니까."
      - 이준이 천천히 화제를 돌린다. "엄마. 아빠 이야기 좀 해도 돼?"
      - 어머니의 표정이 미세하게 변한다. 미소가 사라지고, 눈가에 그림자가 드리운다.
      - 이준: "아빠가 돌아가시기 전에... 뭔가 특이한 점이 있었어요? 이상한 행동이라든가."
      - 어머니가 잠시 침묵한다. 손끝이 시트를 쥐는다.
      - "아빠는... 원래 조용한 사람이었어. 회사 다니고, 집에 오고, 주말에 너희들이랑 놀아주고. 그런 사람이었는데..."
      - 어머니가 말을 멈춘다. "5년 전쯤부터 달라졌어. 퇴근이 늦어지고, 가끔 밤에 나가고... 물어보면 회사 일이라고만 했어."
      - 이준: "어떤 회사였어요? 아빠가 다니시던 곳."
      - 어머니: "무역회사였어. 수입품 취급하는. 근데 아빠가 죽고 나서 확인해봤더니... 그 회사가 2년 전에 폐업했어. 그리고 아빠가 다닌 적이 없는 것으로 처리되어 있었어."
      - 이준의 눈이 커진다. 아버지의 직장이 존재하지 않았다. 허위 직장.
      - 어머니가 계속한다. "아빠가 죽기 한 달 전에 집에 낯선 상자가 왔었어. 아빠가 내가 보기 전에 치워버렸는데... 상자 안에서 은색 빛이 났어. 아주 잠깐이었지만."
      - 은색 빛. 이준의 가슴이 뛴다. 마나. 일반인의 눈에 보이지 않는 마나를 어머니가 보았다면, 그 상자 안에는 마나 관련 물품이 들어 있었을 것이다.
      - 이준: "엄마. 그 상자는 어떻게 됐어요?"
      - 어머니: "아빠가 없앴어. '이건 위험한 거야. 절대 만지지 마'라고 했어. 그리고... 아빠가 죽기 일주일 전에 이런 말을 했어. '나한테 무슨 일이 생기면, 이서를 지켜줘. 이서가 특별하니까.'"
      - 이서가 특별하다. 이준이 숨을 삼킨다.
      - 어머니가 이준의 손을 잡는다. "이준아. 아빠가 뭔가에 연루되어 있었던 건 맞아. 하지만 그게 뭔지는 모르겠어. 다만... 너도 아빠랑 비슷해지고 있어. 눈빛이. 아빠가 마지막에 그랬던 눈빛."
      - 이준이 어머니의 손을 꽉 잡는다. "엄마. 걱정하지 마세요. 나는 아빠와 다르게 할 거예요."
      - 마지막 줄: 이준이 병실을 나온다. 복도를 걸으며 생각한다. 아버지는 헌터가 아니었다. 하지만 마나와 관련된 세계에 연루되어 있었다. 그리고 5년 전 심장마비로 죽었다. 이것이 진명 시스템과 관련이 있다면 — 이준의 각성은 우연이 아닐지도 모른다.

  - name: association_secret
    instruction: |
      이 부분은 45화의 중반. 분량 2,000자 이상.
      - 오후. 세린이 협회 본부 근처 식당에서 이명호를 만난다.
      - 이명호. 40대. C급 출신으로 협회 심사과에 입직한 관리직. 세린이 백화 시절부터 알던 인맥.
      - 세린이 이명호에게 백화 관련 정보를 조심스럽게 묻는다. "이명호 씨. 협회 심사과에 백화가 손을 쓰고 있다는 소문이 있어요."
      - 이명호가 식당을 두리번거리며 목소리를 낮춘다. "박세린 씨, 이런 얘기는 여기서 하면 안 돼요."
      - 세린: "알아요. 하지만 철혈 길드가 백화에 눌리고 있어요. 협회가 백화 편이면 우리는 끝이에요."
      - 이명호가 잠시 고민하다가 입을 연다. "듣기만 해요. 말은 안 할게요."
      - 이명호: "협회 심사과에 백화 매수 인력이 한 명 있어요. 누군지 직접적으로 알 수는 없지만, 등급 조정 건이 있을 때마다 백화에 정보가 새나가는 패턴이 있어요."
      - 세린: "등급 조정 건이라면... 이상한 측정 결과가 나온 헌터들의 기록?"
      - 이명호가 고개를 끄덕인다. "특히 갑작스러운 등급 상승이나 비정상적인 마나 패턴을 보이는 헌터. 그런 기록이 백화로 흘러가고 있어요."
      - 세린이 이것을 이준에게 보고할 내용으로 정리한다.
      - 이명호가 덧붙인다. "그리고 한 가지 더. 3년 전에 심사과에서 보고서 하나가 사라졌어요. 박세진이라는 헌터의 등급 재측정 기록. 정상적으로 처리되었어야 하는데, 기록 자체가 삭제됐어요."
      - 세린의 표정이 굳어진다. 오빠의 기록이 삭제되었다. 백화가 협회 내부에서 조작한 것이다.
      - 이명호: "더 이상은 말 못 해요. 박세린 씨, 조심해요. 백화가 당신을 눈여겨보고 있을 거예요."
      - 세린이 이명호에게 감사하다고 말하고 식당을 나온다.
      - 밖에서 이준이 기다리고 있었다. 세린이 이준에게 이명호의 말을 전달한다.
      - 이준이 듣고 잠시 침묵한다. "박세진 씨의 기록이 협회에서 삭제됐다... 백화가 협회 내부에 뿌리를 내린 지 꽤 됐네요."
      - 세린: "그리고 등급 조정 기록이 백화로 흘러나가고 있어. 당신의 것도 이미 백화한테 갔을 수 있어."
      - 이준: "알아요. 그래서 등급 재측정을 신청하는 거예요. 어차피 들킬 것이라면, 내가 원하는 타이밍에 드러내는 게 나아요."
      - 세린이 이준의 계산력에 감탄한다. 위기를 기회로 바꾸는 것이다.
      - 마지막 줄: 두 사람이 협회 건물 앞을 지나간다. 거대한 협회 건물 안에는 백화의 그림자가 드리워져 있었다. 공적인 기관이 사적인 이익에 의해 오염되어 있었다.

  - name: seodonghyeon_decision
    instruction: |
      이 부분은 45화의 마지막. 분량 2,000자 이상.
      - 밤. 백화 본사 38층. 서동현의 사무실.
      - 서동현이 책상 위에 두 가지를 놓고 있다. 왼쪽에 한도혁의 철혈 처리 계획서. 오른쪽에 검은색 USB.
      - 세린의 전화 이후 서동현은 잠을 못 잤다. 3년 전의 기억이 계속 떠오른다.
      - 회상. 3년 전. 박세진이 서동현을 찾아왔던 날. 세진의 표정은 평소와 달랐다. 긴장과 결의가 뒤섞인 표정.
      - "동현아. 나한테 이게 생겼어." 세진이 자신의 손바닥에 떠오르는 시스템 인터페이스를 보여주었다. 서동현은 처음에 믿지 않았다. 하지만 세진의 마나 패턴이 근본적으로 변해 있었다.
      - 서동현이 한도혁에게 보고했다. 직무였다. 15년간 충성해온 상사에게. 그리고 한도혁은 — "흥미롭군. 조사해."라고만 답했다.
      - 2개월 후 박세진이 죽었다. 서동현이 보고한 정보를 바탕으로 한도혁이 세진을 제거했다. 미클리어 던전에서의 "사고."
      - 서동현이 그 이후로 매일 밤 꿈을 꾼다. 세진이 죽기 전 마지막으로 서동현에게 준 USB. 그리고 세진의 마지막 말.
      - "동현아. 넌 나를 배신했어. 하지만 난 널 믿어. 이건 네가 지켜야 해. 때가 오면 네가 알아서 해."
      - 서동현이 USB를 집어 든다. 이 안에는 한도혁의 범죄 증거가 들어 있다. 이것을 강이준에게 주면, 이준은 한도혁에 대항할 수 있는 무기를 얻는다. 하지만 서동현은 한도혁에게 들키면 죽는다. 아니, 죽는 것은 가벼운 편이다. 한도혁은 사람을 죽이기 전에 모든 것을 빼앗는다.
      - 서동현이 의자에서 일어난다. 창밖을 본다.
      - "세린아. 네가 전화했을 때, 나는 네 목소리에서 세진을 들었어."
      - 서동현이 주머니에서 핸드폰을 꺼낸다. 새 번호를 입력한다. 세린이 전화한 번호.
      - 메시지를 작성한다. "박세진의 USB는 내가 가지고 있다. 만나서 이야기하자. 단, 절대 백화에 알리지 마."
      - 손가락이 전송 버튼 위에서 멈춘다. 10초. 20초. 30초.
      - 서동현이 전송을 누른다.
      - 핸드폰이 덜컥 소리를 낸다. 전송 완료.
      - 서동현이 핸드폰을 내려놓는다. 손이 떨린다. 하지만 동시에 — 3년간의 무게가 조금 가벼워진 것 같았다.
      - 서동현이 모니터의 철혈 처리 계획을 바라본다. 그리고 계획서 파일을 삭제하지 않는다. 대신, 다른 파일을 생성한다. "철혈 처리 계획 — 수정안." 수정안에는 이준에 대한 정보가 일부 누락되어 있다. 핵심 정보가 빠진 채로.
      - 서동현이 한도혁에게 보고할 때 이 수정안을 보여줄 것이다. 원본은 숨기고.
      - 3년 전과는 다르게. 이번에는 — 세린과 세진을 위해.
      - 마지막 줄: 서동현이 사무실 불을 끄고 집으로 향한다. 38층에서 내려오는 엘리베이터 안에서, 서동현은 처음으로 3년간의 무게에서 벗어난 듯한 깊은 숨을 쉰다. 어둠 속에서 그의 결정이 새로운 줄기를 시작했다.
