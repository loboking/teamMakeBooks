chapter_n: 46
overall: |
  백화가 이서의 학교에 B급 헌터를 투입하여 이준을 압박하고,
  이준이 학교 주변에서 비밀리에 보호 작전을 펼치며
  백화와의 본격적인 줄다리기에 돌입한다.

beats:
  - name: school_approach
    instruction: |
      이 부분은 46화의 시작. 분량 2,000자 이상.
      - 오전 8시. 이서가 학교에 등교하는 날. 이준은 등하교 마중을 조건으로 이서의 학교 복귀를 허락했고, 매일 아침 이서를 학교 정문까지 배웅하고 있다.
      - 이서의 학교는 서울 서초구에 있는 일반 고등학교. 던전 발생 이후 학교 주변에는 협회의 최소 경비 인력이 배치되어 있지만, B급 이상 위협에 대비한 수준은 아니다.
      - 이준이 이서를 배웅하고 학교에서 200m 떨어진 골목에서 마나 감지를 가동. 평소와 같이 주변을 스캔한다.
      - 그때 진명 감지(고급)가 반응한다. 학교 정문에서 300m 거리, 편의점 주차장에 B급 마나 반응이 멈춰 있다. 이전까지의 D급 감시자와는 차원이 다른 위협.
      - 이준의 표정이 굳어진다. B급이 학교 주변에 배치되었다. 이것은 이준을 겨냥한 것이 아니라 이서를 겨냥한 것이다.
      - 마나 감지로 B급의 상세 정보를 읽는다. 마나량은 B급 상위. 안정적이고 통제된 마나 흐름. 훈련된 전투원이다.
      - 이준이 핸드폰으로 세린에게 메시지. "학교 주변에 B급. 즉시 확인 필요."
      - 세린이 3분 뒤 답장. "백화의 B급이야. 이름은 조민우. 정보팀에서 파악한 인물. 한도혁 직할 부대 소속."
      - 이준이 긴장한다. 한도혁 직할. 즉 이것은 서동현의 정보팀이 아닌, 한도혁이 직접 지시한 작전이다.
      - 마지막 줄: 이준이 골목 끝에서 학교 방향을 응시한다. 300m 밖에서 B급 헌터가 이서의 학교를 지키고 있다. 지키는 게 아니라, 지켜보고 있다.

  - name: protection_operation
    instruction: |
      이 부분은 46화의 중반. 분량 2,000자 이상.
      - 이준이 즉시 보호 작전을 가동한다. 세린과 연락하면서 상황을 공유.
      - 세린: "한도혁이 직접 나서는 거야. 이준 씨를 압박하려는 거지. 학교에 B급을 배치하면 이준 씨는 이서를 지키기 위해 움직여야 하고, 움직이면 정체가 드러날 수 있어."
      - 이준: "알아. 하지만 물러날 수는 없어."
      - 이준이 학교 주변 지형을 분석. 마나 감지 범위 내에서 조민우의 위치를 실시간 추적. 조민우는 학교 정문 앞 편의점에서 커피를 마시며 학생들의 등교를 관찰하고 있다.
      - 이준의 선택지: (1) 직접 접촉하여 위협 — 정체 노출 위험. (2) 세린을 투입 — B급 대 B급 대치, 학교 앞에서 싸우면 큰 문제. (3) 은밀히 이서를 빼내기 — 당장은 불가능.
      - 이준이 네 번째 선택지를 선택. 마나 은폐를 최대로 가동하고 조민우에게 접근. B급이지만 마나 은폐 상태의 이준은 D급 이하로 보인다.
      - 이준이 편의점에 들어가 조민우 옆 자리에 앉는다. 마나 감지로 조민우의 상태를 정밀하게 읽는다.
      - 조민우의 마나 상태: 안정, 경계 태세 아님, 단순 감시 임무. 무기는 소매 안에 은닉한 단검 형태 마나 도구.
      - 이준이 조민우와 눈이 마주친다. 조민우가 이준을 보며 "학생이야?"라고 묻는다. 이준이 "근처에서 아르바이트 합니다"라고 거짓말.
      - 조민우가 다시 스마트폰을 본다. 화면에는 이서의 사진과 학교 시간표가 떠 있다.
      - 이준의 손이 떨린다. 분노다. 하지만 표정은 완벽하게 통제한다.
      - 마지막 줄: 이준이 편의점을 나오며 생각한다. 조민우 한 명은 처리할 수 있다. 하지만 문제는 조민우가 아니라 조민우를 보낸 사람이다. 한도혁은 이것이 시작일 뿐이라는 것을 안다.

  - name: counter_move
    instruction: |
      이 부분은 46화의 마지막. 분량 2,000자 이상.
      - 오후. 이준이 길드 사무실에서 세린, 김태석과 비밀 회의.
      - 김태석이 상황을 듣고 테이블을 주먹으로 친다. "학교에 B급을? 미쳤군. 학생들한테 무슨 짓을 하려는 거야."
      - 이준: "김태석 길드장님, 제가 직접 확인했습니다. 조민우는 감시 목적입니다. 당장 공격할 계획은 없어 보입니다. 하지만 이건 압박이에요. 저를 움직이게 만들려는 거죠."
      - 김태석: "그럼 어떻게 할 거야? 세린이 학교에 가서 대기시킬까?"
      - 이준이 거절. "세린 씨가 학교에 매일 배치되면 백화도 움직입니다. 그리고 세린 씨가 빠진 사이 길드 전력이 약해지죠."
      - 이준이 대안 제시. "제가 매일 등하교 시간에 학교 주변을 순찰하겠습니다. 마나 은폐 상태로. 조민우가 저를 감지하지 못하게 하면서, 이서가 위험에 처하면 즉시 대응합니다."
      - 세린: "F급으로 B급 상대? 위험해."
      - 이준: "싸우는 게 아니야. 이서를 지키는 거야. 조민우가 이서에게 직접 접촉하려고 하면 그때 대응합니다."
      - 김태석이 고민 끝에 수락. "좋아. 하지만 세린이 항시 대기할 수 있도록 학교에서 1km 이내에 배치해."
      - 이준이 회의를 마치고 길드 건물을 나온다. 계단에서 마나 감지를 가동.
      - 진명 감지(고급)가 반응한다. 조민우의 위치가 학교에서 500m로 이동했다. 하루 종일 학교 주변을 맴돌고 있다.
      - 그리고 또 하나. 500m 경계선 바로 너머에서 아주 희미한 파동. ch039에서 감지했던 것과 같은 파동. 누군가가 계속 이준을 관찰하고 있다.
      - 이준이 핸드폰을 본다. 이서에게서 온 메시지. "오빠, 오늘 수학 시간에 맨 앞자리 앉았어. 선생님이 칭찬했잖아. ㅎㅎ"
      - 이준이 미소 짓는다. 그리고 표정을 다잡는다.
      - 마지막 줄: 이준이 걷기 시작한다. 학교 방향으로. 백화의 B급이 학교를 지키고, 미지의 누군가가 자신을 지켜보고, 그 사이에서 이준은 이서의 하교 시간을 기다린다. 전쟁은 이미 시작되었다.
