chapter_n: 48
overall: |
  백화 회장 한도혁이 직접 김태석에게 회유 제안을 하고,
  철혈 길드 내부에 균열이 발생하며
  김태석이 처음으로 근본적인 회의감을 느끼게 된다.

beats:
  - name: chairman_summon
    instruction: |
      이 부분은 48화의 시작. 분량 2,000자 이상.
      - 오후 2시. 김태석이 갑작스러운 연락을 받는다. 백화 본사에서 한도혁 회장이 직접 만나자는 요청.
      - 김태석이 이준과 세린을 긴급 소집. "한도혁이 직접 나섰다. 만나야 할 것 같다."
      - 이준이 반대. "길드장님, 함정일 수 있습니다."
      - 김태석: "알아. 하지만 거절하면 더 노골적으로 올 거다. 직접 가서 그의 의도를 파악하고 오겠다."
      - 세린: "저도 같이 가겠습니다." 김태석이 거절. "세린, 넌 가면 안 돼. 한도혁이 너를 눈여겨보고 있다. 박세진의 여동생이라고."
      - 세린의 표정이 굳어지지만 김태석의 뜻을 따른다.
      - 이준이 김태석에게 마나 감지용 소형 장치를 건넨다. (진명 시스템에서 획득한 보상으로 만든 초소형 마나 감지기. F급 수준이지만 이상 반응 감지 가능.)
      - "이걸 주머니에 넣고 가십시오. 주변 마나 변화가 있으면 진동으로 알려줍니다."
      - 김태석이 장치를 받고 백화 본사로 출발.
      - 이준이 세린에게 남겨진다. "세린 씨, 길드장님이 돌아올 때까지 길드를 지켜주세요. 저는 백화 본사 주변에서 대기하겠습니다."
      - 세린: "위험해. 한도혁의 본사에서 500m 안에 들어가면?"
      - 이준: "들어가지 않아요. 감시만 할 겁니다."
      - 마지막 줄: 김태석이 백화 본사 45층으로 향하는 엘리베이터에 탄다. 그의 주머니 속 작은 장치가 미세하게 떨린다. 건물 전체가 마나로 뒤덮여 있다.

  - name: temptation
    instruction: |
      이 부분은 48화의 중반. 분량 2,000자 이상.
      - 백화 본사 45층. 한도혁의 집무실. 김태석이 들어선다.
      - 한도혁이 책상에서 일어나며 환영한다. 반갑지는 않지만 겉으로는 예의 바르다.
      - "김태석 길드장님. 오래간만입니다. 마지막으로 만난 게... 3년 전이었죠? 철혈 창립 축하 자리에서."
      - 김태석이 의자에 앉는다. 한도혁의 집무실은 서울 전체가 보이는 전망을 자랑한다. 압도적인 권력의 공간.
      - 한도혁이 직접 차를 따른다. "김태석 씨, 솔직하게 말하겠습니다. 철혈은 망할 길에 있습니다."
      - 김태석의 눈썹이 올라간다. 한도혁이 데이터를 꺼낸다. 철혈의 재정 상황, 거래처 이탈 현황, 길드원 탈퇴 추이.
      - "거래처 3곳이 돌아왔다고요? 그건 제가 풀어준 겁니다. 다시 조이면 3주 안에 전부 떠납니다."
      - 김태석이 이를 악문다. "회유하러 온 겁니까?"
      - 한도혁이 고개를 젓는다. "회유가 아닙니다. 현실을 말하는 겁니다. 철혈의 자금은 2개월을 버티지 못합니다. 길드원 월급, 시설 유지비, 던전 보험. 전부 제가 손을 떼면 무너집니다."
      - 한도혁이 제안을 꺼낸다. "철혈을 백화 산하로 편입하세요. 길드 이름은 유지합니다. 김태석 씨는 부길드장으로. 연봉은 현재의 5배. 길드원 전원 백화 수준의 복지."
      - 김태석이 침묵. 한도혁이 마지막 카드를 꺼낸다.
      - "그리고... 강이준 씨에 대한 문제도 해결해드리죠. 당신이 가진 그 불안한 카드. 제가 처리해드리겠습니다. 강이준 씨를 안전하게 보호하는 조건으로."
      - 김태석의 표정이 변한다. 한도혁이 이준에 대해 언급한 것. 그리고 '보호'가 아니라 '처리'의 의미가 담긴 말투.
      - 김태석: "강이준은 제 길드원입니다."
      - 한도혁이 미소 짓는다. "물론이죠. 그래서 지금 이렇게 예의 바르게 대화하는 겁니다."
      - 마지막 줄: 김태석이 집무실을 나온다. 엘리베이터 안에서 그의 주머니 속 장치가 계속 진동하고 있다. 45층 전체가 B급 이상 마나로 가득하다. 한도혁의 본거지는 감옥이었다.

  - name: crack
    instruction: |
      이 부분은 48화의 마지막. 분량 2,000자 이상.
      - 저녁. 김태석이 철혈 길드로 복귀. 이준과 세린이 기다리고 있다.
      - 김태석이 회의실에 들어서자마자 이준이 묻는다. "어떻셨습니까?"
      - 김태석가 의자에 앉으며 한참을 침묵한다. 그리고 한도혁의 제안을 전부 전달한다.
      - 세린이 분노. "백화 산하? 길드를 팔아넘기라는 거야?"
      - 김태석: "거절했다. 당연하지. 하지만..."
      - 김태석이 말을 멈춘다. 그리고 진심으로 고백한다.
      - "한도혁이 맞았다. 자금은 2개월을 못 버텨. 거래처 복귀도 그가 조작한 거다. 우리가 생각하는 것보다 상황이 훨씬 심각하다."
      - 회의실이 무거운 침묵에 잠긴다.
      - 김태석이 이준을 본다. "이준아, 한도혁이 너에 대해서도 언급했다. 너를 '불안한 카드'라고 불렀다. 그리고 네가 무엇인지 알고 있는 것 같았다."
      - 이준의 표정이 변하지 않는다. 하지만 속으로 긴장한다. 한도혁이 김태석에게 이준을 언급했다는 것은, 김태석을 이준과 분리시키려는 전략이다.
      - 이준: "길드장님, 전 여기 있겠습니다. 철혈이 무너져도 전 여기 있습니다."
      - 김태석이 쓸쓸하게 웃는다. "고맙다. 하지만 네가 무슨 수를 쓸 수 있지? F급이... 아니, 네가 뭔지는 모르겠지만, 혼자서 백화를 막을 수는 없어."
      - 이준이 대답하지 않는다. 대답할 수 없다.
      - 김태석이 회의실을 나간다. 복도에서 그의 뒷모습이 처음 보는 것처럼 늙어 보인다. A급 헌터이자 길드장이었던 남자의 어깨가 처져 있다.
      - 세린이 이준에게 속삭인다. "김태석 길드장님이 흔들리고 있어."
      - 이준: "알아. 하지만 흔들리지 않는 게 비정상이지. 백화가 30년간 쌓아온 권력에 대항하는 건... 쉬운 일이 아니야."
      - 마지막 줄: 이준이 회의실 창밖을 본다. 철혈 길드의 작은 불빛이 서울의 야경 속에 묻혀 있다. 백화 본사의 45층에서 보면 이 불빛조차 안 보일 것이다. 하지만 이준은 본다. 지켜야 할 것이 여기 있다.
