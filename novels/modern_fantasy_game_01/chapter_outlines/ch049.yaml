chapter_n: 49
overall: |
  이준과 세린이 백화 내부 정보를 수집하기 위해 협력하고,
  서동현이 배신 결심을 굳히며 백화에서 핵심 정보를 빼낸다.
  서동현의 제공 정보가 이준에게 새로운 전략적 선택지를 열어준다.

beats:
  - name: intelligence_gathering
    instruction: |
      이 부분은 49화의 시작. 분량 2,000자 이상.
      - ch047 서동현의 비밀 접촉 이후 3일 경과. 이준은 세린에게 박세진의 죽음에 대한 진실을 전했다.
      - 세린의 반응은 차분했지만, 그 차분함이 더 무서웠다. "알고 있었어. 아니, 의심하고 있었어. 오빠가 던전에서 죽은 게 아니라는 걸."
      - 세린이 이준에게 제안. "백화 내부 정보가 필요해. 서동현이 줄 수 있는 건 한계가 있어. 우리가 직접 수집해야 해."
      - 이준: "어떻게?"
      - 세린이 백화의 구조를 분석. "백화 정보팀은 38층. 서동현이 팀장. 그 아래에 12명의 분석관이 있어. 그중 3명은 한도혁 직할이고, 나머지 9명은 일반 직원이야."
      - 세린이 한 가지를 더 말한다. "백화는 매주 금요일에 각 부서별 보고서를 종합하는 회의를 해. 38층에서 42층 중간 관리층까지 보고서가 올라가. 그 회의 자료에는 철혈 처리 계획의 세부 내용이 포함되어 있어."
      - 이준이 마나 감지와 진명 감지를 활용한 정보 수집 방안을 고민. 물리적으로 백화 건물에 침투하는 것은 자살 행위다.
      - 하지만 진명 시스템이 새로운 기능을 알려준다. [진명 감지(고급) — 원거리 마나 서명 판독 가능. 대상의 마나 패턴을 저장하면 1km 이내에서 위치 추적 가능.]
      - 이준이 아이디어를 낸다. "서동현 팀장님의 마나 패턴을 이미 저장했습니다. 그가 백화 건물 밖으로 나오면 위치를 추적할 수 있어요. 다음 접촉 때 더 구체적인 정보를 요청하겠습니다."
      - 세린: "서동현을 믿어도 되는 거야?"
      - 이준이 잠시 생각한다. "백 프로 믿는 건 아니에요. 하지만 그의 마나에서 나오는 건 진심이었습니다. 그리고 그에게도 우리가 필요해요. 서동현은 빠져나갈 구멍을 찾고 있어요."
      - 마지막 줄: 이준과 세린이 백화 본사 주변 지도를 펼치고 있다. 적의 심장부에서 정보를 빼내는 작전. 서동현이 그 다리가 될 것이다.

  - name: leaked_intelligence
    instruction: |
      이 부분은 49화의 중반. 분량 2,000자 이상.
      - 2일 후, 금요일 밤. 이준이 서동현과 두 번째 비밀 접촉. 장소는 첫 번째와 다른 곳, 강남역 근처의 무인 카페.
      - 서동현이 USB 메모리를 테이블 위에 놓는다. "이 안에 철혈 처리 계획의 초안과 백화의 향후 3개월 일정이 들어 있습니다."
      - 이준이 USB를 확인하지 않고 서동현을 본다. "팀장님, 이건 팀장님한테도 위험한 일입니다."
      - 서동현: "알아. 하지만 결심했습니다. 이건 제 빚을 갚는 거예요."
      - 서동현이 USB 안의 내용을 구두로 요약. "철혈 처리 계획은 3단계입니다. 첫째, 경제적 고사. 거래처 전면 차단, 길드 시설 임대 계약 해지, 길드원 월급 지연 유도. 둘째, 핵심 인물 분리. 김태석을 고립시키고, 세린을 백화 쪽으로 끌어들이려 합니다. 셋째, 강이준 씨를 확보."
      - 이준: "확보의 구체적인 방법은?"
      - 서동현이 표정을 어둡게 한다. "한도혁 회장님은 살아있는 상태로 확보하려 합니다. 이유는... 진명 시스템의 원리를 파악하려는 거죠. 세진이 때는 그 시간을 두지 않았지만, 이번에는 다르게 접근하겠다고 했습니다. 이준 씨를 '협력자'로 만들려는 겁니다."
      - 이준이 전신에 소름이 돋는 것을 느낀다. 살아서 잡혀가는 것. 그것이 죽는 것보다 끔찍하다. 백화의 시설에서 자신의 비밀이 파헤쳐지고, 이용당하고, 결국 버려지는 것.
      - 서동현이 한 가지 더 덧붙인다. "그리고 한 가지 더. 한도혁 회장님이 최근 새로운 인력을 영입했습니다. A급 헌터. 이름은 정재훈. 외부에서 스카우트한 인력이에요. 철혈 처리 전담으로 보입니다."
      - 이준: "A급?"
      - 서동현: "네. A급 중위. 한도혁 회장님 직할 부대장급입니다. 이 사람이 실무를 총괄합니다."
      - 이준의 머릿속에서 계산이 돌아간다. A급 중위가 철혈 처리 전담이라면, 물리적 충돌이 불가피하다. 세린이 B급이고 김태석이 A급이지만, 백화의 전력은 철혈을 압도한다.
      - 마지막 줄: 서동현이 일어서며 "이건 제가 할 수 있는 마지막입니다"라고 말한다. 이준이 고개를 숙인다. "알겠습니다. 소중히 사용하겠습니다."

  - name: new_strategy
    instruction: |
      이 부분은 49화의 마지막. 분량 2,000자 이상.
      - 이준이 길드 사무실에서 세린과 함께 USB의 정보를 분석. 노트북으로 자료를 확인.
      - 철혈 처리 3단계 계획의 세부 내용이 눈앞에 펼쳐진다.
      - 1단계: 경제적 고사. 타겟 거래처 15곳 전면 차단 명령. 철혈 길드 시설 임대 계약 해지 통보. 길드원 월급 지연 유도를 위한 금융 경로 차단. 시행 일정: 2주 이내.
      - 2단계: 핵심 인물 분리. 김태석과 주요 길드원 사이에 불신 심기. 세린에게 박세진 사망 진실을 공개하여 복수심 자극 후 백화로 포섭 시도. 이준과 김태석 사이의 관계를 이용하여 이준을 고립.
      - 3단계: 이준 확보. 정재훈(A급) 지휘 하에 이준을 생포. 협력 거부 시 가족(이서, 어머니)을 협상 카드로 사용.
      - 이준의 주먹이 움켜쥐어진다. 가족. 이서와 어머니를 협상 카드로 사용하겠다는 것이다.
      - 세린이 이준의 표정을 본다. "이준 씨, 괜찮아?"
      - 이준이 심호흡. "진정해. 생각해보면... 이건 기회이기도 해."
      - 세린이 고개를 갸웃. 이준이 설명.
      - "백화가 3단계로 나눈 건 철혈을 조금씩 압박하겠다는 뜻이야. 즉, 당장 전면 공격은 없다는 거죠. 2주의 시간이 있어요."
      - "그리고 정재훈. A급 중위를 외부에서 스카우트했다는 건, 백화 내부에 한도혁이 완전히 신뢰하는 A급이 없다는 뜻이기도 해요."
      - 이준이 전략을 세우기 시작. "2주 안에 세 가지를 해야 합니다. 첫째, 김태석 길드장님을 안심시킬 대안 마련. 둘째, 세린 씨를 보호 — 백화가 세린 씨에게 접근할 거예요. 셋째, 가족 보호 강화. 이서와 어머니를 백화가 닿을 수 없는 곳으로."
      - 세린: "어머니는 협회 시설인데. 백화가 협회에 손을 댈 수 있어?"
      - 이준: "한도혁이 30년간 쌓은 인맥이라면 가능해. 협회도 완벽하진 않아."
      - 진명 시스템 메시지. [퀘스트 업데이트 — 철혈의 보호 / 난이도: 최상 / 목표: 3단계 계획 무력화 / 시한: 14일 / 보상: Lv6 달성 + 진명 감지(고급) 전면 해금 + ???].
      - 이준이 시스템 창을 닫는다. 14일. 그 기간 안에 백화의 계획을 무력화해야 한다.
      - 마지막 줄: 이준이 서울의 야경을 바라본다. 백화 본사 45층의 불빛이 멀리 보인다. 저기서 한도혁이 체스판을 짜고 있다. 하지만 이준도 이제 말을 움직일 수 있다.
