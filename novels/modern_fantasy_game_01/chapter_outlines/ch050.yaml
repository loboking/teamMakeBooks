chapter_n: 50
overall: |
  2막 중간 전환점. 백화의 경제적 공세가 본격화되며 철혈이 최대 위기를 맞고,
  이준이 Lv6에 돌파하며 진명 감지(고급)를 전면 해금한다.
  이준이 길드를 위해 처음으로 능력을 공개적으로 사용하며 본격 등장한다.

beats:
  - name: economic_war
    instruction: |
      이 부분은 50화의 시작. 분량 2,000자 이상.
      - 월요일 아침. 철혈 길드에 최악의 소식이 들어온다.
      - 김태석이 아침 회의에서 발표. "거래처 8곳에서 동시에 계약 해지 통보를 받았다. 던전 임무 의뢰 전면 취소. 그리고 길드 건물 임대 계약 해지 통보."
      - 회의실이 술렁인다. 길드원들의 얼굴에 공포가 스친다.
      - 김태석이 계속. "이것은 백화의 전면 경제 전쟁 선언입니다. 우리가 예상했던 것보다 훨씬 빠릅니다."
      - C급 헌터 정민호가 손을 든다. "길드장님, 그러면 우리는... 어떻게 됩니까?"
      - 김태석이 대답하지 못한다. 대답할 수 없다.
      - 그때 박동현이 일어선다. "저 백화 이직 제안을 받았던 사람입니다. 그때 거절했지만... 지금은 다르게 생각합니다."
      - 회의실이 얼어붙는다. 박동현이 "제가 백화에서 연락을 받았습니다. 오늘부터 급여 3배, B급 진급 보장. 길드가 무너지기 전에 나가라는 거죠."
      - 길드원 한 명이 뒤따른다. "나도... 연락 받았습니다."
      - 또 한 명. "저도요."
      - 결국 길드원 23명 중 7명이 백화에서 연락을 받았다고 밝힌다. 철혈 길드가 무너지고 있다.
      - 세린이 이준 옆에서 이를 악문다. 이준이 마나 감지로 길드원들의 상태를 읽는다. 두려움, 불안, 그리고 약간의 분노.
      - 김태석이 자리에서 일어난다. "나도 알고 있다. 상황이 끔찍하다는 거. 하지만..."
      - 김태석의 목소리에 힘이 빠져 있다. A급 헌터의 목소리가 아니었다.
      - 이준이 자리에서 일어난다.
      - 마지막 줄: 모든 시선이 이준에게 향한다. F급 짐꾼. 만년 꼴찌. 하지만 지금 이준의 눈빛에는 아무도 본 적 없는 빛이 서려 있다.

  - name: level_breakthrough
    instruction: |
      이 부분은 50화의 중반. 분량 2,000자 이상.
      - 이준이 길드원들 앞에 선다. F급 짐꾼이 길드원 전체 회의에서 발언하는 것은 전례 없는 일이다.
      - "저는 F급입니다. 모두가 아시잖아요. 짐꾼이고, 싸움도 못하고, 길드에서 가장 쓸모없는 사람이에요."
      - 길드원들이 불편한 표정. 이준의 말이 사실이기 때문이다.
      - "하지만 저는 8개월 동안 이 길드의 모든 던전 임무에 참여했습니다. 짐을 나르면서, 정리하면서, 청소하면서. 그 8개월 동안 저는 이 길드가 무엇인지 봤습니다."
      - 이준이 길드원들을 하나씩 본다.
      - "박동현 씨, 길드에 처음 왔을 때 김태석 길드장님이 식비까지 대줬던 날 기억나요? 정민호 씨, C급 진급 시험 3번 떨어졌을 때 길드장님이 '한 번 더 기회를 주겠다'고 했던 거?"
      - 박동현과 정민호의 표정이 변한다.
      - "백화에서 3배를 줍니다. B급 진급을 보장합니다. 좋습니다. 그리고요? 1년 뒤에 뭡니까? 백화에서 쓸모가 없어지면 어떻게 됩니까? 여러분은 소모품이 됩니다."
      - 이준이 목소리를 높인다. "이 길드는 가족입니다. 돈이 없어도, 거래처가 없어도, 건물이 없어도, 이 사람들이 모여 있으면 철혈은 존재합니다. 김태석 길드장님이 철혈을 만든 게 아니에요. 우리가 만든 겁니다."
      - 회의실에 침묵. 길드원들의 눈빛이 변한다.
      - 바로 그 순간, 이준의 몸에서 폭발적인 마나가 솟아오른다. 진명 시스템이 가동.
      - [Lv5 → Lv6 달성! / 진명 감지(고급) 전면 해금! / 마나 감지 범위: 200m → 500m / 진명 감지 범위: 500m → 1.2km / 새 스킬: '진명 서명' — 대상의 마나 패턴을 영구 저장 및 1km 추적 가능.]
      - 이준의 몸에서 F급의 한계를 넘어서는 마나 파동이 퍼져나간다. 길드원 전원이 느낀다. 이것은 F급이 아니다.
      - 김태석의 눈이 크게 벌어진다. 세린이 숨을 삼킨다.
      - 이준이 마나를 즉시 억제한다. 하지만 이미 느낀 사람들은 느꼈다.
      - 마지막 줄: 이준이 길드원들을 본다. 그의 눈빛은 단호하다. "철혈을 떠나고 싶은 사람은 가도 됩니다. 하지만 저는 여기 있습니다. 끝까지."

  - name: public_emergence
    instruction: |
      이 부분은 50화의 마지막. 분량 2,000자 이상.
      - 회의실의 충격이 가라앉지 않은 상태에서 길드원들이 흩어진다.
      - 7명 중 4명이 백화 제안을 거절하고 남기로 결정. 박동현, 정민호, 그리고 D급 2명. 3명은 여전히 고민 중이지만, 당장 떠나지는 않기로.
      - 김태석이 이준을 자기 사무실로 부른다. 문을 잠근다.
      - "이준아. 방금 그건 뭐였어?"
      - 이준이 침묵.
      - 김태석: "F급에서 나올 수 있는 마나가 아니야. 나는 A급이야. 감지했어. 방금 네 몸에서 나온 마나는... 최소 C급 상위. 아니, 그 이상일 수도."
      - 이준이 한참을 고민한 끝에 결정을 내린다. 더 숨길 수 없다. 적어도 김태석에게는.
      - 이준이 진명 시스템의 일부를 공개. "저는 늦깎이 각성이 맞습니다. 하지만 일반적인 각성과는 다릅니다. 저한테는... 시스템이 있습니다. 제 능력을 보여주고, 관리해주는 무언가가."
      - 김태석이 이준을 다시 본다. "시스템?"
      - 이준: "자세한 건 아직 말할 수 없습니다. 하지만 한 가지는 확실합니다. 저는 철혈을 지킬 수 있습니다. 이 능력으로."
      - 김태석이 의자에 깊이 앉는다. 오랜 침묵 후 한숨.
      - "왜 지금까지 안 말했어?"
      - 이준: "말하면 죽습니다. 이런 능력을 가진 사람이 과거에 있었습니다. 박세진 씨. 2개월 만에 죽었죠."
      - 김태석의 표정이 변한다. 박세진. 세린의 오빠.
      - 김태석: "...한도혁이?"
      - 이준: "네."
      - 김태석이 책상을 주먹으로 친다. 하지만 이번에는 분노가 아니라 결의가 담겨 있다.
      - "좋아. 이준아. 이제부터 계획을 세우자. 네 능력을 숨기면서도 쓸 수 있는 방법. 철혈을 살릴 수 있는 방법. 그리고 한도혁을 막을 수 있는 방법."
      - 이준이 고개를 끄덕인다.
      - 세린이 문을 노크하고 들어온다. "들었습니다. 이준 씨가..."
      - 김태석: "알아. 세린, 너도 포함해. 이제 셋이서 싸운다."
      - 세린이 이준을 본다. 이준이 고개를 끄덕인다.
      - 저녁. 이준이 길드 옥상에 선다. 진명 감지(고급) 1.2km 가동. 서울의 마나 풍경이 완전히 달라 보인다.
      - 1.2km 안에 수십 명의 마나 반응. 그중 B급 이상이 4개. 백화 본사 방향에서 가장 강한 반응. S급. 한도혁.
      - 그리고 또 하나. 1km 거리, 남서쪽. 아주 희미한 파동. 진명 시스템 보유자의 파동. ch039, ch046에서 감지했던 것과 같은.
      - 이번에는 파동이 10초 이상 지속된다. 그리고 사라지기 전, 이준의 진명 감지가 파동의 출처를 정확히 파악한다.
      - 홍대 방향. 서쪽 보유자. 이준과 같은 진명 시스템 보유자.
      - 마지막 줄: 이준이 홍대 방향을 응시한다. 자신이 혼자가 아니라는 것을 확인한 순간, 전쟁의 양상이 완전히 바뀐다. 적도 있지만, 동료도 있다. 2막의 후반전이 시작된다.
