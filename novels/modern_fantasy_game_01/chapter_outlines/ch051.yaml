chapter_n: 51
overall: |
  백화 회장 한도혁이 이준의 공개 등장에 직접 대응한다. 전략을 은밀함에서
  노골적으로 전환하며, 새로 영입한 A급 중위 정재훈이 철혈 처리 실무를
  맡아 첫 공식 임무를 수행한다. 서동현이 이준에게 한도혁의 반응과 정재훈의
  정보를 비밀리에 전달하며, 양측의 다음 수가 서로 교차한다.

beats:
  - name: chairman_reaction
    instruction: |
      이 부분은 51화의 시작. 분량 2,000자 이상.
      - ch050 이준의 공개 마나 노출 다음 날 아침. 백화 본사 45층. 한도혁의 집무실.
      - 한도혁이 서동현의 수정안 보고서를 읽고 있다. 수정안에는 이준의 Lv6 돌파와 마나 노출에 대한 분석이 담겨 있지만, 서동현이 의도적으로 핵심 정보 — 진명 서명 기능과 1.2km 감지 범위 — 를 누락시켰다.
      - 한도혁이 서류를 덮으며 입을 연다. "서동현. 이 수정안엔 뭔가 빠져 있어."
      - 서동현의 등줄기에 식은땀이 흐른다. 표정을 완벽하게 통제한다. "회장님, 분석팀에서 도출한 최선의 결과입니다. 이준의 마나량은 C급 상위에서 B급 하위 사이로 추정됩니다."
      - 한도혁이 의자에서 일어나 창밖을 본다. "추정? 내가 추정을 원해서 널 15년간 쓴 줄 아니?"
      - 서동현이 입술을 깨물며 침묵.
      - 한도혁이 돌아본다. "어젯밤 내 감지 시스템이 잡았어. 철혈 길드 건물에서 마나 파동이 퍼져나갔어. 그 파동의 질감은... 3년 전과 같았어. 세진이와."
      - 서동현이 숨을 삼킨다. 한도혁이 직접 감지했다는 것은, 백화 본사에 진명 시스템 수준의 감지 장비가 설치되어 있다는 뜻이다.
      - 한도혁이 서동현을 본다. "계획을 바꾼다. 은밀하게 굴 필요 없어. 이준이 스스로 드러냈으니까, 우리도 노골적으로 간다."
      - 한도혁이 비서에게 전화를 건다. "정재훈 불러."
      - 2분 후. 사무실 문이 열리고 한 남자가 들어온다. 정재훈. 30대 중반. 키 180cm, 단단한 체격. A급 중위의 마나가 방 전체를 무겁게 누른다.
      - 이준이 ch050에서 길드원들 앞에서 보여준 마나와는 차원이 다른 압박감이다. 정재훈의 마나는 통제되어 있지만, 그 안에는 살의가 서려 있다.
      - 한도혁: "재훈아. 어제부터 철혈 처리 실무를 맡아. 구체적인 지시는 내가 내릴 거야."
      - 정재훈이 고개를 끄덕인다. 표정이 없다. 감정을 읽을 수 없는 얼굴. 군인 출신 특유의 무표정이다.
      - 한도혁: "첫 번째 임무. 철혈 길드원들에게 직접 접촉해. 매수 대상 7명 중 아직 결정하지 않은 3명을 먼저. 조건은 이전보다 관대하게. 월급 4배, 백화 전속 계약, 등급 보장. 단, 3일 안에 답을 받아."
      - 정재훈: "3일 안에 답이 안 나오면?"
      - 한도혁이 미소 짓는다. 사냥꾼의 미소. "그때는 두 번째 방법을 쓰지. 네가 가장 잘하는 방법."
      - 정재훈이 나간다. 서동현이 그의 뒷모습을 본다. 정재훈의 마나 잔여가 복도에 남아 있다. 서동현은 그것을 읽을 수 있다 — 이 남자는 전직 군 헌터다. 이라크 게이트 파병 출신. A급 진급 후 백화에 스카우트되었다. 한도혁이 "가장 잘하는 방법"이라고 한 것은 — 공개적인 위협, 물리적 압박, 그리고 필요하다면 제거를 의미한다.
      - 서동현이 한도혁에게 고개를 숙이고 퇴실한다. 엘리베이터 안에서 서동현이 핸드폰을 확인한다. 이준에게 보낼 메시지를 작성한다.
      - 마지막 줄: 서동현이 전송 버튼을 누른다. "긴급. 한도혁이 전략 변경. 은밀함에서 노골적으로 전환. 정재훈(A급 중위)이 철혈 처리 실무 담당. 3일 내 길드원 매수 완료 지시. 이후 물리적 압박 예상."

  - name: jung_jaehoon
    instruction: |
      이 부분은 51화의 중반. 분량 2,000자 이상.
      - 같은 날 오후 3시. 정재훈이 철혈 길드 건물 앞 100m 거리 주차장에 세운 SUV 안에 앉아 있다.
      - 정재훈이 철혈 길드 건물을 관찰한다. 진명 시스템이 없어도 A급 중위의 감지 능력으로 길드 내부의 마나 상황을 대략적으로 파악할 수 있다.
      - 건물 안에서 세 개의 마나 반응이 뚜렷하다. B급 하나 — 박세린. A급 하나 — 김태석. 그리고 하나 더 — C급 상위에서 B급 하위 사이. 강이준.
      - 정재훈이 마나를 읽으며 분석. 김태석의 마나는 안정적이지만 피로한 흔적이 있다. 세린의 마나는 날카롭고 경계 상태. 이준의 마나는... 흥미롭다. C급 범주이지만 안에 무언가가 더 있다. 마치 표면 아래에 또 다른 층이 있는 것처럼.
      - 정재훈이 핸드폰으로 한도혁에게 보고. "김태석 — 피로도 높음, 전투력 유지 가능하나 지속전 불리. 세린 — 경계 태세, 언제든 전투 가능. 이준 — 마나량 C급 상위 추정이나 내부 구조 비정상. 정밀 분석 필요."
      - 한도혁의 답장. "이준은 건드리지 마. 아직 아니야. 길드원부터."
      - 정재훈이 SUV에서 내린다. 갈색 재킷에 청바지. 헌터로 보이지 않는 평범한 복장. 하지만 걸음걸이는 훈련된 전투원의 것이다.
      - 정재훈이 철혈 길드 건물 근처 카페에 들어간다. 이 카페는 길드원들이 자주 이용하는 곳이다. 정재훈은 이전에 한도혁의 지시로 철혈 길드원들의 일과를 파악한 바 있다.
      - 카페 안에서 D급 길드원 최은지가 혼자 앉아 있다. 스마트폰을 보며 커피를 마시고 있다. 백화 매수 대상 중 한 명.
      - 정재훈이 최은지 옆자리에 자연스럽게 앉는다. 이 men이 자신이 백화 사람이라는 것을 모르게 하려는 것이다. 하지만 이것은 오히려 더 위협적이다 — 정재훈의 마나가 D급 헌터에게는 물리적 압박으로 느껴지기 때문이다.
      - 최은지가 불편해하며 옆을 본다. 정재훈이 미소 짓는다. "혹시 철혈 길드원이세요? 저도 헌터인데, 철혈에 관심이 있어서요."
      - 최은지가 경계하며 "네, 맞아요"라고 답한다. 하지만 그녀의 마나가 불안정하게 흔들린다. A급의 마나에 압도당하고 있다.
      - 정재훈이 대화를 이어간다. "들으니까 백화에서 좋은 조건으로 스카우트한다면서요? 저도 백화에서 제안받았는데... 거기 가면 정말 좋은 거 맞나요?"
      - 이것은 교묘한 심리전이다. 최은지에게 "백화 제안을 받은 다른 헌터도 있다"는 인상을 주어, 백화 이직이 일반적인 선택이라고 암시하는 것이다.
      - 최은지가 표정을 변화시킨다. "저도... 연락을 받았어요. 아직 결정은 안 했는데."
      - 정재훈이 카드를 건넨다. "백화 인사팀 정재훈이에요. 혹시 궁금한 거 있으면 연락해 주세요."
      - 최은지가 카드를 받으며 손이 미세하게 떨린다. 정재훈의 마나 압박이 그녀에게 무의식적인 공포를 유발하고 있다.
      - 정재훈이 카페를 나온다. SUV에 돌아와서 핸드폰을 본다. 서동현의 메시지가 이준에게 전송된 것을 확인한다. 물론 정재훈은 이것을 모른다.
      - 마지막 줄: 정재훈이 운전석에 앉으며 후시경으로 길드 건물을 본다. "3일." 그가 혼잣말한다. 3일 안에 길드원을 빼내고, 그다음은 이준 차례다. 한도혁이 말한 "가장 잘하는 방법" — 정재훈은 그것을 아주 잘 알고 있다.

  - name: urgent_intelligence
    instruction: |
      이 부분은 51화의 마지막. 분량 2,000자 이상.
      - 오후 5시. 이준이 길드 사무실에서 서동현의 메시지를 받고 세린과 김태석을 긴급 소집.
      - 이준이 서동현의 정보를 공유. "한도혁이 전략을 바꿨습니다. 은밀한 방식에서 노골적인 방식으로. 그리고 정재훈이라는 A급 중위가 실무를 맡았습니다."
      - 김태석의 표정이 굳어진다. "A급 중위? 외부 스카우트라면 한도혁이 직접 기른 사람이 아니라는 거야."
      - 이준: "맞습니다. 서동현 팀장님의 정보에 따르면 이라크 게이트 파병 출신입니다. 전직 군 헌터. 한도혁이 '가장 잘하는 방법'이라고 했다고 합니다."
      - 세린이 이를 악문다. "가장 잘하는 방법이라면... 공개적인 위협이나 직접적인 압박이에요."
      - 김태석이 의자에서 일어나 창밖을 본다. "3일. 길드원 매수 완료 지시. 그리고 그다음은 물리적 압박."
      - 이준: "길드장님. 정재훈이 오늘 이미 길드원에게 접촉했을 가능성이 높습니다. 매수 대상 3명 중 최소 한 명은 이미 만났을 거예요."
      - 김태석이 이준을 본다. "어떻게 대처하길 원해?"
      - 이준이 말하기 전에 세린이 먼저 입을 연다. "길드원들을 모아야 해요. 지금 상황을 정확히 알려주고, 백화가 보내는 사람이 누구인지 공개해야 합니다."
      - 이준: "세린 씨 말이 맞습니다. 하지만 그것만으로는 부족해요. 정재훈은 A급 중위입니다. 감정을 숨기고, 마나 압박을 주면서, 자연스럽게 길드원들을 압박할 거예요. D급 헌터는 A급의 마나 앞에서 무의식적으로 공포를 느낍니다. 그 공포를 이용하는 겁니다."
      - 김태석: "그럼 대책은?"
      - 이준이 진명 감지(고급)를 가동. 길드 건물 내부 스캔. 길드원들의 마나 상태를 실시간 확인.
      - "제가 매일 길드원들의 마나 상태를 모니터링하겠습니다. 정재훈이 접촉한 길드원의 마나에 변화가 있으면 즉시 파악할 수 있어요. 그리고 길드원들에게 정재훈의 정보를 제공하겠습니다. 상대가 누구인지 알면 공포의 효과가 줄어듭니다."
      - 김태석이 고개를 끄덕인다. "좋아. 이준아, 네가 감시 총괄을 맡아. 세린은 길드원들 개별 면담을 진행해. 나는 정재훈과 직접 맞서야 할 경우를 대비해."
      - 이준이 회의를 마치고 옥상으로 나온다. 진명 감지(고급) 1.2km 가동.
      - 백화 본사 방향에서 S급 마나 반응 — 한도혁. 하지만 오늘은 다른 점이 있다. 한도혁의 마나 옆에 또 하나의 강한 마나 반응. A급 상위. 정재훈이다. 두 사람이 같은 공간에 있다 — 지시를 내리는 한도혁과, 그것을 실행할 정재훈.
      - 그리고 남서쪽 1km. 홍대 방향. 미지의 보유자 파동이 다시 나타났다. ch050에서 10초간 지속된 것과 같은 파동. 하지만 오늘은 더 깁다. 20초. 30초.
      - 이준이 진명 서명을 시도한다. 상대의 마나 패턴을 영구 저장하는 기능. 파동이 1km 거리에 있어 선명하지는 않지만, 패턴의 윤곽은 잡힌다.
      - [진명 서명 시도 중... 거리 1km... 패턴 불완전... 40% 기록 완료]
      - 40%. 아직 부족하다. 더 가까이 가야 한다. 하지만 상대는 이준이 접근하면 도망친다. ch044에서 이미 확인했다.
      - 이준이 핸드폰을 본다. 이서에게서 온 메시지. "오빠, 오늘 학교에서 조민우 아저씨가 또 있었어. 이번엔 교문 앞에서 학생들한테 물어보고 있었는데, 나한테도 말 걸었어. '강이서 학생이니?'라고."
      - 이준의 손이 떨린다. 조민우가 이서에게 직접 접촉했다. 한도혁의 전략 변경은 학교에도 영향을 미치고 있다.
      - 이준이 이서에게 즉시 답장. "절대 혼자 대화하지 마. 선생님한테 말해. 나 당장 갈게."
      - 이준이 옥상을 뛰어나간다.
      - 마지막 줄: 이준이 서울의 거리를 달린다. 앞에는 동생의 위험, 뒤에는 백화의 압박, 옆에는 정체불명의 보유자. 전쟁은 더 이상 준비 단계가 아니었다. 이미 시작되었다.
