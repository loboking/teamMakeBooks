chapter_n: 52
overall: |
  이준이 진명 서명으로 홍대 방향의 미지 보유자를 추적하여 홍대에서
  첫 접촉에 성공한다. 보유자의 정체가 윤새벽으로 밝혀지며, 두 사람은
  서로의 시스템 버전을 확인하고 적대적 만남을 갖는다. 윤새벽이 이준에게
  "백화가 보유자를 사냥하고 있다"는 경고를 남긴다.

beats:
  - name: tracking
    instruction: |
      이 부분은 52화의 시작. 분량 2,000자 이상.
      - ch051 이서 관련 상황을 마무리한 다음 날. 이준이 오후에 홍대 방향으로 향한다.
      - 이준의 계산. ch050에서 10초간 파동을 감지했고, ch051에서 30초간 지속되었다. 파동이 점점 더 길어지고 있다. 이것은 두 가지 가능성이 있다. 상대가 의도적으로 자신의 존재를 알리고 있다는 것, 혹은 상대의 은폐 능력이 약해지고 있다는 것.
      - 진명 서명은 ch051에서 40%까지만 기록했다. 100%를 채우려면 500m 이내로 접근해야 한다. 하지만 상대는 이준이 300m 이내로 접근하면 도망친다. ch044에서 이미 확인한 패턴이다.
      - 이준이 진명 감지(고급)를 가동하며 홍대 거리를 걷는다. 인파 속에서 마나 반응을 분류. 일반인의 희미한 반응, D급 헌터 몇 명, C급 헌터 한 명. 그리고 —
      - 1km 거리. 파동이 감지된다. 홍대입구역 방향. 이번에는 다르다. 파동이 이동하지 않는다. 멈춰 있다.
      - 이준이 천천히 접근한다. 마나 은폐를 최대한 가동. D급 이하로 보이도록 마나를 억제. 홍대의 인파 속에 녹아든다.
      - 800m... 700m... 600m... 파동이 점점 선명해진다. 진명 시스템 보유자의 특유한 마나 질감. ch044에서 마나 해독으로 읽은 v1.3의 파동 패턴과 일치한다.
      - 500m 지점. 진명 서명이 자동으로 가동. 패턴 기록률이 올라간다. 40%... 55%... 70%...
      - 이준이 파동의 위치를 정밀하게 파악한다. 홍대 거리의 작은 공연장 뒷골목. 3층 건물의 옥상.
      - 450m... 400m... 이준의 발걸음이 느려진다. ch044에서 상대가 300m 지점에서 도망쳤다. 이번에는 다른 접근 방식이 필요하다.
      - 이준이 멈춘다. 400m 거리에서 직접 다가가지 않는다. 대신 마나 은폐를 유지한 채 주변 건물의 카페에 들어간다. 2층 창가 자리. 옥상이 보이는 각도.
      - 진명 서명이 계속 진행된다. 80%... 90%... 95%...
      - 그 순간, 옥상에서 시선이 느껴진다. 마나가 아니다. 물리적인 시선. 상대가 이준을 발견한 것이다.
      - 카메라를 쓰지 않았다. 스마트폰도 들지 않았다. 그럼에도 상대가 이준을 알아본 것이다. 그리고 —
      - 상대가 먼저 움직인다. 옥상에서 사다리를 타고 내려온다. 이준 쪽으로.
      - [진명 서명 100% 완료 — 보유자 확인 — 윤새벽 — 진명 시스템 v1.3 — 상태: 활성 — 마나 속성: 은폐 특화]
      - 윤새벽. 이 이름은 이준이 처음 듣는다. 하지만 진명 시스템은 이미 알고 있었다.
      - 마지막 줄: 카페 창밖으로 한 사람이 걸어온다. 20대 후반. 검은 후드. 마나 은폐 상태. 하지만 이준의 진명 서명은 이미 그녀의 마나 패턴을 완벽하게 기록했다. 도망쳐도 소용없다.

  - name: first_contact
    instruction: |
      이 부분은 52화의 중반. 분량 2,000자 이상.
      - 윤새벽이 카페 문을 열고 들어온다. 이준의 맞은편 자리에 앉는다. 말없이.
      - 이준이 윤새벽을 관찰한다. 마나 감지로 상세 정보를 읽는다. C급 상위의 마나량. 하지만 은폐 특화 덕분에 실제 전투력은 B급 하위에 해당할 것이다. 그리고 은폐 상태에서도 마나가 미세하게 새어나오는 것을 보면, 은폐를 유지한 지 꽤 오래되었다. 만성 피로의 흔적.
      - 윤새벽이 먼저 입을 연다. "추적하느라 고생했네."
      - 목소리는 낮고 차분하다. 감정이 배제된 톤. 하지만 이준은 마나 감지로 그녀의 내면 상태를 읽을 수 있다. 경계, 호기심, 그리고 — 약간의 공포.
      - 이준: "3주째였어요. 당신이 제 감지 범위 바깥에서 관찰하고 있었다는 건 알고 있었습니다."
      - 윤새벽: "알면서도 바로 오지 않았어. 겁이 났나 봐."
      - 이준: "겁이 아니라 계산이었습니다. 당신이 적인지 아군인지 파악할 필요가 있었어요."
      - 윤새벽이 쓴웃음을 짓는다. "적이나 아군. 그렇게 단순한 세계가 아니야."
      - 두 사람 사이에 침묵이 흐른다. 카페의 음악이 배경으로 깔린다.
      - 윤새벽이 손을 들어 자신의 가슴 위에 댄다. 그리고 마나 은폐를 해제한다.
      - 이준의 진명 감지가 반응한다. 윤새벽의 마나 패턴이 완전히 드러난다. C급 상위. 하지만 그 안에 깔린 시스템 마나는 v1.3의 특징을 명확하게 보여준다.
      - 동시에 이준도 마나 은폐를 해제한다. C급 상위에서 B급 하위 사이의 마나가 퍼져나간다. 그리고 진명 시스템 v2.0의 파동.
      - 윤새벽의 눈이 변한다. 처음으로 감정이 드러난다. 놀라움. 그리고 — 경계가 한 단계 올라간다.
      - 윤새벽: "v2.0. 당신은... 2세대 보유자야."
      - 이준: "세대라는 게 뭔지는 모르겠지만. 당신이 v1.3이라는 건 알아요."
      - 윤새벽이 이준의 마나를 관찰한다. 그녀의 v1.3 시스템도 이준의 마나 패턴을 분석하고 있을 것이다.
      - 윤새벽: "나는 1세대야. v1.3. 은폐 특화. 추적을 피하고, 감지를 속이는 게 전문이지. 근데 당신은... 800m 밖에서부터 나를 추적했어. 내 은폐를 뚫었어."
      - 이준: "진명 서명. 당신의 마나 패턴을 기록해서 추적한 겁니다."
      - 윤새벽의 표정이 변한다. 진명 서명. 그 기능은 v2.0에서 추가된 것이다. v1.3에는 없다.
      - 윤새벽: "당신의 시스템이 더 최신이야. 그게 불안하네."
      - 이준: "불안할 건 없어요. 난 당신을 해치러 온 게 아니에요."
      - 윤새벽: "그럼 뭘 원해?"
      - 마지막 줄: 이준이 윤새벽을 본다. 같은 진명 시스템 보유자. 하지만 전혀 다른 시스템 버전. 그리고 이 여자는 3주간 자신을 관찰하면서도 접촉하지 않았다. 왜? 두려워서? 아니면 — 다른 이유가 있어서?

  - name: warning
    instruction: |
      이 부분은 52화의 마지막. 분량 2,000자 이상.
      - 윤새벽이 이준의 질문에 답하지 않고, 오히려 먼저 질문을 던진다.
      - 윤새벽: "한도혁이라는 사람 알아?"
      - 이준이 긴장한다. 윤새벽이 한도혁의 이름을 아는 것은 놀랍지 않다. 하지만 그녀가 그 이름을 왜 먼저 꺼냈는가.
      - 이준: "압니다. 백화 회장. 저를 죽이려고 하는 사람."
      - 윤새벽이 고개를 끄덕인다. "맞아. 한도혁은 보유자를 사냥하고 있어."
      - 이준의 눈이 좁아진다. "보유자를 사냥한다고?"
      - 윤새벽이 자신의 과거를 이야기하기 시작한다. 목소리는 여전히 차갑지만, 어딘가 지쳐 있다.
      - "나는 2년 전에 각성했어. v1.3. 당신처럼 시스템이 눈앞에 떠올랐고, 등급이 올라갔고, 모든 게 달라졌지."
      - "근데 각성한 지 한 달 만에 한도혁의 사람이 찾아왔어. 처음에는 회유였어. 백화에 들어오면 보호해주겠다고. 좋은 조건, 안전한 환경. 거절했어."
      - "그다음은 위협이었어. 거절하면 위험하다고. 보유자라는 건 백화가 관리해야 한다고. 또 거절했어."
      - 윤새벽이 잠시 침묵한다. 그리고 목소리가 낮아진다.
      - "세 번째는... 직접 공격이었어. A급 헌터 세 명을 보냈어. 나는 간신히 도망쳤어. 은폐 특화 덕분에. 그때부터 숨어 다니고 있어. 2년째야."
      - 이준이 윤새벽의 마나를 다시 본다. 만성 피로. 영양실조의 흔적. 2년간 숨어 다닌 사람의 몸이다. 그리고 마나에는 깊은 불안과 외로움이 서려 있다.
      - 윤새벽: "그리고 3주 전. 너를 처음 감지했을 때, 나는 같은 보유자가 나타난 걸 알았어. 관찰했어. 네가 어떤 사람인지, 어떤 상황인지."
      - 이준: "그리고 판단은?"
      - 윤새벽이 이준을 본다. "너는 나랑 달라. 숨지 않아. 드러나 있어. 길드에서 사람들과 함께 있고, 동생을 지키고, 싸우고 있어. 그건 대단하지만 — 위험해."
      - 윤새벽이 마나 은폐를 다시 가동한다. 자리에서 일어선다.
      - "나는 널 도울 수 없어. 도와주면 한도혁이 나를 찾아내거든. 하지만 경고는 해줄게."
      - 윤새벽이 이준의 눈을 본다.
      - "한도혁은 보유자를 사냥하는 게 아니야. 보유자를 수집하는 거야. 살아서. 세진이라는 사람도 그랬어. 나도 그랬고. 당신도 그 대상이야. 한도혁은 진명 시스템이 뭔지 알고 있어. 그리고 그것을 자기 것으로 만들려고 해."
      - 이준: "세진... 박세진?"
      - 윤새벽: "알고 있었어. 나보다 먼저 각성한 첫 번째 보유자. v1.7. 한도혁이 세진을 잡아서 시스템을 분석하려 했는데... 세진이 저항하다 죽었어."
      - 이준이 숨을 삼킨다. 서동현이 말한 것과 일치한다. 하지만 윤새벽의 버전에서는 한 가지가 다르다. 한도혁이 세진을 "분석하려 했다"는 것. 단순한 제거가 아니라 시스템 탈취 시도였다는 것이다.
      - 윤새벽이 카페를 나간다. 문 앞에서 한 번 뒤를 돌아본다.
      - "v2.0이잖아. 조심해. 한도혁은 당신을 더 간절하게 원할 거야."
      - 윤새벽이 사라진다. 이준이 자리에 남는다.
      - 이준이 진명 시스템을 확인한다. 윤새벽의 진명 서명은 100% 완료되어 있다. 언제든 위치를 추적할 수 있다. 1km 이내.
      - 하지만 이준은 그 기능을 당장 사용하지 않기로 한다. 윤새벽이 2년간 숨어 다닌 이유가 있다. 그녀에게 시간이 필요하다.
      - 시스템 메시지가 떠오른다.
      - [퀘스트 업데이트 — 진명의 동료 / 난이도: 최상 / 다른 보유자와 접촉 완료 / 하위 퀘스트: 윤새벽과의 동맹 구축 / 보상: 시스템 정보 추가 해금]
      - 마지막 줄: 이준이 카페를 나온다. 홍대의 거리가 북적거린다. 수백 명의 사람들이 지나가지만, 그중 단 두 사람만이 진명 시스템을 가지고 있다. 하나는 2년간 숨어 다닌 은폐자. 하나는 불과 한 달 만에 모든 것을 드러낸 전사. 그리고 그 둘 사이에 한도혁이라는 거대한 그림자가 드리워져 있다.
