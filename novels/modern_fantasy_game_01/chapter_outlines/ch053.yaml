chapter_n: 53
overall: |
  협회에서 이준의 등급 재측정이 진행된다. 이준이 C급 위장 계획을
  세우지만, 한도혁이 정재훈을 통해 측정 과정에 개입한다. 결과는 C급으로
  나오지만, 한도혁이 이준의 진짜 등급을 알고 있다는 사실이 압박감으로
  다가온다. 서동현이 측정 과정에서 백화의 내부 조작 단서를 포착한다.

beats:
  - name: measurement_plan
    instruction: |
      이 부분은 53화의 시작. 분량 2,000자 이상.
      - ch044에서 이준이 세린에게 부탁한 등급 재측정 신청이 긴급 심사를 통과했다. 협회에서 내일 오후 측정 일정이 잡혔다.
      - 이준이 길드 훈련실에서 혼자 마나 조절 연습 중이다. C급 하위 범위의 마나량을 정확하게 출력하고 유지하는 것이 목표다.
      - 마나량 조절은 생각보다 어렵다. 이준의 실제 마나량은 C급 상위에서 B급 하위 사이. 이것을 C급 하위로 낮추려면, 마나를 의식적으로 억제해야 한다. 마치 수도꼭지를 반쯤 잠그는 것처럼.
      - 하지만 문제가 있다. 협회의 측정 장비는 마나량뿐 아니라 마나의 질도 측정한다. 마나의 밀도, 순도, 안정성, 그리고 마나 회로의 복잡도. 이준의 마나는 진명 시스템이 개조한 것이기 때문에, 일반적인 C급과는 질적으로 다르다. 이 차이를 숨길 수 있을지가 관건이다.
      - 이준이 진명 시스템에 질문한다. "등급 위장이 가능합니까?"
      - 시스템 메시지. [진명 시스템 v2.0 — 마나 출력 조절 기능 지원. 대상 등급 이하의 마나량 출력 가능. 단, 마나 질 은폐 불가. 측정 장비가 마나 질을 감지할 경우 위장 해제 위험 있음.]
      - 마나 질 은폐 불가. 이것이 한계다. 이준의 마나는 진명 시스템이 개조한 것이므로, 일반 C급과는 질이 다르다. 협회 측정 장비가 이것을 감지하면 C급 위장은 실패한다.
      - 이준이 세린에게 연락. "세린 씨, 협회 측정 장비의 마나 질 감지 수준을 알 수 있어요?"
      - 세린: "협회 표준 측정기는 마나량과 안정성까지만 측정해. 마나 질까지 감지하는 건 S급 전용 측정기인데, 그건 협회 본부에만 있어. 일반 지부에는 없어."
      - 이준이 안도한다. 서울 지부 측정에서는 마나 질까지 감지하지 못한다면, C급 위장은 가능하다.
      - 하지만 이준은 한 가지를 놓치고 있었다. 협회 본부에만 S급 측정기가 있는 것이 아니라, 백화에게도 유사한 장비가 있다는 것을. 그리고 한도혁은 이것을 알고 있다.
      - 이준이 김태석에게 측정 계획을 보고. "내일 오후 협회에서 재측정. C급으로 나오도록 조절할 겁니다."
      - 김태석: "C급으로 나오면 배정 제한이 풀리고, 백화의 압박 근거도 사라지겠지."
      - 이준: "네. 하지만 한 가지 걱정이 있습니다. 백화가 측정 과정에 개입할 수 있어요."
      - 김태석: "협회 측정에 백화가 끼어들 수 있나?"
      - 이준: "서동현 팀장님이 말했듯, 협회 심사과에 백화 매수 인력이 있어요. 측정 결과를 조작할 수도 있고, 측정 과정에 백화 사람을 배치할 수도 있어요."
      - 김태석이 턱을 쓴다. "그럼 어떻게 해?"
      - 이준: "제가 마나 감지로 측정실의 모든 마나 반응을 실시간으로 파악하겠습니다. 이상한 마나 장비가 있거나, 측정 담당자의 마나가 불안정하면 즉시 알 수 있어요."
      - 마지막 줄: 이준이 훈련실을 나온다. 내일이면 F급이라는 껍데기를 벗고 C급으로 공식 인정받는다. 하지만 그것은 동시에 백화에게 더 큰 표적으로 인정받는 것이기도 하다.

  - name: measurement_day
    instruction: |
      이 부분은 53화의 중반. 분량 2,000자 이상.
      - 다음 날 오후 2시. 헌터협회 서울 지부 3층. 등급 측정실.
      - 이준이 협회 건물에 도착한다. 세린이 동행. 김태석은 길드에 남아 정재훈의 움직임을 대기 중.
      - 협회 로비에서 마나 감지를 가동. 건물 안에 수십 명의 헌터와 직원. 그중 B급 이상이 세 명. 협회 경비원. 그리고 측정실 근처에 한 명 더. C급 하위. 하지만 마나 패턴이 미세하게 불안정하다. 긴장하고 있다.
      - 이준이 세린에게 귀엣말. "측정실 앞에 있는 사람. 마나가 불안정해. 백화 사람일 가능성이 있어."
      - 세린이 미세하게 고개를 끄덕인다. "알겠어. 내가 눈을 떠."
      - 측정실 안. 이준이 측정 기기 앞에 선다. 협회 측정 담당관은 50대 남성. C급 출신 관리직. 이명호 — ch045에서 세린이 접촉한 적 있는 인물이다.
      - 이명호가 이준을 보며 눈을 가늘게 뜬다. "강이준 씨? F급에서 재측정 신청이 들어왔는데... C급 이상 배정 제한 조치가 있었잖아요."
      - 이준: "네. 재측정을 통해 제 등급을 증명하려 합니다."
      - 이명호가 고개를 끄덕이며 측정 기기를 준비한다. 표준 마나 측정기. 원반 형태의 기기에 손을 얹으면 마나량, 안정성, 제어력을 측정한다.
      - 이준이 기기 위에 손을 얹는다. 마나 조절. C급 하위 범위로 출력을 낮춘다. Lv6의 마나를 20% 수준으로 억제.
      - 기기가 작동한다. 수치가 디스플레이에 뜬다.
      - 마나량: C급 하위 (정상 범위 내). 안정성: 상위. 제어력: 상위.
      - 이명호가 수치를 확인하며 고개를 끄덕인다. "C급 하위. 정상 범위네요. 이 정도면 배정 제한이 해제됩니다."
      - 이준이 안도하는 순간, 측정실 문이 열린다.
      - 정재훈이 들어온다. 갈색 재킷. A급 중위의 마나가 방 전체를 무겁게 누른다. 이명호가 놀라며 의자에서 일어난다.
      - 정재훈: "실례합니다. 백화 길드 보안 담당 정재훈입니다. 협회와 협약에 따라 길드 간 측정 참관이 가능하다고 들었는데요."
      - 이명호가 당황한다. "참관은... 동일 길드 소속 헌터에 한해서인데..."
      - 정재훈이 서류를 보여준다. 협회와 백화 간의 협약서. 길드 간 정보 교환 협정. 그 안에 "등급 측정 참관" 조항이 포함되어 있다. 한도혁이 미리 준비한 것이다.
      - 이명호가 서류를 확인하며 망설인다. 하지만 협약은 협약이다. 거절할 수 없다.
      - 정재훈이 이준 옆에 선다. 이준의 표정은 변하지 않는다. 하지만 마나 감지로 정재훈의 상태를 읽는다. 정재훈은 이것을 알고 있다. 이준의 진짜 등급을. 그리고 지금 이 자리에 온 것은 — 이준의 위장을 확인하려는 것이 아니라, 이준에게 "알고 있다"는 것을 보여주기 위한 것이다.
      - 정재훈이 이준의 귀에 가까이 입을 댄다. 속삭인다.
      - "C급? 재밌는 연기야. 한도혁 회장님이 보내드려. '잘하고 있다'고."
      - 이준의 표정이 미세하게 굳어진다.
      - 마지막 줄: 측정 결과는 C급 하위. 배정 제한 해제. 형식적으로는 이준의 승리다. 하지만 정재훈의 방문이 의미하는 것은 명확하다. 백화는 이준의 진짜 등급을 알고 있다. C급 위장은 백화를 속이지 못한다. 속인 것은 협회와 길드원뿐이다.

  - name: aftermath_pressure
    instruction: |
      이 부분은 53화의 마지막. 분량 2,000자 이상.
      - 협회 건물을 나온 후 이준과 세린이 근처 공원 벤치에 앉는다.
      - 세린이 먼저 입을 연다. "정재훈이 나타난 건 예상 못 했어. 한도혁이 협약까지 준비했네."
      - 이준: "한도혁은 이 준비를 하면서 동시에 다른 수도 준비했을 거예요. 참관은 겉보기일 뿐이에요."
      - 세린: "다른 수라면?"
      - 이준이 핸드폰을 확인한다. 서동현에게서 온 메시지가 있다.
      - "측정실에 정재훈이 배치되었습니다. 한도혁의 지시입니다. 측정 결과에 관계없이 이준 씨의 진짜 등급을 백화가 공식적으로 인지했다는 의미입니다. 한도혁이 이것을 이용할 방법: (1) 협회에 '이준은 C급이 아니다'라고 이의 제기. 측정 결과 무효화 시도. (2) 길드원들에게 이준의 진짜 등급을 공개하여 신뢰에 균열. (3) 이준의 진짜 등급을 근거로 협회에서 위험인물 분류."
      - 이준이 서동현의 분석을 읽으며 머릿속에서 계산한다. 한도혁은 이준의 C급 위장을 무력화하려는 것이 아니다. 그보다 더 교묘한 것이다. 이준의 진짜 등급을 "알고 있다"는 사실 자체를 무기로 사용하려는 것이다. 이준에게 "우리는 네 비밀을 알고 있다. 우리가 원하는 것을 해라"라는 암묵적 메시지.
      - 세린: "우리는 어떻게 해야 해?"
      - 이준: "당장은 아무것도 안 해도 돼요. 한도혁이 카드를 보여준 거예요. 하지만 카드를 보여주는 건 게임이 아직 끝나지 않았다는 뜻이기도 해요. 아직 협상의 여지가 있다는 거죠."
      - 세린: "협상? 한도혁과?"
      - 이준: "아니요. 한도혁과 협상할 생각은 없어요. 하지만 한도혁이 협상을 기대하고 있다는 건, 우리에게 그만큼 시간이 있다는 뜻이에요. 한도혁이 직접 공격하지 않고 정재훈을 보낸 것도, 측정에 참관한 것도, 전부 압박이지 타격은 아니에요."
      - 세린이 이준의 말을 곱씹는다. 압박과 타격의 차이. 한도혁은 아직 이준을 직접 공격하지 않는다. 이유가 있다. 무엇인가?
      - 이준이 진명 감지(고급)를 가동. 백화 본사 방향. 한도혁의 S급 마나 반응이 여전하다. 그리고 그 옆에 정재훈의 A급 마나. 두 사람이 같은 공간에 있다.
      - 그리고 이준이 하나 더 감지한다. 협회 건물 안에서 미세한 마나 반응. ch045에서 세린이 접촉한 이명호의 마나. 이명호의 마나가 불안정하게 흔들리고 있다. 무언가를 알고 있다. 협회 내부의 백화 조직에 대해.
      - 이준이 세린에게 말한다. "세린 씨, 이명호 씨한테 다시 한 번 연락해 주세요. 협회 내부에 백화 매수 인력에 대한 추가 정보가 있을 수 있어요."
      - 세린이 고개를 끄덕인다.
      - 이준이 일어선다. C급으로 인정받았다. 배정 제한이 풀렸다. 하지만 동시에 백화는 이준의 진짜 정체를 알고 있다. F급 껍데기는 벗겨졌지만, 새로운 위장은 이미 뚫렸다.
      - 핸드폰이 울린다. 모르는 번호.
      - 이준이 받는다. "네?"
      - 상대방의 목소리. 여성. 낮고 차분한 목소리.
      - "강이준 씨. 윤새벽이야."
      - 이준이 숨을 삼킨다.
      - 윤새벽: "백화가 네 측정에 끼어들었다고 들었어. 정재훈이라는 사람이 참관했다면서?"
      - 이준: "어떻게 알았어요?"
      - 윤새벽: "나도 2년 전에 같은 일을 당했거든. 협약을 이용해서 측정에 끼어드는 건 한도혁의 전형적인 수법이야."
      - 윤새벽이 잠시 침묵한다.
      - 윤새벽: "한 가지 더 알려줄게. 한도혁이 네 진짜 등급을 알면서도 직접 공격하지 않는 이유. 그건 네가 '쓸모가 있기 때문'이야. 죽이면 안 되니까."
      - 통화가 끊긴다.
      - 마지막 줄: 이준이 핸드폰을 내려놓는다. 윤새벽이 먼저 연락해 왔다. 2년간 숨어 다니며 아무와도 접촉하지 않았던 여자가. 이것은 — 윤새벽도 무언가가 변하고 있다는 뜻이다. 이준의 등장이 그녀의 계산을 바꾸고 있다.
