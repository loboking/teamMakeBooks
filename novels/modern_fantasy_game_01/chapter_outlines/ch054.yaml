chapter_n: 54
overall: |
  이준이 아버지 강철민의 과거 조사를 심화하며 협회 기록에서 아버지의
  흔적을 발견한다. 5년 전 마나 측정 기록이 은폐/삭제 처리된 사실을
  확인하고, 아버지가 진명 시스템 초기 보유자였을 가능성이 확신으로
  바뀐다. 어머니의 증언과 협회 기록이 교차하며 이준의 각성이 우연이
  아님을 시사한다.

beats:
  - name: deep_investigation
    instruction: |
      이 부분은 54화의 시작. 분량 2,000자 이상.
      - ch045에서 이준이 어머니에게 들은 정보를 바탕으로 아버지 강철민의 과거 조사를 심화한다.
      - 이준이 협회 시설에서 어머니를 면회한 뒤, 협회 본부 1층 민원실을 방문한다. 등급 재측정 결과 C급 인정을 받은 이후 협회 시설 출입이 용이해졌다.
      - 민원실에서 "과거 헌터 기록 열람"을 신청. 일반인은 헌터 기록에 접근할 수 없지만, C급 이상 헌터는 가족의 기록을 열람할 수 있는 예외 조항이 있다.
      - 민원실 직원이 컴퓨터를 확인하며 고개를 갸웃한다. "강철민 씨... 헌터 등록이 되어 있지 않은데요."
      - 이준: "아버지는 헌터가 아니셨습니다. 하지만 협회에 기록이 있을 수 있습니다. 마나 측정 기록이라든가."
      - 직원이 검색 범위를 넓힌다. "마나 측정 기록... 일반인도 협회에서 무료 측정을 받을 수 있으니까 기록이 있을 수는 있죠."
      - 검색 결과가 나온다. 직원의 표정이 변한다.
      - "강철민. 5년 3개월 전. 마나 측정 기록이 있습니다. 하지만..."
      - 직원이 모니터를 보며 말을 멈춘다. "기록이 삭제 처리되어 있어요. 삭제 사유: 당사자 요청."
      - 이준의 심장이 빠르게 뛴다. 아버지가 5년 전에 협회에서 마나 측정을 받았다. 그리고 기록을 삭제했다. 왜? 일반인이 마나 측정을 받은 것은 드문 일이 아니다. 하지만 기록을 삭제한 것은 이상하다.
      - 이준: "삭제된 기록도 복구할 수 있나요?"
      - 직원이 고개를 젓는다. "당사자 요청 삭제는 완전 삭제입니다. 복구 불가."
      - 이준이 다른 접근을 시도한다. "그러면 5년 전 같은 시기에 협회를 방문한 사람들의 기록은요? 동일 날짜, 동일 시간대에 측정을 받은 다른 사람."
      - 직원이 검색한다. "5년 3개월 전, 3월 15일... 협회 서울 지부에서 마나 측정을 받은 사람은 23명입니다. 그중 4명이 헌터, 19명이 일반인."
      - 이준이 19명의 일반인 목록을 요청. 직원이 출력한다.
      - 목록 중 한 이름이 눈에 들어온다. "박세진". 협회에서 마나 측정을 받은 일반인 목록에 박세진의 이름이 있다.
      - 이준의 숨이 멎는다. 5년 3개월 전. 아버지 강철민과 박세진이 같은 날, 같은 장소에서 마나 측정을 받았다. 이것은 우연이 아니다.
      - 이준이 직원에게 "박세진 씨의 기록도 볼 수 있나요?"라고 묻는다.
      - 직원이 확인한다. "박세진... 역시 삭제 처리되어 있습니다. 삭제 사유: 당사자 요청."
      - 두 사람 모두 기록을 삭제했다. 같은 날에 측정을 받고, 같은 방식으로 기록을 삭제했다.
      - 이준이 민원실을 나온다. 복도를 걸으며 생각한다. 아버지와 박세진은 5년 전에 협회에서 만났다. 그것은 박세진이 진명 시스템을 각성하기 1년 전이다. 박세진이 아버지를 알고 있었다면 — 아버지도 진명 시스템과 관련이 있을 것이다.
      - 그리고 아버지는 5년 전 심장마비로 죽었다. 박세진이 진명 시스템을 각성하고 한도혁에 의해 제거된 것은 3년 전. 시간적으로 아버지의 죽음이 먼저다.
      - 마지막 줄: 이준이 협회 건물을 나온다. 아버지의 기록은 삭제되었지만, 삭제된 기록 자체가 단서다. 아버지는 협회에서 마나 측정을 받았고, 기록을 지웠다. 박세진과 같은 날에. 이것은 진명 시스템의 초기 보유자였을 가능성을 강하게 시사한다.

  - name: mothers_testimony
    instruction: |
      이 부분은 54화의 중반. 분량 2,000자 이상.
      - 이준이 다시 협회 시설로 향한다. 어머니에게 더 자세한 이야기를 듣기 위해서다.
      - 병실. 어머니는 오늘 의식이 더 맑다. 이준이 앉자 어머니가 먼저 말을 건넨다.
      - "이준아. 아빠 이야기 또 할 거야?"
      - 이준이 고개를 끄덕인다. "엄마. 아빠가 협회에 다녀오셨다는 거 알아요?"
      - 어머니의 표정이 변한다. 미세하게. "협회? 아빠가 왜 거기에..."
      - 이준: "아빠가 5년 전에 협회에서 마나 측정을 받으셨어요. 기록이 있었어요."
      - 어머니가 잠시 침묵한다. 그리고 천천히 말을 시작한다.
      - "철민이가 협회에 간 건... 나도 나중에 알았어. 5년 전 봄이었어. 아빠가 갑자기 자기 몸에 이상한 게 생겼다고 했어. 가끔 손에서 빛이 난다고. 처음엔 눈이 부셔서 안과에 갔는데, 아무 이상이 없다고 하더라고."
      - 이준의 심장이 뛴다. 손에서 빛. 마나.
      - 어머니: "그러고 나서 며칠 뒤에 협회에 갔어. 혼자서. 나한테는 회사 일이라고만 했어. 근데 돌아온 뒤로 아빠가 완전히 달라졌어."
      - 이준: "어떻게 달라졌어요?"
      - 어머니가 손끝을 시트 위에서 움켜쥔다. "무서웠어. 아빠가 밤에 자다가 갑자기 벽에 손을 대고 뭔가를 보곤 했어. 손에서 은빛이 흐르고... 아빠는 그게 보이는데 나한테는 안 보인다고 했어. '마나'라고 했어. 처음 그 단어를 들은 게 그때야."
      - 이준이 어머니의 손을 잡는다. 어머니의 손이 차갑다.
      - 어머니: "아빠가 협회에 간 지 한 달 뒤에 낯선 사람이 집에 왔어. 젊은 남자였어. 아빠랑 같이 방에 들어가서 한참을 이야기했어. 나는 문 밖에서 들었는데... '시스템'이라는 단어가 계속 들렸어."
      - 이준의 온몸에 소름이 돋는다. 시스템. 아버지와 어떤 남자가 "시스템"에 대해 이야기했다.
      - 이준: "그 남자... 어떻게 생겼어요?"
      - 어머니가 눈을 감으며 떠올린다. "키가 크고... 검은 머리... 젊었어. 20대 후반쯤 되었을까. 목소리가 차갑지는 않았어. 오히려 부드러웠는데... 아빠가 그 사람을 보는 눈빛이 달랐어. 두려운 것 같기도 하고, 동시에 의지하는 것 같기도 했고."
      - 이준이 묻는다. "그 사람 이름을 알아요?"
      - 어머니가 고개를 젓는다. "몰라. 아빠가 이름을 안 불렀어. 근데..."
      - 어머니가 눈을 뜬다.
      - "그 사람이 나올 때, 손목에 은색 팔찌를 하고 있었어. 원형 팔찌. 안에 뭔가 새겨져 있었어. 그게... 아빠 목에 걸려 있던 것과 비슷했어."
      - 이준의 숨이 막힌다. 은색 팔찌. 원형. 안에 문자. ch043에서 세린이 보여준 박세진의 펜던트와 같은 형태다.
      - 이준이 어머니의 손을 꽉 잡는다. "엄마. 아빠한테 물건이 더 있어요? 펜던트나 팔찌 같은 거."
      - 어머니가 고개를 젓는다. "아빠가 죽기 전에 다 치웠어. '이건 위험한 거야. 절대 만지지 마'라고 했어. 아이들한테도 보여주지 말라고 했고."
      - 이준이 생각한다. 아버지가 죽기 전에 모든 것을 치웠다. 진명 시스템 관련 물품을. 왜? 자신의 죽음을 예감했기 때문인가?
      - 마지막 줄: 이준이 병실을 나온다. 복도에서 잠시 멈춰 선다. 아버지는 마나를 볼 수 있었다. 협회에서 측정을 받았다. 은색 팔찌를 가지고 있었다. "시스템"이라는 단어를 사용하는 남자와 만났다. 그리고 5년 전 심장마비로 죽었다. 이 모든 것이 하나의 실로 연결된다. 강철민은 진명 시스템의 초기 보유자였다.

  - name: system_clue
    instruction: |
      이 부분은 54화의 마지막. 분량 2,000자 이상.
      - 밤. 이준이 길드 숙소 자기 방에 있다. 방 안에서 혼자 진명 시스템을 확인한다.
      - 이준이 시스템에 질문한다. "진명 시스템의 초기 보유자에 대한 정보를 알려주세요."
      - 시스템 메시지. [정보 해금 조건 불충족. 초기 보유자 정보는 Lv10 이상에서 확인 가능.]
      - Lv10. 이준은 현재 Lv6이다. 아직 멀었다.
      - 이준이 다른 질문을 시도한다. "진명 시스템 v1.0에 대한 정보를 알려주세요."
      - 시스템 메시지. [v1.0 — 최초 버전. 보유자 수: 1명. 상태: 비활성. v1.0은 기본적인 마나 감지와 마나 제어 기능만 제공.]
      - 보유자 수 1명. 상태: 비활성.
      - 이준이 다음 질문. "v1.0 보유자의 신원을 알려주세요."
      - 시스템 메시지. [신원 정보 접근 권한 없음. 단, v1.0 보유자는 v2.0 보유자와 유전적 연관이 있음.]
      - 유전적 연관. 이준의 손이 떨린다. 유전적 연관이 있다는 것은 — v1.0 보유자가 이준의 가족이라는 뜻이다. 아버지.
      - 이준이 다시 질문한다. "v1.0 보유자의 비활성 사유를 알려주세요."
      - 시스템 메시지. [v1.0 보유자 사망. 사인: 외부 개입에 의한 마나 회로 파괴. 시스템 자동 비활성.]
      - 외부 개입에 의한 마나 회로 파괴. 심장마비가 아니다. 아버지는 심장마비로 죽은 것이 아니라, 누군가가 아버지의 마나 회로를 파괴해서 죽인 것이다.
      - 이준의 시야가 흐려진다. 분노와 슬픔과 공포가 뒤섞인다.
      - 마나 회로 파괴. 그것은 진명 시스템 보유자를 죽이는 특정한 방법이다. 일반적인 살인과는 다르다. 마나 회로를 파괴하면 보유자의 시스템이 비활성화되고, 동시에 육체적 사망이 따른다.
      - 이준이 생각한다. 누가 아버지를 죽였는가? 한도혁? 아니면 다른 누군가?
      - ch052에서 윤새벽이 말했다. "한도혁은 보유자를 수집한다." 그리고 "세진이 저항하다 죽었다." 한도혁이 세진을 죽인 것은 확실하다. 하지만 아버지의 죽음은 그보다 2년 전이다. 한도혁이 관여했을까?
      - 이준이 핸드폰을 든다. 서동현에게 메시지. "5년 전 강철민(제 부친)의 사인 조사가 가능한가요? 협회 기록에 마나 측정 기록이 있었지만 삭제되었습니다. 사인이 심장마비로 처리되었으나, 실제로는 외부 개입 가능성이 있습니다."
      - 서동현의 답장이 10분 뒤 온다. "5년 전... 그 시기는 한도혁 회장님이 백화를 완전 장악하기 직전입니다. 회장님은 5년 전부터 '특정 인물'에 대한 조사를 지시한 적이 있습니다. 저는 그 대상을 직접 보지 못했지만, 조사팀이 한 달간 활동했고, 그 후 회장님의 행동이 크게 바뀌었습니다. 혹시... 강철민 씨가 그 대상이었다면."
      - 이준이 서동현의 답장을 읽으며 침묵한다. 한도혁이 5년 전에 특정 인물을 조사했다. 그리고 한 달 후 한도혁의 행동이 바뀌었다. 만약 그 대상이 아버지라면 — 한도혁은 5년 전부터 진명 시스템의 존재를 알고 있었다는 뜻이다.
      - 이준이 시스템에 마지막 질문을 던진다. "현재 활성 상태인 진명 시스템 보유자는 몇 명입니까?"
      - 시스템 메시지. [현재 활성 보유자: 2명. 강이준(v2.0), 윤새벽(v1.3). 비활성 보유자: 2명. 보유자 A(v1.0 — 사망), 보유자 B(v1.7 — 사망).]
      - 보유자 A(v1.0) — 사망. 아버지.
      - 보유자 B(v1.7) — 사망. 박세진.
      - 총 4명의 보유자. 2명 사망, 2명 활성. 한도혁이 사망한 2명과 관련이 있다.
      - 이준이 눈을 감는다. 아버지의 죽음은 시작이었다. 박세진의 죽음은 그 연장이었다. 그리고 지금 한도혁은 이준과 윤새벽을 노리고 있다.
      - 시스템 메시지가 하나 더 떠오른다.
      - [퀘스트 진행 — 아버지의 진실 / 난이도: 극상 / 강철민의 죽음 진상 규명 / 현재 진척도: 30% / 보상: Lv7 진행도 대폭 증가 + 시스템 정보 추가 해금]
      - 마지막 줄: 이준이 방 안에서 눈을 뜬다. 아버지의 흔적은 지워졌지만, 지워진 흔적 자체가 가장 큰 증거다. 강철민은 진명 시스템 v1.0 보유자였다. 그리고 누군가가 그를 죽였다. 이준은 그 진실을 밝혀야 한다. 아버지의 죽음이 — 이준의 각성이 — 우연이 아니라면, 이 모든 것에는 이유가 있다.
