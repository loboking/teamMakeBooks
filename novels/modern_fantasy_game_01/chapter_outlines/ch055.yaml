chapter_n: 55
overall: |
  백화가 압박을 한 단계 올리며 정재훈이 철혈 길드원에게 직접 접촉하고
  위협적인 분위기를 조성한다. 이준이 C급 인정 이후 철혈을 위해 던전에
  들어가 마나 해독으로 숨겨진 자원을 발견하여 수익 창출의 실마리를
  잡는다. 긴장감이 최고조에 달하며 56화 직접 공격의 전조가 드러난다.

beats:
  - name: escalated_pressure
    instruction: |
      이 부분은 55화의 시작. 분량 2,000자 이상.
      - ch051 이후 5일 경과. 한도혁이 "3일 안에 길드원 매수 완료"를 지시한 기한이 지났다.
      - 아침. 철혈 길드 식당. 아침 식사 시간에 길드원들 사이에 긴장이 흐른다.
      - 박동현이 이준에게 다가온다. 표정이 어둡다. "이준 형. 어제 밤에 일이 있었어."
      - 이준: "무슨 일?"
      - 박동현이 목소리를 낮춘다. "정재훈이라는 사람이 어젯밤 길드 하숙집 앞에 나타났어. 김하늘한테 직접 말을 걸었어. '백화에서 마지막으로 묻는다. 3배가 아니라 5배를 줄 테니 와라'고. 김하늘이 거절하니까... 그 사람이 웃으면서 이런 말을 했대."
      - 이준이 박동현을 본다. "뭔데?"
      - 박동현이 삼킨다. "'거절하는 건 네 선택이야. 하지만 선택에는 결과가 있지. 네가 백화에 오지 않으면, 네가 있는 곳이 위험해질 수도 있어.' 라고 했대."
      - 이준의 주먹이 움켜쥐어진다. 공개적인 위협. 한도혁이 전략을 은밀함에서 노골적으로 바꾸기로 한 이후, 정재훈은 점점 더 직접적으로 길드원들에게 접근하고 있다.
      - 이준이 마나 감지로 길드원들의 상태를 확인. 김하늘(D급)의 마나가 불안정하다. 공포와 분노가 뒤섞여 있다. 정재훈의 A급 마나 압박을 직접 받았기 때문이다.
      - 이준이 박동현에게 말한다. "동현아. 김하늘을 안심시켜 줘. 정재훈이 위협한 건 사실이지만, 백화가 길드원에게 직접 손을 대는 건 협회에 신고할 수 있어. 내가 증거를 모으고 있으니까."
      - 박동현이 고개를 끄덕이지만, 표정에는 불안이 가시지 않는다. D급 헌터가 A급의 위협을 받고 나서 "안심"이라는 말이 통할 리 없다.
      - 오후. 세린이 이준에게 보고. "이명호한테서 들었어. 협회 심사과에 백화 매수 인력이 한 명 있는데, 그 사람이 최근 이상한 요청을 했대. 강이준의 등급 재측정 결과에 대해 '이의 제기' 자료를 준비하라고 지시받았다고."
      - 이준: "이의 제기?"
      - 세린: "C급 측정 결과가 부정확하다는 주장이에요. 정재훈이 참관할 때 얻은 데이터를 근거로, 이준의 진짜 등급이 C급이 아니라 B급 이상이라고 주장하겠다는 거야."
      - 이준이 순간 혼란스러워한다. B급 이상이라고 주장하면 이준에게 유리한 것 아닌가? 하지만 곧 한도혁의 의도를 이해한다.
      - 이준: "아, 그렇군. 한도혁은 C급 결과를 무효화하려는 게 아니야. C급 결과를 인정하면서, 동시에 '진짜 등급은 B급 이상'이라는 정보를 협회에 공식적으로 심어두려는 거야. 나중에 나를 '은폐한 헌터'로 분류할 명분을 만드는 거지."
      - 세린이 이를 악문다. "교활해."
      - 이준: "맞아. 한도혁은 체스를 두고 있어요. 하나의 수를 두면서 동시에 세 수 앞을 내다보는 거예요."
      - 서동현에게서 메시지가 온다. "정재훈이 한도혁에게 보고. '철혈 길드원 7명 중 4명은 확보 가능. 3명은 거절 의사. 강이준은 직접 접촉하지 않음(회장 지시).' 한도혁이 답변: '거절한 3명에게 압박 강화. 1주일 내 결과 보고. 그리고...'
      - 서동현의 메시지가 잠시 멈춘다가 이어진다.
      - '그리고 1주일 후, 강이준 직접 접촉 준비.'
      - 이준의 손이 떨린다. 1주일 후. 한도혁이 직접 나선다는 뜻이다. 정재훈이 아닌, 한도혁 본인이.
      - 마지막 줄: 이준이 핸드폰을 내려놓는다. 1주일. 백화의 압박이 최고조에 달하고, 한도혁이 직접 나설 준비를 하고 있다. 시간이 없다. 이준은 1주일 안에 철혈을 지킬 무언가를 만들어야 한다.

  - name: dungeon_discovery
    instruction: |
      이 부분은 55화의 중반. 분량 2,000자 이상.
      - 이준이 C급 인정을 받은 이후 첫 던전 임무에 참가한다. 김태석이 배정한 C급 하위 던전. "망각의 동굴"이라는 이름의 3층 구조 던전.
      - 참가 인원: 이준(C급 인정), 세린(B급), 정민호(C급), 박동현(C급), 김하늘(D급). 5인 파티.
      - 이준의 목적은 단순한 던전 클리어가 아니다. ch044에서 구상한 대로, 마나 해독을 통해 던전 내부의 숨겨진 자원을 찾는 것이다. 철혈의 재정 위기를 해결할 수익원.
      - 던전 입구. 이준이 마나 해독을 가동. 던전 입구 주변의 마나 잔여를 읽는다.
      - [마나 잔여 분석: 최근 24시간 내 3개 파티 진입. 마나 소모량 평균. 보스 처치 패턴 확인: 정규 루트.]
      - 이준이 파티원들에게 지시. "정민호 형, 박동현, 앞에서 경로 확보. 세린 씨, 중앙에서 지원. 김하늘, 뒤에서 마나 회복 아이템 관리. 저는 정보 수집을 담당합니다."
      - 정민호가 고개를 갸웃한다. "정보 수집?"
      - 이준: "제 감지 능력으로 던전 내부 구조를 실시간 파악합니다. 위험 구역과 안전 경로를 구분해서 안내할게요."
      - 파티가 던전 1층에 진입. 이준이 마나 해독을 가동하며 이동. 일반적인 던전에서 마나 해독이 보여주는 것은 제한적이다. 마나 분포, 몬스터 배치, 함정 위치. 이것만으로도 충분히 유용하지만, 이준이 찾는 것은 그 이상이다.
      - 1층 중반. 이준이 마나 잔여에서 미세한 이상을 감지한다. 벽면 한 곳에서 마나 밀도가 주변보다 3배 높다. 일반적인 던전 구조에서는 설명되지 않는 불규칙성.
      - 이준이 파티를 멈추고 벽면을 조사. 마나 해독을 최대한 가동.
      - [마나 밀도 이상 감지. 원인: 인위적 마나 축적. 패턴 분석 중... 마나 장치 잔여 감지. 소형 마나 저장 장치가 벽 내부에 매립됨. 상태: 비활성. 내부 자원: 고순도 마나 결정 7개. 예상 시장 가격: 1,500만 원.]
      - 이준의 심장이 뛴다. 고순도 마나 결정. 던전 클리어 보상의 10배 이상 가치가 있는 자원이다. 그리고 이것은 벽 내부에 숨겨져 있었다. 일반적인 탐색으로는 발견할 수 없는 것이다.
      - 이준이 파티원들에게 벽을 가리킨다. "여기. 벽 안에 뭔가가 있어요."
      - 정민호: "뭔데?"
      - 이준이 마나를 사용하여 벽의 특정 부분을 두드린다. 마나 해독으로 벽 내부의 장치 위치를 파악한 뒤, 정밀하게 마나를 주입. 벽이 미세하게 진동하더니, 일부가 무너지며 작은 공간이 드러난다.
      - 안에 은빛으로 빛나는 결정들이 놓여 있다. 고순도 마나 결정. 7개.
      - 세린이 눈을 크게 뜬다. "이건... 마나 결정? 이런 곳에?"
      - 정민호가 결정을 집어 든다. "순도가 미쳤어. A급 던전에서도 이 정도는 안 나오는데."
      - 이준이 마나 해독을 계속 가동. 던전 내부에 이런 숨겨진 자원이 더 있을 가능성이 높다. 마나 해독은 이준만이 할 수 있는 것이다. 백화의 S급 기술로도 마나 해독은 불가능하다.
      - 마지막 줄: 이준이 던전 깊은 곳을 향해 걷는다. 벽 안에 숨겨진 자원. 이것은 철혈의 재정 위기를 해결하는 실마리가 될 수 있다. 백화가 막을 수 없는, 이준만이 찾을 수 있는 수익원. 1주일 안에 충분한 자원을 확보하면, 한도혁의 1주일 후 직접 접촉이라는 위협에 대항할 수 있는 카드가 생긴다.

  - name: prelude_to_war
    instruction: |
      이 부분은 55화의 마지막. 분량 2,000자 이상.
      - 던전 클리어 완료. 5인 파티가 던전을 빠져나온다. 보상 외에 이준이 발견한 고순도 마나 결정 7개를 포함하여 총 수익은 예상의 5배를 넘었다.
      - 김하늘이 이준에게 다가온다. 표정이 아직 어둡지만, 던전에서 이준의 능력을 직접 목격한 후에는 미묘한 변화가 있다.
      - "이준 형. 아까 벽 안에 있는 걸 어떻게 알았어?"
      - 이준: "감지 능력이에요. C급 이상이 되니까 조금 더 정밀하게 느낄 수 있어요."
      - 김하늘이 고개를 끄덕인다. 완전히 납득한 것은 아니지만, 이준의 능력을 인정하는 눈빛이다.
      - 정민호가 이준 옆에 걸으며 말한다. "이준아. 이 마나 결정, 일반적으로는 발견 못 하는 거지?"
      - 이준: "네. 마나 해독 능력이 있어야 가능해요."
      - 정민호: "마나 해독? 그게 뭔데?"
      - 이준이 잠시 고민한다. 어디까지 말해야 할까. 하지만 정민호는 이미 이준의 비밀을 대부분 짐작하고 있다.
      - 이준: "마나에 담긴 정보를 읽는 능력이에요. 던전에 숨겨진 자원이나, 마나 장치의 설계도 같은 것을 해독할 수 있어요."
      - 정민호가 쓴웃음을 짓는다. "F급이 아니라는 건 알았지만... 이 정도일 줄은 몰랐어."
      - 이준: "정민호 형. 이건 비밀로 해 주세요. 아직 시기상조예요."
      - 정민호가 고개를 끄덕인다. "알아. 근데 이준아, 이 마나 해독으로 계속 자원을 찾을 수 있으면... 철혈의 재정 문제를 해결할 수 있지 않아?"
      - 이준이 고개를 끄덕인다. "그래서 생각한 거예요. C급 이상 던전에서 마나 해독으로 숨겨진 자원을 찾으면, 백화가 막을 수 없는 수익원이 생겨요."
      - 정민호의 눈이 빛난다. "재밌네. 백화가 30년간 쌓아온 자본력을, 네가 던전 하나에서 뒤집을 수 있다는 거지?"
      - 이준: "뒤집을 수는 없어요. 하지만 버틸 수는 있어요. 그리고 버티는 동안 다른 수를 찾을 수 있어요."
      - 저녁. 이준이 길드 옥상에 선다. 진명 감지(고급) 1.2km 가동.
      - 백화 본사 방향에서 S급 마나 반응. 한도혁. 그리고 그 옆에 A급 — 정재훈. 두 사람이 같은 공간에 있다. 회의 중이다.
      - 남서쪽 1km. 윤새벽의 파동이 감지된다. ch052 이후 두 번째 감지. 윤새벽도 이준의 위치를 파악하고 있다. 진명 서명이 100% 완료된 이후, 이준은 윤새벽을 1km 이내에서 언제든 추적할 수 있다. 하지만 윤새벽의 v1.3은 은폐 특화이므로, 윤새벽도 이준의 위치를 대략적으로 파악할 수 있다.
      - 이준이 핸드폰을 든다. 윤새벽에게 메시지. "오늘 백화가 길드원에게 직접 위협했습니다. 정재훈이 하숙집 앞에 나타났습니다."
      - 3분 뒤 답장. "예상했어. 한도혁은 서서히 압박을 올려. 당신이 버티면 버틸수록 더 강하게 올려."
      - 이준: "1주일 후에 한도혁이 직접 나온다고 들었습니다."
      - 윤새벽의 답장이 늦게 온다. 5분.
      - "그건... 나한테도 같은 일이 있었어. 2년 전. 한도혁이 직접 나왔어. 회유도 하고, 위협도 했어. 내가 거절하자... A급 세 명을 보냈지."
      - 이준: "그때 어떻게 도망쳤어요?"
      - 윤새벽: "은폐. v1.3의 한계를 넘어서서 마나를 완전히 끈 거야. 3일 동안 마나를 쓰지 않고 숨었어. 그게 가능했던 건 한도혁의 사람들이 마나를 의존하는 방식으로 추적했기 때문이야."
      - 이준이 윤새벽의 말을 곱씹는다. 은폐. 마나를 완전히 끊는 것. 이것은 이준에게도 가능한 전술이다. 하지만 대가가 크다. 마나를 끊으면 진명 시스템도 비활성화된다. 감지, 해독, 서명 — 모든 능력이 사라진다.
      - 이준이 윤새벽에게 마지막 메시지를 보낸다. "고마워요."
      - 윤새벽의 답장. "고마워할 거 없어. 나는 내 상황을 알려준 거야. 네가 어떤 선택을 하든, 그건 네 몫이야."
      - 이준이 핸드폰을 내려놓는다. 옥상에서 서울의 야경을 본다. 백화 본사 45층의 불빛이 멀리 보인다. 1주일 후. 한도혁이 직접 온다.
      - 시스템 메시지가 떠오른다.
      - [퀘스트 업데이트 — 철혈의 보호 / 진행도: 60% / 남은 시간: 7일 / 백화의 직접 공격 전까지 철혈을 지켜라 / 추가 목표: 마나 해독을 통한 자원 확보 (진행 중)]
      - 이준이 주먹을 쥔다. 7일. 던전에서 찾은 자원으로 재정을 일부 해결하고, 길드원들의 사기를 회복하고, 한도혁의 직접 접촉에 대비해야 한다.
      - 그리고 이준은 안다. 한도혁의 "직접 접촉"은 회유가 아니다. 최후통첩이다. 한도혁이 직접 나온다는 것은 — 이준을 "살려서" 확보하겠다는 것이 아니라, 확보가 불가능하면 "처리"하겠다는 뜻이다.
      - 마지막 줄: 이준이 백화 본사 방향을 응시한다. 45층의 불빛이 차갑게 빛난다. 그 안에서 한도혁이 체스판을 짜고 있다. 하지만 이준도 이제 말을 움직일 수 있다. 마나 해독, 진명 서명, 그리고 동료들. 2막 전반의 마무리가 다가온다. 그리고 그 뒤에는 — 직접 공격이 기다리고 있다.
