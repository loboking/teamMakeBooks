chapter_n: 57
overall: |
  한도혁이 선전포고한 다음 날, 정재훈이 철혈 길드원 박동현을 공공장소에서
  폭행하고 D급 길드원이 부상당하는 등 백화의 물리적 공격이 본격화된다.
  이준이 진명 감지로 정재훈의 위치를 추적하여 경고 메시지를 보내고,
  세린이 정재훈과 대치하며 B급 vs A급의 한계가 드러나 위기가 고조된다.

beats:
  - name: first_blow
    instruction: |
      이 부분은 57화의 시작. 분량 2,000자 이상.
      - ch056 이후 다음 날. 한도혁이 "내일부터 시작한다"고 한 첫날이다.
      - 이른 아침. 이준이 ch056에서 한도혁에게 S급 마나 압박을 받은 후유증으로 몸이 안 좋다. 근육 통증, 미세한 어지러움. 마나 회로에 미세한 손상이 있지만, 자연 치유 가능한 수준이다.
      - 세린이 이준의 방에 들어온다. 이준의 상태를 마나 감지로 확인한 뒤 표정이 굳는다.
      - 세린: "마나 회로에 미세한 균열이 있어. S급 압박 30초면 이 정도야. 다행히 자연 치유 가능하지만, 한 번 더 받으면 회복이 안 돼."
      - 이준: "알아. 한 번 더 받을 일은 없을 거야."
      - 세린이 이준을 보며 말한다. "어제 한도혁이 뭐라고 했어?"
      - 이준이 간략히 전한다. 회유 제안, 거절, 마나 압박. 아버지의 이름을 언급한 것까지.
      - 세린의 표정이 변한다. "한도혁이 아버지 이름을 직접 말했어?"
      - 이준: "네. '강철민이 내 연구의 시작이었다'고 했어요."
      - 세린이 이를 악문다. "확정이야. 한도혁이 아버지를 죽인 거야."
      - 오전 10시. 이준이 길드 사무실에서 김태석과 회의. 길드 비상 대기 체제가 가동되었다.
      - 김태석: "길드원 5명이 출근했어. 이탈한 2명을 제외하면 총 5명. 그리고 정민호가 아직 병가 중이야."
      - 현재 철혈 길드원 목록: 김태석(A급, 길드장), 세린(B급), 이준(C급 인정), 정민호(C급, 병가), 박동현(C급), 김하늘(D급), 이명호(D급).
      - 김태석: "이준아. 솔직히 말하면... 이 정도 인원으로 백화에 맞서는 건 무리야. 정재훈 하나만 해도 A급이야. 우리 쪽 A급은 나밖에 없고."
      - 이준: "알아요. 하지만 방어만 하면 돼요. 공격이 아니라 버티는 거예요."
      - 김태석: "버틴다고? 정재훈이 길드 건물 앞에 서서 A급 마나를 쏘면, 우리 안에 있는 D급과 C급은 10분도 못 버텨."
      - 이준이 침묵한다. 김태석의 말이 맞다. 등급의 벽은 현실적이다.
      - 그 순간, 이준의 핸드폰이 울린다. 박동현.
      - 이준이 받는다. "동현아?"
      - 박동현의 목소리가 떨리고 있다. "이준 형... 나, 나 지금 강남역 근처야. 정재훈이... 정재훈이..."
      - 이준: "무슨 일이야? 천천히 말해."
      - 박동현: "아까 아침에 편의점 갔는데... 정재훈이 거기 있었어. 나를 쫓아오더니... 골목으로 끌고 가서..."
      - 전화 너머로 박동현의 신음 소리가 들린다.
      - 박동현: "맞았어. 마나를 쓰면서 맞았어. '이준에게 전해라. 첫 경고다.'라고... 그리고 내 등에 마나를 박아 넣었어. 등이... 등이 불타요..."
      - 이준의 얼굴이 굳는다. 정재훈이 첫 공격을 시작했다. 한도혁이 "내일부터 시작한다"고 한 지 불과 12시간 만이다.
      - 이준: "동현아. 지금 어디야? 병원에 갈 수 있어?"
      - 박동현: "약국 근처 카페에 있어. 움직이기 힘들어..."
      - 이준이 김태석에게 보고. 김태석의 얼굴이 붉어진다. 분노.
      - 김태석: "정재훈이... 감히..."
      - 이준: "길드장님. 저 박동현 데리러 가겠습니다. 세린 씨한테 연락해서 정재훈 위치 추적 부탁할게요."
      - 이준이 길드를 나선다. 진명 감지를 가동. 1.2km 범위 내에서 A급 마나 반응을 찾는다.
      - 남쪽 800m. A급 마나. 정재훈. 이동 중이다. 철혈 길드 하숙집 방향에서 멀어지고 있다. 공격을 끝내고 이동하는 것이다.
      - 이준이 핸드폰으로 정재훈의 위치를 세린에게 전달. "정재훈 지금 남쪽 800m. 이동 중. 박동현을 편의점 근처 골목에서 마나 폭행했어."
      - 세린의 답장. "내가 갈게. 정재훈을 막아."
      - 이준: "위험해. B급 vs A급이야."
      - 세린: "알아. 하지만 동현이를 때린 놈을 그냥 보낼 수는 없어."
      - 마지막 줄: 이준이 뛴다. 박동현이 있는 카페를 향해. 첫 번째 부상자가 나왔다. 정재훈의 "경고". 이것은 시작이다. 한도혁이 말한 대로, 이준 주변 사람들이 먼저 타격받는 것이다.

  - name: guild_fear
    instruction: |
      이 부분은 57화의 중반. 분량 2,000자 이상.
      - 이준이 카페에 도착. 박동현이 테이블 구석에 앉아 있다. 얼굴이 창백하고, 이마에 식은땀이 흐른다. 왼쪽 어깨가 내려가 있다. 타격을 받은 것이다.
      - 이준이 박동현에게 다가간다. 마나 감지로 상태를 확인. 어깨 관절 주변에 마나 잔여가 박혀 있다. A급 마나를 억지로 박아 넣은 흔적. C급인 박동현의 몸으로는 이것을 해독할 수 없다. 마나가 서서히 근육을 파괴하고 있다.
      - 이준이 마나 해독을 가동. 박동현의 어깨에 박힌 마나 잔여를 분석.
      - [마나 잔여 분석: A급 마나 3발. 의도: 고통 유발 + 위협. 치명성: 낮음. 단, 24시간 내 해독하지 않으면 근육 손상 진행. 해독 가능: 마나 해독 Lv3 이상 필요.]
      - 이준이 마나 해독으로 박동현의 어깨에서 마나 잔여를 제거하기 시작한다. 조심스럽게. C급 마나로 A급 잔여를 건드리는 것은 위험하다. 마치 아이가 폭탄을 해체하는 것과 같다.
      - 이준의 이마에 땀이 맺힌다. 10분간의 집중 끝에 마나 잔여 대부분을 제거. 박동현의 표정이 조금 풀린다.
      - 박동현: "고마워, 이준 형... 근데... 정재훈이 무서워."
      - 이준: "응. 무서운 놈이야. 하지만 널 죽이려고 한 게 아니야. 경고였어."
      - 박동현: "경고... 그럼 다음엔 더 심하게 하는 거야?"
      - 이준이 대답하지 못한다. 박동현의 말이 맞다. 경고의 다음 단계는 본격적인 공격이다.
      - 이준이 박동현을 길드로 데려간다. 김태석이 박동현을 보며 이를 악문다.
      - 김태석: "정재훈... A급이 C급을 마나로 폭행한 거야? 이건 협회에 신고할 수 있어."
      - 이준: "신고해도 소용없어요. 정재훈은 백화 사람이에요. 백화가 협회 심사과에 매수한 인력이 있어요. 신고가 묻힐 가능성이 높아요."
      - 김태석이 주먹을 치대에 꽂는다. "그럼 뭘 해? 당하고만 있어?"
      - 이준: "아니요. 시간을 벌어야 해요. 지금 당장 정재훈과 싸우면 우리가 진다. A급 vs C급. 등급의 벽은 현실이에요."
      - 오후. 김하늘과 이명호가 박동현의 소식을 듣고 공포에 휩싸인다.
      - 김하늘이 이준에게 다가온다. 표정이 창백하다.
      - "이준 형... 나도 맞을 수 있어요?"
      - 이준이 김하늘을 본다. D급. 19살. 길드에 들어온 지 6개월. 마나 능력이 뛰어나지 않아 짐꾼 역할을 주로 하는 아이다.
      - 이준: "하늘아. 내가 지킬게."
      - 김하늘이 고개를 젓는다. "형이 지켜주면 형이 다치잖아요. C급이 A급한테..."
      - 이준: "그래서 방어 준비를 하는 거야. 내가 계획이 있어. 믿어 줘."
      - 김하늘이 고개를 끄덕인다. 하지만 눈에는 공포가 가시지 않는다.
      - 이명호가 조용히 이준에게 말한다. "이준아. 솔직히... 나도 무서워. 하지만 이명호가 도망칠 생각은 없어. 네가 이 길드에 들어온 이후로 모든 게 달라졌거든. D급이었을 때부터 존중받았고... 도망칠 수는 없어."
      - 이준이 이명호의 어깨를 친다. "고마워, 명호 형."
      - 저녁. 세린이 돌아온다. 표정이 굳어 있다.
      - 이준: "정재훈을 만났어?"
      - 세린: "봤어. 멀리서. 정재훈이 박동현을 때린 뒤 백화 본사로 돌아갔어. 근데... 돌아가기 전에 뭔가를 확인했어."
      - 이준: "확인?"
      - 세린: "자기 손목시계를 보면서... 시간을 확인했어. 일정이 있어. 무언가를 계획하고 있어."
      - 이준이 생각한다. 정재훈이 시간을 확인했다. 계획된 공격이다. 박동현에게 한 것은 "첫 번째"다. 두 번째가 있다.
      - 마지막 줄: 이준이 길드 사무실에 앉아 천장을 본다. 길드원들은 공포에 질려 있다. 박동현은 부상당했고, 김하늘은 두려움에 떨고 있다. 그리고 정재훈은 다음 공격을 준비하고 있다. 이준에게 주어진 시간은 하루 이틀이 아니다. 시간이 갈수록 상황은 나빠진다.

  - name: brink_of_crisis
    instruction: |
      이 부분은 57화의 끝. 분량 2,000자 이상.
      - 밤 11시. 이준이 길드 옥상에서 진명 감지를 가동한다. 1.2km 범위.
      - 백화 본사 방향. S급 반응 — 한도혁. 그리고 A급 두 개 — 정재훈과 또 한 명. A급 두 명. 백화에는 A급 헌터가 최소 3명 이상이다. 철혈의 A급은 김태석 한 명뿐이다.
      - 이준의 진명 감지가 정재훈의 위치를 추적. 정재훈은 백화 본사에 있지 않다. 강남역 남쪽 900m. 철혈 길드 하숙집에서 200m 거리.
      - 이준이 핸드폰을 든다. 정재훈에게 메시지를 보낸다.
      - "정재훈. 오늘 박동현에게 한 짓은 기록했다. 마나 잔여를 보존했다. 협회에 증거로 제출하면 A급의 마나 폭행은 징계 대상이다."
      - 5분 뒤 정재훈의 답장. "ㅋㅋㅋ. 협회? 백화가 심사과에 손을 안 쓴다고 생각해? 그리고 증거? 마나 잔여 보존? C급이 A급의 마나 잔여를 보존할 수 있나? 재밌네."
      - 정재훈이 이준의 마나 해독 능력을 모른다. 아직은.
      - 이준: "한 번만 경고한다. 철혈 길드원에게 손대지 마라."
      - 정재훈의 답장. "경고? 네가 누군데 나한테 경고를 해? C급짜리 주제에. 한도혁 회장님이 관대하신 거야. 네가 항복 안 하면 다음은 김하늘이야. D급 여자애. 내가 손가락 하나만 까딱해도 끝나."
      - 이준의 주먹이 움켜쥐어진다. 핸드폰 화면이 금이 갈 듯하다.
      - 이준이 답장을 보내지 않는다. 대신 윤새벽에게 메시지를 보낸다.
      - "정재훈이 길드원을 폭행했습니다. A급 마나로. 한도혁의 지시입니다."
      - 윤새벽의 답장이 10분 뒤 온다. "예상했어. 한도혁은 항상 그래. 직접 손 안 대고 부하한테 시켜. 네가 가장 아끼는 것을 먼저 공격해. 네가 무너지게 만들어."
      - 이준: "대응 방법이 있나요?"
      - 윤새벽: "한 가지. 정재훈의 약점. 마나 의존성. 한도혁의 모든 부하는 마나 의존성이 심해. 마나가 끊기면 일반인과 다를 바 없어."
      - 이준: "마나를 끊는 방법을 아나요?"
      - 윤새벽: "나는 v1.3으로 마나 은폐할 수 있어. 하지만 공격용으로 마나를 끊는 건 다른 문제야. 네 마나 해독이 정재훈의 마나 패턴을 분석하면... 약점을 찾을 수 있을 거야."
      - 이준이 윤새벽의 말을 곱씹는다. 마나 해독으로 정재훈의 마나 패턴을 분석. 그것이 가능하다면 — 정재훈의 약점을 찾을 수 있다.
      - 하지만 그러려면 정재훈의 마나를 직접 관찰해야 한다. 가까이에서. 그리고 정재훈은 A급이다. 접근 자체가 위험하다.
      - 이준이 핸드폰을 내려놓으려는 순간, 세린의 전화가 온다.
      - 세린: "이준아. 나 지금 철혈 하숙집 앞이야. 정재훈이 여기 있어."
      - 이준의 심장이 멈춘다. "뭐? 정재훈이 하숙집 앞에?"
      - 세린: "응. 근데 혼자가 아니야. 뒤에 A급 한 명 더 있어. 두 명이야."
      - 이준: "도망쳐! 세린 씨, 지금 당장 도망쳐!"
      - 세린: "도망? 나 B급이야. A급 두 명한테 도망치라고? 그래, 도망쳐야 하긴 하지. 근데..."
      - 전화 너머로 마나 충돌 소리가 들린다. 바람이 부는 소리. 그리고 세린의 신음.
      - 세린: "크... A급 한 명이면 버틸 수 있었는데... 두 명은..."
      - 이준이 뛴다. 옥상에서 계단을 내려간다. 길드에서 하숙집까지 400m. 2분.
      - 뛰면서 이준은 진명 감지를 가동한다. 하숙집 방향에서 A급 마나 두 개와 B급 마나 하나가 충돌하고 있다.
      - 마지막 줄: 이준이 거리를 뛴다. 밤거리. 가로등 빛. 400m. 세린이 A급 두 명에게 맞서고 있다. B급 vs A급 두 명. 이것은 싸움이 아니라 학살이다. 이준은 뛴다. C급의 다리로. 하지만 뛰지 않으면 세린이 죽는다.
