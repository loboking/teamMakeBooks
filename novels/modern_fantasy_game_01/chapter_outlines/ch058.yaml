chapter_n: 58
overall: |
  한도혁이 정한 기한 당일, 이준이 서동현과 비밀 접촉하여 박세진의 USB를
  인계받는다. USB에는 한도혁의 마나 장치 폭주 설계도, 박세진의 진명 시스템
  기록, 한도혁의 마나 패턴이 담겨 있다. 이준이 이를 윤새벽의 정보와
  결합하여 대응 전략을 수립하지만, 한도혁이 기한 만료 후 첫 공격 명령을
  내리며 위기가 다가온다.

beats:
  - name: secret_meeting
    instruction: |
      이 부분은 58화의 시작. 분량 2,000자 이상.
      - ch057의 세린 위기 이후 다음 날 아침. 세린은 부상을 입었지만 치명적이지 않았다. 이준이 도착하기 직전, 세린이 B급 마나를 폭발시켜 A급 한 명을 물리치고, 다른 한 명에게서 도망쳤다. 대가는 왼팔 골절과 마나 회로 30% 손상. 2주간 전투 불가.
      - 이준이 병원에서 세린을 면회. 세린의 왼팔에 깁스가 있다. 표정은 차분하지만, 눈 아래에 그림자가 져 있다.
      - 이준: "미안해. 내가 더 빨리 갔어야 했는데."
      - 세린: "사과하지 마. 대신 약속해. 다음엔 나를 지켜주겠다고."
      - 이준이 고개를 끄덕인다. "약속해."
      - 세린이 이준을 보며 말한다. "그리고... 어젯밤에 정재훈의 마나를 느꼈어. 가까이서. 그 사람 마나에 특이한 게 있어. 마나가 비대칭이야. 오른쪽에서 왼쪽으로 흐르는 마나가 다른 방향보다 3배 강해. 비대칭 마나는... 약점이 될 수 있어."
      - 이준의 머릿속에 정보가 연결된다. 윤새벽이 말한 "마나 의존성". 세린이 관찰한 "비대칭 마나". 두 정보가 하나의 결론을 가리킨다. 정재훈의 마나 패턴에는 구조적 취약점이 있다.
      - 이준: "고마워, 세린 씨. 그 정보 중요해."
      - 오후 1시. 이준이 서동현과의 비밀 접촉 장소로 향한다. 장소는 강남역에서 지하철로 3역 거리의 작은 공원. 사람이 적은 평일 오후.
      - 서동현이 벤치에 앉아 있다. 양복 차림. 항상 그렇듯 점잖은 표정. 하지만 오늘은 긴장감이 감지된다.
      - 이준이 앉는다. 서동현이 주변을 확인한 뒤 입을 연다.
      - "강이준 씨. 박세진의 USB를 가져왔어."
      - 이준의 심장이 뛴다. ch043에서 서동현이 처음 언급한 USB. 박세진이 죽기 전 서동현에게 맡긴 데이터. 한도혁의 비밀이 담긴 USB.
      - 서동현이 주머니에서 은색 USB를 꺼낸다. 작다. 일반적인 USB와 다르지 않다. 하지만 그 안에 담긴 것은 —
      - 서동현: "안에 세 가지가 들어 있어. 첫째, 한도혁의 마나 장치 폭주 설계도. 한도혁이 진명 시스템 보유자에게 사용할 계획이었던 장치야. 마나 회로를 강제로 개방해서 시스템 데이터를 추출하는 장치."
      - 이준의 온몸에 소름이 돋는다. 마나 회로 강제 개방. 아버지를 죽인 방법.
      - 서동현: "둘째, 박세진의 진명 시스템 기록. 세진이 자신의 시스템에 대해 연구하면서 남긴 노트야. v1.7의 작동 원리, 시스템의 한계, 그리고..."
      - 서동현이 잠시 멈춘다.
      - "...그리고 시스템이 '누군가에 의해 만들어졌다'는 가설. 세진은 진명 시스템이 자연적으로 발생한 게 아니라, 인위적으로 설계된 거라고 믿었어."
      - 인위적 설계. 진명 시스템이 누군가에 의해 만들어졌다. 이것은 이준이 아직 고려하지 못한 가능성이다.
      - 서동현: "셋째, 한도혁의 마나 패턴 데이터. 세진이 한도혁의 마나를 분석해서 기록해 뒀어. 정재훈의 것도 일부 있어."
      - 이준이 USB를 받아 든다. 손이 미세하게 떨린다.
      - 이준: "서동현 씨. 왜 이걸 저한테 주시는 거예요?"
      - 서동현이 이준을 본다. 표정이 복잡하다.
      - "나는... 백화에서 15년을 일했어. 한도혁이 회장이 되기 전부터. 한도혁이 변한 건 5년 전이야. 강철민 씨와 관련된 일이 있은 뒤로. 그때부터 한도혁은... 인간이 아니게 됐어."
      - 서동현이 먼 산을 본다.
      - "세진이 죽은 뒤로 나는 매일 죄책감에 시달렸어. 세진이 나한테 USB를 맡기면서 마지막으로 한 말이 기억나. '이걸 믿을 수 있는 사람에게 전해줘. 나는 한도혁에게서 도망칠 수 없지만, 다음 보유자는 도망칠 수 있을 거야.'"
      - 이준이 서동현의 눈을 본다. 15년간 백화에서 일한 남자. 한도혁의 변화를 지켜본 사람. 그리고 지금, 모든 것을 걸고 이준에게 USB를 넘기는 사람.
      - 이준: "감사합니다. 이건 반드시 활용하겠습니다."
      - 서동현이 고개를 끄덕인다. 그리고 일어선다.
      - "마지막으로 하나. 한도혁이 오늘 밤 첫 공격 명령을 내릴 거야. '기한'이 오늘이니까. 정재훈이 직접 나올 거야. 이번에는 경고가 아니야. 본격적인 공격이야."
      - 서동현이 돌아선다. 그리고 멈춰 선다. 뒤를 돌아보지 않고.
      - "강이준 씨. 세진이 믿었던 사람이 나였고, 내가 믿는 사람은 당신이야. 그 사슬이 끊어지지 않게 해줘."
      - 서동현이 걸어간다.
      - 마지막 줄: 이준이 USB를 쥔 채 벤치에 남는다. 박세진이 남긴 마지막 유산. 한도혁의 비밀. 그리고 시스템이 "인위적으로 설계되었다"는 가설. 이것은 단순한 증거가 아니다. 한도혁을 무너뜨릴 수 있는 무기다. 하지만 그 무기를 사용할 시간은 얼마 남지 않았다. 오늘 밤. 한도혁이 공격 명령을 내린다.

  - name: analyzing_the_enemy
    instruction: |
      이 부분은 58화의 중반. 분량 2,000자 이상.
      - 이준이 길드로 돌아온다. 김태석은 외출 중 (협회에서 긴급 회의). 이준이 자기 방에 들어가 노트북을 켠다.
      - USB를 노트북에 연결. 암호가 걸려 있다. 하지만 이준은 마나 해독을 사용할 수 있다. USB에 담긴 데이터는 마나 기반 암호화다. 일반적인 해독은 불가능하지만, 마나 해독으로 마나 패턴을 분석하면 암호 키를 추출할 수 있다.
      - 이준이 마나 해독을 가동. USB의 암호를 해독.
      - [마나 암호 해독 완료. 데이터 복구 중...]
      - 첫 번째 파일: "마나 장치 폭주 설계도_v3.2.pdf"
      - 이준이 열어본다. 도면과 수식이 빼곡하다. 이준은 공학 지식이 없지만, 마나 해독으로 설계도에 담긴 마나 패턴을 읽을 수 있다.
      - [마나 패턴 분석: 대상 — 진명 시스템 보유자의 마나 회로. 작동 원리 — 대상의 마나 회로를 강제로 개방하여 시스템 데이터를 외부로 추출. 부작용 — 마나 회로 파괴 (100%). 사망률 (100%).]
      - 100%. 마나 회로 파괴. 사망률 100%. 이 장치를 사용하면 보유자는 무조건 죽는다. 아버지 강철민. 박세진. 둘 다 이 장치의 희생자일 가능성이 높다.
      - 이준이 설계도를 더 분석한다. 장치의 마나 패턴에 특이점이 있다. 장치 자체가 한도혁의 마나와 연동되어 있다. 즉, 이 장치를 작동시키려면 한도혁의 마나가 필요하다. 다른 사람이 작동시킬 수 없다. 한도혁만이 사용할 수 있는 장치다.
      - 두 번째 파일: "박세진_진명시스템_연구노트.txt"
      - 이준이 열어본다. 박세진의 필체가 담긴 텍스트 파일. 날짜별로 정리된 연구 노트.
      - "2023년 3월 15일. 진명 시스템 각성. v1.7. 능력: 마나 감지, 마나 제어, 마나 전이. 마나 전이는 다른 대상의 마나를 이동시키는 능력. 아직 미숙하지만, 발전 가능성이 높다."
      - "2023년 4월 2일. 한도혁 접촉. 백화 회장. 나의 능력을 알고 있다. '진명 시스템'이라는 이름을 사용한다. 그가 이 시스템에 대해 알고 있는 것은... 나보다 많다. 불안하다."
      - "2023년 6월 20일. 시스템 분석 결과. 진명 시스템은 자연 발생이 아니다. 마나 구조에 인위적 패턴이 있다. 누군가가 설계했다. 하지만 누가? 언제? 어떤 목적으로?"
      - 이준의 손이 떨린다. 박세진의 가설이 맞다. 시스템은 인위적이다. 누군가가 설계했다.
      - "2023년 9월 10일. 한도혁의 마나 패턴 분석 완료. 한도혁은 진명 시스템 보유자가 아니다. 하지만 보유자와 유사한 마나 패턴을 가지고 있다. 모방? 아니면... 시스템 설계자와의 연결?"
      - 이준이 멈춘다. 한도혁은 보유자가 아니다. 하지만 유사한 마나 패턴을 가지고 있다. 이것은 새로운 정보다.
      - 세 번째 파일: "한도혁_마나패턴_분석.hmd"
      - hmd — 헌터 마나 데이터. 협회 표준 포맷. 이준이 마나 해독으로 열어본다.
      - [한도혁 마나 패턴 분석 결과 / 등급: S급 / 마나 총량: 측정 불가 (상한 초과) / 마나 속성: 강제 전이 / 특이점: 마나가 단일 회로가 아닌 이중 회로로 구성. 일반 S급과 다른 비정상 구조.]
      - 이중 회로. 한도혁의 마나는 일반 헌터와 다른 구조를 가지고 있다. 이것이 S급 이상의 힘의 비밀일 수 있다.
      - 그리고 정재훈의 데이터.
      - [정재훈 마나 패턴 분석 결과 / 등급: A급 / 마나 총량: A급 상위 / 마나 속성: 파동 / 특이점: 마나 흐름의 비대칭성. 우측에서 좌측으로의 마나 흐름이 역방향보다 3.2배 강함. 비대칭 원인: 마나 회로 우측에 인위적 증폭 장치가 이식됨.]
      - 인위적 증폭 장치. 정재훈의 마나 회로에 장치가 이식되어 있다. 백화의 기술. 한도혁이 부하들에게 마나 증폭 장치를 이식해서 등급을 인위적으로 올린 것이다.
      - 이것이 정재훈의 "마나 의존성"의 정체다. 장치에 의존한 마나. 장치가 파괴되거나 마나 흐름이 차단되면 — 정재훈의 전투력은 급감한다.
      - 마지막 줄: 이준이 USB 데이터를 다시 확인한다. 마나 장치 설계도, 박세진의 연구 노트, 한도혁과 정재훈의 마나 패턴. 이 세 가지를 결합하면 — 한도혁에 대항할 수 있는 전략이 보인다. 정재훈의 약점은 마나 회로에 이식된 증폭 장치다. 그 장치를 무력화하면, 정재훈은 A급에서 B급 이하로 떨어진다. 마나 해독이 그것을 할 수 있다.

  - name: final_countdown
    instruction: |
      이 부분은 58화의 끝. 분량 2,000자 이상.
      - 오후 5시. 이준이 USB에서 얻은 정보를 정리하여 윤새벽에게 암호화 메시지로 전송한다.
      - "정재훈의 마나 회로에 인위적 증폭 장치 이식 확인. 마나 해독으로 무력화 가능할 수 있음. 박세진 연구 노트에서 시스템이 인위적 설계라는 가설 확인. 한도혁의 마나 이중 회로 구조. 보유자가 아님."
      - 윤새벽의 답장이 20분 뒤 온다. 길다.
      - "정재훈의 증폭 장치... 그래. 한도혁이 부하들에게 하는 거야. 마나 회로에 장치를 이식해서 등급을 올리는 거지. 장점은 전투력 증가. 단점은... 장치에 의존하게 돼. 마나 회로가 장치 주위로 재구성되니까. 장치가 무력화되면 마나 회로가 일시적으로 붕괴해."
      - 윤새벽이 이어서 쓴다.
      - "한도혁의 이중 회로... 그건 내가 몰랐어. 한도혁이 보유자가 아니라는 건 확신했는데, 이중 회로라... 혹시 한도혁이 시스템 설계자에게서 마나를 직접 받은 건 아닐까? 시스템을 설계한 누군가가 한도혁에게 마나를 이식한 거야. 그러면 한도혁은 보유자보다 약하지만, 시스템에 더 가까운 존재가 되는 거지."
      - 이준이 윤새벽의 분석을 곱씹는다. 시스템 설계자. 진명 시스템을 만든 누군가. 한도혁이 그 사람과 연결되어 있다. 그리고 그 사람은 —
      - 아직 알 수 없다. 하지만 단서는 모이고 있다.
      - 이준이 윤새벽에게 마지막 질문. "정재훈의 증폭 장치를 무력화하려면 어떻게 해야 할까요? 마나 해독으로 마나 패턴을 분석하고, 장치의 마나 주파수를 역산하면 차단 가능한가요?"
      - 윤새벽: "이론적으로 가능해. 하지만 정재훈의 마나를 가까이에서 직접 관찰해야 해. 50m 이내. 그리고 마나 해독으로 실시간으로 장치의 주파수를 읽어야 해. 그러려면... 정재훈이 공격할 때여야 해. 정재훈이 마나를 최대한 사용하는 순간에 장치의 주파수가 가장 선명하게 드러나."
      - 이준이 생각한다. 정재훈이 공격할 때. 50m 이내에서 관찰. 마나 해독으로 장치 주파수 역산. 이것은 — 정재훈과 싸우면서 약점을 찾는 것이다. 위험하다. 하지만 다른 방법이 없다.
      - 저녁 8시. 이준이 김태석과 대면. USB 내용의 일부를 공유. 한도혁의 마나 이중 회로, 정재훈의 증폭 장치.
      - 김태석이 놀란다. "정재훈이 마나 장치를 이식받았다고? 그게 사실이면... 협회 등급 측정에서도 속인 거잖아."
      - 이준: "네. 인위적으로 A급이 된 거예요. 원래는 B급이거나 그 이하일 수 있어요."
      - 김태석: "그럼 장치를 무력화하면?"
      - 이준: "B급 이하로 떨어집니다. 그러면 길드장님과 대등하게 싸울 수 있어요."
      - 김태석의 눈이 빛난다. A급 vs B급. 그것은 김태석이 이길 수 있는 싸움이다.
      - 김태석: "좋아. 어떻게 하면 되지?"
      - 이준: "정재훈이 공격할 때 마나 해독으로 장치 주파수를 읽어야 합니다. 50m 이내에서. 그리고 역산해서 차단."
      - 김태석이 침묵한다. "50m 이내... 정재훈이 마나를 쓰면서... 네가 그 사이에 있어야 한다는 거지?"
      - 이준: "네."
      - 김태석: "위험해."
      - 이준: "알아요."
      - 밤 10시. 이준의 핸드폰에 서동현의 메시지가 온다.
      - "한도혁이 방금 공격 명령을 내렸습니다. 정재훈 주도. 대상: 철혈 길드 본부. 시간: 내일 오전. 내용: 길드원 전원 퇴거 압박. 저항 시 A급 마나 사용. 이것은 최후통첩의 실행입니다."
      - 내일 오전. 한도혁이 기한을 넘겼다. "일주일"이 끝났다. 이제 공격이다.
      - 이준이 핸드폰을 내려놓는다. 시스템 메시지가 떠오른다.
      - [퀘스트 — 철혈의 보호 / 최종 단계 / 백화의 공격이 내일 오전 시작됩니다 / 생존 조건: 길드원 전원 보호 + 정재훈 격퇴 / 실패 시: 철혈 해체 + 이준 위험 증가]
      - 이준이 눈을 감는다. 내일. 모든 것이 내일 결정된다.
      - 마지막 줄: 이준이 방 안에서 USB를 책상 서랍에 넣는다. 박세진의 유산. 3년간 서동현이 지켜온 증거. 이제 이것은 이준의 무기다. 정재훈의 약점, 한도혁의 비밀, 시스템의 기원. 모든 단서가 모였다. 내일 아침, 정재훈이 올 것이다. 그리고 이준은 — 싸울 것이다. C급의 몸으로. 하지만 진명 시스템의 힘으로.
