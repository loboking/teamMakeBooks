chapter_n: 59
overall: |
  한도혁의 공격 명령이 실행되어 정재훈이 철혈 길드 건물을 압박하고
  길드원들을 위협한다. 김태석이 A급으로 맞서지만 정재훈에게 밀린다.
  위기의 순간 이준이 마나 해독으로 정재훈의 마나 패턴을 분석하여
  약점을 발견하고 직접 개입하며, B급 이상의 마나를 노출시킨다.

beats:
  - name: siege_begins
    instruction: |
      이 부분은 59화의 시작. 분량 2,000자 이상.
      - 오전 9시. 철혈 길드 본부. 3층짜리 낡은 건물. 강남역에서 버스로 15분 거리의 주택가 골목에 있다.
      - 이준이 아침 일찍 일어나 길드원들을 소집했다. 김태석, 박동현, 김하늘, 이명호. 세린은 병원에 입원 중.
      - 이준이 작전을 설명한다. "오늘 정재훈이 올 거예요. 공격이 아니라 압박이에요. 길드원들을 쫓아내려는 거예요. 항복하면 안 돼요. 하지만 정면으로 맞서지도 마세요. 저와 길드장님이 대응할게요."
      - 김태석: "대응 방법은?"
      - 이준: "제가 정재훈의 약점을 찾고 있습니다. 찾는 즉시 길드장님에게 알려드릴게요. 길드장님은 그때를 기다려서 결정타를 내주세요."
      - 김태석이 고개를 끄덕인다. 이준의 말을 믿는다. 지난 한 달간 이준의 판단은 항상 옳았다.
      - 오전 10시 30분. 이준의 진명 감지가 반응한다. 남쪽 600m에서 A급 마나가 접근. 정재훈. 그리고 그 뒤에 C급 마나 두 개. 백화 산하 헌터들.
      - 이준: "온다. 정재훈과 부하 둘."
      - 김태석이 일어선다. "나는 1층에서 맞는다. 이준, 너는 2층에서 관찰. 마나 해독으로 약점을 찾아라."
      - 이준이 고개를 끄덕인다. 박동현, 김하늘, 이명호는 3층 대피. 비전투원은 안전하게.
      - 오전 10시 45분. 정재훈이 길드 건물 앞에 나타난다. 검은 정장. 표정은 무표정. 뒤에 백화 산하 C급 헌터 두 명이 따른다.
      - 정재훈이 건물을 올려다본다. 그리고 말한다. 큰 소리로.
      - "철혈 길드원들에게 전한다. 10분 안에 건물을 비워라. 항복하는 자는 보호한다. 거부하는 자는... 후회하게 된다."
      - 김태석이 건물 1층 출입구에서 나온다. A급 마나를 가동. 주변의 공기가 무거워진다.
      - 김태석: "정재훈. 내 건물 앞에서 허튼소리 하지 마라."
      - 정재훈이 김태석을 본다. 미소를 짓는다. "김태석. A급. 15년 헌터 경력. 하지만... 낡았어."
      - 정재훈이 마나를 가동한다. A급 상위의 마나가 퍼져나간다. 김태석의 마나와 충돌. 공기가 진동한다. 건물의 유리창이 미세하게 흔들린다.
      - 김태석의 표정이 변한다. 정재훈의 마나가 예상보다 강하다. A급 상위. 아니, 장치를 통한 인위적 증폭까지 포함하면 사실상 A급 최상위의 위력이다.
      - 정재훈이 김태석을 향해 한 발을 내딛는다. 마나 파동이 지면을 따라 퍼진다. 김태석이 뒤로 밀린다. 한 발. 두 발.
      - 김태석이 이를 악문다. 마나를 더 끌어올린다. 하지만 정재훈의 증폭 장치가 버티고 있다. A급 자연 마나 vs A급 증폭 마나. 자연 마나가 밀린다.
      - 이준이 2층 창가에서 관찰한다. 마나 해독을 가동. 정재훈의 마나 패턴을 분석.
      - [마나 패턴 분석 중... 거리: 40m... 해상도: 중간... 마나 총량: A급 상위 (증폭 장치 포함)... 마나 흐름: 우측 집중...]
      - 40m. 충분히 가깝다. 이준이 마나 해독을 최대 가동. 정재훈의 마나 회로를 세밀하게 읽는다.
      - [증폭 장치 위치 확인: 우측 전완부 (팔뚝). 장치 형태: 링형. 작동 주파수: 7.42 MHz (마나 단위). 장치 의존도: 전체 마나의 68%.]
      - 68%. 정재훈의 마나의 68%가 증폭 장치에서 나온다. 장치를 무력화하면 정재훈은 A급 상위에서 B급 하위로 떨어진다. 아니, 장치 의존으로 인해 마나 회로가 재구성되어 있으니, 장치가 꺼지면 마나 회로 일시 혼란까지 겪을 것이다.
      - 하지만 아직이다. 장치 주파수를 역산해서 차단 신호를 만들어야 한다. 시간이 필요하다. 이준은 마나 해독으로 주파수를 역산하기 시작한다.
      - 마지막 줄: 1층에서 김태석이 정재훈에게 밀리고 있다. A급 vs A급 증폭. 자연이 인공에 밀리는 광경. 이준은 2층에서 마나 해독으로 정재훈의 약점을 분석 중이다. 시간과의 싸움이다. 김태석이 버틸 수 있는 시간이 얼마나 남았는가.

  - name: tactical_withdrawal
    instruction: |
      이 부분은 59화의 중반. 분량 2,000자 이상.
      - 1층. 김태석이 정재훈에게 계속 밀린다. 3m, 5m, 8m. 김태석이 건물 안으로 밀려난다.
      - 정재훈이 여유롭다. "김태석. 네가 이 정도인 줄 알았어. A급이라고? 장식이네."
      - 김태석이 땀을 흘리며 맞선다. 하지만 체력적으로도 마나적으로도 정재훈에게 밀린다. 15년 경력의 A급이 30대의 A급 증폭에게 밀리는 것이다.
      - 정재훈이 한 발 마나 파동을 쏜다. 김태석이 방패형 마나를 전개해 막지만, 충격으로 건물 벽에 부딪힌다. 벽에 균열이 간다.
      - 3층에서 김하늘이 비명을 지른다. 박동현이 김하늘을 감싼다. 이명호가 창밖을 내려다본다.
      - 이명호가 핸드폰으로 이준에게 메시지. "길드장님이 위험해. 정재훈이 진지해."
      - 이준이 2층에서 마나 해독을 계속한다. 정재훈의 증폭 장치 주파수를 역산. 7.42 MHz. 이 주파수에 상쇄 파동을 보내면 장치가 일시적으로 정지한다.
      - 하지만 상쇄 파동을 만들려면 이준도 마나를 B급 이상으로 끌어올려야 한다. 마나 해독만으로는 부족하다. 실제 마나 출력이 필요하다.
      - 이준이 결단을 내린다. 마나 은폐를 해제한다. C급에서 B급으로 마나를 끌어올린다.
      - 이준의 마나가 2층에서 퍼져나간다. B급 하위의 마나. 하지만 이것으로도 정재훈의 장치 주파수를 상쇄하기에는 부족할 수 있다.
      - 이준이 더 끌어올린다. B급 중위. B급 상위. 진명 시스템이 반응한다.
      - [경고: 마나 은폐 해제. B급 상위 마나 감지 가능. 협회 감지 시스템에 노출 위험. 계속하시겠습니까?]
      - 이준이 "예"를 선택한다.
      - 마나가 더 올라간다. B급 상위. 거의 A급 경계. 이준의 몸이 뜨겁다. 마나가 혈관을 따라 흐른다. 온몸의 세포가 마나로 가득 찬다.
      - 이준이 상쇄 파동을 계산. 7.42 MHz의 역위상. 정확히 180도 반대 위상. 이것을 정재훈의 우측 전완부에 보내면 장치가 정지한다.
      - 하지만 2층에서 1층으로 마나를 보내는 것은 정확도가 떨어진다. 직접 가까이 가야 한다.
      - 1층. 김태석이 한계에 달했다. 정재훈의 마나 파동을 막다가 무릎을 꿇는다.
      - 정재훈이 김태석 위에 서서 말한다. "항복해, 김태석. 철혈은 끝이야. 한도혁 회장님이 관대하시니까, 너와 길드원들은 백화 산하에 편입시켜 주지. 좋은 조건이야."
      - 김태석이 피를 토하며 고개를 든다. "편입? 웃기지 마. 너희가 철혈을 부수려고 이 짓을 하는데... 편입이라니."
      - 정재훈: "선택의 여지를 주는 거야. 항복하면 살고, 거부하면..."
      - 정재훈이 손을 든다. A급 마나가 김태석의 머리 위로 모인다. 결정타. 이대로 가면 김태석은 중상을 입거나 죽는다.
      - 그 순간. 2층 창문이 깨진다. 이준이 뛰어내린다.
      - 마나 파동이 이준의 몸에서 퍼져나간다. B급 상위. 아니, 그 이상. 마나 해독과 결합한 이준의 마나는 일반적인 B급과는 다른 질감을 가지고 있다. 진명 시스템의 마나. 해독의 마나.
      - 정재훈이 놀라서 뒤를 돌아본다. "뭐야? 이 마나는..."
      - 이준이 김태석과 정재훈 사이에 선다.
      - 이준: "멈춰."
      - 정재훈이 이준의 마나를 감지한다. 표정이 변한다. 놀라움. 그리고 분노.
      - "B급? 네가... C급이 아니었어?"
      - 이준: "C급은 협회 공식 등급이에요. 내 진짜 등급은... 중요하지 않아요. 중요한 건 당신이 오늘 여기서 물러난다는 거예요."
      - 정재훈이 웃는다. "B급? B급짜리가 나한테 대들어? 증폭 장치 없는 자연 A급보다도 약한 B급이?"
      - 이준이 침묵한다. 정재훈의 말이 맞다. 순수 마나량으로는 이준이 밀린다. 하지만 이준에게는 마나 해독이 있다.
      - 마지막 줄: 이준이 정재훈과 마주 선다. 김태석이 뒤에서 피를 흘리며 이준을 본다. 정재훈이 이준을 위에서 아래로 본다. B급 vs A급 증폭. 격차는 분명하다. 하지만 이준의 눈에는 두려움이 없다. 왜냐하면 — 이준은 정재훈의 약점을 이미 알고 있기 때문이다.

  - name: reveal_and_risk
    instruction: |
      이 부분은 59화의 끝. 분량 2,000자 이상.
      - 정재훈이 이준에게 마나 파동을 쏜다. A급 상위의 파동. 이준이 옆으로 피한다. 파동이 뒤의 건물 벽을 부순다. 벽돌이 날아간다.
      - 이준이 마나 해독을 가동. 정재훈의 우측 전완부에 집중. 증폭 장치의 주파수를 실시간으로 추적.
      - [주파수 추적 중... 7.42 MHz... 변동: ±0.03 MHz... 상쇄 파동 계산 완료. 발사 준비.]
      - 하지만 이준은 즉시 상쇄 파동을 쏘지 않는다. 타이밍이 필요하다. 정재훈이 마나를 최대한 사용하는 순간. 장치가 가장 활성화된 순간. 그때 쏴야 효과가 극대화된다.
      - 정재훈이 다시 마나 파동을 쏜다. 이준이 이번에는 막지 않고 직접 맞는다.
      - 파동이 이준의 왼팔을 스친다. 통증이 밀려온다. 하지만 이준은 버틴다. 이 순간, 정재훈의 마나가 최대 출력으로 발사되었고, 증폭 장치도 최대 가동되었다.
      - [장치 활성도: 100%. 주파수 안정. 상쇄 파동 발사 —]
      - 이준이 오른손을 들어올린다. 마나 해독으로 만든 상쇄 파동이 이준의 손끝에서 형성된다. 보이지 않는 파동. 7.42 MHz의 역위상.
      - 이준이 정재훈을 향해 쏜다.
      - 파동이 정재훈의 우측 전완부에 도달한다.
      - 정재훈의 표정이 변한다. 우측 팔에서 마나가 꺼진다. 증폭 장치가 정지한 것이다.
      - 정재훈이 자신의 팔을 본다. 마나가 사라졌다. A급 상위의 마나가 갑자기 B급 하위로 떨어진다.
      - 정재훈: "뭐... 뭐야? 내 마나가..."
      - 정재훈의 몸이 흔들린다. 장치가 꺼지면서 마나 회로에 혼란이 온다. 마나 순환이 불안정해진다. 정재훈이 무릎을 꿇는다.
      - 이준이 정재훈에게 다가간다. 마나 해독을 계속 가동. 정재훈의 마나 상태를 모니터링.
      - [정재훈 마나 상태: 증폭 장치 정지. 자연 마나: B급 하위. 마나 회로 혼란: 중증. 전투 불가 상태. 회복 예상 시간: 3~5시간.]
      - 이준이 정재훈 앞에 멈춰 선다. 내려다본다.
      - 이준: "정재훈. 돌아가."
      - 정재훈이 이준을 올려다본다. 분노와 공포와 불신이 뒤섞인 눈빛.
      - 정재훈: "네가... 뭔데? 이게 뭐야? 내 장치를..."
      - 이준: "돌아가서 한도혁에게 전해. 항복하지 않을 거라고."
      - 정재훈이 이를 악문다. 하지만 몸이 마음대로 되지 않는다. 마나 회로 혼란으로 인해 일어서기도 어렵다.
      - 정재훈 뒤에서 백화 산하 C급 헌터 두 명이 움직이려 한다. 하지만 김태석이 벽에 기대어 일어나며 마나를 가동한다. A급의 잔여 마나. 하지만 C급 두 명에게는 충분하다.
      - 김태석: "움직이지 마라. A급 한 명이 안 되더라도, 너희 C급 둘 정도는 처리할 수 있다."
      - C급 두 명이 멈춘다. 정재훈이 부상당한 것을 보고 판단을 내린다.
      - 정재훈이 C급 두 명에게 명령한다. "물러난다."
      - 정재훈이 비틀거리며 일어난다. 이준을 한 번 본다. 그리고 돌아선다.
      - 정재훈이 걸어가면서 이준에게 말한다. "이게 끝이 아니야. 한도혁 회장님은... 당신을 직접 처리하실 거야. S급에 B급 따위는..."
      - 정재훈과 C급 두 명이 사라진다.
      - 이준이 김태석을 돕는다. 김태석의 상태가 좋지 않다. A급 마나 충돌의 여파. 갈비뼈 2개 골절, 내출혈 의심.
      - 김태석이 이준을 본다. "이준아... 너 B급이야?"
      - 이준: "아뇨. 아직 C급이에요."
      - 김태석: "거짓말. 방금 그 마나는 B급 이상이었어. 아니, 질감이 달랐어. 일반 B급과는... 뭐지? 그 마나는?"
      - 이준이 침묵한다.
      - 김태석이 쓴웃음을 짓는다. "비밀이겠지. 알겠어. 지금은 말 안 해도 돼. 하지만 이준아..."
      - 김태석이 이준의 어깨를 잡는다.
      - "고맙다. 오늘 네가 없었으면 난 죽었어."
      - 이준이 고개를 끄덕인다.
      - 그 순간, 이준이 느낀다. 자신의 마나가 — 감지 시스템에 포착되었다는 것을. 협회의 마나 감지 시스템. 서울 시내에서 B급 이상의 마나가 감지되면 자동으로 기록된다.
      - 이준의 핸드폰이 울린다. 알 수 없는 번호.
      - 이준이 받는다.
      - "강이준 씨? 헌터협회 심사과입니다. 방금 강남 구역에서 B급 이상의 마나 반응이 감지되었습니다. 해당 위치에 계셨습니까?"
      - 이준의 심장이 뛴다. 협회가 이미 알았다.
      - 이준: "네. 저였습니다."
      - 침묵. 그리고 심사과 직원의 목소리.
      - "강이준 씨. 협회 등급 C급으로 등록되어 계시는데, B급 이상의 마나 반응이 감지되었습니다. 이에 대해 설명이 필요합니다. 내일 협회 본부로 와주시기 바랍니다."
      - 전화가 끊긴다.
      - 마지막 줄: 이준이 핸드폰을 내려놓는다. 정재훈은 물러났다. 철혈은 지켰다. 하지만 대가가 있었다. 이준의 마나가 협회에 포착되었다. "C급 강이준"이 B급 이상의 마나를 사용했다. 은폐가 깨졌다. 그리고 한도혁이 기다리고 있던 것은 바로 이 순간이다. 이준이 드러나는 순간. 협회를 통한 체포. 그것이 한도혁의 다음 수다.
