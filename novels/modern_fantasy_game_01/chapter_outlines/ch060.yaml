chapter_n: 60
overall: |
  이준과 정재훈의 대결이 마무리되고 정재훈이 퇴각하지만, 이준의 마나
  노출이 협회 감지 시스템에 포착되어 "은폐 헌터"로 공식 분류된다.
  협회가 이준에 대한 조사를 시작하고, 한도혁이 협회를 통해 이준을
  체포하려 하며 2막 후반전이 시작된다.

beats:
  - name: aftermath
    instruction: |
      이 부분은 60화의 시작. 분량 2,000자 이상.
      - ch059의 전투 직후. 오후 1시. 철혈 길드 본부.
      - 길드 건물에 긴급 출동한 구급차가 김태석을 실어간다. 갈비뼈 2개 골절, 내출혈. 중상이지만 생명에는 지장이 없다.
      - 이준이 구급차 뒤를 지켜본다. 박동현, 김하늘, 이명호가 옆에 있다. 세린은 아직 병원에 있다.
      - 김하늘이 울고 있다. "길드장님 괜찮을 거죠?"
      - 이준: "괜찮을 거야. 길드장님은 튼튼해."
      - 박동현이 이준에게 다가온다. 표정이 복잡하다. 경외와 두려움과 감사가 뒤섞여 있다.
      - "이준 형. 방금... 협회에 전화한 거 들었어. B급 이상 마나 감지됐다고."
      - 이준: "네."
      - 박동현: "그러면... 협회에서 조사하러 오는 거야?"
      - 이준: "내일 가기로 했어요."
      - 이명호가 끼어든다. "이준아. 솔직히 말해봐. 네 등급이 C급이 아니라 B급인 거야?"
      - 이준이 이명호를 본다. 그리고 박동현과 김하늘을 본다. 셋 다 이준을 보고 있다. 기대와 불안이 뒤섞인 눈빛.
      - 이준이 결단한다. 더 숨길 수 없다. 이미 마나가 노출되었고, 내일 협회에 가야 한다. 길드원들에게 최소한의 진실을 말하는 것이 낫다.
      - 이준: "C급은 협회 공식 등급이에요. 실제로는... B급 이상의 마나를 제어할 수 있어요. 하지만 등급을 올리지 않은 건 이유가 있어요. 아직 말할 수 없는 이유가."
      - 박동현이 삼킨다. "B급 이상... C급인 줄 알았는데..."
      - 이명호가 쓴웃음을 짓는다. "그래서 C급 던전에서 마나 결정을 찾고, A급 정재훈을 물리친 거야? C급이 아니었어."
      - 김하늘이 눈을 크게 뜬다. "이준 형... 진짜 B급 이상이야?"
      - 이준: "중요한 건 등급이 아니에요. 중요한 건 철혈을 지키는 거예요. 그리고 오늘, 우리는 지켰어요."
      - 셋이 침묵한다. 그리고 박동현이 먼저 고개를 끄덕인다.
      - "이준 형. 등급이 뭐가 중요해. 형이 우리를 지켜줬잖아."
      - 이명호도 고개를 끄덕인다. 김하늘이 눈물을 닦으며 고개를 끄든다.
      - 이준이 길드원들을 본다. 부상당한 김태석, 골절당한 세린, 위협받은 박동현, 공포에 질린 김하늘, 이명호. 그리고 자신. C급에서 B급 이상으로 드러난 은폐 헌터.
      - 오후 3시. 이준이 병원에 가서 김태석을 면회. 김태석은 병실에 누워 있다. 산소 마스크를 쓰고 있지만 의식은 있다.
      - 이준이 병실에 들어가자 김태석이 눈을 뜬다.
      - 김태석: "이준아."
      - 이준: "길드장님. 미안해요. 제가 더 빨리 개입했어야 했는데."
      - 김태석이 고개를 젓는다. "늦지 않았어. 네가 왔으니까 살았어."
      - 김태석이 잠시 침묵한다. 그리고 말한다.
      - "이준아. 나는 네 정체를 모르겠어. C급에서 B급 이상? 아니면 더 높은? 모르겠어. 하지만..."
      - 김태석이 이준의 손을 잡는다.
      - "네가 철혈에 들어온 이후로 모든 게 변했어. 좋은 방향으로. 네가 있어서 철혈이 버틸 수 있었어. 그리고 앞으로도 버틸 수 있을 거야."
      - 이준: "길드장님..."
      - 김태석: "내일 협회에 가는 거지?"
      - 이준: "네."
      - 김태석: "조심해. 협회에 백화 손이 있어. 한도혁이 협회를 움직이면..."
      - 이준: "알아요. 대비하고 있어요."
      - 이준이 병실을 나온다. 복도에서 잠시 멈춰 선다. 내일. 협회. 한도혁의 다음 수가 기다리고 있다.
      - 마지막 줄: 이준이 병원을 나온다. 오후의 햇빛이 따갑다. 어제의 전투가 아직 몸에 남아 있다. B급 마나를 끌어올린 후유증. 근육통, 마나 회로 피로. 하지만 정신은 맑다. 내일의 위험을 계산하고, 대비를 세우고, 실행할 준비가 되어 있다.

  - name: official_classification
    instruction: |
      이 부분은 60화의 중반. 분량 2,000자 이상.
      - 이준이 길드로 돌아와 윤새벽에게 상황을 보고한다.
      - "협회에서 B급 이상 마나 감지. 내일 출석 요구. 은폐 헌터 분류 확정될 가능성 높음."
      - 윤새벽의 답장이 빠르게 온다.
      - "은폐 헌터... 협회 규정상 가장 문제가 되는 분류야. 은폐 헌터는 협회의 등급 관리 시스템을 의도적으로 우회한 것으로 간주돼. 징계 대상이야. 그리고..."
      - 윤새벽이 이어서 쓴다.
      - "한도혁이 기다린 게 바로 이거야. 네가 드러나는 순간. 협회를 통해서 네를 압박할 수 있거든. 은폐 헌터 분류가 확정되면, 한도혁은 협회에 '정식 이의 제기'를 할 수 있어. '강이준은 은폐 헌터로서 협회 규정을 위반했다. 징계 및 조사가 필요하다'고. 그러면 협회가 널 소환하고, 조사하고, 한도혁이 그 과정에 개입할 수 있어."
      - 이준: "협회가 한도혁 편을 들까요?"
      - 윤새벽: "편을 든다기보다는... 한도혁이 협회에 뿌리를 박고 있어. 심사과에 사람이 있고, 이사회에 영향력이 있고. 협회가 공정하게 움직이지 않을 거야."
      - 이준이 생각한다. 한도혁의 체스. 1수: 길드원 위협. 2수: 정재훈 공격. 3수: 이준의 마나 노출 유도. 4수: 협회를 통한 체포.
      - 정재훈을 공격한 것은 한도혁이 이준을 드러나게 만들려는 의도였을 수 있다. 이준이 길드를 지키기 위해 B급 마나를 쓰면, 협회에 포착된다. 포착되면 은폐 헌터 분류. 분류되면 협회를 통해 압박.
      - 이준이 윤새벽에게 묻는다. "대응 방법이 있을까요?"
      - 윤새벽: "한 가지. USB에 한도혁의 비밀이 있잖아. 마나 장치 폭주 설계도. 정재훈의 증폭 장치 증거. 그걸 협회에 제출하면, 정재훈도 징계 대상이 돼. 네가 은폐 헌터면, 정재훈도 인위적 등급 조작이야. 둘 다 조사받으면, 협회가 한쪽만 편들기 어려워져."
      - 이준의 눈이 빛난다. 맞다. USB. 박세진의 유산. 한도혁의 마나 장치 설계도. 정재훈의 증폭 장치 증거. 이것을 협회에 제출하면 —
      - 하지만 문제가 있다. USB의 데이터는 마나 해독으로만 열 수 있다. 협회에 제출하려면, 협회에서도 읽을 수 있는 형태로 변환해야 한다. 그리고 마나 해독으로 데이터를 변환하는 과정에서 이준의 능력이 추가로 노출될 수 있다.
      - 이준이 서동현에게 연락. "USB 데이터를 협회에 제출할 수 있는 형태로 변환 가능한가요?"
      - 서동현의 답장이 1시간 뒤 온다.
      - "가능합니다. 마나 기반 암호화는 협회에서도 해독 가능한 표준 포맷으로 변환할 수 있습니다. 하지만 변환 과정에서 데이터 출처가 노출됩니다. 누가 이 데이터를 가지고 있었는지. 그러면 박세진의 이름도, 제 이름도 드러납니다."
      - 이준: "서동현 씨의 신변이 위험해집니다."
      - 서동현: "알고 있습니다. 하지만... 이것이 마지막 기회라고 생각합니다. 한도혁이 당신을 협회를 통해 압박하려면, 우리도 협회를 통해 한도혁을 압박해야 합니다. 상호확증파괴. 둘 다 무사히 끝날 수는 없지만, 둘 다 무너뜨릴 수는 있어요."
      - 이준이 침묵한다. 서동현의 신변 위험. 박세진의 이름 노출. 하지만 이것이 유일한 수다.
      - 이준: "알겠습니다. 데이터 변환을 준비해 주세요. 내일 협회에 가기 전에 받고 싶습니다."
      - 서동현: "오늘 밤까지 준비하겠습니다."
      - 저녁. 이준이 USB와 관련 자료를 정리한다. 내일 협회에 가져갈 것들: 1) USB 변환 데이터 (한도혁 마나 장치 설계도), 2) 정재훈의 증폭 장치 증거 (마나 해독으로 분석한 데이터), 3) 박세진의 연구 노트 일부 (시스템 인위적 설계 가설).
      - 이준이 핸드폰을 든다. 세린에게 메시지. "내일 협회에 가야 해. 이유는 나중에 설명할게. 길드는 동현아랑 명호 형한테 맡길게."
      - 세린의 답장. "나도 나갈게. 골절이야. 하지만 걸을 수는 있어."
      - 이준: "아니야. 쉬어. 길드원들이 지켜봐야 해."
      - 세린: "강이준. 나한테 맡겨."
      - 이준이 웃는다. 세린이 진지하다. 하지만 이번만큼은 세린을 쉬게 해야 한다.
      - 이준이 눈을 감고 내일을 시뮬레이션한다. 협회 본부. 심사과. 조사관. 그리고 한도혁이 보낸 사람이 있을 것이다. 은폐 헌터 분류에 대한 조사. 징계 결정. 한도혁의 압력.
      - 하지만 이준에게도 카드가 있다. USB 데이터. 한도혁의 비밀. 상호확증파괴.
      - 마지막 줄: 이준이 책상 위에 놓인 USB를 본다. 박세진이 죽기 전 서동현에게 맡긴 것. 3년간 숨겨진 증거. 내일, 이 USB가 이준의 무기가 된다. 그리고 동시에, 서동현의 목숨을 건 도박이 된다.

  - name: act_two_turning_point
    instruction: |
      이 부분은 60화의 끝. 분량 2,000자 이상.
      - 밤 11시. 이준이 길드 옥상에 선다. 서울의 야경. 백화 본사 45층의 불빛이 멀리 보인다.
      - 진명 감지를 가동. 1.2km 범위. 백화 본사에서 S급 반응. 한도혁. 아직 자지 않았다. 이준이 마나를 노출한 것을 알고 있을 것이다. 예상대로.
      - 이준의 진명 시스템이 메시지를 띄운다.
      - [퀘스트 완료 — 철혈의 보호 / 정재훈 격퇴 완료 / 길드원 전원 생존 / 보상 지급: Lv7 진행도 대폭 증가]
      - [새 퀘스트 — 은폐의 대가 / 난이도: 극상 / 협회 조사를 버텨라 / 한도혁의 협회 내 압력을 차단하라 / 보상: Lv8 진행도 + 시스템 정보 해금 + 새로운 능력]
      - 이준이 시스템 메시지를 읽는다. Lv7 진행도 증가. 그리고 새 퀘스트. "은폐의 대가".
      - 윤새벽에게서 메시지가 온다.
      - "내일 협회에 갈 때 조심해. 한도혁이 직접 나오지는 않겠지만, 대리인을 보낼 거야. 협회 이사회 중 한 명이 한도혁과 연결되어 있어. 이름은 모르지만, 이사회 결의를 통해 네 징계를 강행할 수 있어."
      - 이준: "알겠어요."
      - 윤새벽: "그리고 한 가지 더. 내일 협회에 가기 전에... 한 가지 준비해."
      - 이준: "준비?"
      - 윤새벽: "마나 은폐를 완전히 해제해. 협회에 가서 C급인 척하지 마. B급 이상의 마나를 당당하게 보여줘."
      - 이준: "그러면 은폐 헌터 분류가 확정되잖아요."
      - 윤새벽: "이미 확정됐어. 네 마나가 감지됐으니까. 숨기면 숨길수록 더 나빠져. '은폐 의도'가 추가로 적용되거든. 차라리 당당하게 드러나서, '은폐한 게 아니라 측정이 불완전했다'고 주장해."
      - 이준이 윤새벽의 말을 곱씹는다. 숨기지 않는다. 드러난다. 은폐가 아닌 미측정. 그것이 방어 전략이다.
      - 윤새벽이 마지막 메시지를 보낸다.
      - "그리고 강이준. 2년 전 나도 같은 상황이었어. 한도혁에게 드러나서, 협회에 조사받고, 도망쳤어. 하지만 넌 나랑 달라. 넌 싸우고 있어. 도망치지 않고. 그게 다르야."
      - 이준이 핸드폰을 내려놓는다. 옥상의 바람이 차갑다.
      - 이준이 생각한다. 2막 전반의 끝. 백화의 회유, 위협, 공격. 그리고 이준의 드러남. 2막 후반의 시작. 협회 조사, 한도혁의 압력, 그리고 — 한도혁과의 직접 대결이 다가온다.
      - ch038에서 김태석이 말했다. "이준아. 넌 평범한 사람이 아니야."
      - ch043에서 세린이 말했다. "이준 씨. 당신은 뭔가 다릅니다."
      - ch052에서 윤새벽이 말했다. "v2.0이잖아. 조심해."
      - 그리고 ch056에서 한도혁이 말했다. "당신의 아버지가 내 연구의 시작이었다."
      - 이 모든 말들이 하나의 실로 연결된다. 이준은 — 평범하지 않다. 진명 시스템 v2.0 보유자. 강철민의 아들. 한도혁의 표적. 철혈의 방패.
      - 시스템 메시지가 하나 더 떠오른다.
      - [시스템 정보 해금 — v2.0 진화 조건 / Lv7 달성 시 진화 가능 / 진화 내용: 마나 해독 고급화 + 진명 서명 범위 확대 + 새로운 능력 해금 (상세 불명) / 현재 Lv6 → Lv7까지 필요 경험치: 60%]
