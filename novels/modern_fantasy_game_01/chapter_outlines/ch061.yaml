chapter_n: 61
overall: |
  이준이 협회 본부 심사과에 출석하여 조사를 받는다. 마나 은폐를 해제하고
  B급 상위 마나를 당당하게 노출시키며 "은폐한 게 아니라 측정이 불완전했다"는
  윤새벽의 전략을 실행한다. 한도혁이 보낸 대리인이 조사에 개입하여 이준의
  징계를 압박하지만, 이준이 USB 변환 데이터를 제출하여 정재훈의 인위적
  등급 조작 증거를 공개하고 상호확증파괴를 시작한다.

beats:
  - name: entering_the_hall
    instruction: |
      이 부분은 61화의 시작. 분량 2,000자 이상.
      - 오전 9시 30분. 이준이 협회 본부 앞에 선다. 서울 용산구. 20층짜리 검은 건물. 헌터협회 대한민국 본부. 이 건물에 들어가는 것은 두 번째다. 첫 번째는 C급 등록 재측정 때였다. 그때는 C급 각성자로서. 지금은 "은폐 헌터"로서.
      - 이준이 건물 입구에서 잠시 멈춘다. 핸드폰을 확인. 윤새벽의 마지막 메시지.
      - "마나 은폐 완전 해제. 들어가자마자 해제해. 협회의 감지 시스템이 네 마나를 읽으면, 'C급으로 측정된 사람이 B급 이상 마나를 가지고 있었다'는 기록이 남아. 그게 네 방어 근거야. '은폐 의도'가 아니라 '측정 시스템의 한계'라고 주장하는 거야."
      - 이준이 심호흡을 한다. 마나 은폐를 해제한다. B급 상위의 마나가 이준의 몸에서 자연스럽게 퍼져나간다. 주변의 공기가 미세하게 변한다. 건물 입구의 보안 요원이 갑자기 경직한다. 감지기가 반응한다.
      - 보안 요원: "저... 저기. 마나가..."
      - 이준: "심사과 출석입니다. 강이준."
      - 보안 요원이 핸드폰으로 연락. 긴장한 목소리로 무언가를 보고한다. 그리고 이준에게 통행증을 건넨다. "3층. 심사과 301호."
      - 이준이 건물 안으로 들어간다. 로비는 넓고 차갑다. 마블 바닥. 협회 마나 감지 시스템이 이준의 마나를 실시간으로 기록하고 있다. B급 상위. 협회 데이터베이스에 "강이준, C급"으로 등록된 사람이 B급 상위의 마나를 방출.
      - 3층. 심사과. 복도 끝 301호. 문 앞에 안내 직원이 서 있다.
      - 안내 직원: "강이준 씨? 조사관님들이 기다리고 계십니다. 들어가시기 전에... 마나를 최소한으로 낮춰주실 수 있나요? 조사관님들이 불편해하실 수 있어서."
      - 이준이 마나를 약간 수축한다. B급 상위에서 B급 중위 정도로. 완전히 숨기지는 않는다. 윤새벽의 전략대로. 은폐가 아니라 조절이다.
      - 301호. 회의실. 긴 테이블. 한쪽에 조사관 세 명이 앉아 있다.
      - 중앙 조사관: 50대 남성. 회색 머리. 엄격한 인상. 이름표 — "심사과장 박경호".
      - 좌측 조사관: 40대 여성. 날카로운 눈. 이름표 — "심사과 차장 유수진".
      - 우측 조사관: 30대 남성. 젊지만 표정이 굳어 있다. 이름표 — "심사과 조사관 최동혁".
      - 그리고 — 회의실 뒤쪽에 한 명이 더 있다. 창가에 서서 밖을 보고 있다. 50대 초반. 검은 양복. 이사회 배지를 달고 있다. 이준이 진명 감지를 가동. 이 남자의 마나는... B급. 하지만 이 남자의 마나에는 한도혁의 흔적이 있다. 마나 패턴의 미세한 유사성. 한도혁의 대리인.
      - 이준이 회의실에 들어간다. 박경호가 이준을 본다.
      - 박경호: "앉으세요, 강이준 씨."
      - 이준이 앉는다. 마나는 여전히 B급 중위로 노출. 회의실의 공기가 무거워진다. 세 조사관 모두 이준의 마나를 느끼고 있다. C급으로 알려진 헌터가 B급 이상의 마나를 풍기는 상황.
      - 박경호가 서류를 펼친다.
      - "강이준 씨. 본인은 협회 등급 C급으로 등록되어 있습니다. 등록일: 2025년 3월. 재측정일: 2025년 7월. 재측정 결과: C급 유지. 그러나..."
      - 박경호가 이준을 올려다본다.
      - "2025년 10월 29일. 강남 구역에서 B급 이상의 마나 반응이 감지되었습니다. 해당 위치에 계셨다고 본인이 확인했습니다. 이에 대해 설명이 필요합니다."
      - 이준이 답한다. 윤새벽이 준비한 대로.
      - "심사과장님. 저는 은폐한 게 아닙니다. 원래 B급 이상의 마나를 가지고 있었습니다. 하지만 초기 등급 측정과 재측정 모두에서 정확한 측정이 이루어지지 않았습니다."
      - 유수진이 끼어든다. "측정이 불완전했다? 협회 측정 장비는 국제 표준입니다. 불완전할 수가 없어요."
      - 이준: "그렇다면 지금 이 순간, 제 마나를 측정해 보시겠습니까? 지금 B급 상위의 마나를 제어하고 있습니다. 협회 감지 시스템도 이미 기록했을 겁니다."
      - 조사관들이 서로를 본다. 박경호가 최동혁에게 눈짓. 최동혁이 태블릿을 확인한다.
      - 최동혁: "과장님. 로비 감지 시스템 기록 확인했습니다. 강이준 씨가 건물에 들어왔을 때 B급 상위 반응. 현재도 B급 중위 이상 유지 중입니다."
      - 박경호의 표정이 변한다. 확인된 것이다. 이준의 마나는 B급 이상이다.
      - 마지막 줄: 이준이 협회 심사과에 앉아 있다. B급 상위의 마나를 드러내고, C급의 껍데기를 벗었다. 조사관 세 명과 뒤쪽에 서 있는 한도혁의 대리인. 그리고 이준의 주머니 속에는 USB 변환 데이터가 있다. 아직 꺼내지 않은 무기. 이 조사가 이준에게 불리하게 흘러가기 전에 — 상호확증파괴의 첫 번째 카드를 꺼내야 할 때다.

  - name: proxy_pressure
    instruction: |
      이 부분은 61화의 중반. 분량 2,000자 이상.
      - 조사가 진행된다. 박경호가 질문을 이어간다.
      - "강이준 씨. 협회 규정 제47조에 따르면, 헌터는 자신의 실제 등급을 은폐할 수 없습니다. 등급 은폐가 확인될 경우, 징계위원회에 회부되며, 최대 1년 활동 정지 및 벌금이 부과됩니다."
      - 이준: "심사과장님. 저는 은폐 의도가 없었다고 말씀드렸습니다. 측정 시스템이 저의 마나를 정확히 읽지 못한 것입니다. 그 이유는... 저의 마나가 일반적인 헌터와 다른 구조를 가지고 있기 때문입니다."
      - 유수진: "다른 구조? 그게 무슨 뜻이죠?"
      - 이준이 잠시 침묵한다. 어디까지 말할 것인가. 진명 시스템의 존재를 밝힐 것인가. 아니. 아직은 아니다. 진명 시스템은 한도혁만이 알고 있어야 하는 비밀이다. 최소한 지금은.
      - 이준: "제 마나가 일반 B급과는 다른 주파수를 가지고 있습니다. 협회 측정 장비가 이 주파수를 정상적으로 감지하지 못합니다. 이것은 제가 조작한 것이 아니라, 타고난 특성입니다. 만약 의도적인 은폐였다면, 처음 등록 시부터 C급이 아니라 F급으로 등록했을 것입니다."
      - 박경호가 이준의 말을 곱씹는다. "F급으로 등록..." 사실이다. 이준은 F급으로 등록했다. 그리고 4개월 뒤 C급으로 승급했다. F급에서 C급으로의 승급은 이례적이지만 불가능하지는 않다. "늦깎이 각성"이라는 선례가 있다.
      - 그 순간, 뒤쪽에서 한도혁의 대리인이 입을 연다. 창가에서 앞으로 걸어온다.
      - "박 과장님. 한 가지 의견을 말씀드려도 되겠습니까?"
      - 박경호가 대리인을 본다. 표정이 미세하게 변한다. 이사회 배지. 이 남자는 이사회 소속이다. 심사과에 이사회 인사가 개입하는 것은 흔한 일은 아니다.
      - 박경호: "이사회 이정호 이사님. 물론이지요."
      - 이정호. 한도혁의 대리인. 이사회 이사. 이준은 이 이름을 윤새벽에게 들었다. "이사회 중 한 명이 한도혁과 연결되어 있어." 이 사람이다.
      - 이정호가 이준을 본다. 미소를 짓지 않는다. 무표정.
      - "강이준 씨의 주장을 들었습니다. '측정 불완전'이라고요. 하지만 이것은 검증 가능한 주장입니까? 협회 장비가 한 사람의 마나만 읽지 못했다는 것을 어떻게 증명하시겠습니까?"
      - 이준이 이정호를 본다. 눈을 피하지 않는다.
      - "이사님. 그렇다면 역으로 질문하겠습니다. 협회 장비가 완벽하다면, 협회에 등급 조작을 하는 헌터는 없어야 합니다. 하지만 그런 사례가 있지 않습니까?"
      - 이정호의 눈이 미세하게 좁아진다. 이준이 어디를 향해 쏘는지 알아차린 것이다.
      - 이정호: "무슨 뜻이지요?"
      - 이준이 주머니에서 USB 변환 데이터가 담긴 태블릿을 꺼낸다. 서동현이 밤새 변환한 데이터. 협회 표준 포맷. 협회 시스템에서 바로 열 수 있다.
      - 이준: "저는 은폐 헌터 조사를 받을 의향이 있습니다. 하지만 그 조사는 일방적이어서는 안 됩니다. 저와 관련된 사안이 조사되는 동안, 다른 헌터의 등급 조작 의혹도 함께 조사되어야 합니다."
      - 이준이 태블릿을 박경호에게 건넨다.
      - "이 안에는 백화 길드 소속 정재훈의 마나 패턴 분석 데이터가 들어 있습니다. 정재훈은 협회 등급 A급으로 등록되어 있습니다. 하지만 이 데이터에 따르면, 정재훈의 마나 회로에 인위적 증폭 장치가 이식되어 있습니다. 정재훈의 실제 자연 마나는 B급 하위 수준이며, A급 등급은 장치를 통한 인위적 조작의 결과입니다."
      - 회의실이 정적에 휩싸인다.
      - 유수진이 태블릿을 가져간다. 화면을 확인. 협회 표준 포맷. 마나 패턴 분석 데이터. 정재훈의 마나 회로 구조. 우측 전완부에 이식된 장치. 마나 의존도 68%. 모든 것이 빼곡하다.
      - 유수진: "이 데이터는... 협회 표준 포맷입니다. 하지만 출처가 어디죠?"
      - 이준: "출처는 보호해야 합니다. 하지만 데이터의 진위는 협회 시스템에서 검증 가능합니다. 정재훈의 마나 패턴과 비교하시면 됩니다. 협회에 정재훈의 등급 측정 데이터가 있을 테니까."
      - 이정호의 표정이 변한다. 무표정이 금이 간다. 미세하게 입술이 떨린다. 한도혁에게 보고해야 한다.
      - 이정호: "박 과장님. 이 데이터는 신빙성이 검증되지 않았습니다. 은폐 헌터 조사와 별개로 다루어야 합니다."
      - 이준: "이사님. 은폐 헌터 조사와 등급 조작 조사는 별개가 아닙니다. 같은 맥락입니다. 저의 마나가 B급 이상인데 C급으로 측정된 것이 은폐라면, 정재훈의 마나가 B급인데 A급으로 측정된 것도 은폐입니다. 다만 방향이 반대일 뿐. 저는 마나를 숨겼고, 정재훈은 마나를 부풀렸습니다. 둘 다 협회 등급 시스템을 왜곡한 것입니다."
      - 박경호가 이준의 말을 생각한다. 박경호는 20년간 심사과에서 일한 베테랑이다. 이준의 말이 논리적으로 맞다. 양측 조사가 병행되어야 한다는 주장은 합리적이다.
      - 마지막 줄: 회의실 안에서 권력의 충돌이 시작된다. 이정호는 이준의 징계를 밀어붙이려 하고, 이준은 상호확증파괴로 맞선다. 박경호와 유수진은 데이터의 진위를 검증해야 한다. 이 조사의 결과는 이준 한 명의 등급에 관한 것이 아니다. 한도혁의 백화 제국 전체의 근간을 흔들 수 있는 사안이다.

  - name: mutual_destruction_begins
    instruction: |
      이 부분은 61화의 끝. 분량 2,000자 이상.
      - 박경호가 결정을 내린다.
      - "잠시 정회하겠습니다." 조사관 세 명이 회의실 밖으로 나간다. 이정호도 따라 나간다. 이준만 회의실에 남는다.
      - 이준이 의자에 앉아 천장을 본다. 심장이 빠르게 뛴다. 하지만 머리는 차갑다. 윤새벽의 전략이 작동하고 있다. 상호확증파괴. 이준이 은폐 헌터로 조사받으면, 정재훈도 등급 조작으로 조사받아야 한다. 협회가 한쪽만 편들기 어려워진다.
      - 15분 뒤. 조사관들이 돌아온다. 이정호는 돌아오지 않았다. 이정호가 빠진 것은 좋은 징조다. 이정호가 참여하면 한도혁의 압력이 직접적으로 작용하지만, 이정호가 빠지면 박경호의 판단에 따라 결정이 내려진다.
      - 박경호가 입을 연다.
      - "강이준 씨. 심사과의 결정입니다. 첫째, 강이준 씨에 대한 은폐 헌터 조사를 개시합니다. 조사 기간은 2주. 그동안 강이준 씨의 헌터 활동은 제한되지 않습니다. 단, 협회에 정기적으로 마나 측정을 받아야 합니다."
      - 이준: "네."
      - 박경호: "둘째, 제출하신 데이터에 대해 검증을 진행합니다. 데이터의 진위가 확인될 경우, 백화 길드 소속 정재훈에 대한 등급 조작 조사를 병행 개시합니다."
      - 이준의 어깨에서 힘이 빠진다. 성공이다. 정재훈 조사가 병행된다.
      - 박경호: "셋째, 데이터 출처에 대해서는 추후 보호 조치를 취하겠습니다. 단, 출처가 밝혀질 경우, 해당 인물에 대한 보호도 보장합니다."
      - 이준이 고개를 끄덕인다. 서동현의 보호. 협회가 약속했다. 물론, 한도혁의 압력이 얼마나 작용할지는 모르지만.
      - 박경호가 마지막으로 말한다.
      - "강이준 씨. 한 가지 경고합니다. 이 조사 과정에서 증거 조작이나 위증이 발견될 경우, 징계가 훨씬 무거워집니다. 이해하시죠?"
      - 이준: "네. 이해합니다."
      - 이준이 회의실을 나온다. 복도에서 이정호와 마주친다. 이정호가 벽에 기대어 서 있다. 핸드폰을 들고. 아마 한도혁에게 보고한 직후일 것이다.
      - 이정호가 이준을 본다. 표정은 무표정. 하지만 눈빛에는 냉기가 서려 있다.
      - "강이준 씨. 오늘의 결과에 만족하지 마세요. 이건 시작일 뿐입니다."
      - 이준이 이정호를 본다. "이사님. 저도 같은 말을 하고 싶네요."
      - 이준이 걸어간다. 협회 본부를 나선다. 밖의 공기가 차갑다.
      - 핸드폰이 울린다. 윤새벽.
      - "어땠어?"
      - 이준: "정재훈 조사 병행 확정. 데이터 검증 후 개시."
      - 윤새벽: "잘했어. 하지만 이정호가 거기 있었다면, 한도혁은 이미 알고 있어. 준비해. 한도혁이 다음 수를 올 거야."
      - 이준: "알아요."
      - 이준이 걷는다. 협회 건물에서 버스 정류장까지. 10분 거리. 걸으면서 생각한다.
      - 상호확증파괴의 첫 번째 단계가 완료됐다. 이준이 은폐 헌터로 조사받고, 정재훈이 등급 조작으로 조사받는다. 협회가 양측을 동시에 조사하면, 한도혁이 이준만 압박하기 어려워진다.
      - 하지만 문제가 있다. 정재훈의 증폭 장치를 협회가 실제로 검증할 수 있는가. 데이터만으로는 부족하다. 협회가 정재훈을 소환해서 마나 측정을 다시 해야 한다. 그리고 장치를 발견해야 한다.
      - 장치는 정재훈의 우측 전완부에 이식되어 있다. 피부 아래. 일반적인 마나 측정으로는 발견하기 어렵다. 협회가 정밀 검사를 해야 한다. 그리고 정재훈이 협력하지 않으면 — 강제 검사가 필요하다.
      - 강제 검사. 협회 규정상 가능하다. 하지만 한도혁이 막을 수도 있다. 이정호를 통해서.
      - 시스템 메시지가 떠오른다.
      - [퀘스트 진행 중 — 은폐의 대가 / 단계 1 완료: 협회 조사 개시 / 정재훈 등급 조작 조사 병행 확정 / 다음 단계: 협회의 정재훈 조사 실행 대기 / 보상: Lv7 진행도 +10%]
      - [Lv7 진행도: 60% → 70%]
      - 70%. 아직 30% 부족하다. Lv7에 도달하려면 더 많은 경험치가 필요하다. 던전 경험치, 전투 경험치, 혹은 — 시스템이 정의하는 "특별 이벤트" 경험치.
      - 마지막 줄: 이준이 버스에 오른다. 창밖으로 협회 본부가 멀어진다. 검은 건물. 20층. 그 안에서 이준의 운명이 결정되고 있다. 아니, 운명이 결정되는 것이 아니다. 이준이 결정하는 것이다. 상호확증파괴. 이준이 던진 돌이 연못에 빠졌고, 파문이 퍼지고 있다. 그 파문이 한도혁에게 닿을 때 — 백화의 균열이 시작될 것이다.
