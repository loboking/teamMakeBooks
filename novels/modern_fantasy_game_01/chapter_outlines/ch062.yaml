chapter_n: 62
overall: |
  협회 조사가 확대되면서 정재훈이 소환되어 조사를 받고 증폭 장치 이식을
  부인하지만, 이준이 마나 해독으로 수집한 추가 증거를 제출한다. 한도혁이
  서동현을 백화에서 해고시키고 매수자로 지목하여 서동현의 신변을 위협하고,
  한도혁이 협회 이사회에 이준을 S급 연구 시설로 이관하라는 제안을 한다.
  이준이 윤새벽과 만나 협력 협정을 체결한다.

beats:
  - name: summoning
    instruction: |
      이 부분은 62화의 시작. 분량 2,000자 이상.
      - ch061로부터 3일 후. 오전 10시. 협회 본부 심사과. 정재훈이 소환장을 받고 출석했다.
      - 이준은 심사과에 없다. 이준의 조사와 정재훈의 조사는 분리해서 진행된다. 하지만 이준은 협회 밖에서 상황을 파악하고 있다. 윤새벽을 통해, 그리고 서동현을 통해.
      - 서동현이 이준에게 메시지를 보낸다.
      - "정재훈이 오늘 오전 심사과에 출석했습니다. 조사관: 박경호, 유수진. 이정호는 참석하지 않았습니다."
      - 이준: "정재훈의 태도는?"
      - 서동현: "증폭 장치 이식을 완전히 부인하고 있습니다. '마나 회로 구조의 개인적 특성일 뿐'이라고 주장하고 있습니다."
      - 이준이 예상한 대로다. 정재훈은 부인할 것이다. 장치는 피부 아래에 이식되어 있으니, 겉보기에는 "개인적 특성"으로 보일 수 있다. 일반적인 마나 측정으로는 장치를 발견할 수 없다.
      - 하지만 이준에게는 추가 증거가 있다. ch059에서 정재훈과 전투했을 때, 이준이 마나 해독으로 정재훈의 마나 패턴을 실시간으로 분석했다. 그때 수집한 데이터에는 증폭 장치의 주파수, 작동 패턴, 그리고 이준이 보낸 상쇄 파동에 대한 장치의 반응이 모두 기록되어 있다.
      - 이준이 서동현에게 메시지. "내가 ch059에서 수집한 정재훈 마나 패턴 실시간 분석 데이터를 협회 표준 포맷으로 변환할 수 있나요?"
      - 서동현: "가능합니다. 하지만... 이 데이터를 제출하면, 정재훈과의 전투가 있었다는 것이 명확해집니다. 협회에 '미신고 전투'로 징계받을 수 있습니다."
      - 이준: "알아요. 하지만 정재훈의 장치를 증명하려면 이 데이터가 필요해요. 미신고 전투 징계는 감수하겠습니다."
      - 서동현: "알겠습니다. 오늘 밤까지 변환하겠습니다."
      - 오후 2시. 이준이 병원에서 김태석을 면회한다. 김태석은 퇴원 준비 중이다. 갈비뼈 골절은 뼈가 붙기 시작했고, 내출혈은 치료됐다. 하지만 A급 전투의 후유증으로 전투 복귀는 1주일 후.
      - 김태석이 병상에 앉아 이준을 본다. "협회 조사는 어때?"
      - 이준: "정재훈 조사 병행 확정됐어요. 데이터 검증 중이에요."
      - 김태석: "데이터가 맞으면 정재훈이 걸리는 거지?"
      - 이준: "네. A급 등급 정지까지 가능해요."
      - 김태석의 눈이 빛난다. "A급 정지. 그러면 백화에 큰 타격이야. 정재훈은 백화의 전투력 핵심이니까."
      - 이준: "하지만 한도혁이 가만히 안 있을 거예요. 이사회를 통해서 압력을 넣고 있어요."
      - 김태석이 이를 악문다. "한도혁... 그 놈은 협회까지 장악했어."
      - 이준: "전부는 아니에요. 아직 중립파가 있어요. 심사과장 박경호가 공정한 사람이에요."
      - 김태석이 고개를 끄덕인다. "믿어. 네 판단을."
      - 이준이 병원을 나온다. 세린의 병실 앞을 지나간다. 문이 닫혀 있다. 세린은 쉬고 있다. 이준은 문을 열지 않는다.
      - 핸드폰이 울린다. 모르는 번호.
      - 이준이 받는다.
      - "강이준 씨? 백화 인사팀입니다. 서동현 씨가 오늘 자로 백화에서 해고되었습니다. 해고 사유: 회사 기밀 유출 의혹. 서동현 씨는 해고 통보를 받았으며, 퇴사금은 지급되지 않습니다."
      - 이준의 손이 떨린다. 서동현이 해고됐다. 한도혁의 보복. 협회 조사가 시작되자마자 서동현을 제거한 것이다.
      - 이준: "서동현 씨에게 연락이 됩니까?"
      - 인사팀: "서동현 씨는 현재 연락이 두절되어 있습니다."
      - 이준이 전화를 끊는다. 서동현. 15년간 백화에서 일한 사람. 박세진의 USB를 이준에게 넘긴 사람. 그 대가로 해고. 연락 두절.
      - 이준이 서동현에게 메시지를 보낸다. "위험해. 숨어. 연락되는 대로 알려줘."
      - 답장이 오지 않는다. 이준이 핸드폰을 내려다본다. 화면이 어둡다. 서동현은 연락 두절 상태다. 한도혁이 이미 서동현을 찾고 있을 것이다. 백화 인력을 동원해서. 혹은 협회를 통해서.
      - 이준이 병원 로비 벤치에 앉는다. 주변 환자들, 간호사들, 방문객들. 모두 자기 일에 바쁘다. 아무도 알지 못한다. 한 S급 헌터가 한 一般人의 인생을 파괴하고 있다는 것을. 서동현은 헌터가 아니다. 마나를 가진 사람이 아니다. 그냥 백화에서 15년간 월급을 받으며 살아온 직장인이다. 유일한 죄는 박세진의 유언을 지켰다는 것.
      - 마지막 줄: 이준이 병원 로비에 서 있다. 서동현이 해고됐다. 한도혁의 첫 번째 보복. USB 데이터를 협회에 제출한 것에 대한 응수. 이준은 서동현을 위험에 빠뜨렸다. 박세진의 유산을 활용하겠다고 결심한 순간부터, 서동현의 운명도 함께 엮인 것이다. 이준의 어깨가 무거워진다. 하지만 물러설 수 없다. 이미 돌은 던져졌다.

  - name: political_attack
    instruction: |
      이 부분은 62화의 중반. 분량 2,000자 이상.
      - 오후 5시. 이준이 길드로 돌아온다. 박동현, 김하늘, 이명호가 대기하고 있다.
      - 박동현: "이준 형. 서동현 씨가 해고됐다고 들었어요."
      - 이준: "네. 한도혁이 보복한 거예요."
      - 김하늘이 불안한 눈으로 이준을 본다. "이준 형... 우리도 위험한 거 아냐?"
      - 이준: "현재는 아직 괜찮아요. 한도혁이 직접 움직이지 않고 있어요. 협회를 통해서 압력을 넣고 있어요."
      - 이명호가 끼어든다. "협회를 통해서... 구체적으로?"
      - 이준이 길드원들에게 상황을 설명한다. 은폐 헌터 조사, 정재훈 등급 조작 조사, 이정호의 개입, 그리고 — 한도혁이 백화에서 서동현을 해고시킨 사실.
      - 이명호: "서동현 씨가 위험하면... 우리가 도울 수 있는 거 아냐?"
      - 이준: "서동현 씨는 지금 숨어 있어야 해요. 우리가 움직이면 오히려 위치가 노출될 수 있어요."
      - 이준이 핸드폰을 확인한다. 서동현에게서 답장이 아직 오지 않았다. 3시간째. 이준이 진명 감지를 가동. 서동현의 마나 반응은 감지되지 않는다. 서동현은 B급 마나를 가진 헌터가 아니다. 일반인이다. 진명 감지로는 찾을 수 없다.
      - 윤새벽에게 메시지. "서동현 해고. 한도혁의 보복. 서동현에게 연락 두절."
      - 윤새벽의 답장이 30분 뒤 온다.
      - "서동현... 한도혁이 서동현을 매수자로 지목했어. 'USB 데이터를 강이준에게 넘긴 사람이 서동현이다. 서동현은 백화의 기밀을 유출한 반역자다'라고 협회 이사회에 보고했어."
      - 이준의 손이 떨린다. 매수자. 한도혁은 서동현을 "매수자"로 만들었다. 이준에게 USB를 넘긴 것이 "백화 기밀 유출"이라는 것이다. 하지만 USB 안의 데이터는 백화의 기밀이 아니라 한도혁의 범죄 증거다. 마나 장치 설계도. 증폭 장치 증거. 이것은 "기밀 유출"이 아니라 "범죄 증거 제출"이다.
      - 윤새벽이 이어서 쓴다.
      - "그리고 한도혁이 이사회에 공식 제안을 했어. '강이준은 미등록 S급 후보다. 협회 규정에 따라 S급 연구 시설로 이관하여 정밀 검사를 실시해야 한다.'"
      - S급 연구 시설. 이준이 들어본 적 있다. 협회가 운영하는 특수 시설. S급 후보의 마나를 정밀하게 분석하고, 필요시 격리하는 곳. 그곳에 이관되면 — 이준의 자유가 제한된다. 한도혁이 그곳에 손을 뻗을 수 있다.
      - 이준: "S급 연구 시설 이관은 협회 규정상 어떤 조건에서 가능한가요?"
      - 윤새벽: "C급 헌터의 경우, 강제 이관은 불가능해. 본인 동의가 필요해. 하지만 한도혁이 '미등록 S급 후보'로 주장하면, 이사회 결의로 강제 이관이 가능해져. 그게 한도혁의 목적이야. 이준을 협회 시설에 가두고, 그 안에서 압박하는 거야."
      - 이준이 생각한다. 한도혁의 체스. 1수: 정재훈 공격 → 이준 마나 노출. 2수: 협회를 통한 은폐 헌터 조사. 3수: 서동현 해고 → 증거 제출자 제거. 4수: S급 연구 시설 이관 → 이준 격리.
      - 한도혁은 이준을 협회 시설에 가두려고 한다. 밖에서 싸우는 이준은 위험하지만, 시설 안에 갇힌 이준은 한도혁이 통제할 수 있다.
      - 이준이 윤새벽에게 묻는다. "S급 연구 시설 이관을 막을 수 있나요?"
      - 윤새벽: "한 가지 방법이 있어. 이사회 표결에서 기각시키는 거야. 한도혁 파벌이 이관을 밀어붙이면, 중립파가 막아야 해. 그러려면... 중립파를 설득할 무기가 필요해."
      - 이준: "무기?"
      - 윤새벽: "정재훈의 등급 조작이 확정되면, 한도혁의 신뢰도가 떨어져. 이사회에서 한도혁의 제안이 통과되기 어려워져. 핵심은 정재훈 조사의 속도야. 조사가 빨리 끝나면 한도혁이 막을 수 없어."
      - 이준이 이율곱씬다. 정재훈 조사 속도 vs S급 연구 시설 이관 표결. 어느 쪽이 먼저 결정되느냐에 따라 이준의 운명이 바뀐다. 시간 경쟁이다. 그리고 한도혁은 협회 내부에 뿌리를 박고 있으니, 조사를 지연시키는 것은 한도혁에게 유리하다.
      - 이준이 창밖을 본다. 저녁 노을이 지고 있다. 서울의 하늘이 주황빛으로 물든다. 평화로운 풍경. 하지만 이 평화 아래에서 권력의 싸움이 벌어지고 있다.
      - 마지막 줄: 이준이 길드 창밖을 본다. 서동현의 안부를 모른다. 한도혁이 서동현을 매수자로 지목했다. S급 연구 시설 이관 제안이 이사회에 올라와 있다. 시간은 이준의 편이 아니다. 정재훈 조사가 확정되기 전에 이관이 결정되면, 이준은 갇히게 된다. 속도가 관건이다.

  - name: alliance
    instruction: |
      이 부분은 62화의 끝. 분량 2,000자 이상.
      - 밤 9시. 이준이 윤새벽과 비밀리에 만나기로 했다. 장소는 강남역에서 지하철로 5역 거리의 공원. ch058에서 서동현과 만났던 곳과는 다른 장소. 이번에는 한강 공원 근처. 사람이 적고, 넓어서 마나 감지 범위를 넓힐 수 있다.
      - 이준이 먼저 도착한다. 벤치에 앉아 윤새벽을 기다린다. 진명 감지를 가동. 1.2km 범위. 주변에 A급 이상 반응은 없다. B급 반응 두 개. 일반 헌터들. 한도혁의 감시 인원은 보이지 않는다.
      - 10분 뒤. 윤새벽이 나타난다. 검은 후드. 얼굴이 반쯤 가려져 있다. 윤새벽은 항상 그렇다. 얼굴을 드러내지 않는다. 진명 시스템 v1.3 보유자. 한도혁에게 쫓기는 사람. 들키면 죽는다.
      - 윤새벽이 벤치에 앉는다. 이준과 1m 거리.
      - 윤새벽: "서동현 연락됐어?"
      - 이준: "아니요. 아직 두절이에요."
      - 윤새벽이 침묵한다. 그리고 말한다.
      - "서동현이 위험해. 한도혁이 서동현을 찾고 있어. 매수자로 지목했으니까. 협회를 통해서도 찾고, 백화 인력을 통해서도 찾고 있어."
      - 이준: "서동현을 지킬 방법이 없나요?"
      - 윤새벽: "협회에 서동현 보호를 요청하는 거야. '증거 제출자 보호' 규정이 있어. 하지만 그 규정이 적용되려면 서동현이 협회에 출석해서 증언해야 해. 지금 서동현이 숨어 있으니까..."
      - 이준: "서동현이 협회에 나오면 한도혁이 알아요."
      - 윤새벽: "그래. 딜레마야. 나오면 한도혁의 표적이 되고, 숨으면 보호받지 못해."
      - 이준이 생각한다. 서동현을 지키면서 동시에 한도혁에 대항해야 한다. 두 가지를 동시에.
      - 윤새벽이 화제를 바꾼다.
      - "한도혁의 S급 연구 시설 이관 제안. 이사회 표결은 5일 뒤야. 그때까지 정재훈 조사가 진전되면, 이관이 기각될 가능성이 높아."
      - 이준: "5일. 충분한 시간인가요?"
      - 윤새벽: "모르겠어. 협회 조사 속도는... 박경호가 얼마나 밀어주느냐에 달렸어. 그리고 한도혁이 이정호를 통해서 방해하면 늦어져."
      - 이준: "그러면 우리가 속도를 높여야 해요."
      - 윤새벽: "어떻게?"
      - 이준: "추가 증거를 제출하면 협회 조사가 빨라져요. ch059에서 정재훈과 전투했을 때 마나 해독으로 수집한 실시간 데이터가 있어요. 증폭 장치의 주파수, 작동 패턴, 상쇄 파동에 대한 반응. 이걸 제출하면 정재훈의 부인이 무력화돼요."
      - 윤새벽이 이준을 본다. "전투 데이터를 제출하면 네가 정재훈과 싸웠다는 게 드러나. 미신고 전투 징계."
      - 이준: "알아요. 감수할게요."
      - 윤새벽이 잠시 이준을 본다. 그리고 고개를 끄덕인다.
      - "좋아. 그러면 하나 제안할게."
      - 이준: "제안?"
      - 윤새벽: "우리가 협력 협정을 맺자. 공식적으로. 네가 가진 정보와 내가 가진 정보를 합치자. 네 USB 데이터, 마나 해독 분석, 그리고 내가 2년간 수집한 한도혁의 범죄 증거."
      - 이준이 놀란다. 윤새벽이 2년간 한도혁의 범죄 증거를 수집했다.
      - 윤새벽: "나는 한도혁에게 쫓기면서도 증거를 모았어. 한도혁이 진명 시스템 보유자를 어떻게 죽였는지. 박세진이 어떻게 죽었는지. 강철민이 어떻게 죽었는지. 단편적이지만 증거가 있어."
      - 이준의 심장이 뛴다. 강철민. 아버지. 윤새벽이 아버지의 죽음에 대한 증거를 가지고 있다.
      - 이준: "아버지의 죽음에 대한 증거... 뭔가 있나요?"
      - 윤새벽이 침묵한다. 오래 침묵한다. 그리고 말한다.
      - "한도혁이 마나 장치를 사용했다는 간접 증거가 있어. 직접적인 건 아니야. 하지만 네 USB 데이터와 결합하면... 한도혁이 강철민의 마나 회로를 강제로 개방했다는 주장을 뒷받침할 수 있어."
      - 이준이 주먹을 쥔다. 아버지의 죽음. 5년 전. 한도혁이 아버지를 죽였다. 이것을 증명할 수 있다면 —
      - 이준: "협력 협정. 동의합니다."
      - 윤새벽이 손을 내민다. 이준이 악수한다.
      - 윤새벽: "상호확증파괴. 둘 다 조사받으면 협회가 한쪽만 편들기 어려워. 네가 은폐 헌터고, 정재훈이 등급 조작이야. 나는 한도혁에게 쫓기는 보유자야. 세 명의 사연이 협회에서 교차하면... 한도혁이 막기 어려워져."
      - 이준이 고개를 끄덕인다.
      - 마지막 줄: 이준과 윤새벽이 악수한 손을 놓는다. 강남의 밤. 한강의 불빛이 멀리 보인다. 두 진명 시스템 보유자의 협력. v1.3과 v2.0. 한도혁에 대항하기 위한 연합. 이 연합이 한도혁을 무너뜨릴 수 있을지는 모른다. 하지만 이것이 이준이 가진 최선의 선택이다. 서동현의 안부는 여전히 모른다. 5일 뒤 이사회 표결. 그때까지 — 정재훈 조사를 확정시켜야 한다.
