chapter_n: 63
overall: |
  협회 조사가 정체되고 한도혁 파벌이 이준의 S급 연구 시설 이관을 밀어붙인다.
  김태석과 세린이 퇴원하여 길드 재건을 시작하지만 백화가 길드원 매수를
  계속 시도한다. 이준이 던전에서 경험치를 획득하며 Lv7 진행도 80%에
  도달하고, 한도혁이 새 수단으로 협회에 이준을 미등록 S급 후보로 지목하여
  정식 이의 제기를 한다.

beats:
  - name: rebuilding
    instruction: |
      이 부분은 63화의 시작. 분량 2,000자 이상.
      - ch062로부터 4일 후. 이사회 표결까지 하루 남았다.
      - 아침. 철혈 길드 본부. 김태석이 퇴원했다. 갈비뼈는 아직 완전히 붙지 않았지만, 뼈가 유합 단계에 접어들어 움직임에는 지장이 없다. 단, 전투는 불가. A급 마나를 사용하면 뼈가 다시 갈라질 수 있다.
      - 세린도 퇴원했다. 왼팔 깁스는 풀었다. 골절은 뼈가 붙기 시작했지만, 마나 회로 30% 손상은 아직 회복 중이다. 마나 사용량이 이전의 70%로 제한된다. B급 마나를 70%만 사용 가능. 2주간 전투 불가.
      - 김태석이 길드원들을 소집했다. 1층 회의실. 박동현, 김하늘, 이명호. 그리고 이준.
      - 김태석: "지금 철혈의 상황을 말하겠다. 길드원 4명. 이준, 세린, 동현, 하늘, 명호. 다섯 명이다. 3개월 전에는 열두 명이었는데... 백화의 압박으로 여덟 명이 이탈했다."
      - 김하늘이 고개를 숙인다. 이탈한 길드원 중 두 명은 김하늘과 친했다.
      - 김태석: "하지만 우리는 버텼다. 그리고 앞으로도 버틸 것이다. 지금 백화가 우리를 노리고 있다. 매수, 위협, 협회를 통한 압박. 하지만..."
      - 김태석이 이준을 본다.
      - "이준이 우리를 지켜줬다. 정재훈에게서, 백화의 압박에서. 그리고 앞으로도 지켜줄 것이다."
      - 이준이 김태석을 본다. 길드장의 눈에는 결의가 있다. 15년간 헌터로 살아온 남자의 눈빛. 부러진 갈비뼈에도, 백화의 압박에도 꺾이지 않는 눈.
      - 김태석: "철혈 재건. 첫째, 길드원 모집. D급 이상 헌터를 대상으로. 둘째, 수입원 확보. C급 던전 의뢰를 우선적으로 수주. 셋째, 백화의 매수 차단. 길드원 개인 접촉이 있으면 즉시 보고."
      - 박동현: "길드장님. 모집은... 지금 상황에서 누가 철혈에 들어오겠습니까? 백화가 눈을 부릅뜨고 있는데."
      - 김태석: "그래서 이준이랑 내가 직접 모집한다. 이준의 B급 마나가 알려지면서, 이준을 따라오려는 헌터들이 있을 것이다."
      - 이준이 고개를 끄덕인다. 맞다. 은폐가 풀리면서 이준의 이름이 헌터 커뮤니티에 퍼지고 있다. "C급으로 등록된 강이준이 B급 이상 마나를 사용했다." 이 소문은 헌터들 사이에서 화제다. 일부는 이준을 "은폐한 사기꾼"으로 보지만, 일부는 "은폐할 만한 이유가 있는 헌터"로 본다. 후자를 모으는 것이 목표다.
      - 회의가 끝난 뒤. 이준이 길드를 나온다. 세린이 뒤따라온다.
      - 세린: "이준 씨."
      - 이준이 멈춰 선다.
      - 세린: "서동현 씨... 아직 소식이 없어요?"
      - 이준: "아니요. 4일째예요."
      - 세린이 침묵한다. 그리고 말한다.
      - "서동현 씨가 위험한 건... 제 일부분 때문이에요. 제가 백화에서 나올 때 서동현 씨가 도와줬어요. 그리고 지금..."
      - 이준: "세린 씨. 서동현 씨의 선택이에요. 그가 USB를 저한테 넘긴 건 자신의 의지였어요. 우리가 할 수 있는 건 그를 지키는 거예요. 그리고 그를 지키는 최선의 방법은 — 한도혁을 무너뜨리는 거예요."
      - 세린이 이준을 본다. "한도혁을 무너뜨리는 게... 가능해요?"
      - 이준: "가능한지는 모르겠어요. 하지만 시도할 거예요."
      - 세린이 고개를 끄덕인다. "그러면 저도 도울게. 마나 회로가 70%밖에 안 되지만... 그래도 도울게."
      - 이준이 미소를 짓는다. 세린이 골절과 마나 회로 손상을 안고서도 싸우겠다고 한다. 철혈의 전사다.
      - 오후. 이준이 던전에 들어간다. C급 던전. 혼자. 경험치 획득 목적. Lv7 진행도를 올려야 한다.
      - 던전 내부. 이준이 마나 해독을 가동하면서 진행한다. 몬스터의 마나 패턴을 분석하면서 약점을 찾아 신속하게 처치. 효율적인 사냥. C급 던전은 이준에게 더 이상 위협이 아니다.
      - [경험치 획득 +120 / Lv6 경험치 85% / Lv7 진행도: 75% → 80%]
      - 80%. 20% 더. Lv7이 가까워진다. 마나 해독 고급화. 진명 서명 범위 확대. 새로운 능력. 그것이 Lv7에서 기다리고 있다.
      - 마지막 줄: 이준이 던전을 빠져나온다. 오후 4시. 경험치를 채우고, 길드 재건을 시작하고, 서동현의 소식을 기다린다. 내일은 이사회 표결이다. S급 연구 시설 이관이 결정될지, 기각될지. 그 결과에 따라 이준의 운명이 바뀐다. 하지만 이준은 준비하고 있다. 윤새벽과의 협력. USB 데이터. 마나 해독 분석. 상호확증파괴의 두 번째 단계.

  - name: pressure_campaign
    instruction: |
      이 부분은 63화의 중반. 분량 2,000자 이상.
      - 오후 6시. 이준이 던전에서 돌아오자 박동현이 달려온다.
      - "이준 형! 박동현... 아니, 박동현이 아니라. 누가 왔는데..."
      - 박동현이 숨을 고른다.
      - "백화 사람이 왔어요. 박동현한테 접근했어요."
      - 이준: "박동현한테? 구체적으로?"
      - 박동현이 지친 표정으로 말한다. "오후 3시쯤이에요. 길드 밖에서 점심을 먹으러 나갔는데, 한 남자가 다가왔어요. 백화 산하 B급 길드 소속이라고 했어요."
      - 박동현이 이어서 설명한다.
      - "철혈에 있는 건 낭비라고 했어요. 백화 산하 B급 길드로 이적하면 월급 3배, 던전 우선 배정, 보험 완전 보장이라고 했어요. 그리고..."
      - 박동현이 잠시 멈춘다.
      - "...이준 형이 곧 협회에 잡힌다고 했어요. S급 연구 시설에 이관된다고. 철혈은 끝이라고."
      - 이준의 눈이 좁아진다. 백화가 길드원에게 직접 접근했다. 그것도 이준의 체포 소문을 퍼뜨리면서.
      - 이준: "박동현아. 어떻게 대답했어?"
      - 박동현이 고개를 든다. 단호한 눈빛.
      - "거절했어요. '이준 형이 잡히면 나도 철혈에 남는다'고 했어요."
      - 이준이 박동현을 본다. D급 헌터. 23살. 철혈에 들어온 지 1년. 이준과 함께 던전을 돌았고, 정재훈의 압박을 함께 견뎠다. 그리고 지금 — 백화의 회유를 거절한다.
      - 이준: "고마워, 동현아."
      - 박동현: "형이 고맙긴요. 형이 없었으면 나 진작에 백화에 들어갔을 거예요."
      - 이준이 김태석에게 상황을 보고. 김태석의 반응.
      - "백화가 길드원에게 직접 접근... 이제 공개적으로 나오는군. 한도혁이 자신감이 있다는 뜻이야."
      - 이준: "내일 이사회 표결이에요. 한도혁이 이관을 밀어붙이고 있어요."
      - 김태석: "표결 결과가 어떻게 되든, 우리는 대비해야 해. 이관이 기각되면 한도혁이 다른 수를 쓸 거고, 통과되면..."
      - 김태석이 말을 잇지 못한다. 이준이 협회 시설에 이관되면, 철혈은 이준 없이 버텨야 한다.
      - 저녁 8시. 이준이 윤새벽에게 연락.
      - "내일 이사회 표결. 정재훈 조사 진전 상황은?"
      - 윤새벽: "느려. 박경호가 열심히 하고 있는데, 한도혁 쪽에서 방해가 심해. 이정호가 심사과에 압력을 넣고 있어. '정재훈 조사는 은폐 헌터 조사와 무관하다. 병행할 필요가 없다'고 주장하고 있어."
      - 이준: "데이터 검증은?"
      - 윤새벽: "유수진 차장이 검증 중이야. 하지만 시간이 걸려. 정재훈의 등급 측정 원본 데이터와 비교해야 하거든. 협회 서버에서 꺼내오는 데 한도혁 쪽이 지연시키고 있어."
      - 이준이 이를 악문다. 한도혁이 모든 경로를 막고 있다. 협회 내부에서, 이사회에서, 심사과에서. 한도혁의 뿌리는 깊다. 5년간 협회에 사람을 심어왔을 것이다. 이사회 9명 중 4명이 한도혁 파벌이라는 것이 그 증거다.
      - 이준이 한숨을 쉰다. 협회가 공정하지 않다는 것을 알면서도, 협회 밖에서 싸우는 것은 더 위험하다. 한도혁은 협회 바깥에서는 S급의 힘으로 압박할 수 있다. 협회 안에서만이 법과 규정이 이준을 보호한다.
      - 윤새벽: "그리고 한도혁이 새 수단을 준비하고 있어."
      - 이준: "새 수단?"
      - 윤새벽: "협회 정식 이의 제기. '강이준은 미등록 S급 후보. 협회 규정 제52조에 따라 S급 연구 시설에서 등급 재측정이 필요하다.' 이의 제기가 오늘 협회에 접수됐어."
      - 정식 이의 제기. 이것은 이사회 표결과는 별개다. 이의 제기가 접수되면, 협회는 법적으로 대응해야 한다.
      - 이준: "이의 제기를 기각할 수 있나요?"
      - 윤새벽: "이의 제기 자체를 기각하려면 이사회 표결이 필요해. 내일 표결에서 이관이 기각되면 이의 제기도 자동으로 기각돼. 하지만 이관이 통과되면..."
      - 이준: "이관이 통과되면 저는 시설에 가야 해요."
      - 윤새벽: "그래. 그러니까 내일 표결이 전부야."
      - 마지막 줄: 이준이 밤하늘을 올려다본다. 내일. 이사회 표결. 한도혁이 S급 연구 시설 이관을 밀어붙이고 있다. 정재훈 조사는 느리고, 한도혁의 방해는 빠르다. 시간이 이준의 편이 아니다. 하지만 이준에게는 윤새벽이 있다. USB 데이터가 있다. 마나 해독이 있다. 그리고 — 내일 표결에서 중립파의 표를 얻기 위한 마지막 카드가 있다.

  - name: approaching_threshold
    instruction: |
      이 부분은 63화의 끝. 분량 2,000자 이상.
      - 밤 11시. 이준이 길드 옥상에 선다. 내일 표결 전 마지막 밤.
      - 진명 감지를 가동. 1.2km 범위. 백화 본사에서 S급 반응. 한도혁. 그리고 백화 본사 근처에서 A급 반응 두 개. 정재훈과 다른 백화 소속 A급. 백화가 전투 태세다.
      - 이준이 시스템 메시지를 확인한다.
      - [Lv7 진행도: 80% / 진화 조건: 던전 경험치 누적 + 시스템 이벤트 완료 / 진화 내용: 마나 해독 고급화 + 진명 서명 범위 확대 + 새 능력 "마나 차단" 해금 (상세 불명)]
      - 마나 차단. 아직 상세가 불명인 새 능력. 이름만으로 유추하면 — 대상의 마나를 차단하는 능력. 이것이 해금되면, 정재훈의 증폭 장치를 더 쉽게 무력화할 수 있을지도 모른다. 아니면 한도혁의 마나를 일시적으로 차단할 수 있을지도.
      - 하지만 Lv7은 아직 20% 부족하다. 내일 표결이 끝나면, 이준은 던전에 다시 들어가야 한다. Lv7을 달성해야 한다.
      - 윤새벽에게서 마지막 메시지가 온다.
      - "내일 표결. 중립파 이사 3명 중 2명만 우리 편이면 이관 기각 가능해. 한도혁 파벌 이사 4명. 중립파 3명. 반대파 2명. 총 9명 중 5명이 찬성하면 통과. 우리가 중립파 2명을 가져오면 4대5로 기각."
      - 이준: "중립파를 설득할 수 있나요?"
      - 윤새벽: "하나는 이미 설득했어. 유수진 차장의 보고에 따라 움직이는 이사야. 유수진이 정재훈 데이터 검증 결과를 내일 오전에 보고하면, 그 이사가 우리 편에 설 거야."
      - 이준: "나머지 하나는?"
      - 윤새벽: "그게 문제야. 나머지 중립파 이사는 한도혁과 거리를 두면서도, 명확하게 반대하지는 않아. '증거가 더 필요하다'는 입장이야."
      - 이준이 생각한다. 증거. 더 많은 증거. 유수진의 검증 결과가 내일 오전에 나온다. 그것이 확정적이면 중립파 하나를 가져올 수 있다. 하지만 나머지 하나는?
      - 이준: "제가 직접 증거를 제출할 수 있나요? 내일 표결 전에?"
      - 윤새벽: "이사회에 직접 출석해서 발언권을 얻으면 가능해. 하지만 은폐 헌터 조사 대상자가 이사회에 출석하는 건 흔한 일이 아니야. 박경호의 추천이 필요해."
      - 이준: "박경호 과장님한테 부탁드리겠습니다."
      - 윤새벽: "박경호가 동의하면, 네가 이사회에서 발언할 수 있어. 그때 ch059 전투 데이터를 제출하면 돼. 정재훈의 증폭 장치 실시간 분석. 이건 결정적 증거야. 정재훈이 부인해도, 실시간 전투 데이터까지 조작은 불가능하거든."
      - 이준이 고개를 끄덕인다. 내일 아침. 박경호에게 연락. 이사회 출석 요청. 그리고 표결 전에 정재훈 증거를 제출.
      - 윤새벽이 마지막으로 덧붙인다. "그리고 이준. 내일 이사회에서 한도혁 파벌이 널 공격할 거야. 모든 수를 동원해서. 준비해. 네가 혼자가 아니라는 걸 보여줘야 해."
      - 이준이 옥상에서 내려간다. 방에 들어가 책상 위에 앉는다. USB가 서랍에 있다. 그리고 옆에 태블릿. ch059 전투 데이터 변환본.
      - 이준이 눈을 감는다. 아버지. 강철민. 5년 전 죽었다. 한도혁이 죽였을 가능성이 높다. 윤새벽이 간접 증거를 가지고 있다. USB에 설계도가 있다. 하지만 직접적인 증거는 없다.
      - 아직은.
      - 이준이 생각한다. 아버지는 어떤 사람이었나. F급 헌터. 짐꾼. 돈도 명예도 없이 던전에서 물건을 날랐던 사람. 하지만 이준에게는 세상에서 가장 위대한 사람이었다. 아버지의 죽음. 박세진의 죽음. 두 사람이 공통점이 있다. 둘 다 한도혁과 관련이 있었다. 둘 다 진명 시스템과 관련이 있었다. 둘 다 — 죽었다.
      - 시스템 메시지가 떠오른다.
      - [퀘스트 진행 중 — 은폐의 대가 / 단계 2: 이사회 표결 대기 / 정재훈 조사 병행 진행 중 / S급 연구 시설 이관 결정: 내일 / 보상: 표결 결과에 따라 변동]
      - 마지막 줄: 이준이 침대에 눕는다. 내일. 모든 것이 내일 결정된다. 이사회 표결. S급 연구 시설 이관. 정재훈 조사. 그리고 이준의 운명. 한도혁은 이준을 가두려 한다. 이준은 싸운다. 협회 안에서, 협회 밖에서. 윤새벽과 함께. 철혈과 함께. 그리고 — 박세진의 유산과 함께. 내일 아침이 오면, 이준은 협회 본부로 간다. 이번에는 심사과가 아니라 이사회로.
