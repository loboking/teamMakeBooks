chapter_n: 64
overall: |
  한도혁이 협회를 통해 이준을 S급 연구 시설로 이관하려 하지만 이준이
  "C급 헌터의 동의 없이 강제 이관은 불가하다"며 거부한다. 협회 중립파가
  이준 편에 서기 시작하고, 유수진의 데이터 검증으로 정재훈의 증폭 장치가
  발견되어 정재훈의 A급 등급이 정지된다. 백화에 충격이 가해지고, 이준이
  밤에 던전에 돌입하여 Lv7을 달성하며 마나 해독 고급화와 새 능력
  "마나 차단"을 해금받는다.

beats:
  - name: the_vote
    instruction: |
      이 부분은 64화의 시작. 분량 2,000자 이상.
      - 오전 10시. 협회 본부 15층. 이사회 회의실. 이준은 박경호의 추천으로 발언권을 얻었다. 은폐 헌터 조사 대상자가 이사회에 출석하는 것은 이례적이지만, 박경호가 "피조사인의 직접 진술이 공정한 결정에 필요하다"고 주장했다.
      - 이사회 회의실은 넓다. 9개의 의자가 반원형으로 배치되어 있다. 각 의자 앞에는 이사 이름표가 있다.
      - 한도혁 파벌 4석: 이정호(회장 대리), 권오상, 정민수, 강수진.
      - 중립파 3석: 백영훈, 한미라, 서정호.
      - 반대파 2석: 문태우, 임채원.
      - 9명의 이사. 5명이 찬성하면 S급 연구 시설 이관이 통과된다.
      - 이정호가 먼저 입을 연다. 한도혁의 대리인. 이번 표결의 주도자.
      - "이사님들. 안건은 한 가지입니다. 강이준 씨의 S급 연구 시설 이관 여부입니다. 강이준 씨는 협회 등급 C급으로 등록되어 있으나, 최근 B급 이상의 마나를 노출했습니다. 이는 미등록 S급 후보의 가능성을 시사합니다. 협회 규정 제52조에 따라, S급 후보는 연구 시설에서 정밀 검사를 받아야 합니다."
      - 이정호가 이준을 본다. 차가운 눈빛.
      - "강이준 씨. 이관에 동의하십니까?"
      - 이준이 일어선다. 회의실 전체가 이준을 본다. B급 상위의 마나가 이준에게서 자연스럽게 퍼져나간다. 회의실의 공기가 무거워진다. 9명의 이사 모두 이준의 마나를 느낀다. C급 헌터가 B급 이상의 마나를 풍기는 상황. 이것이 이관의 근거다.
      - 이준이 입을 연다. 차분한 목소리.
      - "동의하지 않습니다."
      - 이정호: "이유를 말씀해 주시겠습니까?"
      - 이준: "협회 규정 제52조 3항을 읽어보겠습니다. 'S급 후보의 연구 시설 이관은 본인 동의를 원칙으로 한다. 단, 본인이 위험 등급 판정을 받은 경우에 한하여 이사회 3분의 2 이상의 찬성으로 강제 이관이 가능하다.' 저는 위험 등급 판정을 받은 적이 없습니다. 따라서 강제 이관은 불가합니다."
      - 이정호의 눈이 좁아진다. 제52조 3항. 이정호가 간과한 조항이다. 이준이 협회 규정을 공부했다는 것을 보여주는 대목이다.
      - 권오상(한도혁 파벌)이 끼어든다. "강이준 씨. 위험 등급 판정은 이사회에서 결정할 수 있습니다. 지금 B급 이상의 마나를 노출한 것 자체가 위험 등급의 근거가 됩니다."
      - 이준: "위험 등급 판정의 기준은 '타인에 대한 위해 가능성'입니다. 저는 누구에게도 위해를 가한 적이 없습니다. 오히려 백화 소속 정재훈이 철혈 길드를 공격했을 때, 저는 길드원을 보호하기 위해 방어적으로 마나를 사용했습니다."
      - 중립파 백영훈이 고개를 끄덕인다. 이준의 말이 합리적이다.
      - 이준이 이어서 말한다.
      - "그리고 한 가지 더. 저는 은폐 헌터로 조사받고 있습니다. 조사가 진행 중인 동안, 저를 시설에 이관하는 것은 조사의 공정성에 영향을 미칩니다. 시설에서의 검사 결과가 조사에 편향을 줄 수 있습니다."
      - 반대파 문태우가 입을 연다. "맞는 말입니다. 조사 대상자를 격리하는 것은 적절하지 않습니다."
      - 이정호가 문태우를 본다. 불만스러운 표정.
      - 표결이 시작된다. 이정호가 찬성을 요청한다.
      - 한도혁 파벌 4명: 전원 찬성. 이정호, 권오상, 정민수, 강수진.
      - 반대파 2명: 전원 반대. 문태우, 임채원.
      - 중립파 3명의 표가 남았다.
      - 서정호(중립파): "저는 찬성에 반대합니다. 강이준 씨의 주장이 타당합니다. 본인 동의 없는 강제 이관은 규정에 위배됩니다."
      - 4대3. 한도혁 파벌이 아직 리드. 중립파 두 명이 남았다.
      - 한미라(중립파): "저는... 유보하겠습니다. 정재훈 조사 결과가 나온 후에 결정하겠습니다."
      - 유보. 한미라가 결정을 미뤘다.
      - 마지막으로 백영훈(중립파). 회의실이 조용해진다. 백영훈이 이준을 본다. 그리고 이정호를 본다.
      - 백영훈: "저도 반대에 동의합니다. 강이준 씨의 규정적 주장이 타당합니다. 그리고..."
      - 백영훈이 유수진 차장을 본다. 유수진이 회의실 뒤쪽에 서 있다. 서류를 들고.
      - "유수진 차장의 보고를 듣기 전에 표결을 진행하는 것은 성급합니다."
      - 4대4. 동수. 찬성이 과반에 미치지 못한다.
      - 이정호의 표정이 굳는다. 동수면 이관은 기각된다.
      - 이정호: "백영훈 이사님. 유수진 차장의 보고는 정재훈 조사와 관련된 것이지, 강이준 씨의 이관과는 무관합니다."
      - 백영훈: "무관하지 않습니다. 강이준 씨가 은폐 헌터 조사를 받는 이유가 정재훈의 등급 조작 의혹과 연관되어 있습니다. 두 사안은 동전의 양면입니다."
      - 이정호가 말을 잇지 못한다.
      - 의장이 선언한다. "표결 결과: 찬성 4, 반대 4, 유보 1. 과반수 미달. S급 연구 시설 이관 기각."
      - 이정호가 자리에서 일어나 회의실을 나간다. 핸드폰을 귀에 대고. 한도혁에게 보고할 것이다.
      - 마지막 줄: 이준이 회의실에 남는다. 4대4. 유보 1. 기각. 이관은 막았다. 하지만 한도혁이 다음 수를 준비할 것이다. 이번 표결에서 한도혁 파벌이 전원 찬성한 것을 보면, 한도혁은 이 이관을 필수적으로 밀어붙이려 했다. 실패하면 — 다른 방법을 찾을 것이다. 이준의 어깨에서 힘이 조금 빠진다. 하지만 아직 끝나지 않았다. 유수진의 보고. 정재훈 조사. 그것이 다음 전투다.

  - name: evidence_lands
    instruction: |
      이 부분은 64화의 중반. 분량 2,000자 이상.
      - 이사회 표결 직후. 유수진 차장이 회의실에서 보고를 시작한다. 표결이 끝났지만, 유수진의 보고는 예정되어 있었다.
      - 유수진: "이사님들. 심사과에서 수행한 정재훈 등급 조작 조사에 대한 중간 보고입니다."
      - 유수진이 태블릿을 켠다. 화면에 데이터가 뜬다.
      - "첫째, 강이준 씨가 제출한 USB 데이터 검증 결과입니다. 데이터는 협회 표준 포맷으로 변환되었으며, 데이터 내 마나 패턴 분석 결과는 협회가 보유한 정재훈의 등급 측정 원본 데이터와 비교 검증되었습니다."
      - 화면에 두 데이터가 나란히 표시된다. USB 데이터의 정재훈 마나 패턴 vs 협회 원본 측정 데이터.
      - 유수진: "비교 결과, 두 데이터 사이에 중요한 차이가 발견되었습니다. 협회 원본 측정에서는 정재훈의 마나가 A급 상위로 기록되어 있습니다. 하지만 USB 데이터에 담긴 마나 회로 구조 분석에 따르면, 정재훈의 마나 회로 우측 전완부에 인위적 장치가 이식되어 있으며, 이 장치가 정재훈의 전체 마나의 68%를 생성하고 있습니다."
      - 회의실이 술렁인다. 이사들 사이에서 속삭임이 퍼진다.
      - 이정호가 돌아와 있다. 뒤쪽에 서서 유수진의 보고를 듣고 있다. 표정이 굳어 있다.
      - 유수진이 이어서 말한다.
      - "둘째, 강이준 씨가 추가로 제출한 전투 데이터입니다. 2025년 10월 29일, 강이준 씨와 정재훈 사이에 전투가 발생했습니다. 이 전투에서 강이준 씨는 마나 해독 능력을 사용하여 정재훈의 증폭 장치 주파수를 실시간으로 분석하고, 상쇄 파동을 통해 장치를 일시적으로 정지시켰습니다."
      - 화면에 ch059 전투 데이터가 표시된다. 정재훈의 장치 주파수 7.42 MHz. 이준이 보낸 상쇄 파동. 장치 정지 후 정재훈의 마나가 A급 상위에서 B급 하위로 급감한 기록.
      - 유수진: "이 데이터에 따르면, 정재훈의 자연 마나는 B급 하위 수준이며, A급 등급은 전적으로 이식된 증폭 장치에 의한 것입니다. 이것은 협회 등급 규정 제31조 '인위적 마나 증폭 금지'에 명백히 위배됩니다."
      - 회의실이 정적에 휩싸인다. 이제 명백하다. 정재훈은 등급 조작을 했다. 증거는 확실하다.
      - 백영훈이 입을 연다. "유수진 차장. 이 데이터의 신빙성은 확실한가요?"
      - 유수진: "네. 두 가지 데이터가 교차 검증되었습니다. USB의 정적 분석 데이터와 전투의 실시간 분석 데이터가 동일한 결론을 가리키고 있습니다. 정재훈의 우측 전완부에 이식된 장치. 마나 의존도 68%. 자연 마나 B급 하위. 이 모든 것이 일관됩니다."
      - 한미라(중립파, 유보)가 고개를 숙인다. 표결에서 유보했던 한미라. 만약 이 보고를 먼저 들었다면, 반대에 표를 던졌을 것이다.
      - 의장이 선언한다. "정재훈에 대한 등급 조작 조사를 본 조사로 승격합니다. 정재훈의 A급 등급을 즉시 정지합니다. 정재훈을 소환하여 정밀 검사를 실시합니다."
      - 정재훈 A급 등급 정지. 이것은 백화에 엄청난 타격이다. 백화의 핵심 전투력 중 하나가 A급에서 B급으로 떨어지는 것이다.
      - 이정호가 뒤쪽에서 핸드폰을 든다. 한도혁에게 보고. 이번에는 표정이 완전히 무너져 있다.
      - 이준이 회의실을 나온다. 복도에서 박경호와 마주친다.
      - 박경호: "잘하셨습니다, 강이준 씨."
      - 이준: "감사합니다, 과장님."
      - 박경호가 낮은 목소리로 말한다. "정재훈 조사는 이제 속도가 붙을 겁니다. A급 정지가 되었으니, 협회가 정식으로 움직일 수 있습니다. 하지만..."
      - 박경호가 주변을 확인한다.
      - "한도혁이 가만히 있지 않을 겁니다. 이번 결과에 대해 이의를 제기할 수 있습니다. 그리고 이정호를 통해서 심사과에 더 큰 압력을 넣을 수도 있어요."
      - 이준: "알겠습니다."
      - 이준이 협회 본부를 나온다. 밖의 공기가 차갑다. 하지만 이번에는 다르다. 이번에는 승리의 공기가 섞여 있다.
      - 마지막 줄: 정재훈 A급 등급 정지. 백화에 충격이 전해진다. 한도혁이 이사회에서 패배했다. 하지만 한도혁은 패배를 받아들이는 사람이 아니다. 이번 패배는 오히려 한도혁을 더 위험하게 만들 것이다. 이준은 안다. 진짜 싸움은 이제부터라는 것을. 한도혁이 직접 나올 것이다. 협회를 통하지 않고. S급의 힘으로.

  - name: level_seven
    instruction: |
      이 부분은 64화의 끝. 분량 2,000자 이상.
      - 밤 11시. 이준이 길드에서 나온다. 세린, 김태석, 박동현, 김하늘, 이명호는 모두 잠들었다. 이준만 깨어 있다.
      - 이준이 던전으로 향한다. B급 던전. 혼자. 목적은 하나. Lv7 달성.
      - 정재훈의 A급 정지. 이사회 표결 기각. 오늘은 승리였다. 하지만 이준은 안다. 한도혁이 다음 수를 준비하고 있다. 더 강한 수. 더 위험한 수. 이준이 그것에 대응하려면 — 더 강해져야 한다.
      - Lv7. 마나 해독 고급화. 진명 서명 범위 확대. 새 능력 "마나 차단". 그것이 이준의 다음 단계다.
      - B급 던전 입구. 이준이 마나를 가동. B급 상위. 정재훈과 싸운 뒤로 마나 제어가 더 정밀해졌다. B급 상위의 마나를 안정적으로 유지할 수 있다.
      - 던전 내부. 깊은 곳까지 진입. B급 던전의 중층부. 몬스터의 등급이 올라간다. B급 하위 몬스터들이 무리 지어 나타난다.
      - 이준이 마나 해독을 가동하면서 싸운다. 몬스터의 마나 패턴을 분석. 약점을 파악. 한 번에 한 놈씩. 효율적이고 빠르게.
      - [경험치 획득 +200 / Lv7 진행도: 85% → 90%]
      - [경험치 획득 +150 / Lv7 진행도: 90% → 93%]
      - 깊은 층으로 진입. B급 중위 몬스터. 이번에는 좀 더 강하다. 이준이 마나를 최대한 끌어올려 싸운다. B급 상위 한계. 거의 A급 경계.
      - [경험치 획득 +300 / Lv7 진행도: 93% → 97%]
      - 97%. 거의 다 왔다. 3%만 더.
      - 던전의 가장 깊은 곳. 보스 방 앞. B급 상위 몬스터. 이준이 마나를 끌어올린다. 마나 해독으로 보스의 패턴을 분석.
