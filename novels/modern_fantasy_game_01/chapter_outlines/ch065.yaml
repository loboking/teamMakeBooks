chapter_n: 65
overall: |
  정재훈의 A급 등급 정지 이후 한도혁이 격노하고 백화 내부에 균열이
  생기기 시작한다. 한도혁이 협회 이사회 긴급 소집을 요청하여 이준의
  구금을 주장하지만 표결에서 기각되고 대신 정식 등급 재측정이 결정된다.
  이준이 새 능력 "마나 차단"을 테스트하고, 한도혁이 최후통첩을 보내온다.
  Lv7 달성 후 이준의 시야가 변하며 진명 감지 2km, 마나 해독이 S급
  데이터를 읽을 수 있게 된다.

beats:
  - name: fracture_within
    instruction: |
      이 부분은 65화의 시작. 분량 2,000자 이상.
      - ch064의 다음 날. 오전 8시. 정재훈 A급 등급 정지 소식이 헌터 커뮤니티에 퍼졌다.
      - "백화 정재훈 A급 정지. 등급 조작 적발."
      - "인위적 마나 증폭 장치 이식. 실제 등급 B급 하위."
      - 헌터 커뮤니티가 들끓는다. A급 헌터가 등급 조작을 했다. 백화가 관여했다. 이것은 대한민국 헌터 사회에서 10년간 최대 스캔들이다.
      - 이준이 아침에 핸드폰을 켜자 알림이 수십 개 쏟아졌다. 헌터 커뮤니티 게시글. 언론 보도 요청. 그리고 — 백화 내부에서의 반응.
      - 윤새벽에게서 메시지.
      - "백화 내부에 균열이 생겼어. 정재훈 A급 정지 이후, 백화 산하 길드 헌터들이 동요하고 있어. '우리도 장치를 이식받은 건가?' '백화가 우리 마나를 조작한 건가?' 불안이 퍼지고 있어."
      - 이준: "한도혁의 반응은?"
      - 윤새벽: "격노했어. 직접 정재훈을 불러서... 이야기를 들었어. 정재훈이 A급 정지 이후 한도혁에게 '장치를 빼달라'고 요청했대. 장치를 빼면 자연 마나로 돌아가는데, 마나 회로가 장치 주위로 재구성되어 있어서 장치를 빼면 마나 회로가 붕괴해. 정재훈은 평생 C급 이하로 떨어져."
      - 이준의 손이 떨린다. 정재훈이 한도혁에게 "장치를 빼달라"고 했다. 한도혁이 장치를 이식한 것은 정재훈의 동의가 있었을 것이다. 보상과 약속을 받고. A급의 힘과 백화의 후원을 받기 위해. 하지만 그 대가가 — 영원한 장치 의존이었다.
      - 윤새벽이 이어서 쓴다.
      - "한도혁이 정재훈에게 말했대. '네가 선택한 거다. 장치를 원했고, A급을 원했다. 대가를 치러라.' 그리고 정재훈을 방에 가뒀어."
      - 정재훈이 가택 연금. 한도혁이 부하를 처벌했다. 정재훈은 이제 한도혁의 수족도 아니다. 등급 조작이 발각된 실패작이다.
      - 오전 10시. 김태석이 이준에게 전화.
      - "이준아. 좋은 소식이야."
      - 이준: "뭔데요?"
      - 김태석: "백화 산하 B급 길드에서 한 명이 이탈했어. 철혈에 들어오고 싶다고 했어."
      - 이준: "이탈? 정재훈 사건 이후?"
      - 김태석: "그래. 정재훈 A급 정지 이후, 백화 산하 헌터들 사이에 불안이 퍼지고 있어. '나도 장치를 이식받은 건가?' '백화가 나도 조작한 건가?' 이런 불안이야. 그래서 일부가 백화를 떠나려 하고 있어."
      - 이준: "그 사람 이름은?"
      - 김태석: "이지수. B급. 28살. 백화 산하 '호랑이' 길드 소속이었어. 3년 전 백화에 들어갔는데, 등급이 D급에서 B급으로 급상승했대."
      - D급에서 B급. 3년 만에. 자연적인 성장으로는 불가능한 속도. 이지수에게도 증폭 장치가 이식되어 있을 가능성이 높다.
      - 이준: "길드장님. 이지수 씨를 만나보고 싶어요."
      - 김태석: "그래. 오늘 오후에 오기로 했어."
      - 오후 2시. 이지수가 철혈 길드에 온다. 28살. 남성. 키 175cm. 마른 체형. 긴장한 표정.
      - 이준이 이지수를 맞이한다. 마나 해독을 가동. 고급화된 마나 해독. 이지수의 마나 구조가 3차원으로 보인다.
      - [이지수 마나 구조 분석 / 등급: B급 / 마나 총량: B급 중위 / 특이점: 좌측 흉부에 인위적 장치 이식. 장치 의존도: 45%. 자연 마나: C급 상위.]
      - 역시. 이지수에게도 장치가 이식되어 있다. 의존도 45%. 정재훈의 68%보다는 낮지만, 장치를 빼면 C급 상위로 떨어진다.
      - 이준이 이지수를 본다. 28살. D급이었다. B급이 되고 싶었다. 한도혁이 제안했다. 장치를 이식하면 B급이 된다고. 이지수는 동의했다. 3년간 B급으로 살았다. 하지만 그것은 빌린 힘이었다.
      - 이지수: "강이준 씨. 저... 장치가 이식되어 있어요. 3년 전에. 백화에서. A급도 아니고 B급이에요. 정재훈처럼 큰 건 아니지만... 저도 조작당한 거예요."
      - 이지수의 목소리가 떨린다.
      - "저는... D급이었어요. D급으로 5년을 헌터 생활 했어요. 한도혁 회장님이 '장치를 이식하면 B급이 된다'고 했어요. 저는... B급이 되고 싶었어요. 돈도, 명예도, 존경도. 다 B급이 되면 생긴다고 생각했어요."
      - 이준이 이지수의 어깨를 잡는다.
      - 이지수: "3년간 B급으로 살았어요. 하지만... 늘 불안했어요. 이 힘이 내 게 아닌 것 같아서. 장치가 꺼지면 끝날 것 같아서. 그리고 정재훈 사건이 터지고... 알았어요. 저도 조작당한 거라고."
      - 이준: "이지수 씨. 철혈에 오신 것을 환영합니다."
      - 이지수가 고개를 숙인다. "감사합니다."
      - 이지수의 합류. 철혈에 B급 헌터 한 명이 추가되었다. 비록 장치 의존이지만, 전투력은 B급이다.
      - 마지막 줄: 백화에 균열이 생겼다. 정재훈의 A급 정지. 산하 헌터들의 이탈. 한도혁의 제국이 흔들리고 있다. 하지만 흔들리는 제국은 더 위험하다. 무너지기 전에, 한도혁은 무엇이든 할 것이다. 적을 파괴하기 위해. 그리고 한도혁이 가장 파괴하고 싶은 적은 — 강이준이다.

  - name: emergency_session
    instruction: |
      이 부분은 65화의 중반. 분량 2,000자 이상.
      - 오후 4시. 이준에게 알 수 없는 번호로 전화가 온다.
      - "강이준 씨? 협회 사무총장실입니다. 한도혁 회장이 이사회 긴급 소집을 요청했습니다. 긴급 안건: '강이준은 위험한 미등록 보유자. 즉시 구금이 필요하다.' 이사회 긴급 회의가 내일 오전 10시에 열립니다. 참석이 가능하십니까?"
      - 구금. 이번에는 이관이 아니라 구금이다. 한도혁이 수위를 올렸다.
      - 이준: "참석하겠습니다."
      - 이준이 윤새벽에게 연락.
      - "한도혁이 이사회 긴급 소집. 안건: 제 구금. 내일 오전."
      - 윤새벽의 답장이 빠르게 온다.
      - "구금... 한도혁이 진짜 미쳤어. 정재훈 사건 이후에 구금을 요청하면, 이사회에서 '보복'으로 해석할 수 있어. 하지만..."
      - 윤새벽이 이어서 쓴다.
      - "한도혁이 새 카드를 가지고 있을 수 있어. 구금을 요청할 만큼의 근거가 있어야 이사회가 긴급 회의를 열어주거든. 근거가 뭘까?"
      - 이준이 생각한다. 한도혁이 구금을 요청하는 근거. "미등록 S급 후보"는 이미 사용했다. 이번에는 더 강력한 근거가 필요하다. 무엇이 있을까.
      - 이준이 진명 감지를 가동. 2km 범위. 고급화된 감지. 주변의 모든 마나 반응이 선명하게 보인다.
      - 그리고 — 이준이 느낀다. 800m 거리. A급 반응. 하지만 이 A급은 정재훈이 아니다. 패턴이 다르다. 그리고 마나에 특이점이 있다. 한도혁의 마나 패턴과 미세하게 유사한 — 이중 회로의 흔적.
      - 이준이 식은땀을 흘린다. 한도혁이 새 부하를 보냈다. 이중 회로의 흔적이 있는 A급. 이것은 한도혁이 시스템 설계자에게서 직접 마나를 받은 부하일 가능성이 높다.
      - 이준이 윤새벽에게 메시지. "800m 거리에서 A급 반응. 한도혁의 마나 패턴과 유사한 이중 회로 흔적. 한도혁의 새 부하일 가능성."
      - 윤새벽: "이중 회로... 한도혁이 직접 마나를 이식한 부하야. 정재훈보다 위험해. 정재훈은 장치를 이식받은 거지만, 이건 한도혁 자신의 마나를 일부 이식한 거야. 훨씬 안정적이고, 훨씬 강해."
      - 이준: "이 사람이 구금 요청의 근거인가요?"
      - 윤새벽: "아니. 근거는 다른 거야. 한도혁이 근거를 가지고 있어. 뭔지 모르겠지만... 조심해."
      - 다음 날. 오전 10시. 협회 본부 이사회 긴급 회의.
      - 이준이 출석. 이번에는 박경호가 동행한다. 유수진도 뒤에 있다.
      - 이정호가 안건을 발표한다.
      - "이사님들. 긴급 안건입니다. 한도혁 회장이 강이준 씨에 대한 구금을 요청했습니다. 근거는 다음과 같습니다."
      - 이정호가 서류를 펼친다.
      - "첫째, 강이준 씨는 마나 해독 능력을 보유하고 있습니다. 이 능력은 타인의 마나 패턴을 분석하고, 해독하고, 간섭할 수 있는 능력입니다. 이것은 협회 분류상 '특수 능력형 S급 후보'에 해당합니다."
      - 이준의 눈이 좁아진다. 마나 해독. 한도혁은 이준의 능력을 알고 있다. 정재훈과의 전투에서 마나 해독을 사용한 것을 정재훈을 통해 보고받았을 것이다.
      - 이정호: "둘째, 강이준 씨의 마나 해독 능력은 정재훈의 증폭 장치를 무력화할 수 있었습니다. 이것은 협회가 공식적으로 인정한 마나 장치를 해킹한 것에 해당합니다."
      - 마나 장치 해킹. 한도혁이 정재훈의 장치를 "협회가 공식적으로 인정한 마나 장치"라고 포장했다. 하지만 그 장치는 등급 조작 용도였다.
      - 이준이 일어선다.
      - "이정호 이사님. 반론이 있습니다."
      - 이정호: "말씀하시죠."
      - 이준: "첫째, 마나 해독은 저의 타고난 능력입니다. 협회 규정상 타고난 능력은 규제 대상이 아닙니다. 둘째, 정재훈의 장치는 '협회가 공식적으로 인정한 마나 장치'가 아닙니다. 정재훈의 장치는 등급 조작 용도로 사용된 불법 장치입니다. 불법 장치를 무력화한 것이 '해킹'이라면, 협회는 불법을 보호하는 것입니까?"
      - 회의실에 웅성거림이 퍼진다. 이준의 반론이 논리적이다.
      - 셋째로, 이준이 카드를 꺼낸다.
      - "셋째, 한도혁 회장이 저를 구금하려는 진짜 이유는 제가 '위험한 보유자'이기 때문이 아닙니다. 한도혁 회장은 제가 한도혁 회장의 범죄 증거를 가지고 있기 때문에 저를 제거하려는 것입니다."
      - 이정호의 표정이 변한다.
      - 이준: "저는 한도혁 회장의 마나 장치 폭주 설계도를 가지고 있습니다. 보유자의 마나 회로를 강제로 개방하여 사망에 이르게 하는 장치. 강철민 씨와 박세진 씨가 이 장치의 희생자입니다. 그리고 이 설계도는 협회에 제출되었습니다."
      - 회의실이 얼어붙는다. 강철민. 박세진. 두 사람의 죽음이 한도혁의 장치와 연결되어 있다는 주장. 이것은 구금 요청을 완전히 뒤집는 발언이다.
      - 의장이 표결을 요청한다. 구금 안건에 대한 표결.
      - 한도혁 파벌 4명: 전원 찬성.
      - 반대파 2명: 전원 반대.
      - 중립파 3명: 전원 반대.
      - 4대5. 구금 기각.
      - 의장: "구금 안건 기각. 대신, 강이준 씨에 대한 정식 등급 재측정을 결정합니다. 재측정은 2주 후 진행되며, 협회 중립 조사관이 배정됩니다."
      - 정식 등급 재측정. 이번에는 협회 주도의 공식 측정이다. 이준의 진짜 등급이 결정된다. B급 상위. 아니면 — 더 높을 수도 있다.
      - 이정호가 회의실을 나간다. 뒤도 돌아보지 않고. 핸드폰을 귀에 대고.
      - 마지막 줄: 구금 기각. 등급 재측정 결정. 이준이 두 번째 이사회 표결에서도 승리했다. 하지만 한도혁은 이번에도 패배를 받아들이지 않을 것이다. 이정호가 핸드폰을 귀에 댄 것. 한도혁에게 보고하는 것. 한도혁의 다음 수가 이미 준비되어 있을 것이다. 협회를 통한 방법이 막히면 — 한도혁은 직접 나온다.

  - name: final_warning
    instruction: |
      이 부분은 65화의 끝. 분량 2,000자 이상.
      - 오후. 이준이 협회를 나온다. 두 번째 승리. 하지만 이번 승리의 여운은 짧다. 한도혁이 직접 움직일 것이라는 예감이 든다.
      - 이준이 길드로 돌아오는 길. 진명 감지를 가동. 2km 범위. 주변을 전방위로 스캔. A급 반응은... 1.5km 거리에 하나. 이전에 감지한 한도혁의 새 부하. 여전히 근처에 있다. 감시인가.
      - B급 반응 여러 개. 일반 헌터들. C급 반응 다수. 그리고 —
      - 500m 거리. S급 반응. 한도혁.
      - 이준의 발걸음이 멈춘다. 한도혁이 500m 거리에 있다. ch056 이후 처음으로 이렇게 가까이.
      - 이준이 마나 은폐를 가동. 자신의 마나를 최대한 수축. 하지만 한도혁은 S급이다. 이준의 은폐를 감지할 수 있을지도 모른다.
      - 한도혁의 S급 반응이 움직인다. 이준 쪽으로. 400m. 300m.
