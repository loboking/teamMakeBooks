      - 마지막 줄: 이준이 백화 본사 방향을 본다. 3km. S급의 마나가 밤하늘에 스며 있다. 한도혁이 거기에 있다. "3일 안에 항복하라." 최후통첩. 이준은 항복하지 않을 것이다. 항복하면 아버지처럼 죽는다. 박세진처럼 죽는다. 이준은 — 싸운다. 가족을 위해. 길드를 위해. 그리고 아버지의 원수를 갚기 위해. 3일. 카운트다운이 시작됐다. 하지만 이번에는 이준이 3일 전보다 강하다. Lv7. 마나 해독 고급화. 마나 차단. 진명 감지 2km. 그리고 — 윤새벽과의 협력. 철혈의 동료들. 이준은 혼자가 아니다.
