chapter_n: 66
overall: |
  협회 주도의 정식 등급 재측정이 진행된다. 이준이 마나 은폐를 해제하고
  B급 상위 마나를 측정에 노출시킨다. B급 최상위 확인. 하지만 진명 시스템의
  마나가 일반 B급과 질감이 달라 측정기에서 미세한 오차가 발생한다. 한도혁이
  "이 헌터는 S급 후보. 연구 시설에서 정밀 측정이 필요하다"고 주장하며
  재측정에 개입하지만, 이준이 거부한다. 협회 중립파 조사관 유수진이 이준 편에
  서서 B급 공식 등록을 진행한다. C급에서 B급으로 등급 상향. 2개월 만의
  비약적 승급. 하지만 한도혁은 물러나지 않는다.

beats:
  - name: measurement_hall
    instruction: |
      이 부분은 66화의 시작. 분량 2,000자 이상.
      - ch065로부터 2일 후. 한도혁의 최후통첩 "3일" 중 두 번째 날. 오전 9시. 협회 본부 지하 2층. 등급 측정실.
      - 이준이 측정실 앞에 선다. 유수진이 동행한다. 유수진은 ch064에서 정재훈의 증폭 장치 발견을 주도한 협회 중립파 차장이다. 이준의 편에서 재측정이 공정하게 진행되도록 감시하는 역할.
      - 유수진: "강이준 씨. 오늘 재측정은 이사회 결정에 따른 정식 절차입니다. 측정관은 저와 박경호 과장님입니다. 한도혁 회장 측 인사는 참관할 수 있지만, 측정 과정에 개입할 수 없습니다."
      - 이준: "알겠습니다."
      - 측정실 문이 열린다. 넓은 방. 중앙에 원형 측정 플랫폼. 플랫폼 주변에 12개의 마나 감지 센서. 천장에 메인 감지 어레이. 벽면에 모니터 4개. 이것은 협회 최고 수준의 측정 장비다. 일반적인 등급 측정실보다 두 단계 높은 장비. S급 후보 측정에 사용되는 시설.
      - 이준이 플랫폼에 올라간다. 박경호가 조작 콘솔 앞에 앉는다. 유수진이 옆에서 모니터링한다.
      - 그리고 — 관람석에 한 명이 앉아 있다. 유리창 너머. 이정호. 한도혁의 대리인. 이번에는 직접 참관하러 왔다.
      - 박경호: "강이준 씨. 마나 은폐를 해제해 주십시오. 측정을 시작합니다."
      - 이준이 심호흡을 한다. 마나 은폐를 해제한다. B급 상위의 마나가 이준의 몸에서 퍼져나간다. 측정실의 공기가 미세하게 진동한다. 12개의 센서가 동시에 반응한다. 모니터에 수치가 표시된다.
      - 박경호가 모니터를 본다. 눈이 커진다.
      - 박경호: "마나 총량... B급 상위. 아니, 이건..."
      - 유수진도 모니터를 본다. 표정이 변한다.
      - 모니터에 표시된 수치: 마나 총량 B급 상위 (8,200 단위). 하지만 — 마나 밀도가 일반 B급과 다르다. 일반 B급의 마나 밀도는 1.0~1.5 범위. 이준의 마나 밀도는 2.3. B급의 총량이지만, S급에 가까운 밀도.
      - 유수진: "박 과장님. 이 마나 밀도... B급 치고는 비정상적으로 높아요."
      - 박경호: "알아. 마나 총량은 B급 상위인데, 밀도가 A급 하위 수준이야. 이건... 측정기 오류인가?"
      - 박경호가 측정기를 점검한다. 센서 12개 전체 정상. 메인 어레이 정상. 측정기에 오류는 없다.
      - 박경호: "오류가 아니야. 이 헌터의 마나는... 질이 다르다."
      - 이준이 안다. 진명 시스템의 마나다. 시스템이 생성한 마나는 일반 각성자의 마나와 구조가 다르다. 더 조밀하고, 더 안정적이고, 더 효율적이다. 총량은 B급이지만, 질적으로는 A급에 가깝다.
      - 관람석에서 이정호가 일어선다. 유리창 너머로 이정호의 입 모양이 보인다. 핸드폰을 들고 있다. 한도혁에게 보고하고 있다.
      - 5분 뒤. 측정실 문이 열린다. 이정호가 들어온다.
      - 이정호: "박 과장님. 한도혁 회장님의 의견을 전달하겠습니다."
      - 박경호: "참관석에 계시면 됩니다. 측정 과정에 개입할 수 없다고 했죠."
      - 이정호: "개입이 아닙니다. 의견 전달입니다. 한도혁 회장님께서 말씀하셨습니다. '이 헌터의 마나는 일반 B급과 다르다. 마나 밀도가 비정상적으로 높다. 이것은 S급 후보의 특성이다. 협회 일반 측정 장비로는 정확한 등급을 판정할 수 없다. 연구 시설에서 정밀 측정이 필요하다.'"
      - 연구 시설. 한도혁이 사용하는 말이다. "연구 시설"은 한도혁이 보유자를 연구하던 곳이다. 이준이 그곳에 가면 — 한도혁의 수중에 떨어진다.
      - 이준이 입을 연다.
      - "이정호 이사님. 한도혁 회장님의 의견에 감사드립니다. 하지만 저는 거부합니다."
      - 이정호: "거부?"
      - 이준: "네. 저는 협회 정식 측정 절차에 따라 재측정을 받고 있습니다. 측정 결과가 B급 상위라면, 저는 B급으로 등록되면 됩니다. 연구 시설은 필요 없습니다."
      - 이정호의 눈이 좁아진다.
      - 마지막 줄: 측정실 안에서 권력의 대결이 벌어진다. 이준의 마나는 B급 상위. 하지만 그 질감은 S급에 가깝다. 한도혁은 이것을 근거로 이준을 연구 시설로 끌어들이려 한다. 하지만 이준은 거부한다. 유수진이 옆에 서 있고, 박경호가 측정 결과를 마주하고 있다. 이준의 등급이 공식적으로 결정되는 순간. C급에서 B급으로. 2개월 만의 비약. 하지만 한도혁은 물러나지 않을 것이다. "B급? 그건 10%만 보여준 거잖아."

  - name: b_rank_registered
    instruction: |
      이 부분은 66화의 중반. 분량 2,000자 이상.
      - 이정호와 이준의 대치가 이어진다.
      - 이정호: "강이준 씨. 협회 규정 제52조에 따르면, 마나 밀도가 등급 범위를 벗어나는 경우, 정밀 측정이 의무입니다."
      - 유수진이 끼어든다.
      - 유수진: "이정호 이사님. 제52조는 '마나 밀도가 측정 불가능한 경우'에 해당합니다. 지금 강이준 씨의 마나는 정확히 측정되었습니다. B급 상위. 마나 총량: 8,200 단위. 마나 밀도: 2.3. 수치가 명확합니다. 측정 불가능한 것이 아닙니다."
      - 이정호가 유수진을 본다. 눈빛이 차갑다.
      - 이정호: "마나 밀도 2.3은 B급 범위를 벗어난 것입니다. B급의 정상 밀도는 1.5입니다."
      - 유수진: "협회 규정에서 마나 밀도의 등급별 기준은 마나 총량과 함께 종합적으로 판정합니다. 마나 총량이 B급 상위이고, 마나 밀도가 높은 것은 '고품질 B급'으로 분류됩니다. S급 후보로 지정하려면 마나 총량이 A급 이상이어야 합니다."
      - 이정호의 입술이 떨린다. 유수진이 규정을 정확하게 적용했다. 마나 총량이 B급이면, 밀도가 높아도 S급 후보로 지정할 수 없다.
      - 박경호가 결정을 내린다.
      - "재측정 결과. 강이준 씨의 공식 등급: B급 상위. 마나 총량 8,200 단위. 마나 밀도 2.3. 등록 변경: C급에서 B급으로 상향."
      - 박경호가 이준을 본다.
      - "강이준 씨. 축하합니다. B급 공식 등록입니다."
      - B급. 공식적으로. 이준이 2025년 3월에 F급으로 등록하고, 7월에 C급으로 승급했다. 지금 10월. 2개월 만에 C급에서 B급. 7개월 만에 F급에서 B급. 대한민국 헌터 역사상 가장 빠른 승급 속도 중 하나다.
      - 이준: "감사합니다."
      - 이정호가 말한다.
      - "박 과장님. 이 결정에 이의를 제기합니다. 한도혁 회장님께서 직접 이사회에 재검토를 요청하실 것입니다."
      - 박경호: "이의 제기는 가능합니다. 하지만 등급 등록은 즉시 효력을 발생합니다. 강이준 씨는 오늘부터 B급 헌터입니다."
      - 이정호가 측정실을 나간다. 뒤도 돌아보지 않고.
      - 이준이 플랫폼에서 내려온다. 유수진이 이준에게 다가온다.
      - 유수진: "강이준 씨. 한 가지 말씀드릴 게 있습니다."
      - 이준: "뭔데요?"
      - 유수진: "마나 밀도 2.3. 이것은 제가 15년간 심사과에서 본 헌터 중 최고 수치입니다. A급 헌터의 평균 마나 밀도가 1.8입니다. 당신은 B급이지만, 마나의 질은 A급을 넘어서고 있어요."
      - 이준이 유수진을 본다. 유수진은 이준의 비밀을 눈치챈 것인가. 진명 시스템. 이준의 마나가 일반 각성자와 다르다는 것을.
      - 유수진이 덧붙인다.
      - "어떻게 이런 마나를 가지게 되었는지는 묻지 않겠습니다. 하지만 한 가지 충고합니다. 한도혁 회장이 당신을 놓지 않을 거예요. B급 등록이 한도혁의 압박을 멈추지 못할 겁니다. 조심하시죠."
      - 이준: "감사합니다. 차장님."
      - 이준이 협회 본부를 나온다. 밖에서 핸드폰을 본다. 김태석에게서 메시지.
      - "B급 승급 확정? 축하해! 길드원들한테 알릴게."
      - 이준이 답장. "아직 공식 발표 전이에요. 협회에서 등록 절차만 마치면 알려주세요."
      - 윤새벽에게서 메시지.
      - "B급 상위. 마나 밀도 2.3. 한도혁이 이 수치를 보면 더 집착할 거야. 네 마나가 '진명 시스템'의 마나라는 걸 한도혁은 알고 있거든. 밀도가 높은 이유가 그거야. 일반 각성자의 마나가 아니라, 시스템이 생성한 마나니까."
      - 마지막 줄: 이준이 B급 헌터가 되었다. 공식적으로. C급의 껍데기를 완전히 벗었다. 하지만 B급 등록은 한도혁의 압박을 멈추지 못한다. 오히려 한도혁의 집착을 더 부추겼다. 마나 밀도 2.3. 이 수치는 한도혁에게 "이 헌터는 보유자다"라는 확신을 주었다. 이준이 B급이 된 것은 안도가 아니라 — 새로운 전쟁의 시작이었다.

  - name: ten_percent
    instruction: |
      이 부분은 66화의 끝. 분량 2,000자 이상.
      - 오후. 이준이 길드로 돌아온다. B급 승급 소식이 퍼지기 전이다. 아직 협회에서 공식 발표를 하지 않았다.
      - 길드 사무실. 김태석이 책상에 앉아 있다. 퇴원 후 첫 출근. 얼굴에 기브스. A급의 체력으로 1주일 만에 퇴원했지만, 완치는 아니다.
      - 이준: "길드장님. B급 승급 확정이에요."
      - 김태석이 이준을 본다. 미소를 짓는다.
      - 김태석: "2개월. C급에서 B급. 이준아, 너 정말 대단한 놈이야."
      - 이준: "아직 부족해요."
      - 김태석: "부족? B급이면 대한민국 상위 5%야. 그것도 7개월 만에."
      - 이준이 고개를 저른다.
      - "한도혁이 물러나지 않아요. B급 등록이 한도혁의 압박을 멈추지 못해요. 오히려 더 심해질 거예요."
      - 김태석의 미소가 사라진다.
      - 김태석: "그래서 어쩌겠다는 거야?"
      - 이준: "시간을 벌어야 해요. 한도혁의 '3일'이 내일이에요. 내일까지 항복하라는 최후통첩. 하지만 저는 항복하지 않을 거예요. 대신, 한도혁의 목표가 뭔지 파악해야 해요. 한도혁이 왜 저를 이렇게 집착하는지."
      - 김태석: "보유자니까 아니야?"
      - 이준: "보유자인 건 맞아요. 하지만 한도혁이 저를 '연구하려는' 게 아니에요. 한도혁은 이미 보유자를 연구한 적이 있어요. 강철민 씨, 박세진 씨. 그리고 아버지까지. 한도혁은 보유자를 '연구'하는 게 아니라 '이용'하는 거예요."
      - 김태석이 이준의 말을 곱씹는다.
      - 이준이 핸드폰을 본다. 윤새벽에게서 새 메시지.
      - "한도혁이 재측정 결과를 받았어. B급 상위. 마나 밀도 2.3. 그리고 한도혁이 직접 메시지를 보냈어."
      - 윤새벽이 캡처한 화면. 한도혁의 메시지.
      - "B급? 재밌네. 그건 당신이 10%만 보여준 거잖아. 진명 시스템의 마나 밀도가 2.3? 내가 아는 진명 시스템의 마나 밀도는 훨씬 높아. 당신은 아직 자신의 마나를 다 끌어쓰지 못하고 있어. Lv7? 그 정도론 부족해. 내일까지 항복해. 그러면 내가 도와줄게. 네 마나를 100% 끌어쓰게."
      - 이준의 손이 떨린다. 한도혁이 진명 시스템의 마나 밀도를 알고 있다. "내가 아는 진명 시스템의 마나 밀도는 훨씬 높아." 한도혁은 다른 보유자를 연구했다. 강철민, 박세진, 이준의 아버지. 그들의 마나 밀도를 측정했다. 그리고 이준의 마나가 아직 10%밖에 끌어쓰지 못했다는 것을 알고 있다.
      - 10%. 이준은 자신의 마나를 10%만 사용하고 있다. 나머지 90%는 아직 잠겨 있다. Lv7에서 10%. 그렇다면 Lv8에서는? Lv9에서는?
      - 시스템 메시지가 떠오른다.
      - [퀘스트 진행 중 — 한도혁의 최후통첩 / 남은 시간: 1일 / 한도혁의 압박 지속 중 / B급 등록 완료 / 다음: 한도혁의 3일 기한 대응 / 보상: Lv8 진행도 +5%]
      - 이준이 밤에 길드 옥상에 선다. 진명 감지를 가동. 2km. 서울의 마나 반응이 스캔된다.
      - S급 반응: 한도혁. 백화 본사. 3km. 감지 범위 바깥이지만, S급의 마나는 거리를 초월해서 느껴진다.
      - A급 반응: 3개. 한도혁의 부하들.
      - 그리고 — 800m 거리. B급 반응 하나. 움직이지 않고 있다. 한 곳을 향해. 이준이 위치를 확인한다. 그 B급 반응이 향한 방향은 — 협회 시설. 어머니가 있는 시설.
      - 이준의 심장이 멈춘다.
      - 백화가 어머니를 노리고 있다.
      - 마지막 줄: B급 등록. 한도혁의 경멸. "10%만 보여준 거잖아." 그리고 백화의 B급 헌터가 어머니의 시설 근처에 배치되어 있다. 한도혁의 3일 기한. 내일이 마감이다. 이준은 항복하지 않을 것이다. 하지만 한도혁도 물러나지 않을 것이다. 협회 정치가 통하지 않으면 — 한도혁은 다른 수를 쓴다. 가족. 이준의 가장 약한 곳. 이준이 3일째에 직면할 것은 — 협회의 판결이 아니라, 가족의 안전에 대한 공포다.
