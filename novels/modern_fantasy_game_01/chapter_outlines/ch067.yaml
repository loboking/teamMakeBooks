chapter_n: 67
overall: |
  한도혁이 협회 정치가 통하지 않자 직접적인 수단으로 전환한다. 이준의 어머니가
  있는 협회 보호 시설 근처에서 백화 산하 B급 헌터가 대기하는 것이 감지된다.
  이준이 진명 감지 2km로 시설 주변을 스캔하고, 윤새벽에게 도움을 요청하여
  백화 헌터를 은밀히 격퇴한다. 이준이 직접 어머니를 면회하고 시설 이전을
  제안한다. 한도혁의 전략이 드러난다 — 이준의 약점은 가족. 가족을 건드리면
  이준이 항복한다는 한도혁의 계산.

beats:
  - name: watching_the_facility
    instruction: |
      이 부분은 67화의 시작. 분량 2,000자 이상.
      - ch066의 다음 날. 한도혁의 최후통첩 "3일"의 마지막 날. 오전 6시. 이준이 잠에서 깬다. 어젯밤 진명 감지에서 포착한 B급 반응. 어머니 시설 근처. 이준은 밤새 잠을 제대로 자지 못했다.
      - 이준이 즉시 진명 감지를 가동한다. 2km. 현재 위치(길드 사무실)에서 어머니 시설까지는 약 4km. 감지 범위 밖이다. 이동해야 한다.
      - 이준이 새벽 6시 30분에 길드를 나선다. 어머니 시설 방향으로. 택시를 탄다.
      - 차 안에서 진명 감지를 유지. 1km 이내에 접근하자 반응이 잡힌다.
      - B급 반응. 1개. 시설 남쪽 300m. 건물 옥상에 자리 잡고 있다. 움직이지 않는다. 감시 포지션.
      - 마나 해독을 가동. 고급화된 마나 해독. 거리 700m. 해상도 낮음. 하지만 B급의 마나 패턴을 분석할 수 있다.
      - [미확인 B급 / 마나 총량: B급 중위 / 마나 구조: 단일 회로 / 마나 패턴 특이점: 백화 공통 주파수 감지 / 추정 소속: 백화 산하 길드 / 위협도: 중]
      - 백화 산하 B급. 확실하다. 한도혁이 어머니 시설에 감시자를 배치했다. 직접 공격이 아니라 감시. 이유는 — 이준의 반응을 보기 위해서. 이준이 어머니를 보러 오면, 한도혁은 이준의 행동 패턴을 파악할 수 있다.
      - 이준이 택시에서 내린다. 시설에서 500m 거리. 아침 공기가 차갑다.
      - 이준이 윤새벽에게 메시지.
      - "어머니 시설 근처에 백화 B급 1명 배치. 감시 목적. 격퇴 부탁드려요."
      - 윤새벽의 답장이 빠르게 온다.
      - "알겠어. 내가 직접 할게. 30분 뒤 도착."
      - 윤새벽. A급. 백화 산하 B급 하나는 윤새벽에게 문제가 아니다. 하지만 문제는 — 윤새벽이 백화와의 연결을 들키면 안 된다는 것이다. 윤새벽은 아직 협회 내부에서 한도혁에 대항하는 세력의 핵심이다. 공개적으로 움직이면 한도혁의 표적이 된다.
      - 윤새벽이 이어서 쓴다.
      - "걱정 마. 은밀하게 할게. 내가 B급 정도는 마나 은폐로 숨기면서 처리할 수 있어. 상대가 누군지 파악만 해."
      - 이준이 기다린다. 30분. 시설 주변의 아침 풍경. 아파트 단지. 상가. 사람들이 아침을 준비한다. 이 평범한 풍경 속에, 백화의 감시자가 있다.
      - 28분 뒤. 이준의 진명 감지에서 변화가 감지된다. A급 반응이 시설 남쪽에서 접근. 윤새벽이다.
      - 윤새벽의 마나가 감지 범위 안에 들어왔다. A급. 하지만 마나를 극도로 억제하고 있다. C급 수준으로. 윤새벽의 마나 은폐 기술은 A급 수준이다.
      - 2분 뒤. B급 반응이 움직이기 시작한다. 갑자기. 급하게. 시설 남쪽에서 동쪽으로 이동. 도망이다.
      - 윤새벽에게서 메시지.
      - "처리했어. 상대를 위협만 하고 보냈어. '이 근처에 다시 나타나면 죽는다'고. 상대는 겁먹고 도망갔어. 백화 산하 '호랑이' 길드 소속. 이름은 모르겠어."
      - 이준: "감사합니다."
      - 윤새벽: "이준아. 한 가지. 이 사람은 단순한 감시자가 아니야. 이 사람한테 '특정 지시'가 내려와 있었어. '강이준의 어머니가 있는 병실 위치를 파악하라'는 지시. 감시가 아니라 정보 수집이야."
      - 정보 수집. 어머니의 병실 위치. 한도혁이 어머니의 정확한 위치를 파악하려 한다. 감시자를 보낸 것은 단순한 위협이 아니다. 정보 수집이다. 정보를 수집한 뒤에 — 무엇을 할 것인가.
      - 마지막 줄: 새벽 7시. 이준이 어머니 시설 앞에 서 있다. 백화의 감시자는 윤새벽이 격퇴했다. 하지만 한도혁은 또 다른 사람을 보낼 것이다. 감시자, 정보 수집원, 그리고 — 그 다음은 직접적인 접촉일 수도 있다. 이준은 어머니를 만나야 한다. 그리고 시설을 옮겨야 한다. 한도혁의 "3일"이 오늘 끝난다. 하지만 이준의 싸움은 오늘부터 시작이다.

  - name: mother_and_truth
    instruction: |
      이 부분은 67화의 중반. 분량 2,000자 이상.
      - 이준이 협회 보호 시설에 들어간다. 3층 건물. 협회 산하 헌터 가족 보호 시설. 이준의 어머니, 강영희,는 2층에 있다. ch027 이후 이곳에 보호되어 왔다. 한도혁의 감시 역추적 이후, 협회가 이준의 가족을 보호하기 위해 배치한 시설이다.
      - 접수 창구. 보안 요원.
      - 보안 요원: "실례합니다. 면회는 사전 예약..."
      - 이준이 협회 B급 헌터 배지를 보여준다. 어제 받은 배지. 아직 플라스틱이 새것이다.
      - 이준: "강이준입니다. 어머니를 면회하러 왔습니다."
      - 보안 요원이 배지를 확인. 컴퓨터에서 이준의 정보를 검색. B급 헌터. 어제 등록. 그리고 — 보호 대상 가족: 강영희.
      - 보안 요원의 태도가 바뀐다. "죄송합니다. 바로 안내해 드리겠습니다."
      - 2층. 병실. 문을 열면 어머니가 침대에 앉아 있다. TV를 보고 있다. 아침 드라마. 창밖으로 아침 햇살이 들어온다.
      - 어머니가 이준을 본다. 미소를 짓는다.
      - "이준아. 왔어? 아침 먹었어?"
      - 이준이 어머니 옆에 앉는다. 어머니의 얼굴을 본다. ch027 이후 많이 나아졌다. 안색이 좋아졌고, 체중도 조금 늘었다. 하지만 아직 완치는 아니다. 한도혁의 장치 폭주 후유증. 마나 회로 손상. 협회 치료를 받으며 회복 중이다.
      - 이준: "엄마. 밥 먹었어요?"
      - 어머니: "응. 병원 식단인데 맛있네. 이준아, 너 요즘 어떻게 지내? 바쁘지 않아?"
      - 이준이 어머니의 손을 잡는다. 따뜻하다. 살아 있다. 한도혁이 아직 손대지 않았다.
      - 이준: "엄마. 말할 게 있어요."
      - 어머니가 이준을 본다. 눈빛이 진지해진다. 어머니는 이준이 무언가 숨기고 있다는 것을 알고 있다. 아들이 헌터가 되었고, 위험한 일에 관여하고 있다는 것을.
      - 이준: "엄마. 제가 좀 위험한 상황이에요. 헌터 일 때문에. 제가... 등급을 올렸어요. B급이 됐어요."
      - 어머니: "B급? 그게 좋은 거야?"
      - 이준: "네. 좋은 거요. 하지만... B급이 되면서 적이 생겼어요. 제가 누군가와 갈등이 있고, 그 사람이... 엄마를 노리고 있을 수 있어요."
      - 어머니의 표정이 변한다. 걱정. 두려움. 하지만 — 어머니의 눈에는 강함이 있다.
      - 어머니: "이준아. 그 사람이... 아빠 일을 한 사람이야?"
      - 이준이 멈춘다. 어머니가 아버지의 일을 알고 있다. 이준이 한도혁과 관련이 있다는 것을.
      - 이준: "네."
      - 어머니가 이준의 손을 잡는다. 반대로. 어머니가 이준의 손을.
      - 어머니: "이준아. 무섭겠다. 엄마도 무서워. 하지만... 네 아빠도 이런 날이 있었어. 무서운 날. 그래도 싸웠어. 네 아빠는 싸우는 사람이었어. 너도 그런 사람이야."
      - 이준의 눈이 뜨거워진다. 울지 않는다. 울 수 없다.
      - 이준: "엄마. 시설을 옮겨야 해요. 여기는 안전하지 않아요."
      - 어머니: "옮기면 안전해?"
      - 이준: "더 안전한 곳이 있어요. 협회에서 준비해 줄 거예요."
      - 어머니: "그래. 네가 안전하다고 하면 옮기지."
      - 이준이 어머니를 안는다. 따뜻하다. 어머니의 체온. 이것을 지켜야 한다. 한도혁에게서. 백화에게서.
      - 마지막 줄: 이준이 어머니를 만났다. 시설 이전을 제안했다. 어머니는 동의했다. 하지만 이것만으로는 부족하다. 한도혁은 어머니뿐 아니라 이서에게도 접근할 수 있다. 이준의 가족. 한도혁이 이준의 약점으로 삼은 것. 이준은 가족 전체를 보호해야 한다. 어머니의 시설 이전. 이서의 경호 강화. 그리고 — 한도혁에게 경고. 가족에게 손대지 마라.

  - name: family_is_the_weakness
    instruction: |
      이 부분은 67화의 끝. 분량 2,000자 이상.
      - 이준이 시설을 나온다. 어머니와의 면회 후. 오전 9시. 윤새벽에게 연락.
      - "어머니 시설 이전을 준비해 주세요. 협회 중립파의 도움이 필요해요."
      - 윤새벽: "알겠어. 유수진 차장한테 말해볼게. 유수진이 중립파에서 가장 영향력이 있어. 협회 산하 다른 보호 시설로 이전할 수 있도록 조율할게."
      - 이준: "감사합니다."
      - 윤새벽이 이어서 쓴다.
      - "이준아. 한도혁의 전략을 분석했어. 한도혁이 지금 하는 건 '가족 압박'이야. 협회 정치로 안 되니까, 직접적인 수단으로 전환한 거야. 하지만 한도혁이 어머니를 직접 공격하지는 않아."
      - 이준: "왜요?"
      - 윤새벽: "협회 보호 시설을 직접 공격하면, 한도혁도 피해를 입어. 협회의 보복. 이사회에서의 입지 악화. 한도혁은 그걸 원하지 않아. 한도혁이 원하는 건... 이준이 항복하는 거야. 전면전이 아니라, 압박으로 항복시키는 거야."
      - 이준이 윤새벽의 분석을 생각한다. 맞다. 한도혁이 어머니 시설에 감시자를 보낸 것은 직접 공격이 아니라 정보 수집이다. 정보를 수집하고, 이준에게 "나는 네 가족의 위치를 알고 있다"는 메시지를 전하는 것. 심리적 압박.
      - 하지만 한도혁이 감시자만 보낸다고 확신할 수는 없다. 한도혁이 다음 수로 무엇을 올지 모른다.
      - 이준이 김태석에게 연락.
      - "길드장님. 이서 학교 경호 상태 확인해 주세요. 오늘 한도혁의 3일 기한이 끝나는데, 백화가 움직일 수 있어요."
      - 김태석: "이미 확인했어. 세린이 학교 경호 상태를 매일 보고하고 있어. 오늘 아침에도 이상 없다고 했어."
      - 이준: "경호원을 한 명 더 추가해 주세요. 그리고... 제가 오늘 직접 학교에 갈게요."
      - 김태석: "직접? 좋아. 이서가 오빠 보면 좋아하겠네."
      - 이준이 학교로 향한다. 버스. 아침 출근 시간. 사람들 사이에 섞여. B급 헌터. 어제 공식 등록된 배지가 주머니 속에 있다. 7개월 전 F급이었던 사람이 이제 B급이다.
      - 이준이 진명 감지를 유지. 2km. 학교 방향으로 이동하면서 주변을 스캔.
      - 학교 근처. B급 반응 1개. 800m. 이번에는 시설이 아니라 학교 주변 상가 건물 옥상.
      - 이준의 심장이 빠르게 뛴다. 또 한 명. 백화의 사람. 이번에는 어머니 시설이 아니라 학교.
      - 마나 해독을 가동.
      - [미확인 B급 / 마나 총량: B급 하위 / 마나 구조: 단일 회로 / 마나 패턴: 백화 공통 주파수 / 특이점: 마나 억제 상태. 은밀 임무 추정 / 위협도: 중]
      - B급 하위. 마나 억제 상태. 감시를 위해 마나를 숨기고 있다. 이 사람은 학교를 감시하고 있다.
      - 이준이 핸드폰을 본다. 한도혁의 "3일" 기한. 오늘이 마지막 날. 한도혁이 약속한 "항복하지 않으면 가족부터 없어"라는 협박.
      - 이준이 한도혁에게 메시지를 보낸다. 직접. 번호는 알고 있다.
      - "한도혁 회장님. 학교와 어머니 시설 근처에서 당신의 사람이 감지됩니다. 철수시키십시오."
      - 30초 뒤. 한도혁의 답장.
      - "감지? 재밌네. B급 감지 거리가 2km라고 들었는데. Lv7의 진명 감지? 능력이 좋아졌군. 하지만 그게 전부야. 감지만 할 뿐, 막지는 못하지?"
      - 이준의 손이 떨린다. 한도혁이 이준의 능력을 정확히 파악하고 있다. 진명 감지 2km. 감지할 수는 있지만, 2km 밖의 적을 직접 막을 수는 없다.
      - 한도혁이 이어서 쓴다.
      - "내일. 항복하든가, 아니면 직접 보게 되겠군."
      - 시스템 메시지.
      - [퀘스트 업데이트 — 한도혁의 최후통첩 / 기한 연장: 한도혁이 직접 행동 예고 / 가족 보호: 진행 중 / 어머니 시설 이전: 준비 중 / 이서 경호: 강화 필요 / 보상: Lv8 진행도 +5%]
