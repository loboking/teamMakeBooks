chapter_n: 68
overall: |
  이준이 어머니 시설 이전을 준비하고 협회 중립파의 도움으로 안전한 시설을
  확보한다. 백화가 이서에게 접근 — 학교 앞에서 "친절한 이모"가 이서에게
  다가온다. 이준이 진명 감지로 학교 주변을 스캔하고 B급 반응을 감지하여
  학교에 직접 방어에 나선다. 이준이 마나 차단 능력을 처음 실전 사용하여
  100m 범위 내 백화 요원의 마나를 차단한다. 이서가 이준의 방문을 보고,
  이준이 이서에게 진실 일부를 공유한다.

beats:
  - name: facility_transfer
    instruction: |
      이 부분은 68화의 시작. 분량 2,000자 이상.
      - ch067의 다음 날. 한도혁의 "3일" 기한이 어제 끝났다. 하지만 한도혁은 직접 공격하지 않았다. 대신, 감시자들을 유지하고 있다. 압박을 지속하는 것. 이준이 항복하기를 기다리는 것.
      - 오전 8시. 이준이 윤새벽과 통화.
      - 윤새벽: "어머니 시설 이전 준비됐어. 유수진 차장이 협회 산하 제2보호시설을 확보했어. 강남구가 아니라 서초구. 위치 비공개. 보안 2배 강화."
      - 이준: "좋아요. 언제 이전 가능한가요?"
      - 윤새벽: "오늘 오후. 협회 전용 차량으로 이동. 경호 3명 배치."
      - 이준: "감사합니다."
      - 윤새벽이 덧붙인다.
      - "이준아. 한도혁이 어제 움직이지 않은 이유가 있어. 한도혁이 '3일' 기한을 줬지만, 실제로 기한이 지났다고 해서 바로 공격하는 건 아니야. 한도혁의 전략은 '압박'이야. 압박을 지속하면서 이준이 스스로 항복하도록 만드는 거야. 전면전은 한도혁에게도 리스크가 있거든."
      - 이준: "알아요. 하지만 한도혁이 언제 직접 나올지 모르니까, 방어는 최대한 해야 해요."
      - 오후 1시. 어머니 시설 이전. 이준이 직접 시설에 간다. 협회 전용 차량 2대. 경호원 3명. 그리고 이준.
      - 어머니가 차에 오른다. 이준이 옆에 앉는다.
      - 어머니: "이준아. 새 병원은 어때?"
      - 이준: "좋아요. 더 안전해요. 엄마, 걱정 마세요."
      - 어머니가 이준의 손을 잡는다. "이준아. 너도 조심해."
      - 이준이 고개를 끄덕인다. 차가 출발한다. 강남구에서 서초구까지. 40분. 이준은 이동 내내 진명 감지를 가동. 2km. 주변의 모든 마나 반응을 스캔.
      - 이동 경로에 B급 반응 1개. 1.5km 거리. 따라오고 있다. 하지만 접근하지 않는다. 감시.
      - 이준이 윤새벽에게 메시지. "이동 중 B급 1명 추적 중. 1.5km 후방."
      - 윤새벽: "알겠어. 내가 뒤에서 처리할게."
      - 10분 뒤. B급 반응이 멈춘다. 방향을 틀었다. 윤새벽이 겁을 준 것이다.
      - 서초구. 제2보호시설. 강남구 시설보다 규모는 작지만, 보안이 훨씬 철저하다. 지하 1층까지 보안 시스템. 마나 감지 센서 360도 배치. 협회 경호원 24시간 상주.
      - 어머니가 새 병실에 안착한다. 창밖으로 서초구 풍경이 보인다.
      - 어머니: "여기 좋네. 조용하고."
      - 이준: "네. 여기서 안정적으로 치료받으세요."
      - 이준이 시설을 나온다. 어머니 이전 완료. 한 가지 걱정이 줄었다. 하지만 아직 이서가 있다.
      - 마지막 줄: 어머니 시설 이전 완료. 강남에서 서초로. 위치 비공개. 보안 강화. 한도혁이 당분간 어머니의 위치를 파악하기 어려울 것이다. 하지만 한도혁은 다른 약점을 노릴 것이다. 이서. 학교. 이준의 누이. 어머니 시설 이전이 끝나자마자, 이준의 핸드폰이 울린다. 세린.
      - "이준 씨. 이서 학교에 문제가 있어요. 수상한 사람이 이서에게 접근했어."

  - name: the_kind_aunt
    instruction: |
      이 부분은 68화의 중반. 분량 2,000자 이상.
      - 이준의 심장이 멈춘다.
      - 이준: "뭐라고? 이서에게? 지금?"
      - 세린: "아니. 30분 전에요. 학교 앞에서. 이서가 하교하려는데, 한 여자가 다가왔대. '이서 친구 어머니세요?'라고. 이서가 모른다고 했더니, '알고 있어요. 오빠가 헌터잖아. 오빠 동료라고요.'라고 했대."
      - 이준의 피가 끓어오른다. 백화. 학교 앞에서 이서에게 접근. "오빠 동료"라고 사칭.
      - 이준: "이서는 어떻게 했어?"
      - 세린: "이서가 경호원에게 알렸어. 경호원이 여자에게 다가가니까 여자가 사라졌대. '착각이에요'라고 하고."
      - 사라졌다. 하지만 정보 수집은 했다. 이서의 얼굴, 이서의 반응, 이서의 동선. 그리고 — 이서에게 "오빠가 헌터"라는 정보를 확인시켰다.
      - 이준: "그 여자. 마나 반응 감지됐어?"
      - 세린: "경호원은 C급이에요. 마나 감지 능력이 없어서... 그냥 일반인처럼 보였대."
      - 일반인처럼 보였다. 마나를 숨긴 것이다. B급 이상이 마나를 완전히 숨기면 일반인과 구별하기 어렵다. 하지만 이준에게는 진명 감지가 있다.
      - 이준이 버스에 오른다. 학교 방향. 진명 감지를 최대 가동. 2km.
      - 학교 주변 스캔. 이준이 학교에서 1.5km 거리에서 B급 반응을 감지한다. 학교 서쪽. 카페 안. 마나를 극도로 억제. B급 하위. 하지만 마나 패턴에 백화 공통 주파수가 있다.
      - 이준이 학교에 도착한다. 오후 3시. 하교 시간. 학생들이 학교 밖으로 나온다.
      - 이준이 진명 감지로 이서를 찾는다. 이서의 마나 반응. 아직 각성하지 않은 일반인이라 마나가 없다. 하지만 이준은 이서의 위치를 알고 있다. 학교 정문 앞. 경호원 2명과 함께.
      - 이준이 이서에게 다가간다. 이서가 이준을 본다.
      - 이서: "오빠?"
      - 이준이 이서의 손을 잡는다.
      - 이준: "이서야. 여기 서 있어. 오빠가 있어."
      - 이서가 이준의 표정을 본다. 불안하다.
      - 이서: "오빠... 무슨 일이야? 왜 그래?"
      - 이준: "아무 일 아니야. 그냥 보러 왔어."
      - 이서: "거짓말. 오빠 얼굴 보면 알아. 무슨 일 있어."
      - 이서는 이준을 잘 안다. 오빠가 무언가를 숨기면 표정에 나타난다. 항상 그랬다. 아버지가 죽었을 때도, 이준은 처음에 아무 일 없다고 했다.
      - 이준이 이끼고 이서를 학교에서 멀어지게 한다. 차를 타고 집으로. 택시. 이서가 옆에 앉아 이준을 본다.
      - 이서: "오빠. 아까 이상한 아줌마가 왔었어."
      - 이준: "알아. 들었어."
      - 이서: "그 아줌마가... 오빠 동료라고 했어. 오빠가 헌터라고. 알고 있다고. 오빠가 나한테 헌터라고 안 했는데."
      - 이준이 이서를 본다. 16살. 고등학교 1학년. 아직 아이다. 이 세계의 어둠을 알 필요가 없는 아이.
      - 하지만 이준이 숨기면, 이서는 무방비 상태로 남는다. 적어도 — 위험하다는 것만은 알려야 한다.
      - 이준: "이서야."
      - 이서: "응?"
      - 이준: "오빠가... 좀 특별한 일을 하고 있어. 헌터 일이 좀 복잡해져서. 그래서... 위험해진 거야."
      - 이서의 눈이 커진다.
      - 이서: "위험? 오빠가?"
      - 이준: "응. 하지만 오빠가 지킬게. 아무 일도 안 생겨."
      - 이서가 이준의 손을 잡는다. 아까까지 오빠가 자기 손을 잡았는데, 이제 동생이 오빠의 손을 잡는다.
      - 이서: "오빠. 아빠도 그렇게 했어. '아무 일도 안 생겨'라고. 그리고... 아빠는."
      - 이서의 말이 끊긴다. 아버지의 죽음. 두 사람 다 잠시 침묵한다.
      - 이준: "이서야. 오빠는 아빠와 달라. 약속해."
      - 마지막 줄: 이서에게 진실 일부를 공유했다. "오빠가 특별한 일을 하고 있어." 모든 것을 말하지는 않았다. 진명 시스템, 한도혁, 보유자 — 이것은 말할 수 없다. 하지만 "위험하다"는 것은 말했다. 이서가 적어도 경계심을 가지도록. 학교 앞의 "친절한 이모"가 다시 나타나면, 이서가 도망칠 수 있도록. 이준은 이서를 택시에서 내려준다. 집 앞. "오늘은 집에서 쉬어. 학교는 내일 가." 이서가 고개를 끄덕인다. 이준이 돌아선다. 백화 요원이 아직 학교 근처 카페에 있다. B급 하위. 마나 억제 상태. 이준은 돌아가서 — 이 사람을 직접 상대한다.

  - name: first_mana_block
    instruction: |
      이 부분은 68화의 끝. 분량 2,000자 이상.
      - 이준이 학교 방향으로 돌아간다. 이서를 집에 보낸 후. 오후 4시. 학교 근처 카페. B급 반응이 아직 있다.
      - 이준이 카페 앞에 선다. 진명 감지로 확인. B급 하위. 마나 억제. 백화 공통 주파수. 카페 안 창가 자리. 여성. 30대 초반. 검은 코트. 마나를 완전히 숨기고 있다.
      - 이준이 카페 안으로 들어간다. 마나 은폐를 유지한 채. 이준의 마나를 C급 수준으로 억제.
      - 카페 안. 5명의 손님. 창가에 앉은 검은 코트 여성. 이준의 진명 감지로 마나 패턴을 분석.
      - [백화 산하 요원 / 추정 등급: B급 하위 / 마나 억제 상태 / 임무: 이서 접근 및 정보 수집 / 특이점: 접촉형 임무. 이서와 물리적 접촉 시 마나 감지 가능 / 위협도: 중]
      - 접촉형 임무. 이서와 물리적으로 접촉하는 것이 목적. 정보 수집뿐 아니라, 이서에게 무언가를 전달하거나, 이서를 납치하려는 것일 수도 있다.
      - 이준이 결심한다. 이 사람을 막아야 한다. 하지만 카페 안에서 싸우면 민간인 피해. 밖으로 유도해야 한다.
      - 이준이 여성 앞 테이블에 앉는다. 마주보지 않고, 옆 테이블. 핸드폰을 꺼내서 무언가를 하는 척.
      - 그리고 — 이준이 마나 차단을 가동한다. Lv7에서 새로 얻은 능력. 100m 범위 내의 마나를 차단.
      - 마나 차단이 활성화된다. 이준을 중심으로 100m 반경. 보이지 않는 구체가 퍼져나간다.
      - 효과가 즉시 나타난다. 여성의 미세한 반응. 여성이 핸드폰을 든 손이 멈춘다. 잠깐. 그리고 — 여성의 표정이 변한다. 당황.
      - 여성이 자신의 마나를 확인하려 한다. 하지만 마나가 차단되어 있다. 100m 안에서 마나를 사용할 수 없다. 이것은 단순한 마나 차단이 아니다. 마나 회로 자체가 일시적으로 억제된다.
      - 여성이 일어선다. 핸드폰을 들고 밖으로 나간다. 급하게.
      - 이준이 따라나선다. 카페 밖. 여성이 골목으로 들어간다. 이준이 뒤따른다.
      - 골목 안. 여성이 멈춰 선다. 이준을 돌아본다.
      - 여성: "당신... 뭐야?"
      - 마나 차단이 풀렸다. 이준이 범위 밖으로 나왔기 때문이다. 여성의 마나가 돌아온다.
      - 이준이 마나 은폐를 해제한다. B급 상위의 마나가 퍼져나간다.
      - 여성의 표정이 변한다. 경악.
      - 여성: "B급...?"
      - 이준: "학교 앞에서 내 여동생에게 접근한 사람. 당신이지?"
      - 여성이 뒷걸음친다. 이준의 마나가 B급 상위. 이 여성은 B급 하위. 전투력 차이가 있다.
      - 여성: "나는... 그냥 길을 걷고 있었을 뿐이야."
      - 이준: "거짓말. 당신의 마나 패턴에 백화 공통 주파수가 있다. 한도혁의 사람이지?"
      - 여성의 눈이 흔들린다.
      - 이준: "한 가지 경고해. 내 여동생에게 다시 접근하지 마라. 두 번째는 경고가 아니다."
      - 여성이 뒤로 물러난다. 그리고 — 도망친다. B급의 속도로. 이준이 쫓지 않는다. 쫓을 필요가 없다. 이 사람은 정보를 한도혁에게 전달할 것이다. "강이준이 직접 나타났다. B급 상위 마나. 그리고 — 마나 차단 능력을 사용했다."
      - 이준이 골목을 나온다. 마나 차단. 처음 실전 사용. 100m 범위. 카페 안에서 여성의 마나를 차단했다. 이 능력은 — 전투에서 엄청난 이점이 될 것이다. 적의 마나를 차단하면, 적은 스킬을 사용할 수 없다.
      - 하지만 한계도 있다. 100m. 범위가 좁다. 그리고 이준이 범위 밖으로 나가면 차단이 풀린다. 지속 시간도 제한이 있다. 아직 5초밖에 유지하지 못했다.
      - 시스템 메시지.
      - [마나 차단 실전 사용 기록 / 효과: B급 하위 대상 완전 차단 / 지속 시간: 4.8초 / 범위: 100m / 숙련도: 초보 / 반복 사용 시 숙련도 상승]
      - [퀘스트 진행 중 — 한도혁의 최후통첩 / 가족 보호: 진행 중 / 어머니 시설 이전: 완료 / 이서 경호: 강화 완료 / 백화 요원 접근 차단: 완료 / 보상: Lv8 진행도 +5%]
      - 마지막 줄: 마나 차단의 첫 실전 사용. 100m 범위에서 백화 요원의 마나를 차단했다. 이 능력은 이준의 새 무기다. 하지만 아직 완성되지 않았다. 지속 시간 5초. 범위 100m. 더 강해져야 한다. 더 길게, 더 넓게. 그러려면 — 경험치가 필요하다. 전투 경험. 그리고 레벨업. Lv8. 이준이 S급에 도달하기 위한 다음 단계. 이준이 집으로 돌아온다. 이서가 안전하게 집에 있다. 어머니는 새 시설에 있다. 가족은 — 지금은 안전하다. 하지만 한도혁은 다음 수를 준비하고 있다. 이번에는 감시나 접근이 아니라 — 직접적인 행동.
