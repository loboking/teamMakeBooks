chapter_n: 69
overall: |
  이준이 가족 보호를 강화한 후 한도혁에게 직접 메시지를 보내 가족에게
  손대지 말라고 경고한다. 한도혁이 답장하며 "헌터 세계에 선 따위 없다"고
  선언한다. 이준이 협회에 한도혁의 가족 위협을 공식 신고하지만 증거 불충분.
  김태석이 완치 후 복귀하여 "백화 본사로 가자"고 하지만 이준이 말린다.
  윤새벽이 새로운 정보를 전달한다 — 한도혁이 S급만 들어갈 수 있는 깊은
  던전에서 무언가를 찾고 있다.

beats:
  - name: direct_warning
    instruction: |
      이 부분은 69화의 시작. 분량 2,000자 이상.
      - ch068의 다음 날. 아침. 이준이 밤새 생각했다. 한도혁의 감시자, 이서에 대한 접근, 어머니 시설 근처 대기. 한도혁은 이준의 가족을 압박 수단으로 사용하고 있다. 이것을 멈춰야 한다.
      - 이준이 한도혁에게 직접 메시지를 보낸다. 이번에는 윤새벽을 통하지 않고, 직접.
      - "한도혁 회장님. 가족에게 손대지 마십시오. 그건 선을 넘는 것입니다."
      - 1분 뒤. 한도혁의 답장.
      - "선? 재밌는 단어다. 강이준 씨. 헌터 세계에 선 따위 없어. S급 헌터와 F급 짐꾼 사이에 선이 있었나? 보유자와 일반인 사이에 선이 있었나? 아버지도 선을 지키려다 죽었어."
      - 이준의 주먹이 떨린다. 한도혁이 아버지를 언급했다.
      - 한도혁이 이어서 쓴다.
      - "네가 항복하면 모든 게 끝나. 가족도, 길드원도, 서동현도 모두 살려줄게. 항복하지 않으면... 내가 뭘 할지는 네가 상상하는 그대로야. 어머니. 여동생. 하나씩."
      - 이준이 답장을 친다. 손이 떨린다. 하지만 멈추지 않는다.
      - "한도혁 회장님. 한 가지 확실하게 말합니다. 가족에게 해를 입히면 — 저는 항복하지 않습니다. 전면전을 감수하겠습니다. 협회, 언론, 헌터 사회 전체에 한도혁의 범죄를 공개하겠습니다. USB에 있는 것만이 아닙니다. 보유자 수집, 장치 이식, 폭주 설계. 모든 것을."
      - 한도혁의 답장이 늦게 온다. 3분 뒤.
      - "전면전? 재밌다. 해봐. 협회가 네 편이 아니야. 언론은 한도혁의 손에 있어. 헌터 사회? 대한민국 헌터의 40%가 백화 산하야. 네가 싸우면 혼자 싸우는 거야."
      - 혼자. 한도혁의 말이 이준의 가슴에 꽂힌다. 혼자인가. 윤새벽이 있다. 김태석이 있다. 세린이 있다. 철혈 길드원들이 있다. 하지만 한도혁의 말대로, 대한민국 헌터의 40%가 백화 산하다. 이준이 한도혁과 전면전을 벌이면 — 협회조차 이준을 보호하기 어려울 수 있다.
      - 이준이 핸드폰을 내려놓는다. 깊은 숨을 쉰다.
      - 대응해야 한다. 직접적인 대응뿐 아니라, 공식적인 절차를 밟아야 한다. 협회에 신고. 한도혁의 가족 위협을 공식 기록에 남겨야 한다.
      - 오전 10시. 이준이 협회에 연락. 유수진에게.
      - "유수진 차장님. 한도혁 회장이 저의 가족을 위협했습니다. 공식 신고합니다."
      - 유수진: "위협? 구체적으로?"
      - 이준: "한도혁 회장이 '가족에게 손대겠다'고 메시지로 보냈습니다. 어머니 시설 근처에 감시자를 배치했고, 여동생 학교에 요원을 접근시켰습니다."
      - 유수진: "메시지를 보존했습니까?"
      - 이준: "네. 모두 보존했습니다."
      - 유수진이 잠시 침묵한다.
      - 유수진: "강이준 씨. 신고는 접수하겠습니다. 하지만... 솔직히 말씀드리면, 증거가 충분하지 않을 수 있습니다. 메시지는 직접적인 위협이 아니라 '간접적 압박'으로 해석될 수 있습니다. 감시자 배치와 학교 접근도 '우연'으로 치부될 수 있고요. 한도혁 회장이 '나는 그런 지시를 내린 적 없다'고 하면..."
      - 이준: "증거 불충분이라는 거죠."
      - 유수진: "...죄송합니다. 하지만 협회 내부에서 한도혁 회장의 영향력은 막강합니다. 이정호 이사를 통해서. 신고 기록은 남겠지만, 즉각적인 조치는 어려울 수 있습니다."
      - 증거 불충분. 한도혁이 메시지로 위협하지만, 직접적인 공격은 하지 않는다. "간접적 압박"은 법적으로 처벌하기 어렵다. 한도혁이 그 gap을 노리고 있다.
      - 마지막 줄: 이준이 협회에 신고했다. 증거 불충분. 한도혁의 "간접적 압박"은 법적으로 처벌할 수 없다. 이준은 공식적인 절차로 한도혁을 막을 수 없다. 협회도, 경찰도, 법도. 한도혁은 그 경계선을 정확하게 밟고 있다. 위협은 하되, 직접 공격은 하지 않는다. 압박은 하되, 증거는 남기지 않는다. 한도혁은 5년간 이 방법을 사용해 왔다. 강철민에게도, 박세진에게도, 이준의 아버지에게도. 그리고 지금 — 이준에게도.

  - name: taeseok_returns
    instruction: |
      이 부분은 69화의 중반. 분량 2,000자 이상.
      - 오후. 이준이 길드 사무실에 있다. 한도혁의 메시지와 협회의 무력한 대응. 이준은 다음 수를 고민하고 있다.
      - 문이 열린다. 김태석이 들어온다. 기브스를 뗐다. 얼굴에 흉터가 남아 있다. 정재훈의 공격 후유증. A급의 체력으로 회복했지만, 흉터는 남는다.
      - 김태석이 이준을 본다. 표정이 굳어 있다.
      - 김태석: "이준아. 소식 들었다."
      - 이준: "뭘요?"
      - 김태석: "한도혁이 네 가족을 위협했다고. 이서 학교에 사람을 보냈다고."
      - 이준: "네. 맞아요."
      - 김태석이 이준 앞에 선다. A급의 체구. 넓은 어깨. 단단한 눈빛.
      - 김태석: "이준아. 이제 기다리지 말자."
      - 이준: "무슨 말씀이에요?"
      - 김태석: "백화 본사로 가자."
      - 이준이 김태석을 본다. 김태석의 눈에는 결의가 있다. A급 헌터의 결의. 정재훈에게 당한 치욕을 되갚겠다는 의지.
      - 김태석: "기다릴 때 끝났어. 네가 B급이 됐고, 나도 완치했어. 이지수도 합류했고. 철혈은 이전보다 강해졌어. 백화 본사로 가서 한도혁과 직접 끝내자."
      - 이준: "길드장님..."
      - 김태석: "이준아. 한도혁이 네 가족을 위협했어. 이건 네가 혼자 감당할 일이 아니야. 길드원이다. 길드원의 가족이 위협받으면 길드 전체가 나서는 거야."
      - 이준이 김태석의 눈을 본다. 진심이다. 김태석은 이준을 진심으로 걱정하고 있다. 하지만 —
      - 이준: "길드장님. 감사합니다. 하지만 아직이에요."
      - 김태석: "아직? 언제까지 기다릴 거야? 한도혁이 이서를 직접 건드릴 때까지?"
      - 이준: "아닙니다. 기다리는 게 아니라, 시간이 더 필요한 거예요."
      - 김태석: "시간? 뭘 위한 시간?"
      - 이준이 잠시 침묵한다. 어디까지 말할 것인가. 윤새벽의 정보. 한도혁의 진짜 목적. S급 던전. 이것을 김태석에게 말할 것인가.
      - 이준: "길드장님. 한도혁의 목적이 '나를 항복시키는 것'이 아니에요."
      - 김태석: "뭔데?"
      - 이준: "한도혁은... 더 큰 것을 원해요. 한도혁이 나를 항복시키려는 건, 나를 '이용'하기 위해서예요. 보유자로서. 진명 시스템을 가진 헌터로서."
      - 김태석: "이용? 뭘?"
      - 이준: "아직 정확히는 모르겠어요. 하지만 한도혁이 던전에서 뭔가를 찾고 있어요. S급 전용 던전. 거기서 무언가를 얻으려고 해요. 그리고 저는... 그 재료 중 하나."
      - 김태석의 표정이 변한다. "재료"라는 단어에.
      - 김태석: "재료? 네가?"
      - 이준: "네. 한도혁이 5년간 보유자를 수집했어요. 강철민 씨, 박세진 씨, 아버지. 그리고 저. 한도혁이 보유자를 모으는 이유가 있어요. 보유자의 진명 시스템을 이용해서 뭔가를 하려는 거예요."
      - 김태석이 이준의 말을 곱씹는다. 천천히.
      - 김태석: "...그러면 한도혁의 본사를 공격하는 게 아니라, 한도혁이 던전에서 찾는 걸 먼저 파악해야 한다는 거야?"
      - 이준: "네. 한도혁의 목적을 파악하면, 한도혁을 막을 수 있는 방법이 보일 거예요. 지금 공격하면 한도혁이 목적을 달성하기 전에 방해할 수 있지만, 동시에 한도혁이 극단적인 선택을 할 수 있어요. 가족을... 직접."
      - 김태석이 한숨을 쉰다.
      - 김태석: "알겠다. 이준아. 네 판단을 믿을게. 하지만 한 가지 약속해. 한도혁이 가족에 직접 손대면 — 나는 기다리지 않는다. 그때는 백화 본사든 뭐든 간에 직접 간다."
      - 이준: "알겠습니다."
      - 김태석이 이준의 어깨를 잡는다. A급의 힘으로. 하지만 부드럽게.
      - 김태석: "이준아. 너 혼자 다 짊어지지 마. 길드가 있다. 내가 있다."
      - 이준이 고개를 끄덕인다. 길드. 동료. 이준은 혼자가 아니다.
      - 마지막 줄: 김태석이 복귀했다. A급의 전투력. "백화 본사로 가자"는 결의. 하지만 이준이 말렸다. 아직이 아니라고. 시간이 더 필요하다고. 한도혁의 목적을 파악해야 한다고. 김태석은 이준의 판단을 믿었다. 하지만 "한도혁이 가족에 직접 손대면 기다리지 않겠다"는 조건도 달았다. 이준에게 남은 시간은 얼마 없다. 한도혁의 "간접적 압박"이 언제 "직접적 공격"으로 변할지 모른다.

  - name: shadow_of_s_rank_dungeon
    instruction: |
      이 부분은 69화의 끝. 분량 2,000자 이상.
      - 밤. 이준이 길드 옥상에 서 있다. 진명 감지를 2km로 가동. 서울의 마나 반응이 스캔된다.
      - 핸드폰이 울린다. 윤새벽.
      - "이준아. 새로운 정보가 있어."
      - 이준: "뭔데요?"
      - 윤새벽: "한도혁이 던전에 갔어. S급 전용 던전. 경기도 가평. '심연의 제단'이라고 불리는 곳."
      - 심연의 제단. 이준은 그 이름을 들었다. S급 전용 던전. B급 이상은 입장할 수 없지만, S급만이 깊은 층에 접근할 수 있다. 대한민국에 3개뿐인 S급 전용 던전 중 하나.
      - 윤새벽: "한도혁이 2주 전에 등록했어. 심연의 제단. 혼자. 그리고..."
      - 윤새벽이 잠시 멈춘다.
      - 윤새벽: "협회 기록에 따르면, 한도혁은 지난 1년간 심연의 제단에 4번 들어갔어. 모두 혼자. 모두 S급 전용 구역까지 진입. 그리고 매번 — 같은 층에서 멈췄어."
      - 이준: "같은 층?"
      - 윤새벽: "37층. 심연의 제단은 50층까지 있어. 한도혁은 매번 37층에서 멈추고 돌아왔어. 37층에 뭔가가 있는 거야."
      - 이준이 생각한다. 37층. S급 전용 던전의 37층. S급 헌터가 4번이나 도전하고 매번 멈춘 곳. 거기에 무엇이 있을까.
      - 윤새벽이 이어서 쓴다.
      - "그리고 한 가지 더. 한도혁이 심연의 제단에 들어가기 전마다 — 보유자 수집 데이터를 검토했어. 협회 서버에 접근 기록이 있어. 한도혁이 '진명 시스템 보유자 마나 패턴 데이터'를 검색한 기록. 매번 던전에 들어가기 직전에."
      - 이준의 등줄기가 차가워진다.
      - 한도혁이 보유자 데이터를 검색하고, S급 던전에 들어간다. 보유자의 마나 패턴이 — 던전의 무언가와 연결되어 있다.
      - 윤새벽: "내 추측이야. 한도혁이 37층에서 찾는 건 — '진명 시스템 원본'이야."
      - 이준: "진명 시스템 원본?"
      - 윤새벽: "진명 시스템은 보유자가 각성할 때 생겨나는 거야. 하지만 그 근원은 어디 있을까? 시스템이 어디서 왔는지. 누가 만들었는지. 한도혁은 5년간 보유자를 연구하면서 그 질문에 대한 답을 찾고 있었어. 그리고 그 답이 — 심연의 제단 37층에 있을 가능성이 높아."
      - 진명 시스템의 근원. 시스템이 어디서 왔는지. 누가 만들었는지. 이준도 그 질문을 가지고 있었다. 진명 시스템을 각성한 이후, 이준은 늘 그 질문을 품고 있었다. "이건 뭐지? 왜 내게 생겼지?"
      - 윤새벽: "한도혁이 진명 시스템 원본을 찾으면 — 한도혁이 진명 시스템을 완성할 수 있어. 인공적으로. 보유자가 아닌 사람에게도 진명 시스템을 이식할 수 있게 될 수도 있어. 아니면 — 기존 보유자의 시스템을 강제로 제어할 수 있게 될 수도."
      - 이준의 마음이 무거워진다. 진명 시스템의 강제 제어. 한도혁이 보유자의 시스템을 제어할 수 있게 되면 — 이준의 진명 시스템도 한도혁의 수중에 들어간다.
      - 이준: "37층에 들어가려면 S급이어야 하나요?"
      - 윤새벽: "공식적으로는 그래. B급은 20층까지. A급은 30층까지. S급만 31층 이상에 접근 가능해."
      - B급은 20층까지. 이준은 B급이다. 37층에 갈 수 없다. 적어도 — 지금은.
      - 이준이 밤하늘을 본다. 별이 보인다. 서울의 밤하늘에서 별을 보기 어렵지만, 오늘은 맑다.
      - 시스템 메시지가 떠오른다.
      - [퀘스트 업데이트 — 한도혁의 최후통첩 / 단계 변경: 가족 보호 완료 → 한도혁의 목적 파악 / 새 목표: 한도혁이 심연의 제단 37층에서 찾는 것을 파악하라 / 진명 시스템 원본의 존재를 확인하라 / 보상: Lv8 진행도 +10% / 진명 시스템 진화 단서 해금]
      - [Lv8 진행도: 75% → 80%]
      - 80%. Lv8에 가까워지고 있다.
      - 마지막 줄: 한도혁의 목적이 드러나기 시작했다. 진명 시스템 원본. 심연의 제단 37층. S급 전용 던전. 한도혁은 5년간 보유자를 수집하고 연구하면서, 진명 시스템의 근원을 찾고 있었다. 그리고 그 근원을 찾으면 — 한도혁은 진명 시스템을 완성할 수 있다. 인공적으로. 강제로. 이준은 그것을 막아야 한다. 하지만 이준은 B급이다. S급 전용 던전에 들어갈 수 없다. 이준도 S급이 되어야 한다. 빠르게. 한도혁이 37층을 돌파하기 전에.
