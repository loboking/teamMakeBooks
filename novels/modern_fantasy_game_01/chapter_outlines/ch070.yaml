chapter_n: 70
overall: |
  2막 중간점. 이준이 윤새벽의 정보를 바탕으로 한도혁의 던전 활동을 조사하고,
  한도혁이 S급 전용 던전에서 진명 시스템 원본을 찾고 있다는 추론에 도달한다.
  이준이 S급 전용 던전 도전 가능성을 고민하지만 B급으로는 입장 불가.
  한도혁이 예고한 3일이 지났지만 직접 공격하지 않고 던전에 집중한다.
  이준이 한도혁의 진짜 목적을 파악 — 이준은 항복시킬 대상이 아니라 진명
  시스템 완성을 위한 재료. 이준도 S급이 되어야 한다는 결의를 다진다.

beats:
  - name: investigating_the_abyss
    instruction: |
      이 부분은 70화의 시작. 분량 2,000자 이상.
      - ch069의 다음 날. 오전. 이준이 길드 사무실에서 윤새벽의 정보를 정리하고 있다. 심연의 제단. S급 전용 던전. 경기도 가평. 50층. 한도혁이 4번 도전하고 매번 37층에서 멈춘 곳.
      - 이준이 협회 공개 데이터베이스에서 심연의 제단에 대해 검색한다. B급 헌터도 열람할 수 있는 기본 정보.
      - [심연의 제단 / 위치: 경기도 가평군 / 등급: S급 전용 / 층수: 50층 / 입장 조건: B급 이상 (20층까지), A급 이상 (30층까지), S급 (전층) / 현재 최고 기록: 42층 (한도혁, 2024년 3월) / 주의: 31층 이상은 S급 전용 구역. B급 및 A급 진입 불가.]
      - 최고 기록 42층. 한도혁. 하지만 윤새벽의 정보에 따르면, 한도혁은 최근 4번의 도전에서 모두 37층에서 멈췄다. 42층 기록은 과거의 것이다. 최근에는 37층에서 돌아왔다.
      - 왜? 37층에서 무엇이 변했는가? 아니면 — 37층에서 무엇을 발견했기에 더 이상 깊이 들어가지 않는 것인가?
      - 이준이 마나 해독을 가동. 고급화된 마나 해독. 협회 데이터베이스에 있는 심연의 제단 37층 관측 데이터를 분석한다. S급 헌터가 제출한 보고서. 감시 시스템이 수집한 마나 데이터.
      - [심연의 제단 37층 분석 / 마나 밀도: 극고 (A급 한계 초과) / 마나 구조: 비정형. 일반 던전과 다른 패턴 / 특이점: 37층 특정 구역에서 마나 주파수가 '진명 시스템 공통 주파수'와 87% 일치 / 추정: 37층에 진명 시스템과 관련된 구조물 존재]
      - 87% 일치. 진명 시스템 공통 주파수와. 이것은 — 37층에 진명 시스템과 관련된 무언가가 있다는 뜻이다.
      - 이준이 윤새벽에게 연락.
      - "협회 데이터베이스에서 37층 마나 분석 했어요. 진명 시스템 공통 주파수와 87% 일치."
      - 윤새벽: "87%... 그거 높아. 내가 가진 데이터로도 80% 이상은 처음 봐. 이준아, 내 추층이 맞아. 37층에 진명 시스템 원본이 있어."
      - 이준: "한도혁이 왜 37층에서 멈추는 거죠? 최고 기록이 42층인데."
      - 윤새벽이 잠시 생각한다.
      - 윤새벽: "두 가지 가능성이 있어. 첫째, 37층의 진명 시스템 구조물이 한도혁에게 '보유자의 마나'를 요구하고 있을 수 있어. 37층에 들어가려면 보유자의 마나가 필요한데, 한도혁은 보유자가 아니니까 매번 거기서 막히는 거야."
      - 이준: "둘째는?"
      - 윤새벽: "둘째, 한도혁이 37층에서 무언가를 발견했고, 그것을 '완성'하기 위해 보유자가 필요한 거야. 한도혁이 현재 보유자를 수집하는 이유. 강철민, 박세진, 네 아버지. 그리고 너. 한도혁이 보유자들을 모아서 37층의 무언가를 완성하려는 거야."
      - 이준의 머리가 차가워진다. 보유자 수집의 진짜 이유. 한도혁이 보유자를 연구한 것이 아니라 — 보유자를 '부품'으로 사용하려는 것이다.
      - 윤새벽: "이준아. 한도혁이 너를 항복시키려는 게 아니야. 너를 '가져가려는' 거야. 항복시켜서 자기 밑에 두는 게 아니라, 네 진명 시스템을 37층에서 사용하려는 거야."
      - 이준의 진명 시스템. 이것을 한도혁에게 빼앗기면 — 이준은 진명 시스템을 잃는다. 진명 감지, 마나 해독, 마나 차단, 진명 서명. 모든 능력을 잃는다.
      - 마지막 줄: 심연의 제단 37층. 진명 시스템 원본의 존재. 한도혁이 5년간 준비해 온 것. 보유자 수집. 장치 이식. 폭주 설계. 모든 것이 — 37층을 완성하기 위한 준비였다. 이준은 한도혁의 최종 목표를 파악하기 시작했다. 하지만 파악한 것은 아직 일부다. 37층에 정확히 무엇이 있는지. 한도혁이 어떻게 진명 시스템을 완성하려는지. 그리고 — 이준이 어떻게 막을 수 있는지. 답을 찾으려면, 이준은 37층에 가야 한다. 하지만 37층은 S급 전용 구역이다. B급은 20층까지.

  - name: three_days_passed
    instruction: |
      이 부분은 70화의 중반. 분량 2,000자 이상.
      - 오후. 이준이 한도혁의 "3일" 기한을 생각한다. ch065에서 한도혁이 "3일 안에 항복하라"고 했다. 지금은 5일째다. 기한이 지났다. 하지만 한도혁은 직접 공격하지 않았다.
      - 왜? 한도혁이 약속을 지킨 것인가? 아니면 — 한도혁에게 더 중요한 것이 생겼기 때문인가?
      - 윤새벽의 정보. 한도혁이 심연의 제단에 갔다. 2주 전에 등록. 지금쯤 던전 안에 있거나, 방금 나왔거나.
      - 이준이 윤새벽에게 메시지.
      - "한도혁이 지금 어디에 있어요?"
      - 윤새벽: "협회 기록 확인했어. 한도혁이 3일 전에 심연의 제단에 입장했어. 아직 퇴장 기록이 없어. 던전 안에 있어."
      - 한도혁이 던전 안에 있다. 3일째. 한도혁이 "3일 안에 항복하라"고 하고, 자신은 던전에 들어갔다. 이것은 — 한도혁에게 이준의 항복이 '급한 일'이 아니라는 뜻이다. 항복시키면 좋지만, 항복하지 않아도 상관없다. 한도혁의 진짜 목표는 37층이기 때문이다.
      - 이준이 한도혁의 전략을 이해하기 시작한다.
      - 한도혁의 1차 목표: 진명 시스템 완성 (37층)
      - 한도혁의 2차 목표: 이준 항복 (진명 시스템의 재료 확보)
      - 한도혁이 1차 목표에 집중하고 있다. 2차 목표는 1차 목표 달성 후에 처리해도 된다. 아니면 — 1차 목표를 달성하면 2차 목표는 자동으로 해결될 수도 있다. 진명 시스템을 완성하면, 이준의 항복 여부와 상관없이 이준의 시스템을 제어할 수 있게 되니까.
      - 이준이 시스템 메시지를 확인한다.
      - [퀘스트 진행 중 — 한도혁의 목표 / 단계 1 완료: 한도혁의 3일 기한 경과. 직접 공격 없음. / 단계 2: 한도혁의 진짜 목적 파악 — 진명 시스템 완성 / 단계 3: 대응 방법 수립 / 보상: Lv8 진행도 + 진명 시스템 진화 단서]
      - 이준이 김태석에게 연락.
      - "길드장님. 한도혁이 지금 던전에 있어요. 3일째. 그래서 직접 공격하지 않은 거예요."
      - 김태석: "던전? 미쳤나. 가족 위협해 놓고 자기는 던전에?"
      - 이준: "한도혁에게 가족 위협은 '부수적인' 거예요. 진짜 목표는 다른 거예요. 던전에서 뭔가를 찾고 있어요."
      - 김태석: "뭘?"
      - 이준이 잠시 망설인다. 진명 시스템 원본에 대해 말할 것인가. 김태석은 진명 시스템의 존재를 모른다. 이준은 자신의 능력을 "늦깎이 각성"과 "특수 능력"으로만 설명해 왔다.
      - 이준: "...제 능력과 관련된 거예요. 한도혁이 저의 능력의 근원을 찾고 있어요. 그래서 저를 원하는 거예요."
      - 김태석이 이준을 본다. 깊게.
      - 김태석: "...너의 능력의 근원?"
      - 이준: "네. 아직 자세히 말할 수 없어요. 하지만 한도혁이 던전에서 찾는 걸 제가 막아야 해요. 그러려면..."
      - 김태석: "그러려면?"
      - 이준: "더 강해져야 해요. S급이 되어야 해요."
      - 김태석이 멈춘다. S급. B급에서 S급. 그것은 — 불가능에 가까운 도약이다. 대한민국에 S급 헌터는 5명뿐이다.
      - 김태석: "S급... 이준아. 그건..."
      - 이준: "알아요. 어렵다는 거. 하지만 방법이 있어요. Lv8. 제 레벨이 오르면 능력이 진화해요. 마나 총량도 늘어나고. B급 상위에서 — A급에 도달할 수 있을 거예요. 그리고 A급에서 S급으로."
      - 김태석이 이준의 눈을 본다. 이준의 눈에는 — 두려움은 없다. 결의만 있다.
      - 김태석: "이준아. 네가 S급이 되면... 나보다 강해지는 거야?"
      - 이준: "모르겠어요. 하지만 — 한도혁을 막으려면 S급이 필요해요."
      - 김태석이 웃는다. 쓴웃음이 아니다. 진심으로 웃는다.
      - 김태석: "좋아. 내 제자가 S급이 되는 거야. 기대하마."
      - 마지막 줄: 한도혁의 "3일"이 지났다. 직접 공격은 없었다. 한도혁은 던전에 있다. 심연의 제단. 37층. 진명 시스템 원본. 이준은 한도혁의 진짜 목적을 파악했다. 이준은 한도혁의 최종 목표가 "이준 항복"이 아니라 "진명 시스템 완성"이라는 것을 이해했다. 이준은 항복시킬 대상이 아니라 — 진명 시스템 완성을 위한 재료. 한도혁이 던전에서 나오면 — 다시 이준에게 올 것이다. 이번에는 더 강력한 압박으로. 이준은 그때까지 준비해야 한다. S급으로. 빠르게.

  - name: the_path_to_s_rank
    instruction: |
      이 부분은 70화의 끝. 분량 2,000자 이상.
      - 밤. 이준이 길드 옥상에 서 있다. 서울의 야경. 마천루 사이로 마나 빛이 희미하게 스며 있다. 헌터만이 볼 수 있는 빛.
      - 이준이 자신의 상태를 점검한다.
      - Lv7. B급 상위. 마나 총량 8,200. 마나 밀도 2.3.
      - 능력: 진명 감지 2km, 마나 은폐, 마나 해독 (고급화, S급 데이터 판독), 진명 서명 (확대), 마나 차단 (100m, 5초).
      - S급이 되려면 — 마나 총량이 최소 A급 상위 (12,000 이상)이어야 하고, A급에서 S급으로 넘어가는 데는 엄청난 경험치가 필요하다.
      - 하지만 이준의 마나는 일반 헌터와 다르다. 진명 시스템의 마나. 마나 밀도 2.3. 일반 A급의 마나 밀도가 1.8인 것을 감안하면, 이준의 마나는 질적으로 이미 A급을 넘어서고 있다.
      - 문제는 총량이다. 총량이 B급 상위. 총량을 늘리려면 — 레벨업이 필요하다.
      - Lv8. Lv8에 도달하면 마나 총량이 증가한다. 얼마나 증가할지는 모르지만, 진명 시스템의 마나 밀도가 높은 것을 감안하면, Lv8에서 A급 하위~중위에 도달할 수 있을 것이다.
      - Lv9에서 A급 상위. Lv10에서... S급?
      - 이준이 시스템 메시지를 확인한다.
      - [Lv8 진행도: 80%]
      - 80%. 아직 20% 부족하다. Lv8에 도달하려면 더 많은 경험치가 필요하다. 던전 경험치. 전투 경험치. 그리고 — 시스템이 정의하는 "특별 이벤트" 경험치.
      - 이준이 심연의 제단을 생각한다. S급 전용 던전. B급은 20층까지. A급은 30층까지. 이준은 B급이니까 20층까지 갈 수 있다.
      - 20층에서 얻을 수 있는 경험치. 그것으로 Lv8에 도달할 수 있을까? 모르겠다. 하지만 — 시도해 볼 가치는 있다.
      - 그리고 — 심연의 제단 37층의 마나 데이터. 이준이 20층까지 가더라도, 37층의 마나 데이터를 원거리에서 감지할 수 있을지도 모른다. 진명 감지 2km. 마나 해독 고급화. 이 능력들을 활용하면, 37층에 접근하지 않고도 정보를 얻을 수 있다.
      - 이준이 윤새벽에게 마지막 메시지.
      - "심연의 제단. 저도 가겠습니다. B급 구역이지만, 정보를 수집할 수 있을 거예요."
      - 윤새벽: "위험해. 한도혁이 던전에서 나오면 너와 마주칠 수 있어."
      - 이준: "알아요. 하지만 가야 해요. 한도혁이 37층에서 무엇을 찾는지 직접 확인해야 해요."
      - 윤새벽: "...조심해. 한도혁이 던전 안에서는 S급 풀파워를 쓸 수 있어. 던전 안에서의 S급은 밖에서와는 다르거든."
      - 이준: "네."
      - 이준이 밤하늘을 본다. 진명 감지를 가동. 2km. 서울의 마나 반응.
      - 그리고 — 3km 거리. S급 반응. 한도혁. 백화 본사. 아직 던전에서 돌아오지 않았다. 아니 — 이것은 한도혁의 마나 반응이 아니다. 패턴이 다르다.
      - 이준이 concentration을 높인다. 마나 해독 고급화. 3km 거리. 해상도 극히 낮음.
      - [원거리 S급 반응 분석 / 거리: 3km / 마나 총량: S급 하위 / 마나 패턴: 한도혁과 유사하지만 다름 / 특이점: 진명 시스템 공통 주파수 92% 일치 / 추정: 한도혁이 아닌 다른 S급 보유자]
      - 이준의 숨이 멈춘다.
      - 92% 일치. 진명 시스템 공통 주파수. 한도혁과 유사하지만 다른 S급. 보유자.
      - 한도혁 이외에 S급 보유자가 있다. 대한민국에.
