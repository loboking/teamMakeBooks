chapter_n: 71
overall: |
  이준이 심연의 제단 B급 구역 도전을 준비한다. 한도혁이 37층에서
  돌아온다 — 5번째 도전도 실패. 한도혁이 이준의 B급 등록과
  심연의 제단 등록을 감지하고, 새로운 접근을 시도한다.
  이준이 길드원들에게 던전 출격을 알리고 준비를 마친다.

beats:
  - name: dungeon_registration
    instruction: |
      ch070의 다음 날. 오전. 이준이 협회에 심연의 제단 B급 구역 등록.
      B급 이상 헌터가 1~20층까지 진입 가능. 등록 시 이준의 B급 상위 등급 확인.
      협회 담당자가 경고 — "최근 한도혁 회장이 3일째 던전 내 체류 중입니다.
      돌아오면 출입 시간이 겹칠 수 있습니다."
      이준이 윤새벽에게 메시지. "한도혁이 아직 던전 안에 있어요?"
      윤새벽: "협회 기록에 퇴장이 찍혔어. 3일 만에 돌아왔어.
      근데... 이번에도 37층에서 돌아왔어."
      한도혁이 5번째 도전도 실패. 매번 37층에서 돌아온다.
      윤새벽: "한도혁이 이번에 돌아오면서 협회 기록을 검토했어.
      B급 헌터의 심연의 제단 등록 기록. 당신의 이름이 있었어."
      한도혁이 이준의 움직임을 감시하고 있다.

  - name: preparation
    instruction: |
      오후. 이준이 길드 사무실에서 던전 준비.
      김태석이 옆에서 지원. "혼자 가는 거야?"
      이준: "B급 구역이에요. 20층까지. 저 혼자 충분해요."
      김태석이 이준의 장비를 점검. 마나 포션, 에너지 바, 구급 키트.
      A급 길드장의 경험담. "심연의 제단은 일반 던전과 달라.
      마나 구조가 불안정해. 10층부터 몬스터 패턴이 예측 불가.
      15층부터는 마나 폭풍 구역이 있어."
      이준이 마나 해독으로 준비. 협회 데이터베이스에서
      1~20층의 몬스터 종류, 마나 밀도, 보스 정보 분석.
      세린이 메시지. "조심해. 마나 회로 70% 상태라 같이 못 가.
      하지만 밖에서 정보 지원할게."
      이지수가 말했다. "이준 씨. 저도 B급 구역 가본 적 있어요.
      10층에 함정이 있어. 바닥 마나 감지 함정.
      마나 감지로 미리 알 수 있어요."
      이지수의 경험이 도움이 된다. 백화 산하 길드 시절 심연의 제단 경험.

  - name: handohyuk_returns
    instruction: |
      오후 늦게. 이준의 핸드폰이 울린다. 모르는 번호.
      이준이 받는다.
      "강이준 씨. 한도혁입니다."
      한도혁이 직접 전화. 처음으로.
      한도혁: "심연의 제단에 등록했다고 들었어.
      B급 구역. 20층까지. 재밌네."
      이준: "...뭘 원하시죠?"
      한도혁: "등록하지 마. 지금은 아니야.
      네가 37층에 도달할 수 있는 등급이 되면 — 내가 직접 데려가 줄게.
      보유자의 마나가 필요한 곳이니까."
      한도혁이 37층에 보유자의 마나가 필요하다는 것을
      직접적으로 언급했다. 윤새벽의 추측이 맞았다.
      이준: "거절합니다."
      한도혁: "거절? 강이준 씨. 37층에 가면 네 능력의 근원을 알 수 있어.
      네 아버지도 그것을 알고 있었어. 강철민은 37층까지 갔어.
      그리고 — 돌아오지 못했어."
      이준의 숨이 멈추었다. 아버지가 심연의 제단에 갔었다?
      강철민이 37층에 갔었다? 그리고 돌아오지 못했다?
      한도혁이 전화를 끊었다.
      이준이 윤새벽에게 메시지. "아버지가 심연의 제단에 갔었다는 것을
      한도혁이 방금 말했어요. 아버지가 37층에 갔고 돌아오지 못했다고.
      이게 사실이에요?"
      윤새벽이 잠시 침묵한다.
      윤새벽: "...사실이야. 강철민은 5년 전 심연의 제단에 갔어.
      37층에서 마나 회로가 파괴되어 사망. 협회 기록에는
      '심연의 제단 37층 사고사'로 되어 있어.
      하지만 나는... 그게 사고가 아니라고 생각해."
      아버지의 죽음. 심연의 제단 37층. 한도혁이 관여했다.
      이준의 퀘스트가 갱신된다.
      [퀘스트 업데이트 — 아버지의 진실 / 새 단서:
      강철민이 심연의 제단 37층에서 사망 /
      사인: 마나 회로 파괴 (사고 처리) /
      한도혁 관여 의혹 /
      보상: Lv8 진행도 +5%]
