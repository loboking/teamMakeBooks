chapter_n: 72
overall: |
  이준이 심연의 제단에 입장한다. 1~10층 돌파.
  진명 감지와 마나 해독을 활용해 일반 B급 헌터와는 다른 방식으로
  던전을 진행한다. 10층에서 이지수가 말한 마나 감지 함정을
  진명 감지로 미리 발견하고 회피. 37층 마나 데이터 원거리 감지 시도.

beats:
  - name: abyss_entry
    instruction: |
      오전. 경기도 가평. 심연의 제단 입구.
      협회 관리 시설. B급 등록 헌터 대기실.
      이준 외에 B급 헌터 3명이 등록 대기 중.
      이준이 마나 은폐 유지한 채 대기. C급 수준으로 억제.
      관리 시설 직원이 안내. "강이준 씨. B급 상위.
      1~20층 구역. 시간 제한 6시간.
      20층 보스 처치 또는 6시간 경과 시 자동 퇴장."
      이준이 입구에 섰다. 검은 구멍. 마나의 소용돌이.
      진명 감지를 가동. 던전 내부 마나 구조 스캔.
      일반 던전과 확연히 다른 마나 패턴.
      이준이 입장.

  - name: floors_1_to_5
    instruction: |
      1~3층. B급 하위 몬스터. 이준이 진명 감지로 선제 행동.
      일반 B급 헌터라면 탐색+전투로 30분 걸리는 구간을 10분에 돌파.
      마나 해독으로 몬스터의 마나 패턴 분석. 약점 파악.
      이준의 전투 방식은 일반 헌터와 근본적으로 달랐다.
      힘으로 누르는 게 아니라 정보로 제압한다.
      4~5층. 마나 밀도 상승. B급 중위 몬스터 등장.
      이준이 근력 28 + 마나 해독 조합으로 효율적 처치.
      경험치가 빠르게 쌓인다.
      [Lv8 진행도: 85% → 87%]

  - name: floors_6_to_10
    instruction: |
      6~9층. 마나 구조 변화. 비정형 마나 구역 시작.
      이준이 마나 해독으로 비정형 구역의 패턴 분석.
      일반 B급 헌터에게는 보이지 않는 마나 흐름이 이준에게는 보인다.
      10층. 이지수가 경고한 마나 감지 함정 구역.
      바닥에 마나 센서가 내장되어 있고, 마나를 감지하면
      함정이 발동 — 천장 붕괴 + 마나 폭발.
      이준이 진명 감지로 함정 발견. 마나 은폐를 최대로 높여
      C급 수준으로 억제한 채 통과. 함정 미발동.
      10층 보스. B급 상위. 이준과 동급.
      전투. 진명 감지로 보스의 공격 패턴 예측.
      마나 차단 1회 사용 — 보스의 마나 차단(3.2초).
      보스 처치.
      [Lv8 진행도: 87% → 89%]
      이준이 10층에서 잠시 멈춘다. 진명 감지를 위로 향한다.
      11층. 12층. ...20층. 그 너머 37층.
      마나 해독 고급화로 37층 방향의 마나 데이터 원격 감지 시도.
      거리 약 500m (층간 추정). 해상도 매우 낮음.
      [37층 원격 마나 감지 / 거리: 추정 500m / 해상도: 극저 /
      마나 주파수: 진명 시스템 공통 주파수 감지 /
      특이점: 37층에서 규칙적인 마나 펄스 감지 /
      추정: 37층 구조물이 활성 상태]
      37층에서 규칙적인 마나 펄스. 구조물이 살아 있다.
      이준이 11층으로 진행.
