chapter_n: 73
overall: |
  이준이 심연의 제단 11~19층을 돌파한다. 15층에서
  마나 폭풍 구역을 진명 감지+마나 은폐로 통과.
  19층에서 한도혁의 흔적을 발견 — S급 마나 잔여.
  한도혁이 최근 이 구역을 통과했다. 20층 보스 직전.

beats:
  - name: floors_11_to_15
    instruction: |
      11~14층. 마나 밀도 급상승. B급 상위~A급 하위 수준의
      마나 환경. 일반 B급 헌터라면 12층에서 퇴각할 수준.
      이준은 진명 감지 + 마나 해독으로 안전 경로 탐색.
      15층. 마나 폭풍 구역.
      김태석이 경고한 구역. 불규칙한 마나 폭발이
      층 전체를 뒤덮고 있다. 마나를 사용하면 폭발 범위 확대.
      이준이 마나 은폐를 최대 가동. 마나 사용 완전 차단.
      마나 차단 능력이 아니라 마나 은폐 — 자신의 마나를
      외부에 노출시키지 않는 것. 폭풍 구역을 마나 없는 상태로 통과.
      진명 감지만으로 폭풍의 패턴 분석. 3분 간격으로
      마나가 잦아드는 틈이 있었다. 그 틈으로 이동.
      15층 돌파. 시간 소모 40분.
      [Lv8 진행도: 89% → 91%]

  - name: floors_16_to_19
    instruction: |
      16~18층. A급 하위 수준 마나 환경.
      몬스터 등급도 B급 최상위~A급 하위.
      이준이 처음으로 A급 수준의 적과 마주한다.
      전투. 이준의 근력 28 vs A급 하위 몬스터.
      정면 대결은 무리. 진명 감지로 약점 파악 + 기습 +
      마나 차단(4.1초) 조합으로 처치. 부상 경미.
      19층. 이준이 진명 감지로 층 전체 스캔.
      그리고 — 마나 잔여를 감지했다.
      S급의 마나 잔여. 한도혁의 마나 패턴.
      한도혁이 최근 이 구역을 통과했다.
      마나 잔여의 강도로 추정 — 2~3일 전.
      한도혁이 던전에서 나온 직후 이 구역을 통과?
      아니면 한도혁이 37층에서 돌아온 후 19층에서
      무언가를 했다?
      이준이 마나 해독으로 잔여 분석.
      [한도혁 마나 잔여 분석 / 위치: 19층 특정 구역 /
      잔여 강도: S급 / 시간 추정: 2~3일 전 /
      특이점: 마나 잔여에 미세한 변형 흔적 /
      추정: 한도혁이 19층에서 무언가를 조작]
      한도혁이 19층에서 무언가를 조작했다. 무엇을?
      [Lv8 진행도: 91% → 93%]

  - name: floor_20_boss_approach
    instruction: |
      20층 입구. B급 구역의 마지막 층.
      20층 보스: A급 하위. 일반 B급 헌터 퇴각 권고 구역.
      이준이 보스의 마나를 진명 감지로 스캔.
      [20층 보스 분석 / 등급: A급 하위 / 마나 총량: 추정 10,500 /
      마나 패턴: 공격 특화 / 약점: 마나 회로 노출 부위 (좌측 늑골) /
      추정 처치 시간: 15~20분]
      이준이 심호흡. A급 하위 보스. B급 상위인 이준에게는
      정면 승리가 불가능한 상대. 하지만 진명 감지와 마나 해독,
      마나 차단이 있다.
      이준이 보스 방으로 들어간다.
