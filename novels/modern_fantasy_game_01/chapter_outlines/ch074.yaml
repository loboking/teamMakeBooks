chapter_n: 74
overall: |
  이준이 20층 보스(A급 하위)와 전투. 마나 차단+진명 감지+기습
  조합으로 승리. Lv8 달성. 진명 시스템 대규모 진화 —
  마나 총량 A급 하위 도달, 새 능력 해금. 37층 원거리 감지
  성공. 한도혁이 37층에서 보유자 마나를 주입한 흔적 발견.

beats:
  - name: floor_20_boss_battle
    instruction: |
      20층 보스 방. A급 하위의 마나가 공간을 가득 채운다.
      보스: 거대한 마나 구조체. 인간형이 아닌 비정형 마나 생명체.
      전투 시작. 보스의 첫 공격 — 마나 충격파. 이준 회피.
      진명 감지로 보스의 공격 패턴 분석. 3가지 패턴:
      1) 마나 충격파 (3초 간격), 2) 마나 포밍 (7초 간격),
      3) 전방 마나 집중 (보스 HP 50% 이하 시).
      이준이 보스의 좌측 늑골 약점 노리기. 하지만 보스가
      약점을 보호하는 방어 패턴이 있다. 5초마다 1초간
      늑골 노출. 그 1초의 틈.
      이준이 마나 차단 타이밍 계산. 보스가 방어 패턴 전환 시
      마나 차단 가동 → 보스 마나 4.8초 차단 → 방어 붕괴 →
      약점 공격.
      1차 시도 실패. 마나 차단 쿨타임 60초 대기.
      2차 시도. 보스 HP 40%. 마나 차단 4.8초 → 약점 공격 →
      보스 HP 20%. 보스가 전방 마나 집중 패턴 발동.
      이준이 위기. 마나 집중에 휩쓸릴 뻔함.
      생존 본능 자동 발동. 30초간 감각 강화.
      보스의 전방 마나 집중 궤적 예측. 회피.
      3차 마나 차단. 보스 마나 차단 → 최종 공격.
      보스 처치. 시간: 23분. 부상: 우측 팔 골절.
      [Lv8 진행도: 93% → 100%]

  - name: level_8_evolution
    instruction: |
      보스 처치 직후. 시스템 메시지.
      [Lv8 달성]
      [진명 시스템 v2.0 진화 — Lv8]
      이준의 몸이 변한다. 마나가 폭발적으로 증가한다.
      B급 상위의 마나가 한 단계 도약한다.
      [마나 총량: 8,200 → 12,400 (+51%)]
      [마나 밀도: 2.3 → 2.8]
      [근력: 28 → 32]
      [민첩: 33 → 37]
      [지능: 25 → 28]
      [지혜: 22 → 25]
      [지구력: 14 → 18]
      마나 총량 12,400. A급 하위 범위 진입.
      마나 밀도 2.8. A급 상위를 넘어서는 수치.
      이준이 새 능력을 확인한다.
      [새 능력 해금]
      [진명 감지 — 심화: 2km → 5km / 보유자 구별 정밀화 /
      마나 잔여 추적 범위 확대]
      [마나 차단 — 강화: 100m → 200m / 5초 → 8초 /
      쿨타임 60초 → 45초]
      [진명 서명 — 진화: 200m → 500m /
      대상 마나 패턴 실시간 분석 가능]
      5km. 진명 감지 5km. 이전의 2배 이상.
      마나 차단 200m, 8초. S급의 마나도 8초간 차단 가능.
      이준이 우측 팔 골절을 확인. A급의 체력 회복 속도로
      30분 이내 치유 가능. 진명 시스템의 마나 회복도 가속.

  - name: thirty_seven_revelation
    instruction: |
      20층에서 37층 방향으로 진명 감지 확대. 5km.
      이전에는 불가능했던 거리. 이제 5km.
      마나 해독 고급화로 37층 마나 데이터 분석.
      해상도가 크게 향상되었다.
      [37층 원격 분석 (Lv8 진화 후) / 거리: 추정 800m /
      해상도: 중 / 마나 주파수: 진명 시스템 공통 주파수 94% 일치 /
      구조물 형태: 원형 마나 결계 /
      결계 내부: 다수의 마나 잔여 흔적 /
      특이점: 보유자 마나 주파수 4종 감지 /
      상태: 활성 — 규칙적 펄스 주기 변화]
      94% 일치. 그리고 — 보유자 마나 주파수 4종.
      강철민. 박세진. 이준의 아버지. 그리고 — 네 번째?
      네 번째 보유자의 마나 주파수. 이준의 것과 다르다.
      윤새벽의 것과도 다르다.
      그리고 — 한도혁의 마나 잔여도 감지.
      한도혁이 37층에서 보유자들의 마나를 구조물에 주입했다.
      4명의 보유자 마나. 한도혁이 37층의 구조물을
      완성하기 위해 보유자 마나를 사용하고 있었다.
      그리고 한도혁이 실패한 이유 — 한도혁은 보유자가 아니다.
      구조물에 보유자의 마나를 "외부에서" 주입하는 것은
      불완전한 방법이었다. 구조물이 요구하는 것은
      보유자의 "직접 접속"이다.
      이준이 이해한다. 한도혁이 이준을 원하는 이유.
      보유자를 항복시키는 게 아니라 — 37층에 직접 데려가서
      구조물에 접속시키려는 것이다.
      [퀘스트 업데이트 — 아버지의 진실 /
      단계 완료: 강철민 심연의 제단 37층 사망 확인 /
      새 사실: 37층에 보유자 마나 4종 주입 흔적 /
      한도혁이 보유자 마나로 구조물 완성 시도 /
      보상: Lv9 진행도 +10% / 진화 단서]
      [Lv9 진행도: 0% → 10%]
