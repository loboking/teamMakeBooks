chapter_n: 75
overall: |
  이준이 심연의 제단에서 퇴장. Lv8 진화 후 첫 일상 복귀.
  한도혁이 이준의 Lv8 달성을 감지하고, 새 A급 부하를
  이준에게 보낸다. 이준과 새 A급 부하의 첫 대치.
  A급 전투력 차이를 실감하지만, 마나 차단(200m/8초)으로
  견제. 철혈 길드원들이 이준의 새 전투력을 목격.

beats:
  - name: returning_from_abyss
    instruction: |
      이준이 20층 보스 처치 후 자동 퇴장.
      경기도 가평. 오후 4시. 입구 관리 시설.
      우측 팔 골절은 진명 시스템 마나 회복으로 어느 정도 치유.
      관리 시설에서 이준의 등급 재확인.
      "강이준 씨. 20층 보스 처치 확인.
      등급 변동이 감지됩니다. 재측정이 필요할 수 있습니다."
      이준이 거절. "나중에 하겠습니다."
      이준이 서울로 이동. 택시 안에서 진명 감지 5km 가동.
      서울의 마나 반응이 훨씬 넓은 범위로 스캔된다.
      한도혁 S급 반응. 백화 본사. 3km 이내에서 명확하게 감지.
      A급 반응 4개. 이전에는 3개였다. 하나가 늘었다.
      새 A급 반응. 백화 본사 인근. 이중 회로 특징.
      새 A급 부하. ch065에서 원거리로 감지했던 존재.
      그리고 — 4km 거리. S급 반응. 한도혁과 다른 패턴.
      어젯밤 감지한 S급 보유자. 여전히 존재.

  - name: new_a_rank_encounter
    instruction: |
      오후 6시. 이준이 서울에 도착. 길드 방향 이동 중.
      진명 감지에서 변화. 새 A급 반응이 이동하고 있었다.
      이준을 향해. 속도가 빨랐다. A급의 이동 속도.
      이준이 걸음을 멈춘다. 골목. 인적이 드문 구역.
      새 A급 부하가 나타났다. 키 185cm. 검은 정장.
      마나 억제 상태. 하지만 이중 회로가 감지되었다.
      한도혁의 새 부하. ch065에서 감지했던 존재.
      부하: "강이준 씨. 한도혁 회장님의 메시지를 전해 달라고."
      이준: "...무슨 메시지?"
      부하: "'Lv8 축하한다. 하지만 37층에 올 생각은 마라.
      네가 가기 전에 내가 먼저 간다. 그리고 네 아버지와 같은
      결말을 맞이하게 해주마.'"
      이준의 눈이 차가워진다.
      부하: "그리고 한 가지 더. 회장님이 직접 테스트를 원하셨어.
      Lv8이 된 강이준 씨가 얼마나 강해졌는지."
      부하가 마나 억제를 해제했다. 이중 회로의 마나가 폭발한다.
      A급 상위. 한도혁의 다른 부하들보다 강했다.
      시스템 설계자가 직접 마나 이식한 부하. 마나 패턴이
      인공적이었다. 자연 마나와 달랐다.

  - name: first_a_rank_combat
    instruction: |
      전투. A급 상위 vs B급 상위(마나 총량 A급 하위).
      부하의 첫 공격. 마나 충격파. 이준 회피.
      A급 상위의 속도. 이준의 민첩 37로도 간신히 따라가는 수준.
      이준이 진명 감지로 부하의 공격 패턴 분석.
      이중 회로의 마나 구조. 보통 헌터와 다르다.
      마나 회로가 2개. 하나는 자연 마나, 하나는 이식 마나.
      두 회로가 동시에 가동되면 A급 상위 전투력.
      하지만 — 동기화에 시차가 있다. 0.3초.
      이준이 그 시차를 노린다.
      부하의 공격. 이준 회피. 0.3초 후 반격 타이밍.
      이준의 공격이 부하의 가드를 뚫는다. 경미한 타격.
      부하가 놀란다. "B급이 나를 맞추다니."
      이준이 마나 차단을 계산. 200m, 8초. A급 상위도 차단 가능.
      마나 차단 가동. 부하의 마나가 8초간 차단된다.
      이중 회로 양쪽 모두 차단. 부하가 경악.
      "이건... 마나 차단? B급이 이런 능력을?"
      8초 동안 이준이 공격. 근력 32 + 기습.
      부하에게 타격. 하지만 A급 상위의 체력. 8초로는 부족.
      마나 차단 해제. 부하가 반격.
      이준이 우측 팔 골절 부위에 충격. 통증.
      부하가 압박. 이준이 밀린다.
      그때 — 길드 방향에서 마나 반응.
      김태석. A급. 이준을 쫓아온 것이다.
      김태석이 골목에 나타났다. A급의 마나를 풀어놓는다.
      "이준아. 괜찮아?"
      부하가 김태석을 보았다. A급 vs A급 상위.
      하지만 김태석은 정재훈과의 전투 후유증(흉터)이 있다.
      부하: "A급 길드장. 관계없어. 회장님의 테스트야."
      부하가 마나 가동. 이중 회로 풀가동.
      이준과 김태석 vs 부하 1명.
      [퀘스트 진행 중 — 새 A급 부하와의 조우 /
      A급 상위 전투력 확인 / 마나 차단 200m·8초 실전 검증 /
      보상: Lv9 진행도 +5%]
      [Lv9 진행도: 10% → 15%]
