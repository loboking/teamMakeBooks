chapter_n: 77
overall: |
  윤새벽이 강남구에서 S급 보유자를 접촉한다. 정체:
  도서윤(22세 여, F급 표면, v1.9 보유자). 윤새벽이 이준에게
  도서윤의 정보를 전달. 한도혁이 도서윤도 추적 중.
  서동현의 위치를 윤새벽이 최종적으로 파악 — 인천에서 생존 확인.

beats:
  - name: yoon_saebek_contact
    instruction: |
      다음 날 오전. 윤새벽이 강남구 상업 지구 건물에 도착.
      진명 감지 v1.3으로 S급 보유자 마나 감지.
      건물 15층. 한강 뷰 오피스.
      윤새벽이 마나 은폐를 유지한 채 접근.
      문 앞에서 멈춘다. 문이 열려 있었다.
      안에 한 사람이 앉아 있었다. 22세 정도의 여성.
      갈색 긴 머리. 날카로운 눈. 허리까지 내려오는 검은 코트.
      표정은 무표정. 감정을 읽을 수 없는 얼굴.
      윤새벽이 마나를 풀었다. D급 수준.
      여성이 윤새벽을 보았다. "누구야?"
      윤새벽: "나도 같은 보유자야. v1.3."
      여성의 눈이 미세하게 변했다. 하지만 곧 무표정으로 돌아간다.
      여성: "v1.3? 윤새벽?"
      윤새벽이 놀랐다. 여성이 윤새벽의 이름을 알고 있었다.
      여성: "한도혁이 보유자 목록을 가지고 있어.
      나도 그 목록에 있으니까. v1.9. 도서윤."
      도서윤. 22세. v1.9. 알려지지 않은 다섯 번째 보유자.
      윤새벽: "한도혁이 널 추적하고 있어. 알고 있어?"
      도서윤: "알아. 2년 전부터. 하지만 한도혁이 나를 직접
      건드리지 않아. 내가 S급이니까."
      S급. 도서윤이 S급이었다. 표면 F급이지만
      실전 전투력 S급. 이준과 마찬가지로 극단적 은폐.
      윤새벽: "협력해. 한도혁을 막으려면 보유자들이
      모여야 해."
      도서윤이 잠시 침묵한다.
      도서윤: "협력? 무슨 목적으로?"
      윤새벽: "37층. 심연의 제단. 한도혁이 거기서 뭔가를
      완성하려고 해. 보유자들을 이용해서."
      도서윤의 눈이 변했다. 처음으로 감정이 보였다.
      도서윤: "...37층. 나도 알아. 한도혁이 2년 전에
      나한테 같은 제안을 했어. 37층에 같이 가자고.
      거절했어."
      윤새벽: "왜?"
      도서윤: "내 직감이었어. 37층에 가면 돌아오지 못할 거라고.
      강철민도 그랬잖아."
      강철민을 알고 있었다. 도서윤이 강철민의 죽음에 대해
      무언가 알고 있는 것 같았다.

  - name: dogyeol_information
    instruction: |
      윤새벽이 도서윤에게 이준의 존재를 알린다.
      윤새벽: "v2.0 보유자가 있어. 강이준.
      B급 표면이지만 실전 A급 하위. 최근 Lv8 달성.
      한도혁이 그를 노리고 있어."
      도서윤: "v2.0? 강이준? ...강철민의 아들이잖아."
      윤새벽이 놀랐다. 도서윤이 이준의 가족 관계를 알고 있었다.
      도서윤: "나는 강철민을 알았어. 5년 전.
      그가 죽기 전에 한 번 만난 적이 있어."
      윤새벽: "만났어? 강철민을?"
      도서윤: "한도혁이 주선한 모임이었어. 보유자들만 참석.
      강철민, 박세진, 나. 그리고 한도혁.
      한도혁이 '보유자 협력'을 제안했어.
      강철민과 박세진이 거절했어. 나도 거절.
      한 달 후 강철민이 죽었어. 심연의 제단에서."
      5년 전의 모임. 한도혁이 보유자들에게 접근.
      강철민, 박세진, 도서윤. 세 명 모두 거절.
      한 달 후 강철민 사망. 2년 후 박세진 사망.
      도서윤만 살아남았다. S급이어서.
      윤새벽: "서동현은 어때? 그도 한도혁이 추적하고 있어."
      도서윤: "서동현? 백화 정보수집팀장?
      그 사람은... 나한테 연락이 왔었어. 1년 전.
      한도혁의 범죄 증거를 가지고 있다고.
      나한테 보호를 요청했어."
      윤새벽: "그래서?"
      도서윤: "내가 거절했어. 한도혁의 표적이 되기 싫었어.
      하지만... 후회하고 있어."
      윤새벽이 이준에게 메시지.
      "도서윤 정보 전달. v1.9, S급, 22세 여.
      5년 전 한도혁 보유자 모임 참석.
      강철민 사망 전 만남. 서동현에게 연락 온 적 있음.
      한도혁의 37층 계획 일부 알고 있을 가능성.
      협력 가능성: 보통. 자기 보호 우선.
      그리고 한 가지 — 서동현 위치.
      도서윤이 서동현에게 연락한 적이 있다고 했어.
      그 연락처가 아직 유효하면 서동현 위치를 추적할 수 있어."
      이준: "서동현... 아직 살아 있어?"
      윤새벽: "살아 있을 가능성이 높아.
      도서윤이 1년 전에 연락 받았으니까.
      내가 서동현 추적을 시작할게."
      [Lv9 진행도: 18% → 20%]

  - name: dogyeol_decision
    instruction: |
      윤새벽이 떠난 후. 도서윤이 혼자 남았다.
      강남구 오피스. 한강 뷰.
      도서윤이 창밖을 본다.
      도서윤이 혼잣말을 한다. "강철민의 아들.
      v2.0. 한도혁이 5년간 찾아온 것."
      도서윤이 핸드폰을 든다. 저장된 번호.
      서동현의 번호. 1년 전 받은 연락처.
      도서윤이 망설인다. 한도혁의 표적이 되는 것이 두렵다.
      하지만 강철민이 죽었다. 박세진이 죽었다.
      다음은 이준일 수 있다.
      도서윤이 번호를 누른다.
      통화 연결음. 1번. 2번. 3번.
      "여보세요?"
      서동현의 목소리. 살아 있었다.
      도서윤: "서동현 씨. 도서윤이에요.
      1년 전에 연락했던 사람이에요."
      서동현: "...도서윤? 당신이 연락한 건 1년 전이잖아요.
      왜 지금 전화해?"
      도서윤: "강이준 씨를 도와야 해요.
      당신도 도와야 해요. 한도혁이 당신을 찾고 있어요."
      서동현이 침묵한다.
      서동현: "...알겠어요. 만나요."
      [Lv9 진행도: 20% → 22%]
