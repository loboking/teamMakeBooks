chapter_n: 78
overall: |
  서동현이 인천에서 발견된다. 이준과 윤새벽이 인천으로 이동.
  서동현이 보유한 한도혁의 37층 계획 상세 정보를 전달.
  한도혁이 37층 구조물을 완성하려면 "4명의 보유자 동시 접속"이
  필요하다는 사실이 밝혀진다. 도서윤이 협력을 수락.

beats:
  - name: finding_donghyun
    instruction: |
      오후. 도서윤이 서동현의 위치를 파악했다.
      인천 남동구. 고시원. 서동현이 2주간 숨어 있었다.
      이준과 윤새벽이 인천으로 이동.
      이준이 기차 안에서 진명 감지 5km 가동.
      서울의 마나 반응이 멀어지고, 인천의 마나 반응이 잡힌다.
      인천에 A급 반응 1개. 백화 산하 추정. 서동현을 추적 중인
      가능성.
      윤새벽: "백화가 서동현을 찾고 있어. A급 1명 배치.
      인천 남동구. 서동현 위치와 500m 이내."
      이준: "빨리 가야 해요."
      이준과 윤새벽이 인천 남동구에 도착.
      고시원. 낡은 건물. 3층.
      이준이 진명 감지로 건물 내부 스캔.
      서동현 마나 반응 — D급. 건물 2층.
      그리고 300m 거리. A급 반응이 접근 중.
      이준이 윤새벽에게 신호. 윤새벽이 A급 반응을
      측면에서 견제. A급 vs A급은 아니다. 윤새벽은
      C급 상위~B급 하위 수준. 하지만 마나 은폐 특화.
      윤새벽이 A급의 주의를 분산. 이준이 서동현에게 접근.
      2층. 서동현이 방에 있었다. 40대 중반 남성.
      수염이 길렀다. 2주간의 도피 생활이 얼굴에 새겨져 있었다.
      이준: "서동현 씨."
      서동현이 이준을 보았다. 눈이 붉어졌다.
      서동현: "이준 씨... 살아 있었구나."

  - name: thirty_seven_plan
    instruction: |
      서동현이 이준과 윤새벽을 방 안으로 들인다.
      좁은 방. 침대 하나. 책상 위에 서류 뭉치.
      서동현: "한도혁이 내가 USB를 넘겼다는 걸 알았어.
      2주 전에 해고당하고, 그날부터 숨어 다녔어.
      백화가 나를 죽이려고 해."
      이준: "USB는 안전하게 보관하고 있어요."
      서동현이 고개를 끄덕인다.
      서동현: "이준 씨. 내가 한 가지 더 알려줄 게 있어.
      USB에 없는 정보야."
      이준이 서동현을 본다.
      서동현: "한도혁의 37층 계획. 구체적인 내용."
      서동현이 책상 위 서류 중 하나를 펼쳤다.
      한도혁의 내부 문서. 서동현이 백화에서 복사한 것.
      "한도혁은 37층 구조물을 완성하려고 해.
      그 구조물은 — '진명 시스템 통합 장치'야.
      보유자들의 시스템을 하나로 연결하는 장치.
      4명의 보유자가 동시에 구조물에 접속하면 —
      한도혁이 모든 보유자의 진명 시스템을 제어할 수 있게 돼."
      이준의 등줄기가 차가워졌다.
      4명. 동시 접속. 강철민, 박세진, 이준의 아버지.
      그리고 이준. 한도혁이 4명의 보유자를 모아서
      37층에 데려가려는 이유.
      서동현: "하지만 강철민과 박세진은 죽었어.
      그래서 한도혁이 '대체'를 찾고 있어.
      새로운 보유자. 윤새벽과 도서윤."
      윤새벽이 이 말을 듣고 있었다.
      서동현: "한도혁이 필요한 보유자: 총 4명.
      현재 확보: 이준(대상), 윤새벽(추적 중), 도서윤(추적 중).
      4번째 — 한도혁이 보유자 사체에서 마나를 추출할 수 있어.
      강철민과 박세진의 사체 마나. 이미 추출 완료 추정.
      그러면 한도혁에게는 3명의 생존 보유자만 더 필요해.
      이준, 윤새벽, 도서윤."
      이준: "사체 마나 추출이라니..."
      서동현: "한도혁이 5년간 준비한 기술이야.
      보유자가 죽어도 시스템은 사라지 않아.
      사체에서 마나를 추출해서 구조물에 주입할 수 있어.
      강철민의 시스템 v1.0과 박세진의 시스템 v1.7.
      둘 다 이미 추출되었을 가능성이 높아."
      [Lv9 진행도: 22% → 25%]

  - name: alliance_expansion
    instruction: |
      이준이 윤새벽을 본다.
      윤새벽: "...나도 대상이었구나."
      이준: "윤새벽 형님. 도서윤 씨에게도 알려야 해요.
      도서윤 씨도 대상이에요."
      윤새벽: "도서윤한테는 내가 연락할게."
      윤새벽이 도서윤에게 전화. 서동현의 정보를 전달.
      도서윤의 답장.
      "알았어. 한도혁이 2년 전에 나한테 37층 제안을 했을 때,
      그때도 4명이 필요하다고 했어.
      나는 거절했지만... 한도혁이 포기하지 않은 거야.
      그리고 지금 — 이준이라는 v2.0이 나타났어.
      한도혁에게 마지막 조각."
      도서윤이 잠시 침묵한 뒤 이어서 말했다.
      "협력할게. 조건이 있어."
      윤새벽: "조건?"
      도서윤: "한도혁이 37층에 나보다 먼저 도달하면 —
      나는 도망칠 거야. 협력은 37층 한도야.
      내 목순은 내가 지킨다."
      윤새벽이 이준을 본다. 이준이 고개를 끄덕인다.
      이준: "수락합니다."
      보유자 연합: 이준(v2.0), 윤새벽(v1.3), 도서윤(v1.9).
      세 명의 생존 보유자. 한도혁이 노리는 세 명.
      그리고 한도혁은 이미 강철민(v1.0)과 박세진(v1.7)의
      사체 마나를 추출했다.
      한도혁에게는 이제 3명만 더 필요하다.
      카운트다운이 시작됐다.
      [퀘스트 업데이트 — 보유자 연합 /
      동맹 확장: 윤새벽(v1.3), 도서윤(v1.9) /
      한도혁의 37층 계획: 4명 보유자 동시 접속 /
      사체 마나 추출: v1.0(강철민), v1.7(박세진) 추정 완료 /
      대상: 이준, 윤새벽, 도서윤 /
      보상: Lv9 진행도 +10%]
      [Lv9 진행도: 25% → 35%]
