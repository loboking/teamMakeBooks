chapter_n: 79
overall: |
  이준이 보유자 연합과 함께 한도혁의 다음 수를 대비한다.
  도서윤이 한도혁의 37층 구조물에 대해 추가 정보를 제공.
  세린이 마나 회로 복원 완료 — 전투 복귀 가능.
  한도혁이 새로운 움직임을 보인다 — 백화 산하 길드 통합 지시.
  전면전 준비가 시작된다.

beats:
  - name: dogyeol_intel
    instruction: |
      다음 날. 이준, 윤새벽, 도서윤이 만나는 장소.
      강남구 도서윤의 오피스. 3명의 보유자가 처음으로 한 자리에.
      도서윤이 정보를 공유한다.
      "한도혁이 37층 구조물에 대해 내가 아는 건 이거야.
      구조물은 '진명 시스템 통합 장치'.
      4명의 보유자가 동시에 접속하면 활성화.
      활성화되면 — 한도혁이 '관리자 권한'을 얻어.
      모든 진명 시스템 보유자의 시스템을 원격 제어.
      마나 차단, 마나 억제, 시스템 강제 비활성.
      모든 게 가능해져."
      이준: "관리자 권한이라니... 그건 시스템 설계자가
      한도혁에게 준 거잖아."
      도서윤: "맞아. 한도혁은 시스템 설계자와 직접 연결되어 있어.
      한도혁의 마나 코어에 제3의 마나 흐름.
      그게 시스템 설계자와의 연결 통로야."
      윤새벽: "시스템 설계자가 뭔데 한도혁에게
      이런 권한을 주는 거야?"
      도서윤: "모르겠어. 하지만 한 가지 알아.
      한도혁이 시스템 설계자와 처음 접촉한 건 7년 전이야.
      그때부터 한도혁이 변했어. 보유자에 집착하기 시작했어."
      7년 전. 강철민이 죽기 2년 전.
      시스템 설계자가 한도혁에게 접근한 것.

  - name: serin_returns
    instruction: |
      이준의 핸드폰이 울린다. 세린.
      "이준 씨. 마나 회로 복원 완료했어.
      2주 만에. 치유사 치료 + 자연 회복."
      이준: "세린 언니. 전투 가능?"
      세린: "전투력 90%. 마나 회로 손상 부위는
      아직 완전하지 않지만, B급 전투는 충분해."
      세린 복귀. 암살자의 눈이 돌아온다.
      이준이 세린에게 상황 설명. 보유자 연합. 도서윤.
      서동현 구출. 한도혁의 37층 계획.
      세린: "도서윤. v1.9, S급? ...백화가 2년간 찾았던 사람?"
      이준: "맞아."
      세린: "백화 내부 정보망에 도서윤에 대한 소문이 있었어.
      '백화가 건드리지 않는 S급'. 한도혁도 직접
      건드리지 않았다는 뜻이었어. 이제 왜 협력하겠다고?"
      이준: "한도혁이 37층 계획을 실행하면
      도서윤 씨도 대상이에요."
      세린: "...알겠어. 믿어."
      세린이 복귀. 철혈 길드의 전투력이 회복된다.
      이준 + 세린 + 김태석 + 이지수 + 박동현 + 김하늘 + 이명호.
      그리고 보유자 연합: 윤새벽 + 도서윤.
      [Lv9 진행도: 35% → 37%]

  - name: handohyuk_preparation
    instruction: |
      밤. 이준이 진명 감지 5km 가동.
      한도혁 S급 반응. 백화 본사. 움직이지 않고 있다.
      하지만 — 백화 전체의 움직임이 달라졌다.
      A급 반응 4개 → 6개로 증가.
      B급 반응 수십 개가 서울 곳곳에서 이동하고 있었다.
      한도혁이 무언가를 지시하고 있다.
      윤새벽에게 메시지.
      윤새벽: "백화 움직임 이상해. 산하 길드들에게
      긴급 소집 지시가 내려간 것 같아.
      한도혁이 뭔가 준비하고 있어."
      도서윤에게 메시지.
      도서윤: "나도 감지했어. 한도혁이 움직이고 있어.
      전면전 준비일 가능성이 높아."
      이준이 김태석에게 연락.
      김태석: "알겠다. 길드원들에게 비상 대기 지시할게.
      이지수한테도 연락해."
      이준이 시스템 메시지를 확인.
      [퀘스트 진행 중 — 보유자 연합 /
      동맹: 윤새벽, 도서윤, 세린 복귀 /
      한도혁 동향: 긴급 소집 + A급 증원 /
      예상: 전면전 준비 /
      보상: Lv9 진행도 + 진화 단서]
      [Lv9 진행도: 37% → 40%]
      이준이 밤하늘을 본다.
      보유자 3명. 철혈 길드원 6명. 협회 동맹 2명.
      한도혁에 대항할 수 있는 세력이 모이고 있다.
      하지만 한도혁은 S급. 대한민국 헌터의 40%가 백화 산하.
      이 준비가 충분할지 모르겠다.
      그리고 — 시스템 설계자.
      한도혁 뒤에 있는 정체불명의 존재.
      한도혁에게 진명 시스템 관리자 권한을 약속한 존재.
      이 준비의 끝에 무엇이 기다리고 있는지.
