chapter_n: 81
overall: |
  3막 개막. 기자회 다음 날 아침. 한도혁이 실제 움직임을 시작한다.
  새 A급 부하 이식 회로 수리 완료(불완전 80%).
  백화 산하 길드들이 심연의 제단 주변에 배치되기 시작한다.
  이준이 진명 감지로 이를 파악하고 도서윤에게 긴급 심연 등록을 지시한다.
  한도혁이 이준에게 직접 전화 — "37층을 아느냐?"
  이준이 내일 출발을 결정한다.

beats:
  - name: morning_detection
    instruction: |
      기자회 다음 날 아침. 이준이 길드 사무실에서 진명 감지 5km 가동.
      한도혁 세력의 이동을 감지한다.
      A급 6개 마나 반응 + B급 수십 개가 서울 남쪽으로 이동 중.
      방향 — 심연의 제단.
      이준이 분석: "한도혁이 심연 주변을 봉쇄하려고 해요."
      한도혁이 기자회 직후 움직임을 시작한 것 —
      37층 도달 전에 최대한 세력을 모으고, 심연 접근을 차단하려는 의도.
      새 A급 부하 마나 감지: 이식 회로 수리 완료. 하지만 마나 패턴 불안정.
      수리율 80% 추정 — 완전한 상태가 아니다.
      이준: "부하가 수리됐어요. 하지만 완벽하진 않아요.
      싸우면 회로가 다시 균열될 수 있어요."
      김태석: "그래도 A급은 A급이야."
      이준: "맞아요. 그래서 시간이 없어요."

  - name: urgent_registration
    instruction: |
      이준이 도서윤에게 전화.
      "도서윤 씨. 한도혁이 움직이기 시작했어요.
      심연의 제단 주변에 A급 6명 배치 중이에요.
      오늘 등록하셔야 합니다."
      도서윤: "알겠어. 지금 출발."
      오후. 도서윤이 심연의 제단에 도착. S급 등록 완료.
      심연 관리소 직원이 도서윤의 등급을 확인하며 긴장한다.
      도서윤이 31층 구역 진입 신청.
      관리소: "내일 오전 8시 진입 가능합니다.
      현재 S급 구역 예약은 — 백화에서 선점 중입니다."
      이준: "백화가 선점?"
      관리소: "네. 한도혁 회장님께서
      이번 주 S급 구역 예약을 전부 취소하셨습니다.
      오늘 오후에 갑자기요."
      도서윤이 이준에게 보고.
      도서윤: "한도혁이 예약을 다 가져갔어.
      내일 아침만 진입 가능해."
      이준: "그러면 내일 아침이에요.
      한도혁이 6번째 도전을 시작하기 전에."

  - name: handohyuk_call
    instruction: |
      저녁. 이준이 길드 옥상에서 진명 감지를 가동 중.
      핸드폰이 울린다. 모르는 번호.
      이준이 받는다.
      한도혁: "기자회 봤나?"
      이준: "봤습니다."
      한도혁: "50%가 나를 따르게 될 거야.
      그리고 넌 — 따르지 않겠지?"
      이준: "아닙니다."
      한도혁: "37층을 아느냐?"
      침묵.
      한도혁: "네가 아는 것보다 내가 더 많이 알아.
      37층 구조물이 뭔지. 어떻게 완성되는지.
      그리고 — 완성되면 누가 통제하는지."
      이준: "알고 있다면 왜 5번이나 실패했습니까?"
      한도혁: "보유자가 없었으니까.
      하지만 이제 — 네가 있잖아."
      이준: "..."
      한도혁: "네가 나를 따르면 —
      37층을 함께 완성하자.
      보유자 4명이 모이면 구조물이 열려.
      그러면 시스템 전체가 내 손에 들어오고,
      너는 그 안에서 살 수 있어."
      이준: "거절합니다."
      한도혁: "그러면 경쟁이야.
      네가 먼저 37층에 가든 — 내가 먼저 가든.
      결과는 같아. 시스템은 한 명만 선택해."
      통화 종료.
      이준이 핸드폰을 내려놓는다.
      한도혁이 37층에 대해 모든 것을 알고 있다.
      그리고 이준이 보유자라는 것도.
      경쟁이 시작됐다.

  - name: departure_decision
    instruction: |
      이준이 윤새벽에게 전화.
      "한도혁이 전화했어요. 37층을 알고 있어요.
      내일 도전할 가능성이 높아요."
      윤새벽: "그럼 도서윤이 먼저 들어가야 해."
      이준: "내일 아침 8시. 도서윤이 먼저 진입.
      한도혁이 6번째 도전을 시작하면 —
      저는 밖에서 마나 차단으로 방해해야 합니다."
      윤새벽: "한도혁의 S급 마나를 200m에서 8초 차단?
      쉽지 않을 거야."
      이준: "쉽지 않죠. 하지만 해야 합니다."
      세린이 옆에서 듣고 있었다.
      세린: "밖에서 전송하는 동안 —
      한도혁이 A급을 보내면?"
      이준: "김태석 길드장님이 막아주실 겁니다.
      세린 씨는 저를 보호해 주세요."
      세린이 고개를 끄덕인다.
      이준이 모두에게 말한다.
      "내일 아침 — 시작됩니다."
      [퀘스트 업데이트 — 37층 경쟁 /
      도서윤 내일 8시 진입 확정 /
      한도혁 6번째 도전 감지 중 /
      시간 제한: 내일 아침]
      [Lv9 진행도: 45% → 48%]
