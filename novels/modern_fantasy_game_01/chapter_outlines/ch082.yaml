chapter_n: 82
overall: |
  도서윤이 심연의 제단 31층 구역에 진입한다.
  이준과 윤새벽이 심연 외부에서 대기하며 마나 전송 준비.
  김태석과 세린이 외부 경호를 담당.
  한도혁도 6번째 도전을 시작 — 동시에 심연에 진입.
  두 경주가 시작된다.

beats:
  - name: dawn_departure
    instruction: |
      새벽 6시. 도서윤이 심연의 제단 관리소 앞에 도착.
      이준, 윤새벽, 김태석, 세린도 함께.
      마지막 브리핑.
      이준: "도서윤 씨. 37층까지 최대한 빨리 가주세요.
      저는 밖에서 한도혁의 접속을 방해하겠습니다."
      도서윤: "3시간. 37층까지 3시간 안에 갈게."
      윤새벽: "도서윤이 37층에 도달하면 —
      우리가 마나를 전송한다. 보유자 주파수 공유.
      내 v1.3, 이준 v2.0, 도서윤 v1.9.
      3명분 마나를 도서윤에게 쏘면 —
      구조물이 4명분으로 인식할 수 있을 거야."
      이준: "4번째는?"
      윤새벽: "사체 마나. 강철민과 박세진의 마나 잔여.
      한도혁이 추출했을 가능성이 높아.
      도서윤이 37층에서 그 마나를 흡수하면 —
      4명분이 완성돼."
      세린: "오빠 마나를... 한도혁이 썼어?"
      윤새벽: "아마. 37층에 가면 알 수 있어."

  - name: seoyun_entry
    instruction: |
      오전 8시. 도서윤이 심연 31층 구역 진입 게이트를 통과.
      S급 구역. 공기가 달랐다. 마나 밀도가 일반 구역의 3배.
      도서윤이 31층 구조물에 진입.
      32층, 33층. S급 몬스터가 배치되어 있었지만
      도서윤은 멈추지 않았다. S급의 전투력으로 돌파.
      34층 도달. 마나 폭풍 구역.
      도서윤이 폭풍을 뚫고 전진.
      한편 — 이준이 심연 외부 500m 지점에서 대기.
      진명 감지 5km 가동.
      한도혁의 S급 마나가 움직이기 시작했다.
      백화 본사에서 심연의 제단 방향으로.
      이준: "한도혁이 움직여요."
      윤새벽: "6번째 도전."
      이준: "도서윤 씨가 37층에 도달하기 전에
      한도혁이 먼저 도달하면 —"
      윤새벽: "그러면 안 돼."

  - name: handohyuk_entry
    instruction: |
      오전 9시. 한도혁이 심연의 제단에 도착.
      S급 등록 후 바로 31층 진입.
      A급 6명이 외부에 배치된 채.
      이준이 진명 감지로 한도혁의 마나를 추적.
      한도혁이 31층에서 빠르게 상승 중이었다.
      S급의 마나. 5번의 경험. 함정 위치를 모두 알고 있다.
      한도혁은 실패를 통해 37층까지의 최적 경로를
      완벽하게 숙지한 상태였다.
      이준: "빨라요. 한도혁이 31층에서 35층까지
      30분 만에 돌파하고 있어요."
      윤새벽: "5번 실패한 보상이야. 경로를 다 알아."
      이준: "도서윤 씨?"
      이준이 도서윤과 연락. 진명 시스템 경로로
      도서윤의 마나 위치를 확인.
      도서윤: "34층이야. 마나 폭풍 통과 중.
      1시간 후 35층 도달 예상."
      이준: "한도혁이 1시간 후 37층에 도달할 수 있어요.
      도서윤 씨를 앞질러."
      윤새벽: "한도혁을 막아야 해."

  - name: first_interference
    instruction: |
      이준이 결단을 내린다.
      마나 차단. 200m 범위, 8초 정지.
      하지만 한도혁은 심연 내부에 있다.
      마나 차단은 외부에서 내부로 영향을 줄 수 있는가?
      이준이 도서윤에게 물었다.
      "도서윤 씨. 심연 내부에서 외부 마나 간섭을
      느낄 수 있나요?"
      도서윤: "구조물이 있어. 37층에.
      외부 마나와 연결되어 있어.
      그 구조물을 매개로 하면 —
      외부에서 내부로 마나 간섭이 가능해."
      이준: "그러면 37층 구조물을 통해
      한도혁의 마나를 차단할 수 있어요."
      윤새벽: "위험해. 구조물에 접속하면
      네 마나가 한도혁에게 노출될 수 있어."
      이준: "상관없어요. 한도혁은 이미 내가 보유자인 걸 알아요."
      이준이 마나 차단 준비.
      37층 구조물의 마나 주파수를 감지.
      도서윤이 37층에 도달하면 —
      구조물을 매개로 한도혁의 접속을 차단한다.
      [퀘스트 업데이트 — 37층 경쟁 /
      도서윤 34층 돌파 중 /
      한도혁 35층 도달 예상 /
      시간 경쟁 시작]
      [Lv9 진행도: 48% → 50%]
