chapter_n: 83
overall: |
  도서윤 35층 돌파. 한도혁이 37층에 도달하기 직전.
  이준이 37층 구조물 마나 주파수를 감지하고 차단 준비.
  백화 A급 3명이 외부에서 이준 측을 공격.
  김태석과 세린이 방어전. 이준이 차단에 집중해야 하는 상황.

beats:
  - name: seoyun_35f
    instruction: |
      도서윤이 35층 돌파. S급 보스 처치.
      36층 진입. 37층까지 1층.
      도서윤: "36층이야. 37층 마나가 느껴져.
      구조물... 여기서부터 마나 밀도가 급상승해."
      이준: "한도혁은?"
      도서윤: "한도혁 마나 반응 없어. 아직 35층 이하인 것 같아.
      하지만 곧 따라올 거야."

  - name: external_attack
    instruction: |
      오후. 심연 외부.
      백화 A급 3명이 이준 측 위치로 접근.
      이준이 진명 감지로 조기 경보.
      김태석: "3명. A급 3명이 온다."
      세린: "새 부하 포함?"
      이준: "아니요. 새 부하는 백화 본사에 있어요.
      이 3명은 일반 A급이에요."
      김태석이 전투 태세.
      A급 탱커 vs A급 3명. 불리하지만 불가능은 아니다.
      세린: "제가 1명 끌고 가겠습니다."
      이준: "세린 씨. 전투력 90%만."
      세린: "90%면 충분해요."
      김태석과 세린이 전방으로 이동.
      이준과 윤새벽은 뒤에서 마나 전송 준비 유지.

  - name: handohyuk_approaching
    instruction: |
      전투 중 이준이 진명 감지를 유지.
      한도혁이 36층 도달. 37층까지 1층.
      이준: "한도혁이 36층이에요!"
      윤새벽: "빨라. 도서윤보다 빨라."
      이준이 도서윤에게 연락.
      "도서윤 씨. 한도혁이 36층이에요.
      한도혁이 먼저 37층에 도달합니다."
      도서윤: "알겠어. 나도 36층이야.
      37층 구조물 마나가 느껴져.
      한도혁보다 먼저 —"
      이준이 결단.
      마나 차단을 먼저 발동한다.
      37층 구조물의 마나 주파수를 타겟으로.
      [마나 차단 — 구조물 매개 발동]
      200m 범위가 아닌 — 구조물을 통한 원격 차단.
      이준의 마나가 37층 구조물에 도달.
      구조물이 반응한다.
      한도혁의 마나 흐름이 — 멈췄다.
      8초간.
      [Lv9 진행도: 50% → 53%]
