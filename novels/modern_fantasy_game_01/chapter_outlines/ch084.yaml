chapter_n: 84
overall: |
  한도혁이 8초 차단 후 37층에 도달하지만
  이준의 마나 차단으로 접속 지연.
  도서윤도 37층 도달. 두 보유자가 동시에 구조물 앞에 섬.
  이준과 윤새벽이 원격 마나 전송 개시.
  구조물이 활성화되기 시작한다.

beats:
  - name: handohyuk_37f
    instruction: |
      마나 차단 8초 종료. 한도혁이 다시 마나를 회복.
      하지만 8초 지연으로 한도혁의 경로가 어긋났다.
      한도혁이 37층에 도달.
      구조물 발견. 거대한 마나 결정체.
      한도혁이 접속을 시도하지만 —
      구조물이 "보유자 마나 4종 필요"를 요구.
      한도혁은 보유자가 아니다.
      한도혁이 이를 알고 있었다. 5번 실패의 이유.
      하지만 이번에는 — 강철민과 박세진의 추출 마나를 보유하고 있었다.
      한도혁이 추출 마나를 구조물에 주입.
      구조물이 반응. 2종 확인. 2종 부족.

  - name: seoyun_37f
    instruction: |
      도서윤이 37층 도달.
      거대한 구조물 앞에서 한도혁과 마주친다.
      한도혁: "왔나."
      도서윤: "네가 먼저 올 줄 몰랐어."
      한도혁: "5번 와봤으니까."
      도서윤이 구조물을 분석.
      이미 한도혁이 2종 마나를 주입한 상태.
      도서윤: "아버지와 오빠 마나를... 가져왔구나."
      한도혁: "쓸모 있게 쓰는 거야.
      죽은 자의 마나도 — 시스템 안에서는 살아 있어."
      도서윤이 이준에게 연락.
      "한도혁이 37층이야. 이미 사체 마나 2종을 주입했어.
      구조물이 2종을 인식한 상태야.
      우리 마나를 보내줘. 3종을 보내면 —
      한도혁의 2종과 겹치지 않는 마나를
      구조물이 새로 인식할 거야."

  - name: remote_transmission
    instruction: |
      이준이 윤새벽에게 신호.
      "전송 시작합니다."
      이준과 윤새벽이 동시에 마나를 방출.
      보유자 주파수 공유.
      이준의 v2.0 마나와 윤새벽의 v1.3 마나가
      진명 시스템 경로를 통해 37층 구조물로 전송.
      도서윤이 마나를 수신.
      도서윤의 v1.9 마나와 합쳐져
      3명분의 마나가 구조물에 도달.
      구조물이 반응.
      5종. 한도혁의 2종 + 이준/새벽/도서윤 3종.
      하지만 구조물은 4종만 인식했다.
      중복이 있었다.
      이준: "중복... 한도혁이 주입한 마나 중
      하나가 우리 마나와 겹쳐요."
      도서윤: "강철민 v1.0 마나가 —
      이준의 v2.0과 주파수가 유사해.
      부자니까."
      구조물이 대기 상태. 4종 필요. 5종 감지. 1종 중복.
      이준이 생각한다.
      "중복을 해결해야 합니다.
      한도혁의 마나를 구조물에서 밀어내야 해요."
      [Lv9 진행도: 53% → 56%]
