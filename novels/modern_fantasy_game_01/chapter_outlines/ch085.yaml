chapter_n: 85
overall: |
  구조물 활성화 경쟁. 이준이 마나 차단으로
  한도혁의 사체 마나를 구조물에서 분리.
  도서윤이 구조물에 4종 보유자 마나를 주입.
  구조물이 활성화되기 시작한다.
  한도혁이 분노하며 직접 도서윤을 공격.

beats:
  - name: mana_separation
    instruction: |
      이준이 마나 차단을 구조물에 적용.
      구조물에 주입된 한도혁의 사체 마나를
      차단으로 분리 시도.
      마나 차단은 보유자 마나 흐름을 8초간 정지.
      구조물 내부의 한도혁 마나 흐름이 멈춘다.
      도서윤이 그 틈을 이용해
      이준의 v2.0 마나를 구조물에 주입.
      강철민 v1.0의 자리를 이준 v2.0이 대체.
      구조물이 재인식.
      4종: 이준 v2.0, 윤새벽 v1.3, 도서윤 v1.9, 박세진 v1.7.
      완벽한 4종.

  - name: activation
    instruction: |
      구조물이 활성화되기 시작한다.
      거대한 마나 결정체가 빛나기 시작.
      진명 시스템 메시지.
      [37층 구조물 활성화 시작]
      [보유자 마나 4종 인식 완료]
      [관리자 권한 인증 대기 중]
      [인증 요건: 보유자 v2.0의 직접 접속]
      이준이 놀란다.
      "직접 접속...?"
      도서윤: "v2.0. 네가 직접 와야 해."
      하지만 이준은 심연 밖에 있다.
      도서윤이 말한다.
      "기다려. 구조물이 '직접 접속'을 요구하지만 —
      이건 물리적 접속이 아니야.
      마나 접속이야.
      네 마나를 구조물에 완전히 연결하면 돼."
      이준이 마나를 구조물에 집중.
      진명 시스템 경로를 통해 37층 구조물과 연결.
      이준의 의식이 구조물 내부로 확장.

  - name: handohyuk_attack
    instruction: |
      한도혁이 분노.
      도서윤이 구조물을 선점하는 것을 막으려
      직접 공격.
      S급 마나 방출.
      도서윤이 방어. S급 vs S급.
      하지만 도서윤은 구조물 활성화에 집중해야 했다.
      공격과 활성화를 동시에.
      도서윤: "이준! 시간이 없어!
      한도혁이 구조물을 파괴하려고 해!"
      이준이 마나 차단을 한도혁에게 직접 적용.
      37층 구조물 매개.
      한도혁의 마나가 다시 멈췄다. 8초.
      도서윤이 그 8초 동안 활성화를 완료.
      [관리자 권한 인증 완료]
      [새 관리자: 강이준]
      [Lv9 달성]
      [진화 시작...]
