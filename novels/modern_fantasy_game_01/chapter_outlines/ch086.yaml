chapter_n: 86
overall: |
  이준이 관리자 권한을 획득. Lv9 달성.
  시스템이 변화하기 시작한다.
  한도혁 6번째 도전 실패. 분노.
  이준이 관리자 권한으로 시스템 정보에 접근.
  시스템 설계자의 존재를 감지.

beats:
  - name: admin_access
    instruction: |
      관리자 권한 획득 직후.
      이준의 진명 시스템이 변화한다.
      새 정보가 해금된다.
      [관리자 권한 레벨 1]
      [시스템 전체 현황 열람 가능]
      [보유자 시스템 제어 가능]
      [마나 장치 원격 비활성화 가능]
      이준이 첫 번째로 한 일 —
      한도혁의 이중 회로 마나 장치 원격 확인.
      시스템 내에 한도혁의 장치 정보가 기록되어 있었다.
      이준: "한도혁의 장치... 시스템에 등록되어 있어요."
      윤새벽: "시스템 설계자가 설치한 거니까."
      이준이 장치 비활성화를 시도.
      [비활성화 권한 부족]
      [레벨 2 필요]
      이준: "레벨 2가 필요해요."

  - name: lv9_evolution
    instruction: |
      [Lv9 달성]
      이준의 마나가 급상승.
      마나량: 12400 → 18000.
      마나 밀도: 2.8 → 3.5.
      진화 보상:
      - 진명 감지: 5km → 10km
      - 마나 차단: 200m/8초 → 500m/12초
      - 마나 해독: 시스템 장치 원격 분석 가능
      - 새 능력 [관리자 접속]: 시스템 구조물에 원격 접속
      이준이 진화 직후 시스템을 확인.
      [관리자 권한 레벨 2 해금]
      [마나 장치 원격 비활성화 가능]
      이준이 한도혁의 장치 비활성화를 실행.
      [한도혁 이중 회로 — 비활성화 완료]
      심연 내부에서 한도혁이 마나 급감을 느낀다.
      S급에서 A급 하위로 추락.
      한도혁: "...뭐야?"

  - name: designer_detection
    instruction: |
      관리자 권한으로 시스템 심층 접근.
      이준이 시스템 내부 구조를 확인.
      시스템은 — 인공물이었다.
      누군가가 설계했다.
      [시스템 설계자 기록 발견]
      [설계자 ID: ???]
      [최근 접속: 7년 전]
      [접속 위치: ???]
      이준: "7년 전... 한도혁이 시스템 설계자와
      접촉한 시점이야."
      윤새벽: "설계자가 누군지 알 수 있어?"
      이준이 더 깊이 파고들려 하지만 —
      시스템이 차단한다.
      [접근 권한 부족]
      [레벨 3 필요]
      [레벨 3 해금 조건: ???
      이준이 시스템의 주인이 누군지 궁금해졌다.
      [Lv9 진행도: 0%]
      [퀘스트 업데이트 — 시스템의 설계자 /
      관리자 권한 레벨 3 획득 필요 /
      설계자 정체 추적]
