chapter_n: 87
overall: |
  한도혁이 심연에서 퇴장. 장치 비활성화로 전투력 상실.
  하지만 한도혁은 물리적으로 여전히 S급 경험치의 소유자.
  한도혁이 전면전을 선언. 모든 백화 전력 동원.
  이준이 백화 본부로 직접 가기로 결정.
  최후의 대결이 다가온다.

beats:
  - name: handohyuk_retreat
    instruction: |
      한도혁이 심연에서 퇴장.
      장치 비활성화로 마나 급감.
      S급에서 A급 하위로 추락.
      하지만 한도혁은 여전히 A급 하위의 전투력.
      5번의 37층 도전 경험. S급 시절의 전투 기술.
      장치가 없어도 한도혁은 위험했다.
      한도혁이 심연 외부로 나온다.
      이준 앞에 섰다.
      두 사람이 마주 본다.
      한도혁: "관리자 권한을... 네가 가져갔나."
      이준: "네."
      한도혁: "그러면 — 끝이다."
      이준: "끝내겠습니다."
      한도혁이 웃었다.
      한도혁: "아니. 아직 아니야.
      장치를 빼앗았다고 내가 끝나는 줄 알아?
      나는 — 7년 전부터 준비해 왔어.
      너보다 먼저."

  - name: all_out_war
    instruction: |
      한도혁이 전화를 건다.
      "전원 동원."
      백화 산하 전 길드에 전면전 명령.
      A급 6명 + B급 수십 명이 서울 전역에서 이동.
      김태석: "미쳤어. 전원 동원이라니."
      세린: "한도혁이 장치를 잃었어.
      남은 건 물리적 전력뿐이야."
      이준: "물리적 전력으로 백화를 끝내겠습니다."
      이준이 모두에게 말한다.
      "오늘 밤 — 백화 본부로 갑니다."
      윤새벽: "백화 본부? 45층?
      한도혁 본거기?"
      이준: "맞아요. 한도혁을 끝내려면 —
      본거로 가야 합니다."
      김태석: "협회는?"
      이준: "박경호 과장에게 연락하겠습니다.
      관리자 권한으로 한도혁의 마나 장치 비활성화 증거를
      협회에 제출하겠습니다."
      세린: "이준 씨. 한도혁은 장치가 없어도
      A급 하위 전투력이 있어요."
      이준: "알아요. 하지만 이제 — 저는 Lv9예요."
      모두가 침묵했다.

  - name: final_preparation
    instruction: |
      이준이 박경호에게 연락.
      "박경호 과장님. 이준입니다.
      한도혁의 마나 장치를 비활성화했습니다.
      관리자 권한으로 시스템 내 증거를 확보했습니다."
      박경호: "...관리자 권한?"
      이준: "설명이 길어요. 나중에.
      지금 필요한 건 — 협회의 지원이에요.
      한도혁이 전면전을 선언했습니다.
      오늘 밤 백화 본부에서 끝냅니다."
      박경호: "...기다려. 이사회를 소집하겠다."
      이준이 윤새벽에게.
      "윤새벽 형님. 도서윤 씨는?"
      윤새벽: "37층에서 나오고 있어.
      마나가 많이 소모됐지만 — 괜찮을 거야."
      이준이 결의를 다진다.
      [퀘스트 업데이트 — 한도혁의 종말 /
      백화 본부 최종 대결 /
      동맹: 보유자 연합 + 철혈 + 협회 /
      난이도: 최상]
      [Lv9 진행도: 0% → 5%]
