chapter_n: 88
overall: |
  백화 본부 최종 대결. 이준 vs 한도혁.
  보유자 연합 + 철혈 + 협회 지원군 vs 백화 전력.
  한도혁이 장치 없이도 보여주는 S급 경험의 전투력.
  이준이 Lv9의 힘으로 맞서며
  관리자 권한으로 한도혁의 마나 회로를 분석.

beats:
  - name: assault_on_baekhwa
    instruction: |
      밤. 백화 본부.
      이준, 윤새벽, 도서윤, 세린, 김태석.
      5명이 백화 본부 앞에 섰다.
      협회 지원군 — 박경호 과장이 이끄는
      협회 정식 요원 10명이 후방에 대기.
      백화 본부 1층 로비.
      A급 6명 + B급 20명이 배치되어 있었다.
      새 A급 부하도 있었다. 이식 회로 균열 상태.
      하지만 여전히 A급의 전투력.
      김태석이 앞으로 나섰다.
      김태석: "나는 철혈 길드장 김태석.
      한도혁. 나올 시간이다."
      한도혁의 목소리가 스피커에서 흘러나왔다.
      한도혁: "올라와."

  - name: floor_by_floor
    instruction: |
      1층부터 상승.
      B급 20명이 1~10층 배치.
      세린과 김태석이 선봉.
      세린: B급 암살자의 속도. 3초에 1명씩 제압.
      김태석: A급 탱커. 정면 돌파.
      도서윤: S급 마나. B급에게는 과잉 전투력.
      10층 도달. A급 3명 배치.
      윤새벽이 암살자 특기로 1명을 제압.
      김태석이 1명과 정면 대결.
      도서윤이 1명을 S급 마나로 압도.
      20층. A급 2명 + 새 A급 부하.
      새 A급 부하의 이식 회로가 불안정.
      전투 중 회로 재균열. 마나 폭주.
      도서윤이 폭주를 간신히 막아냄.
      30층. 마지막 A급 1명.
      윤새벽과 세린이 협력해 제압.
      40층. 한도혁의 공간.

  - name: confrontation
    instruction: |
      45층. 한도혁의 집무실.
      이준이 문을 열었다.
      한도혁이 창가에 서 있었다.
      검은 코트. 장치 비활성화 후에도 —
      한도혁의 눈빛은 여전히 S급이었다.
      한도혁: "왔구나. 관리자님."
      이준: "끝내겠습니다."
      한도혁: "장치를 빼앗았다고 끝이라고 생각해?
      나는 장치 없이도 — 널 죽일 수 있어."
      한도혁이 마나를 방출.
      장치 없는 A급 하위 마나.
      하지만 전투 기술은 S급.
      이준이 마나 차단 500m/12초 발동.
      한도혁의 마나가 멈췄다. 12초.
      이준이 그 틈으로 접근.
      Lv9의 전투력.
      마나 밀도 3.5. 한도혁보다 높다.
      하지만 한도혁은 7년간 S급으로 싸워왔다.
      경험의 차이.
      [Lv9 진행도: 5% → 10%]
