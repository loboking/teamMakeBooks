chapter_n: 89
overall: |
  이준 vs 한도혁 최종 결전.
  이준이 Lv9의 힘과 마나 차단으로 한도혁을 압박.
  한도혁이 패배하면서 시스템 설계자(감독자)의 정체를 폭로.
  "감독자가 널 지켜보고 있다."
  이준이 시스템의 진짜 적을 알게 된다.

beats:
  - name: final_battle
    instruction: |
      45층 집무실. 이준 vs 한도혁.
      마나 차단 500m/12초를 교차 사용.
      한도혁은 S급의 전투 기술로 버텼지만 —
      마나량의 차이를 극복하지 못했다.
      A급 하위 마나 vs Lv9 마나 밀도 3.5.
      한도혁이 이준의 마나 차단 사이를 파고들어
      근접 공격. 이준 왼팔 부상.
      하지만 이준이 마나 해독으로
      한도혁의 전투 패턴을 분석.
      한도혁의 약점 — 왼쪽 무릎.
      5번의 37층 도전에서 누적된 부상.
      이준이 약점을 공격.
      한도혁이 무릎을 꿇었다.
      한도혁: "...네가 이기는구나."

  - name: designer_reveal
    instruction: |
      이준이 한도혁에게 묻는다.
      "시스템 설계자가 누구예요?"
      한도혁이 피를 흘리며 웃었다.
      한도혁: "시스템 설계자?
      그건 — 감독자라고 불러.
      인류의 등급을 매긴 자.
      게이트를 열어준 자.
      그리고 — 네 아버지를 죽인 자."
      이준이 멈췄다.
      이준: "아버지를...?"
      한도혁: "강철민. v1.0 보유자.
      7년 전 — 감독자가 직접 왔다.
      보유자가 너무 강해지면 시스템에 위협이 된다고.
      제거 지시를 받았어.
      나는 — 그 지시를 실행했을 뿐이야."
      이준: "감독자가... 지시했어요?"
      한도혁: "그래. 감독자.
      시스템 위의 존재.
      보유자를 관리하는 자.
      그리고 — 지금 널 지켜보고 있는 자."
      한도혁이 마지막으로 말했다.
      "네가 관리자 권한을 얻었다고 해서
      끝이 아냐. 이제부터 시작이야.
      감독자는 — 시스템 그 자체야.
      네가 시스템을 통제한다고 해도
      감독자는 시스템 밖에서 널 지켜보고 있어."
      이준이 한도혁을 체포한다.
      협회 요원들이 한도혁을 연행.
      이준이 45층 창밖을 본다.
      서울의 야경.
      그 너머에 — 무언가가 있다.
      감독자.

  - name: aftermath
    instruction: |
      백화 본부 해체.
      한도혁 체포. A급 부하들 협회 인계.
      백화 산하 길드 해산 명령.
      이준이 45층에서 내려온다.
      세린, 김태석, 윤새벽, 도서윤이 기다리고 있었다.
      세린: "끝났어요?"
      이준: "아니요. 한도혁은 끝났어요.
      하지만 — 한도혁 뒤에 다른 게 있었어요."
      윤새벽: "시스템 설계자."
      이준: "감독자. 시스템 위의 존재.
      아버지를 죽인 건 한도혁이었지만
      지시한 건 감독자였어요."
      모두가 침묵했다.
      도서윤이 말했다.
      "감독자가 시스템 그 자체라면 —
      관리자 권한으로 찾을 수 있어."
      이준: "레벨 3이 필요해요.
      해금 조건이 아직 열리지 않았어."
      윤새벽: "그러면 — 해금 조건을 찾아야 해."
      [퀘스트 업데이트 — 감독자 /
      시스템 설계자 정체: 감독자 /
      강철민 살해 지시자: 감독자 /
      관리자 권한 레벨 3 해금 필요 /
      해금 조건: 미확인]
      [Lv9 진행도: 10% → 15%]
