chapter_n: 90
overall: |
  3막 종결. 한도혁 체포 후 여파 정리.
  이준이 관리자 권한으로 시스템 심층 접근 시도.
  레벨 3 해금 조건 발견 — "4명 보유자의 동시 진명 해금".
  도서윤이 시스템 노트에서 감독자의 위치 단서를 발견.
  4막으로의 연결점.

beats:
  - name: aftermath_week
    instruction: |
      한도혁 체포 후 3일.
      대한민국 헌터계가 들끓었다.
      S급 한도혁 체포. 백화 해체.
      협회 이사회 긴급 소집.
      이정호 이사 — 한도혁 파벌 핵심.
      체포. 이정호 이하 파벌 4명 전원 구속.
      협회 중립파 3명 + 반대파 2명이
      협회 개편 주도.
      박경호가 심사과장에서
      협회 사무총장 대행으로 승진.
      이준이 관리자 권한 증거를 협회에 제출.
      한도혁 마나 장치 비활성화 기록.
      시스템 내 한도혁 장치 설치 이력.
      7년 전 시스템 설계자 접속 기록.
      협회가 공식 조사 착수.

  - name: level3_condition
    instruction: |
      이준이 진명 시스템 심층 접근.
      관리자 권한 레벨 2에서 레벨 3 해금 조건 확인.
      [레벨 3 해금 조건]
      [4명 활성 보유자의 동시 진명 해금]
      [현재 활성 보유자: 3명]
      [부족: 1명]
      이준: "4명... 활성 보유자가 4명이어야 해요."
      윤새벽: "현재 3명이야. 너, 나, 도서윤."
      이준: "4번째는 —"
      도서윤이 말했다.
      "새 보유자를 찾아야 해.
      아니면..."
      도서윤이 시스템 노트를 연다.
      도서윤의 v1.9에 저장된 정보.
      5년 전 보유자 모임 기록.
      도서윤: "5년 전 — 4명의 보유자가 모였어.
      강철민, 박세진, 나, 그리고 — 한 명 더."
      이준: "한 명 더?"
      도서윤: "그 사람은 모임 직후 사라졌어.
      연락 두절. 찾을 수 없었어."
      윤새벽: "죽었을 수도 있어."
      도서윤: "아니. 시스템에 v1.x 보유자로 등록되어 있어.
      사망 처리가 안 됐어.
      어딘가에 숨어 있어."

  - name: designer_location
    instruction: |
      도서윤이 시스템 노트에서 추가 단서를 발견.
      "감독자의 위치 —
      시스템 설계자는 시스템 내부에 접속하지 않아.
      시스템 외부에서 시스템을 조작해."
      이준: "시스템 외부?"
      도서윤: "게이트. 게이트 깊은 곳.
      모든 게이트가 연결되어 있는 곳.
      감독자는 — 게이트 너머에 있어."
      윤새벽: "게이트 너머... 아무도 가본 적 없는 곳."
      이준: "가야 합니다."
      모두가 이준을 본다.
      이준이 말한다.
      "감독자를 찾아야 합니다.
      아버지의 진짜 죽음.
      시스템의 진짜 목적.
      모든 것의 답이 — 게이트 너머에 있어요."
      세린: "나도 가요."
      윤새벽: "당연하지."
      도서윤: "나도."
      김태석: "철혈도 지원한다."
      이준이 4명째 보유자를 떠올린다.
      5년 전 모임에서 사라진 보유자.
      그리고 — 게이트 너머의 감독자.
      [퀘스트 업데이트 — 감독자 /
      목표: 4번째 보유자 발견 /
      게이트 너머 진입 준비 /
      관리자 권한 레벨 3 획득 /
      감독자 대면]
      [Lv9 진행도: 15% → 20%]

      3막 종결.
      한도혁 체포. 백화 해체.
      새로운 적: 감독자.
      남은 과제: 4번째 보유자 발견.
      게이트 너머 진입.
      시스템의 진짜 목적.
      4막 — 시스템 정복.
