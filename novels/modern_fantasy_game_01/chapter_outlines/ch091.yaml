chapter_n: 91
overall: |
  4막 개막. 이준이 v1.1 보유자를 찾기 위해
  관리자 권한으로 새로운 접근 방법 시도.
  진명 시스템 접속 차단을 우회하는 방법을 모색.
  도서윤이 5년 전 모임 단서에서 v1.1의 마지막 위치를 추적.
  v1.1의 이름 — "이하늘"이 아닌 전혀 다른 인물.
  새 캐릭터 발견.

beats:
  - name: search_for_v11
    instruction: |
      이준이 관리자 권한으로 v1.1을 찾는 방법을 모색.
      진명 시스템 접속 차단 = 감지 불가.
      하지만 진명 시스템이 아닌 다른 방법이 있을 수 있다.
      이준이 마나 해독으로 전국 마나 감지망 분석.
      B급 이상 마나 반응 중 비정상 패턴 찾기.
      v1.1은 시스템 접속을 차단했지만
      일반 마나 사용은 가능할 것이다.
      도서윤이 5년 전 모임 기록에서 단서를 발견.
      "모임 장소 — 부산 해운대.
      v1.1은 부산에서 왔어."

  - name: busan_lead
    instruction: |
      이준과 세린이 부산으로 이동.
      김태석·윤새벽·도서윤은 서울 대기.
      부산 해운대 인근에서 B급 이상 비정상 마나 패턴 스캔.
      3일간 탐색.
      부산 항구 근처 작은 마나 장치 공장에서
      비정상 마나 잔여 발견.
      v1.1의 마나 흔적.
      마지막으로 감지된 시점: 3년 전.
      그 이후 흔적 없음.
      하지만 장치 공장 관리인이 기억하고 있었다.
      "3년 전에 여자가 왔어. 마나 장치 수리를 부탁했어.
      이상한 장치였어. 시스템에서 온 것 같은데
      시스템과 연결이 안 됐어."

  - name: v11_first_contact
    instruction: |
      이준이 장치 공장에서 v1.1의 흔적을 추적.
      3년 전 마지막 방문 이후 —
      v1.1은 부산을 떠났다.
      하지만 장치 공장 관리인이
      v1.1이 남긴 연락처를 기억.
      "여자가 이상한 주파수를 쓰 때마다
      라디오가 고장 나곤 했어.
      주파수 — 1.1MHz."
      이준이 1.1MHz 주파수를 감지 범위에 추가.
      마나 해독으로 1.1MHz 파동 전국 스캔.
      반응 — 없음.
      하지만 한 곳에서 미세한 반응.
      제주도.
      1.1MHz의 희미한 잔여.
      v1.1은 제주도에 있었다.
      [퀘스트 업데이트 — v1.1 추적 /
      위치: 제주도 (미세 흔적) /
      주파수: 1.1MHz /
      진행도: 10%]
      [Lv9 진행도: 25% → 28%]
