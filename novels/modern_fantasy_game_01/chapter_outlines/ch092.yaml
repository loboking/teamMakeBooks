chapter_n: 92
overall: |
  제주도에서 v1.1 보유자를 직접 만난다.
  v1.1의 이름: 최서연. 34세. 5년간 은폐한 이유.
  감독자의 정체에 대한 핵심 단서.
  최서연이 4명 동시 진명 해금에 동의.

beats:
  - name: jeju_arrival
    instruction: |
      이준과 세린이 제주도에 도착.
      제주 게이트는 섬 중앙 화산 구역에 있었다.
      대한민국 최대 게이트. 직경 500m.
      이준이 1.1MHz 주파수로 스캔.
      게이트에서 2km 떨어진 작은 마을에서 미세 반응.
      서귀포 근처. 조용한 해안 마을.
  - name: v11_meeting
    instruction: |
      이준이 마을에 도착.
      1.1MHz 반응이 마을 외곽 작은 집에서 감지됐다.
      이준이 집 앞에 섰다.
      문이 열렸다.
      여자가 나왔다. 30대 초반. 키 작음. 검은 머리카락.
      눈빛이 날카로웠다.
      여자: "...관리자가 왔나."
      이준: "v1.1. 최서연 씨?"
      여자: "...5년 만에 처음 들은 내 이름이야."
      최서연. v1.1 보유자. 5년간 제주도에서 은폐.
  - name: truth_about_supervisor
    instruction: |
      최서연이 이준을 집 안으로 들였다.
      최서연: "5년 전 — 감독자가 나를 찾아왔어.
      강철민이 죽은 지 2달 뒤.
      감독자가 직접. 게이트를 통해.
      '보유자가 너무 강해지면 시스템에 위협이 된다.
      네 버전은 v1.1. 아직 약하지만 — 성장하면 위험하다.'
      감독자가 제거를 시도했지만 —
      나는 도망쳤다. 시스템 접속을 끊고.
      5년간 이곳에서 게이트를 감시했어.
      감독자가 게이트 너머에서 활동하는 걸 —
      마나 파동으로 간접 감지했어."
      이준: "감독자가 게이트 너머에서?"
      최서연: "게이트는 — 문이야.
      51층 이상에 가는 문.
      감독자는 그 문 너머에 있어.
      시스템을 만든 자.
      그리고 — 시스템을 통제하는 자."
      이준: "레벨 3을 얻으려면 v1.1씨의 동의가 필요합니다.
      동시 진명 해금."
      최서연이 잠시 침묵했다.
      최서연: "...동의할게.
      5년간 숨은 보복이야."
