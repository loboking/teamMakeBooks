chapter_n: 93
overall: |
  4명 보유자가 제주도 게이트에서 동시 진명 해금.
  레벨 3 획득.
  시스템 심층 접근.
  감독자의 정체가 구체화.
  51층 이상 진입 준비.

beats:
  - name: simultaneous_unlock
    instruction: |
      이준, 윤새벽, 도서윤, 최서연.
      4명이 제주 게이트 앞에 섰다.
      윤새벽과 도서윤이 서울에서 도착.
      이준이 진명 시스템 접속.
      4명의 마나 주파수가 동시에 시스템에 연결.
      최서연이 5년 만에 시스템에 접속.
      [동시 진명 해금 시작]
      [v2.0 강이준 — 접속 완료]
      [v1.3 윤새벽 — 접속 완료]
      [v1.9 도서윤 — 접속 완료]
      [v1.1 최서연 — 접속 완료]
      [4/4 완료]
      [레벨 3 해금]
  - name: level3_revelation
    instruction: |
      레벨 3 해금 직후.
      시스템 심층 정보가 폭발하듯 열렸다.
      [시스템 기원: 외부 존재 '감독자'에 의해 설계]
      [감독자 목적: 인류 마나 자원 추출]
      [시스템 기능: 인류 마나 → 에너지 변환 → 외부 전송]
      [게이트 본질: 에너지 수집 장치]
      [등급 시스템 본질: 인류 마나 통제 도구]
      이준이 충격을 받았다.
      게이트 = 마나 수집 장치.
      등급 = 마나 통제 수단.
      헌터 = 마나 채굴 도구.
      전부 — 감독자의 설계.
      윤새벽: "인류가... 도구였어?"
      도서윤: "시스템의 진짜 목적이...
      우리 마나를 채굴하는 거야."
      최서연: "맞아. 5년 전 감독자가 그 말을 했어.
      '보유자는 시스템의 오류다. 너무 강한 자가
      수확량에 영향을 준다.'"
  - name: gate_51_preparation
    instruction: |
      이준이 레벨 3으로 게이트 구조에 접근.
      [51층 이상 구조 해금]
      [진입 조건: 관리자 + 4명 보유자 동시 접속]
      [경고: 감독자 활성 감지 가능]
      이준: "51층 이상에 가면 감독자가 알 수 있어요."
      도서윤: "알아도 돼야 해요. 감독자를 찾아야 해."
      이준: "내일 — 51층에 들어갑니다."
      [Lv9 진행도: 28% → 35%]
