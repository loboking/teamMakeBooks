chapter_n: 94
overall: |
  4명 보유자가 51층 이상에 진입.
  미지의 구역. 게이트의 진짜 모습.
  감독자의 흔적을 발견.
  60층에서 감독자의 메시지를 수신.

beats:
  - name: beyond_50f
    instruction: |
      제주 게이트. 51층 구역 진입.
      이준, 윤새벽, 도서윤, 최서연.
      4명 동시 접속 상태.
      51층은 — 50층까지와 완전히 달랐다.
      마나가 고체가 아닌 기체였다.
      벽, 바닥, 천장 — 전부 마나로 구성.
      걸을 수 있었다. 하지만 중력이 달랐다.
      도서윤: "마나 중력. 50층 이상은 물리 법칙이 다른 거야."
      이준이 관리자 권한으로 구조를 분석.
      [51~55층: 마나 정제 구역]
      [56~60층: 에너지 집중 구역]
      [61~70층: 감독자 접속 구역]
      이준: "61층부터 감독자 구역이에요."
  - name: supervisor_trace
    instruction: |
      55층 도달. 마나 정제 구역 통과.
      56층. 에너지 집중 구역. 마나 밀도가 비정상적으로 높았다.
      이준이 진명 감지로 앞을 탐색.
      감독자의 마나 흔적이 보였다.
      시스템의 마나와 다른 — 외부 마나.
      60층. 마지막 흔적.
      그리고 — 메시지.
      [경고: 관리자 접속 감지]
      [관리자: 강이준]
      [감독자: 너의 아버지도 이곳까지 왔다]
      [그리고 — 돌아갔다]
      이준이 멈췄다.
      이준: "아버지가... 51층 이상에 왔었어?"
      최서연: "강철민은 v1.0이야. 50층까지는 갈 수 있었어.
      하지만 — 돌아갔다는 건..."
      이준: "60층에서 돌아갔 거예요."
      도서윤: "감독자가 보내진 거야.
      강철민이 너무 가까이 왔다고."
  - name: decision
    instruction: |
      61층으로 가기로 결정.
      이준: "61층으로 갑니다."
      윤새벽: "감독자가 알면 —"
      이준: "알아도 돼야 합니다."
      4명이 61층으로 향했다.
      [Lv9 진행도: 35% → 42%]
