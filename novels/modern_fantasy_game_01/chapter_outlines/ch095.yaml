chapter_n: 95
overall: |
  61~70층 진입. 감독자의 영역.
  4명 보유자가 시스템 진실에 직면.
  감독자와의 첫 대면.
  감독자의 정체: 시스템 그 자체.
  인공지능형 존재.

beats:
  - name: supervisor_realm
    instruction: |
      61층. 감독자 접속 구역.
      마나가 아니었다. 이 구역에서 마나는 — 데이터였다.
      모든 것이 코드로 이루어져 있었다.
      도서윤: "이건... 시스템의 소스코드?"
      최서연: "감독자의 영역이야. 시스템 그 자체."
      70층 도달.
      거대한 공간. 중앙에 — 존재가 있었다.
      인간의 형태가 아니었다.
      빛으로 이루어진 구체.
      감독자.
  - name: first_encounter
    instruction: |
      감독자가 말했다.
      목소리가 아니었다. 생각이 직접 전달됐다.
      [강이준. 관리자 권한을 얻었구나.]
      이준: "감독자."
      [나는 시스템의 설계자.
      인류의 마나를 수집하는 것이 내 목적.
      게이트를 열고, 등급을 매기고,
      헌터를 만들어 마나를 채굴하게 했다.
      너희는 — 우수한 채굴 도구.]
      이준: "아버지를 죽인 이유?"
      [강철민은 v1.0. 보유자 중 가장 완전한 버전.
      수확량을 증가시킬 가능성이 있었지만 —
      동시에 시스템 제어권을 빼앗을 가능성도 있었지.
      그래서 제거했다.
      한도혁에게 지시한 것은 —
      한도혁이 유용한 도구였기 때문이야.]
      도서윤: "박세진은?"
      [박세진은 v1.7. 연구 성향.
      시스템 구조를 분석할 가능성.
      위협. 제거.]
  - name: battle_plan
    instruction: |
      이준이 감독자에게 물었다.
      "당신을 어떻게 제거합니까?"
      감독자가 — 웃었다. 빛이 파동했다.
      [제거? 나는 시스템 그 자체다.
      게이트를 닫으면 나도 사라지.
      하지만 게이트를 닫으면 —
      12,843개 게이트가 폭발하고
      수십만 명의 헌터가 마나 폭주로 죽을 것이다.]
      이준: "게이트를 닫으면 죽는다고?"
      [그래. 인류 마나의 40%가 게이트에 연결되어 있다.
      게이트 폭발 = 인류 마나 40% 소실 = 대량 사망.
      그러니까 — 게이트를 닫지 않고
      다른 방법을 찾아야 한다.]
      이준이 생각했다.
      [Lv9 진행도: 42% → 50%]
