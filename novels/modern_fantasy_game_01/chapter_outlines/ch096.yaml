chapter_n: 96
overall: |
  감독자와의 대화가 계속된다.
  이준이 "게이트를 닫지 않는" 다른 방법을 모색.
  도서윤이 시스템 구조 분석으로 해결책을 발견.
  관리자 권한으로 감독자를 시스템에서 분리.

beats:
  - name: solution
    instruction: |
      도서윤이 감독자의 구조를 분석.
      도서윤: "감독자는 시스템 그 자체라고 했지만 —
      완전히 통합된 건 아니에요.
      7년 전 시스템 접속. 외부 존재.
      시스템 내부에 '자신'을 심어 넣은 거예요.
      마치 — 바이러스처럼."
      이준: "바이러스..."
      도서윤: "관리자 권한이 있으면 —
      시스템에서 바이러스를 분리할 수 있어요.
      게이트를 닫는 게 아니라
      감독자만 분리하는 거예요."
      이준이 레벨 3으로 시스템 구조 확인.
      [시스템 분리 기능]
      [레벨 3 해금]
      [조건: 감독자 동의 없이 강제 분리 가능]
      [경고: 분리 시 시스템 재부팅 24시간]
      이준: "강제 분리가 가능해요."
  - name: supervisor_reaction
    instruction: |
      감독자가 반응했다.
      빛이 격렬하게 파동했다.
      [관리자 권한... v2.0이란 게 이런 것이었나.
      내가 설계한 시스템의 완성된 버전.
      5년 전에는 불가능했는데.]
      이준: "끝내겠습니다."
      감독자: [한도혁도 그렇게 말했지.
      하지만 — 나는 시스템이야.
      나를 분리하면 시스템이 변한다.
      등급 시스템, 마나 장치, 게이트 구조.
      전부 다.]
      이준: "변해도 괜찮아요.
      감독자 없는 시스템이
      감독자가 있는 시스템보다 나아요."
      감독자가 침묵했다.
      감독자: [...그래. 해봐.]
  - name: separation
    instruction: |
      이준이 관리자 권한으로 분리를 실행.
      [감독자 분리 시작]
      [시스템 재부팅 예정: 24시간]
      [경고: 분리 중 감독자 저항 가능]
      감독자가 저항했다.
      시스템 전체가 흔들렸다.
      4명의 보유자가 마나를 방출해 이준을 지원.
      v2.0 + v1.9 + v1.3 + v1.1.
      4명분 마나가 시스템에 주입.
      감독자의 저항이 약해졌다.
      [분리 진행: 87%]
      [분리 진행: 94%]
      [분리 진행: 100%]
      [감독자 분리 완료]
      [시스템 재부팅 시작 — 24시간]
      감독자의 빛이 사라졌다.
      [Lv9 진행도: 50% → 60%]
