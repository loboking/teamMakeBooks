chapter_n: 97
overall: |
  감독자 분리 후 시스템 재부팅.
  24시간 대기.
  이준이 감독자와의 마지막 메시지를 수신.
  시스템 재부팅 완료.
  새로운 시스템: 감독자 없는 시스템.

beats:
  - name: last_message
    instruction: |
      감독자 분리 직후.
      이준이 시스템에서 마지막 메시지를 발견.
      [감독자 마지막 기록]
      [인류의 마나는 가치 있는 자원이다.
      시스템 없이도 인류는 살 수 있다.
      하지만 시스템이 있으면 더 잘 살 수 있다.
      나의 설계에 결함이 있었다는 걸 인정한다.
      보유자를 제거하는 건 — 과도한 통제였다.
      v2.0이 그 통제를 끝냈다.
      잘 가라. 관리자님.]
      이준이 메시지를 읽었다.
      도서윤: "감독자가... 유언을 남겼어."
      윤새벽: "인정했어."
      최서연: "5년 전 그 말을 들었더라면
      숨을 필요가 없었을 텐데."
  - name: reboot_complete
    instruction: |
      24시간 후.
      시스템 재부팅 완료.
      이준이 관리자 권한으로 확인.
      [시스템 재부팅 완료]
      [감독자 분리 확인]
      [등급 시스템: 유지 (감독자 제어 제거)]
      [마나 장치 시스템: 비활성화]
      [게이트 구조: 유지]
      [보유자 시스템: 유지 + 관리자 권한 강화]
      [새 기능: 게이트 개폐 권한 (관리자 전용)]
      이준: "게이트를 열고 닫을 수 있어요."
      도서윤: "감독자가 사라진 시스템.
      새 시스템이에요."
  - name: return
    instruction: |
      4명이 게이트에서 빠져나왔다.
      제주도. 11월 바다.
      이준이 모두에게 말했다.
      "끝났어요."
      세린: "정말?"
      이준: "감독자 분리. 시스템 재부팅.
      게이트 개폐 권한 획득.
      마나 장치 비활성화.
      시스템의 독점을 끝냈어요."
      윤새벽: "보유자 시스템은?"
      이준: "유지해요. 하지만 이제 시스템이
      헌터를 도구로 취급하지 않아요.
      등급은 — 참고 용도로 유지.
      마나 장치로 조작된 등급은 모두 폐기."
      도서윤: "새 시스템이에요.
      감독자가 없는 시스템."
      최서연: "5년 만에 숨을 쉬네."
      [Lv9 진행도: 60% → 70%]
