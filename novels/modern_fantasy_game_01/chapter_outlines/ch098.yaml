chapter_n: 98
overall: |
  서울 귀환. 시스템 재부팅 후의 세계 변화.
  이준이 협회와 함께 새로운 시스템 안정화.
  마나 장치 비활성화로 일부 헌터 영향.
  새로운 질서의 시작.

beats:
  - name: new_order
    instruction: |
      서울. 3일 경과.
      시스템 재부팅 후의 변화.
      마나 장치가 전국에서 비활성화됐다.
      이식 장치를 가진 헌터들이 협회에 자진.
      정재훈의 장치도 비활성화. A급에서 C급 하위 추락.
      이지수의 장치도 비활성화.
      장치 없이 자연 마나만 남은 헌터들.
      일부는 B급 → C급으로 추락. 불폭.
      하지만 시스템이 더 이상 그들을 도구로 취급하지 않았다.
      등급은 참고치.
  - name: association_future
    instruction: |
      이준이 보유자 연합의 미래를 논의.
      최서연: "나는 다시 숨을 쉴 거예요.
      더 이상 숨을 필요 없지만 —
      시스템을 지키는 건 보유자의 역할이니까."
      윤새벽: "나도 마찬가지.
      도서윤: "나도."
      이준: "4명 보유자 연합.
      감독자가 없는 시스템을 지키는 건 —
      우리의 일이에요."
      김태석: "철혈은 계속 갈 거야.
      작은 길드지만 — 올바른 길드."
      세린: "나도."
      이준이 생각했다.
      시스템은 변했다. 감독자가 사라졌다.
      하지만 세계는 여전히 게이트가 있는 세계.
      헌터가 있는 세계.
      마나가 있는 세계.
      완전히 새로운 건 아니었다 —
      감독자 없는 시스템.
      더 나은 시스템.
  - name: iseo
    instruction: |
      이준이 이서에게 전화.
      "이서야. 오빠가 일 끝냈어."
      이서: "뭘?"
      이준: "나중에 설명할게. 지금은 —
      집에 올게."
      어머니 요양 시설에서 이준을 기다리고 있었다.
      의식이 완전히 회복됐다.
      이준: "엄마. 이제 — 괜찮아질 거예요."
      어머니가 이준을 보며 웃었다.
      강철민의 이름을 부르지 않았다.
      그저 — 아들을 보며 웃었다.
      [Lv9 진행도: 70% → 78%]
