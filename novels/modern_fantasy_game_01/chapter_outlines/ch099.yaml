chapter_n: 99
overall: |
  결막에 앞 마지막 정리.
  이준이 진명 시스템의 의미를 되새김.
  박세진의 유언 — "통제가 아닌 해방"의 진짜 의미.
  시스템이 인간에게 준 것과 빼앗은 것.

beats:
  - name: reflection
    instruction: |
      이준이 혼자 시간을 가졌다.
      진명 시스템. v2.0.
      5년 전 F급 짐꾼에서 시작해서
      시스템의 정점에 올랐다.
      관리자 권한. 시스템 통제.
      그리고 — 감독자 분리.
      이준이 생각했다.
      시스템은 무엇이었나.
      감독자의 설계. 인류 마나 수집.
      인류를 도구로 만든 시스템.
      하지만 — 게이트를 통해 마나를 공급한 것도 사실이다.
      게이트가 없었으면 인류는 5년간 마나 없이
      S급 몬스터와 싸우며 멸망했을 것이다.
      시스템은 — 감독자의 설계지만
      결과적으로 인류를 살린 도구이기도 했다.
      이 모순. 빛과 그림자.
  - name: serin_talk
    instruction: |
      세린이 이준을 찾아왔다.
      세린: "생각하고 있었어?"
      이준: "오빠 유언이 생각나서."
      세린: "통제가 아닌 해방."
      이준: "맞아. 진명 시스템은 —
      원래 통제 도구였어요.
      감독자가 설계한 거니까.
      하지만 보유자가 관리자가 되면서 —
      통제에서 해방으로 바뀌 수 있었어요.
      감독자 없는 시스템.
      등급은 참고치.
      장치는 폐기.
      보유자는 시스템의 관리자.
      그리고 — 게이트는 필요할 때만 열고
      필요 없으면 닫을 수 있어요."
      세린: "좋은 시스템이네요."
      이준: "좋은 시스템이 되려면 —
      지키는 사람이 필요해요."
  - name: preparation
    instruction: |
      이준이 모든 동맹에게 마지막 모임을 소집.
      서울. 철혈 길드 사무실.
      이준, 세린, 윤새벽, 도서윤, 최서연.
      김태석.
      이준이 말했다.
      "시스템이 안정화됐어요.
      앞으로 — 보유자 연합이 시스템을 관리합니다.
      게이트 개폐 권한은 제가 보유.
      필요한 경우에만 게이트를 열겠습니다."
      모두가 고개를 끄덕였다.
      이준이 마지막으로 말했다.
      "만년 F급 짐꾼이었죠.
      이제는 — 시스템의 관리자예요."
      [Lv9 진행도: 78% → 85%]
